# Central Chronos Scheduler Configurations
schedules:
  - name: os-pulse
    interval_seconds: 60
    command: "python3 scripts/pulse.py --agent Architect --task 'Heartbeat Monitor' --status active"


  - name: zeus-autonomous-step
    interval_seconds: 3600  # Evaluate chapter stats and auto-publish every hour
    command: "python3 $HOME/zeus-writer/scripts/zeus_autonomous_manager.py --step"

  - name: project-self-pushing
    interval_seconds: 43200  # Evaluate and push stagnant projects every 12 hours
    command: "python3 scripts/chronos.py --self-pushing"

  - name: swarm-board-refresh
    interval_seconds: 60  # Dynmically compile and refresh the flight deck board every minute
    command: "python3 scripts/update_scheduler_board.py"

  - name: white-hat-security-audit
    interval_seconds: 86400  # Scan system, generate report and inject security todo tasks once a day
    command: "python3 $HOME/agentos/scripts/white_hat_hacker.py"


  - name: status-archiver
    interval_seconds: 86400  # Roll over old STATUS.md logs into archive once a day
    command: "python3 scripts/status_archiver.py"

  - name: update-projects-pulse
    interval_seconds: 60  # Update the global projects pulse.json cache every minute
    command: "python3 scripts/update_projects_pulse.py"

  - name: ecosystem-report
    interval_seconds: 86400  # Generate and send daily ecosystem report via Gemini
    command: "python3 scripts/ecosystem_report.py"
