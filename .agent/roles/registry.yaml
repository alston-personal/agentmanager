  kind: infrastructure_governance
  source: .agent/roles/instances/gateway_steward.md
  purpose: 掌管全生態 Nginx 反向代理配置、Let's Encrypt SSL/TLS 憑證自動化維護、短網址轉發 (Short URL Redirects) 與多專案路由分流。
  must_obey:
  - truth_provenance
