schema_version: "0.1"
policy_version: "2026.08.30.1"

# Capability to perform a Git mutation is not authority to perform it.
# Protected-branch mutations require an explicit human approval event.
protected_branches:
  - pattern: "main"
    require_pull_request: true
    require_explicit_human_approval: true
    agent_may_merge: false
    require_provider_side_protection: true
  - pattern: "master"
    require_pull_request: true
    require_explicit_human_approval: true
    agent_may_merge: false
  - pattern: "release/*"
    require_pull_request: true
    require_explicit_human_approval: true
    agent_may_merge: false

approval:
  accepted_actor_kinds:
    - human
  explicit_only: true
  examples:
    accepted:
      - "merge this PR"
      - "approve merge into main"
    rejected:
      - "continue"
      - "looks good"
      - "PR is mergeable"
      - "CI passed"

repository_write_contract:
  development_requires_explicit_branch: true
  optional_branch_argument_must_not_default_to_protected_branch: true
  production_deployment_authority_does_not_grant_repository_publication_authority: true

invariants:
  - id: capability_does_not_imply_authority
    statement: "A tool capability to mutate a protected branch never implies permission to do so."
  - id: protected_branch_requires_human_approval
    statement: "An agent must stop at ready-for-merge until an explicit human approval event exists."
  - id: provider_protection_is_mandatory
    statement: "AgentOS policy is defense-in-depth; the Git provider must physically reject unauthorized direct writes to main."
  - id: explicit_non_main_branch_for_development_writes
    statement: "Development repository writes must name an explicit non-protected branch and must never rely on a default-branch fallback."
