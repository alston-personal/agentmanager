name: Inspect Safe Bootstrap V2 Status

on:
  push:
    paths:
      - '.github/workflows/inspect-safe-v2-status.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Read latest safe bootstrap run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/oracle-bootstrap-action-relay-via-chronos-safe.yml/runs?per_page=5" \
            > /tmp/runs.json
          python3 - <<'PY' > .agentos/evidence/safe-bootstrap-v2-status.txt
          import json
          d=json.load(open('/tmp/runs.json'))
          for r in d.get('workflow_runs',[]):
              for k in ('id','name','status','conclusion','event','head_sha','created_at','updated_at'):
                  print(f'{k}={r.get(k)}')
              print('---')
          PY
          cat .agentos/evidence/safe-bootstrap-v2-status.txt
      - name: Commit status evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/safe-bootstrap-v2-status.txt
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(agentos): inspect safe bootstrap v2'
          git pull --rebase origin main
          git push
