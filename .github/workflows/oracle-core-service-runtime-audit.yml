name: Oracle Core Service Runtime Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oracle-core-service-runtime-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Load existing read-only Oracle SSH identity
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Observe exact Core release and service roots (no mutation)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          root=/home/ubuntu/agent-data/releases/core
          current=/home/ubuntu/agent-data/runtime/core/current
          mutable=/home/ubuntu/agentmanager
          release="$(readlink -f "$current" 2>/dev/null || true)"
          echo "core_current=$release"
          case "$release" in "$root"/*) ;; *) echo "oracle_core_runtime_audit=FAIL_UNTRUSTED_RELEASE"; exit 1;; esac
          immutable_count=0
          mutable_count=0
          other_count=0
          for unit in os-chronos.service agent-maintenance.service tg-commander.service teams-commander.service cat-ink-syncer.service os-lobster.service agentos-core-supervisor.service agentos-employee-worker-host.service agentos-employee-wake-node.service agentos-product-work-intent-reconciler.service; do
            active="$(systemctl --user show "$unit" -p ActiveState --value 2>/dev/null || true)"
            pid="$(systemctl --user show "$unit" -p MainPID --value 2>/dev/null || true)"
            wd="$(systemctl --user show "$unit" -p WorkingDirectory --value 2>/dev/null || true)"
            observed="$wd"
            if [ "$unit" != agentos-employee-worker-host.service ] && [ -n "$pid" ] && [ "$pid" != 0 ] && [ -d "/proc/$pid" ]; then
              observed="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"
              observed="${observed:-$wd}"
            fi
            case "$observed" in
              "$root"/*) class=immutable; immutable_count=$((immutable_count+1));;
              "$mutable"|"$mutable"/*) class=mutable; mutable_count=$((mutable_count+1));;
              *) class=other; other_count=$((other_count+1));;
            esac
            printf 'core_service=%s active=%s runtime_class=%s\n' "$unit" "${active:-unknown}" "$class"
          done
          echo "core_runtime_immutable_count=$immutable_count"
          echo "core_runtime_mutable_count=$mutable_count"
          echo "core_runtime_other_count=$other_count"
          if [ "$immutable_count" -eq 10 ] && [ "$mutable_count" -eq 0 ] && [ "$other_count" -eq 0 ]; then
            echo "oracle_core_runtime_audit=PASS"
          else
            echo "oracle_core_runtime_audit=FAIL"
            exit 1
          fi
          REMOTE


  control-plane-readonly:
    # Separate from the legacy Core ten-unit assertion: one can fail without
    # suppressing useful read-only Control Plane evidence.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Attest effective Control Plane without mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 \
            -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'python3 -' <<'PY'
          import json, os, sqlite3, subprocess
          from pathlib import Path
          from datetime import datetime, timezone

          def field(name):
              try:
                  return subprocess.check_output(
                      ["systemctl", "--user", "show", "agentos-control-plane.service",
                       "-p", name, "--value"], text=True, timeout=5
                  ).strip()
              except (OSError, subprocess.SubprocessError):
                  return ""

          observed = {
              "schema": "agentos.control-plane-live-readonly/v1",
              "read_only": True,
              "service_active": field("ActiveState") == "active",
              "loaded_process_proven": False,
              "db_schema_read": False,
              "transport_ready_proven": False,
              "sweep_active_proven": False,
              "old_client_compatibility_proven": False,
              "rollback_proven": False,
          }
          try:
              pid = int(field("MainPID"))
              if pid <= 0:
                  raise ValueError("no-main-pid")
              cwd = Path(f"/proc/{pid}/cwd").resolve(strict=True)
              cmdline = Path(f"/proc/{pid}/cmdline").read_bytes().replace(bytes([0]), b" ").decode("utf-8", "replace")
              env = dict(
                  item.split("=", 1) for item in
                  Path(f"/proc/{pid}/environ").read_bytes().decode("utf-8", "replace").split(chr(0))
                  if "=" in item
              )
              observed["entrypoint_matches"] = "scripts.distributed_gateway" in cmdline
              observed["effective_cwd_matches_unit"] = str(cwd) == field("WorkingDirectory")
              try:
                  observed["observed_sha"] = subprocess.check_output(
                      ["git", "-C", str(cwd), "rev-parse", "HEAD"],
                      text=True, timeout=5, stderr=subprocess.DEVNULL
                  ).strip()
              except (OSError, subprocess.SubprocessError):
                  observed["observed_sha"] = None
              observed["loaded_process_proven"] = (
                  observed["entrypoint_matches"]
                  and observed["effective_cwd_matches_unit"]
                  and bool(observed["observed_sha"])
              )
              observed["github_push_enabled"] = env.get("AGENTOS_GITHUB_DISPATCH_ENABLED", "").lower() in ("1", "true", "yes", "on")
              observed["provider_push_enabled"] = env.get("AGENTOS_PROVIDER_DISPATCH_ENABLED", "").lower() in ("1", "true", "yes", "on")
              observed["configured_interval_positive"] = (
                  float(env.get("AGENTOS_DISPATCH_INTERVAL_SECONDS", "5")) > 0
              )
              # Constructor-loaded .env files may differ from /proc environ.
              # Runtime target registration and an active sweep thread must be
              # separately attested; don't turn booleans into false proof.
              observed["db_path_authoritative"] = bool(env.get("AGENTOS_CONTROL_PLANE_DB"))
              db_path = Path(env["AGENTOS_CONTROL_PLANE_DB"]) if observed["db_path_authoritative"] else (
                  Path(env.get("AGENT_DATA_ROOT") or str(Path.home() / "agent-data"))
                  / "runtime" / "control-plane.sqlite3"
              )
              if db_path.is_file():
                  from urllib.parse import quote
                  uri = "file:" + quote(str(db_path.resolve()), safe="/") + "?mode=ro"
                  with sqlite3.connect(uri, uri=True, timeout=5) as conn:
                      conn.execute("PRAGMA query_only=ON")
                      cols = {row[1] for row in conn.execute("PRAGMA table_info(tasks)")}
                      observed["db_schema_read"] = True
                      observed["lease_epoch_column"] = "lease_epoch" in cols
                      observed["task_count"] = conn.execute("SELECT COUNT(*) FROM tasks").fetchone()[0]
                      observed["submitted_count"] = conn.execute(
                          "SELECT COUNT(*) FROM tasks WHERE status='submitted'"
                      ).fetchone()[0]
                      observed["leased_count"] = conn.execute(
                          "SELECT COUNT(*) FROM tasks WHERE status='leased'"
                      ).fetchone()[0]
                      observed["push_target_count"] = conn.execute(
                          "SELECT COUNT(*) FROM runtime_targets WHERE enabled=1"
                      ).fetchone()[0] if conn.execute(
                          "SELECT 1 FROM sqlite_master WHERE name='runtime_targets'"
                      ).fetchone() else 0
              # AgentOS config.py loads two env files through setdefault()
              # after process exec. Report *only* redacted effective booleans.
              effective = dict(env)
              sources = [cwd / ".env", Path.home() / ".agentos.secrets"]
              for source in sources:
                  try:
                      lines = source.read_text(encoding="utf-8").splitlines()
                  except (OSError, UnicodeError):
                      continue
                  for raw in lines:
                      line = raw.strip()
                      if not line or line.startswith("#") or "=" not in line:
                          continue
                      key, value = line.split("=", 1)
                      key = key.strip()
                      if key in (
                          "AGENTOS_GITHUB_DISPATCH_ENABLED",
                          "AGENTOS_PROVIDER_DISPATCH_ENABLED",
                          "AGENTOS_GITHUB_TOKEN",
                          "AGENTOS_GITHUB_REPOSITORY",
                          "AGENTOS_GITHUB_CAPABILITIES",
                          "AGENTOS_PROVIDER_BRIDGE_ENDPOINT",
                          "AGENTOS_PROVIDER_CAPABILITIES",
                          "AGENTOS_DISPATCH_INTERVAL_SECONDS",
                      ):
                          effective.setdefault(key, os.path.expandvars(
                              value.strip().strip('"').strip("'")
                          ))
              is_enabled = lambda key: effective.get(key, "").lower() in ("1", "true", "yes", "on")
              observed["effective_github_push_enabled"] = is_enabled("AGENTOS_GITHUB_DISPATCH_ENABLED")
              observed["effective_provider_push_enabled"] = is_enabled("AGENTOS_PROVIDER_DISPATCH_ENABLED")
              observed["github_transport_prerequisites_present"] = bool(
                  effective.get("AGENTOS_GITHUB_TOKEN")
              )
              observed["provider_endpoint_configured"] = bool(
                  effective.get("AGENTOS_PROVIDER_BRIDGE_ENDPOINT")
              )
              observed["effective_config_is_inferred"] = True
              observed["observer_status"] = "collected"
          except Exception as exc:
              observed["observer_status"] = "unavailable"
              observed["error_type"] = type(exc).__name__
          observed["observed_at"] = datetime.now(timezone.utc).isoformat()
          print(json.dumps(observed, sort_keys=True))
          if observed["observer_status"] != "collected":
              raise SystemExit(2)
          PY
