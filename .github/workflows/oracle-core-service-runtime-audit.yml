name: Oracle Core Service Runtime Audit

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/oracle-core-service-runtime-audit.yml'
      - 'scripts/install_systemd_user.sh'
      - 'scripts/lobster.py'
      - 'scripts/work_completion.py'
      - '.agent/governance/runtime_ownership.json'
      - '.agent/governance/oracle_identity_boundaries.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Inspect live Core user-service runtime roots
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          RELEASE_ROOT=/home/ubuntu/agent-data/releases/core
          MUTABLE_ROOT=/home/ubuntu/agentmanager
          CURRENT=/home/ubuntu/agent-data/runtime/core/current
          echo "core_current=$(readlink -f "$CURRENT" 2>/dev/null || true)"
          services=(
            os-chronos.service
            agent-maintenance.service
            tg-commander.service
            teams-commander.service
            cat-ink-syncer.service
            os-lobster.service
            agentos-core-supervisor.service
            agentos-employee-worker-host.service
            agentos-employee-wake-node.service
            agentos-product-work-intent-reconciler.service
          )
          mutable=0
          immutable=0
          inactive=0
          other=0
          for unit in "${services[@]}"; do
            active="$(systemctl --user show "$unit" -p ActiveState --value 2>/dev/null || true)"
            pid="$(systemctl --user show "$unit" -p MainPID --value 2>/dev/null || true)"
            wd="$(systemctl --user show "$unit" -p WorkingDirectory --value 2>/dev/null || true)"
            cwd=""
            if [ -n "$pid" ] && [ "$pid" != 0 ] && [ -d "/proc/$pid" ]; then
              cwd="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"
            fi
            observed="${cwd:-$wd}"
            # Employee Worker Host intentionally uses an sg/setpriv wrapper.
            # For that unit the systemd WorkingDirectory is the runtime authority;
            # MainPID may be the wrapper rather than the Python worker.
            if [ "$unit" = agentos-employee-worker-host.service ] && [ -n "$wd" ]; then
              observed="$wd"
            fi
            class=other
            case "$observed" in
              "$RELEASE_ROOT"/*) class=immutable; immutable=$((immutable+1));;
              "$MUTABLE_ROOT"|"$MUTABLE_ROOT"/*) class=mutable; mutable=$((mutable+1));;
              "")
                if [ "$active" = inactive ] || [ -z "$active" ]; then class=inactive; inactive=$((inactive+1)); else other=$((other+1)); fi
                ;;
              *) other=$((other+1));;
            esac
            printf 'core_service=%s active=%s runtime_class=%s\n' "$unit" "${active:-unknown}" "$class"
            printf 'core_service_runtime=%s cwd=%s\n' "$unit" "${observed:-none}"
          done
          lobster_unit=os-lobster.service
          lobster_active="$(systemctl --user show "$lobster_unit" -p ActiveState --value 2>/dev/null || true)"
          lobster_pid="$(systemctl --user show "$lobster_unit" -p MainPID --value 2>/dev/null || true)"
          lobster_wd="$(systemctl --user show "$lobster_unit" -p WorkingDirectory --value 2>/dev/null || true)"
          lobster_release="$(readlink -f "$CURRENT" 2>/dev/null || true)"
          # systemd state counters distinguish normal boot from crash/restart loops.
          lobster_substate="$(systemctl --user show "$lobster_unit" -p SubState --value 2>/dev/null || true)"
          lobster_result="$(systemctl --user show "$lobster_unit" -p Result --value 2>/dev/null || true)"
          lobster_restarts="$(systemctl --user show "$lobster_unit" -p NRestarts --value 2>/dev/null || true)"
          lobster_exit="$(systemctl --user show "$lobster_unit" -p ExecMainStatus --value 2>/dev/null || true)"
          echo "lobster_active=${lobster_active:-unknown}"
          echo "lobster_substate=${lobster_substate:-unknown}"
          echo "lobster_systemd_result=${lobster_result:-unknown}"
          echo "lobster_restart_count=${lobster_restarts:-unknown}"
          echo "lobster_last_exit_code=${lobster_exit:-unknown}"
          echo "lobster_pid_present=$([ -n "$lobster_pid" ] && [ "$lobster_pid" != 0 ] && echo true || echo false)"
          echo "lobster_working_directory=${lobster_wd:-unknown}"
          echo "lobster_accepted_release=${lobster_release:-unknown}"
          # Count only fixed marker classes; never print journal bodies, prompts, or secrets.
          lobster_journal="$(journalctl --user -u "$lobster_unit" --since "30 minutes ago" --no-pager -o cat 2>/dev/null || true)"
          lobster_cycles="$(printf "%s\n" "$lobster_journal" | grep -c "迭代 #" || true)"
          lobster_started="$(printf "%s\n" "$lobster_journal" | grep -c "開始執行任務" || true)"
          lobster_done="$(printf "%s\n" "$lobster_journal" | grep -c "任務完成！" || true)"
          lobster_failed="$(printf "%s\n" "$lobster_journal" | grep -c "任務失敗" || true)"
          echo "lobster_cycles_last_30m=$lobster_cycles"
          echo "lobster_task_starts_last_30m=$lobster_started"
          echo "lobster_task_done_last_30m=$lobster_done"
          echo "lobster_task_failed_last_30m=$lobster_failed"
          # Privacy-safe error categories only; never reveal traceback text or paths.
          lobster_error_kind=unknown
          for candidate in ModuleNotFoundError ImportError SyntaxError IndentationError NameError AttributeError TypeError ValueError PermissionError FileNotFoundError RuntimeError KeyError TimeoutError AssertionError SystemExit; do
            if printf "%s\n" "$lobster_journal" | grep -q "$candidate:"; then
              lobster_error_kind="$candidate"
            fi
          done
          echo "lobster_recent_exception_class=$lobster_error_kind"
          # Read-only checks executed with the same Python interpreter as the service.
          # Import only third-party modules; do not import Lobster or run work.
          for module in yaml requests; do
            if /usr/bin/python3 -c "import $module" >/dev/null 2>&1; then
              echo "lobster_python_dependency_${module}=available"
            else
              echo "lobster_python_dependency_${module}=missing"
            fi
          done
          if [ -f "$lobster_release/scripts/lobster.py" ] && /usr/bin/python3 - "$lobster_release/scripts/lobster.py" >/dev/null 2>&1 <<'PY'
          import ast, pathlib, sys
          ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          PY
          then echo "lobster_release_syntax=PASS"; else echo "lobster_release_syntax=FAIL"; fi
          # Boot preflight: paths and write permission, no task execution.
          lobster_logdir=/home/ubuntu/agent-data/logs
          if [ -d "$lobster_logdir" ] && [ -w "$lobster_logdir" ]; then echo "lobster_log_directory_write=PASS"; else echo "lobster_log_directory_write=FAIL"; fi
          if [ -f "$lobster_logdir/lobster.log" ]; then echo "lobster_log_file_present=true"; else echo "lobster_log_file_present=false"; fi
          if [ -f "$lobster_release/scripts/lobster.py" ]; then echo "lobster_release_entrypoint_present=true"; else echo "lobster_release_entrypoint_present=false"; fi
          # Lobster also writes its own file log. Classify only error names, never log text.
          lobster_local_exception=unknown
          if [ -f "$lobster_logdir/lobster.log" ]; then
            for candidate in ModuleNotFoundError ImportError SyntaxError IndentationError NameError AttributeError TypeError ValueError PermissionError FileNotFoundError RuntimeError KeyError TimeoutError AssertionError SystemExit; do
              if tail -n 300 "$lobster_logdir/lobster.log" | grep -q "$candidate"; then lobster_local_exception="$candidate"; fi
            done
          fi
          echo "lobster_local_log_exception_class=$lobster_local_exception"
          # Extract only a safe Python identifier from the last NameError.
          # Never print traceback lines, source text, paths or raw log data.
          lobster_undefined_symbol="$(tail -n 300 "$lobster_logdir/lobster.log" 2>/dev/null | sed -n "s/.*NameError: name '\\([A-Za-z_][A-Za-z_0-9]*\\)' is not defined.*/\\1/p" | tail -n 1)"
          case "$lobster_undefined_symbol" in
            "" ) echo "lobster_undefined_symbol=unknown";;
            * ) echo "lobster_undefined_symbol=$lobster_undefined_symbol";;
          esac
          # Use the LAST Python exception in the systemd-appended file, not
          # any old error in the tail. Report only an allowlisted class and safe name.
          /usr/bin/python3 - "$lobster_logdir/lobster.log" <<'PY'
          import collections, pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          allowed = {"NameError","ModuleNotFoundError","ImportError","SyntaxError","IndentationError","AttributeError","TypeError","ValueError","PermissionError","FileNotFoundError","RuntimeError","KeyError","TimeoutError","AssertionError","SystemExit","OSError"}
          last = None
          if path.is_file():
              with path.open("r", encoding="utf-8", errors="replace") as f:
                  for line in collections.deque(f, maxlen=2000):
                      m = re.match(r"^([A-Za-z]+(?:Error|Exit)): (.*)$", line.strip())
                      if m and m.group(1) in allowed:
                          last = m.groups()
          print("lobster_last_exception_class=" + (last[0] if last else "unknown"))
          if last and last[0] == "NameError":
              m = re.fullmatch(r"name '([A-Za-z_][A-Za-z_0-9]*)' is not defined", last[1])
              print("lobster_last_nameerror_identifier=" + (m.group(1) if m else "unknown"))
          PY
          # os-lobster stdout/stderr are appended to lobster.log by systemd.
          # Journal-only counters may show zero even while the worker is active.
          /usr/bin/python3 - "$lobster_logdir/lobster.log" <<'LOBSTER_METRICS'
          from collections import Counter
          from datetime import datetime, timedelta
          from pathlib import Path
          import sys
          cutoff = datetime.now() - timedelta(minutes=30)
          counts = Counter()
          markers = {"cycles":"迭代 #","attempts":"任務嘗試","starts":"開始執行任務","done":"任務完成！","inspector_pass":"Inspector: PASS","failures":"任務失敗"}
          path = Path(sys.argv[1])
          last = None
          if path.is_file():
              with path.open("r", encoding="utf-8", errors="replace") as handle:
                  for line in handle:
                      try:
                          when = datetime.strptime(line[:19], "%Y-%m-%d %H:%M:%S")
                      except ValueError:
                          continue
                      if when < cutoff:
                          continue
                      for key, needle in markers.items():
                          if needle in line:
                              counts[key] += 1
                              if key == "cycles":
                                  last = when.isoformat(timespec="seconds")
          for key in markers:
              print(f"lobster_file_{key}_last_30m={counts[key]}")
          print("lobster_file_latest_cycle=" + (last or "none"))
          LOBSTER_METRICS
          # Read-only canonical Completion Ledger status; do not disclose work details.
          /usr/bin/python3 - /home/ubuntu/agent-data/governance/work-items.json <<'LOBSTER_QUEUE'
          import collections, json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          if not path.is_file():
              print("lobster_ledger_present=false")
          else:
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  items = data.get("items") or {}
                  if not isinstance(items, dict):
                      raise ValueError("invalid_items")
                  states = collections.Counter(str(x.get("status") or "unknown") for x in items.values() if isinstance(x, dict))
                  owners = collections.Counter(str(x.get("owner") or "") for x in items.values() if isinstance(x, dict) and x.get("status") in {"accepted","in_progress","blocked","verifying"})
                  print("lobster_ledger_present=true")
                  print("lobster_ledger_generation=" + str(int(data.get("generation") or 0)))
                  for key in ("accepted", "in_progress", "blocked", "verifying", "done"):
                      print("lobster_ledger_" + key + "=" + str(states[key]))
                  print("lobster_ledger_routable=" + str(owners["role://lobster"] + owners["role://completion.controller"]))
              except (ValueError, json.JSONDecodeError):
                  print("lobster_ledger_valid=false")
          LOBSTER_QUEUE
          # Classify exact first proof WorkItem blocker without disclosing its text.
          /usr/bin/python3 - /home/ubuntu/agent-data/governance/work-items.json <<'PROOF_BLOCKER'
          import json,pathlib,re,sys
          try:
              data=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
              item=data.get("items",{}).get("lobster-autonomous-first-20261008",{})
              reason=str(item.get("blocker") or "")
              print("lobster_first_proof_status="+str(item.get("status") or "missing"))
              if "TIMEOUT" in reason or "逾時" in reason: category="timeout"
              elif "inspector_unavailable" in reason: category="inspector_unavailable"
              elif "連續 3 次" in reason: category="retry_exhausted"
              elif "BLOCKED" in reason: category="model_blocked"
              elif reason: category="other"
              else: category="none"
              print("lobster_first_proof_blocker_category="+category)
          except (OSError,ValueError,TypeError):
              print("lobster_first_proof_blocker_category=unavailable")
          PROOF_BLOCKER
          echo "core_runtime_immutable_count=$immutable"
          echo "core_runtime_mutable_count=$mutable"
          echo "core_runtime_inactive_count=$inactive"
          echo "core_runtime_other_count=$other"
          if [ "$mutable" -gt 0 ]; then
            echo "oracle_core_runtime_audit=DRIFT"
          else
            echo "oracle_core_runtime_audit=PASS"
          fi
          REMOTE
