name: Diagnostic 1682 Bootstrap Transport
on:
  pull_request:
    paths:
      - 'scripts/submit_oracle_bootstrap_request_remote.sh'
      - '.github/workflows/diagnostic-1682-bootstrap-transport.yml'
permissions:
  contents: read
jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/submit_oracle_bootstrap_request_remote.sh
      - name: Assert short-lived polling and immutable request
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/submit_oracle_bootstrap_request_remote.sh').read_text()
          assert s.count("<<'REMOTE'")==2
          assert 'request_already_completed=' in s
          assert 'flock -w 60 9' in s
          assert 'sudo -n -u agentos-node' in s
          assert 'RECEIPT_JSON=' in s
          assert 'sleep 10' in s
          assert 'exit 3' in s
          print('bootstrap_remote_transport=PASS')
          PY
