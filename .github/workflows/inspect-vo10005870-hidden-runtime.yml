name: Inspect VO10005870 Hidden Runtime Scripts

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/inspect-vo10005870-hidden-runtime.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Read active launcher and watchdog scripts
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          f=RealmFabricStore()
          tid='inspect-hidden-runtime-scripts-20261002-1528'
          ps=r'''$root=Join-Path $env:LOCALAPPDATA 'AgentOS'
          $launcher=Join-Path $root 'agentos-thin-client-hidden.ps1'
          $wdv3=Join-Path $root 'scripts\thin_client_watchdog-v3.ps1'
          $wd=Join-Path $root 'scripts\thin_client_watchdog.ps1'
          [pscustomobject]@{
            launcher_path=$launcher;
            launcher_exists=(Test-Path $launcher);
            launcher_content=$(if(Test-Path $launcher){Get-Content -Raw -LiteralPath $launcher}else{''});
            watchdog_v3_path=$wdv3;
            watchdog_v3_exists=(Test-Path $wdv3);
            watchdog_v3_content=$(if(Test-Path $wdv3){Get-Content -Raw -LiteralPath $wdv3}else{''});
            watchdog_path=$wd;
            watchdog_exists=(Test-Path $wd);
            watchdog_content=$(if(Test-Path $wd){Get-Content -Raw -LiteralPath $wd}else{''})
          } | ConvertTo-Json -Depth 4 -Compress'''
          if f.get_receipt(tid) is None:
              f.queue_task('VO10005870',{
                  'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec',
                  'executable':'powershell','argv':['-NoProfile','-NonInteractive','-Command',ps],
                  'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':20,
                  'cognition_ids_used':['demo://watchdog-debug/20261002'],
              })
          for _ in range(30):
              r=f.get_receipt(tid)
              if r is not None:
                  print(json.dumps(r,ensure_ascii=False,separators=(',',':')))
                  assert r.get('ok') is True and int(r.get('returncode') or 0)==0, r
                  break
              time.sleep(1)
          else:
              raise SystemExit('hidden_runtime_receipt_missing')
          PY
          REMOTE
