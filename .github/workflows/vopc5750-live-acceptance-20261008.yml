name: VOPC5750 Live Acceptance 20261008

on:
  push:
    branches:
      - ops/vopc5750-live-acceptance-20261008
    paths:
      - '.github/workflows/vopc5750-live-acceptance-20261008.yml'

permissions:
  contents: read

jobs:
  accept:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 6
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
    steps:
      - uses: actions/checkout@v4

      - name: Inspect live node
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from agent_core.node_registry import NodeRegistry
          data=NodeRegistry().node_map()
          node=next((n for n in data.get('nodes',[]) if n.get('node_id')=='vopc5750'),None)
          print(json.dumps(node,indent=2,sort_keys=True))
          assert node, 'vopc5750 missing'
          assert node.get('status')=='online', node
          assert float(node.get('heartbeat_age_seconds') or 9999) < 30, node
          assert 'desktop.semantic_preview' in (node.get('capabilities') or []), node
          print('NODE_LIVE_ACCEPTANCE=PASS')
          PY

      - name: Session inspect canary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,uuid
          from agent_core.realm_fabric import RealmFabricStore

          fabric=RealmFabricStore()
          task_id='task-canary-'+uuid.uuid4().hex
          queued=fabric.queue_task('vopc5750',{
            'schema':'agentos.node-task/v0.1',
            'task_id':task_id,
            'action':'desktop.session.inspect',
          })
          receipt=None
          deadline=time.time()+45
          while time.time()<deadline:
              receipt=fabric.get_receipt(task_id)
              if receipt:
                  break
              time.sleep(1)

          store=fabric.load()
          queue=list((store.get('tasks') or {}).get('vopc5750') or [])
          record=next((x for x in queue if isinstance(x,dict) and x.get('task_id')==task_id),None)
          print(json.dumps({
            'task_id':task_id,
            'queued_at':queued.get('queued_at'),
            'receipt':receipt,
            'queue_record':record,
          },indent=2,sort_keys=True))

          assert receipt, 'SESSION_INSPECT_RECEIPT_TIMEOUT'
          assert receipt.get('ok') is True, receipt
          print('SESSION_INSPECT_CANARY=PASS')
          PY

      - name: Semantic preview acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,uuid
          from agent_core.realm_fabric import RealmFabricStore

          fabric=RealmFabricStore()
          task_id='task-semantic-'+uuid.uuid4().hex
          queued=fabric.queue_task('vopc5750',{
            'schema':'agentos.node-task/v0.1',
            'task_id':task_id,
            'action':'desktop.semantic_preview',
            'max_pixels':160000,
          })
          receipt=None
          deadline=time.time()+45
          while time.time()<deadline:
              receipt=fabric.get_receipt(task_id)
              if receipt:
                  break
              time.sleep(1)

          store=fabric.load()
          queue=list((store.get('tasks') or {}).get('vopc5750') or [])
          record=next((x for x in queue if isinstance(x,dict) and x.get('task_id')==task_id),None)
          print(json.dumps({
            'task_id':task_id,
            'queued_at':queued.get('queued_at'),
            'receipt':receipt,
            'queue_record':record,
          },indent=2,sort_keys=True))

          assert receipt, 'SEMANTIC_PREVIEW_RECEIPT_TIMEOUT'
          assert receipt.get('ok') is True, receipt

          result=receipt.get('result') if isinstance(receipt.get('result'),dict) else receipt
          checks={
            'read_only': result.get('read_only') is True,
            'mode': bool(result.get('mode')),
            'state_hash': bool(result.get('state_hash')),
            'foreground': isinstance(result.get('foreground'),dict),
            'preview': isinstance(result.get('preview'),dict),
          }
          print('SEMANTIC_PREVIEW_CHECKS='+json.dumps(checks,sort_keys=True))
          assert all(checks.values()), (receipt,checks)
          print('SEMANTIC_PREVIEW_ACCEPTANCE=PASS')
          PY
