name: Deploy n8n env

on:
  push:
    paths:
      - '.github/workflows/deploy-n8n-env.yml'

permissions:
  contents: read

jobs:
  metashield-media-inspect:
    runs-on: ubuntu-latest
    env:
      SSH_PORT: ${{ secrets.N8N_DEPLOY_SSH_PORT }}
      N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Derive Oracle host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${N8N_BASE_URL#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Inspect true Chamber media path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          ssh -o StrictHostKeyChecking=accept-new -p "${SSH_PORT:-22}" "${{ secrets.N8N_DEPLOY_USER }}@${DEPLOY_HOST}" bash -s <<'REMOTE' | tee .agentos/evidence/metashield-media-deep-hosted.txt
          set -euo pipefail
          ROOT=/home/ubuntu/metashield-protocol
          echo "version=$(python3 -c 'import json;print(json.load(open("'$ROOT'/extension/manifest.json"))["version"])')"
          echo "branch=$(git -C "$ROOT" rev-parse --abbrev-ref HEAD)"
          echo "head=$(git -C "$ROOT" rev-parse HEAD)"
          echo '===== uploadToFallbackStorage ====='
          line=$(grep -n 'async function uploadToFallbackStorage' "$ROOT/extension/background.js" | head -1 | cut -d: -f1)
          test -n "$line"
          start=$((line-8)); end=$((line+150));
          nl -ba "$ROOT/extension/background.js" | sed -n "${start},${end}p"
          echo '===== CHAMBER_API_BASE ====='
          grep -nE 'CHAMBER_API_BASE|storageNetwork|/media' "$ROOT/extension/background.js" | sed -n '1,160p' || true
          echo '===== media i18n ====='
          grep -n '"media\.' "$ROOT/extension/i18n.js" || true
          echo '===== manifest hosts ====='
          python3 - <<'PY'
          import json
          p='/home/ubuntu/metashield-protocol/extension/manifest.json'
          d=json.load(open(p))
          print('\n'.join(d.get('host_permissions') or []))
          PY
          echo '===== git status ====='
          git -C "$ROOT" status --short --branch
          REMOTE
      - uses: actions/upload-artifact@v4
        with:
          name: metashield-media-deep-hosted
          path: .agentos/evidence/metashield-media-deep-hosted.txt
          if-no-files-found: error
