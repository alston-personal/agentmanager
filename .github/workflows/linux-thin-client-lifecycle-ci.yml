name: Linux Thin Client Lifecycle CI

on:
  pull_request:
    paths:
      - 'agentos_node/onboarding.py'
      - 'scripts/install_thin_client_linux_oracle.sh'
      - 'tests/test_node_onboarding_lifecycle.py'
      - '.github/workflows/linux-thin-client-lifecycle-ci.yml'
  push:
    branches:
      - core/integration
    paths:
      - 'agentos_node/onboarding.py'
      - 'scripts/install_thin_client_linux_oracle.sh'
      - 'tests/test_node_onboarding_lifecycle.py'
      - '.github/workflows/linux-thin-client-lifecycle-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile lifecycle modules
        run: python -m py_compile agentos_node/onboarding.py agentos_node/client_cli.py agentos_node/thin_client.py agentos_node/thin_client_transport.py
      - name: Run Oracle execution-node regressions
        run: >-
          python -m pytest -q
          tests/test_node_onboarding_lifecycle.py
          tests/test_thin_client.py
          tests/test_oracle_ssh_emergency_actions.py
          tests/test_control_inbox_bridge.py
      - name: Validate Oracle installer shell syntax
        run: bash -n scripts/install_thin_client_linux_oracle.sh

  mio-canonical-asset-inspect-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: 161.33.24.170
      ORACLE_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      ORACLE_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start deploy SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect Mio canonical/full-body assets
        shell: bash
        run: |
          set -euo pipefail
          PORT="${ORACLE_PORT:-22}"
          ssh -p "$PORT" -o StrictHostKeyChecking=accept-new "${ORACLE_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          roots=[
              Path('/home/ubuntu/agent-data'),
              Path('/home/ubuntu/agentmanager'),
              Path('/home/ubuntu/zeus-writer/website'),
          ]
          keys=('mio','澪','body','front','neutral','canonical','render','tryon','avatar')
          seen=0
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if seen>=220:
                      break
                  if not p.is_file():
                      continue
                  s=str(p).lower()
                  if not any(k in s for k in keys):
                      continue
                  if p.suffix.lower() not in {'.png','.jpg','.jpeg','.webp'}:
                      continue
                  try:
                      im=Image.open(p)
                      w,h=im.size
                  except Exception:
                      continue
                  print(f'asset={p} width={w} height={h} bytes={p.stat().st_size}')
                  seen+=1
          print('asset_scan_count='+str(seen))
          PY
          REMOTE

  mio-asset-candidates-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ORACLE_HOST: 161.33.24.170
      ORACLE_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      ORACLE_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start deploy SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Fetch Mio asset candidates
        shell: bash
        run: |
          set -euo pipefail
          PORT="${ORACLE_PORT:-22}"
          mkdir -p /tmp/mio-asset-candidates
          scp -P "$PORT" -o StrictHostKeyChecking=accept-new             "${ORACLE_USER}@${ORACLE_HOST}:/home/ubuntu/agent-data/runtime/transcripts/brain/f83ec3d4-ac26-4b70-bec2-e41a7ab49368/preview_sheet_01_front.jpg"             /tmp/mio-asset-candidates/preview_sheet_01_front.jpg
          scp -P "$PORT" -o StrictHostKeyChecking=accept-new             "${ORACLE_USER}@${ORACLE_HOST}:/home/ubuntu/agent-data/projects/dressup-simulator/render_assets/mio-live-e2e-36397707913.webp"             /tmp/mio-asset-candidates/mio-live-e2e-36397707913.webp
      - name: Upload Mio asset candidates
        uses: actions/upload-artifact@v4
        with:
          name: mio-asset-candidates
          path: /tmp/mio-asset-candidates/*
          retention-days: 2

  mio-canonical-asset-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ORACLE_HOST: 161.33.24.170
      ORACLE_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      ORACLE_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Start deploy SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Discover Mio full-body candidates
        shell: bash
        run: |
          set -euo pipefail
          PORT="${ORACLE_PORT:-22}"
          ssh -p "$PORT" -o StrictHostKeyChecking=accept-new "${ORACLE_USER}@${ORACLE_HOST}" 'python3 -' <<'PY'
          from pathlib import Path
          from PIL import Image
          roots=[Path("/home/ubuntu/agent-data"),Path("/home/ubuntu/agentmanager"),Path("/home/ubuntu/.local/share/agentos")]
          rows=[]
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob("*"):
                  if not p.is_file() or p.suffix.lower() not in {".png",".jpg",".jpeg",".webp"}:
                      continue
                  name=str(p).lower()
                  if not any(k in name for k in ["mio","tryon","dressup"]):
                      continue
                  try:
                      with Image.open(p) as im:
                          w,h=im.size
                  except Exception:
                      continue
                  if h>=w and h>=700:
                      rows.append((p.stat().st_mtime,w,h,p.stat().st_size,str(p)))
          for m,w,h,s,p in sorted(rows,reverse=True)[:80]:
              print(f"{w}x{h}\t{s}\t{p}")
          PY

  mio-visual-e2e-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ORACLE_HOST: 161.33.24.170
      ORACLE_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      ORACLE_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Start deploy SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Fetch latest Mio visual outputs
        shell: bash
        run: |
          set -euo pipefail
          PORT="${ORACLE_PORT:-22}"
          mkdir -p /tmp/mio-visual-e2e
          scp -P "$PORT" -o StrictHostKeyChecking=accept-new             "${ORACLE_USER}@${ORACLE_HOST}:/home/ubuntu/agent-data/projects/dressup-simulator/render_assets/mio-shoe-live-e2e-36580481746.webp"             /tmp/mio-visual-e2e/latest-shoe-e2e.webp
          ssh -p "$PORT" -o StrictHostKeyChecking=accept-new "${ORACLE_USER}@${ORACLE_HOST}"             'find /home/ubuntu/agent-data/releases/studio-web/mio-persona -path "*/tryon/cache/*.webp" -type f | tail -n 1'             > /tmp/mio-visual-e2e/cache-path.txt
          CACHE_PATH="$(cat /tmp/mio-visual-e2e/cache-path.txt)"
          test -n "$CACHE_PATH"
          scp -P "$PORT" -o StrictHostKeyChecking=accept-new             "${ORACLE_USER}@${ORACLE_HOST}:$CACHE_PATH"             /tmp/mio-visual-e2e/legacy-fullbody-cache.webp
      - uses: actions/upload-artifact@v4
        with:
          name: mio-visual-e2e
          path: /tmp/mio-visual-e2e/*.webp
          retention-days: 2

  mio-neutral-canonical-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ORACLE_HOST: 161.33.24.170
      ORACLE_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      ORACLE_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Start deploy SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Generate neutral canonical Mio candidates
        shell: bash
        run: |
          set -euo pipefail
          PORT="${ORACLE_PORT:-22}"
          ssh -p "$PORT" -o StrictHostKeyChecking=accept-new "${ORACLE_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          ROOT=/home/ubuntu/agent-data/projects/dressup-simulator
          SRC="$ROOT/render_assets/mio-shoe-live-e2e-36580481746.webp"
          OUT="$ROOT/canonical_candidates"
          mkdir -p "$OUT"
          export $(grep -E '^HF_TOKEN=' /home/ubuntu/.config/agentos/mio-tryon.env | xargs)
          /home/ubuntu/.local/share/mio-tryon-venv/bin/python - <<'PY'
          from pathlib import Path
          import shutil
          from gradio_client import handle_file
          import sys
          sys.path.insert(0,'/home/ubuntu/agentmanager')
          from scripts.tryon_render_worker import qwen_edit_client, output_path

          src=Path('/home/ubuntu/agent-data/projects/dressup-simulator/render_assets/mio-shoe-live-e2e-36580481746.webp')
          out=Path('/home/ubuntu/agent-data/projects/dressup-simulator/canonical_candidates')
          prompts=[
              (
                "Use this image only as the identity and body-proportion reference for the same woman. "
                "Create a clean canonical full-body character reference, front-facing, standing upright in a relaxed neutral A-pose, "
                "arms naturally slightly away from the torso, feet parallel and fully visible. Preserve exactly her face, hairstyle, "
                "hair clip, age appearance, body proportions, leg length, skin tone, and overall identity. Replace the current outfit "
                "with a plain modest technical fitting base: solid light neutral fitted short-sleeve top and plain fitted mid-thigh shorts, "
                "no jacket, no bag, no accessories except the existing small hair clip, barefoot. Plain warm-white studio background, "
                "even soft light, no props, no text, no circle behind her, no dramatic pose. Photorealistic. Output one complete head-to-toe person."
              ),
              (
                "Transform this into a neutral front-view full-body canonical model sheet of the exact same woman. Keep her facial identity, "
                "hair, small cat hair clip, height impression, shoulder width, waist, hip and leg proportions unchanged. She stands straight, "
                "symmetrical and relaxed, looking at camera, both arms down slightly away from the body, both feet flat and visible. "
                "Wear only a simple modest light-gray fitted technical T-shirt and plain dark-gray fitted shorts suitable for virtual try-on, "
                "barefoot, no outerwear, no bag, no jewelry, no background circle. Clean seamless off-white studio background, soft even lighting, "
                "photorealistic, full body centered with generous margin around head and feet."
              ),
          ]
          for idx,prompt in enumerate(prompts,1):
              result=qwen_edit_client().predict(handle_file(str(src)),prompt,api_name='/rewritten_instruction')
              if not isinstance(result,(list,tuple)) or len(result)<2:
                  raise RuntimeError(result)
              generated=Path(output_path(result[1]))
              dst=out/f'mio-neutral-canonical-candidate-{idx}.webp'
              shutil.copy2(generated,dst)
              print(f'canonical_candidate_{idx}={dst} bytes={dst.stat().st_size}')
          PY
          REMOTE
          mkdir -p /tmp/mio-neutral-canonical
          for n in 1 2; do
            scp -P "$PORT" -o StrictHostKeyChecking=accept-new               "${ORACLE_USER}@${ORACLE_HOST}:/home/ubuntu/agent-data/projects/dressup-simulator/canonical_candidates/mio-neutral-canonical-candidate-$n.webp"               "/tmp/mio-neutral-canonical/candidate-$n.webp"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mio-neutral-canonical
          path: /tmp/mio-neutral-canonical/*.webp
          retention-days: 2
