name: Linux Thin Client Lifecycle CI

on:
  pull_request:
    paths:
      - 'agentos_node/onboarding.py'
      - 'scripts/install_thin_client_linux_oracle.sh'
      - 'tests/test_node_onboarding_lifecycle.py'
      - '.github/workflows/linux-thin-client-lifecycle-ci.yml'
  push:
    branches:
      - core/integration
    paths:
      - 'agentos_node/onboarding.py'
      - 'scripts/install_thin_client_linux_oracle.sh'
      - 'tests/test_node_onboarding_lifecycle.py'
      - '.github/workflows/linux-thin-client-lifecycle-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile lifecycle modules
        run: python -m py_compile agentos_node/onboarding.py agentos_node/client_cli.py agentos_node/thin_client.py agentos_node/thin_client_transport.py
      - name: Run Oracle execution-node regressions
        run: >-
          python -m pytest -q
          tests/test_node_onboarding_lifecycle.py
          tests/test_thin_client.py
          tests/test_oracle_ssh_emergency_actions.py
          tests/test_control_inbox_bridge.py
      - name: Validate Oracle installer shell syntax
        run: bash -n scripts/install_thin_client_linux_oracle.sh

  oracle-exec-bootstrap-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ORACLE_HOST: 161.33.24.170
      ORACLE_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      ORACLE_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Start deploy SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Install Oracle execution node without self-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORACLE_USER:-}"
          PORT="${ORACLE_PORT:-22}"
          REMOTE=/tmp/install-thin-client-linux-oracle-${GITHUB_RUN_ID}.sh
          scp -P "$PORT" -o StrictHostKeyChecking=accept-new             scripts/install_thin_client_linux_oracle.sh "${ORACLE_USER}@${ORACLE_HOST}:$REMOTE"
          ssh -p "$PORT" -o StrictHostKeyChecking=accept-new "${ORACLE_USER}@${ORACLE_HOST}"             bash -s -- "$REMOTE" <<'REMOTE'
          set -euo pipefail
          REMOTE="$1"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          test -S "$XDG_RUNTIME_DIR/bus"
          chmod 700 "$REMOTE"
          "$REMOTE" core/integration
          systemctl --user is-active agentos-thin-client.service
          /home/ubuntu/.local/share/AgentOS/agentos-client manifest |             python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["node_id"]=="oracle-exec"; assert "node.ssh.inspect" in d["capabilities"]; assert "node.ssh.recover" in d["capabilities"]; print("oracle_exec_manifest=PASS")'
          rm -f "$REMOTE"
          REMOTE

  mio-hf-token-recovery-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORACLE_HOST: 161.33.24.170
      ORACLE_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      ORACLE_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Start deploy SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Apply local HF token and run Mio shoe E2E
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORACLE_USER:-}"
          PORT="${ORACLE_PORT:-22}"
          ssh -p "$PORT" -o StrictHostKeyChecking=accept-new "${ORACLE_USER}@${ORACLE_HOST}"             bash -s -- "${GITHUB_RUN_ID}" <<'REMOTE'
          set -euo pipefail
          RUN_ID="$1"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          test -S "$XDG_RUNTIME_DIR/bus"

          LOCAL_ENV="/home/ubuntu/agentmanager/.env"
          TOKEN="$(sed -n 's/^HF_TOKEN=//p' "$LOCAL_ENV" | tail -n 1)"
          test -n "$TOKEN"
          install -d -m 700 "$HOME/.config/agentos"
          umask 077
          printf 'HF_TOKEN=%s\n' "$TOKEN" > "$HOME/.config/agentos/mio-tryon.env"
          unset TOKEN
          chmod 600 "$HOME/.config/agentos/mio-tryon.env"
          echo "mio_any_item_hf_token_configured=yes"

          WORKER="$HOME/.local/bin/agentos-mio-tryon-render-worker.py"
          test -s "$WORKER"
          grep -Fq 'pbgo/OmniTry' "$WORKER"

          systemctl --user daemon-reload
          systemctl --user restart agentos-mio-tryon-render-worker.service
          sleep 2
          systemctl --user is-active agentos-mio-tryon-render-worker.service

          ROOT="$HOME/agent-data/projects/dressup-simulator"
          JOB_DIR="$ROOT/render_jobs/runtime"
          ASSET_DIR="$ROOT/render_assets"
          JOB_ID="mio-shoe-live-e2e-$RUN_ID"
          JOB="$JOB_DIR/$JOB_ID.json"
          ASSET="$ASSET_DIR/$JOB_ID.webp"
          mkdir -p "$JOB_DIR" "$ASSET_DIR"
          rm -f "$JOB" "$ASSET"

          python3 - "$JOB" "$JOB_ID" <<'PY'
          import json, pathlib, sys
          from datetime import datetime, timezone
          path=pathlib.Path(sys.argv[1]); job_id=sys.argv[2]
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          job={
            "schema":"agentos.tryon-render-job/v1",
            "jobId":job_id,
            "characterId":"sunlake-milkcat-ai-001",
            "characterVersion":"mio-body-v1",
            "view":"front",
            "pose":"neutral_standing",
            "status":"queued",
            "requestedAt":now,
            "startedAt":None,
            "completedAt":None,
            "failedAt":None,
            "supersededBy":None,
            "input":{
              "baseBodyAsset":"/personas/mio/mio-avatar.webp",
              "layerOrder":["shoes"],
              "selectedLayers":{
                "shoes":{
                  "garmentId":"net-40832-002",
                  "name":"防潑水帆布鞋",
                  "layer":"shoes",
                  "sourceImageUrl":"https://m.net-fashion.net/product/735479"
                }
              }
            },
            "output":{"asset":None,"previewAsset":None,"width":None,"height":None},
            "error":None
          }
          path.write_text(json.dumps(job,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          path.chmod(0o600)
          PY

          OK=0
          for i in $(seq 1 180); do
            STATE=$(python3 - "$JOB" <<'PY'
          import json,sys
          try:
              print(json.load(open(sys.argv[1],encoding='utf-8')).get('status','missing'))
          except Exception:
              print('missing')
          PY
          )
            echo "mio_any_item_shoe_state=$STATE poll=$i"
            if [ "$STATE" = ready ]; then
              python3 - "$JOB" "$ASSET" <<'PY'
          import json, pathlib, sys
          job=json.load(open(sys.argv[1],encoding='utf-8'))
          asset=pathlib.Path(sys.argv[2])
          output=job.get('output') or {}
          rendered=output.get('renderedLayers') or []
          pending=output.get('pendingLayers') or []
          providers=output.get('providerOutputs') or []
          assert 'shoes' in rendered, f'shoes_not_rendered:{rendered}'
          assert 'shoes' not in pending, f'shoes_still_pending:{pending}'
          assert asset.exists() and asset.stat().st_size > 1000, 'shoe_asset_missing'
          shoe_provider=next((row for row in providers if row.get('layer')=='shoes'), None)
          assert shoe_provider, f'shoe_provider_missing:{providers}'
          print('mio_any_item_shoe_e2e=PASS')
          print('mio_any_item_shoe_bytes='+str(asset.stat().st_size))
          print('mio_any_item_provider='+str(shoe_provider.get('providerSpace')))
          PY
              OK=1
              break
            fi
            if [ "$STATE" = failed ]; then
              cat "$JOB"
              journalctl --user -u agentos-mio-tryon-render-worker.service -n 120 --no-pager || true
              break
            fi
            sleep 2
          done
          test "$OK" -eq 1
          REMOTE
