name: Linux Thin Client Lifecycle CI

on:
  pull_request:
    paths:
      - 'agentos_node/onboarding.py'
      - 'scripts/install_thin_client_linux_oracle.sh'
      - 'tests/test_node_onboarding_lifecycle.py'
      - '.github/workflows/linux-thin-client-lifecycle-ci.yml'
  push:
    branches:
      - core/integration
    paths:
      - 'agentos_node/onboarding.py'
      - 'scripts/install_thin_client_linux_oracle.sh'
      - 'tests/test_node_onboarding_lifecycle.py'
      - '.github/workflows/linux-thin-client-lifecycle-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile lifecycle modules
        run: python -m py_compile agentos_node/onboarding.py agentos_node/client_cli.py agentos_node/thin_client.py agentos_node/thin_client_transport.py
      - name: Run Oracle execution-node regressions
        run: >-
          python -m pytest -q
          tests/test_node_onboarding_lifecycle.py
          tests/test_thin_client.py
          tests/test_oracle_ssh_emergency_actions.py
          tests/test_control_inbox_bridge.py
      - name: Validate Oracle installer shell syntax
        run: bash -n scripts/install_thin_client_linux_oracle.sh

  mio-canonical-asset-inspect-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: 161.33.24.170
      ORACLE_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      ORACLE_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start deploy SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect Mio canonical/full-body assets
        shell: bash
        run: |
          set -euo pipefail
          PORT="${ORACLE_PORT:-22}"
          ssh -p "$PORT" -o StrictHostKeyChecking=accept-new "${ORACLE_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          roots=[
              Path('/home/ubuntu/agent-data'),
              Path('/home/ubuntu/agentmanager'),
              Path('/home/ubuntu/zeus-writer/website'),
          ]
          keys=('mio','澪','body','front','neutral','canonical','render','tryon','avatar')
          seen=0
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if seen>=220:
                      break
                  if not p.is_file():
                      continue
                  s=str(p).lower()
                  if not any(k in s for k in keys):
                      continue
                  if p.suffix.lower() not in {'.png','.jpg','.jpeg','.webp'}:
                      continue
                  try:
                      im=Image.open(p)
                      w,h=im.size
                  except Exception:
                      continue
                  print(f'asset={p} width={w} height={h} bytes={p.stat().st_size}')
                  seen+=1
          print('asset_scan_count='+str(seen))
          PY
          REMOTE

  mio-asset-candidates-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ORACLE_HOST: 161.33.24.170
      ORACLE_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      ORACLE_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start deploy SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Fetch Mio asset candidates
        shell: bash
        run: |
          set -euo pipefail
          PORT="${ORACLE_PORT:-22}"
          mkdir -p /tmp/mio-asset-candidates
          scp -P "$PORT" -o StrictHostKeyChecking=accept-new             "${ORACLE_USER}@${ORACLE_HOST}:/home/ubuntu/agent-data/runtime/transcripts/brain/f83ec3d4-ac26-4b70-bec2-e41a7ab49368/preview_sheet_01_front.jpg"             /tmp/mio-asset-candidates/preview_sheet_01_front.jpg
          scp -P "$PORT" -o StrictHostKeyChecking=accept-new             "${ORACLE_USER}@${ORACLE_HOST}:/home/ubuntu/agent-data/projects/dressup-simulator/render_assets/mio-live-e2e-36397707913.webp"             /tmp/mio-asset-candidates/mio-live-e2e-36397707913.webp
      - name: Upload Mio asset candidates
        uses: actions/upload-artifact@v4
        with:
          name: mio-asset-candidates
          path: /tmp/mio-asset-candidates/*
          retention-days: 2

  mio-canonical-asset-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ORACLE_HOST: 161.33.24.170
      ORACLE_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      ORACLE_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Start deploy SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Discover Mio full-body candidates
        shell: bash
        run: |
          set -euo pipefail
          PORT="${ORACLE_PORT:-22}"
          ssh -p "$PORT" -o StrictHostKeyChecking=accept-new "${ORACLE_USER}@${ORACLE_HOST}" 'python3 -' <<'PY'
          from pathlib import Path
          from PIL import Image
          roots=[Path("/home/ubuntu/agent-data"),Path("/home/ubuntu/agentmanager"),Path("/home/ubuntu/.local/share/agentos")]
          rows=[]
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob("*"):
                  if not p.is_file() or p.suffix.lower() not in {".png",".jpg",".jpeg",".webp"}:
                      continue
                  name=str(p).lower()
                  if not any(k in name for k in ["mio","tryon","dressup"]):
                      continue
                  try:
                      with Image.open(p) as im:
                          w,h=im.size
                  except Exception:
                      continue
                  if h>=w and h>=700:
                      rows.append((p.stat().st_mtime,w,h,p.stat().st_size,str(p)))
          for m,w,h,s,p in sorted(rows,reverse=True)[:80]:
              print(f"{w}x{h}\t{s}\t{p}")
          PY
