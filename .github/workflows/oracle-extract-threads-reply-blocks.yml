name: Oracle Extract Threads Reply Blocks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-extract-threads-reply-blocks.yml'

permissions:
  contents: write

concurrency:
  group: threads-reply-block-extract
  cancel-in-progress: true

jobs:
  extract:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 12
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Extract reply-like DOM blocks privately
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/threads-reply-blocks-summary.json
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE' > "$OUT"
          set -euo pipefail
          export PLAYWRIGHT_BROWSERS_PATH=/home/ubuntu/agent-data/runtime/playwright-browsers
          python3 - <<'PY'
          import asyncio, hashlib, json, os, re
          from datetime import datetime, timezone
          from pathlib import Path
          from playwright.async_api import async_playwright

          URL='https://www.threads.com/@nico1e.16/post/DcWVvpwGTSh'
          PRIVATE=Path('/home/ubuntu/agent-data/runtime/vendor-reputation/threads-DcWVvpwGTSh-reply-blocks.json')

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  page=await browser.new_page(viewport={'width':1280,'height':1800})
                  response=await page.goto(URL, wait_until='domcontentloaded', timeout=60000)
                  await page.wait_for_timeout(7000)
                  # Trigger public lazy loading only.
                  for _ in range(12):
                      await page.mouse.wheel(0, 1500)
                      await page.wait_for_timeout(900)

                  candidates=await page.evaluate(r'''() => {
                    const anchors=[...document.querySelectorAll('a[href*="/@"]')];
                    const out=[];
                    const seen=new Set();
                    for (const a of anchors) {
                      const href=a.href || '';
                      const m=href.match(/threads\.com\/@([^/?#]+)/i);
                      if (!m) continue;
                      const username=decodeURIComponent(m[1]);
                      let node=a;
                      let best=null;
                      for (let depth=0; depth<10 && node; depth++, node=node.parentElement) {
                        const txt=(node.innerText||'').trim();
                        if (!txt || txt.length<8 || txt.length>1800) continue;
                        const links=[...node.querySelectorAll('a[href]')].map(x=>({text:(x.innerText||'').trim(),href:x.href}));
                        const profileLinks=links.filter(x=>/threads\.com\/@[^/?#]+(?:\/)?$/i.test(x.href));
                        const postLinks=links.filter(x=>/threads\.com\/@[^/]+\/post\//i.test(x.href));
                        // Prefer a compact ancestor that contains exactly one obvious author profile.
                        if (profileLinks.length>=1 && profileLinks.length<=3) {
                          const score=(postLinks.length?4:0) + (txt.toLowerCase().includes('reply')||txt.includes('回覆')?2:0) + (txt.length<700?2:0) - depth*0.05;
                          if (!best || score>best.score || (score===best.score && txt.length<best.text.length)) {
                            best={score,depth,text:txt,links,profileLinks,postLinks};
                          }
                        }
                      }
                      if (!best) continue;
                      const key=username+'\n'+best.text;
                      if (seen.has(key)) continue;
                      seen.add(key);
                      out.push({username,profile_url:href,text_block:best.text,depth:best.depth,links:best.links,post_links:best.postLinks});
                    }
                    return out;
                  }''')

                  # Normalize and deduplicate private evidence. No public text goes to GitHub.
                  norm=[]; seen=set()
                  for c in candidates:
                      block='\n'.join(x.strip() for x in c.get('text_block','').splitlines() if x.strip())
                      if not block: continue
                      key=(c.get('username'),block)
                      if key in seen: continue
                      seen.add(key)
                      post_links=[]
                      for x in c.get('post_links') or []:
                          href=x.get('href')
                          if href and href not in post_links: post_links.append(href)
                      norm.append({
                          'author':c.get('username'),
                          'profile_url':c.get('profile_url'),
                          'text_block':block,
                          'post_links':post_links,
                          'dom_depth':c.get('depth'),
                      })

                  # Heuristic reply candidates: exclude target author's root-only block where possible;
                  # keep candidates from other authors, and any target-author blocks with a post link different from source.
                  replies=[]
                  for c in norm:
                      author=(c.get('author') or '').lower()
                      links=c.get('post_links') or []
                      if author!='nico1e.16' or any('DcWVvpwGTSh' not in x for x in links):
                          replies.append(c)

                  observed=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
                  private={
                      'schema':'agentos.social-receipt/v0.1',
                      'capability':'social.threads.public-page.rendered-replies.read',
                      'source':URL,
                      'observed_at':observed,
                      'acquisition':{
                          'method':'playwright_public_render',
                          'authenticated':False,
                          'login_bypass':False,
                          'anti_bot_bypass':False,
                          'http_status':response.status if response else None,
                      },
                      'dom_candidates':norm,
                      'reply_candidates':replies,
                  }
                  PRIVATE.parent.mkdir(parents=True,exist_ok=True)
                  PRIVATE.write_text(json.dumps(private,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); os.chmod(PRIVATE,0o600)

                  def h(c):
                      return hashlib.sha256(((c.get('author') or '')+'\n'+(c.get('text_block') or '')).encode()).hexdigest()[:16]
                  authors={c.get('author') for c in replies if c.get('author')}
                  with_post=sum(1 for c in replies if c.get('post_links'))
                  summary={
                      'schema':'agentos.threads-reply-blocks-summary/v1',
                      'checked_at':observed,
                      'source':URL,
                      'http_status':response.status if response else None,
                      'dom_candidates':len(norm),
                      'reply_candidates':len(replies),
                      'unique_reply_authors':len(authors),
                      'reply_candidates_with_post_links':with_post,
                      'reply_candidate_hashes':[h(c) for c in replies[:50]],
                      'private_receipt_path':str(PRIVATE),
                      'token_used':False,
                      'login_attempted':False,
                      'anti_bot_bypass_attempted':False,
                      'public_comment_text_committed':False,
                  }
                  print(json.dumps(summary,ensure_ascii=False,indent=2))
                  await browser.close()
          asyncio.run(main())
          PY
          REMOTE
          python3 -m json.tool "$OUT" >/dev/null
          cat "$OUT"
      - name: Commit sanitized reply extraction summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .agentos/evidence/threads-reply-blocks-summary.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/threads-reply-blocks-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(threads): rendered reply block extraction summary'
          git push
