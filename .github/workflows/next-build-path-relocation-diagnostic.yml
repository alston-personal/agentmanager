name: Next Build Path Relocation Diagnostic

on:
  pull_request:
    branches: [core/integration]
    paths: ['.github/workflows/next-build-path-relocation-diagnostic.yml']

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect embedded build paths
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out=$(mktemp)
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' >"$out" 2>&1 <<'REMOTE'
          set -euo pipefail
          live=$(readlink -f /home/ubuntu/agent-data/runtime/dashboard/current)
          echo "live=$live"
          echo '=== embedded old staging path hits ==='
          grep -RIl --binary-files=text '/tmp/mio-dashboard-release-' "$live/.next" 2>/dev/null | head -40 || true
          echo '=== absolute path samples ==='
          grep -RIho --binary-files=text '/tmp/mio-dashboard-release-[A-Za-z0-9_-]*[^"[:space:]]*' "$live/.next" 2>/dev/null | head -40 || true
          REMOTE
          cat "$out"
          { echo '### Next build path relocation'; echo; echo '```text'; cat "$out"; echo '```'; } >/tmp/diag.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /tmp/diag.md