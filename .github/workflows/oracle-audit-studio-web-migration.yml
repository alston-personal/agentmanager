name: Oracle Audit Studio Web Migration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-audit-studio-web-migration.yml'
      - 'scripts/audit_studio_web_migration.py'

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run read-only Studio Web migration audit through AgentOS
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_studio_web_migration.py

      - name: Commit audit evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/studio-web-migration-audit.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(studio-web): complete migration surface audit'
          git push
