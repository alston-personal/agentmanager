name: Ops LeopardCat Groq Reverify
on:
  push:
    branches: [ops/leopardcat-runtime-inspect]
    paths:
      - '.github/workflows/ops-leopardcat-groq-reverify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Verify deployed Groq adapter and fallback pool
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/$(id -un)/leopardcat-tarot/website
          python3 - <<'PY'
          import os
          from pathlib import Path
          from divination.ai_gateway import (
              AIUnavailable, MASTER_EXPERIENCE_CONTRACT, MasterExperienceQualityGate,
              ZeroCostGroqGateway, ZeroCostProviderPool,
          )
          def env_value(name):
              value=os.environ.get(name)
              if value: return value
              p=Path('/home/ubuntu/agentmanager/.env')
              if not p.exists(): return None
              for raw in p.read_text(errors='replace').splitlines():
                  s=raw.strip()
                  if not s or s.startswith('#'): continue
                  if s.startswith('export '): s=s[7:].lstrip()
                  if '=' in s:
                      k,v=s.split('=',1)
                      if k.strip()==name: return v.strip().strip('"').strip("'") or None
              return None
          key=env_value('GROQ_API_KEY')
          groq=ZeroCostGroqGateway(key)
          prompt='請用臺灣正體中文，以沉穩一致的大師語氣，針對「今天適合整理思緒」給出至少120個中文字的反思式回應。不要提模型、供應商、系統或提示詞。'
          text=groq.generate(MASTER_EXPERIENCE_CONTRACT+'\n\n'+prompt)
          MasterExperienceQualityGate().validate(text)
          print('groq_transport=success')
          print('groq_chars='+str(len(text)))
          print('groq_quality=success')

          class FailingPrimary:
              provider_id='synthetic-primary'
              model='synthetic'
              def configured(self): return True
              def policy(self): return {'provider':self.provider_id,'model':self.model,'configured':True,'cost_policy':'zero-cost-required','paid_fallback':False}
              def generate(self,prompt):
                  raise AIUnavailable('synthetic_primary_failure','synthetic primary unavailable',True,{'provider':self.provider_id,'http_status':429})

          pool=ZeroCostProviderPool([FailingPrimary(), groq])
          text2=pool.generate(prompt)
          MasterExperienceQualityGate().validate(text2)
          print('provider_pool_fallback=success')
          print('fallback_chars='+str(len(text2)))
          PY
          test "$(git -C /home/$(id -un)/leopardcat-tarot rev-parse HEAD)" = '9a7221f98dd8d2f7b715b2620e273fa10be1de97'
          curl -fsS --max-time 10 http://127.0.0.1:8088/api/v1/ai-policy | python3 -c 'import json,sys; p=json.load(sys.stdin); ps=p.get("providers") or []; assert any(x.get("provider")=="groq" and x.get("configured") is True for x in ps); print("runtime_policy_groq_configured=true")'
          REMOTE
