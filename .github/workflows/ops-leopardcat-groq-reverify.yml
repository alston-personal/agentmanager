name: Ops LeopardCat Groq Reverify
on:
  push:
    branches: [ops/leopardcat-runtime-inspect]
    paths:
      - '.github/workflows/ops-leopardcat-groq-reverify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Test Groq chat with curl
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          KEY=$(python3 - <<'PY'
          from pathlib import Path
          p=Path('/home/ubuntu/agentmanager/.env')
          for raw in p.read_text(errors='replace').splitlines():
              s=raw.strip()
              if not s or s.startswith('#'): continue
              if s.startswith('export '): s=s[7:].lstrip()
              if '=' in s:
                  k,v=s.split('=',1)
                  if k.strip()=='GROQ_API_KEY':
                      print(v.strip().strip('"').strip("'"))
                      break
          PY
          )
          BODY='{"model":"openai/gpt-oss-120b","messages":[{"role":"user","content":"Reply with exactly: OK"}],"temperature":0,"max_tokens":16}'
          OUT=$(mktemp)
          CODE=$(curl -sS -o "$OUT" -w '%{http_code}' https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $KEY" \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: curl/8 leopardcat-health' \
            --data "$BODY")
          echo "curl_status=$CODE"
          python3 - "$OUT" <<'PY'
          import json,sys
          raw=open(sys.argv[1],'rb').read(1200).decode('utf-8','replace')
          try:
              d=json.loads(raw)
              print('json_body=true')
              print('response_present='+str(bool(d.get('choices'))).lower())
              if isinstance(d.get('error'),dict):
                  e=d['error']
                  print('error_type='+str(e.get('type') or ''))
                  print('error_code='+str(e.get('code') or ''))
                  print('error_message='+str(e.get('message') or '')[:500].replace('\n',' '))
          except Exception:
              print('json_body=false')
              print('body_prefix='+raw[:200].replace('\n',' '))
          PY
          rm -f "$OUT"
          REMOTE
