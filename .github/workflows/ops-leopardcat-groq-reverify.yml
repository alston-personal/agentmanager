name: Ops LeopardCat Groq Reverify
on:
  push:
    branches: [ops/leopardcat-runtime-inspect]
    paths:
      - '.github/workflows/ops-leopardcat-groq-reverify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect Groq 403 response metadata safely
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import json, os, ssl, urllib.request, urllib.error
          from pathlib import Path
          def env_value(name):
              value=os.environ.get(name)
              if value: return value
              p=Path('/home/ubuntu/agentmanager/.env')
              if not p.exists(): return None
              for raw in p.read_text(errors='replace').splitlines():
                  s=raw.strip()
                  if not s or s.startswith('#'): continue
                  if s.startswith('export '): s=s[7:].lstrip()
                  if '=' in s:
                      k,v=s.split('=',1)
                      if k.strip()==name: return v.strip().strip('"').strip("'") or None
              return None
          key=env_value('GROQ_API_KEY') or ''
          print('groq_key_present='+str(bool(key)).lower())
          req=urllib.request.Request('https://api.groq.com/openai/v1/models',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json','User-Agent':'leopardcat-health/1.0'})
          try:
              with urllib.request.urlopen(req,context=ssl.create_default_context(),timeout=20) as r:
                  print('status='+str(r.status))
                  print('content_type='+str(r.headers.get('content-type') or ''))
                  print('server='+str(r.headers.get('server') or ''))
                  print('cf_ray='+str(r.headers.get('cf-ray') or ''))
                  print('request_id='+str(r.headers.get('x-request-id') or r.headers.get('request-id') or ''))
          except urllib.error.HTTPError as e:
              print('status='+str(e.code))
              print('content_type='+str(e.headers.get('content-type') or ''))
              print('server='+str(e.headers.get('server') or ''))
              print('cf_ray='+str(e.headers.get('cf-ray') or ''))
              print('request_id='+str(e.headers.get('x-request-id') or e.headers.get('request-id') or ''))
              raw=e.read().decode('utf-8',errors='replace')[:400]
              try:
                  data=json.loads(raw)
                  err=data.get('error') if isinstance(data,dict) else None
                  if isinstance(err,dict):
                      print('error_type='+str(err.get('type') or ''))
                      print('error_code='+str(err.get('code') or ''))
              except Exception:
                  print('body_is_json=false')
          PY
          REMOTE
