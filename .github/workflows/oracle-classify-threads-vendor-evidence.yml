name: Oracle Classify Threads Vendor Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-classify-threads-vendor-evidence.yml'
      - 'scripts/classify_threads_vendor_evidence.py'

permissions:
  contents: write

concurrency:
  group: threads-vendor-evidence-classification
  cancel-in-progress: true

jobs:
  classify:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Classify private normalized Threads evidence through AgentOS
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/classify_threads_vendor_evidence.py

      - name: Commit sanitized classification summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .agentos/evidence/threads-vendor-classification-summary.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/threads-vendor-classification-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(vendors): Threads classification summary'
          git push
