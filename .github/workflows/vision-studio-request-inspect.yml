name: Vision Studio Request Inspect

on:
  push:
    branches: [core/integration]
    paths:
      - '.agentos/commands/vision-studio-request-inspect.json'

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          p=json.load(open('.agentos/commands/vision-studio-request-inspect.json',encoding='utf-8'))
          assert p.get('schema')=='agentos.vision-studio-request-inspect/v1'
          rid=str(p.get('request_id') or '')
          assert re.fullmatch(r'agentos\.vision_studio\.produce-[0-9]+-[0-9a-f]{8}',rid),rid
          print('vision_studio_request_inspect=APPROVED')
          PY
      - name: Mint OIDC credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
      - name: Inspect terminal request receipt
        shell: bash
        run: |
          set -euo pipefail
          rid="$(python3 -c "import json; print(json.load(open('.agentos/commands/vision-studio-request-inspect.json'))['request_id'])")"
          curl -fsS --max-time 15 \
            -H "Authorization: Bearer $AGENTOS_CONTROLLER_TOKEN" \
            "$AGENTOS_RUNNER_WINDOW_BASE/v1/dispatch/requests/$rid" \
            > "$RUNNER_TEMP/request.json"
          python3 - "$RUNNER_TEMP/request.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          print('vision_studio_request_state='+str(d.get('state')))
          r=d.get('receipt') or {}
          print('vision_studio_request_ok='+str(r.get('ok')).lower())
          for line in r.get('evidence') or []:
              if str(line).startswith('vision_studio_'):
                  print(line)
          print('vision_studio_request_failure_class='+str(r.get('failure_class') or ''))
          PY
