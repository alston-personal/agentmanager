name: Oracle Persona Disk Pressure Inspect
on:
  push:
    paths:
      - '.github/workflows/oracle-persona-disk-pressure-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Verify orphan persona temp clone
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          TARGET=/tmp/persona-social-data-iEskOn
          echo '=== TARGET ==='
          test -d "$TARGET" && du -sh "$TARGET" || true
          echo '=== PROCESS REFERENCES ==='
          ps -eo pid,ppid,etime,args | grep -F "$TARGET" | grep -v grep || true
          echo '=== OPEN FILES ==='
          if command -v lsof >/dev/null; then lsof +D "$TARGET" 2>/dev/null | head -n 50 || true; fi
          echo '=== DF ==='
          df -h /
          REMOTE
