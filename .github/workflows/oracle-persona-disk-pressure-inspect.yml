name: Oracle Persona Disk Pressure Inspect
on:
  push:
    paths:
      - '.github/workflows/oracle-persona-disk-pressure-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect targeted disk consumers
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          echo '=== DF ==='
          df -h /
          echo '=== TARGETED HOME SIZES ==='
          for p in             "$HOME/agent-data" "$HOME/agentmanager" "$HOME/zeus-writer"             "$HOME/.cache" "$HOME/.local" "$HOME/.npm" "$HOME/.config"             "$HOME/actions-runner" "$HOME/_work"; do
            [ -e "$p" ] || continue
            du -sh "$p" 2>/dev/null || true
          done
          echo '=== VAR TARGETS ==='
          for p in /var/log /var/cache /var/lib/docker /var/lib/containerd /var/lib/snapd; do
            [ -e "$p" ] || continue
            du -sh "$p" 2>/dev/null || true
          done
          echo '=== LARGE TMP ==='
          find /tmp -xdev -maxdepth 1 -mindepth 1 -type d -printf '%p\n' 2>/dev/null | while read -r p; do du -sh "$p" 2>/dev/null || true; done | sort -h | tail -n 30
          echo '=== JOURNAL ==='
          journalctl --disk-usage 2>&1 || true
          journalctl --user --disk-usage 2>&1 || true
          REMOTE
