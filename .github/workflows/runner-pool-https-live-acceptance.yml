name: Runner Pool HTTPS Live Acceptance

on:
  push:
    branches: [core/integration]
    paths:
      - 'agent_core/realm_server.py'
      - 'scripts/agentos_dispatch.sh'
      - '.github/workflows/runner-pool-https-live-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos
    steps:
      - uses: actions/checkout@v4

      - name: Mint GitHub OIDC Runner Window credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          echo 'github_oidc_scheduler_token=PASS'

      - name: Wait for exact Realm generation and verify Runner Window
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for _ in $(seq 1 60); do
            code="$(curl -sS -o "$RUNNER_TEMP/scheduler.json" -w '%{http_code}' --max-time 8               -H "Authorization: Bearer $AGENTOS_CONTROLLER_TOKEN"               "$AGENTOS_RUNNER_WINDOW_BASE/v1/controller/scheduler" || true)"
            if [ "$code" = 200 ] && python3 - "$RUNNER_TEMP/scheduler.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          p=d.get('runner_pool') or {}
          assert d.get('ok') is True
          assert d.get('schema')=='agentos.runner-window/v1'
          intents=d.get('intents') or []
          assert any(x.get('capability')=='browser.gui' and x.get('operation')=='smoke' for x in intents)
          p=d.get('runner_pool') or {}
          assert p.get('schema')=='agentos.runner-pool/v1'
          PY
            then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "runner_window_projection=FAIL"
            echo "last_http_code=${code:-unknown}"
            python3 -c 'import sys; from pathlib import Path; p=Path(sys.argv[1]); text=p.read_text(encoding="utf-8",errors="replace") if p.exists() else ""; print("last_response_body="+text[:1200].replace("\\n"," "))' "$RUNNER_TEMP/scheduler.json" || true
            exit 1
          fi
          echo 'runner_window_projection=PASS'

      - name: Round-trip Runner Window intent without SSH
        shell: bash
        run: |
          set -euo pipefail
          AGENTOS_DISPATCH_WAIT_SECONDS=240 bash scripts/agentos_dispatch.sh browser.gui smoke "$GITHUB_SHA"               > "$RUNNER_TEMP/roundtrip.txt"
          cat "$RUNNER_TEMP/roundtrip.txt"
          grep -q 'runner_window_dispatch=PASS' "$RUNNER_TEMP/roundtrip.txt"
          grep -q '"ok":true' "$RUNNER_TEMP/roundtrip.txt" || grep -q '"ok": true' "$RUNNER_TEMP/roundtrip.txt"
          echo 'runner_window_https_roundtrip=PASS'
