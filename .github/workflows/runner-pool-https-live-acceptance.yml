name: Runner Pool HTTPS Live Acceptance

on:
  push:
    branches: [core/integration]
    paths:
      - 'agent_core/realm_server.py'
      - 'scripts/submit_agentos_scheduler_request_https.sh'
      - '.github/workflows/runner-pool-https-live-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AGENTOS_SCHEDULER_BASE: https://studio.milkcat.org/dashboard/api/agentos
    steps:
      - uses: actions/checkout@v4

      - name: Mint GitHub OIDC scheduler credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          echo 'github_oidc_scheduler_token=PASS'

      - name: Wait for exact Realm generation and verify HTTPS scheduler
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for _ in $(seq 1 60); do
            code="$(curl -sS -o "$RUNNER_TEMP/scheduler.json" -w '%{http_code}' --max-time 8               -H "Authorization: Bearer $AGENTOS_CONTROLLER_TOKEN"               "$AGENTOS_SCHEDULER_BASE/v1/controller/scheduler" || true)"
            if [ "$code" = 200 ] && python3 - "$RUNNER_TEMP/scheduler.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          p=d.get('runner_pool') or {}
          assert d.get('ok') is True
          assert p.get('schema')=='agentos.runner-pool/v1'
          workers=p.get('workers') or {}
          assert {'oracle-control','oracle-social-1','oracle-social-2','oracle-gui','oracle-build','agentos-router'} <= set(workers)
          PY
            then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "https_scheduler_projection=FAIL"
            echo "last_http_code=${code:-unknown}"
            python3 - "$RUNNER_TEMP/scheduler.json" <<'PY' || true
import sys
from pathlib import Path
p=Path(sys.argv[1])
text=p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
print('last_response_body='+text[:1200].replace('\n',' '))
PY
            exit 1
          fi
          echo 'https_scheduler_projection=PASS'

      - name: Round-trip typed scheduler request without SSH
        shell: bash
        run: |
          set -euo pipefail
          AGENTOS_SCHEDULER_WAIT_SECONDS=240             bash scripts/submit_agentos_scheduler_request_https.sh               agentos.gui_worker.smoke "$GITHUB_SHA"               > "$RUNNER_TEMP/roundtrip.txt"
          cat "$RUNNER_TEMP/roundtrip.txt"
          grep -q 'scheduler_request=PASS' "$RUNNER_TEMP/roundtrip.txt"
          grep -q '"ok":true' "$RUNNER_TEMP/roundtrip.txt" || grep -q '"ok": true' "$RUNNER_TEMP/roundtrip.txt"
          echo 'runner_pool_https_roundtrip=PASS'
