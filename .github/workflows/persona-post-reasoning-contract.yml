name: Persona Post Reasoning Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/persona_post_intent_generator.py'
      - 'scripts/persona_reply_intent_generator.py'
      - 'scripts/persona_social_executor.py'
      - 'tests/test_persona_post_reasoning.py'
      - 'tests/test_persona_reply_reasoning.py'
      - 'tests/test_mio_reply_fairness.py'
      - '.github/workflows/persona-post-reasoning-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/persona_post_intent_generator.py'
      - 'scripts/persona_reply_intent_generator.py'
      - 'scripts/persona_social_executor.py'
      - 'tests/test_persona_post_reasoning.py'
      - 'tests/test_persona_reply_reasoning.py'
      - 'tests/test_mio_reply_fairness.py'
      - '.github/workflows/persona-post-reasoning-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify reasoning failover without live providers or public writes
        run: python3 -m unittest tests.test_persona_post_reasoning tests.test_persona_reply_reasoning tests.test_mio_reply_fairness -v
