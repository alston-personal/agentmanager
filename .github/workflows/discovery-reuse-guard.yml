name: Discovery Reuse Guard

on:
  pull_request:
    paths:
      - 'agent_core/discovery_reuse.py'
      - 'agent_core/project_knowledge.py'
      - 'agent_core/resolve_facade.py'
      - 'tests/test_discovery_reuse.py'
      - 'tests/test_resolve_discovery.py'
      - '.github/workflows/discovery-reuse-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery-reuse-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Run discovery reuse regression suite
        run: |
          python -m unittest \
            tests.test_discovery_reuse \
            tests.test_resolve_discovery \
            tests.test_resolve_facade \
            -v
