name: Oracle MBPR Threads Native Read
on:
  push:
    branches:
      - core/integration
    paths:
      - '.agentos/commands/mbpr-threads-native-read.json'
permissions:
  contents: read
jobs:
  read:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 3
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Threads Messages into private Realm receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,hashlib
          from agent_core.realm_fabric import RealmFabricStore
          cmd=json.load(open('.agentos/commands/mbpr-threads-native-read.json',encoding='utf-8'))
          assert cmd.get('node_id')=='mbpr'
          tid='mbpr-threads-native-read-'+str(int(time.time()))
          py='/Users/tengweihuang/Library/Application Support/AgentOS/versions/18be78bbc0ccc94189f821e66da09ed4d41b268d/venv/bin/python'
          code="from agentos_node.macos_chrome_threads import read_visible_threads_messages; import json; r=read_visible_threads_messages(20000); print(json.dumps(r,ensure_ascii=False))"
          task={'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':py,'argv':['-c',code],'cwd':'/Users/tengweihuang/AgentOS','timeout_seconds':25,'cognition_ids_used':[]}
          store=RealmFabricStore(); store.queue_task('mbpr',task)
          for _ in range(40):
              r=store.get_receipt(tid)
              if r:
                  out=str(r.get('stdout') or '')
                  if r.get('ok') is not True or int(r.get('returncode') or 0)!=0:
                      err=(str(r.get('stderr') or '')+' '+str(r.get('error') or '')).lower()
                      if ('javascript' in err and ('apple' in err or 'execute' in err or 'turned off' in err or 'disabled' in err)):
                          kind='CHROME_JS_FROM_APPLE_EVENTS_DISABLED'
                      elif 'not authorized' in err or 'not permitted' in err or '-1743' in err:
                          kind='AUTOMATION_PERMISSION'
                      elif 'timeout' in err or 'timed out' in err:
                          kind='TIMEOUT'
                      else:
                          kind='OTHER'
                      print('threads_native_read=ERROR')
                      print('threads_native_read_error_type='+kind)
                      raise SystemExit(2)
                  digest=hashlib.sha256(out.encode()).hexdigest()[:16]
                  open('/tmp/threads-native-read.json','w',encoding='utf-8').write(out)
                  print('threads_native_read=PASS')
                  print('threads_native_read_receipt='+tid)
                  print('threads_native_read_digest='+digest)
                  print('threads_native_read_bytes='+str(len(out.encode())))
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('threads native read timeout')
          PY

      - name: Upload private Threads read artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: threads-native-read
          path: /tmp/threads-native-read.json
          retention-days: 1
          if-no-files-found: error
