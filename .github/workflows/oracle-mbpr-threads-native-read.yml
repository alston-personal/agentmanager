name: Oracle MBPR Threads Native Read
on:
  push:
    branches:
      - core/integration
    paths:
      - '.agentos/commands/mbpr-threads-native-read.json'
      - '.github/workflows/oracle-mbpr-threads-native-read.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Read Threads Messages from MBPR existing Chrome through Realm
        shell: bash
        run: |
          set -euo pipefail
          RAW="$RUNNER_TEMP/mbpr-native-read-raw.txt"
          OUT="$RUNNER_TEMP/threads-native-read.json"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o ConnectionAttempts=3 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s > "$RAW" <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          python3 - <<'PY'
          import time
          from agent_core.realm_fabric import RealmFabricStore

          tid='mbpr-threads-native-read-'+str(int(time.time()))
          py='/Users/tengweihuang/Library/Application Support/AgentOS/versions/18be78bbc0ccc94189f821e66da09ed4d41b268d/venv/bin/python'
          code="from agentos_node.macos_chrome_threads import read_visible_threads_messages; import json; r=read_visible_threads_messages(20000); print(json.dumps(r,ensure_ascii=False))"
          task={'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':py,'argv':['-c',code],'cwd':'/Users/tengweihuang/AgentOS','timeout_seconds':25,'cognition_ids_used':[]}
          store=RealmFabricStore()
          store.queue_task('mbpr',task)
          for _ in range(45):
              r=store.get_receipt(tid)
              if r:
                  if r.get('ok') is not True or int(r.get('returncode') or 0)!=0:
                      print('threads_native_read_remote=ERROR')
                      raise SystemExit(2)
                  out=str(r.get('stdout') or '').strip()
                  print('threads_native_read_payload='+out)
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('threads native read timeout')
          PY
          REMOTE

          python3 - "$RAW" "$OUT" <<'PY'
          import hashlib,json,sys
          raw=open(sys.argv[1],encoding="utf-8").read().splitlines()
          line=next((x for x in reversed(raw) if x.startswith("threads_native_read_payload=")),None)
          assert line,line
          payload=line.split("=",1)[1]
          obj=json.loads(payload)
          open(sys.argv[2],"w",encoding="utf-8").write(json.dumps(obj,ensure_ascii=False)+"\n")
          digest=hashlib.sha256(payload.encode()).hexdigest()[:16]
          print("threads_native_read=PASS")
          print("threads_native_read_found="+str(bool(obj.get("found"))).lower())
          print("threads_native_read_digest="+digest)
          print("threads_native_read_bytes="+str(len(payload.encode())))
          PY
      - name: Upload private Threads read artifact
        uses: actions/upload-artifact@v4
        with:
          name: threads-native-read
          path: ${{ runner.temp }}/threads-native-read.json
          retention-days: 1
          if-no-files-found: error
