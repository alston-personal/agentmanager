name: Inspect Mio DM Message Receipts
on:
  push:
    paths:
      - '.github/workflows/inspect-mio-dm-message-receipts.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect bounded receipt set
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          ROOT=/home/ubuntu/agent-data/runtime/social/persona/sunlake-milkcat/dm-receipts
          for f in "$ROOT"/*.json; do
            [ -e "$f" ] || continue
            if grep -q 'f7bf47d3a5249e74fd9606e1e814c50b' "$f"; then
              echo "--- $f"
              cat "$f"
            fi
          done
          REMOTE
