name: MetaShield Fix Historical Recovery v1.0.68

on:
  push:
    paths:
      - '.github/workflows/metashield-fix-historical-recovery-v1068.yml'
      - 'scripts/metashield_fix_historical_recovery_v1068.py'
      - 'scripts/metashield_deploy_historical_recovery_v1068.sh'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Copy patch and validator
        shell: bash
        run: |
          set -euo pipefail
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/metashield_fix_historical_recovery_v1068.py scripts/metashield_deploy_historical_recovery_v1068.sh "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"
      - name: Deploy and validate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" "bash /tmp/metashield_deploy_historical_recovery_v1068.sh" | tee .agentos/evidence/metashield-historical-recovery-v1068.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metashield-historical-recovery-v1.0.68
          path: .agentos/evidence/metashield-historical-recovery-v1068.txt
          if-no-files-found: error
