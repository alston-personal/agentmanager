name: Oracle Legacy Dashboard Usage

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/oracle-legacy-dashboard-usage.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ORACLE_HOST: ${{ vars.ORACLE_HOST || '161.33.24.170' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect legacy dashboard usage
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$ORACLE_HOST" bash -s <<'REMOTE'
          set -u
          ROOT="$HOME/agent-data/releases/dashboard"
          echo '=== disk ==='
          df -h /
          echo '=== service ==='
          systemctl --user is-active agentos-dashboard.service 2>/dev/null || true
          systemctl --user is-enabled agentos-dashboard.service 2>/dev/null || true
          systemctl --user cat agentos-dashboard.service 2>/dev/null || true
          echo '=== runtime links ==='
          find "$HOME/agent-data/runtime/dashboard" -mindepth 1 -maxdepth 1 -printf '%y\t%f\t%l\n' 2>/dev/null || true
          echo '=== process cwd under legacy root ==='
          for p in /proc/[0-9]*; do
            cwd="$(readlink -f "$p/cwd" 2>/dev/null || true)"
            case "$cwd" in
              "$ROOT"/*) printf '%s\t%s\n' "${p##*/}" "$cwd" ;;
            esac
          done
          echo '=== child sizes KB ==='
          find "$ROOT" -mindepth 1 -maxdepth 1 -print0 2>/dev/null |
            xargs -0 -r -P 8 -n 1 bash -c '
              p="$1"; out="$(timeout 20 du -x -sk "$p" 2>/dev/null || true)"
              [ -n "$out" ] && printf "OK\t%s\n" "$out" || printf "TIMEOUT\t%s\n" "$p"
            ' _ | sort -t$'\t' -k2,2nr | head -n 200 || true
          echo '=== newest children ==='
          find "$ROOT" -mindepth 1 -maxdepth 1 -printf '%T@\t%TY-%Tm-%TdT%TH:%TM:%TS\t%f\n' 2>/dev/null | sort -nr | head -n 100 || true
          REMOTE
