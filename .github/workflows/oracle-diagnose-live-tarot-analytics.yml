name: Oracle Diagnose Live Tarot Analytics Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-diagnose-live-tarot-analytics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Inspect Tarot DB, protected API and Dashboard private read
        shell: bash
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "$DEPLOY_USER@127.0.0.1" bash -s <<'REMOTE'
          set -euo pipefail
          sudo -n systemctl is-active --quiet milkcat-leopardcat-analytics.service
          echo 'tarot_service=active'

          sudo -n -u ubuntu python3 - <<'PY'
          import json, os, pathlib, sqlite3, stat, urllib.request
          db=pathlib.Path('/home/ubuntu/leopardcat-tarot/website/data/analytics.sqlite3')
          token_file=pathlib.Path('/home/ubuntu/.config/milkcat/leopardcat-analytics-token')
          assert db.is_file(), 'tarot_db_missing'
          assert token_file.is_file() and not token_file.is_symlink(), 'tarot_token_missing'
          st=token_file.lstat()
          assert st.st_uid==os.getuid() and (st.st_mode & 0o077)==0, 'tarot_token_permissions_invalid'

          with sqlite3.connect(db) as conn:
              total=conn.execute('select count(*) from reading_analytics').fetchone()[0]
              by_date=dict(conn.execute('select occurred_date,count(*) from reading_analytics group by occurred_date order by occurred_date').fetchall())
              latest=conn.execute('select max(occurred_date) from reading_analytics').fetchone()[0]
              modes=dict(conn.execute("select coalesce(draw_mode,'unknown'),count(*) from reading_analytics group by coalesce(draw_mode,'unknown')").fetchall())
              spreads=dict(conn.execute("select coalesce(spread,'unknown'),count(*) from reading_analytics group by coalesce(spread,'unknown') order by count(*) desc").fetchall())
          print('tarot_db_total_readings='+str(total))
          print('tarot_db_latest_date='+str(latest or 'NONE'))
          print('tarot_db_mtime_epoch='+str(int(db.stat().st_mtime)))
          print('tarot_db_by_date='+json.dumps(by_date,sort_keys=True))
          print('tarot_db_by_draw_mode='+json.dumps(modes,sort_keys=True))
          print('tarot_db_by_spread='+json.dumps(spreads,sort_keys=True))

          token=token_file.read_text(encoding='utf8').strip()
          url='http://127.0.0.1:8088/api/v1/analytics/summary?days=30'
          req=urllib.request.Request(url,headers={'X-Analytics-Token':token})
          with urllib.request.urlopen(req,timeout=8) as response:
              payload=json.load(response)
              assert response.status==200
          print('tarot_api_total_readings='+str(payload.get('total_readings')))
          print('tarot_api_by_date='+json.dumps(payload.get('by_date') or {},sort_keys=True))
          print('tarot_api_by_draw_mode='+json.dumps(payload.get('by_draw_mode') or {},sort_keys=True))
          print('tarot_api_spread_draw_mode_keys='+','.join(sorted((payload.get('by_spread_draw_mode') or {}).keys())))
          assert payload.get('total_readings')==total, 'tarot_api_db_count_mismatch'
          print('tarot_api_db_consistency=PASS')
          PY

          # Verify Dashboard process and private credential accessibility without browser auth.
          PID=$(ss -H -ltnp 'sport = :3000' 2>/dev/null | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | sort -u | head -1)
          test -n "$PID"
          printf 'dashboard_listener_cwd='; readlink -f "/proc/$PID/cwd"
          test "$(stat -c '%u' "/proc/$PID")" = "$(id -u)"
          sudo -n -u ubuntu python3 - <<'PY'
          import json, pathlib, urllib.request
          token=pathlib.Path('/home/ubuntu/.config/milkcat/leopardcat-analytics-token').read_text().strip()
          req=urllib.request.Request('http://127.0.0.1:8088/api/v1/analytics/summary?days=30',headers={'X-Analytics-Token':token})
          with urllib.request.urlopen(req,timeout=8) as response:
              payload=json.load(response)
          print('dashboard_identity_tarot_total_readings='+str(payload.get('total_readings')))
          print('dashboard_identity_tarot_read=PASS')
          PY

          for route in /dashboard/api/auth/session /dashboard/api/admin/usage /dashboard/admin/usage; do
            code=$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' --max-time 8 "http://127.0.0.1:3000$route" || true)
            echo "dashboard_route=$route status=$code"
          done
          echo 'tarot_live_analytics_diagnosis=COMPLETE'
          REMOTE
