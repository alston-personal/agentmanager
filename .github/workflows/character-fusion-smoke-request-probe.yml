name: Character Fusion Smoke Request Probe

on:
  pull_request:
    branches: [core/integration]
    paths:
      - '.github/workflows/character-fusion-smoke-request-probe.yml'
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/character-fusion-smoke-request-probe.yml'

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -Fq 'character_fusion_smoke_request_probe=PASS' .github/workflows/character-fusion-smoke-request-probe.yml

  probe:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Mint scheduler credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Probe request and scheduler
        shell: bash
        run: |
          set -euo pipefail
          base="https://studio.milkcat.org/dashboard/api/agentos"
          request_id="agentos.character_fusion.smoke-1791867109-c89d298b"
          for path in             "v1/dispatch/requests/$request_id"             "v1/controller/scheduler"; do
            code="$(curl -sS -o "$RUNNER_TEMP/out.json" -w '%{http_code}' --max-time 20               -H "Authorization: Bearer $TOKEN" "$base/$path" || true)"
            echo "probe_path=$path http=$code"
            if [ "$code" = 200 ]; then
              python3 - "$RUNNER_TEMP/out.json" <<'PY'
          import json,sys
          raw=json.load(open(sys.argv[1],encoding='utf-8'))
          def scrub(v):
              if isinstance(v,dict):
                  return {k:scrub(x) for k,x in v.items() if k.lower() not in {'token','secret','authorization'}}
              if isinstance(v,list):
                  return [scrub(x) for x in v]
              if isinstance(v,str) and len(v)>5000:
                  return v[:5000]
              return v
          print(json.dumps(scrub(raw),ensure_ascii=False)[:12000])
          PY
            fi
          done
          echo "character_fusion_smoke_request_probe=PASS"
          # probe-current-20261013-1425-detail
