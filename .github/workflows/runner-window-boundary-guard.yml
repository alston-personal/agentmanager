name: Runner Window Boundary Guard

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/**'
      - 'scripts/check_runner_window_boundary.py'
      - 'scripts/agentos_dispatch.sh'
      - 'agent_core/runner_window.py'
  pull_request:
    branches: [core/integration]
    paths:
      - '.github/workflows/**'
      - 'scripts/check_runner_window_boundary.py'
      - 'scripts/agentos_dispatch.sh'
      - 'agent_core/runner_window.py'

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/agentos_dispatch.sh
      - run: python3 scripts/check_runner_window_boundary.py


  layoutlib-parity-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/integration
      - name: Mint scheduler credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
import json,sys
v=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
assert v.count('.')==2
print(v)
PY
)"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
      - name: Submit bounded LayoutLib parity job
        id: submit
        shell: bash
        env:
          AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos
        run: |
          set -euo pipefail
          AGENTOS_DISPATCH_WAIT_SECONDS=180 bash scripts/agentos_dispatch.sh             agentos.executor job.submit "$GITHUB_SHA"             job_type=layoutlib.production.parity.inspect             | tee "$RUNNER_TEMP/submit.txt"
          job_id="$(python3 - "$RUNNER_TEMP/submit.txt" <<'PY'
import json,sys
docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
assert docs
receipt=docs[-1].get('receipt') or {}
job=receipt.get('executor_job') or {}
assert receipt.get('ok') is True, receipt
v=str(job.get('job_id') or '')
assert v.startswith('action-'), job
print(v)
PY
)"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
      - name: Inspect bounded LayoutLib parity receipt
        shell: bash
        env:
          AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos
          JOB_ID: ${{ steps.submit.outputs.job_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            out="$RUNNER_TEMP/inspect-$i.txt"
            AGENTOS_DISPATCH_WAIT_SECONDS=90 bash scripts/agentos_dispatch.sh               agentos.executor job.inspect "$GITHUB_SHA"               job_id="$JOB_ID" > "$out"
            if python3 - "$out" <<'PY'
import json,sys
docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
if not docs:
    raise SystemExit(1)
receipt=docs[-1].get('receipt') or {}
if receipt.get('executor_job_state')!='completed':
    raise SystemExit(1)
job=receipt.get('executor_job_receipt')
assert isinstance(job,dict), job
safe={k:job.get(k) for k in (
    'job_id','job_type','project_id','executor_class','capability',
    'executor_available','routable','authorized','successful','credential_exposed',
    'verdict','classification','observed_head','layoutlib_release',
    'layoutlib_manifest_files','layoutlib_matching_files','layoutlib_public_http',
    'layoutlib_parity'
) if k in job}
print('LAYOUTLIB_PARITY_RECEIPT='+json.dumps(safe,sort_keys=True))
assert job.get('job_type') == 'layoutlib.production.parity.inspect'
assert job.get('project_id') == 'layoutlib'
assert job.get('executor_available') is True
assert job.get('routable') is True
assert job.get('authorized') is True
assert job.get('successful') is True
assert job.get('classification') == 'LAYOUTLIB_PRODUCTION_PARITY_EXACT'
assert job.get('layoutlib_release') == 'v0.7.9'
assert job.get('layoutlib_manifest_files') == 7
assert job.get('layoutlib_matching_files') == 7
assert job.get('layoutlib_public_http') == 200
assert job.get('layoutlib_parity') == 'EXACT'
assert job.get('credential_exposed') is False
PY
            then
              exit 0
            fi
            sleep 3
          done
          echo "layoutlib_parity_receipt_timeout=1" >&2
          exit 1
