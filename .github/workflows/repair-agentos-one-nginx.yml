name: Audit AgentOS Port Registry and Runtime
on:
  workflow_dispatch:
  push:
    branches: [fix/one-nginx-upstream-3041]
    paths:
      - '.github/workflows/repair-agentos-one-nginx.yml'
      - 'scripts/audit_agentos_ports.py'
      - 'scripts/converge_agentos_ports.py'
      - 'scripts/restore_if_tv_station.py'
      - 'scripts/restore_layoutlab_api.py'
      - 'scripts/reconcile_verified_ports.py'
      - 'scripts/failover_agentos_gateway.py'
permissions:
  contents: read
concurrency:
  group: oracle-one-port-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Read-only port and configuration inventory
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          python3 -m py_compile scripts/audit_agentos_ports.py
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@127.0.0.1" \
            'sudo -n python3 -' < scripts/audit_agentos_ports.py | tee port-runtime-audit.json
          python3 -m json.tool port-runtime-audit.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: agentos-port-runtime-audit
          path: port-runtime-audit.json
          retention-days: 7


  converge:
    if: github.event_name == 'workflow_dispatch'
    needs: audit
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Reconcile registered services through existing systemd units
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@127.0.0.1" \
            'sudo -n python3 -' < scripts/converge_agentos_ports.py | tee converge-receipt.json
          python3 -m json.tool converge-receipt.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: agentos-port-convergence
          path: converge-receipt.json
          retention-days: 7

  restore-iftv:
    if: github.event_name == 'workflow_dispatch'
    needs: audit
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Restore IF TV existing Next.js 3005 and verify public /iftv
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@127.0.0.1" \
            'sudo -n python3 -' < scripts/restore_if_tv_station.py

  restore-layoutlab-api:
    if: github.event_name == 'workflow_dispatch'
    needs: audit
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Restore registered LayoutLab API 8800 without public routing change
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@127.0.0.1" \
            'sudo -n python3 -' < scripts/restore_layoutlab_api.py

  reconcile-verified-ports:
    needs: audit
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Register verified persistent service ports
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@127.0.0.1" \
            'sudo -n python3 -' < scripts/reconcile_verified_ports.py
