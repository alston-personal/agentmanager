name: Oracle Legacy Dashboard Release Retention

on:
  push:
    branches: [core/integration]
    paths:
      - 'scripts/prune_dashboard_legacy_releases.sh'

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ORACLE_HOST: ${{ vars.ORACLE_HOST || '161.33.24.170' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Install and run legacy retention
        shell: bash
        run: |
          set -euo pipefail
          scp -P "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            scripts/prune_dashboard_legacy_releases.sh \
            "$DEPLOY_USER@$ORACLE_HOST:/tmp/prune-dashboard-legacy-releases.sh"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$ORACLE_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          install -m 0755 /tmp/prune-dashboard-legacy-releases.sh "$HOME/.local/bin/prune-dashboard-legacy-releases"
          LEGACY_DASHBOARD_KEEP_APPS=4 LEGACY_DASHBOARD_KEEP_USAGE=2 "$HOME/.local/bin/prune-dashboard-legacy-releases"
          REMOTE
