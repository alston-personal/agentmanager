name: Oracle Provision Role Runners

on:
  push:
    branches:
      - core/integration
    paths:
      - '.github/workflows/oracle-provision-role-runners.yml'
      - 'scripts/install_oracle_role_runners_user.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-runner-pool-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Install role runners from exact Core generation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" \
            bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          CORE_SHA="$1"
          REPO=/home/ubuntu/agentmanager
          TMP=/tmp/install_oracle_role_runners_user.sh
          git -C "$REPO" fetch --no-tags origin "$CORE_SHA" >/dev/null
          git -C "$REPO" show "$CORE_SHA:scripts/install_oracle_role_runners_user.sh" > "$TMP"
          chmod 700 "$TMP"
          "$TMP"
          rm -f "$TMP"
          REMOTE

      - name: Verify role services and bounded resource policy
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          for name in oracle-control oracle-social-1 oracle-social-2 oracle-gui; do
            unit="$(systemctl list-unit-files 'actions.runner.*.service' --no-legend | awk '{print $1}' | grep -F ".$name.service" | head -n1)"
            test -n "$unit"
            systemctl is-active --quiet "$unit"
            echo "role_runner_verify=$name:$unit:active"
            systemctl show "$unit" -p CPUQuotaPerSecUSec -p MemoryHigh -p MemoryMax --no-pager
          done
          echo "role_runner_pool_verify=PASS"
          REMOTE

# role-runner convergence retrigger: chatgpt-web-bridge
