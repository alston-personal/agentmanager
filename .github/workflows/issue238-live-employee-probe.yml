name: Issue 238 Live Employee Probe

on:
  push:
    branches:
      - ops/issue-238-live-employee-probe
    paths:
      - ".github/workflows/issue238-live-employee-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Probe relay duplicate submissions and Employee lifecycle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          cd "$ROOT"
          set -a
          source .env
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          DATA_ROOT="${AGENT_DATA_ROOT:-${AGENT_DATA_DIR:-$HOME/agent-data}}"
          ACTION_RUNTIME="${AGENTOS_ACTION_RUNTIME_ROOT:-$HOME/.local/share/agentos/action-runtime}"
          echo "checkout_sha=$(git rev-parse HEAD)"
          if [ -e "$ACTION_RUNTIME/.git" ]; then echo "action_runtime_sha=$(git -C "$ACTION_RUNTIME" rev-parse HEAD)"; fi
          for svc in agentos-action-relay.service agentos-core-supervisor.service agentos-employee-wake-node.service agentos-employee-worker-host.service; do
            echo "$svc=$(systemctl --user is-active "$svc" 2>/dev/null || true)"
          done

          /usr/bin/sg agentos -c "python3 - '$DATA_ROOT'" <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          targets={'zeus-writer','youtube-ai-manager','zeus-writer-continuation-v1','youtube-ai-manager-scan-v1'}
          safe={'schema','status','state','employee_id','assignment_id','wake_id','wake_attempt_id','presence_generation','expected_lease_generation','lease_generation','lease_id','node_id','runner_kind','adapter_id','thread_head','transport','dispatch_performed','task_id','updated_at','created_at','expires_at','credential_exposed','session_identity_exposed','outcome','replayed'}

          for aid in ('zeus-writer-continuation-v1','youtube-ai-manager-scan-v1'):
              p=root/'employee-runtime/assignments'/f'{aid}.json'
              if p.is_file():
                  d=json.loads(p.read_text())
                  print('assignment='+json.dumps({k:d.get(k) for k in safe if k in d},sort_keys=True))

          for surface in (root/'employee-runtime/supervisor',root/'employee-wakes',root/'employee-worker-host',root/'employee-worker-state'):
              if not surface.exists(): continue
              for p in sorted(surface.rglob('*.json'),key=lambda x:x.stat().st_mtime,reverse=True)[:40]:
                  try:d=json.loads(p.read_text())
                  except Exception:continue
                  if not isinstance(d,dict):continue
                  if not any(t in json.dumps(d,sort_keys=True) for t in targets):continue
                  print('lifecycle='+json.dumps({'path':str(p.relative_to(root)),'fields':{k:d.get(k) for k in safe if k in d}},sort_keys=True))

          relay=root/'runtime/action-relay'
          print('--- action relay spool safe projection ---')
          for bucket in ('inbox','processing','receipts','quarantine'):
              d=relay/bucket
              files=sorted(d.glob('action-*.json'),key=lambda p:p.stat().st_mtime,reverse=True)[:30] if d.exists() else []
              print(f'spool_{bucket}_count={len(files)}')
              for p in files:
                  try:x=json.loads(p.read_text())
                  except Exception:continue
                  action=x.get('action')
                  params=x.get('params') if isinstance(x.get('params'),dict) else {}
                  req=params.get('request') if isinstance(params.get('request'),dict) else {}
                  if action!='agentos.runtime.converge' and x.get('action')!='agentos.runtime.converge':
                      continue
                  print('relay_record='+json.dumps({
                      'bucket':bucket,
                      'capsule_id':x.get('capsule_id') or p.stem,
                      'action':action,
                      'request_id':x.get('request_id') or req.get('request_id'),
                      'source_commit':x.get('source_commit') or req.get('source_commit'),
                      'status':x.get('status'),
                      'classification':x.get('classification'),
                      'outcome':x.get('outcome'),
                      'replayed':x.get('replayed'),
                  },sort_keys=True))
          PY

          echo "--- recent service transitions ---"
          journalctl --user -u agentos-core-supervisor.service -u agentos-employee-worker-host.service -n 60 --no-pager 2>/dev/null \
            | grep -E 'Starting|Started|Stopping|Stopped|Failed' || true
          REMOTE
