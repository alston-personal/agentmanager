name: Issue 238 Live Employee Probe

on:
  push:
    branches:
      - ops/issue-238-live-employee-probe
    paths:
      - ".github/workflows/issue238-live-employee-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
      TARGET_SHA: 28be69cb671fcf8cedd5abc8864dda88c4b03dd6
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Stage exact repair generation and rehash fabric
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" "$TARGET_SHA" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          TARGET="$2"
          cd "$ROOT"
          git fetch --no-tags origin core/integration >/dev/null 2>&1
          [ "$(git rev-parse FETCH_HEAD)" = "$TARGET" ] || { echo "target_ref_mismatch"; exit 20; }
          [ -z "$(git status --porcelain --untracked-files=no)" ] || { echo "tracked_checkout_not_clean"; exit 21; }
          git checkout --detach --force "$TARGET" >/dev/null
          [ "$(git rev-parse HEAD)" = "$TARGET" ] || { echo "checkout_head_mismatch"; exit 22; }
          echo "repair_generation_checkout=PASS"
          echo "checkout_sha=$(git rev-parse HEAD)"
          set -a
          source .env
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          DATA_ROOT="${AGENT_DATA_ROOT:-${AGENT_DATA_DIR:-$HOME/agent-data}}"
          /usr/bin/sg agentos -c "python3 - '$DATA_ROOT/realm/fabric.json'" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          raw=p.read_bytes()
          text=raw.decode('utf-8')
          decoder=json.JSONDecoder()
          first,end=decoder.raw_decode(text,0)
          prefix=text[:end].encode('utf-8')
          tail=text[end:]
          print('fabric_file_sha256='+hashlib.sha256(raw).hexdigest())
          print('fabric_prefix_sha256='+hashlib.sha256(prefix).hexdigest())
          print('fabric_prefix_schema='+str(first.get('schema') if isinstance(first,dict) else None))
          print('fabric_prefix_realm='+str(first.get('realm_id') if isinstance(first,dict) else None))
          print('fabric_tail_chars='+str(len(tail)))
          print('fabric_tail_nonwhitespace='+str(bool(tail.strip())).lower())
          PY
          REMOTE
