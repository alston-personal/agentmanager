name: Issue 238 Live Employee Probe

on:
  push:
    branches:
      - ops/issue-238-live-employee-probe
    paths:
      - ".github/workflows/issue238-live-employee-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Preserve exact drift and restore canonical checkout
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          EXPECTED_HEAD="28be69cb671fcf8cedd5abc8864dda88c4b03dd6"
          EXPECTED_BASELINE_SHA="e4b1033e400cd3a8b1f7fa5590f72363418590ebce43ca741cece35bdc2f62b2"
          EXPECTED_SCANNER_SHA="ac149392e673955896dfd44212f9f114ed5e0f6e98fd4602cd8757ba93588c0b"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(sha256sum .secrets.baseline | awk '{print $1}')" = "$EXPECTED_BASELINE_SHA"
          test "$(sha256sum scripts/detect_secrets_scanner.py | awk '{print $1}')" = "$EXPECTED_SCANNER_SHA"
          STATUS="$(git status --porcelain=v1 --untracked-files=no)"
          test "$STATUS" = $'M  .secrets.baseline\n M scripts/detect_secrets_scanner.py'
          DATA_ROOT="${AGENT_DATA_ROOT:-${AGENT_DATA_DIR:-$HOME/agent-data}}"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="$DATA_ROOT/runtime/backups/checkout-drift/security-scanner-$STAMP"
          mkdir -p "$BACKUP/files/scripts"
          cp -p .secrets.baseline "$BACKUP/files/.secrets.baseline"
          cp -p scripts/detect_secrets_scanner.py "$BACKUP/files/scripts/detect_secrets_scanner.py"
          git diff --cached --binary -- .secrets.baseline scripts/detect_secrets_scanner.py > "$BACKUP/staged.patch"
          git diff --binary -- .secrets.baseline scripts/detect_secrets_scanner.py > "$BACKUP/unstaged.patch"
          {
            echo "head=$EXPECTED_HEAD"
            echo "baseline_sha256=$EXPECTED_BASELINE_SHA"
            echo "scanner_sha256=$EXPECTED_SCANNER_SHA"
            echo "status_begin"
            printf '%s\n' "$STATUS"
            echo "status_end"
          } > "$BACKUP/metadata.txt"
          test -s "$BACKUP/files/.secrets.baseline"
          test -s "$BACKUP/files/scripts/detect_secrets_scanner.py"
          test -s "$BACKUP/staged.patch"
          test -s "$BACKUP/unstaged.patch"
          git restore --staged -- .secrets.baseline
          git restore --worktree -- .secrets.baseline scripts/detect_secrets_scanner.py
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          echo "checkout_drift_backup=$BACKUP"
          echo "checkout_clean=true"
          REMOTE
