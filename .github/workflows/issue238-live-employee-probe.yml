name: Issue 238 Live Employee Probe

on:
  push:
    branches:
      - ops/issue-238-live-employee-probe
    paths:
      - ".github/workflows/issue238-live-employee-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Measure delivery candidate starvation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/home/ubuntu/agent-data/employee-runtime/supervisor')
          intents=root/'intents'
          deliveries=root/'deliveries'
          terminal={'claimed','terminal_observed','superseded'}
          rows=[]
          for p in sorted(intents.glob('reconcile_*.json')):
              rid=p.stem
              d=deliveries/(rid+'.json')
              state=None
              employee=None
              assignment=None
              if d.exists():
                  obj=json.loads(d.read_text(encoding='utf-8'))
                  state=obj.get('status')
                  employee=obj.get('employee_id')
                  assignment=obj.get('assignment_id')
              if state in terminal:
                  continue
              rows.append((rid,state,employee,assignment))
          print('nonterminal_count='+str(len(rows)))
          for i,row in enumerate(rows[:24],1):
              print('candidate='+json.dumps({'rank':i,'reconcile_id':row[0],'status':row[1],'employee_id':row[2],'assignment_id':row[3]},sort_keys=True))
          for i,row in enumerate(rows,1):
              if row[2] in {'zeus-writer','youtube-ai-manager'}:
                  print('product_rank='+json.dumps({'rank':i,'reconcile_id':row[0],'status':row[1],'employee_id':row[2],'assignment_id':row[3]},sort_keys=True))
          PY
          REMOTE
