name: Issue 238 Live Employee Probe

on:
  push:
    branches:
      - ops/issue-238-live-employee-probe
    paths:
      - ".github/workflows/issue238-live-employee-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect dormant node service
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          echo "checkout_sha=$(git rev-parse HEAD)"
          echo "node_active=$(systemctl --user is-active agentos-node.service 2>/dev/null || true)"
          echo "node_enabled=$(systemctl --user is-enabled agentos-node.service 2>/dev/null || true)"
          systemctl --user show agentos-node.service -p MainPID -p Result -p ExecMainStatus -p FragmentPath --no-pager || true
          echo "--- installed unit safe fields ---"
          systemctl --user cat agentos-node.service --no-pager 2>/dev/null | grep -E '^(Description|WorkingDirectory|ExecStart|Restart|RestartSec|EnvironmentFile)=' || true
          echo "--- recent journal ---"
          journalctl --user -u agentos-node.service -n 40 --no-pager 2>/dev/null | sed -E 's/(Bearer|token|secret|password)[^ ]*/[REDACTED]/Ig' || true
          echo "--- candidate client files metadata only ---"
          for p in "$HOME/.agentos/client.json" "$HOME/.agentos/policy.json" "$HOME/.config/agentos/client.json" "$HOME/.config/agentos/policy.json"; do
            if [ -e "$p" ]; then stat -c 'path=%n mode=%a owner=%U group=%G size=%s' "$p"; fi
          done
          echo "--- policy safe fields only ---"
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in [Path.home()/'.agentos/policy.json', Path.home()/'.config/agentos/policy.json']:
              if not p.is_file(): continue
              try: d=json.loads(p.read_text(encoding='utf-8-sig'))
              except Exception: continue
              print('policy_path='+str(p))
              print('policy_allowed_executables_count='+str(len(d.get('allowed_executables') or [])))
              print('policy_readable_roots_count='+str(len(d.get('readable_roots') or [])))
              print('policy_writable_roots_count='+str(len(d.get('writable_roots') or [])))
              print('policy_employee_wake_root='+str(d.get('employee_wake_root')))
          PY
          REMOTE
