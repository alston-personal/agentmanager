name: Issue 238 Live Employee Probe

on:
  push:
    branches:
      - ops/issue-238-live-employee-probe
    paths:
      - ".github/workflows/issue238-live-employee-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Recheck stable Employee dispatch
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          DATA_ROOT="/home/ubuntu/agent-data"
          echo "checkout_sha=$(git rev-parse HEAD)"
          echo "checkout_clean=$([ -z "$(git status --porcelain=v1 --untracked-files=no)" ] && echo true || echo false)"
          echo "worker_state=$(systemctl --user is-active agentos-employee-worker-host.service 2>/dev/null || true)"
          echo "worker_restarts=$(systemctl --user show agentos-employee-worker-host.service -p NRestarts --value 2>/dev/null || true)"
          echo "supervisor_state=$(systemctl --user is-active agentos-core-supervisor.service 2>/dev/null || true)"
          echo "wake_state=$(systemctl --user is-active agentos-employee-wake-node.service 2>/dev/null || true)"
          python3 - "$DATA_ROOT" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          for name in ("zeus-writer-continuation-v1", "youtube-ai-manager-scan-v1"):
              p = root / "employee-runtime" / "assignments" / (name + ".json")
              obj = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
              print("assignment=" + json.dumps({k: obj.get(k) for k in ("assignment_id","employee_id","state","thread_head","updated_at","result")}, ensure_ascii=False, sort_keys=True))
          for employee in ("zeus-writer", "youtube-ai-manager"):
              wdir = root / "employee-wakes" / employee
              wakes = sorted(wdir.glob("*.json"), key=lambda p: p.stat().st_mtime)[-3:] if wdir.exists() else []
              for p in wakes:
                  obj = json.loads(p.read_text(encoding="utf-8"))
                  print("wake=" + json.dumps({k: obj.get(k) for k in ("employee_id","assignment_id","wake_id","presence_generation","expected_lease_generation")}, sort_keys=True))
          dispatch_root = root / "employee-worker-host" / "dispatches"
          files = sorted(dispatch_root.glob("*/*.json"), key=lambda p: p.stat().st_mtime)[-16:]
          for p in files:
              obj = json.loads(p.read_text(encoding="utf-8"))
              print("dispatch=" + json.dumps({k: obj.get(k) for k in ("employee_id","assignment_id","wake_id","presence_generation","expected_lease_generation","status","completed_at","error_code","child_result")}, ensure_ascii=False, sort_keys=True))
          PY
          echo "--- worker journal recent ---"
          journalctl --user -u agentos-employee-worker-host.service --since '2026-09-11 10:35:15' --no-pager 2>/dev/null | tail -60 || true
          echo "--- supervisor journal recent ---"
          journalctl --user -u agentos-core-supervisor.service --since '2026-09-11 10:35:15' --no-pager 2>/dev/null | tail -60 || true
          REMOTE
