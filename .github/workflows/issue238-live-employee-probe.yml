name: Issue 238 Live Employee Probe

on:
  push:
    branches:
      - ops/issue-238-live-employee-probe
    paths:
      - ".github/workflows/issue238-live-employee-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
      TARGET_SHA: 53793ac89e7a9bd555fe3601dda1e5dda8f7436f
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Apply exact target-equivalent checkout
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" "$TARGET_SHA" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          TARGET="$2"
          cd "$ROOT"
          git fetch --no-tags origin core/integration >/dev/null 2>&1
          [ "$(git rev-parse FETCH_HEAD)" = "$TARGET" ] || { echo "target_ref_mismatch"; exit 20; }

          status="$(git status --porcelain=v1 --untracked-files=no)"
          [ -n "$status" ] || { echo "checkout_already_clean=true"; git checkout --detach --force "$TARGET" >/dev/null; exit 0; }

          count=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            count=$((count+1))
            [ "${line:0:3}" = " M " ] || { echo "unsafe_status=$line"; exit 21; }
            path="${line:3}"
            case "$path" in /*|*..*) echo "unsafe_path"; exit 22;; esac
            [ -f "$path" ] && [ ! -L "$path" ] || { echo "unsafe_file_type=$path"; exit 23; }
            [ -z "$(git diff --summary -- "$path")" ] || { echo "unsafe_mode_change=$path"; exit 24; }
            wt="$(git hash-object -- "$path")"
            target="$(git rev-parse "$TARGET:$path")"
            [ "$wt" = "$target" ] || { echo "worktree_not_target_equivalent=$path"; exit 25; }
            echo "target_equivalent_path=$path"
          done <<< "$status"
          [ "$count" -gt 0 ] || { echo "no_eligible_dirty_paths"; exit 26; }

          git checkout --detach --force "$TARGET" >/dev/null
          [ "$(git rev-parse HEAD)" = "$TARGET" ] || { echo "checkout_head_mismatch"; exit 27; }
          [ -z "$(git status --porcelain --untracked-files=no)" ] || { echo "checkout_not_clean"; exit 28; }
          echo "target_equivalent_checkout=PASS"
          echo "resulting_sha=$(git rev-parse HEAD)"
          REMOTE
