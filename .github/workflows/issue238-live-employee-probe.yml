name: Issue 238 Live Employee Probe

on:
  push:
    branches:
      - ops/issue-238-live-employee-probe
    paths:
      - ".github/workflows/issue238-live-employee-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Remeasure Realm fabric structure only
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          set -a
          source .env
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          DATA_ROOT="${AGENT_DATA_ROOT:-${AGENT_DATA_DIR:-$HOME/agent-data}}"
          FABRIC="$DATA_ROOT/realm/fabric.json"
          echo "checkout_sha=$(git rev-parse HEAD)"
          echo "checkout_clean=$([ -z "$(git status --porcelain=v1 --untracked-files=no)" ] && echo true || echo false)"
          /usr/bin/sg agentos -c "python3 -c 'import hashlib,json,sys; from pathlib import Path; p=Path(sys.argv[1]); raw=p.read_bytes(); text=raw.decode(\"utf-8\"); dec=json.JSONDecoder(); first,end=dec.raw_decode(text,0); prefix=text[:end].encode(\"utf-8\"); tail=text[end:]; print(\"fabric_file_sha256=\"+hashlib.sha256(raw).hexdigest()); print(\"fabric_size=\"+str(len(raw))); print(\"fabric_first_consumes_all=\"+str(not bool(tail.strip())).lower()); print(\"fabric_prefix_sha256=\"+hashlib.sha256(prefix).hexdigest()); print(\"fabric_prefix_schema=\"+str(first.get(\"schema\") if isinstance(first,dict) else None)); print(\"fabric_prefix_realm=\"+str(first.get(\"realm_id\") if isinstance(first,dict) else None)); print(\"fabric_prefix_node_count=\"+str(len(first.get(\"nodes\") or {}) if isinstance(first,dict) else -1)); print(\"fabric_prefix_receipt_count=\"+str(len(first.get(\"receipts\") or {}) if isinstance(first,dict) else -1)); print(\"fabric_tail_chars=\"+str(len(tail))); print(\"fabric_tail_nonwhitespace=\"+str(bool(tail.strip())).lower()); print(\"fabric_tail_starts_object=\"+str(tail.lstrip().startswith(\"{\")).lower())' '$FABRIC'"
          echo "realm_health=$(curl -sS --max-time 2 http://127.0.0.1:8780/v1/health 2>/dev/null | tr -d '\n' || echo unavailable)"
          echo "wake_state=$(systemctl --user is-active agentos-employee-wake-node.service 2>/dev/null || true)"
          REMOTE
