name: Issue 238 Live Employee Probe

on:
  push:
    branches:
      - ops/issue-238-live-employee-probe
    paths:
      - ".github/workflows/issue238-live-employee-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect post-converge state only
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          set -a
          source .env
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          DATA_ROOT="${AGENT_DATA_ROOT:-${AGENT_DATA_DIR:-$HOME/agent-data}}"
          ACTION_RUNTIME="${AGENTOS_ACTION_RUNTIME_ROOT:-$HOME/.local/share/agentos/action-runtime}"
          echo "checkout_sha=$(git rev-parse HEAD)"
          echo "checkout_clean=$([ -z "$(git status --porcelain=v1 --untracked-files=no)" ] && echo true || echo false)"
          echo "tracked_status_begin"
          git status --porcelain=v1 --untracked-files=no
          echo "tracked_status_end"
          if [ -d "$ACTION_RUNTIME/.git" ]; then echo "action_runtime_sha=$(git -C "$ACTION_RUNTIME" rev-parse HEAD)"; fi
          for svc in agentos-action-relay.service agentos-realm-fabric.service agentos-core-supervisor.service agentos-employee-wake-node.service agentos-employee-worker-host.service; do
            echo "$svc=$(systemctl --user is-active "$svc" 2>/dev/null || true)"
            echo "$svc.restarts=$(systemctl --user show "$svc" -p NRestarts --value 2>/dev/null || true)"
          done
          echo "worker_execstart=$(systemctl --user show agentos-employee-worker-host.service -p ExecStart --value 2>/dev/null | sed -E 's/;.*$//' || true)"
          echo "realm_health=$(curl -sS --max-time 2 http://127.0.0.1:8780/v1/health 2>/dev/null | tr -d '\n' || echo unavailable)"
          echo "--- action relay journal ---"
          journalctl --user -u agentos-action-relay.service --since '2026-09-10 12:57:30' --no-pager 2>/dev/null | tail -80 || true
          echo "--- realm journal ---"
          journalctl --user -u agentos-realm-fabric.service --since '2026-09-10 12:57:30' --no-pager 2>/dev/null | tail -80 || true
          echo "--- worker journal ---"
          journalctl --user -u agentos-employee-worker-host.service --since '2026-09-10 12:57:30' --no-pager 2>/dev/null | tail -80 || true
          echo "--- wake journal ---"
          journalctl --user -u agentos-employee-wake-node.service --since '2026-09-10 12:57:30' --no-pager 2>/dev/null | tail -80 || true
          REMOTE
