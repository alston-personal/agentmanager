name: Issue 238 Live Employee Probe

on:
  push:
    branches:
      - ops/issue-238-live-employee-probe
    paths:
      - ".github/workflows/issue238-live-employee-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Probe wake-capable node map
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          set -a
          source .env
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          DATA_ROOT="${AGENT_DATA_ROOT:-${AGENT_DATA_DIR:-$HOME/agent-data}}"
          echo "checkout_sha=$(git rev-parse HEAD)"
          python3 - "$DATA_ROOT/realm/nodes.json" "$DATA_ROOT/realm/fabric.json" <<'PY'
          import json,sys
          from pathlib import Path
          nodes_path, fabric_path = map(Path, sys.argv[1:])
          print('nodes_json_exists='+str(nodes_path.is_file()).lower())
          print('fabric_json_exists='+str(fabric_path.is_file()).lower())
          if nodes_path.is_file():
              d=json.loads(nodes_path.read_text())
              print('node_registry_schema='+str(d.get('schema') or ''))
              print('node_registry_realm='+str(d.get('realm_id') or ''))
              entries=d.get('nodes') or {}
              if isinstance(entries, dict):
                  entries=list(entries.values())
              for n in entries:
                  if not isinstance(n,dict): continue
                  caps=sorted(str(x) for x in (n.get('capabilities') or []))
                  print('node='+str(n.get('node_id') or '')+' status='+str(n.get('status') or '')+' role='+str(n.get('role') or '')+' caps='+','.join(caps))
          if fabric_path.is_file():
              d=json.loads(fabric_path.read_text())
              print('fabric_realm='+str(d.get('realm_id') or ''))
              print('fabric_node_ids='+','.join(sorted(str(x) for x in (d.get('nodes') or {}).keys())))
              tasks=d.get('tasks') or {}
              for node_id, queue in sorted(tasks.items()):
                  print('fabric_queue='+str(node_id)+' depth='+str(len(queue) if isinstance(queue,list) else -1))
          PY
          echo "--- relevant user services ---"
          systemctl --user list-unit-files --type=service --no-pager | grep -E 'agentos|employee' | head -n 100 || true
          echo "--- relevant processes ---"
          ps -eo pid,args | grep -E 'agentos_node.(thin_client|client_cli)|employee_worker_host|core_supervisor' | grep -v grep || true
          echo "--- client config hints (names only) ---"
          find "$HOME/.config/agentos" -maxdepth 2 -type f -printf '%p\n' 2>/dev/null | sort | head -n 100 || true
          REMOTE
