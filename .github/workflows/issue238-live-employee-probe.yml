name: Issue 238 Live Employee Probe

on:
  push:
    branches:
      - ops/issue-238-live-employee-probe
    paths:
      - ".github/workflows/issue238-live-employee-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
      CURRENT_INTEGRATION_SHA: 8705e0ef378b998fee73d1ab721a2c993128f7cc
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect tracked drift only
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" "$CURRENT_INTEGRATION_SHA" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          TARGET="$2"
          cd "$ROOT"
          git fetch --no-tags origin core/integration >/dev/null 2>&1
          echo "checkout_sha=$(git rev-parse HEAD)"
          echo "current_integration_sha=$TARGET"
          echo "fetch_head=$(git rev-parse FETCH_HEAD)"
          echo "tracked_status_begin"
          git status --porcelain=v1 --untracked-files=no
          echo "tracked_status_end"
          git diff --name-only | while IFS= read -r path; do
            [ -n "$path" ] || continue
            wt="$(git hash-object -- "$path" 2>/dev/null || echo missing)"
            head="$(git rev-parse "HEAD:$path" 2>/dev/null || echo missing)"
            target="$(git rev-parse "$TARGET:$path" 2>/dev/null || echo missing)"
            echo "drift_path=$path wt=$wt head=$head target=$target wt_equals_head=$([ "$wt" = "$head" ] && echo true || echo false) wt_equals_current_integration=$([ "$wt" = "$target" ] && echo true || echo false)"
          done
          REMOTE
