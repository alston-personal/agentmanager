name: Issue 238 Live Employee Probe

on:
  push:
    branches:
      - ops/issue-238-live-employee-probe
    paths:
      - ".github/workflows/issue238-live-employee-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect Supervisor delivery ledger
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          DATA_ROOT="/home/ubuntu/agent-data"
          python3 - "$DATA_ROOT" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1]) / "employee-runtime"
          for employee in ("zeus-writer", "youtube-ai-manager"):
              p = root / "realm" / "employee-presence" / (employee + ".json")
              obj = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
              print("presence=" + json.dumps({k: obj.get(k) for k in ("employee_id","node_id","presence_id","generation","heartbeat_at","expires_at")}, sort_keys=True))
          droot = root / "supervisor" / "deliveries"
          rows=[]
          for p in droot.glob("*.json"):
              try:
                  obj=json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if obj.get("employee_id") in {"zeus-writer","youtube-ai-manager"}:
                  rows.append((p.stat().st_mtime,obj))
          for _,obj in sorted(rows,key=lambda x:x[0])[-12:]:
              safe={k:obj.get(k) for k in ("reconcile_id","employee_id","assignment_id","wake_id","status","updated_at","dispatch_performed","presence_id","presence_generation","node_id","wake_attempt_id","task_id","error_code")}
              print("delivery="+json.dumps(safe,sort_keys=True))
          s = root / "supervisor" / "state.json"
          if s.exists():
              obj=json.loads(s.read_text(encoding="utf-8"))
              print("supervisor_state="+json.dumps({k:obj.get(k) for k in ("cycle_generation","last_cycle_at","next_poll_seconds","plan_digest")},sort_keys=True))
          PY
          REMOTE
