name: Issue 238 Live Employee Probe

on:
  push:
    branches:
      - ops/issue-238-live-employee-probe
    paths:
      - ".github/workflows/issue238-live-employee-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Probe Realm data root and process
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          set -a
          source .env
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          printf 'shell_AGENToS_DATA_ROOT=%s\n' "${AGENTOS_DATA_ROOT:-unset}"
          printf 'shell_AGENT_DATA_ROOT=%s\n' "${AGENT_DATA_ROOT:-unset}"
          printf 'shell_AGENT_DATA_DIR=%s\n' "${AGENT_DATA_DIR:-unset}"
          PID="$(systemctl --user show agentos-realm-fabric.service -p MainPID --value 2>/dev/null || true)"
          echo "realm_pid=${PID:-0}"
          echo "realm_state=$(systemctl --user show agentos-realm-fabric.service -p ActiveState -p SubState --value 2>/dev/null | tr '\n' ',' || true)"
          echo "realm_restarts=$(systemctl --user show agentos-realm-fabric.service -p NRestarts --value 2>/dev/null || true)"
          if [ -n "$PID" ] && [ "$PID" != 0 ] && [ -r "/proc/$PID/environ" ]; then
            tr '\0' '\n' < "/proc/$PID/environ" | grep -E '^(AGENTOS_DATA_ROOT|AGENT_DATA_ROOT|AGENT_DATA_DIR|PYTHONPATH)=' | sort || true
          fi
          echo "listener_8780=$(ss -ltn 2>/dev/null | awk '$4 ~ /:8780$/ {print $4}' | head -1 || true)"
          echo "health=$(curl -sS --max-time 2 http://127.0.0.1:8780/v1/health 2>&1 | tail -1)"
          echo "--- realm log tail ---"
          DATA_ROOT="${AGENT_DATA_ROOT:-${AGENT_DATA_DIR:-$HOME/agent-data}}"
          tail -60 "$DATA_ROOT/logs/realm-fabric.log" 2>/dev/null || true
          REMOTE
