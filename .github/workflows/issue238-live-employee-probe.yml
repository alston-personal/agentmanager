name: Issue 238 Live Employee Probe

on:
  push:
    branches:
      - ops/issue-238-live-employee-probe
    paths:
      - ".github/workflows/issue238-live-employee-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Probe bounded Worker Host failure evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          cd "$ROOT"
          set -a
          source .env
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          DATA_ROOT="${AGENT_DATA_ROOT:-${AGENT_DATA_DIR:-$HOME/agent-data}}"
          ACTION_RUNTIME="${AGENTOS_ACTION_RUNTIME_ROOT:-$HOME/.local/share/agentos/action-runtime}"
          echo "checkout_sha=$(git rev-parse HEAD)"
          if [ -e "$ACTION_RUNTIME/.git" ]; then echo "action_runtime_sha=$(git -C "$ACTION_RUNTIME" rev-parse HEAD)"; fi
          for svc in agentos-action-relay.service agentos-core-supervisor.service agentos-employee-wake-node.service agentos-employee-worker-host.service; do
            echo "$svc=$(systemctl --user is-active "$svc" 2>/dev/null || true)"
          done

          /usr/bin/sg agentos -c "python3 - '$DATA_ROOT'" <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          targets={'zeus-writer','youtube-ai-manager','zeus-writer-continuation-v1','youtube-ai-manager-scan-v1'}
          safe={'schema','status','state','employee_id','assignment_id','wake_id','wake_attempt_id','presence_generation','expected_lease_generation','lease_generation','lease_id','node_id','runner_kind','adapter_id','thread_head','transport','dispatch_performed','task_id','updated_at','created_at','expires_at','credential_exposed','session_identity_exposed','outcome','replayed','error_code','completed_at','started_at'}
          child_safe={'schema','status','work_performed','employee_id','assignment_id','wake_id','presence_generation','lease_generation','thread_head','error_code','executor_provider','executor_model','credential_exposed','session_identity_exposed','verified_marker_emitted'}

          for aid in ('zeus-writer-continuation-v1','youtube-ai-manager-scan-v1'):
              p=root/'employee-runtime/assignments'/f'{aid}.json'
              if p.is_file():
                  d=json.loads(p.read_text())
                  print('assignment='+json.dumps({k:d.get(k) for k in safe if k in d},sort_keys=True))
              lp=root/'employee-runtime/lifecycle/leases'/f'{aid}.json'
              if lp.is_file():
                  d=json.loads(lp.read_text())
                  print('lease='+json.dumps({k:d.get(k) for k in safe if k in d},sort_keys=True))

          surface=root/'employee-worker-host/dispatches'
          if surface.exists():
              for p in sorted(surface.rglob('*.json'),key=lambda x:x.stat().st_mtime,reverse=True)[:20]:
                  try:d=json.loads(p.read_text())
                  except Exception:continue
                  if not isinstance(d,dict):continue
                  if not any(t in json.dumps(d,sort_keys=True) for t in targets):continue
                  out={k:d.get(k) for k in safe if k in d}
                  child=d.get('child_result')
                  if isinstance(child,dict): out['child_result']={k:child.get(k) for k in child_safe if k in child}
                  print('worker_dispatch='+json.dumps({'path':str(p.relative_to(root)),'fields':out},sort_keys=True))

          for surface in (root/'employee-runtime/supervisor',root/'employee-wakes',root/'employee-worker-state'):
              if not surface.exists(): continue
              for p in sorted(surface.rglob('*.json'),key=lambda x:x.stat().st_mtime,reverse=True)[:20]:
                  try:d=json.loads(p.read_text())
                  except Exception:continue
                  if not isinstance(d,dict):continue
                  if not any(t in json.dumps(d,sort_keys=True) for t in targets):continue
                  print('lifecycle='+json.dumps({'path':str(p.relative_to(root)),'fields':{k:d.get(k) for k in safe if k in d}},sort_keys=True))
          PY

          echo "--- worker/wake recent journal ---"
          journalctl --user -u agentos-employee-worker-host.service -u agentos-employee-wake-node.service -n 100 --no-pager 2>/dev/null \
            | sed -E 's/(token|secret|password|authorization|credential)[=:][^ ]+/_redacted_/Ig' \
            | tail -100 || true
          REMOTE
