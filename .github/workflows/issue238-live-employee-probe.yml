name: Issue 238 Live Employee Probe

on:
  push:
    branches:
      - ops/issue-238-live-employee-probe
    paths:
      - ".github/workflows/issue238-live-employee-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Probe maintenance failure output and runtime generations
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          cd "$ROOT"
          set -a
          source .env
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          DATA_ROOT="${AGENT_DATA_ROOT:-${AGENT_DATA_DIR:-$HOME/agent-data}}"
          ACTION_RUNTIME="${AGENTOS_ACTION_RUNTIME_ROOT:-$HOME/.local/share/agentos/action-runtime}"
          echo "checkout_sha=$(git rev-parse HEAD)"
          if [ -e "$ACTION_RUNTIME/.git" ]; then echo "action_runtime_sha=$(git -C "$ACTION_RUNTIME" rev-parse HEAD)"; else echo "action_runtime_sha=missing"; fi
          echo "action_relay_service=$(systemctl --user is-active agentos-action-relay.service 2>/dev/null || true)"
          echo "maintenance_service=$(systemctl --user is-active agent-maintenance.service 2>/dev/null || true)"
          echo "--- installed maintenance unit output paths ---"
          systemctl --user cat agent-maintenance.service --no-pager 2>/dev/null | grep -E '^(WorkingDirectory|ExecStart|StandardOutput|StandardError)=' || true
          echo "--- maintenance log candidates sanitized ---"
          for log in "$ROOT/maintenance.log" "$DATA_ROOT/logs/maintenance.log"; do
            if [ -f "$log" ]; then
              echo "maintenance_log=$log"
              tail -n 120 "$log" | sed -E 's/(Bearer|token|secret|password)[^ ]*/[REDACTED]/Ig' || true
            fi
          done
          echo "--- maintenance journal sanitized ---"
          journalctl --user -u agent-maintenance.service -n 30 --no-pager 2>/dev/null | sed -E 's/(Bearer|token|secret|password)[^ ]*/[REDACTED]/Ig' || true
          python3 - "$DATA_ROOT" <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          marker=root/'runtime/action-relay/capabilities.json'
          if marker.is_file():
              try: d=json.loads(marker.read_text())
              except Exception: d={}
              print('action_marker_source_commit='+str(d.get('source_commit') or ''))
          else:
              print('action_marker_source_commit=missing')
          for eid in ('zeus-writer','youtube-ai-manager'):
              print(f'employee_{eid}_exists='+str((root/'employee-runtime/employees'/f'{eid}.json').is_file()).lower())
          PY
          REMOTE
