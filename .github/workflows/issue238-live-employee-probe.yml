name: Issue 238 Live Employee Probe

on:
  push:
    branches:
      - ops/issue-238-live-employee-probe
    paths:
      - ".github/workflows/issue238-live-employee-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Probe activation boundary
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          cd "$ROOT"
          set -a
          source .env
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          DATA_ROOT="${AGENT_DATA_ROOT:-${AGENT_DATA_DIR:-$HOME/agent-data}}"
          REALM_ID="$(python3 - "$DATA_ROOT/realm/fabric.json" <<'PY'
          import json,sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text())['realm_id'])
          PY
          )"
          echo "checkout_sha=$(git rev-parse HEAD)"
          echo "realm_id=$REALM_ID"
          echo "venv_python_exists=$([ -x "$ROOT/venv/bin/python3" ] && echo true || echo false)"
          echo "dotvenv_python_exists=$([ -x "$ROOT/.venv/bin/python3" ] && echo true || echo false)"
          if [ -x "$ROOT/venv/bin/python3" ]; then readlink -f "$ROOT/venv/bin/python3" | sed 's#^#venv_python_real=#'; fi
          if [ -x "$ROOT/.venv/bin/python3" ]; then readlink -f "$ROOT/.venv/bin/python3" | sed 's#^#dotvenv_python_real=#'; fi

          REALM_NODES="$DATA_ROOT/realm/$REALM_ID/nodes"
          echo "realm_nodes_root=$REALM_NODES"
          if [ -d "$REALM_NODES" ]; then
            for node in "$REALM_NODES"/*; do
              [ -d "$node" ] || continue
              nid="$(basename "$node")"
              q="$node/queue"
              echo "realm_node=$nid queue_exists=$([ -d "$q" ] && echo true || echo false) queue=$q"
              manifest="$node/manifest.json"
              if [ -f "$manifest" ]; then
                python3 - "$manifest" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text())
          print('manifest_node='+str(d.get('node_id') or ''))
          print('manifest_caps='+','.join(str(x) for x in (d.get('capabilities') or [])))
          PY
              fi
            done
          fi

          for p in "$DATA_ROOT/employee-wakes" "$DATA_ROOT/employee-runtime" "$DATA_ROOT/employee-worker-host" "$DATA_ROOT/employee-worker-state"; do
            echo "candidate_path=$p exists=$([ -e "$p" ] && echo true || echo false)"
          done

          echo "--- source unit ---"
          grep '^ExecStart=' .agent/scripts/agentos-employee-worker-host.service || true
          echo "--- installed unit ---"
          systemctl --user cat agentos-employee-worker-host.service --no-pager 2>/dev/null | grep -E '^(ExecStart|EnvironmentFile)=' || true
          echo "--- supervisor delivery source hints ---"
          grep -R "AGENTOS_SUPERVISOR_DELIVERY_NODE_ID\|AGENTOS_SUPERVISOR_DELIVERY_QUEUE_ROOT\|employee-wakes" -n agent_core .agent/scripts scripts 2>/dev/null | head -n 80 || true
          REMOTE
