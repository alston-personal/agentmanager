name: Issue 238 Live Employee Probe

on:
  push:
    branches:
      - ops/issue-238-live-employee-probe
    paths:
      - ".github/workflows/issue238-live-employee-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect Realm fabric recovery candidates
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          set -a
          source .env
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          DATA_ROOT="${AGENT_DATA_ROOT:-${AGENT_DATA_DIR:-$HOME/agent-data}}"
          /usr/bin/sg agentos -c "python3 - '$DATA_ROOT/realm'" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          fabric=root/'fabric.json'
          text=fabric.read_text(encoding='utf-8')
          decoder=json.JSONDecoder()
          first,end=decoder.raw_decode(text,0)
          tail=text[end:]
          print('fabric_size='+str(len(text.encode('utf-8'))))
          print('first_snapshot_size_chars='+str(end))
          print('tail_size_chars='+str(len(tail)))
          print('tail_nonwhitespace='+str(bool(tail.strip())).lower())
          stripped=tail.lstrip()
          print('tail_starts_object='+str(stripped.startswith('{')).lower())
          print('tail_starts_expected_schema_literal='+str('"schema": "agentos.realm-fabric/v0.1"' in stripped[:500] or '"schema":"agentos.realm-fabric/v0.1"' in stripped[:500]).lower())
          print('first_schema='+str(first.get('schema') if isinstance(first,dict) else None))
          print('first_realm='+str(first.get('realm_id') if isinstance(first,dict) else None))
          print('first_node_count='+str(len(first.get('nodes') or {}) if isinstance(first,dict) else -1))
          print('first_receipt_count='+str(len(first.get('receipts') or {}) if isinstance(first,dict) else -1))
          print('first_sha256='+hashlib.sha256(text[:end].encode('utf-8')).hexdigest())
          print('tail_sha256='+hashlib.sha256(tail.encode('utf-8')).hexdigest())
          candidates=[]
          for p in sorted(root.glob('fabric.json*')):
              if p.name=='fabric.json': continue
              try:
                  raw=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              try:
                  d=json.loads(raw)
                  valid=isinstance(d,dict) and d.get('schema')=='agentos.realm-fabric/v0.1'
              except Exception:
                  d=None; valid=False
              candidates.append((p.name,len(raw.encode('utf-8')),valid,str(d.get('realm_id')) if valid else None,len(d.get('receipts') or {}) if valid else -1,hashlib.sha256(raw.encode('utf-8')).hexdigest()))
          print('candidate_count='+str(len(candidates)))
          for idx,(name,size,valid,realm,receipts,digest) in enumerate(candidates):
              print(f'candidate_{idx}_name={name}')
              print(f'candidate_{idx}_size={size}')
              print(f'candidate_{idx}_valid_json={str(valid).lower()}')
              print(f'candidate_{idx}_realm={realm}')
              print(f'candidate_{idx}_receipt_count={receipts}')
              print(f'candidate_{idx}_sha256={digest}')
          PY
          REMOTE
