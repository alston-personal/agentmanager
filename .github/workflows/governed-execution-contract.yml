name: Governed Execution Contract

on:
  pull_request:
    paths:
      - 'governance/execution-authority.json'
      - 'governance/deployment-capabilities.json'
      - 'agent_core/deployment_capability.py'
      - 'agent_core/executor_job_contract.py'
      - 'agentos_node/deployment_inspect_provider.py'
      - 'agentos_node/executor_job_action_relay.py'
      - 'tests/test_deployment_inspect_one.py'
      - 'tests/test_realm_installer_revision_attestation.py'
      - 'agentos_node/action_relay.py'
      - 'tests/test_deployment_capability.py'
      - 'scripts/fetch_governed_product_request.py'
      - 'scripts/run_governed_execution_request.py'
      - 'tests/test_governed_execution_request.py'
      - 'docs/GOVERNED_EXECUTION_REQUESTS.md'
      - '.github/workflows/governed-execution-contract.yml'
  push:
    branches: [core/integration]
    paths:
      - 'governance/execution-authority.json'
      - 'governance/deployment-capabilities.json'
      - 'agent_core/deployment_capability.py'
      - 'agent_core/executor_job_contract.py'
      - 'agentos_node/deployment_inspect_provider.py'
      - 'agentos_node/executor_job_action_relay.py'
      - 'tests/test_deployment_inspect_one.py'
      - 'tests/test_realm_installer_revision_attestation.py'
      - 'agentos_node/action_relay.py'
      - 'tests/test_deployment_capability.py'
      - 'scripts/fetch_governed_product_request.py'
      - 'scripts/run_governed_execution_request.py'
      - 'tests/test_governed_execution_request.py'
      - 'docs/GOVERNED_EXECUTION_REQUESTS.md'
      - '.github/workflows/governed-execution-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded execution contract
        run: |
          python3 tests/test_governed_execution_request.py
          python3 -m unittest tests.test_deployment_capability tests.test_deployment_inspect_one tests.test_realm_installer_revision_attestation -v
          python3 -m py_compile scripts/run_governed_execution_request.py scripts/fetch_governed_product_request.py agent_core/deployment_capability.py
