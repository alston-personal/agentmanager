name: GUI Demo Control

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.agentos/commands/gui-demo-control.json'

permissions:
  contents: read

jobs:
  run:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch GUI demo task
        shell: bash
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json, pathlib, time
          from agent_core.node_registry import NodeRegistry
          from agent_core.realm_fabric import RealmFabricStore

          cmd=json.loads(pathlib.Path('.agentos/commands/gui-demo-control.json').read_text(encoding='utf-8'))
          if cmd.get('schema')!='agentos.gui-demo-command/v0.1':
              raise SystemExit('invalid_schema')
          node_id=str(cmd.get('node_id') or '')
          if node_id!='VO10005870':
              raise SystemExit('invalid_node')
          action=str(cmd.get('action') or '')
          allowed={
              'desktop.session.inspect',
              'desktop.windows.inspect',
              'desktop.screenshot',
              'desktop.open_url',
              'desktop.mouse',
              'desktop.keyboard',
              'desktop.windows.tile',
              'desktop.demo.start',
              'desktop.demo.stage',
              'desktop.demo.stop',
              'shell.exec',
          }
          if action not in allowed:
              raise SystemExit('action_not_allowed:'+action)

          nodes=NodeRegistry().node_map().get('nodes') or []
          node=next((n for n in nodes if str(n.get('node_id') or '')==node_id),None)
          if not node:
              raise SystemExit('node_not_registered')
          status=str(node.get('effective_status') or node.get('status') or '')
          caps=set(node.get('capabilities') or [])
          roots=(node.get('workspace_roots') or {}).get('readable') or []
          if status!='online':
              raise SystemExit('node_not_online:'+status)
          if action not in caps:
              raise SystemExit('capability_missing:'+action)
          if not roots:
              roots=[r'C:\Users\alston.huang\AgentOS']

          task={
              'schema':'agentos.node-task/v0.1',
              'task_id':'gui-demo-'+str(cmd.get('nonce') or ''),
              'action':action,
              'cognition_ids_used':['demo://chatgpt-gemini-threads/20261001'],
          }
          task.update(dict(cmd.get('payload') or {}))
          if action=='shell.exec':
              task.setdefault('cwd', str(roots[0]))
          fabric=RealmFabricStore()
          existing=fabric.get_receipt(task['task_id'])
          receipt_only=bool(cmd.get('receipt_only'))
          if existing is None and not receipt_only:
              fabric.queue_task(node_id,task)
              print('queued=PASS',flush=True)
          elif existing is None and receipt_only:
              print('receipt_only_wait=PASS',flush=True)
          receipt=existing
          requested_timeout=int((cmd.get('payload') or {}).get('timeout_seconds') or 120)
          receipt_wait_seconds=max(120,min(requested_timeout+60,360))
          for _ in range((receipt_wait_seconds+1)//2):
              if receipt is not None:
                  break
              time.sleep(2)
              receipt=fabric.get_receipt(task['task_id'])
          if receipt is None:
              raise SystemExit('receipt_timeout')
          print('RECEIPT_JSON='+json.dumps(receipt,ensure_ascii=False,separators=(',',':')))
          if receipt.get('ok') is not True:
              raise SystemExit('task_failed:'+str(receipt.get('error') or 'unknown'))
          if action == 'shell.exec' and int(receipt.get('returncode') or 0) != 0:
              raise SystemExit('shell_failed_rc:'+str(receipt.get('returncode'))+':'+str(receipt.get('stderr') or '')[-1000:])
          PY
