name: Mio GUI Threads Tab Inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mio-gui-threads-tab-inventory.yml'
      - 'scripts/persona_gui_tab_inventory.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Read existing browser tabs locally, output only counts
        run: |
          set -euo pipefail
          REMOTE="/tmp/mio-gui-tabs-${GITHUB_RUN_ID}.py"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/persona_gui_tab_inventory.py "$TARGET:$REMOTE"
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "$TARGET" "python3 '$REMOTE'; rm -f '$REMOTE'"
