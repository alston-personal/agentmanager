name: Oracle Agent Data Sizes

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/oracle-agent-data-sizes.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORACLE_HOST: ${{ vars.ORACLE_HOST || '161.33.24.170' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Measure agent-data children independently
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$ORACLE_HOST" bash -s <<'REMOTE'
          set -u
          ROOT="$HOME/agent-data"
          echo '=== disk ==='
          df -h /
          echo '=== top-level entries ==='
          find "$ROOT" -mindepth 1 -maxdepth 1 -printf '%y\t%f\n' 2>/dev/null | sort
          echo '=== per-child sizes KB (30s cap each, parallel) ==='
          find "$ROOT" -mindepth 1 -maxdepth 1 -print0 2>/dev/null |
            xargs -0 -r -P 8 -n 1 bash -c '
              p="$1"
              out="$(timeout 30 du -x -sk "$p" 2>/dev/null || true)"
              if [ -n "$out" ]; then
                printf "OK\t%s\n" "$out"
              else
                printf "TIMEOUT\t%s\n" "$p"
              fi
            ' _ |
            sort -t$'\t' -k2,2nr
          echo '=== large direct files in agent-data >=128MiB ==='
          timeout 90 find "$ROOT" -xdev -type f -size +128M -printf '%s\t%TY-%Tm-%TdT%TH:%TM:%TS\t%p\n' 2>/dev/null |
            sort -nr | head -n 100 || true
          REMOTE
