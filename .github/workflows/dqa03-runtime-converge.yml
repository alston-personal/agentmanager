name: Converge dqa03backup Runtime

on:
  push:
    branches: [ops/converge-dqa03-runtime-20261002]
    paths:
      - '.agentos/commands/dqa03-runtime-converge.json'
      - '.github/workflows/dqa03-runtime-converge.yml'

permissions:
  contents: read

jobs:
  converge:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch governed runtime convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time
          from agent_core.controller_api import ControllerService
          from agent_core.realm_fabric import RealmFabricStore

          cmd=json.load(open('.agentos/commands/dqa03-runtime-converge.json',encoding='utf-8'))
          node_id=cmd['node_id']
          source_commit=cmd['source_commit']
          source_ref=cmd['source_ref']

          controller=ControllerService(RealmFabricStore())
          controller.ota_policy.set_desired(
              source_commit=source_commit,
              source_ref=source_ref,
              auto_converge=False,
          )
          result=controller.dispatch(node_id,{
              'action':'node.runtime.converge',
              'task_id':cmd['task_id'],
              'source_commit':source_commit,
              'source_ref':source_ref,
          })
          print('dispatch='+json.dumps(result,sort_keys=True))

          deadline=time.time()+120
          while time.time()<deadline:
              try:
                  receipt=controller.receipt(cmd['task_id'])
              except KeyError:
                  time.sleep(2)
                  continue
              print('receipt='+json.dumps(receipt,sort_keys=True))
              if receipt.get('ok') is not True:
                  raise SystemExit('runtime_converge_receipt_failed')
              break
          else:
              raise SystemExit('runtime_converge_receipt_timeout')

          deadline=time.time()+90
          while time.time()<deadline:
              node=controller.node(node_id)
              print('runtime_probe='+json.dumps({
                  'status':node.get('status'),
                  'runtime_status':node.get('runtime_status'),
                  'runtime':node.get('runtime'),
                  'heartbeat_age_seconds':node.get('heartbeat_age_seconds'),
              },sort_keys=True))
              runtime=node.get('runtime') or {}
              if (
                  node.get('status')=='online'
                  and node.get('runtime_status')=='converged'
                  and runtime.get('source_commit')==source_commit
              ):
                  print('dqa03_runtime_converge=PASS')
                  raise SystemExit(0)
              time.sleep(3)
          raise SystemExit('runtime_converge_post_restart_timeout')
          PY
