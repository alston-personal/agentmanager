name: Inspect Oracle Try-On Renderers

on:
  push:
    branches: [feat/mio-tryon-api]
    paths:
      - '.github/workflows/oracle-inspect-tryon-renderers.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    steps:
      - name: Inspect local image-capable executors
        shell: bash
        run: |
          set -euo pipefail
          echo "TRYON_RENDERER_INSPECT_BEGIN"
          for cmd in codex gemini claude python3 node npx; do
            if command -v "$cmd" >/dev/null 2>&1; then
              printf '%s=%s\n' "$cmd" "$(command -v "$cmd")"
              "$cmd" --version 2>/dev/null | head -n 2 || true
            else
              printf '%s=missing\n' "$cmd"
            fi
          done
          find "$HOME" -maxdepth 6 -type f \( -name codex -o -name gemini -o -name claude \) -perm -u+x 2>/dev/null | head -n 30 || true
          echo "TRYON_RENDERER_INSPECT_END"
