name: Oracle Exact Generation Executor Job Rollout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Mutable-checkout executor rollout is retired
        run: |
          echo 'legacy_exact_generation_executor_rollout=RETIRED'
          echo 'mutable_checkout_mutation=FORBIDDEN'
          echo 'replacement=Oracle Bootstrap Scheduler Rollout + governed Action Runtime exact-generation rollout'
          echo 'reason=/home/ubuntu/agentmanager is source-cache-only and must not receive live runtime copies from agentos-node'
