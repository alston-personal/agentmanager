name: Oracle Resume Mio Social (Owner Authorized)

on:
  push:
    branches:
      - core/integration
    paths:
      - '.github/workflows/oracle-resume-mio-social-owner-authorized.yml'

permissions:
  contents: write

jobs:
  resume:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - name: Verify bounded owner-authorized social policy
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/core/integration'
          test "$(id -un)" = 'agentos-node'
          python3 -m py_compile agentos_node/bootstrap_control.py scripts/mio_persona_social_loop_user.py
          bash -n scripts/resume_mio_social_user.sh
          grep -Fq 'ACTION_RESUME_MIO_SOCIAL' agentos_node/bootstrap_control.py
          grep -Fq 'interests_with_evidence' scripts/mio_persona_social_loop_user.py
          grep -Fq 'one outbound conversation at most' scripts/mio_persona_social_loop_user.py
          grep -Fq 'It is completely valid to choose none.' scripts/mio_persona_social_loop_user.py
          grep -Fq 'MIO_SOCIAL_AUTO_REPLY_ALLOWED' scripts/mio_persona_social_loop_user.py
          echo 'mio_social_resume_preflight=PASS'

      - name: Resume IR-governed social exploration through ubuntu bootstrap
        shell: bash
        run: |
          set -euo pipefail
          LIVE=/home/ubuntu/agentmanager
          ROOT=/tmp/agentos-bootstrap-control
          REQUESTS="$ROOT/requests"
          RECEIPTS="$ROOT/receipts"
          ID="mio-social-resume-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          REQUEST="$REQUESTS/$ID.request.json"
          RECEIPT="$RECEIPTS/$ID.json"
          test -w "$LIVE/agentos_node/bootstrap_control.py"
          test -d "$REQUESTS" && test -d "$RECEIPTS"
          test "$(stat -c '%U' "$REQUESTS")" = ubuntu
          test "$(stat -c '%a' "$REQUESTS")" = 1777
          cat agentos_node/bootstrap_control.py > "$LIVE/agentos_node/bootstrap_control.py"
          python3 -m py_compile "$LIVE/agentos_node/bootstrap_control.py"
          python3 - "$REQUEST" "$ID" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          from datetime import datetime,timezone
          from pathlib import Path
          path=Path(sys.argv[1])
          payload={
              'schema':'agentos.bootstrap-request/v1',
              'request_id':sys.argv[2],
              'action':'agentos.social_threads_mio.resume_social',
              'created_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'params':{'source_commit':sys.argv[3]},
              'authority':{'source':'github-actions','target_user':'ubuntu','arbitrary_shell':False},
          }
          tmp=path.with_suffix(path.suffix+'.tmp')
          tmp.write_text(json.dumps(payload,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          os.chmod(tmp,0o644)
          tmp.replace(path)
          os.chmod(path,0o644)
          PY
          for _ in $(seq 1 360); do
            test ! -f "$RECEIPT" || break
            sleep 1
          done
          test -f "$RECEIPT" || { echo 'mio_social_resume_receipt=TIMEOUT'; exit 3; }
          python3 - "$RECEIPT" "$GITHUB_SHA" <<'PY'
          import json,re,sys
          doc=json.load(open(sys.argv[1],encoding='utf-8'))
          assert doc.get('schema')=='agentos.bootstrap-receipt/v1'
          assert doc.get('action')=='agentos.social_threads_mio.resume_social'
          assert doc.get('executor_user')=='ubuntu'
          assert doc.get('executor_uid')==1001
          assert doc.get('source_commit')==sys.argv[2]
          lines='\n'.join(str(x.get('stdout') or '') for x in doc.get('steps') or []).splitlines()
          for line in lines:
              if re.fullmatch(r'mio_(?:social_resume|social_discovery|social_reply_decision|social_silence|social_daily_outbound_cap|social_timer|persona_ir_[a-z_]+|social_loop|social_outbound|social_outbound_today|social_decision|social_publish|energy|life_phase)=[^\s]{1,180}',line):
                  print(line)
          assert doc.get('ok') is True,'mio_social_resume_executor_failed'
          assert 'mio_social_resume=PASS' in lines
          assert 'mio_social_discovery=IR_INTEREST_DRIVEN' in lines
          assert 'mio_social_reply_decision=IR_REQUIRED' in lines
          safe=[line for line in lines if re.fullmatch(r'mio_(?:social_resume|social_discovery|social_reply_decision|social_silence|social_daily_outbound_cap|social_timer|persona_ir_[a-z_]+|social_loop|social_outbound|social_outbound_today|social_decision|social_publish|energy|life_phase)=[^\\s]{1,180}',line)]
          from pathlib import Path
          out=Path('.agentos/evidence/mio-social-resume-latest.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({
              'schema':'agentos.mio-social-resume-evidence/v1',
              'source_commit':sys.argv[2],
              'workflow_run_id':'${{ github.run_id }}',
              'status':'pass',
              'markers':safe[-100:],
          },ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')
          print('mio_social_resume_receipt=PASS')
          PY

      - name: Persist sanitized social resume evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f .agentos/evidence/mio-social-resume-latest.json
          git config user.name 'agentos-actions'
          git config user.email 'agentos-actions@users.noreply.github.com'
          git add .agentos/evidence/mio-social-resume-latest.json
          if git diff --cached --quiet; then
            echo 'mio_social_resume_evidence=UNCHANGED'
            exit 0
          fi
          git commit -m 'evidence(mio): persist owner-authorized social exploration receipt'
          git push origin HEAD:core/integration
          echo 'mio_social_resume_evidence=PUSHED'

# Owner requested live IR-governed exploration cycle: 2026-09-25T11:09Z
