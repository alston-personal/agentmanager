name: Attest Realm Fabric Process Identity

# Existing diagnostic workflow, now read-only and fully redacted. No printed
# systemd unit, shell arguments, process environment or private node map.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-attest-realm-fabric-process.yml'
      - 'scripts/attest_realm_loaded_source_redacted.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oracle-attest-realm-fabric-process.yml'
      - 'scripts/attest_realm_loaded_source_redacted.py'
      - 'tests/test_attest_realm_loaded_source_redacted.py'

permissions:
  contents: read

concurrency:
  group: oracle-realm-8780-readonly-attestation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate bounded redacted runtime attestation contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/attest_realm_loaded_source_redacted.py
          python3 -m unittest tests.test_attest_realm_loaded_source_redacted -v

  attest:
    needs: [validate]
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read only fixed live 8780 source candidates, never export raw config
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/attest_realm_loaded_source_redacted.py > realm-8780-attestation.json
          python3 -m json.tool realm-8780-attestation.json > /dev/null
          echo "realm_8780_redacted_attestation=PASS"
      - name: Save sanitized read-only attestation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realm-8780-redacted-attestation
          path: realm-8780-attestation.json
          if-no-files-found: warn
          retention-days: 7
