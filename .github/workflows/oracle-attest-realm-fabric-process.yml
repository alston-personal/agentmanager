name: Attest Realm Fabric Process Identity

# Existing diagnostic workflow, now read-only and fully redacted. No printed
# systemd unit, shell arguments, process environment or private node map.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-attest-realm-fabric-process.yml'
      - 'scripts/attest_realm_loaded_source_redacted.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oracle-attest-realm-fabric-process.yml'
      - 'scripts/attest_realm_loaded_source_redacted.py'
      - 'tests/test_attest_realm_loaded_source_redacted.py'

permissions:
  contents: read

concurrency:
  group: oracle-realm-8780-readonly-attestation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate bounded redacted runtime attestation contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/attest_realm_loaded_source_redacted.py
          python3 -m unittest tests.test_attest_realm_loaded_source_redacted -v

  attest:
    needs: [validate]
    if: github.event_name != 'pull_request'
    # The Realm service is owned by ubuntu, not the agentos-node runner
    # account. Reuse the governed Oracle SSH identity and preserve read-only
    # semantics; never treat a different user's MainPID as the live listener.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Read only real ubuntu-owned 8780 listener using exact source attester
        shell: bash
        run: |
          set -euo pipefail
          test "${DEPLOY_USER:-}" = ubuntu
          EXPECTED_SHA="$(sha256sum agent_core/realm_server.py | awk '{print $1}')"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 \
            -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" \
            "AGENTOS_REALM_ATTEST_ROOT=/home/ubuntu/agentmanager AGENTOS_REALM_ATTEST_EXPECTED_SHA256=$EXPECTED_SHA python3 -" \
            < scripts/attest_realm_loaded_source_redacted.py > realm-8780-attestation.json
          python3 -m json.tool realm-8780-attestation.json > /dev/null
          echo "realm_8780_redacted_attestation=PASS"
      - name: Save sanitized read-only attestation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realm-8780-redacted-attestation
          path: realm-8780-attestation.json
          if-no-files-found: warn
          retention-days: 7
