name: Durable Capability Contract Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'agent_core/capability_manifest_adapter.py'
      - 'agent_core/control_plane.py'
      - 'scripts/control_plane_lease_reconcile.py'
      - 'agent_core/governance_directory.py'
      - 'tests/test_capability_manifest_adapter.py'
      - 'tests/test_control_plane.py'
      - 'docs/architecture/DURABLE_CAPABILITY_INVARIANT.md'
      - '.github/workflows/durable-capability-contract-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest contract without Oracle dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile agent_core/capability_manifest_adapter.py scripts/control_plane_lease_reconcile.py
          python3 -m pip install 'pytest>=8,<9'
          python3 -m pytest tests/test_capability_manifest_adapter.py tests/test_control_plane.py -q
