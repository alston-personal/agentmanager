name: Diagnose Colab H3 Smoke 36822853863

on:
  push:
    branches:
      - diag/colab-h3-smoke-36822853863
    paths:
      - '.github/workflows/diag-colab-h3-smoke-36822853863.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Read sanitized receipt
        shell: bash
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "$DEPLOY_USER@127.0.0.1" bash -s <<'REMOTE'
          set -euo pipefail
          P=/home/ubuntu/agent-data/evidence/colab/h3-smoke-36822853863.json
          if [ -f "$P" ]; then
            echo receipt_exists=true
            python3 - "$P" <<'PY'
          import json,sys,re
          p=sys.argv[1]
          d=json.load(open(p,encoding='utf-8'))
          # extra safety redaction
          text=json.dumps(d,ensure_ascii=False,indent=2)
          text=re.sub(r'(?i)(access[_ -]?token|refresh[_ -]?token|authorization|bearer)\s*[:=]\s*\S+',r'\1=<redacted>',text)
          print(text)
          PY
          else
            echo receipt_exists=false
            ls -la /home/ubuntu/agent-data/evidence/colab || true
          fi
          REMOTE
