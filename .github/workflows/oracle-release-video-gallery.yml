name: Oracle Release Video Gallery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-release-video-gallery.yml'
      - '.github/workflows/reusable-studio-static-route-release.yml'

permissions:
  contents: read

concurrency:
  group: milkcat-video-gallery-production
  cancel-in-progress: true

jobs:
  release:
    uses: ./.github/workflows/reusable-studio-static-route-release.yml
    with:
      source_sha: 4c0af4dde06429547fe81dbbfed510edee5b8a2d
      route: videos
      backup_key: video-gallery
      receipt_schema: studio-web.video-gallery-release/v1
      acceptance_anchors: |-
        Milkcat World · Video Library
        AGENTOS · GENERATED FILMS
        澪 · 台北雨夜
        澪 · 山道上吹吹風
        /videos/assets/mio-taipei-rain-10s.mp4
        /videos/assets/mio-mountain-breeze-10s.mp4
      node_assets_manifest: |-
        /home/ubuntu/agent-data/artifacts/colab/mio-taipei-rain-36977321582/outputs/mio-taipei-rain-10s_mio-taipei-rain-10s.mp4|assets/mio-taipei-rain-10s.mp4|5c9d4dacd9c74aae65e34d15c1f3497963c9d1d41d44891a16ddabdbb0e46367
        /home/ubuntu/agent-data/artifacts/colab/mio-mountain-breeze-37082732581/outputs/mio-mountain-breeze-10s_mio-mountain-breeze-10s.mp4|assets/mio-mountain-breeze-10s.mp4|459ed4508f501711d61d3e1556654bf2d898a3ea5ccf494f05c7c08b859798db
    secrets:
      AGENTOS_DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER }}
      AGENTOS_DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT }}
      AGENTOS_DEPLOY_SSH_KEY: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY }}
      N8N_DEPLOY_USER: ${{ secrets.N8N_DEPLOY_USER }}
      N8N_DEPLOY_SSH_PORT: ${{ secrets.N8N_DEPLOY_SSH_PORT }}
      N8N_DEPLOY_SSH_KEY: ${{ secrets.N8N_DEPLOY_SSH_KEY }}
