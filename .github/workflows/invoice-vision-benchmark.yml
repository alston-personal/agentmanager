name: Invoice Vision Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - feat/invoice-vision-benchmark
    paths:
      - 'benchmarks/invoice_handwriting/**'
      - 'scripts/invoice_vision_benchmark.py'
      - '.github/workflows/invoice-vision-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_INVOICE_MODEL: gemini-3.8-flash
    steps:
      - uses: actions/checkout@v4
      - name: Run public handwritten invoice benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/invoice_vision_benchmark.py \
            --manifest benchmarks/invoice_handwriting/public_cases.json \
            --out /tmp/invoice-vision-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invoice-vision-benchmark
          path: /tmp/invoice-vision-benchmark.json
          if-no-files-found: ignore
          retention-days: 7


  rapidocr:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install RapidOCR CPU stack
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/invoice-rapidocr-venv
          /tmp/invoice-rapidocr-venv/bin/python -m pip install --upgrade pip
          /tmp/invoice-rapidocr-venv/bin/pip install rapidocr onnxruntime
      - name: Run RapidOCR public benchmark
        shell: bash
        run: |
          set -euo pipefail
          /tmp/invoice-rapidocr-venv/bin/python scripts/invoice_rapidocr_benchmark.py \
            --manifest benchmarks/invoice_handwriting/public_cases.json \
            --out /tmp/invoice-rapidocr-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invoice-rapidocr-benchmark
          path: /tmp/invoice-rapidocr-benchmark.json
          if-no-files-found: ignore
          retention-days: 7


  rapidocr-medium:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install RapidOCR CPU stack
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/invoice-rapidocr-medium-venv
          /tmp/invoice-rapidocr-medium-venv/bin/python -m pip install --upgrade pip
          /tmp/invoice-rapidocr-medium-venv/bin/pip install rapidocr onnxruntime
      - name: Run PP-OCRv6 medium public benchmark
        shell: bash
        run: |
          set -euo pipefail
          /tmp/invoice-rapidocr-medium-venv/bin/python scripts/invoice_rapidocr_benchmark.py \
            --manifest benchmarks/invoice_handwriting/public_cases.json \
            --model-size medium \
            --out /tmp/invoice-rapidocr-medium-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invoice-rapidocr-medium-benchmark
          path: /tmp/invoice-rapidocr-medium-benchmark.json
          if-no-files-found: ignore
          retention-days: 7
