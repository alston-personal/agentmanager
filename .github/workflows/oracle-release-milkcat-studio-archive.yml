name: Oracle Release Milkcat Studio Archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-release-milkcat-studio-archive.yml'

permissions:
  contents: read

concurrency:
  group: milkcat-studio-archive-production
  cancel-in-progress: true

jobs:
  release:
    uses: ./.github/workflows/reusable-studio-static-route-release.yml
    with:
      source_sha: cfa50f0cb16305d7e0e007764e076ed142e5d83c
      route: studio
      backup_key: milkcat-studio-archive
      receipt_schema: studio-web.milkcat-studio-archive-release/v1
      acceptance_anchors: |-
        Milkcat Studio Portal
        AI AGENT EXPERIMENTS
        連載作品
      credit_account: ''
      credit_cost: 0
    secrets:
      AGENTOS_DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER }}
      AGENTOS_DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT }}
      AGENTOS_DEPLOY_SSH_KEY: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY }}
      N8N_DEPLOY_USER: ${{ secrets.N8N_DEPLOY_USER }}
      N8N_DEPLOY_SSH_PORT: ${{ secrets.N8N_DEPLOY_SSH_PORT }}
      N8N_DEPLOY_SSH_KEY: ${{ secrets.N8N_DEPLOY_SSH_KEY }}
