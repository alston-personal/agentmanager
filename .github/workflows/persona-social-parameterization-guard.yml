name: Persona Social Parameterization Guard

on:
  pull_request:
    branches:
      - core/integration
    paths:
      - 'agentos_node/persona_life.py'
      - 'scripts/mio_persona_social_loop_user.py'
      - 'scripts/sync_persona_pdca_social_outcome_user.py'
      - 'scripts/install_persona_social_timer_user.sh'
      - 'scripts/bootstrap_oursong_persona_user.py'
      - 'scripts/persona_pdca_tick_user.py'
      - 'scripts/activate_oursong_persona_user.sh'
      - 'personas/**/agent.yaml'
      - 'personas/**/runtime.env.example'
      - 'tests/test_mio_social_contract.py'
      - 'tests/test_persona_social_parameterization.py'
      - 'tests/test_oursong_persona_bootstrap.py'
      - 'tests/test_persona_social_exact_release.py'
      - 'tests/test_persona_pdca_tick_contract.py'
      - '.github/workflows/persona-social-parameterization-guard.yml'
  push:
    branches:
      - feat/oursong-persona-agent
    paths:
      - 'agentos_node/persona_life.py'
      - 'scripts/mio_persona_social_loop_user.py'
      - 'scripts/sync_persona_pdca_social_outcome_user.py'
      - 'scripts/install_persona_social_timer_user.sh'
      - 'personas/**'
      - 'tests/test_persona_social_parameterization.py'
      - '.github/workflows/persona-social-parameterization-guard.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile persona runtime
        run: |
          python -m py_compile             agentos_node/persona_life.py             scripts/mio_persona_social_loop_user.py             scripts/sync_persona_pdca_social_outcome_user.py \
            scripts/bootstrap_oursong_persona_user.py \
            scripts/persona_pdca_tick_user.py
      - name: Validate timer and activation installers
        run: |
          bash -n scripts/install_persona_social_timer_user.sh
          bash -n scripts/activate_oursong_persona_user.sh
      - name: Run focused persona social contracts
        run: |
          python -m unittest -v             tests.test_mio_social_contract             tests.test_persona_social_parameterization \
            tests.test_oursong_persona_bootstrap \
            tests.test_persona_social_exact_release \
            tests.test_persona_pdca_tick_contract
