name: Verify Windows Shell Timeout Isolation

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/verify-windows-shell-timeout.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Prove timeout isolation and node survival
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          f=RealmFabricStore()

          tid='verify-shell-timeout-isolation-20261002-1315'
          if f.get_receipt(tid) is None:
              f.queue_task('VO10005870',{
                  'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec',
                  'executable':r'C:\Users\alston.huang\AppData\Local\Programs\Python\Python312\python.exe',
                  'argv':['-c','import time; time.sleep(15)'],
                  'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':3,
                  'cognition_ids_used':['demo://timeout-isolation/20261002'],
              })
          for _ in range(25):
              r=f.get_receipt(tid)
              if r is not None:
                  print('TIMEOUT_RECEIPT='+json.dumps(r,ensure_ascii=False,separators=(',',':')))
                  assert r.get('ok') is False, r
                  assert 'timed out' in str(r.get('error') or '').lower(), r
                  break
              time.sleep(1)
          else:
              raise SystemExit('timeout_receipt_missing')

          vid='verify-node-survives-shell-timeout-20261002-1315'
          if f.get_receipt(vid) is None:
              f.queue_task('VO10005870',{
                  'schema':'agentos.node-task/v0.1','task_id':vid,'action':'desktop.session.inspect',
                  'cognition_ids_used':['demo://timeout-isolation/20261002'],
              })
          for _ in range(25):
              r=f.get_receipt(vid)
              if r is not None:
                  print('SURVIVAL_RECEIPT='+json.dumps(r,ensure_ascii=False,separators=(',',':')))
                  assert r.get('ok') is True, r
                  break
              time.sleep(1)
          else:
              raise SystemExit('node_survival_receipt_missing')
          PY
          REMOTE
