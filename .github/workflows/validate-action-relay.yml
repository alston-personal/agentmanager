name: Validate AgentOS Relay Contracts

on:
  workflow_dispatch:
  push:
    paths:
      - 'agentos_node/action_relay.py'
      - 'agentos_node/antigravity_relay.py'
      - 'agentos_node/antigravity_relay_worker.py'
      - 'tests/test_action_relay.py'
      - 'tests/test_antigravity_relay_worker.py'
      - '.github/workflows/validate-action-relay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'agentos_node/action_relay.py'
      - 'agentos_node/antigravity_relay.py'
      - 'agentos_node/antigravity_relay_worker.py'
      - 'tests/test_action_relay.py'
      - 'tests/test_antigravity_relay_worker.py'
      - '.github/workflows/validate-action-relay.yml'

permissions:
  contents: read

jobs:
  validate-contracts:
    # Contract CI must never mutate Oracle runtime state or consume the single
    # self-hosted deployment runner. Runtime migration/acceptance is handled by
    # explicit Oracle recovery workflows.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit test deterministic Action Relay
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python3 -m unittest tests.test_action_relay -v
      - name: Unit test Antigravity no-replay and timeout semantics
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python3 -m unittest tests.test_antigravity_relay_worker -v
      - name: Import relay contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python3 - <<'PY'
          from agentos_node.action_relay import ACTIONS
          from agentos_node.antigravity_relay import AntigravityRelayClient
          from agentos_node.antigravity_relay_worker import AntigravityRelayWorker
          assert 'site.sync_build' in ACTIONS
          assert 'agentos.antigravity.restart' in ACTIONS
          print('relay_contract_import=PASS')
          PY
