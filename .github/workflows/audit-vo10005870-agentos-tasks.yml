name: Audit All VO10005870 AgentOS Scheduled Tasks

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/audit-vo10005870-agentos-tasks.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Audit all AgentOS scheduled tasks
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import time
          from agent_core.realm_fabric import RealmFabricStore
          f=RealmFabricStore()
          tid='audit-all-agentos-tasks-20261002-1603'
          ps=r'''Get-ScheduledTask |
          Where-Object { $_.TaskName -match 'AgentOS|Thin Client|Watchdog' -or ($_.Actions | Out-String) -match 'AgentOS|thin_client|watchdog' } |
          ForEach-Object {
            $i=Get-ScheduledTaskInfo -TaskName $_.TaskName -TaskPath $_.TaskPath -ErrorAction SilentlyContinue
            Write-Output ('TASK='+$_.TaskPath+$_.TaskName)
            Write-Output ('STATE='+[string]$_.State+' LAST_RESULT='+$i.LastTaskResult+' LAST_RUN='+$i.LastRunTime.ToUniversalTime().ToString('o')+' NEXT_RUN='+$i.NextRunTime.ToUniversalTime().ToString('o'))
            foreach($a in $_.Actions){Write-Output ('ACTION='+$a.Execute+' '+$a.Arguments)}
            foreach($tr in $_.Triggers){Write-Output ('TRIGGER='+($tr | Out-String).Trim())}
            Write-Output '---'
          }'''
          if f.get_receipt(tid) is None:
              f.queue_task('VO10005870',{
                  'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec',
                  'executable':'powershell','argv':['-NoProfile','-NonInteractive','-Command',ps],
                  'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':20,
                  'cognition_ids_used':['demo://watchdog-audit/20261002'],
              })
          for _ in range(35):
              r=f.get_receipt(tid)
              if r is not None:
                  print(r.get('stdout') or '')
                  print('ERR='+str(r.get('error') or ''))
                  break
              time.sleep(1)
          else:
              raise SystemExit('audit_receipt_missing')
          PY
          REMOTE
