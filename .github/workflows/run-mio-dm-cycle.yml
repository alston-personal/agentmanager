name: Run Mio DM Cycle
on:
  push:
    paths:
      - '.github/workflows/run-mio-dm-cycle.yml'
      - 'scripts/run_mio_oursong_dm_live_once.py'
permissions:
  contents: read
jobs:
  dm:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Transfer live DM runner
        shell: bash
        run: |
          set -euo pipefail
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            scripts/run_mio_oursong_dm_live_once.py \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/run_mio_oursong_dm_live_once.py"
      - name: Run authenticated Mio DM cycle
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          journalctl --user -u mio-threads-session-supervisor.service -n 30 --no-pager | grep -q 'mio_threads_session_supervisor_state=AUTHENTICATED'
          test -n "$(curl -fsS http://127.0.0.1:9222/json/version)"
          test -n "$(curl -fsS http://127.0.0.1:9223/json/version)"
          cd "$HOME/agentmanager"
          GUI_PY="$HOME/.local/share/agentos/gui-worker/venv/bin/python"
          test -x "$GUI_PY"
          PYTHONPATH="$HOME/agentmanager" "$GUI_PY" /tmp/run_mio_oursong_dm_live_once.py
          rm -f /tmp/run_mio_oursong_dm_live_once.py
          REMOTE
