name: Run Mio DM Cycle
on:
  push:
    paths:
      - '.github/workflows/run-mio-dm-cycle.yml'
permissions:
  contents: read
jobs:
  dm:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Run Mio DM bridge and autonomous decision
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$HOME/agentmanager"
          export PYTHONPATH="$HOME/agentmanager:$HOME/.local/share/agentos/gui-worker"
          echo '=== DM BRIDGE ==='
          python3 scripts/threads_web_dm_bridge_user.py --persona mio
          echo '=== DM AUTONOMOUS ==='
          python3 scripts/mio_threads_dm_autonomous_user.py
          echo '=== DM EVENT TAIL ==='
          ROOT="$HOME/.local/share/agentos/social/threads-web-dm/mio"
          test -f "$ROOT/events.jsonl" && tail -n 8 "$ROOT/events.jsonl" | sed -E 's/("text"[[:space:]]*:[[:space:]]*")[^"]*"/\1[redacted]"/g' || true
          REMOTE
