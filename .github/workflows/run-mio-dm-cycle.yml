name: Diagnose Mio Oursong DM Timer Install
on:
  push:
    paths:
      - '.github/workflows/run-mio-dm-cycle.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Diagnose
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -u
          echo '=== ID ==='; id
          echo '=== DF ==='; df -h /
          echo '=== PREREQS ==='
          for p in             "$HOME/.local/share/agentos/gui-worker/venv/bin/python"             "$HOME/agentmanager/scripts/mio_persona_dm_decision_user.py"             "$HOME/agentmanager/scripts/mio_dm_oracle_oursong_acceptance.py"             "$HOME/agentmanager/agentos_node/social/dm_loop_guard.py"             /tmp/install_mio_oursong_dm_timer.sh             /tmp/mio_oursong_dm_cycle.py
          do
            if [ -e "$p" ]; then echo "PASS $p"; else echo "MISS $p"; fi
          done
          echo '=== UNIT DIR ==='
          ls -ld "$HOME/.config/systemd/user" "$HOME/.local/bin" 2>&1 || true
          echo '=== INSTALL TRACE ==='
          bash -x /tmp/install_mio_oursong_dm_timer.sh /tmp/mio_oursong_dm_cycle.py 2>&1 || true
          echo '=== UNITS AFTER ==='
          systemctl --user cat mio-oursong-dm-autonomous.service mio-oursong-dm-autonomous.timer 2>&1 || true
          systemctl --user list-timers --all --no-pager | grep mio-oursong || true
          REMOTE
