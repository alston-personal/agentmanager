name: Install Mio Oursong DM Timer
on:
  push:
    paths:
      - '.github/workflows/run-mio-dm-cycle.yml'
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/integration
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Transfer timer runtime
        shell: bash
        run: |
          set -euo pipefail
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/mio_oursong_dm_oracle_cycle_user.py "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/mio_oursong_dm_cycle.py"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new agentos_node/social/dm_loop_guard.py "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/dm_loop_guard.py"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/install_mio_oursong_dm_timer_user.sh "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/install_mio_oursong_dm_timer.sh"
      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          bash /tmp/install_mio_oursong_dm_timer.sh /tmp/mio_oursong_dm_cycle.py /tmp/dm_loop_guard.py
          systemctl --user is-active --quiet mio-oursong-dm-autonomous.timer
          systemctl --user is-enabled --quiet mio-oursong-dm-autonomous.timer
          systemctl --user --no-pager --full status mio-oursong-dm-autonomous.timer
          rm -f /tmp/install_mio_oursong_dm_timer.sh /tmp/mio_oursong_dm_cycle.py /tmp/dm_loop_guard.py
          echo "mio_oursong_dm_install_acceptance=PASS"
          REMOTE

