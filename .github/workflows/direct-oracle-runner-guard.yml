name: Direct Oracle Runner Guard

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/**'
      - 'scripts/check_no_direct_oracle_runner.py'
      - '.agentos/governance/legacy-direct-oracle-workflows.txt'
  pull_request:
    branches: [core/integration]
    paths:
      - '.github/workflows/**'
      - 'scripts/check_no_direct_oracle_runner.py'
      - '.agentos/governance/legacy-direct-oracle-workflows.txt'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_no_direct_oracle_runner.py
