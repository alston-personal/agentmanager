name: Direct Oracle Runner Guard

on:
  push:
    branches:
      - fix/one-controller-ingress
    paths:
      - '.github/workflows/**'
      - 'scripts/check_no_direct_oracle_runner.py'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/check_no_direct_oracle_runner.py'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_no_direct_oracle_runner.py
