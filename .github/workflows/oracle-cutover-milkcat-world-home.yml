name: Oracle Publish Studio Web Root Surface

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-cutover-milkcat-world-home.yml'

permissions:
  contents: read

concurrency:
  group: studio-web-root-surface-publish
  cancel-in-progress: true

jobs:
  cutover:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 15
    env:
      SOURCE_REPOSITORY: alston-personal/studio-web
      SOURCE_SHA: 2e20cd20e620b1643c85ebe426466161b3a2264c
    steps:
      - uses: actions/checkout@v4

      - name: Validate contract
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "studio_web_root_surface_contract=PASS"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Build pinned Studio Web and atomically publish root-owned artifacts
        env:
          DEPLOY_HOST: 127.0.0.1
          DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "$PORT" -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          REPO="$1"; SOURCE_SHA="$2"; RUN_ID="$3"
          LIVE=/home/ubuntu/zeus-writer/website/dist
          TMP=$(mktemp -d /tmp/milkcat-home-cutover-XXXXXX)
          SRC="$TMP/studio-web"
          BACKUP=/home/ubuntu/agent-data/releases/studio-web/milkcat-world-home/${SOURCE_SHA:0:12}-$RUN_ID
          mkdir -p "$BACKUP"
          cleanup(){ rm -rf "$TMP"; }
          trap cleanup EXIT

          git clone -q "https://github.com/$REPO.git" "$SRC"
          cd "$SRC"
          git checkout -q --detach "$SOURCE_SHA"
          npm install --no-package-lock --ignore-scripts >/dev/null
          npm run build >/dev/null

          test -f "$SRC/dist/index.html"
          test -f "$SRC/dist/agentos/join.md"
          test -f "$SRC/dist/agentos/join/index.html"
          test -f "$SRC/dist/agentos/join.html"
          test -f "$SRC/dist/.well-known/agentos.json"
          grep -Fq 'Milkcat World' "$SRC/dist/index.html"
          grep -Fq '/world/' "$SRC/dist/index.html"
          grep -Fq '# Join AgentOS ONE' "$SRC/dist/agentos/join.md"
          grep -Fq '<title>Join AgentOS ONE</title>' "$SRC/dist/agentos/join/index.html"
          grep -Fq '<title>Join AgentOS ONE</title>' "$SRC/dist/agentos/join.html"
          grep -Fq '"onboarding": "https://studio.milkcat.org/agentos/join.html"' "$SRC/dist/.well-known/agentos.json"

          test -d "$LIVE"
          mkdir -p "$BACKUP" "$LIVE/agentos" "$LIVE/.well-known"
          for rel in index.html agentos/join.md agentos/join.html agentos/join/index.html .well-known/agentos.json; do
            if [ -f "$LIVE/$rel" ]; then
              mkdir -p "$BACKUP/$(dirname "$rel")"
              cp -a "$LIVE/$rel" "$BACKUP/$rel.previous"
            fi
          done

          install -m 0644 "$SRC/dist/index.html" "$LIVE/.index-$RUN_ID.html"
          mv -f "$LIVE/.index-$RUN_ID.html" "$LIVE/index.html"
          install -d "$LIVE/agentos/join"
          install -m 0644 "$SRC/dist/agentos/join.md" "$LIVE/agentos/join.md"
          install -m 0644 "$SRC/dist/agentos/join.html" "$LIVE/agentos/join.html"
          install -m 0644 "$SRC/dist/agentos/join/index.html" "$LIVE/agentos/join/index.html"
          install -m 0644 "$SRC/dist/.well-known/agentos.json" "$LIVE/.well-known/agentos.json"

          rollback() {
            for rel in index.html agentos/join.md .well-known/agentos.json; do
              if [ -f "$BACKUP/$rel.previous" ]; then
                mkdir -p "$LIVE/$(dirname "$rel")"
                cp -a "$BACKUP/$rel.previous" "$LIVE/$rel"
              else
                rm -f "$LIVE/$rel"
              fi
            done
          }

          curl -fsS --retry 4 --retry-delay 2 https://studio.milkcat.org/ | grep -Fq 'Milkcat World' || { rollback; exit 1; }
          curl -fsS --retry 4 --retry-delay 2 https://studio.milkcat.org/agentos/join.html | grep -Fq '<title>Join AgentOS ONE</title>' || { rollback; exit 1; }
          curl -LfsS --retry 4 --retry-delay 2 https://studio.milkcat.org/agentos/join/ | grep -Fq '<title>Join AgentOS ONE</title>' || { rollback; exit 1; }
          curl -fsS --retry 4 --retry-delay 2 https://studio.milkcat.org/agentos/join.md | grep -Fq '# Join AgentOS ONE' || { rollback; exit 1; }
          curl -fsS --retry 4 --retry-delay 2 https://studio.milkcat.org/.well-known/agentos.json | grep -Fq '"onboarding": "https://studio.milkcat.org/agentos/join.html"' || { rollback; exit 1; }

          echo "studio_web_root_surface_publish=PASS source_sha=$SOURCE_SHA backup=$BACKUP"
          REMOTE

      - name: Public root surface acceptance
        run: |
          set -euo pipefail
          OUT=$(mktemp)
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors "https://studio.milkcat.org/?_=$GITHUB_RUN_ID" -o "$OUT"
          grep -Fq 'Milkcat World' "$OUT"
          grep -Fq '/world/' "$OUT"
          HTML_JOIN=$(mktemp)
          RAW_JOIN=$(mktemp)
          DISCOVERY=$(mktemp)
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors "https://studio.milkcat.org/agentos/join.html?_=$GITHUB_RUN_ID" -o "$HTML_JOIN"
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors "https://studio.milkcat.org/agentos/join.md?_=$GITHUB_RUN_ID" -o "$RAW_JOIN"
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors "https://studio.milkcat.org/.well-known/agentos.json?_=$GITHUB_RUN_ID" -o "$DISCOVERY"
          grep -Fq '<title>Join AgentOS ONE</title>' "$HTML_JOIN"
          grep -Fq '# Join AgentOS ONE' "$RAW_JOIN"
          grep -Fq '"onboarding": "https://studio.milkcat.org/agentos/join.html"' "$DISCOVERY"
          echo "public_studio_web_root_surface_acceptance=PASS"
