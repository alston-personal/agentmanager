name: Oracle Start Threads Web DM Login

on:
  workflow_dispatch:
  push:
    branches:
      - core/integration
    paths:
      - '.github/workflows/oracle-start-threads-web-dm-login.yml'
      - 'scripts/start_threads_web_dm_login_user.sh'
      - 'scripts/submit_oracle_bootstrap_request_remote.sh'

permissions:
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/core/integration"
          python3 -m py_compile agentos_node/bootstrap_control.py
          bash -n scripts/start_threads_web_dm_login_user.sh
          bash -n scripts/submit_oracle_bootstrap_request_remote.sh

      - name: Start login via governed GUI lane
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID="threads-web-dm-login-start-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RECEIPT="$RUNNER_TEMP/threads-web-dm-login-start-receipt.json"
          AGENTOS_RECEIPT_TIMEOUT_SECONDS=300 \
            bash scripts/submit_oracle_bootstrap_request_remote.sh \
              agentos.social_threads_web_dm.login_start "$REQUEST_ID" "$GITHUB_SHA" '{}' > "$RECEIPT"

          python3 - "$RECEIPT" "$GITHUB_SHA" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8")); expected=sys.argv[2]
          assert r.get("schema")=="agentos.bootstrap-receipt/v1",r
          assert r.get("action")=="agentos.social_threads_web_dm.login_start",r
          assert r.get("executor_user")=="ubuntu",r
          assert r.get("source_commit")==expected,r
          scheduler=r.get("scheduler") or {}
          assert scheduler.get("worker_role")=="gui",scheduler
          assert scheduler.get("worker_id")=="oracle-gui",scheduler
          assert r.get("ok") is True,r
          text="\n".join(str(s.get("stdout",""))+"\n"+str(s.get("stderr","")) for s in r.get("steps",[]))
          assert "threads_web_dm_login_start=PASS" in text,text[-8000:]
          print("agentos_scheduler_worker=oracle-gui:gui")
          print("threads_web_dm_login_start_receipt=PASS")
          for line in text.splitlines():
              if line.startswith(("threads_web_dm_login_mode=","threads_web_dm_login_browser_persistent=","threads_web_dm_login_remote_view=")):
                  print(line)
          PY
