name: Oracle Realm Environment Probe

on:
  push:
    branches:
      - ops/oracle-drift-probe-20260904
    paths:
      - ".github/workflows/oracle-realm-env-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Probe selected non-secret Realm environment
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          set -a
          source .env
          set +a
          echo "shell_AGENT_DATA_ROOT=${AGENT_DATA_ROOT:-<unset>}"
          echo "shell_AGENT_DATA_DIR=${AGENT_DATA_DIR:-<unset>}"
          echo "shell_AGENTOS_DATA_ROOT=${AGENTOS_DATA_ROOT:-<unset>}"
          pid="$(systemctl --user show agentos-realm-fabric.service -p MainPID --value)"
          echo "realm_pid=$pid"
          readlink -f "/proc/$pid/cwd" | sed 's#^#realm_cwd=#'
          readlink -f "/proc/$pid/exe" | sed 's#^#realm_exe=#'
          python3 - "$pid" <<'PY'
          import sys
          from pathlib import Path
          pid=sys.argv[1]
          raw=Path(f'/proc/{pid}/environ').read_bytes().split(b'\0')
          allowed={b'AGENT_DATA_ROOT',b'AGENT_DATA_DIR',b'AGENTOS_DATA_ROOT',b'PYTHONPATH',b'AGENT_PROJECT_ROOT'}
          for item in raw:
              if b'=' not in item: continue
              k,v=item.split(b'=',1)
              if k in allowed:
                  print('proc_'+k.decode()+'='+v.decode(errors='replace'))
          PY
          echo "--- target module resolution with service interpreter ---"
          TARGET_WORKTREE="$HOME/.local/share/agentos/action-runtime"
          cd "$TARGET_WORKTREE"
          "$HOME/agentmanager/.venv/bin/python3" - <<'PY'
          import agent_core.realm_server as rs
          import agent_core.runtime_converge_capability as rc
          print('realm_server_file='+rs.__file__)
          print('runtime_capability_file='+rc.__file__)
          print('default_marker_path='+str(rc.default_marker_path()))
          PY
          REMOTE
