name: Oracle Exact Bootstrap No Editable Install

on:
  push:
    branches:
      - ops/oracle-drift-probe-20260904
    paths:
      - ".github/workflows/oracle-exact-bootstrap-noeditable.yml"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}

    steps:
      - name: Validate connection
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST_SOURCE:-}"
          test -n "${DEPLOY_USER:-}"
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Exact-SHA bootstrap without editable package install
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          REF="core/integration"
          EXPECTED="34ea3e75a8fd0f701a0ca78a02820680d5c5fa99"
          EXPECTED_PREVIOUS="42f21560c7d7e6692373938358f57b9262e198f0"
          ORIGINAL_MANUAL_RUN="33846887821"
          cd "$ROOT"

          [ "$(id -un)" = "ubuntu" ] || { echo "bootstrap_refused=user_mismatch"; exit 2; }
          PREVIOUS_SHA="$(git rev-parse HEAD)"
          [ "$PREVIOUS_SHA" = "$EXPECTED_PREVIOUS" ] || { echo "bootstrap_refused=previous_sha_mismatch:$PREVIOUS_SHA"; exit 2; }
          [ -z "$(git status --porcelain --untracked-files=no)" ] || { echo "bootstrap_refused=tracked_tree_dirty"; exit 2; }

          git fetch --prune origin "$REF"
          TARGET_SHA="$(git rev-parse FETCH_HEAD)"
          [ "$TARGET_SHA" = "$EXPECTED" ] || { echo "bootstrap_refused=target_head_mismatch:$TARGET_SHA"; exit 2; }

          collisions="$(mktemp)"
          trap 'rm -f "$collisions"' EXIT
          while IFS= read -r -d '' path; do
            if git cat-file -e "$EXPECTED:$path" 2>/dev/null; then
              printf '%s\n' "$path" >> "$collisions"
            fi
          done < <(git ls-files --others --exclude-standard -z)
          [ ! -s "$collisions" ] || { echo "bootstrap_refused=target_collisions_remain"; cat "$collisions"; exit 2; }

          DATA_ROOT="${AGENT_DATA_ROOT:-${AGENT_DATA_DIR:-$HOME/agent-data}}"
          CAPABILITY_MARKER="$DATA_ROOT/runtime/action-relay/capabilities.json"
          FABRIC_FILE="$DATA_ROOT/realm/fabric.json"
          mkdir -p "$DATA_ROOT/runtime"
          [ -f "$FABRIC_FILE" ] || { echo "bootstrap_refused=existing_fabric_missing"; exit 2; }
          EXISTING_REALM_ID="$(python3 - "$FABRIC_FILE" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          value = str(data.get('realm_id') or '').strip()
          if not value:
              raise SystemExit(2)
          print(value)
          PY
          )"
          [ -n "$EXISTING_REALM_ID" ] || { echo "bootstrap_refused=existing_realm_id_missing"; exit 2; }

          rollback() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "bootstrap_retry_failed=true" >&2
              echo "rollback_target=$PREVIOUS_SHA" >&2
              rm -f "$CAPABILITY_MARKER" || true
              git checkout --detach "$PREVIOUS_SHA" || true
              PYTHONPATH="$ROOT" python3 scripts/install_services.py || true
              curl -fsS http://127.0.0.1:8765/health || true
            fi
            exit "$rc"
          }
          trap rollback EXIT

          echo "human_authority_source_run=$ORIGINAL_MANUAL_RUN"
          echo "bootstrap_target=$EXPECTED"
          echo "preserved_realm_id=$EXISTING_REALM_ID"
          git checkout --detach "$EXPECTED"
          [ "$(git rev-parse HEAD)" = "$EXPECTED" ]

          PYTHONPATH="$ROOT" python3 - <<'PY'
          import agent_core
          import agentos_node
          import runtime_core
          from agent_core.platform import get_platform_driver
          print("source_import=PASS")
          print("platform=" + get_platform_driver().platform_name())
          PY
          bash -n scripts/install_systemd_user.sh
          bash -n scripts/bootstrap_runtime_converger_oracle.sh

          set -a
          source .env
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          [ "${AGENT_MODE:-CLIENT}" = "CORE" ] || { echo "bootstrap_refused=agent_mode_not_core"; exit 2; }
          [ -n "${AGENTOS_CONTROL_PLANE_TOKEN:-}" ] || { echo "bootstrap_refused=control_plane_token_missing"; exit 2; }
          export AGENTOS_REALM_ID="$EXISTING_REALM_ID"

          PYTHONPATH="$ROOT" python3 scripts/install_services.py
          systemctl --user is-active --quiet agentos-control-plane.service
          curl -fsS http://127.0.0.1:8765/health >/dev/null

          bash scripts/bootstrap_runtime_converger_oracle.sh "$REF" "$EXPECTED"

          [ "$(git rev-parse HEAD)" = "$EXPECTED" ]
          test -f "$CAPABILITY_MARKER"
          printf '%s\n' "$PREVIOUS_SHA" > "$DATA_ROOT/runtime/previous-agentos-core-sha"
          printf '%s\n' "$EXPECTED" > "$DATA_ROOT/runtime/bootstrapped-agentos-core-sha"
          trap - EXIT
          rm -f "$collisions"

          echo "oracle_exact_bootstrap=PASS"
          echo "source_ref=$REF"
          echo "source_commit=$EXPECTED"
          echo "previous_sha=$PREVIOUS_SHA"
          echo "realm_id_preserved=$EXISTING_REALM_ID"
          echo "editable_install_used=false"
          REMOTE
