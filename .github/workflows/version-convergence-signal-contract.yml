name: Version Convergence Signal Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/version_convergence_signal.py'
      - 'agent_core/runtime_ota_acceptance.py'
      - 'tests/test_runtime_ota_candidate_recheck.py'
      - 'scripts/run_realm_node_transactional_ota_user.sh'
      - 'scripts/windows/transactional_ota_finalize.ps1'
      - 'scripts/windows/recovery_one_probe.py'
      - 'tests/test_recovery_one_probe.py'
      - 'tests/test_recovery_one_install_contract.py'
      - 'install-agentos.ps1'
      - 'scripts/install_thin_client_windows.ps1'
      - 'tests/test_runtime_ota_download_integrity.py'
      - 'agentos_node/bootstrap_scheduler.py'
      - 'tests/test_bootstrap_scheduler_queue_ttl.py'
      - 'tests/test_version_convergence_signal.py'
      - '.github/workflows/version-convergence-signal-contract.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-event-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test version event and acknowledgement truth boundaries
        run: python3 -m unittest tests.test_version_convergence_signal -v
      - name: Test maintenance communication update mutex
        run: python3 -m unittest tests.test_bootstrap_scheduler_queue_ttl -v
      - name: Test active candidate recheck after OTA probe
        run: python3 -m unittest tests.test_runtime_ota_candidate_recheck -v
      - name: Test downloaded OTA script integrity contract
        run: python3 -m unittest tests.test_runtime_ota_download_integrity -v
      - name: Test independent read-only ONE recovery probe
        run: python3 -m unittest tests.test_recovery_one_probe -v
      - name: Test canonical Windows recovery installation contract
        run: python3 -m unittest tests.test_recovery_one_install_contract -v
      - name: Produce protected main source event (not an Executor delivery)
        if: github.event_name == 'push'
        shell: bash
        env:
          HEAD_SHA: ${{ github.sha }}
          PUSHED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          git diff --name-only HEAD^ HEAD > "$RUNNER_TEMP/version-changed-paths.txt"
          test -s "$RUNNER_TEMP/version-changed-paths.txt"
          python3 scripts/version_convergence_signal.py \
            --main-sha "$HEAD_SHA" \
            --previous-sha "$(git rev-parse HEAD^)" \
            --paths-file "$RUNNER_TEMP/version-changed-paths.txt" \
            --published-at "$PUSHED_AT" \
            --output "$RUNNER_TEMP/version-convergence-event.json"
          python3 -m json.tool "$RUNNER_TEMP/version-convergence-event.json" >/dev/null
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: version-convergence-source-${{ github.sha }}
          path: ${{ runner.temp }}/version-convergence-event.json
          retention-days: 30
          if-no-files-found: error
