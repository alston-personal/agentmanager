name: PDCA Social Bridge Isolated CI

on:
  push:
    branches: [core/pdca-social-bridge]
    paths:
      - 'scripts/mio_persona_social_loop_user.py'
      - 'scripts/sync_mio_pdca_social_outcome_user.py'
      - 'tests/test_mio_social_contract.py'
      - '.github/workflows/pdca-social-bridge-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test PDCA Social bridge
        run: |
          set -euo pipefail
          python3 -m py_compile             scripts/mio_persona_social_loop_user.py             scripts/sync_mio_pdca_social_outcome_user.py
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_mio_social_contract.py' -v
