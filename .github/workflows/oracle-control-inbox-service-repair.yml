name: Deploy Control Inbox Service Repair

# Explicit, manual maintenance deployment. Never dispatch as a generic
# control-plane fallback. A successful deployment still requires a fresh #50
# receipt before the ChatGPT control transport can be declared recovered.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: oracle-control-inbox-service-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 845 &&
        github.actor == 'alstonhuang' &&
        github.event.comment.body == '/agentos repair-control-inbox'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/integration
      - name: Validate exact integration generation
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOY_USER" = ubuntu
          source_commit="$(git rev-parse HEAD)"
          test -n "$source_commit"
          test "${#source_commit}" = 40
          python3 -m py_compile scripts/control_inbox_service_repair.py
          echo "control_inbox_repair_source_commit=$source_commit"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Deploy fixed Control Inbox credential and service repair
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" \
            'python3 -' < scripts/control_inbox_service_repair.py
