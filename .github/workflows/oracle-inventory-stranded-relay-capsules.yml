name: Inventory Stranded Relay Capsules

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-inventory-stranded-relay-capsules.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inventory stranded capsules without executing them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/stranded-relay-capsules.txt
          python3 - <<'PY' | tee "$OUT"
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path

          root=Path('/home/ubuntu/agent-data/runtime/antigravity-relay/processing')
          now=datetime.now(timezone.utc)
          print('inventory_utc='+now.replace(microsecond=0).isoformat().replace('+00:00','Z'))
          files=sorted(root.glob('relay-*.json'))
          print('count='+str(len(files)))
          for p in files:
              print('\n=== '+p.stem+' ===')
              try:
                  d=json.loads(p.read_text(encoding='utf-8'))
              except Exception as exc:
                  print('read_error='+repr(exc)); continue
              created=str(d.get('created_at') or '')
              age='unknown'
              try:
                  dt=datetime.fromisoformat(created.replace('Z','+00:00'))
                  age=str(int((now-dt.astimezone(timezone.utc)).total_seconds()))
              except Exception:
                  pass
              ir=d.get('canonical_ir') if isinstance(d.get('canonical_ir'),dict) else {}
              inst=str(d.get('instruction') or '').replace('\n',' ')
              constraints=ir.get('constraints') if isinstance(ir.get('constraints'),list) else []
              print('created_at='+created)
              print('age_seconds='+age)
              print('project_id='+str(d.get('project_id') or ''))
              print('workspace='+str(d.get('workspace') or ''))
              print('goal='+str(ir.get('goal') or '').replace('\n',' ')[:700])
              print('constraints='+json.dumps(constraints,ensure_ascii=False)[:1200])
              print('instruction_sha256='+hashlib.sha256(inst.encode()).hexdigest())
              print('instruction_preview='+inst[:1200])
          PY
      - name: Commit inventory evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/stranded-relay-capsules.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(agentos): inventory stranded relay capsules'
          git pull --rebase origin main
          git push
