name: Employee Runtime Guard

on:
  pull_request:
    branches:
      - core/integration
      - main
    paths:
      - 'agent_core/employee_runtime.py'
      - 'agent_core/employee_lifecycle.py'
      - 'agent_core/employee_wake.py'
      - 'agent_core/employee_memory.py'
      - 'agent_core/employee_skills.py'
      - 'agent_core/employee_threads.py'
      - 'agent_core/employee_realm_mailbox.py'
      - 'agent_core/employee_presence.py'
      - 'agent_core/employee_wake_delivery.py'
      - 'agent_core/core_supervisor.py'
      - 'agent_core/core_work_items.py'
      - 'agent_core/core_supervisor_service.py'
      - 'agent_core/core_supervisor_daemon.py'
      - 'agent_core/core_supervisor_delivery.py'
      - 'agent_core/spec_steward_bootstrap.py'
      - 'agent_core/spec_steward_acceptance.py'
      - 'agent_core/role_runtime.py'
      - 'agentos_node/employee_wake_inbox.py'
      - 'agentos_node/spec_steward_worker.py'
      - 'agentos_node/governed_spec_steward_worker.py'
      - 'agentos_node/spec_steward_worker_cli.py'
      - 'agentos_node/thin_client.py'
      - 'governance/employee-memory-policy.json'
      - 'governance/employee-skills.json'
      - 'governance/core-supervisor-delivery.json'
      - 'governance/spec-steward-employee.json'
      - 'tests/test_employee_runtime.py'
      - 'tests/test_employee_lifecycle.py'
      - 'tests/test_employee_wake.py'
      - 'tests/test_employee_memory.py'
      - 'tests/test_employee_skills.py'
      - 'tests/test_employee_threads.py'
      - 'tests/test_employee_realm_mailbox.py'
      - 'tests/test_employee_wake_delivery.py'
      - 'tests/test_employee_wake_inbox_security.py'
      - 'tests/test_core_supervisor.py'
      - 'tests/test_core_work_items.py'
      - 'tests/test_core_supervisor_service.py'
      - 'tests/test_core_supervisor_daemon.py'
      - 'tests/test_core_supervisor_delivery.py'
      - 'tests/test_core_supervisor_assets.py'
      - 'tests/test_role_runtime.py'
      - 'tests/test_spec_steward_bootstrap.py'
      - 'tests/test_spec_steward_acceptance.py'
      - 'tests/test_spec_steward_worker.py'
      - 'tests/test_governed_spec_steward_worker.py'
      - 'tests/test_spec_steward_worker_cli.py'
      - '.agent/roles/**'
      - '.agent/scripts/agentos-core-supervisor.service'
      - '.agent/scripts/agentos-core-supervisor.env.example'
      - '.agent/scripts/agentos-core-supervisor-delivery.conf.example'
      - 'docs/CORE_SUPERVISOR.md'
      - 'docs/SPEC_STEWARD_O3_LIVE_RUNBOOK.md'
      - '.github/workflows/employee-runtime-guard.yml'
  push:
    branches:
      - core/issue-197-governed-wake-delivery-v2
      - core/issue-197-spec-steward-bootstrap
      - core/issue-197-spec-steward-worker
      - core/issue-200-persistent-supervisor-loop
      - core/issue-200-governed-supervisor-delivery
      - core/integration
    paths:
      - 'agent_core/employee_runtime.py'
      - 'agent_core/employee_lifecycle.py'
      - 'agent_core/employee_wake.py'
      - 'agent_core/employee_memory.py'
      - 'agent_core/employee_skills.py'
      - 'agent_core/employee_threads.py'
      - 'agent_core/employee_realm_mailbox.py'
      - 'agent_core/employee_presence.py'
      - 'agent_core/employee_wake_delivery.py'
      - 'agent_core/core_supervisor.py'
      - 'agent_core/core_work_items.py'
      - 'agent_core/core_supervisor_service.py'
      - 'agent_core/core_supervisor_daemon.py'
      - 'agent_core/core_supervisor_delivery.py'
      - 'agent_core/spec_steward_bootstrap.py'
      - 'agent_core/spec_steward_acceptance.py'
      - 'agent_core/role_runtime.py'
      - 'agentos_node/employee_wake_inbox.py'
      - 'agentos_node/spec_steward_worker.py'
      - 'agentos_node/governed_spec_steward_worker.py'
      - 'agentos_node/spec_steward_worker_cli.py'
      - 'agentos_node/thin_client.py'
      - 'governance/employee-memory-policy.json'
      - 'governance/employee-skills.json'
      - 'governance/core-supervisor-delivery.json'
      - 'governance/spec-steward-employee.json'
      - 'tests/test_employee_runtime.py'
      - 'tests/test_employee_lifecycle.py'
      - 'tests/test_employee_wake.py'
      - 'tests/test_employee_memory.py'
      - 'tests/test_employee_skills.py'
      - 'tests/test_employee_threads.py'
      - 'tests/test_employee_realm_mailbox.py'
      - 'tests/test_employee_wake_delivery.py'
      - 'tests/test_employee_wake_inbox_security.py'
      - 'tests/test_core_supervisor.py'
      - 'tests/test_core_work_items.py'
      - 'tests/test_core_supervisor_service.py'
      - 'tests/test_core_supervisor_daemon.py'
      - 'tests/test_core_supervisor_delivery.py'
      - 'tests/test_core_supervisor_assets.py'
      - 'tests/test_role_runtime.py'
      - 'tests/test_spec_steward_bootstrap.py'
      - 'tests/test_spec_steward_acceptance.py'
      - 'tests/test_spec_steward_worker.py'
      - 'tests/test_governed_spec_steward_worker.py'
      - 'tests/test_spec_steward_worker_cli.py'
      - '.agent/roles/**'
      - '.agent/scripts/agentos-core-supervisor.service'
      - '.agent/scripts/agentos-core-supervisor.env.example'
      - '.agent/scripts/agentos-core-supervisor-delivery.conf.example'
      - 'docs/CORE_SUPERVISOR.md'
      - 'docs/SPEC_STEWARD_O3_LIVE_RUNBOOK.md'
      - '.github/workflows/employee-runtime-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  employee-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install role parser dependency
        run: python -m pip install PyYAML
      - name: Run employee runtime regressions
        run: python -m unittest tests.test_employee_runtime -v
      - name: Run Employee lifecycle regressions
        run: python -m unittest tests.test_employee_lifecycle -v
      - name: Run Employee wake-planner regressions
        run: python -m unittest tests.test_employee_wake -v
      - name: Run Employee memory-policy regressions
        run: python -m unittest tests.test_employee_memory -v
      - name: Run Employee skill-hydration regressions
        run: python -m unittest tests.test_employee_skills -v
      - name: Run Cognitive Thread return regressions
        run: python -m unittest tests.test_employee_threads -v
      - name: Run Realm Employee mailbox regressions
        run: python -m unittest tests.test_employee_realm_mailbox -v
      - name: Run governed Employee wake-delivery regressions
        run: python -m unittest tests.test_employee_wake_delivery -v
      - name: Run Employee wake-inbox privacy regressions
        run: python -m unittest tests.test_employee_wake_inbox_security -v
      - name: Run Core Supervisor reconciliation regressions
        run: python -m unittest tests.test_core_supervisor -v
      - name: Run Core WorkItem intake regressions
        run: python -m unittest tests.test_core_work_items -v
      - name: Run persistent Core Supervisor service regressions
        run: python -m unittest tests.test_core_supervisor_service -v
      - name: Run Core Supervisor daemon regressions
        run: python -m unittest tests.test_core_supervisor_daemon -v
      - name: Run governed Core Supervisor delivery regressions
        run: python -m unittest tests.test_core_supervisor_delivery -v
      - name: Run Core Supervisor service asset regressions
        run: python -m unittest tests.test_core_supervisor_assets -v
      - name: Run role hydration regressions
        run: python -m unittest tests.test_role_runtime -v
      - name: Run Spec Steward bootstrap regressions
        run: python -m unittest tests.test_spec_steward_bootstrap -v
      - name: Run Spec Steward O3 acceptance regressions
        run: python -m unittest tests.test_spec_steward_acceptance -v
      - name: Run Spec Steward Employee worker regressions
        run: python -m unittest tests.test_spec_steward_worker -v
      - name: Run governed Spec Steward worker authority regressions
        run: python -m unittest tests.test_governed_spec_steward_worker -v
      - name: Run Spec Steward worker CLI regressions
        run: python -m unittest tests.test_spec_steward_worker_cli -v
