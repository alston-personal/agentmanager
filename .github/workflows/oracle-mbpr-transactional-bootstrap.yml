name: Oracle MBPR Transactional Bootstrap
on:
  push:
    branches:
      - core/integration
    paths:
      - '.agentos/commands/mbpr-transactional-bootstrap.json'
permissions:
  contents: read
jobs:
  migrate:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 7
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage transactional candidate
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,time
          from agent_core.realm_fabric import RealmFabricStore
          cmd=json.load(open('.agentos/commands/mbpr-transactional-bootstrap.json',encoding='utf-8'))
          assert cmd.get('schema')=='agentos.realm-command/v0.1'
          assert cmd.get('action')=='realm.node.transactional-bootstrap'
          assert cmd.get('node_id')=='mbpr'
          sha=str(cmd.get('source_commit') or '')
          assert re.fullmatch(r'[0-9a-f]{40}',sha)
          py='/Users/tengweihuang/Library/Application Support/AgentOS/venv/bin/python'
          url=f'https://raw.githubusercontent.com/alston-personal/agentmanager/{sha}/scripts/bootstrap_macos_transactional_runtime.py'
          code=f"import urllib.request,runpy,tempfile,sys; p=tempfile.mktemp(suffix='.py'); urllib.request.urlretrieve('{url}',p); sys.argv=[p,'--source-commit','{sha}']; runpy.run_path(p,run_name='__main__')"
          tid='mbpr-tx-bootstrap-'+str(int(time.time()))
          store=RealmFabricStore()
          store.queue_task('mbpr',{'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':py,'argv':['-c',code],'cwd':'/Users/tengweihuang/AgentOS','timeout_seconds':120,'cognition_ids_used':[]})
          open('/tmp/mbpr-bootstrap-sha','w').write(sha)
          for _ in range(70):
              r=store.get_receipt(tid)
              if r:
                  out=str(r.get('stdout') or '')
                  err=str(r.get('stderr') or '')
                  print(out)
                  if r.get('ok') is not True or int(r.get('returncode') or 0)!=0 or 'agentos_macos_transactional_bootstrap=PASS' not in out:
                      print(err[-3000:])
                      raise SystemExit('transactional bootstrap stage failed')
                  print('mbpr_transactional_stage=PASS')
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('transactional bootstrap stage receipt timeout')
          PY
      - name: Wait for candidate heartbeat
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          from agent_core.node_registry import NodeRegistry
          sha=open('/tmp/mbpr-bootstrap-sha').read().strip()
          deadline=time.time()+120
          while time.time()<deadline:
              node=next((n for n in NodeRegistry().node_map().get('nodes',[]) if n.get('node_id')=='mbpr'),None)
              runtime=(node or {}).get('runtime') or {}
              if node and node.get('status')=='online' and runtime.get('source_commit')==sha:
                  print('mbpr_candidate_heartbeat=PASS')
                  raise SystemExit(0)
              time.sleep(3)
          raise SystemExit('candidate heartbeat timeout')
          PY
      - name: Probe candidate runtime
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          from agent_core.realm_fabric import RealmFabricStore
          tid='mbpr-candidate-probe-'+str(int(time.time()))
          store=RealmFabricStore()
          store.queue_task('mbpr',{'schema':'agentos.node-task/v0.1','task_id':tid,'action':'process.inspect','query':'agentos_node','limit':20,'cognition_ids_used':[]})
          for _ in range(40):
              r=store.get_receipt(tid)
              if r:
                  if r.get('ok') is not True:
                      raise SystemExit(str(r))
                  print('mbpr_candidate_probe=PASS')
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('candidate probe timeout')
          PY
      - name: Accept candidate runtime
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          from agent_core.realm_fabric import RealmFabricStore
          sha=open('/tmp/mbpr-bootstrap-sha').read().strip()
          tid='mbpr-candidate-accept-'+str(int(time.time()))
          store=RealmFabricStore()
          store.queue_task('mbpr',{'schema':'agentos.node-task/v0.1','task_id':tid,'action':'node.runtime.converge','phase':'accept','source_commit':sha,'cognition_ids_used':[]})
          for _ in range(40):
              r=store.get_receipt(tid)
              if r:
                  status=((r.get('runtime_converge') or {}).get('status'))
                  if r.get('ok') is not True or status!='accepted':
                      raise SystemExit(str(r))
                  print('mbpr_transactional_accept=PASS')
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('candidate accept timeout')
          PY
