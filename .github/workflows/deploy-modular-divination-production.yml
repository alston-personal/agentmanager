name: Deploy Modular Divination Production

on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths:
      - ".github/workflows/deploy-modular-divination-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Resolve Oracle target
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Deploy Divination OS v1 with automatic rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PROD=/home/ubuntu/leopardcat-tarot
          WEB="$PROD/website"
          TARGET=fba6a56fcab4357ad3b7fab45e9de2be4f91b76a
          OLD=$(git -C "$PROD" rev-parse HEAD)
          echo "old_commit=$OLD"
          echo "target_commit=$TARGET"

          dirty=$(git -C "$PROD" status --porcelain | grep -v '^ M website/stats.json$' || true)
          if [ -n "$dirty" ]; then
            echo 'Unexpected production changes; refusing deployment:' >&2
            echo "$dirty" >&2
            exit 40
          fi
          cp "$WEB/stats.json" /tmp/leopardcat-stats.pre-divination-v1.json

          stop_server() {
            for pid in $(pgrep -f 'python3 fortune_server.py' || true); do
              cwd=$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)
              if [ "$cwd" = "$WEB" ]; then
                kill "$pid" >/dev/null 2>&1 || true
                for _ in $(seq 1 20); do
                  kill -0 "$pid" >/dev/null 2>&1 || break
                  sleep 0.25
                done
                kill -9 "$pid" >/dev/null 2>&1 || true
              fi
            done
          }

          start_server() {
            cd "$WEB"
            nohup /usr/bin/python3 fortune_server.py >/tmp/fortune_server.log 2>&1 &
            echo $! >/tmp/fortune_server.pid
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8088/api/v1/methods >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            echo 'fortune server failed to become ready' >&2
            tail -100 /tmp/fortune_server.log >&2 || true
            return 1
          }

          rollback() {
            echo 'deployment_smoke_failed=rolling_back' >&2
            stop_server
            git -C "$PROD" reset --hard "$OLD"
            cp /tmp/leopardcat-stats.pre-divination-v1.json "$WEB/stats.json"
            cd "$WEB"
            npm run build
            start_server
            echo "rollback_commit=$OLD" >&2
          }

          trap 'rc=$?; if [ $rc -ne 0 ]; then rollback || true; fi; exit $rc' EXIT

          git -c credential.helper= -C "$PROD" fetch https://github.com/alston-personal/leopardcat-tarot.git main
          fetched=$(git -C "$PROD" rev-parse FETCH_HEAD)
          echo "fetched_commit=$fetched"
          if [ "$fetched" != "$TARGET" ]; then
            echo "Expected $TARGET but fetched $fetched" >&2
            exit 41
          fi
          git -C "$PROD" merge --ff-only FETCH_HEAD
          cp /tmp/leopardcat-stats.pre-divination-v1.json "$WEB/stats.json"

          cd "$WEB"
          npm run build
          grep -R -q '/api/v1/readings' dist || { echo 'built frontend lacks readings API reference' >&2; exit 42; }
          test -f dist/read.html || { echo 'focused reading UI missing from build' >&2; exit 43; }
          test -f dist/manage.html || { echo 'creator management UI missing from build' >&2; exit 44; }
          python3 -m py_compile fortune_server.py divination/*.py
          stop_server
          start_server

          python3 - <<'PY'
          import json, urllib.request, urllib.error

          base='http://127.0.0.1:8088'
          with urllib.request.urlopen(base+'/api/v1/methods', timeout=10) as r:
              catalog=json.loads(r.read().decode())
          methods={m['method_id']:m for m in catalog['methods']}
          assert {'tarot','lenormand'} <= set(methods)
          assert any(s['id']=='box9' and s['card_count']==9 for s in methods['lenormand']['spreads'])
          print('production_methods_contract=passed')

          body={
              'method':'lenormand', 'persona':'master',
              'question':'部署驗證：接下來應注意什麼？',
              'input':{'spread':'box9'}, 'lang':'zh-TW', 'seed':'production-v1-smoke'
          }
          req=urllib.request.Request(
              base+'/api/v1/readings',
              data=json.dumps(body, ensure_ascii=False).encode(),
              headers={'Content-Type':'application/json'}, method='POST'
          )
          try:
              with urllib.request.urlopen(req, timeout=45) as r:
                  status=r.status; data=json.loads(r.read().decode())
          except urllib.error.HTTPError as e:
              status=e.code; data=json.loads(e.read().decode())

          assert status in (200,503), status
          assert data['reading_id'].startswith('rd_')
          assert data['method']=='lenormand'
          assert data['persona']=='master'
          assert data['method_result']['method']=='lenormand'
          assert data['method_result']['spread']=='box9'
          assert len(data['method_result']['cards'])==9
          assert data['capsule']['schema']=='divination-reading/1'
          assert data['capsule']['contract']['redraw_forbidden'] is True
          assert {x['id'] for x in data['handoff']['providers']}=={'chatgpt','claude','gemini'}
          if status == 200:
              assert len((data.get('reading') or '').strip()) > 20
              print('production_ai_state=available')
          else:
              assert data['error']=='ai_unavailable'
              assert data.get('reading') is None
              print('production_ai_state=zero_cost_fallback')
          print('local_production_divination_v1_smoke=passed')
          PY

          curl -fsS https://leopardcat-tarot.milkcat.org/ >/dev/null
          curl -fsS https://leopardcat-tarot.milkcat.org/read.html >/dev/null
          curl -fsS https://leopardcat-tarot.milkcat.org/manage.html >/dev/null
          curl -fsS https://leopardcat-tarot.milkcat.org/api/v1/methods >/tmp/public-methods.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/public-methods.json'))
          assert {'tarot','lenormand'} <= {x['method_id'] for x in d['methods']}
          print('public_divination_v1_http_smoke=passed')
          PY
          echo "deployed_commit=$(git -C "$PROD" rev-parse HEAD)"
          trap - EXIT
          REMOTE
