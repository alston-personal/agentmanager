name: Oracle GUI Resource Policy Live

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/oracle-gui-resource-policy-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Apply live GUI browser resource policy
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          DROPIN="$HOME/.config/systemd/user/agentos-gui-browser.service.d"
          mkdir -p "$DROPIN"
          cat > "$DROPIN/resource-policy.conf" <<'EOF'
          [Service]
          MemoryHigh=infinity
          MemoryMax=4G
          MemoryOOMGroup=yes
          TasksMax=384
          RuntimeMaxSec=12h
          TimeoutStopSec=20s
          KillMode=control-group
          EOF

          systemctl --user daemon-reload
          systemctl --user restart agentos-gui-browser.service
          sleep 8

          echo "=== effective policy ==="
          systemctl --user show agentos-gui-browser.service             -p ActiveState -p SubState -p MainPID             -p MemoryCurrent -p MemoryHigh -p MemoryMax             -p MemoryOOMGroup -p TasksCurrent -p TasksMax             -p RuntimeMaxUSec -p TimeoutStopUSec -p KillMode

          echo "=== host after policy ==="
          uptime
          free -h
          cat /proc/pressure/memory || true

          echo "=== cgroup memory events ==="
          CG=/sys/fs/cgroup/user.slice/user-1001.slice/user@1001.service/app.slice/agentos-gui-browser.service
          cat "$CG/memory.events" || true

          python3 - <<'PY'
          import json,time,urllib.request
          for _ in range(20):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:9222/json/version",timeout=2) as r:
                      d=json.load(r)
                  if d.get("webSocketDebuggerUrl"):
                      print("agentos_gui_cdp=PASS")
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("agentos_gui_cdp=FAIL")
          PY
          echo "oracle_gui_resource_policy_live=PASS"
          REMOTE
