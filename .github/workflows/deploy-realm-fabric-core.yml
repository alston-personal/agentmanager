name: Deploy Realm Fabric Core

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-realm-fabric-core.yml'
      - 'agent_core/resolve_facade.py'
      - 'agent_core/realm_server.py'
      - 'agent_core/realm_fabric.py'
      - 'agentos_node/thin_client_transport.py'
      - 'scripts/patch_action_relay_realm_fabric.py'
      - 'scripts/install_realm_fabric_via_action_relay.py'
      - 'tests/test_resolve_facade.py'
      - 'tests/test_realm_resolve_endpoint.py'

permissions:
  contents: write

concurrency:
  group: realm-fabric-core-deploy
  cancel-in-progress: false

jobs:
  patch-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add narrow governed Realm Fabric install capability
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/patch_action_relay_realm_fabric.py
          python3 -m py_compile agentos_node/action_relay.py
          grep -q 'agentos.realm-fabric.install_release' agentos_node/action_relay.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agentos_node/action_relay.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat(agentos): enable governed Realm Fabric install'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: patch-capability
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 15
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh canonical source to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          grep -q 'agentos.realm-fabric.install_release' agentos_node/action_relay.py
          echo "AGENTOS_REALM_FABRIC_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Focused resolve tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile agent_core/resolve_facade.py agent_core/realm_server.py agentos_node/thin_client_transport.py
          python3 -m unittest tests.test_resolve_facade tests.test_realm_resolve_endpoint -v

      - name: Ensure ubuntu Action Relay runtime contains Realm Fabric capability
        shell: bash
        run: |
          set -euo pipefail
          runtime=/home/ubuntu/.local/share/agentos/action-relay-runtime/agentos_node/action_relay.py
          if grep -q 'agentos.realm-fabric.install_release' "$runtime" 2>/dev/null; then
            echo 'action_relay_runtime_realm_fabric=ALREADY_READY'
            exit 0
          fi
          echo 'action_relay_runtime_realm_fabric=REFRESH_REQUIRED'
          tmp=/tmp/bootstrap-action-relay-realm-fabric-safe.sh
          sed \
            -e 's|RECEIPT="$BRIDGE/$REQUEST_ID.receipt.json"|RECEIPT="/tmp/$REQUEST_ID.receipt.json"|' \
            -e 's|_a_os.chmod(_a_tmp,0o660)|_a_os.chmod(_a_tmp,0o644)|' \
            scripts/bootstrap_action_relay_via_chronos_safe_v2.sh > "$tmp"
          chmod 700 "$tmp"
          bash "$tmp"
          grep -q 'agentos.realm-fabric.install_release' "$runtime"
          echo 'action_relay_runtime_realm_fabric=READY_AFTER_REFRESH'

      - name: Install exact Realm Fabric release through Action Relay
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/install_realm_fabric_via_action_relay.py

      - name: Live health and governed receipt
        shell: bash
        run: |
          set -euo pipefail
          test -f .agentos/evidence/realm-fabric-install-current.json
          python3 - <<'PY'
          import json
          r=json.load(open('.agentos/evidence/realm-fabric-install-current.json'))
          assert r.get('schema') == 'agentos.action-receipt/v1', r
          assert r.get('ok') is True, r
          assert r.get('executor_user') == 'ubuntu', r
          assert r.get('action') == 'agentos.realm-fabric.install_release', r
          assert r.get('source_commit') == __import__('os').environ['AGENTOS_REALM_FABRIC_SOURCE_COMMIT'], r
          assert r.get('health',{}).get('status') == 200, r
          print(json.dumps({k:r.get(k) for k in ('source_commit','release','current','service','endpoint','health')},ensure_ascii=False,indent=2))
          PY
          curl -fsS --max-time 3 http://127.0.0.1:8780/v1/health
          echo

      - name: Live governance and Realm snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from agent_core.governance_directory import list_entities
          from agent_core.node_registry import NodeRegistry
          print('=== PROJECT ENTITIES ===')
          print(json.dumps(list_entities(kind='project'), ensure_ascii=False, indent=2))
          print('=== NODE MAP ===')
          print(json.dumps(NodeRegistry().node_map(), ensure_ascii=False, indent=2))
          PY

      - name: Unauthenticated resolve must reject
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/resolve-unauth.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"schema":"agentos.resolve-request/v1","node_id":"oracle-acceptance","intent":"continue","project":"agentos-core"}' \
            http://127.0.0.1:8780/v1/resolve)
          cat /tmp/resolve-unauth.json
          test "$code" = "401"
          echo "unauthenticated_resolve=PASS"

      - name: Publish governed deployment evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E=.agentos/evidence/realm-fabric-install-current.json
          test -f "$E" || exit 0
          cp "$E" /tmp/realm-fabric-install-current.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .agentos/evidence
          cp /tmp/realm-fabric-install-current.json "$E"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$E"
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(agentos): governed Realm Fabric deployment'
          git pull --rebase origin main
          git push origin HEAD:main
