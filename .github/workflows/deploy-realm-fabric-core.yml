name: Deploy Realm Fabric Core

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-realm-fabric-core.yml'
      - 'agent_core/resolve_facade.py'
      - 'agent_core/realm_server.py'
      - 'agent_core/realm_fabric.py'
      - 'agent_core/project_store.py'
      - 'agentos_node/thin_client_transport.py'
      - 'scripts/patch_action_relay_realm_fabric.py'
      - 'scripts/patch_realm_fabric_current_pointer_compat.py'
      - 'scripts/patch_realm_fabric_release_isolation.py'
      - 'scripts/patch_realm_fabric_process_attestation.py'
      - 'scripts/patch_action_relay_core_project.py'
      - 'scripts/patch_core_project_runtime_binding.py'
      - 'scripts/install_realm_fabric_via_action_relay.py'
      - 'scripts/register_agentos_core_via_action_relay.py'
      - 'tests/test_resolve_facade.py'
      - 'tests/test_realm_resolve_endpoint.py'
      - 'tests/test_project_store_canonical.py'

permissions:
  contents: write

concurrency:
  group: realm-fabric-core-deploy
  cancel-in-progress: false

jobs:
  patch-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile governed Core capabilities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/patch_action_relay_realm_fabric.py
          python3 scripts/patch_realm_fabric_current_pointer_compat.py
          python3 scripts/patch_realm_fabric_release_isolation.py
          python3 scripts/patch_realm_fabric_process_attestation.py
          python3 scripts/patch_action_relay_core_project.py
          python3 scripts/patch_core_project_runtime_binding.py
          python3 -m py_compile agentos_node/action_relay.py agent_core/project_store.py
          grep -q 'agentos.realm-fabric.install_release' agentos_node/action_relay.py
          grep -q 'agentos.project.register_core' agentos_node/action_relay.py
          grep -q 'core_project_runtime_binding_v1' agentos_node/action_relay.py
          grep -q 'realm_fabric_release_isolation_v1' agentos_node/action_relay.py
          grep -q 'realm_fabric_process_attestation_v1' agentos_node/action_relay.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agentos_node/action_relay.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix(agentos): bind project registration to deployed Core release'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: patch-capability
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 15
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh canonical source to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          grep -q 'agentos.realm-fabric.install_release' agentos_node/action_relay.py
          grep -q 'agentos.project.register_core' agentos_node/action_relay.py
          grep -q 'core_project_runtime_binding_v1' agentos_node/action_relay.py
          grep -q 'realm_fabric_release_isolation_v1' agentos_node/action_relay.py
          grep -q 'realm_fabric_process_attestation_v1' agentos_node/action_relay.py
          echo "AGENTOS_REALM_FABRIC_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Focused Core tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile agent_core/resolve_facade.py agent_core/realm_server.py agent_core/project_store.py agentos_node/thin_client_transport.py
          python3 -m unittest tests.test_resolve_facade tests.test_realm_resolve_endpoint tests.test_project_store_canonical -v

      - name: Ensure ubuntu Action Relay runtime contains governed Core capabilities
        shell: bash
        run: |
          set -euo pipefail
          runtime=/home/ubuntu/.local/share/agentos/action-relay-runtime/agentos_node/action_relay.py
          if grep -q 'agentos.realm-fabric.install_release' "$runtime" 2>/dev/null \
             && grep -q 'agentos.project.register_core' "$runtime" 2>/dev/null \
             && grep -q 'core_project_runtime_binding_v1' "$runtime" 2>/dev/null \
             && grep -q 'realm_fabric_release_isolation_v1' "$runtime" 2>/dev/null \
             && grep -q 'realm_fabric_process_attestation_v1' "$runtime" 2>/dev/null; then
            echo 'action_relay_runtime_core=ALREADY_READY'
            exit 0
          fi
          echo 'action_relay_runtime_core=REFRESH_REQUIRED'
          tmp=/tmp/bootstrap-action-relay-core-safe.sh
          sed \
            -e 's|RECEIPT="$BRIDGE/$REQUEST_ID.receipt.json"|RECEIPT="/tmp/$REQUEST_ID.receipt.json"|' \
            -e 's|_a_os.chmod(_a_tmp,0o660)|_a_os.chmod(_a_tmp,0o644)|' \
            scripts/bootstrap_action_relay_via_chronos_safe_v2.sh > "$tmp"
          chmod 700 "$tmp"
          bash "$tmp"
          grep -q 'agentos.realm-fabric.install_release' "$runtime"
          grep -q 'agentos.project.register_core' "$runtime"
          grep -q 'core_project_runtime_binding_v1' "$runtime"
          grep -q 'realm_fabric_release_isolation_v1' "$runtime"
          grep -q 'realm_fabric_process_attestation_v1' "$runtime"
          echo 'action_relay_runtime_core=READY_AFTER_REFRESH'

      - name: Install exact Realm Fabric release through Action Relay
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/install_realm_fabric_via_action_relay.py

      - name: Live health and governed process receipt
        shell: bash
        run: |
          set -euo pipefail
          test -f .agentos/evidence/realm-fabric-install-current.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('.agentos/evidence/realm-fabric-install-current.json'))
          assert r.get('schema') == 'agentos.action-receipt/v1', r
          assert r.get('ok') is True, r
          assert r.get('executor_user') == 'ubuntu', r
          assert r.get('action') == 'agentos.realm-fabric.install_release', r
          assert r.get('source_commit') == os.environ['AGENTOS_REALM_FABRIC_SOURCE_COMMIT'], r
          assert r.get('health',{}).get('status') == 200, r
          assert r.get('resolve_auth_probe',{}).get('status') == 401, r
          assert r.get('process_identity_attested') is True, r
          assert int(r.get('main_pid_after') or 0) > 0, r
          print(json.dumps({k:r.get(k) for k in (
              'source_commit','release','current','current_pointer_mode','service','endpoint','health',
              'resolve_auth_probe','main_pid_before','main_pid_after','process_identity_attested'
          )},ensure_ascii=False,indent=2))
          PY

      - name: Core node must remain online
        shell: bash
        run: |
          set -euo pipefail
          sleep 12
          python3 - <<'PY'
          import json
          from agent_core.node_registry import NodeRegistry
          data=NodeRegistry().node_map()
          print(json.dumps(data,ensure_ascii=False,indent=2))
          matches=[n for n in data.get('nodes',[]) if n.get('node_id')=='oracle-core-node']
          assert len(matches)==1, data
          node=matches[0]
          assert node.get('role')=='core', node
          assert node.get('status')=='online', node
          assert 'agentos.one.resolve' in (node.get('capabilities') or []), node
          PY

      - name: Register canonical AgentOS Core project through Action Relay
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/register_agentos_core_via_action_relay.py

      - name: Project authority must be live and mutation-ready
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from agent_core.governance_directory import get
          from agent_core.project_store import load_project_document
          from agent_core.resolve_facade import resolve_project_identity
          doc=load_project_document('agentos-core')
          assert doc, 'agentos-core project.yaml missing'
          assert doc.get('project_id') == 'agentos-core', doc
          source=doc.get('source') or {}
          assert source.get('repo') == 'alston-personal/agentmanager', source
          assert source.get('branch') == 'main', source
          assert source.get('canonical_path') == '/home/ubuntu/agentmanager', source
          assert source.get('node') == 'oracle-core-node', source
          entity=get('project://agentos-core')
          assert entity, 'Governance project entity missing'
          resolved=resolve_project_identity('AgentOS Core')
          assert resolved.get('project_id') == 'agentos-core', resolved
          assert resolved.get('integrity',{}).get('mutation_allowed') is True, resolved
          print(json.dumps({'project':doc,'governance':entity,'resolved':resolved},ensure_ascii=False,indent=2))
          PY

      - name: Unauthenticated resolve must reject
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/resolve-unauth.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"schema":"agentos.resolve-request/v1","node_id":"oracle-acceptance","intent":"continue","project":"agentos-core"}' \
            http://127.0.0.1:8780/v1/resolve)
          cat /tmp/resolve-unauth.json
          test "$code" = "401"
          echo "unauthenticated_resolve=PASS"

      - name: Publish governed Core evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agentos-core-evidence
          for E in .agentos/evidence/realm-fabric-install-current.json .agentos/evidence/agentos-core-project-registration.json; do
            test -f "$E" && cp "$E" /tmp/agentos-core-evidence/$(basename "$E")
          done
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .agentos/evidence
          for F in /tmp/agentos-core-evidence/*; do
            test -f "$F" && cp "$F" .agentos/evidence/$(basename "$F")
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(agentos): governed Core project authority'
          git pull --rebase origin main
          git push origin HEAD:main
