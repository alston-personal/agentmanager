name: Deploy Realm Fabric Core

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-realm-fabric-core.yml'
      - 'agent_core/resolve_facade.py'
      - 'agent_core/realm_server.py'
      - 'agent_core/realm_fabric.py'
      - 'agentos_node/thin_client_transport.py'
      - 'tests/test_resolve_facade.py'
      - 'tests/test_realm_resolve_endpoint.py'

permissions:
  contents: read

concurrency:
  group: realm-fabric-core-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 12
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      REALM_ROOT: ${{ github.workspace }}/.realm-fabric-runtime
    steps:
      - uses: actions/checkout@v4

      - name: Focused resolve tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile agent_core/resolve_facade.py agent_core/realm_server.py agentos_node/thin_client_transport.py
          python3 -m unittest tests.test_resolve_facade tests.test_realm_resolve_endpoint -v

      - name: Install versioned Realm Fabric release
        shell: bash
        run: |
          set -euo pipefail
          REF="$GITHUB_SHA"
          REALM_ROOT="$HOME/.local/share/agentos/realm-fabric"
          RELEASE="$REALM_ROOT/releases/$REF"
          CURRENT="$REALM_ROOT/current"
          UNIT="$HOME/.config/systemd/user/agentos-realm-fabric.service"
          BACKUP="$UNIT.pre-resolve-v1"
          PREVIOUS_CURRENT=""
          [ -L "$CURRENT" ] && PREVIOUS_CURRENT="$(readlink -f "$CURRENT" || true)"

          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          test -S "$XDG_RUNTIME_DIR/bus"
          echo "user_bus=$DBUS_SESSION_BUS_ADDRESS"

          mkdir -p "$RELEASE" "$HOME/.config/systemd/user" "$AGENT_DATA_ROOT/logs"
          [ -f "$UNIT" ] && cp "$UNIT" "$BACKUP"

          rollback() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "Realm Fabric deployment failed; restoring previous service" >&2
              if [ -f "$BACKUP" ]; then
                cp "$BACKUP" "$UNIT"
                systemctl --user daemon-reload
                systemctl --user restart agentos-realm-fabric.service || true
              fi
              if [ -n "$PREVIOUS_CURRENT" ] && [ -d "$PREVIOUS_CURRENT" ]; then
                ln -sfn "$PREVIOUS_CURRENT" "$CURRENT"
              fi
            fi
            exit "$rc"
          }
          trap rollback EXIT

          # Versioned source snapshot. Avoid python3-venv/ensurepip so deployment
          # does not require host package mutation or sudo on the self-hosted runner.
          rm -rf "$RELEASE/agent_core" "$RELEASE/agentos_node" "$RELEASE/runtime_core" "$RELEASE/bin"
          cp -a agent_core "$RELEASE/agent_core"
          cp -a agentos_node "$RELEASE/agentos_node"
          [ -d runtime_core ] && cp -a runtime_core "$RELEASE/runtime_core"
          mkdir -p "$RELEASE/bin"
          cat > "$RELEASE/bin/agentos-one" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          export PYTHONPATH="$RELEASE${PYTHONPATH:+:$PYTHONPATH}"
          exec /usr/bin/python3 -m agent_core.realm_cli "\$@"
          EOF
          chmod 0755 "$RELEASE/bin/agentos-one"
          PYTHONPATH="$RELEASE${PYTHONPATH:+:$PYTHONPATH}" /usr/bin/python3 -m py_compile \
            "$RELEASE/agent_core/realm_cli.py" \
            "$RELEASE/agent_core/realm_server.py" \
            "$RELEASE/agent_core/resolve_facade.py"
          "$RELEASE/bin/agentos-one" --help >/dev/null

          REALM_ID=realm-alston
          LIVE_ENV=/home/ubuntu/agentmanager/.env
          if [ -f "$LIVE_ENV" ]; then
            configured=$(grep -E '^AGENTOS_REALM_ID=' "$LIVE_ENV" | tail -n1 | cut -d= -f2- || true)
            [ -n "$configured" ] && REALM_ID="$configured"
          fi
          AGENT_DATA_ROOT="$AGENT_DATA_ROOT" "$RELEASE/bin/agentos-one" init --realm-id "$REALM_ID"

          cat > "$UNIT" <<EOF
          [Unit]
          Description=AgentOS ONE Realm Fabric
          After=network.target

          [Service]
          Type=simple
          Environment=AGENT_DATA_ROOT=$AGENT_DATA_ROOT
          ExecStart=$RELEASE/bin/agentos-one serve --host 127.0.0.1 --port 8780
          Restart=always
          RestartSec=5
          StandardOutput=append:$AGENT_DATA_ROOT/logs/realm-fabric.log
          StandardError=append:$AGENT_DATA_ROOT/logs/realm-fabric.log

          [Install]
          WantedBy=default.target
          EOF

          systemctl --user daemon-reload
          systemctl --user enable --now agentos-realm-fabric.service
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:8780/v1/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 3 http://127.0.0.1:8780/v1/health
          echo
          systemctl --user is-active agentos-realm-fabric.service

          ln -sfn "$RELEASE" "$CURRENT"
          test -x "$CURRENT/bin/agentos-one"
          echo "realm_fabric_release=$RELEASE"
          echo "realm_fabric_current=$CURRENT"
          echo "realm_fabric_port=8780"
          trap - EXIT

      - name: Live governance and Realm snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from agent_core.governance_directory import list_entities
          from agent_core.node_registry import NodeRegistry

          print('=== PROJECT ENTITIES ===')
          print(json.dumps(list_entities(kind='project'), ensure_ascii=False, indent=2))
          print('=== NODE MAP ===')
          print(json.dumps(NodeRegistry().node_map(), ensure_ascii=False, indent=2))
          PY

      - name: Unauthenticated resolve must reject
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/resolve-unauth.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"schema":"agentos.resolve-request/v1","node_id":"oracle-acceptance","intent":"continue","project":"agentos-core"}' \
            http://127.0.0.1:8780/v1/resolve)
          cat /tmp/resolve-unauth.json
          test "$code" = "401"
          echo "unauthenticated_resolve=PASS"
