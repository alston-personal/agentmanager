name: Ops LeopardCat Runtime Inspect

on:
  push:
    branches: [ops/leopardcat-runtime-inspect]
    paths:
      - '.github/workflows/ops-leopardcat-runtime-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Read-only LeopardCat production inspection
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo 'schema=leopardcat.production-runtime-inspection/v3'
          pid="$(lsof -nP -t -iTCP:8088 -sTCP:LISTEN 2>/dev/null | head -n1 || true)"
          echo "listener_pid=${pid:-none}"
          if test -n "$pid" && test -d "/proc/$pid"; then
            ps -p "$pid" -o pid=,ppid=,user=,lstart=,args= || true
            echo "process_cwd=$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"
            echo "fd0=$(readlink -f "/proc/$pid/fd/0" 2>/dev/null || true)"
            echo "fd1=$(readlink -f "/proc/$pid/fd/1" 2>/dev/null || true)"
            echo "fd2=$(readlink -f "/proc/$pid/fd/2" 2>/dev/null || true)"
          fi
          repo="/home/$(id -un)/leopardcat-tarot"
          if test -d "$repo/.git"; then
            echo "repo_head=$(git -c safe.directory="$repo" -C "$repo" rev-parse HEAD)"
            echo 'dirty_paths:'
            git -c safe.directory="$repo" -C "$repo" status --porcelain=v1
          fi
          REMOTE
