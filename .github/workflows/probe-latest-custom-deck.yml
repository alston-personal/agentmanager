name: Probe Latest Custom Deck
on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths:
      - ".github/workflows/probe-latest-custom-deck.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Resolve Oracle target
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Probe
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" '
            set -eu
            WEB=/home/ubuntu/leopardcat-tarot/website
            echo COMMIT=$(git -C /home/ubuntu/leopardcat-tarot rev-parse HEAD)
            latest=$(find "$WEB/data/custom_decks" -mindepth 1 -maxdepth 1 -type d -printf "%T@ %f\n" 2>/dev/null | sort -nr | head -1 | cut -d" " -f2-)
            echo LATEST=${latest:-none}
            if [ -n "${latest:-}" ]; then
              echo MANIFEST_EXISTS=$(test -f "$WEB/data/custom_decks/$latest/deck.json" && echo yes || echo no)
              grep -o '"'"'"card_count"'"'"[[:space:]]*:[[:space:]]*[0-9]*' "$WEB/data/custom_decks/$latest/deck.json" | head -1 || true
              echo LOCAL
              curl -sS -D - "http://127.0.0.1:8088/api/v1/decks/$latest" -o /tmp/deck-local-body || true
              head -c 300 /tmp/deck-local-body || true
              echo
              echo PUBLIC
              curl -sS -D - "https://leopardcat-tarot.milkcat.org/api/v1/decks/$latest" -o /tmp/deck-public-body || true
              head -c 300 /tmp/deck-public-body || true
              echo
            fi
            echo LOG
            tail -60 /tmp/fortune_server.log 2>/dev/null || true
          '
