name: Inspect LeopardCat Production

on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths:
      - ".github/workflows/inspect-leopardcat-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Resolve Oracle target
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect runtime without changes
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -u
          REPO=/home/ubuntu/agentmanager/workspace/leopardcat-tarot
          echo '=== REPO ==='
          git -C "$REPO" branch --show-current || true
          git -C "$REPO" status --short || true
          git -C "$REPO" log -1 --oneline || true
          echo '=== WEBSITE ==='
          test -f "$REPO/website/package.json" && cat "$REPO/website/package.json" | head -80 || true
          ls -ld "$REPO/website/dist" 2>/dev/null || true
          echo '=== PROCESS ==='
          pgrep -af 'fortune_server.py' || true
          for pid in $(pgrep -f 'fortune_server.py' || true); do
            echo "pid=$pid"
            readlink -f "/proc/$pid/cwd" 2>/dev/null || true
            tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true
            echo
          done
          echo '=== PORT ==='
          ss -ltnp 2>/dev/null | grep ':8088' || true
          echo '=== NGINX REFERENCES ==='
          grep -R -n -E '8088|leopardcat-tarot' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -80 || true
          REMOTE
