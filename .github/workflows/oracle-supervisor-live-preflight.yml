name: Oracle Supervisor Live Preflight

on:
  push:
    branches:
      - diag/oracle-supervisor-live-preflight
    paths:
      - '.github/workflows/oracle-supervisor-live-preflight.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bounded Supervisor acceptance preconditions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path

          data=Path('/home/ubuntu/agent-data')
          def cmd(argv):
              try:
                  p=subprocess.run(argv,text=True,capture_output=True,timeout=8,check=False)
                  return {'rc':p.returncode,'out':(p.stdout or '')[-8000:]}
              except Exception as e:
                  return {'rc':124,'error':type(e).__name__}

          out={'schema':'agentos.supervisor-live-preflight/v1'}
          out['runner_user']=cmd(['id','-un'])
          out['processes']=cmd(['bash','-lc',"ps -eo pid,user,lstart,args | grep -E 'core_supervisor_daemon|employee_worker_host_daemon|employee_wake_node' | grep -v grep || true"])
          out['core_pointer']=cmd(['bash','-lc',"readlink -f /home/ubuntu/agent-data/runtime/core/current 2>/dev/null || true"])
          out['repo_head']=cmd(['bash','-lc',"git -C /home/ubuntu/agentmanager rev-parse HEAD 2>/dev/null || true"])
          roots={}
          for p in [
              data/'employee-runtime',
              data/'employee-wake-inbox',
              data/'runtime/employee-wake-inbox',
              data/'runtime/employee-worker-host',
          ]:
              try:
                  roots[str(p)]={'exists':p.exists(),'is_dir':p.is_dir()}
                  if p.exists():
                      s=p.stat()
                      roots[str(p)].update({'uid':s.st_uid,'gid':s.st_gid,'mode':oct(s.st_mode & 0o777)})
              except Exception as e:
                  roots[str(p)]={'error':type(e).__name__}
          out['roots']=roots

          # Read only safe node/capability projection through repository runtime.
          try:
              import sys
              sys.path.insert(0, os.getcwd())
              from agent_core.node_registry import NodeRegistry
              rows=[]
              for n in NodeRegistry(data_root=data).node_map().get('nodes',[]):
                  caps=set(n.get('capabilities') or [])
                  if 'agent.employee.wake.deliver' in caps or n.get('node_id') in {'oracle-core-node','oracle-employee-wake-node'}:
                      rows.append({
                          'node_id':n.get('node_id'),
                          'status':n.get('status'),
                          'heartbeat_age_seconds':n.get('heartbeat_age_seconds'),
                          'runtime_status':n.get('runtime_status'),
                          'has_employee_wake': 'agent.employee.wake.deliver' in caps,
                      })
              out['wake_nodes']=rows
          except Exception as e:
              out['wake_nodes_error']=type(e).__name__

          runtime=data/'employee-runtime'
          def safe_docs(rel, keys):
              d=runtime/rel
              rows=[]
              if not d.is_dir(): return rows
              for p in sorted(d.glob('*.json'))[-30:]:
                  try:
                      obj=json.loads(p.read_text(encoding='utf-8'))
                      rows.append({k:obj.get(k) for k in keys if k in obj})
                  except Exception:
                      pass
              return rows
          out['employees']=safe_docs('employees',['employee_id','display_name','role_ids'])
          out['assignments']=safe_docs('assignments',['assignment_id','employee_id','state','thread_head','updated_at'])
          out['leases']=safe_docs('lifecycle/leases',['assignment_id','employee_id','status','generation','expires_at','last_checkpoint_at'])
          out['deliveries']=safe_docs('supervisor/deliveries',['intent_id','assignment_id','employee_id','state','status','blocker_code','node_id','presence_generation'])
          print(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2))
          PY
