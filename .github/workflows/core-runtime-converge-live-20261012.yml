name: Core Runtime Converge Live 20261012
# retry-current-generation-2

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/core-runtime-converge-live-20261012.yml'

permissions:
  contents: read
  id-token: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos
    steps:
      - uses: actions/checkout@v4

      - name: Mint scheduler credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Confirm runtime converge catalog
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 \
            -H "Authorization: Bearer $AGENTOS_CONTROLLER_TOKEN" \
            "$AGENTOS_RUNNER_WINDOW_BASE/v1/dispatch" > "$RUNNER_TEMP/catalog.json"
          python3 - "$RUNNER_TEMP/catalog.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=d.get('intents') or d.get('catalog') or []
          found=[x for x in rows if isinstance(x,dict) and x.get('capability')=='node.runtime' and x.get('operation')=='converge']
          print(json.dumps(found,indent=2))
          assert found,d
          print('RUNTIME_CONVERGE_CATALOG=PASS')
          PY

      - name: Dispatch exact runtime convergence
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(python3 - "$GITHUB_SHA" <<'PY'
          import json,sys
          print(json.dumps({
            "schema":"agentos.runner-window-dispatch/v1",
            "capability":"node.runtime",
            "operation":"converge",
            "source_commit":sys.argv[1],
            "payload":{}
          },separators=(",",":")))
          PY
          )"
          SUBMIT="$RUNNER_TEMP/submit.json"
          code="$(curl -sS -o "$SUBMIT" -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $AGENTOS_CONTROLLER_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$BODY" "$AGENTOS_RUNNER_WINDOW_BASE/v1/dispatch" || true)"
          cat "$SUBMIT"; echo
          test "$code" = 202

          REQUEST_ID="$(python3 - "$SUBMIT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('ok') is True,d
          print(d['request_id'])
          PY
          )"
          echo "request_id=$REQUEST_ID"

          deadline=$((SECONDS+600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            STATUS="$RUNNER_TEMP/status.json"
            code="$(curl -sS -o "$STATUS" -w '%{http_code}' --max-time 20 \
              -H "Authorization: Bearer $AGENTOS_CONTROLLER_TOKEN" \
              "$AGENTOS_RUNNER_WINDOW_BASE/v1/dispatch/requests/$REQUEST_ID" || true)"
            if [ "$code" = 200 ]; then
              state="$(python3 - "$STATUS" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding='utf-8')).get('state') or 'unknown')
          PY
          )"
              echo "state=$state"
              if [ "$state" = completed ]; then
                cp "$STATUS" "$RUNNER_TEMP/final.json"
                break
              fi
              if [ "$state" = failed ] || [ "$state" = rejected ]; then
                cat "$STATUS"; echo
                exit 1
              fi
            fi
            sleep 2
          done
          test -f "$RUNNER_TEMP/final.json"

      - name: Verify convergence receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/final.json" "$GITHUB_SHA" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          print(json.dumps(d,indent=2,ensure_ascii=False))
          r=d.get('receipt') or {}
          assert r.get('ok') is True,r
          assert r.get('source_commit')==sys.argv[2],r
          rc=r.get('runtime_converge') or {}
          assert rc.get('ok') is True,rc
          assert rc.get('status')=='completed',rc
          assert rc.get('health')=='passed',rc
          print('CORE_RUNTIME_CONVERGE_LIVE=PASS')
          PY
