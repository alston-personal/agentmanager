name: Oracle Experience Regression

on:
  push:
    branches:
      - core/issue-117-experience-memory
    paths:
      - '.github/workflows/oracle-experience-regression.yml'
      - 'agent_core/experience.py'
      - 'scripts/oracle_experience_regression.py'
      - 'experience/agentos-core-oracle.seed.json'
      - 'tests/test_experience_memory.py'
      - 'schemas/agentos-experience-v0.schema.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oracle-experience-regression-117
  cancel-in-progress: false

jobs:
  regress:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/issue-117-experience-memory
          fetch-depth: 0

      - name: Verify non-production boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'core/issue-117-experience-memory'
          echo "issue117_checkout=$(git rev-parse HEAD)"
          echo "live_generation_is_not_modified=PASS"

      - name: Run Experience contract tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_experience_memory.py

      - name: Inspect executor availability
        shell: bash
        run: |
          set -euo pipefail
          echo "codex=$(command -v codex || true)"
          echo "python3=$(command -v python3 || true)"
          test -d /home/ubuntu/agent-data/runtime/antigravity-relay && echo 'antigravity_relay_root=present' || echo 'antigravity_relay_root=missing'

      - name: Run fresh baseline versus ONE-hydrated regressions
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          OUT_DIR=".agentos/evidence/experience/oracle-issue117-run-${GITHUB_RUN_ID}"
          mkdir -p "$OUT_DIR"
          python3 scripts/oracle_experience_regression.py \
            --seed experience/agentos-core-oracle.seed.json \
            --output "$OUT_DIR/regression.json" \
            --timeout 210
          python3 - "$OUT_DIR/regression.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          print('overall='+str(p['overall']))
          for name,item in p['executors'].items():
              print(f"{name}_status={item['status']}")
              print(f"{name}_baseline_score={item['baseline']['score']['score']}")
              print(f"{name}_hydrated_score={item['hydrated']['score']['score']}")
              print(f"{name}_uplift={item['uplift']}")
          PY

      - name: Persist branch-scoped regression evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(.agentos/evidence/experience/oracle-issue117-run-${GITHUB_RUN_ID}/*)
          (( ${#files[@]} > 0 )) || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ".agentos/evidence/experience/oracle-issue117-run-${GITHUB_RUN_ID}"
          git diff --cached --quiet && exit 0
          git commit -m "evidence(agentos): Oracle experience regression ${GITHUB_RUN_ID}"
          # Explicit issue branch only. Never default/main.
          git push origin HEAD:core/issue-117-experience-memory

      - name: Enforce complete regression only after evidence is preserved
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(find .agentos/evidence/experience -maxdepth 2 -path "*/oracle-issue117-run-${GITHUB_RUN_ID}/regression.json" -print -quit)
          test -n "$FILE"
          python3 - "$FILE" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          if p.get('overall') != 'PASS':
              statuses={k:v.get('status') for k,v in p.get('executors',{}).items()}
              raise SystemExit('Experience regression incomplete: '+json.dumps(statuses,sort_keys=True))
          print('experience_regression=PASS')
          PY
