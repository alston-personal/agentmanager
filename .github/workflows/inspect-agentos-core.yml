name: Inspect Distributed AgentOS Core

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-agentos-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      CONFIG_ROOT: ${{ vars.AGENTOS_CONFIG_ROOT || '/home/ubuntu/agentmanager' }}
      RELEASE_ROOT: ${{ vars.AGENTOS_DISTRIBUTED_DEPLOY_ROOT || '/home/ubuntu/agentos-distributed' }}

    steps:
      - name: Resolve deploy host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Inspect Core, ingress, and mirror readiness
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$CONFIG_ROOT" "$RELEASE_ROOT" <<'REMOTE'
          set -euo pipefail
          CONFIG_ROOT="$1"
          RELEASE_ROOT="$2"

          echo "=== Distributed Core ==="
          systemctl --user is-active agentos-control-plane.service || true
          curl -fsS http://127.0.0.1:8765/health || true
          echo
          if [ -d "$RELEASE_ROOT/.git" ]; then
            echo "release_sha=$(git -C "$RELEASE_ROOT" rev-parse HEAD)"
          fi

          echo "=== Listening ports ==="
          ss -ltn 2>/dev/null | grep -E '(:80 |:443 |:5678 |:8765 |:8775 )' || true

          echo "=== Ingress software ==="
          for cmd in nginx caddy apache2 docker; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "$cmd=$(command -v "$cmd")"
            fi
          done
          for svc in nginx caddy apache2; do
            state="$(systemctl is-active "$svc" 2>/dev/null || true)"
            [ -n "$state" ] && echo "$svc=$state"
          done
          if command -v docker >/dev/null 2>&1; then
            echo "=== Docker ports ==="
            docker ps --format '{{.Names}}\t{{.Ports}}' 2>/dev/null || true
          fi

          echo "=== Reverse proxy hints ==="
          if [ -d /etc/nginx ]; then
            grep -R -n -E 'server_name|proxy_pass|n8n\.milkcat\.org' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -n 120 || true
          fi
          echo "sudo_noninteractive=$(sudo -n true >/dev/null 2>&1 && echo yes || echo no)"
          echo "nginx_site_writable=$(test -w /etc/nginx/sites-enabled/n8n && echo yes || echo no)"
          echo "nginx_test_via_sudo=$(sudo -n nginx -t >/dev/null 2>&1 && echo yes || echo no)"

          echo "=== Connector/mirror credential readiness ==="
          set -a
          # shellcheck disable=SC1090
          [ -f "$CONFIG_ROOT/.env" ] && source "$CONFIG_ROOT/.env"
          # shellcheck disable=SC1090
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          [ -n "${AGENTOS_CONTROL_PLANE_TOKEN:-}" ] && echo "control_plane_token=present" || echo "control_plane_token=missing"
          [ -n "${AGENTOS_CONTINUITY_MIRROR_TOKEN:-}" ] && echo "mirror_token=present" || echo "mirror_token=missing"
          [ -n "${GITHUB_TOKEN:-}" ] && echo "legacy_github_token=present" || echo "legacy_github_token=missing"
          [ -n "${AGENTOS_CONTROL_PLANE_PUBLIC_URL:-}" ] && echo "public_url_configured=yes" || echo "public_url_configured=no"

          if [ -n "${AGENTOS_CONTINUITY_MIRROR_TOKEN:-}" ]; then
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${AGENTOS_CONTINUITY_MIRROR_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/alston-personal/my-agent-data || true)"
            echo "mirror_token_repo_http=$code"
          elif [ -n "${GITHUB_TOKEN:-}" ]; then
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/alston-personal/my-agent-data || true)"
            echo "legacy_github_token_repo_http=$code"
          fi
          REMOTE
