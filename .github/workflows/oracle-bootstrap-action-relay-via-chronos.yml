name: Oracle Bootstrap Action Relay Via Existing Chronos

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-bootstrap-action-relay-via-chronos.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Use existing ubuntu Chronos as one-time deterministic migration bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/action-relay-chronos-bootstrap.txt
          LOCAL=/home/ubuntu/agentmanager
          TARGET="$LOCAL/scripts/update_scheduler_board.py"
          DATA=/home/ubuntu/agent-data
          BRIDGE="$DATA/runtime/action-relay-bootstrap"
          mkdir -p "$BRIDGE"
          chmod 2770 "$BRIDGE"
          REQUEST_ID="chronos-bootstrap-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          REQUEST="$BRIDGE/$REQUEST_ID.request"
          RECEIPT="$BRIDGE/$REQUEST_ID.receipt.json"
          BACKUP="$BRIDGE/$REQUEST_ID.update_scheduler_board.py"

          restore_target() {
            if [ -f "$BACKUP" ]; then
              cp -p "$BACKUP" "$TARGET" || true
            fi
          }
          trap restore_target EXIT

          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_identity=$(id)"
            echo "request_id=$REQUEST_ID"
            echo '=== EXISTING UBUNTU EXECUTION SURFACE ==='
            ps -eo user,group,pid,ppid,etime,args | grep -F 'scripts/chronos.py' | grep -v grep || true
            test -f "$TARGET"
            test -w "$TARGET"
            test -f "$DATA/logs/chronos.log"
            python3 - "$DATA/logs/chronos.log" <<'PY'
          import os,sys,time
          p=sys.argv[1]
          age=time.time()-os.stat(p).st_mtime
          print(f'chronos_log_age_seconds={age:.1f}')
          if age > 180:
              raise SystemExit('Chronos log is stale; refusing to patch a dormant execution surface')
          PY
            grep -F 'update_scheduler_board.py' "$DATA/logs/chronos.log" | tail -3 || true

            cp -p "$TARGET" "$BACKUP"
            echo "$REQUEST_ID" > "$REQUEST"
            chmod 0660 "$REQUEST"

            python3 - "$TARGET" "$REQUEST_ID" "$REQUEST" "$RECEIPT" <<'PY'
          from pathlib import Path
          import sys
          target=Path(sys.argv[1]); request_id=sys.argv[2]; request=sys.argv[3]; receipt=sys.argv[4]
          original=target.read_text(encoding='utf-8')
          marker='# AGENTOS_ONE_TIME_CHRONOS_BOOTSTRAP\n'
          if marker in original:
              raise SystemExit('local scheduler board already contains migration bridge marker')
          bridge=f'''{marker}import json as _agentos_json\nimport os as _agentos_os\nfrom pathlib import Path as _AgentOSPath\nimport subprocess as _agentos_subprocess\nimport tempfile as _agentos_tempfile\n\n_AGENTOS_REQUEST_ID={request_id!r}\n_AGENTOS_REQUEST=_AgentOSPath({request!r})\n_AGENTOS_RECEIPT=_AgentOSPath({receipt!r})\nif _AGENTOS_REQUEST.exists() and _AGENTOS_REQUEST.read_text(encoding="utf-8").strip() == _AGENTOS_REQUEST_ID and not _AGENTOS_RECEIPT.exists():\n    _agentos_started=__import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat()\n    _agentos_cmd=["/bin/bash","-lc", "cd /home/ubuntu/agentmanager && git fetch origin main && git show origin/main:scripts/repair_antigravity_relay_user.sh > /tmp/agentos-repair-antigravity.sh && chmod 700 /tmp/agentos-repair-antigravity.sh && AGENTOS_REPO=/home/ubuntu/agentmanager bash /tmp/agentos-repair-antigravity.sh"]\n    _agentos_p=_agentos_subprocess.run(_agentos_cmd, text=True, capture_output=True, timeout=180)\n    _agentos_payload={{\n        "schema":"agentos.one-time-chronos-bootstrap/v1",\n        "request_id":_AGENTOS_REQUEST_ID,\n        "executor_user":_agentos_os.environ.get("USER") or str(_agentos_os.getuid()),\n        "returncode":_agentos_p.returncode,\n        "ok":_agentos_p.returncode == 0,\n        "stdout":(_agentos_p.stdout or "")[-30000:],\n        "stderr":(_agentos_p.stderr or "")[-10000:],\n        "started_at":_agentos_started,\n        "completed_at":__import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),\n    }}\n    _agentos_tmp=_AGENTOS_RECEIPT.with_suffix(".tmp")\n    _agentos_tmp.write_text(_agentos_json.dumps(_agentos_payload,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")\n    _agentos_os.chmod(_agentos_tmp,0o660)\n    _agentos_tmp.replace(_AGENTOS_RECEIPT)\n    _AGENTOS_REQUEST.unlink(missing_ok=True)\n\n'''
          target.write_text(bridge+original,encoding='utf-8')
          PY
            echo 'one_time_bridge_installed=YES'

            for i in $(seq 1 180); do [ -f "$RECEIPT" ] && break; sleep 1; done
            test -f "$RECEIPT" || { echo 'chronos_bootstrap_receipt=TIMEOUT'; exit 3; }
            cat "$RECEIPT"
            python3 - "$RECEIPT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r.get('ok') is True, r
          assert r.get('executor_user') == 'ubuntu', r
          text=(r.get('stdout','')+'\n'+r.get('stderr',''))
          assert 'antigravity_repair=PASS' in text, text[-10000:]
          assert 'action_relay_install=PASS' in text, text[-10000:]
          print('chronos_bootstrap=PASS')
          PY

            restore_target
            rm -f "$BACKUP"
            trap - EXIT
            echo 'one_time_bridge_removed=YES'
            grep -q 'AGENTOS_ONE_TIME_CHRONOS_BOOTSTRAP' "$TARGET" && { echo 'bridge_cleanup=FAIL'; exit 4; } || true

            echo '=== DETERMINISTIC ACTION RELAY CUTOVER ==='
            ACTION_ROOT="$DATA/runtime/action-relay"
            RESTART_ID=$(PYTHONPATH="$PWD" python3 - <<'PY'
          from agentos_node.action_relay import ActionRelayClient
          print(ActionRelayClient('/home/ubuntu/agent-data/runtime/action-relay').submit('agentos.antigravity.restart', {})['capsule_id'])
          PY
          )
            RESTART_RECEIPT="$ACTION_ROOT/receipts/$RESTART_ID.json"
            for i in $(seq 1 120); do [ -f "$RESTART_RECEIPT" ] && break; sleep 1; done
            test -f "$RESTART_RECEIPT" || { echo 'antigravity_restart_receipt=TIMEOUT'; exit 5; }
            cat "$RESTART_RECEIPT"
            python3 - "$RESTART_RECEIPT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1])); assert r.get('ok') is True, r
          assert r.get('action') == 'agentos.antigravity.restart', r
          print('antigravity_restart=PASS')
          PY
            sleep 2
            grep -q '/usr/bin/sg agentos -c' /home/ubuntu/.config/systemd/user/agentos-antigravity-relay.service
            grep -q '/usr/bin/sg agentos -c' /home/ubuntu/.config/systemd/user/agentos-action-relay.service
            ps -eo user,group,pid,args | grep -F 'agentos_node.antigravity_relay_worker --root /home/ubuntu/agent-data/runtime/antigravity-relay' | grep -v grep
            ps -eo user,group,pid,args | grep -F 'agentos_node.action_relay --root /home/ubuntu/agent-data/runtime/action-relay' | grep -v grep
            python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=subprocess.run(['pgrep','-f','agentos_node.antigravity_relay_worker --root /home/ubuntu/agent-data/runtime/antigravity-relay'],text=True,capture_output=True,check=True)
          ok=False
          for raw in p.stdout.split():
              status=Path('/proc')/raw/'status'
              if not status.exists(): continue
              groups=[]
              for line in status.read_text().splitlines():
                  if line.startswith('Groups:'): groups=line.split()[1:]
              if '1005' in groups:
                  ok=True; print(f'antigravity_pid={raw} groups={groups}')
          assert ok, 'new Antigravity worker lacks agentos gid 1005'
          print('antigravity_group_boundary=PASS')
          PY

            echo '=== PROVE OFFICIAL SITE ACTION ==='
            SYNC_ID=$(PYTHONPATH="$PWD" python3 - <<'PY'
          from agentos_node.action_relay import ActionRelayClient
          print(ActionRelayClient('/home/ubuntu/agent-data/runtime/action-relay').submit('site.sync_build', {'site':'studio.milkcat.org'})['capsule_id'])
          PY
          )
            SYNC_RECEIPT="$ACTION_ROOT/receipts/$SYNC_ID.json"
            for i in $(seq 1 300); do [ -f "$SYNC_RECEIPT" ] && break; sleep 1; done
            test -f "$SYNC_RECEIPT" || { echo 'site_sync_receipt=TIMEOUT'; exit 6; }
            cat "$SYNC_RECEIPT"
            python3 - "$SYNC_RECEIPT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1])); assert r.get('ok') is True, r
          assert r.get('action') == 'site.sync_build', r
          print('site_sync_build=PASS')
          PY
            test -s /home/ubuntu/zeus-writer/website/dist/layout-lab/index.html
            UI_CODE=$(curl -sS -o /tmp/layoutlab-chronos-ui -w '%{http_code}' --retry 5 --retry-all-errors https://studio.milkcat.org/layout-lab/)
            echo "public_ui_http_code=$UI_CODE"
            test "$UI_CODE" = 200
            grep -q '<title>Layout Lab | Milkcat Studio</title>' /tmp/layoutlab-chronos-ui
            grep -q 'Analyze layout' /tmp/layoutlab-chronos-ui
            echo 'layoutlab_static_public=PASS'
            echo 'legacy_antigravity_bootstrap=RETIRED'
            echo 'chronos_migration_bridge=REMOVED'
            echo 'action_relay_cutover=PASS'
          } 2>&1 | tee "$OUT"

      - name: Commit migration evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/action-relay-chronos-bootstrap.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(agentos): Action Relay Chronos cutover'
          git pull --rebase origin main
          git push
