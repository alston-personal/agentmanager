name: Oracle Inspect Realm Fabric Endpoint

# Reuse existing Oracle diagnostic, but never print raw systemd, journal,
# env, process args or private Realm state. Source check is read-only.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oracle-inspect-realm-fabric-endpoint.yml'
      - 'scripts/inspect_realm_effective_runtime_redacted.py'
      - 'tests/test_realm_effective_runtime_audit.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-inspect-realm-fabric-endpoint.yml'
      - 'scripts/inspect_realm_effective_runtime_redacted.py'

permissions:
  contents: read

concurrency:
  group: oracle-core-inspection
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source-safe systemd readback before Oracle access
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/inspect_realm_effective_runtime_redacted.py
          python3 -m unittest tests.test_realm_effective_runtime_audit -v

  inspect:
    needs: [validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start existing Oracle SSH transport
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Read effective realm process and immutable release fingerprint without mutations
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" \
            /usr/bin/python3 - \
            < scripts/inspect_realm_effective_runtime_redacted.py \
            > "$RUNNER_TEMP/realm-effective-audit.json"
          python3 -m json.tool "$RUNNER_TEMP/realm-effective-audit.json" >/dev/null
          echo 'realm_effective_readback=PASS'
          echo "realm_effective_audit_source_commit=$GITHUB_SHA"
      - name: Preserve sanitized immutable-runtime audit as a short-lived artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realm-effective-runtime-readonly
          path: ${{ runner.temp }}/realm-effective-audit.json
          if-no-files-found: warn
          retention-days: 7
