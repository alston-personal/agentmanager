name: Oracle Inspect Realm Fabric Endpoint

on:
  workflow_dispatch:
  push:
    branches:
      - core/integration
    paths:
      - '.github/workflows/oracle-inspect-realm-fabric-endpoint.yml'

permissions:
  contents: read

concurrency:
  group: oracle-core-inspection
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect current Core listener and Realm Fabric authority
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -u
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          echo "identity=$(id)"
          echo "home=$HOME"
          echo "agent_data_root_meta=$(stat -c '%U:%G %a' /home/ubuntu/agent-data 2>/dev/null || echo missing)"
          if [ -w /home/ubuntu/agent-data ]; then echo 'agent_data_root_writable=true'; else echo 'agent_data_root_writable=false'; fi
          echo '=== REALM SERVICE ==='
          systemctl --user is-active agentos-realm-fabric.service || true
          systemctl --user show agentos-realm-fabric.service -p MainPID -p ExecMainPID -p ActiveState -p SubState -p FragmentPath -p ExecStart --no-pager || true
          echo '=== LISTENERS ==='
          ss -ltnp 2>/dev/null | grep -E ':8765|:8780|:3000' || true
          echo '=== CONTROL PLANE ==='
          curl -fsS --max-time 3 http://127.0.0.1:8765/health || true
          echo
          echo '=== REALM FABRIC ==='
          if BODY=$(curl -fsS --max-time 3 http://127.0.0.1:8780/v1/health); then
            echo "$BODY"
            echo 'realm_fabric_health=PASS'
          else
            rc=$?
            echo "realm_fabric_health=FAIL rc=$rc"
          fi
          echo '=== REALM STORE TIMING ==='
          FABRIC=/home/ubuntu/agent-data/realm/fabric.json
          stat -c 'fabric_meta=size=%s blocks=%b mtime=%y owner=%U:%G mode=%a' "$FABRIC" 2>/dev/null || true
          du -h "$FABRIC" 2>/dev/null || true
          AGENT_DATA_ROOT=/home/ubuntu/agent-data PYTHONPATH=/home/ubuntu/agentmanager timeout 15s python3 - <<'PY' || true
          import json,time
          from pathlib import Path
          from agent_core.realm_fabric import RealmFabricStore
          p=Path('/home/ubuntu/agent-data/realm/fabric.json')
          t=time.perf_counter(); raw=p.read_bytes(); t1=time.perf_counter()
          data=json.loads(raw); t2=time.perf_counter()
          print(f'fabric_read_ms={(t1-t)*1000:.1f}')
          print(f'fabric_parse_ms={(t2-t1)*1000:.1f}')
          print('fabric_bytes='+str(len(raw)))
          print('fabric_counts='+json.dumps({
            'nodes':len(data.get('nodes') or {}),
            'tasks':sum(len(v or []) for v in (data.get('tasks') or {}).values()),
            'receipts':len(data.get('receipts') or {}),
            'invites':len(data.get('invites') or {}),
            'join_requests':len(data.get('join_requests') or {}),
          },sort_keys=True,separators=(',',':')))
          t3=time.perf_counter(); loaded=RealmFabricStore().load(); t4=time.perf_counter()
          print(f'fabric_store_load_ms={(t4-t3)*1000:.1f}')
          print('fabric_store_load_realm='+str(loaded.get('realm_id')))
          PY
          echo '=== REALM PROCESS ==='
          MAIN=$(systemctl --user show agentos-realm-fabric.service -p MainPID --value 2>/dev/null || true)
          if [ -n "$MAIN" ] && [ "$MAIN" != 0 ]; then
            ps -o pid,ppid,pgid,stat,%cpu,%mem,nlwp,etime,rss,vsz,cmd -p "$MAIN" || true
            CHILDREN=$(pgrep -P "$MAIN" | tr '\n' ' ' || true)
            echo "realm_children=$CHILDREN"
            [ -n "$CHILDREN" ] && ps -o pid,ppid,pgid,stat,%cpu,%mem,nlwp,etime,rss,vsz,cmd -p $(echo "$CHILDREN") || true
            for PID in $MAIN $CHILDREN; do
              echo "pid=$PID cwd=$(readlink -f /proc/$PID/cwd 2>/dev/null || true)"
              echo "pid=$PID cmd=$(tr '\0' ' ' </proc/$PID/cmdline 2>/dev/null || true)"
              echo "pid=$PID fd_count=$(find /proc/$PID/fd -maxdepth 1 -type l 2>/dev/null | wc -l)"
            done
          fi
          echo "realm_current=$(readlink -f /home/ubuntu/.local/share/agentos/realm-fabric/current 2>/dev/null || true)"
          echo '=== REALM JOURNAL ==='
          journalctl --user -u agentos-realm-fabric.service -n 120 --no-pager || true
          echo '=== LIVE CHECKOUT ==='
          LIVE=/home/ubuntu/agentmanager
          test -d "$LIVE/.git" && git -C "$LIVE" rev-parse HEAD || true
          echo '=== PUBLIC URL CONFIG (non-secret only) ==='
          if [ -f "$LIVE/.env" ]; then
            grep -E '^(AGENTOS_CONTROL_PLANE_PUBLIC_URL|AGENTOS_REALM_ID|AGENT_DATA_ROOT|AGENT_MODE)=' "$LIVE/.env" || true
          fi
          echo '=== NODE SNAPSHOT ==='
          AGENT_DATA_ROOT=/home/ubuntu/agent-data PYTHONPATH=/home/ubuntu/agentmanager python3 - <<'PY' || true
          import json
          from agent_core.node_registry import NodeRegistry
          nodes=NodeRegistry().node_map().get('nodes') or []
          for node in nodes:
              if node.get('node_id') in {'oracle-core-node','mbpr','vopc5750','oracle-exec'}:
                  print(json.dumps({
                      'node_id':node.get('node_id'),
                      'status':node.get('status'),
                      'reported_status':node.get('reported_status'),
                      'heartbeat_age_seconds':node.get('heartbeat_age_seconds'),
                      'platform':node.get('platform'),
                      'runtime':node.get('runtime'),
                      'capabilities':node.get('capabilities'),
                  },sort_keys=True,separators=(',',':')))
          PY
          REMOTE

# inspect-retry: 2026-10-01T05:27Z realm-health-hang
# probe: post-dashboard-cutover-mbpr-heartbeat
