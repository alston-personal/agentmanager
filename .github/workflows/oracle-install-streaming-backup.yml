name: Oracle Install Streaming Backup

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/oracle-install-streaming-backup.yml'

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Install direct-to-GDrive backup service
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$ORACLE_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$HOME/.config/systemd/user"

          cat > "$HOME/.local/bin/backup_agentos_stream.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          DATE="$(date +'%Y%m%d_%H%M%S')"
          REMOTE="gdrive:backups/agentos_backup_${DATE}.tar.gz"

          echo "backup_start=${DATE}"
          echo "backup_remote=${REMOTE}"

          tar \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='__pycache__' \
            --exclude='venv' \
            --exclude='*.log' \
            -czf - \
            /home/ubuntu/agentmanager \
            /home/ubuntu/agent-data \
          | rclone rcat "$REMOTE" \
              --stats 30s \
              --retries 3 \
              --low-level-retries 10

          SIZE="$(rclone lsf "$REMOTE" --files-only --format s 2>/dev/null | head -n1 || true)"
          test -n "$SIZE"
          test "$SIZE" -gt 1048576
          echo "backup_verified=${REMOTE} size=${SIZE}"
          SH
          chmod 700 "$HOME/.local/bin/backup_agentos_stream.sh"

          cat > "$HOME/.config/systemd/user/agentos-backup.service" <<'UNIT'
          [Unit]
          Description=AgentOS direct Google Drive backup
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=%h/.local/bin/backup_agentos_stream.sh
          Nice=10
          IOSchedulingClass=best-effort
          IOSchedulingPriority=7
          UNIT

          cat > "$HOME/.config/systemd/user/agentos-backup.timer" <<'UNIT'
          [Unit]
          Description=Daily AgentOS backup timer

          [Timer]
          OnCalendar=*-*-* 03:00:00
          Persistent=true
          AccuracySec=1min
          Unit=agentos-backup.service

          [Install]
          WantedBy=timers.target
          UNIT

          current="$(crontab -l 2>/dev/null || true)"
          updated="$(printf '%s\n' "$current" | grep -Ev 'backup_agentos(_guarded)?\.sh' || true)"
          printf '%s\n' "$updated" | sed '/^[[:space:]]*$/d' | crontab -

          systemctl --user daemon-reload
          systemctl --user enable --now agentos-backup.timer
          systemctl --user is-enabled agentos-backup.timer
          systemctl --user is-active agentos-backup.timer
          systemctl --user list-timers agentos-backup.timer --no-pager
          echo 'agentos_streaming_backup_install=PASS'
          REMOTE
