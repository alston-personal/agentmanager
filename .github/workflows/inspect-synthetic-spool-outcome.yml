name: Inspect Synthetic Spool Outcome

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/inspect-synthetic-spool-outcome.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect spool files and synthetic archive
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          f=RealmFabricStore()
          tid='inspect-synthetic-spool-outcome-20261006-1012'
          ps=r'''$root=Join-Path $env:LOCALAPPDATA 'AgentOS\state\pending-receipts'
          Write-Output '===FILES==='
          if(Test-Path $root){Get-ChildItem -Recurse $root | Select-Object FullName,Length,LastWriteTime | ConvertTo-Json -Compress}
          Write-Output '===SYNTHETIC_FILE==='
          if(Test-Path $root){Get-ChildItem -Recurse $root -Filter '*.json' | ForEach-Object { $t=Get-Content -Raw -LiteralPath $_.FullName; if($t -match 'synthetic-timeout-receipt-20261002-1659'){Write-Output ('PATH='+$_.FullName);Write-Output $t}}}
          Write-Output '===PROC==='
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match '^pythonw?\.exe$' -and $_.CommandLine -match '(?i)-m\s+agentos_node\.client_cli\s+run(?:\s|$)' } | Select-Object ProcessId,CreationDate,CommandLine | ConvertTo-Json -Compress'''
          if f.get_receipt(tid) is None:
              f.queue_task('VO10005870',{'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':'powershell','argv':['-NoProfile','-NonInteractive','-Command',ps],'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':20,'cognition_ids_used':['demo://receipt-spool/20261006']})
          for _ in range(35):
              r=f.get_receipt(tid)
              if r:
                  print(r.get('stdout') or '')
                  break
              time.sleep(1)
          else: raise SystemExit('inspect_spool_outcome_receipt_missing')
          print('ONE_SYNTHETIC='+json.dumps(f.get_receipt('synthetic-timeout-receipt-20261002-1659'),ensure_ascii=False,separators=(',',':')))
          PY
          REMOTE