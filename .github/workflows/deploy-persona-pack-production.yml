name: Deploy Persona Pack Production
on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths: ['.github/workflows/deploy-persona-pack-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          H="${DEPLOY_HOST_SOURCE#*://}"; H="${H%%/*}"; H="${H%%:*}"; echo "DEPLOY_HOST=$H" >> "$GITHUB_ENV"
      - name: SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Deploy Persona Creator with rollback
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" <<'REMOTE'
          set -euo pipefail
          PROD=/home/ubuntu/leopardcat-tarot
          WEB="$PROD/website"
          TARGET=83d0c97f46c5e3554982a19509da588562fdcebb
          OLD=$(git -C "$PROD" rev-parse HEAD)
          echo old_commit=$OLD
          echo target_commit=$TARGET
          dirty=$(git -C "$PROD" status --porcelain | grep -v '^ M website/stats.json$' | grep -v '^ M website/dist/' | grep -v '^?? website/data/' || true)
          if [ -n "$dirty" ]; then echo 'unexpected production changes:' >&2; echo "$dirty" >&2; exit 40; fi
          cp "$WEB/stats.json" /tmp/lc-stats.pre-persona-creator.json
          mkdir -p "$WEB/data/custom_decks" "$WEB/data/custom_themes" "$WEB/data/custom_personas"
          git -C "$PROD" checkout -- website/dist 2>/dev/null || true
          stop_server() {
            for p in $(pgrep -f 'python3 fortune_server.py' || true); do
              c=$(readlink -f /proc/$p/cwd 2>/dev/null || true); [ "$c" = "$WEB" ] && kill "$p" >/dev/null 2>&1 || true
            done
            sleep 1
          }
          start_server() {
            cd "$WEB"; nohup /usr/bin/python3 fortune_server.py >/tmp/fortune_server.log 2>&1 &
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8088/api/v1/ai-policy >/dev/null 2>&1 && return 0; sleep 1; done
            tail -80 /tmp/fortune_server.log >&2 || true; return 1
          }
          rollback() {
            echo deployment_failed_rolling_back >&2
            stop_server
            git -C "$PROD" reset --hard "$OLD"
            cp /tmp/lc-stats.pre-persona-creator.json "$WEB/stats.json"
            mkdir -p "$WEB/data/custom_decks" "$WEB/data/custom_themes" "$WEB/data/custom_personas"
            cd "$WEB"; npm run build; start_server
            echo rollback_commit=$OLD >&2
          }
          trap 'r=$?; if [ $r -ne 0 ]; then rollback || true; fi; exit $r' EXIT
          git -c credential.helper= -C "$PROD" fetch https://github.com/alston-personal/leopardcat-tarot.git main
          F=$(git -C "$PROD" rev-parse FETCH_HEAD); [ "$F" = "$TARGET" ] || { echo unexpected_main=$F >&2; exit 41; }
          git -C "$PROD" merge --ff-only FETCH_HEAD
          cp /tmp/lc-stats.pre-persona-creator.json "$WEB/stats.json"
          mkdir -p "$WEB/data/custom_decks" "$WEB/data/custom_themes" "$WEB/data/custom_personas"
          cd "$WEB"
          npm run build
          python3 -m py_compile fortune_server.py divination/*.py
          node --check public/creator.js
          grep -q 'id="persona-options"' public/create.html
          grep -q '建立我的解牌師' public/create.html
          grep -q 'id="persona-name"' public/create.html
          grep -q "fetch('/api/v1/personas'" public/creator.js
          grep -q 'selectedPersonaId = data.persona_id' public/creator.js
          grep -q "self.path == '/api/v1/personas'" fortune_server.py
          grep -q "path.startswith('/api/v1/personas/')" fortune_server.py
          grep -q 'custom_personas' divination/__init__.py
          python3 - <<'PY'
          import tempfile
          from divination.persona_publishing import PersonaPublisher
          from divination.personas import ConfigurablePersona
          with tempfile.TemporaryDirectory() as td:
              pub = PersonaPublisher(td)
              out = pub.publish({
                  'name':'部署驗證引路人',
                  'role':'只存在暫存目錄的部署驗證 Persona',
                  'voice':'簡潔\n溫和',
                  'principles':'忠實解讀既有牌面\n不改變抽牌結果',
              })
              p = ConfigurablePersona(pub.pack_path(out['persona_id']))
              assert p.public_info()['source'] == 'custom'
              prompt = p.build_prompt(method_result={'cards':[{'id':'x'}]}, question='測試', lang='zh-TW')
              assert 'PLATFORM RULES' in prompt and 'FINAL PLATFORM REMINDER' in prompt
          print('persona_creator_temp_publish=passed')
          PY
          stop_server; start_server
          curl -fsS http://127.0.0.1:8088/create.html | grep -q '建立我的解牌師'
          curl -fsS 'http://127.0.0.1:8088/api/v1/personas?deck=leopardcat' | python3 -c "import sys,json; d=json.load(sys.stdin); by={x['persona_id']:x for x in d['personas']}; assert {'master','leopardcat'} <= set(by); assert '石虎' in by['leopardcat']['name']; print('creator_persona_catalog_localized=passed')"
          code=$(curl -sS -o /tmp/persona-invalid-local.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8088/api/v1/personas)
          [ "$code" = 400 ]
          python3 -c "import json; d=json.load(open('/tmp/persona-invalid-local.json')); assert d['error']=='invalid_persona'; print('persona_creator_local_endpoint=passed')"
          curl -fsS https://leopardcat-tarot.milkcat.org/create.html | grep -q '建立我的解牌師'
          curl -fsS 'https://leopardcat-tarot.milkcat.org/api/v1/personas?deck=leopardcat' | python3 -c "import sys,json; d=json.load(sys.stdin); by={x['persona_id']:x for x in d['personas']}; assert '石虎' in by['leopardcat']['name']; print('public_persona_localization=passed')"
          code=$(curl -sS -o /tmp/persona-invalid-public.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://leopardcat-tarot.milkcat.org/api/v1/personas)
          [ "$code" = 400 ]
          echo public_persona_creator_endpoint=passed
          echo production_persona_creator=passed
          echo deployed_commit=$(git -C "$PROD" rev-parse HEAD)
          trap - EXIT
          REMOTE
