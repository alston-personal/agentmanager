name: Deploy Persona Pack Production
on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths: ['.github/workflows/deploy-persona-pack-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          H="${DEPLOY_HOST_SOURCE#*://}"; H="${H%%/*}"; H="${H%%:*}"; echo "DEPLOY_HOST=$H" >> "$GITHUB_ENV"
      - name: SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Deploy Persona Pack with rollback
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" <<'REMOTE'
          set -euo pipefail
          PROD=/home/ubuntu/leopardcat-tarot
          WEB="$PROD/website"
          TARGET=8591556e9f159acf01b407736efb63c3178b380d
          OLD=$(git -C "$PROD" rev-parse HEAD)
          echo old_commit=$OLD
          echo target_commit=$TARGET
          dirty=$(git -C "$PROD" status --porcelain | grep -v '^ M website/stats.json$' | grep -v '^ M website/dist/' | grep -v '^?? website/data/' || true)
          if [ -n "$dirty" ]; then echo 'unexpected production changes:' >&2; echo "$dirty" >&2; exit 40; fi
          cp "$WEB/stats.json" /tmp/lc-stats.pre-persona.json
          mkdir -p "$WEB/data/custom_decks" "$WEB/data/custom_themes"
          git -C "$PROD" checkout -- website/dist 2>/dev/null || true
          stop_server() {
            for p in $(pgrep -f 'python3 fortune_server.py' || true); do
              c=$(readlink -f /proc/$p/cwd 2>/dev/null || true); [ "$c" = "$WEB" ] && kill "$p" >/dev/null 2>&1 || true
            done
            sleep 1
          }
          start_server() {
            cd "$WEB"; nohup /usr/bin/python3 fortune_server.py >/tmp/fortune_server.log 2>&1 &
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8088/api/v1/ai-policy >/dev/null 2>&1 && return 0; sleep 1; done
            tail -80 /tmp/fortune_server.log >&2 || true; return 1
          }
          rollback() {
            echo deployment_failed_rolling_back >&2
            stop_server
            git -C "$PROD" reset --hard "$OLD"
            cp /tmp/lc-stats.pre-persona.json "$WEB/stats.json"
            cd "$WEB"; npm run build; start_server
            echo rollback_commit=$OLD >&2
          }
          trap 'r=$?; if [ $r -ne 0 ]; then rollback || true; fi; exit $r' EXIT
          git -c credential.helper= -C "$PROD" fetch https://github.com/alston-personal/leopardcat-tarot.git main
          F=$(git -C "$PROD" rev-parse FETCH_HEAD); [ "$F" = "$TARGET" ] || { echo unexpected_main=$F >&2; exit 41; }
          git -C "$PROD" merge --ff-only FETCH_HEAD
          cp /tmp/lc-stats.pre-persona.json "$WEB/stats.json"
          mkdir -p "$WEB/data/custom_decks" "$WEB/data/custom_themes"
          cd "$WEB"
          npm run build
          python3 -m py_compile fortune_server.py divination/*.py
          node --check main.js
          grep -q 'default_persona' divination/decks.py
          grep -q '/api/v1/personas' fortune_server.py
          grep -q "persona_id = saved\['persona'\]" fortune_server.py
          grep -q 'window.activePersonaId' main.js
          grep -q 'persona_id: window.activePersonaId' main.js
          grep -q "shareU.searchParams.set('persona', window.activePersonaId)" main.js
          ! grep -q "activeDeckId === 'leopardcat' ? 'leopardcat' : 'master'" main.js
          stop_server; start_server
          curl -fsS http://127.0.0.1:8088/api/v1/decks/test-2cfe3b | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('default_persona') == 'master'; print('custom_deck_default_persona=passed')"
          curl -fsS http://127.0.0.1:8088/api/v1/decks/leopardcat | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('default_persona') == 'leopardcat'; print('leopardcat_default_persona=passed')"
          curl -fsS 'http://127.0.0.1:8088/api/v1/personas?deck=test-2cfe3b' | python3 -c "import sys,json; d=json.load(sys.stdin); ids={x['persona_id'] for x in d['personas']}; assert d['default_persona']=='master'; assert {'master','leopardcat'} <= ids; print('custom_persona_catalog=passed')"
          curl -fsS 'http://127.0.0.1:8088/api/v1/personas?deck=leopardcat' | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['default_persona']=='leopardcat'; print('leopardcat_persona_catalog=passed')"
          python3 - <<'PY'
          import os, tempfile
          from divination.sessions import ReadingSessionStore
          fd, path = tempfile.mkstemp(prefix='persona-session-', suffix='.sqlite3')
          os.close(fd)
          try:
              s = ReadingSessionStore(path, ttl_seconds=60)
              issued = s.create(reading_id='rd_persona_contract', method='tarot', persona='leopardcat', deck_id='test-2cfe3b', method_result={'deck':{'deck_id':'test-2cfe3b'},'cards':[{'card_id':'card-001','orientation':'upright'}]})
              restored = s.get('rd_persona_contract', issued['session_token'])
              assert restored['persona'] == 'leopardcat'
              assert restored['deck_id'] == 'test-2cfe3b'
              print('persona_session_lock=passed')
          finally:
              try: os.unlink(path)
              except FileNotFoundError: pass
          PY
          JS=$(find dist/assets -name 'index-*.js' | head -1)
          test -s "$JS"
          curl -fsS https://leopardcat-tarot.milkcat.org/assets/$(basename "$JS") >/dev/null
          curl -fsS 'https://leopardcat-tarot.milkcat.org/api/v1/personas?deck=test-2cfe3b' | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['default_persona']=='master'; print('public_custom_persona_catalog=passed')"
          curl -fsS 'https://leopardcat-tarot.milkcat.org/api/v1/personas?deck=leopardcat' | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['default_persona']=='leopardcat'; print('public_leopardcat_persona_catalog=passed')"
          echo production_persona_pack=passed
          echo deployed_commit=$(git -C "$PROD" rev-parse HEAD)
          trap - EXIT
          REMOTE
