name: Oracle Probe Shared Threads Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-probe-shared-threads-runtime.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe shared Threads runtime without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          echo '=== threads reader health ==='
          if curl -fsS --max-time 5 http://127.0.0.1:18766/healthz >/tmp/threads-health.json; then
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/threads-health.json'))
          print('threads_reader_health=PASS')
          print('threads_reader_service=' + str(d.get('service','unknown')))
          print('threads_reader_version=' + str(d.get('version','unknown')))
          PY
          else
            echo 'threads_reader_health=FAIL'
          fi

          echo '=== listener/process ==='
          if ss -ltn 2>/dev/null | grep -q ':18766 '; then echo 'threads_reader_port_18766=LISTENING'; else echo 'threads_reader_port_18766=NOT_LISTENING'; fi
          ps -eo pid,user,args | grep -E '[u]vicorn .*threads_reader|[p]ython.*threads_reader' || true

          echo '=== repository/runtime discovery ==='
          mapfile -t roots < <(find /home /opt /srv -maxdepth 6 -type f -name compose.yaml -path '*vendor-reputation-service*' -printf '%h\n' 2>/dev/null | sort -u | head -10)
          if [ "${#roots[@]}" -eq 0 ]; then
            echo 'vendor_runtime_path=NOT_FOUND'
          else
            for root in "${roots[@]}"; do
              echo "vendor_runtime_path=$root"
              if [ -f "$root/.env" ]; then
                echo 'vendor_env_file=PRESENT'
                if grep -Eq '^SOC_THREADS_TOKEN=.+$' "$root/.env"; then echo 'soc_threads_token_configured=YES'; else echo 'soc_threads_token_configured=NO'; fi
              else
                echo 'vendor_env_file=ABSENT'
              fi
              if [ -d "$root/.git" ]; then
                echo "vendor_runtime_head=$(git -C "$root" rev-parse HEAD 2>/dev/null || echo unknown)"
              fi
            done
          fi

          echo '=== nginx discovery ==='
          mapfile -t proxy_files < <(grep -RslE '18766|threads-reader' /etc/nginx /etc/apache2 2>/dev/null | head -10 || true)
          if [ "${#proxy_files[@]}" -eq 0 ]; then echo 'threads_reader_proxy_config=NOT_FOUND'; else printf 'threads_reader_proxy_config=%s\n' "${proxy_files[@]}"; fi
          mapfile -t studio_files < <(grep -Rsl 'studio.milkcat.org' /etc/nginx /etc/apache2 2>/dev/null | head -10 || true)
          if [ "${#studio_files[@]}" -eq 0 ]; then echo 'studio_site_config=NOT_FOUND'; else printf 'studio_site_config=%s\n' "${studio_files[@]}"; fi

          echo '=== token references (presence only) ==='
          token_ref=NO
          for root in "${roots[@]:-}"; do
            if [ -n "$root" ] && grep -Rqs 'SOC_THREADS_TOKEN' "$root" --exclude='.env' 2>/dev/null; then token_ref=YES; fi
          done
          echo "soc_threads_token_reference_in_runtime=$token_ref"

          echo 'probe_complete=PASS'
