name: Oracle Publish Mio Approved Post

on:
  push:
    branches:
      - core/integration
    paths:
      - 'personas/mio/approved/mio-post-*.txt'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify exactly one newly approved post
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=A "${{ github.event.before }}" "$GITHUB_SHA" -- 'personas/mio/approved/mio-post-*.txt')
          test "${#files[@]}" -eq 1 || { echo 'mio_approved_post=REQUIRE_EXACTLY_ONE_NEW_FILE'; exit 2; }
          post_key="$(basename "${files[0]}" .txt)"
          test -f "${files[0]}"
          test "$(wc -m < "${files[0]}")" -le 500
          [[ "$post_key" =~ ^mio-post-[a-z0-9-]{1,72}$ ]]
          printf 'POST_KEY=%s\n' "$post_key" >> "$GITHUB_ENV"
          if [ -f "personas/mio/approved/$post_key.json" ]; then
            python3 - "$post_key" <<'PY'
          import json,re,sys
          from pathlib import Path
          key=sys.argv[1]
          data=json.loads(Path(f"personas/mio/approved/{key}.json").read_text(encoding="utf-8"))
          if set(data)=={"image_path","image_alt_text"}:
              photos=[data]
          elif set(data)=={"image_url","image_alt_text"}:
              photos=[data]
          elif set(data)=={"images"} and isinstance(data["images"],list) and 2<=len(data["images"])<=20:
              photos=data["images"]
          else:
              raise AssertionError("mio_image_manifest_fields_invalid")
          for photo in photos:
              assert isinstance(photo,dict), "mio_image_item_invalid"
              assert 0<len(str(photo.get("image_alt_text") or "").strip())<=1000, "mio_image_alt_missing"
              if set(photo)=={"image_url","image_alt_text"}:
                  from urllib.parse import urlparse
                  u=urlparse(str(photo["image_url"]))
                  assert u.scheme=="https" and u.hostname=="export-download.canva.com", "mio_external_image_url_invalid"
                  continue
              assert set(photo)=={"image_path","image_alt_text"}, "mio_image_item_invalid"
              rel=str(photo["image_path"])
              assert re.fullmatch(r"personas/mio/approved/assets/[a-z0-9-]{1,64}\.(?:png|jpg|jpeg)",rel), "mio_image_path_invalid"
              asset=Path(rel)
              assert asset.is_file() and 32<=asset.stat().st_size<=8*1024*1024, "mio_image_asset_missing_or_too_large"
          PY
            printf 'AGENTOS_REQUIRE_IMAGE=1\n' >> "$GITHUB_ENV"
          fi

      - name: Preflight governed one-shot publisher
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/core/integration'
          python3 -m py_compile agentos_node/bootstrap_control.py agentos_node/bootstrap_scheduler.py agentos_node/social/contracts.py agentos_node/social/threads.py
          bash -n scripts/publish_galaxy_threads_day1_user.sh
          bash -n scripts/submit_oracle_bootstrap_request_remote.sh
          PYTHONPATH=. python3 -m unittest discover -s tests -p test_mio_image_contract.py -v
          grep -Fq 'agentos.social_threads_mio_approved.publish' agentos_node/bootstrap_control.py
          echo 'mio_approved_ingress=github-hosted'
          echo 'mio_approved_preflight=PASS'

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Submit approved post to AgentOS social scheduler
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID="mio-approved-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PARAMS="$(python3 -c 'import json,os; print(json.dumps({"post_key":os.environ["POST_KEY"]},separators=(",",":")))' )"
          AGENTOS_RECEIPT_TIMEOUT_SECONDS=780             bash scripts/submit_oracle_bootstrap_request_remote.sh               agentos.social_threads_mio_approved.publish "$REQUEST_ID" "$GITHUB_SHA" "$PARAMS"               > "$RUNNER_TEMP/mio-approved-receipt.json"

          python3 - "$RUNNER_TEMP/mio-approved-receipt.json" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); expected=sys.argv[2]
          assert r.get('schema')=='agentos.bootstrap-receipt/v1',r
          assert r.get('action')=='agentos.social_threads_mio_approved.publish',r
          assert r.get('source_commit')==expected,r
          assert r.get('ok') is True,r
          s=r.get('scheduler') or {}
          assert s.get('worker_role')=='social',s
          assert s.get('worker_id') in {'oracle-social-1','oracle-social-2'},s
          text='\n'.join(str(x.get('stdout',''))+'\n'+str(x.get('stderr','')) for x in r.get('steps',[]))
          assert ('galaxy_day1_publish=PASS' in text) or ('galaxy_day1_publish=ALREADY_PRESENT' in text),text[-12000:]
          if os.environ.get('AGENTOS_REQUIRE_IMAGE')=='1':
              assert 'galaxy_day1_image_asset=VERIFIED' in text,'image_cdn_asset_not_verified'
              assert 'galaxy_day1_image_readback=PASS' in text or ('galaxy_day1_publish=ALREADY_PRESENT' in text and 'galaxy_day1_object_id=' in text),'image_not_verified_on_threads'
          assert any(line.startswith('galaxy_day1_permalink=https://www.threads.com/@mio.milkcat/post/') for line in text.splitlines()),text[-12000:]
          assert any(line.startswith('galaxy_day1_object_id=') and line.split('=',1)[1].strip() for line in text.splitlines()),text[-12000:]
          for forbidden in ('access_token','app_secret','control_token','product_key'):
              assert forbidden not in text.lower(),forbidden
          print('mio_approved_receipt=PASS')
          print('mio_approved_worker='+s['worker_id'])
          for line in text.splitlines():
              if line.startswith(('galaxy_day1_username=','galaxy_day1_object_id=','galaxy_day1_permalink=','galaxy_day1_publish=','galaxy_day1_image_readback=','galaxy_day1_image_asset=')):
                  print(line)
          PY

      - name: Upload scheduler receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mio-approved-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/mio-approved-receipt.json
          if-no-files-found: warn
          retention-days: 14
