name: Oracle Publish Mio Approved Post

on:
  push:
    branches:
      - core/integration
    paths:
      - 'personas/mio/approved/mio-post-*.txt'

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify exactly one newly approved post
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=A "${{ github.event.before }}" "$GITHUB_SHA" -- 'personas/mio/approved/mio-post-*.txt')
          test "${#files[@]}" -eq 1 || { echo 'mio_approved_post=REQUIRE_EXACTLY_ONE_NEW_FILE'; exit 2; }
          post_key="$(basename "${files[0]}" .txt)"
          test -f "${files[0]}"
          test "$(wc -m < "${files[0]}")" -le 500
          [[ "$post_key" =~ ^mio-post-[a-z0-9-]{1,72}$ ]]
          printf 'POST_KEY=%s\n' "$post_key" >> "$GITHUB_ENV"

      - name: Preflight governed one-shot publisher
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/core/integration'
          test "$(id -un)" = 'agentos-node'
          python3 -m py_compile agentos_node/bootstrap_control.py
          bash -n scripts/publish_galaxy_threads_day1_user.sh
          grep -Fq 'agentos.social_threads_mio_approved.publish' agentos_node/bootstrap_control.py
          echo 'mio_approved_preflight=PASS'

      - name: Publish bounded bootstrap hook and request approved Mio post
        shell: bash
        run: |
          set -euo pipefail
          LIVE=/home/ubuntu/agentmanager
          ROOT=/tmp/agentos-bootstrap-control
          REQUESTS="$ROOT/requests"
          RECEIPTS="$ROOT/receipts"
          REQUEST_ID="mio-approved-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          REQUEST="$REQUESTS/$REQUEST_ID.request.json"
          RECEIPT="$RECEIPTS/$REQUEST_ID.json"

          cat agentos_node/bootstrap_control.py > "$LIVE/agentos_node/bootstrap_control.py"
          chmod 0664 "$LIVE/agentos_node/bootstrap_control.py" || true
          python3 -m py_compile "$LIVE/agentos_node/bootstrap_control.py"

          for i in $(seq 1 120); do
            [ -d "$REQUESTS" ] && [ -d "$RECEIPTS" ] && break
            sleep 1
          done
          test -d "$REQUESTS"
          test -d "$RECEIPTS"
          test "$(stat -c '%U' "$REQUESTS")" = ubuntu
          test "$(stat -c '%a' "$REQUESTS")" = 1777

          python3 - "$REQUEST" "$REQUEST_ID" "$GITHUB_SHA" "$POST_KEY" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path(sys.argv[1]); request_id=sys.argv[2]; sha=sys.argv[3]; post_key=sys.argv[4]
          payload={
            'schema':'agentos.bootstrap-request/v1',
            'request_id':request_id,
            'action':'agentos.social_threads_mio_approved.publish',
            'created_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'params':{'source_commit':sha,'post_key':post_key},
            'authority':{'source':'github-actions','target_user':'ubuntu','arbitrary_shell':False},
          }
          tmp=path.with_suffix(path.suffix+'.tmp')
          tmp.write_text(json.dumps(payload,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          os.chmod(tmp,0o644); tmp.replace(path); os.chmod(path,0o644)
          PY

          for i in $(seq 1 480); do [ -f "$RECEIPT" ] && break; sleep 1; done
          test -f "$RECEIPT" || { echo 'mio_approved_receipt=TIMEOUT'; exit 3; }

          python3 - "$RECEIPT" "$GITHUB_SHA" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); expected=sys.argv[2]
          assert r.get('schema')=='agentos.bootstrap-receipt/v1',r
          assert r.get('action')=='agentos.social_threads_mio_approved.publish',r
          assert r.get('executor_user')=='ubuntu',r
          assert r.get('executor_uid')==1001,r
          assert r.get('source_commit')==expected,r
          assert r.get('ok') is True,r
          text='\n'.join(str(s.get('stdout',''))+'\n'+str(s.get('stderr','')) for s in r.get('steps',[]))
          assert ('galaxy_day1_publish=PASS' in text) or ('galaxy_day1_publish=ALREADY_PRESENT' in text), text[-12000:]
          assert any(line.startswith('galaxy_day1_permalink=https://www.threads.com/@sunlake.milkcat/post/') for line in text.splitlines()), text[-12000:]
          assert any(line.startswith('galaxy_day1_object_id=') and line.split('=',1)[1].strip() for line in text.splitlines()), text[-12000:]
          for forbidden in ('access_token','app_secret','control_token','product_key'):
              assert forbidden not in text.lower(), forbidden
          print('mio_approved_receipt=PASS')
          for line in text.splitlines():
              if line.startswith(('galaxy_day1_username=','galaxy_day1_object_id=','galaxy_day1_permalink=','galaxy_day1_publish=')):
                  print(line)
          PY

# Retry after fixed post_key initialization; fixed approved approved Mio post only.
