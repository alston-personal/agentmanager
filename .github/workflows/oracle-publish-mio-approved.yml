name: Oracle Publish Mio Approved Post

on:
  push:
    branches:
      - core/integration
    paths:
      - 'personas/mio/approved/mio-post-*.txt'

permissions:
  contents: read
  id-token: write


jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTOS_SCHEDULER_BASE: https://studio.milkcat.org/dashboard/api/agentos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify exactly one newly approved post
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=A "${{ github.event.before }}" "$GITHUB_SHA" -- 'personas/mio/approved/mio-post-*.txt')
          test "${#files[@]}" -eq 1 || { echo 'mio_approved_post=REQUIRE_EXACTLY_ONE_NEW_FILE'; exit 2; }
          post_key="$(basename "${files[0]}" .txt)"
          test -f "${files[0]}"
          test "$(wc -m < "${files[0]}")" -le 500
          [[ "$post_key" =~ ^mio-post-[a-z0-9-]{1,72}$ ]]
          printf 'POST_KEY=%s\n' "$post_key" >> "$GITHUB_ENV"
          if [ -f "personas/mio/approved/$post_key.json" ]; then
            python3 - "$post_key" <<'PY'
          import json,re,sys
          from pathlib import Path
          key=sys.argv[1]
          data=json.loads(Path(f"personas/mio/approved/{key}.json").read_text(encoding="utf-8"))
          if set(data)=={"image_path","image_alt_text"}:
              photos=[data]
          elif set(data)=={"image_url","image_alt_text"}:
              photos=[data]
          elif set(data)=={"images"} and isinstance(data["images"],list) and 2<=len(data["images"])<=20:
              photos=data["images"]
          else:
              raise AssertionError("mio_image_manifest_fields_invalid")
          for photo in photos:
              assert isinstance(photo,dict), "mio_image_item_invalid"
              assert 0<len(str(photo.get("image_alt_text") or "").strip())<=1000, "mio_image_alt_missing"
              if set(photo)=={"image_url","image_alt_text"}:
                  from urllib.parse import urlparse
                  u=urlparse(str(photo["image_url"]))
                  assert u.scheme=="https" and u.hostname=="export-download.canva.com", "mio_external_image_url_invalid"
                  continue
              assert set(photo)=={"image_path","image_alt_text"}, "mio_image_item_invalid"
              rel=str(photo["image_path"])
              assert re.fullmatch(r"personas/mio/approved/assets/[a-z0-9-]{1,64}\.(?:png|jpg|jpeg)",rel), "mio_image_path_invalid"
              asset=Path(rel)
              assert asset.is_file() and 32<=asset.stat().st_size<=8*1024*1024, "mio_image_asset_missing_or_too_large"
          PY
            printf 'AGENTOS_REQUIRE_IMAGE=1\n' >> "$GITHUB_ENV"
          fi

      - name: Preflight governed one-shot publisher
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/core/integration'
          python3 -m py_compile agentos_node/bootstrap_control.py agentos_node/bootstrap_scheduler.py agentos_node/social/contracts.py agentos_node/social/threads.py
          bash -n scripts/publish_galaxy_threads_day1_user.sh
          bash -n scripts/submit_agentos_scheduler_request_https.sh
          PYTHONPATH=. python3 -m unittest discover -s tests -p test_mio_image_contract.py -v
          grep -Fq 'agentos.social_threads_mio_approved.publish' agentos_node/bootstrap_control.py
          echo 'mio_approved_ingress=github-hosted'
          echo 'mio_approved_preflight=PASS'

      - name: Mint GitHub OIDC scheduler credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
      - name: Submit approved post to AgentOS social scheduler
        shell: bash
        run: |
          set -euo pipefail
          AGENTOS_SCHEDULER_WAIT_SECONDS=780             bash scripts/submit_agentos_scheduler_request_https.sh               agentos.social_threads_mio_approved.publish "$GITHUB_SHA"               post_key="$POST_KEY"               > "$RUNNER_TEMP/mio-approved-roundtrip.txt"

          python3 - "$RUNNER_TEMP/mio-approved-roundtrip.txt" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          lines=[x.strip() for x in open(sys.argv[1],encoding='utf-8') if x.strip()]
          docs=[json.loads(x) for x in lines if x.startswith('{')]
          r=docs[-1]['receipt']; expected=sys.argv[2]
          assert r.get('schema')=='agentos.bootstrap-receipt/v1',r
          assert r.get('action')=='agentos.social_threads_mio_approved.publish',r
          assert r.get('source_commit')==expected,r
          assert r.get('ok') is True,r
          sch=r.get('scheduler') or {}
          assert sch.get('worker_role')=='social',sch
          assert sch.get('worker_id') in {'oracle-social-1','oracle-social-2'},sch
          evidence=list(r.get('evidence') or [])
          assert any(x in {'galaxy_day1_publish=PASS','galaxy_day1_publish=ALREADY_PRESENT'} for x in evidence),evidence
          if os.environ.get('AGENTOS_REQUIRE_IMAGE')=='1':
              assert 'galaxy_day1_image_asset=VERIFIED' in evidence,evidence
              assert ('galaxy_day1_image_readback=PASS' in evidence) or (
                  'galaxy_day1_publish=ALREADY_PRESENT' in evidence and any(x.startswith('galaxy_day1_object_id=') for x in evidence)
              ),evidence
          assert any(x.startswith('galaxy_day1_permalink=https://www.threads.com/@mio.milkcat/post/') for x in evidence),evidence
          assert any(x.startswith('galaxy_day1_object_id=') and x.split('=',1)[1].strip() for x in evidence),evidence
          print('mio_approved_receipt=PASS')
          print('mio_approved_worker='+sch['worker_id'])
          for line in evidence:
              print(line)
          PY
      - name: Upload scheduler receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mio-approved-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/mio-approved-roundtrip.txt
          if-no-files-found: warn
          retention-days: 14
