name: Correct Gemini UIA Probe

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/correct-gemini-uia-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Probe Gemini send button
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          f=RealmFabricStore()
          tid='correct-gemini-uia-probe-20261002-1625'
          code="import sys,json\nsys.stdout.reconfigure(encoding='utf-8')\nfrom pywinauto import Desktop\nd=Desktop(backend='uia')\nspec=d.window(title_re='.*Gemini.*')\nif not spec.exists(timeout=3):\n    raise SystemExit('gemini_window_not_found')\nbtn=spec.child_window(title='傳送訊息', control_type='Button')\nok=bool(btn.exists(timeout=3))\nout={'window':spec.window_text(),'send_exists':ok}\nif ok:\n    out['send_enabled']=bool(btn.is_enabled())\nprint(json.dumps(out,ensure_ascii=False))"
          if f.get_receipt(tid) is None:
              f.queue_task('VO10005870',{
                  'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec',
                  'executable':r'C:\Users\alston.huang\AppData\Local\Programs\Python\Python312\python.exe',
                  'argv':['-c',code],
                  'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':8,
                  'cognition_ids_used':['demo://gemini-threads/20261002'],
              })
          for _ in range(30):
              r=f.get_receipt(tid)
              if r is not None:
                  print(json.dumps(r,ensure_ascii=False,separators=(',',':')))
                  break
              time.sleep(1)
          else:
              raise SystemExit('correct_uia_receipt_missing')
          PY
          REMOTE
