name: Oracle Employee Worker Kernel Cgroup Audit

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/oracle-employee-worker-kernel-cgroup-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Inspect kernel cgroup enforcement
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8             -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          UNIT=agentos-employee-worker-host.service
          cg="$(systemctl --user show "$UNIT" -p ControlGroup --value)"
          test -n "$cg"
          root="/sys/fs/cgroup$cg"
          echo "worker_control_group=$cg"
          echo "cpu_max=$(cat "$root/cpu.max" 2>/dev/null || echo missing)"
          echo "cpu_weight_kernel=$(cat "$root/cpu.weight" 2>/dev/null || echo missing)"
          echo "memory_max_kernel=$(cat "$root/memory.max" 2>/dev/null || echo missing)"
          echo "io_weight_kernel=$(cat "$root/io.weight" 2>/dev/null || echo missing)"
          echo "cpu_stat_before_begin"
          cat "$root/cpu.stat"
          echo "cpu_stat_before_end"
          usage0="$(awk '/^usage_usec /{print $2}' "$root/cpu.stat")"
          thr0="$(awk '/^throttled_usec /{print $2}' "$root/cpu.stat")"
          nr0="$(awk '/^nr_throttled /{print $2}' "$root/cpu.stat")"
          sleep 10
          usage1="$(awk '/^usage_usec /{print $2}' "$root/cpu.stat")"
          thr1="$(awk '/^throttled_usec /{print $2}' "$root/cpu.stat")"
          nr1="$(awk '/^nr_throttled /{print $2}' "$root/cpu.stat")"
          python3 - "$usage0" "$usage1" "$thr0" "$thr1" "$nr0" "$nr1" <<'PY'
          import sys
          u0,u1,t0,t1,n0,n1=map(int,sys.argv[1:])
          print(f"cgroup_cpu_percent_10s={(u1-u0)/100000:.2f}")
          print(f"cgroup_throttled_usec_delta={t1-t0}")
          print(f"cgroup_nr_throttled_delta={n1-n0}")
          PY
          echo "cpu_stat_after_begin"
          cat "$root/cpu.stat"
          echo "cpu_stat_after_end"
          echo "worker_kernel_cgroup_audit=PASS"
          REMOTE
