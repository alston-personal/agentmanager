name: Windows One-Click Installer CI

on:
  pull_request:
    paths:
      - 'install-agentos.ps1'
      - 'install-agentos.cmd'
      - 'scripts/install_thin_client_windows.ps1'
      - 'scripts/windows/thin_client_watchdog.ps1'
      - 'agentos_node/thin_client_transport.py'
      - 'tests/test_thin_client.py'
      - '.github/workflows/windows-one-click-installer-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'install-agentos.ps1'
      - 'install-agentos.cmd'
      - 'scripts/install_thin_client_windows.ps1'
      - '.github/workflows/windows-one-click-installer-ci.yml'

permissions:
  contents: read

jobs:
  parse-and-contract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('install-agentos.ps1','scripts/install_thin_client_windows.ps1')
          foreach($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("${file}: line={0} col={1} message={2} text={3}" -f $_.Extent.StartLineNumber,$_.Extent.StartColumnNumber,$_.Message,$_.Extent.Text) }
              throw "PowerShell parse failed: $file"
            }
            Write-Host "powershell_parse=PASS file=$file"
          }

      - name: Enforce one-click contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $one = Get-Content -Raw install-agentos.ps1
          $cmd = Get-Content -Raw install-agentos.cmd
          $low = Get-Content -Raw scripts/install_thin_client_windows.ps1

          foreach($needle in @(
            'Existing enrollment detected',
            'Enrollment preserved; no new token or approval code will be created.',
            'Register-ScheduledTask',
            'Start-ScheduledTask',
            'AGENTOS_ONE_CLICK_INSTALL=PASS',
            '& $launcher verify',
            '--timeout-seconds $ApprovalTimeoutSeconds',
            'Get-CimInstance Win32_Process',
            'taskkill.exe',
            'agentos_node\.client_cli',
            '-WindowStyle Hidden',
            'agentos-thin-client-hidden.ps1',
            "AgentOS Thin Client task still uses visible cmd.exe",
            "Refusing to start visible cmd.exe Thin Client task after repair",
            "AgentOS Thin Client Watchdog User",
            "AgentOS Thin Client User",
            "Single hidden long-running task (no periodic console spawn)",
            "Refusing to start Thin Client task unless its registered action is hidden PowerShell",
            "WINDOWS_SUPERVISOR_APPROVAL_REQUIRED",
            "per-user autorun fallback is intentionally disabled",
            "AgentOS Thin Client User",
            "AgentOS Thin Client Watchdog User",
            'versions\',
            '-StateRoot $state',
            'Install-Supervisor $python.Path $runtimeRoot',
            'Runtime install instance:',
            'current-runtime.txt',
            'accepted-runtimes',
            'accepted runtime remains authoritative',
            "AgentOS Thin Client Headless Switch",
            "Unregister-ScheduledTask"
          )) {
            if(-not $one.Contains($needle)) { throw "missing one-click contract marker: $needle" }
          }

          foreach($needle in @(
            'agentos_node/semantic_preview.py',
            'agentos_node/onboarding.py',
            'agentos_node/session_bridge.py',
            'agentos_node/agent_surfaces.py',
            'StateRoot',
            'Shared state:',
            'Policy: preserved existing',
            'if (-not (Test-Path -LiteralPath $policyPath))',
            'Windows Store App Execution Alias is not accepted'
          )) {
            if(-not $low.Contains($needle)) { throw "missing low-level installer marker: $needle" }
          }

          if(-not $cmd.Contains('install-agentos.ps1')) { throw 'double-click bootstrap is not wired to install-agentos.ps1' }
          $successBlock = ($cmd -split ':fail',2)[0]
          if($successBlock -match '(?im)^pause\s*$') { throw 'successful installer path must not pause or leave a cmd window open' }

          if($one -match 'Register-ScheduledTask -TaskName \\$watchdogTaskName'){ throw 'periodic watchdog task registration must not return' }
          if($one -match 'RepetitionInterval \\(New-TimeSpan -Minutes 1\\)'){ throw 'one-minute watchdog trigger must not return' }
          if($one -match 'Protected legacy watchdog ACL detected; using user-owned fallback'){ throw 'watchdog fallback must not return' }
          python -m unittest tests.test_thin_client
          Write-Host 'windows_one_click_contract=PASS'
