name: Deploy Theme + Zero Cost Production
on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths: ['.github/workflows/deploy-theme-zero-cost-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          H="${DEPLOY_HOST_SOURCE#*://}"; H="${H%%/*}"; H="${H%%:*}"; echo "DEPLOY_HOST=$H" >> "$GITHUB_ENV"
      - name: SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Deploy with code-only rollback
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" <<'REMOTE'
          set -euo pipefail
          PROD=/home/ubuntu/leopardcat-tarot
          WEB="$PROD/website"
          TARGET=fc1171f102f793532a34a696c56a9871a81b0475
          OLD=$(git -C "$PROD" rev-parse HEAD)
          echo old_commit=$OLD
          echo target_commit=$TARGET
          dirty=$(git -C "$PROD" status --porcelain | grep -v '^ M website/stats.json$' | grep -v '^ M website/dist/' | grep -v '^?? website/data/' || true)
          if [ -n "$dirty" ]; then echo 'unexpected production changes:' >&2; echo "$dirty" >&2; exit 40; fi
          cp "$WEB/stats.json" /tmp/lc-stats.pre-wheel.json
          mkdir -p "$WEB/data/custom_decks" "$WEB/data/custom_themes"
          git -C "$PROD" checkout -- website/dist 2>/dev/null || true
          stop_server() {
            for p in $(pgrep -f 'python3 fortune_server.py' || true); do
              c=$(readlink -f /proc/$p/cwd 2>/dev/null || true); [ "$c" = "$WEB" ] && kill "$p" >/dev/null 2>&1 || true
            done
            sleep 1
          }
          start_server() {
            cd "$WEB"; nohup /usr/bin/python3 fortune_server.py >/tmp/fortune_server.log 2>&1 &
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8088/api/v1/ai-policy >/dev/null 2>&1 && return 0; sleep 1; done
            tail -80 /tmp/fortune_server.log >&2 || true; return 1
          }
          rollback() {
            echo deployment_failed_rolling_back >&2
            stop_server
            git -C "$PROD" reset --hard "$OLD"
            cp /tmp/lc-stats.pre-wheel.json "$WEB/stats.json"
            cd "$WEB"; npm run build; start_server
            echo rollback_commit=$OLD >&2
          }
          trap 'r=$?; if [ $r -ne 0 ]; then rollback || true; fi; exit $r' EXIT
          git -c credential.helper= -C "$PROD" fetch https://github.com/alston-personal/leopardcat-tarot.git main
          F=$(git -C "$PROD" rev-parse FETCH_HEAD); [ "$F" = "$TARGET" ] || { echo unexpected_main=$F >&2; exit 41; }
          git -C "$PROD" merge --ff-only FETCH_HEAD
          cp /tmp/lc-stats.pre-wheel.json "$WEB/stats.json"
          mkdir -p "$WEB/data/custom_decks" "$WEB/data/custom_themes"
          cd "$WEB"
          npm run build
          python3 -m py_compile fortune_server.py divination/*.py
          node --check main.js
          grep -q 'panelCanConsume' main.js
          stop_server; start_server
          JS=$(find dist/assets -name 'index-*.js' | head -1)
          test -s "$JS"
          curl -fsS https://leopardcat-tarot.milkcat.org/assets/$(basename "$JS") >/dev/null
          echo production_card_wheel_priority=passed
          echo deployed_commit=$(git -C "$PROD" rev-parse HEAD)
          trap - EXIT
          REMOTE