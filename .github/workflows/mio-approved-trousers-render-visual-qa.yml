name: Mio Approved Trousers Render Visual QA
on:
  push:
    branches: [feat/mio-product-isolation-contract-20261008]
    paths:
      - '.github/workflows/mio-approved-trousers-render-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Retrieve and fingerprint the actual rendered image from Oracle
        run: |
          set -euo pipefail
          scp -q -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -P "${DEPLOY_SSH_PORT:-22}" \
            "${DEPLOY_USER}@${ORACLE_HOST}:/home/ubuntu/agent-data/projects/dressup-simulator/render_assets/sunlake-milkcat-ai-001-tryon-2026-10-13T08-49-32-311Z-9c81ad47.webp" \
            "$RUNNER_TEMP/mio-approved-trousers-render.webp"
          test "$(wc -c < "$RUNNER_TEMP/mio-approved-trousers-render.webp")" -gt 10000
          sha256sum "$RUNNER_TEMP/mio-approved-trousers-render.webp"
          file "$RUNNER_TEMP/mio-approved-trousers-render.webp"
          echo 'mio_render_visual_artifact_retrieved_for_independent_review=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: mio-qwen-trousers-unverified-render
          path: ${{ runner.temp }}/mio-approved-trousers-render.webp
          if-no-files-found: error
          retention-days: 14
