name: Oracle Gemini CLI ONE Live Acceptance

on:
  push:
    branches:
      - core/integration
    paths:
      - '.github/workflows/oracle-gemini-cli-one-live-acceptance.yml'
      - 'agentos_node/gemini_cli_install_provider.py'
      - 'agentos_node/gemini_cli_one_hook.py'
      - 'scripts/install_gemini_cli_one.py'
      - 'scripts/install_oracle_gemini_cli_one.sh'
      - 'agent_core/executor_job_contract.py'
      - 'agentos_node/executor_job_action_relay.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos
    steps:
      - uses: actions/checkout@v4

      - name: Mint GitHub OIDC scheduler credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Install Gemini CLI ONE through bounded executor job
        shell: bash
        run: |
          set -euo pipefail
          AGENTOS_DISPATCH_WAIT_SECONDS=180             bash scripts/agentos_dispatch.sh               agentos.executor job.submit "$GITHUB_SHA"               job_type=gemini.cli.install               | tee "$RUNNER_TEMP/gemini-submit.txt"

          job_id="$(python3 - "$RUNNER_TEMP/gemini-submit.txt" <<'PY'
          import json,sys
          docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
          assert docs
          receipt=docs[-1].get('receipt') or {}
          job=receipt.get('executor_job') or {}
          assert receipt.get('ok') is True, receipt
          value=str(job.get('job_id') or '')
          assert value.startswith('action-'), job
          print(value)
          PY
          )"

          terminal=0
          for i in $(seq 1 120); do
            out="$RUNNER_TEMP/gemini-inspect-$i.txt"
            AGENTOS_DISPATCH_WAIT_SECONDS=90               bash scripts/agentos_dispatch.sh                 agentos.executor job.inspect "$GITHUB_SHA"                 job_id="$job_id" > "$out"
            if python3 - "$out" <<'PY'
          import json,sys
          docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
          if not docs:
              raise SystemExit(1)
          receipt=docs[-1].get('receipt') or {}
          if receipt.get('executor_job_state')!='completed':
              raise SystemExit(1)
          job=receipt.get('executor_job_receipt')
          if not isinstance(job,dict):
              raise SystemExit(2)
          classification=str(job.get('classification') or 'none')
          print('gemini_cli_live_classification='+classification)
          print('gemini_cli_install_receipt_ok='+str(job.get('install_receipt_ok')))
          if classification!='GEMINI_CLI_ONE_INSTALL_PASS' or job.get('install_receipt_ok') is not True:
              raise SystemExit(2)
          assert job.get('credential_exposed') is False, job
          raise SystemExit(0)
          PY
            then
              terminal=1
              break
            else
              rc=$?
              if [ "$rc" = 2 ]; then
                echo 'gemini_cli_one_live_acceptance=TERMINAL_FAIL' >&2
                cat "$out" >&2
                exit 2
              fi
            fi
            sleep 3
          done
          test "$terminal" = 1
          echo 'gemini_cli_one_live_acceptance=PASS'
