name: Start Demo And Prompt Gemini

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/start-demo-and-prompt-gemini.yml'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Start recording and prompt Gemini
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          f=RealmFabricStore()
          steps=[
            ('demo-record-start-20261006-1110','desktop.demo.start',{'label':'AgentOS Gemini to Threads Demo','stage':'Prompting Gemini','max_seconds':300}),
            ('demo-gemini-foreground-20261006-1110','shell.exec',{'executable':r'C:\Users\alston.huang\AppData\Local\Programs\Python\Python312\python.exe','argv':['-c',"import ctypes,time; u=ctypes.windll.user32; h=1117002; u.ShowWindow(h,9); u.BringWindowToTop(h); u.SetForegroundWindow(h); time.sleep(1); print(u.GetForegroundWindow())"],'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':10}),
            ('demo-gemini-clipboard-20261006-1110','shell.exec',{'executable':'powershell','argv':['-NoProfile','-NonInteractive','-Command',"$ErrorActionPreference='Stop'; Add-Type -AssemblyName System.Windows.Forms; [System.Windows.Forms.Clipboard]::SetText(\"Create a fresh cinematic square social-media image: Taipei at night just after rain, neon reflections on wet pavement, a small silver-shaded cat near a metro exit, realistic photography, moody blue and amber lighting, no words, no logos. Generate the image now.\"); Write-Output 'clipboard_prompt_ready'"],'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':10}),
            ('demo-gemini-click-20261006-1110','desktop.mouse',{'operation':'click','x':960,'y':610,'button':'left'}),
            ('demo-gemini-paste-20261006-1110','desktop.keyboard',{'operation':'type','text':'^v'}),
            ('demo-gemini-send-20261006-1110','desktop.keyboard',{'operation':'type','text':'~'}),
            ('demo-record-stage-gemini-20261006-1110','desktop.demo.stage',{'stage':'Gemini generating fresh image'}),
          ]
          for tid,action,payload in steps:
              if f.get_receipt(tid) is None:
                  task={'schema':'agentos.node-task/v0.1','task_id':tid,'action':action,'cognition_ids_used':['demo://gemini-threads/20261006']}; task.update(payload); f.queue_task('VO10005870',task)
              receipt=None
              for _ in range(45):
                  receipt=f.get_receipt(tid)
                  if receipt is not None: break
                  time.sleep(1)
              print(tid+'='+json.dumps(receipt,ensure_ascii=False,separators=(',',':')))
              if receipt is None or receipt.get('ok') is not True: raise SystemExit('step_failed:'+tid)
          PY
          REMOTE
