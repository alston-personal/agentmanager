name: VOPC5750 Semantic Preview Rollout

on:
  push:
    branches: [main]
    paths:
      - '.agentos/commands/vopc5750-semantic-preview-rollout.json'

permissions:
  contents: read

concurrency:
  group: vopc5750-semantic-preview-rollout
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Roll out through ONE and verify read-only preview
        run: python3 scripts/vopc5750_semantic_preview_rollout.py
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vopc5750-semantic-preview-rollout
          path: .agentos/evidence/vopc5750-semantic-preview-rollout-current.json
          if-no-files-found: warn
          retention-days: 14
