name: Oracle Deploy Invoice Intake Service

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'services/invoice_intake/**'
      - 'capabilities/financial_intake/**'
      - 'scripts/deploy_invoice_intake_nginx.py'
      - '.github/workflows/oracle-deploy-invoice-intake-service.yml'
  push:
    branches: [main]
    paths:
      - 'services/invoice_intake/**'
      - 'capabilities/financial_intake/**'
      - 'scripts/deploy_invoice_intake_nginx.py'
      - '.github/workflows/oracle-deploy-invoice-intake-service.yml'

permissions:
  contents: read

concurrency:
  group: invoice-intake-service-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate invoice service
        run: |
          python3 -m venv /tmp/invoice-intake-validate
          /tmp/invoice-intake-validate/bin/pip install --disable-pip-version-check -q -r services/invoice_intake/requirements.txt
          /tmp/invoice-intake-validate/bin/python -m py_compile \
            services/invoice_intake/app.py \
            services/invoice_intake/invoice_core.py \
            services/invoice_intake/template_ocr.py \
            capabilities/financial_intake/adapter.py \
            capabilities/financial_intake/winton.py
          PYTHONPATH=. /tmp/invoice-intake-validate/bin/python - <<'PY'
          import json
          from pathlib import Path
          from services.invoice_intake.template_ocr import extract_template_invoice
          from capabilities.financial_intake import WintonExcelAdapter, canonical_from_invoice_payload

          manifest=json.loads(Path('benchmarks/invoice_handwriting/public_cases.json').read_text())
          checked=correct=matched=0
          for case in manifest['cases']:
              p=Path(case['fixture_path'])
              out=extract_template_invoice(p.read_bytes())
              matched += int(bool(out.get('matched')))
              fields=out.get('fields') or {}
              for key,expected in case['expected'].items():
                  if key not in {'invoice_number','invoice_date','seller_tax_id','amount_before_tax','tax_amount','total_amount'}:
                      continue
                  checked += 1
                  got=fields.get(key)
                  ok=str(got).replace(' ','').upper()==str(expected).replace(' ','').upper()
                  correct += int(ok)
                  print(f'prod_fixture={case["id"]} field={key} ok={ok} got={got} expected={expected}')
          recall=correct/checked if checked else 0
          print(f'prod_template_match={matched}/{len(manifest["cases"])}')
          print(f'prod_field_recall={correct}/{checked}={recall:.4f}')
          assert matched == len(manifest['cases'])
          assert recall >= 0.90

          doc=canonical_from_invoice_payload({
              "invoice_id":"ci-export",
              "status":"accepted",
              "fields":{
                  "invoice_number":"AB12345678",
                  "invoice_date":"2026-09-28",
                  "seller_tax_id":"12345678",
                  "vendor_name":"測試商號",
                  "amount_before_tax":1000,
                  "tax_amount":50,
                  "total_amount":1050,
              },
              "confidence":{"invoice_number":0.99,"total_amount":0.99},
          })
          exported=WintonExcelAdapter().export(doc)
          assert exported.adapter_id == "accounting.adapter.winton"
          assert b"AB12345678" in exported.payload
          print("invoice_winton_adapter_contract=PASS")
          PY
          PYTHONPATH=. /tmp/invoice-intake-validate/bin/python -m unittest \
            tests.test_invoice_intake_db \
            tests.test_invoice_real_user_regression \
            tests.test_invoice_vision
          echo 'invoice_intake_db_boundary=PASS'
          echo 'invoice_real_user_regression=PASS'
          echo 'invoice_intake_python_syntax=PASS'

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 15
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      INVOICE_PORT: '18767'
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Deploy service
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"

          tar -czf - \
            services/invoice_intake \
            capabilities/__init__.py \
            capabilities/financial_intake | \
            ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'set -euo pipefail; BASE=/home/ubuntu/invoice-intake-service; rm -rf "$BASE/app-new"; mkdir -p "$BASE/app-new"; tar -C "$BASE/app-new" -xzf -'

          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE=/home/ubuntu/invoice-intake-service
          DATA=/home/ubuntu/agent-data/invoice-intake
          RESET_MARKER=/home/ubuntu/agent-data/invoice-intake-production-reset-v1.done
          PORT=18767
          mkdir -p "$BASE" /home/ubuntu/.config/systemd/user

          if [ ! -f "$RESET_MARKER" ]; then
            systemctl --user stop invoice-intake.service 2>/dev/null || true
            if [ -d "$DATA" ]; then
              stamp="$(date -u +%Y%m%dT%H%M%SZ)"
              backup="/home/ubuntu/agent-data/releases/invoice-intake-reset/$stamp"
              mkdir -p "$(dirname "$backup")"
              mv "$DATA" "$backup"
              echo "invoice_intake_legacy_data_backup=$backup"
            fi
            mkdir -p "$DATA"
            {
              echo "reset_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "reason=separate production data from development/test scans"
            } > "$RESET_MARKER"
            echo "invoice_intake_production_data_reset=PASS"
          else
            mkdir -p "$DATA"
            echo "invoice_intake_production_data_reset=SKIP already_done"
          fi

          install_packages() {
            mapfile -t BAD_APT < <(grep -RIl 'antigravity-auto-updater-dev' /etc/apt/sources.list.d 2>/dev/null || true)
            for f in "${BAD_APT[@]}"; do
              sudo -n mv "$f" "$f.invoice-intake-disabled"
            done
            restore_apt() {
              for f in "${BAD_APT[@]}"; do
                sudo -n mv "$f.invoice-intake-disabled" "$f" 2>/dev/null || true
              done
            }
            trap restore_apt RETURN
            sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update -qq
            sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-tra python3-venv
            restore_apt
            trap - RETURN
          }

          if ! command -v tesseract >/dev/null 2>&1 || \
             ! tesseract --list-langs 2>/dev/null | grep -Fxq 'chi_tra'; then
            install_packages
          fi

          if ! python3 -m venv "$BASE/.venv" 2>/dev/null; then
            install_packages
            python3 -m venv "$BASE/.venv"
          fi

          "$BASE/.venv/bin/pip" install --disable-pip-version-check -q -r "$BASE/app-new/services/invoice_intake/requirements.txt"
          rm -rf "$BASE/app"
          mv "$BASE/app-new" "$BASE/app"

          cat > /home/ubuntu/.config/systemd/user/invoice-intake.service <<'UNIT'
          [Unit]
          Description=Milkcat Invoice Intake Service
          After=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/home/ubuntu/invoice-intake-service/app
          Environment=PYTHONPATH=/home/ubuntu/invoice-intake-service/app
          Environment=INVOICE_DATA_ROOT=/home/ubuntu/agent-data/invoice-intake
          Environment=INVOICE_DATA_SCOPE=production
          EnvironmentFile=-/home/ubuntu/invoice-intake-service/vision.env
          Environment=DASHBOARD_SESSION_URL=http://127.0.0.1:3000/dashboard/api/auth/session
          ExecStart=/home/ubuntu/invoice-intake-service/.venv/bin/uvicorn services.invoice_intake.app:app --host 127.0.0.1 --port 18767
          Restart=on-failure
          RestartSec=2

          [Install]
          WantedBy=default.target
          UNIT

          systemctl --user daemon-reload
          systemctl --user enable --now invoice-intake.service
          systemctl --user restart invoice-intake.service

          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:$PORT/healthz" > /tmp/invoice-intake-health.json 2>/dev/null; then
              if python3 - <<'PY'
          import json
          x=json.load(open('/tmp/invoice-intake-health.json'))
          raise SystemExit(0 if x.get('ok') is True and x.get('service') == 'invoice-intake' else 1)
          PY
              then
                break
              fi
            fi
            sleep 1
          done

          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/invoice-intake-health.json'))
          assert x.get('ok') is True, x
          assert x.get('service') == 'invoice-intake', x
          print('invoice_intake_service_identity=PASS')
          PY
          tesseract --list-langs | grep -Fxq 'chi_tra'
          echo 'invoice_intake_service=PASS'
          REMOTE

      - name: Deploy nginx API boundary
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'sudo -n python3 -' < scripts/deploy_invoice_intake_nginx.py

      - name: Public acceptance
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 1 \
            https://studio.milkcat.org/api/invoice-intake/v1/status \
            > /tmp/invoice-status.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/invoice-status.json'))
          assert x['ok'] is True, x
          assert x['service'] == 'invoice-intake', x
          assert x['continuous_scan'] is True, x
          assert x['immutable_originals'] is True, x
          assert x['data_scope'] == 'production', x
          assert x['batch_tracking'] is True, x
          assert x['source_tracking'] is True, x
          print('invoice_intake_public_status=PASS')
          PY

          code=$(curl -sS -o /tmp/invoice-unauth.json -w '%{http_code}' \
            -X POST https://studio.milkcat.org/api/invoice-intake/v1/ingest || true)
          test "$code" = "422" -o "$code" = "401"
          echo "invoice_intake_unauthenticated_write_block=PASS code=$code"
