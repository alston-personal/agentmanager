name: Oracle Executor Live Generation Diagnostic
# rerun-gemini-install-state-2

on:
  push:
    branches:
      - diag/oracle-executor-live-generation
    paths:
      - '.github/workflows/oracle-executor-live-generation-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bounded executor runtime generations
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_user=$(id -un)"
          echo '=== IMMUTABLE GENERATION POINTERS ==='
          echo "action_runtime_head=$(git -C /home/ubuntu/.local/share/agentos/action-runtime rev-parse HEAD 2>/dev/null || true)"
          echo "bootstrap_current=$(readlink -f /home/ubuntu/.local/share/agentos/bootstrap-scheduler/current 2>/dev/null || true)"
          echo 'bootstrap_marker:'
          cat /home/ubuntu/agent-data/runtime/bootstrap-scheduler/enabled 2>/dev/null || true
          echo '=== LATEST BOUNDED HEALTH RECEIPTS ==='
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/home/ubuntu/agent-data/runtime/action-relay/receipts')
          rows=[]
          for p in sorted(root.glob('action-*.json'), key=lambda x:x.stat().st_mtime, reverse=True):
              try:
                  d=json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if d.get('job_type')!='engineering.executor.health':
                  continue
              safe={k:d.get(k) for k in (
                  'capsule_id','job_type','classification','selected_provider',
                  'claude_state','claude_ready_count','claude_health_classification',
                  'agy_state','agy_ready_count','agy_health_classification',
                  'runtime_source_commit','executor_available','routable','authorized',
              ) if k in d}
              rows.append(safe)
              if len(rows)>=5:
                  break
          print(json.dumps(rows,sort_keys=True,separators=(',',':')))
          PY
          echo '=== LAST RUNTIME REPAIR FAILURE (SANITIZED MARKERS) ==='
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('/tmp/agentos-bootstrap-control/receipts')
          rows=[]
          for p in sorted(root.glob('agentos.transport.repair-*.json'), key=lambda x:x.stat().st_mtime, reverse=True):
              try:
                  d=json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if d.get('ok') is True:
                  continue
              out={'request_id':d.get('request_id'),'source_commit':d.get('source_commit'),'ok':False}
              marks=[]
              for step in d.get('steps') or []:
                  for line in (str(step.get('stdout') or '')+'\n'+str(step.get('stderr') or '')).splitlines():
                      if re.search(r'ERROR:|fatal:|action_relay_|legacy_runtime|worktree|antigravity_repair_',line,re.I):
                          marks.append(line[:500])
              out['markers']=marks[-30:]
              rows.append(out)
              break
          print(json.dumps(rows,sort_keys=True,separators=(',',':')))
          PY

      - name: Inspect bounded Gemini install spool state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time
          from pathlib import Path
          root=Path('/home/ubuntu/agent-data/runtime/action-relay')
          rows=[]
          for state in ('inbox','processing','receipts','quarantine'):
              d=root/state
              if not d.is_dir():
                  continue
              for p in d.glob('action-*.json'):
                  try:
                      x=json.loads(p.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  if x.get('job_type')!='gemini.cli.install' and (x.get('params') or {}).get('request',{}).get('job_type')!='gemini.cli.install':
                      continue
                  rows.append({
                      'state':state,
                      'capsule_id':x.get('capsule_id') or p.stem,
                      'age_seconds':max(0,int(time.time()-p.stat().st_mtime)),
                      'classification':x.get('classification'),
                      'successful':x.get('successful'),
                  })
          print(json.dumps(sorted(rows,key=lambda r:r['age_seconds'])[:10],sort_keys=True,separators=(',',':')))
          PY

      - name: Inspect Node and npm prerequisite versions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "node_version=$(node --version 2>/dev/null || echo MISSING)"
          echo "npm_version=$(npm --version 2>/dev/null || echo MISSING)"

      - name: Inspect bounded Action Relay spool state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time
          from pathlib import Path
          root=Path('/home/ubuntu/agent-data/runtime/action-relay')
          now=time.time()
          for name in ('inbox','processing','receipts','quarantine'):
              p=root/name
              rows=list(p.glob('action-*.json')) if p.is_dir() else []
              ages=[max(0,now+x.stat().st_mtime) for x in []]
              oldest=max((max(0,now-x.stat().st_mtime) for x in rows), default=0)
              print(f'action_relay_{name}_count={len(rows)}')
              print(f'action_relay_{name}_oldest_seconds={int(oldest)}')
          PY

      - name: Classify latest Gemini CLI health failure without raw output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('/home/ubuntu/agent-data/runtime/action-relay/receipts')
          rows=[]
          for p in sorted(root.glob('action-*.json'), key=lambda x:x.stat().st_mtime, reverse=True):
              try:
                  d=json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if d.get('job_type')!='gemini.cli.health':
                  continue
              text=((d.get('stdout') or '')+'\n'+(d.get('stderr') or '')+'\n'+(d.get('error') or '')).casefold()
              cats=[]
              patterns={
                  'AUTH':r'login|sign in|unauthorized|authentication|required auth|not authenticated',
                  'HOOK':r'hook|sessionstart|session start',
                  'MCP':r'\bmcp\b|agentos-one',
                  'CONFIG':r'config|settings\.json|fatalconfig|invalid settings',
                  'INPUT':r'unknown option|unknown argument|invalid argument|usage:|fatalinput',
                  'APPROVAL':r'approval|plan mode',
                  'MODEL':r'model|gemini-[0-9]|no model',
                  'RATE':r'rate limit|too many requests|quota|resource exhausted',
                  'NETWORK':r'enotfound|eai_again|network|connection|socket|timeout',
                  'PROJECT':r'project id|projectid|google cloud project',
                  'SANDBOX':r'sandbox|docker|podman|seatbelt',
              }
              for name,pat in patterns.items():
                  if re.search(pat,text):
                      cats.append(name)
              rows.append({
                  'capsule_id':d.get('capsule_id') or p.stem,
                  'returncode':d.get('executor_returncode') if 'executor_returncode' in d else d.get('returncode'),
                  'classification':d.get('classification'),
                  'categories':cats,
                  'stdout_nonempty':bool(d.get('stdout')),
                  'stderr_nonempty':bool(d.get('stderr')),
                  'error_nonempty':bool(d.get('error')),
              })
              break
          print(json.dumps(rows,sort_keys=True,separators=(',',':')))
          PY
