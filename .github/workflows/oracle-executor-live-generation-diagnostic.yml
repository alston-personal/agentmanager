name: Oracle Executor Live Generation Diagnostic

on:
  push:
    branches:
      - diag/oracle-executor-live-generation
    paths:
      - '.github/workflows/oracle-executor-live-generation-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bounded executor runtime generations
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_user=$(id -un)"
          echo '=== ACTION RELAY SERVICE ==='
          systemctl --user show agentos-action-relay.service             -p ActiveState -p SubState -p MainPID -p WorkingDirectory --no-pager
          pid="$(systemctl --user show agentos-action-relay.service -p MainPID --value)"
          if [ -n "$pid" ] && [ "$pid" != 0 ]; then
            echo "action_relay_pid=$pid"
            echo "action_relay_cwd=$(readlink -f /proc/$pid/cwd)"
            tr '\0' '\n' < "/proc/$pid/environ"               | grep -E '^AGENTOS_ACTION_RUNTIME_SOURCE_(REF|COMMIT)=' || true
          fi
          echo "action_runtime_head=$(git -C /home/ubuntu/.local/share/agentos/action-runtime rev-parse HEAD 2>/dev/null || true)"
          echo '=== BOOTSTRAP BUILD WORKER ==='
          systemctl --user show agentos-bootstrap-build.service             -p ActiveState -p SubState -p MainPID -p WorkingDirectory --no-pager
          bpid="$(systemctl --user show agentos-bootstrap-build.service -p MainPID --value)"
          if [ -n "$bpid" ] && [ "$bpid" != 0 ]; then
            echo "bootstrap_build_pid=$bpid"
            echo "bootstrap_build_cwd=$(readlink -f /proc/$bpid/cwd)"
          fi
          echo "bootstrap_current=$(readlink -f /home/ubuntu/.local/share/agentos/bootstrap-scheduler/current 2>/dev/null || true)"
          echo '=== LATEST BOUNDED HEALTH RECEIPTS ==='
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/home/ubuntu/agent-data/runtime/action-relay/receipts')
          rows=[]
          for p in sorted(root.glob('action-*.json'), key=lambda x:x.stat().st_mtime, reverse=True):
              try:
                  d=json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if d.get('job_type')!='engineering.executor.health':
                  continue
              safe={k:d.get(k) for k in (
                  'capsule_id','job_type','classification','selected_provider',
                  'claude_state','claude_ready_count','claude_health_classification',
                  'agy_state','agy_ready_count','agy_health_classification',
                  'runtime_source_commit','executor_available','routable','authorized',
              ) if k in d}
              rows.append(safe)
              if len(rows)>=3:
                  break
          print(json.dumps(rows,sort_keys=True,separators=(',',':')))
          PY
