name: Executor Health Reconcile Schedule Carrier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/executor-health-reconcile-schedule.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  reconcile:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 889 &&
        github.actor == 'alstonhuang' &&
        github.event.comment.body == '/agentos reconcile-executor-health'
      )
    concurrency:
      group: executor-health-reconcile
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout canonical Core generation
        uses: actions/checkout@v4
        with:
          ref: core/integration

      - name: Mint GitHub OIDC scheduler credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Reconcile executor health through canonical Runner Window
        shell: bash
        env:
          AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos
        run: |
          set -euo pipefail
          AGENTOS_DISPATCH_WAIT_SECONDS=180             bash scripts/agentos_dispatch.sh               agentos.executor job.submit "$GITHUB_SHA"               job_type=engineering.executor.health               | tee "$RUNNER_TEMP/health-submit.txt"

          job_id="$(python3 - "$RUNNER_TEMP/health-submit.txt" <<'PY'
          import json,sys
          docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
          assert docs
          receipt=docs[-1].get('receipt') or {}
          job=receipt.get('executor_job') or {}
          assert receipt.get('ok') is True, receipt
          value=str(job.get('job_id') or '')
          assert value.startswith('action-'), job
          print(value)
          PY
          )"

          terminal=0
          for i in $(seq 1 60); do
            out="$RUNNER_TEMP/health-inspect-$i.txt"
            AGENTOS_DISPATCH_WAIT_SECONDS=90               bash scripts/agentos_dispatch.sh                 agentos.executor job.inspect "$GITHUB_SHA"                 job_id="$job_id" > "$out"
            cat "$out" >> "$RUNNER_TEMP/health-inspect.txt"
            if python3 - "$out" <<'PY'
          import json,sys
          docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
          if not docs:
              raise SystemExit(1)
          receipt=docs[-1].get('receipt') or {}
          if receipt.get('executor_job_state')!='completed':
              raise SystemExit(1)
          job=receipt.get('executor_job_receipt')
          if not isinstance(job,dict):
              raise SystemExit(1)
          assert job.get('classification') in {
              'ENGINEERING_EXECUTOR_HEALTH_READY',
              'ENGINEERING_EXECUTOR_NO_HEALTHY_PROVIDER',
          }, job
          print('executor_health_reconcile=PASS')
          print('selected_provider='+str(job.get('selected_provider') or 'none'))
          print('claude_state='+str(job.get('claude_state') or 'none'))
          print('claude_ready_count='+str(job.get('claude_ready_count') if isinstance(job.get('claude_ready_count'),int) else 'none'))
          print('claude_health_classification='+str(job.get('claude_health_classification') or 'none'))
          print('agy_state='+str(job.get('agy_state') or 'none'))
          print('agy_ready_count='+str(job.get('agy_ready_count') if isinstance(job.get('agy_ready_count'),int) else 'none'))
          print('agy_health_classification='+str(job.get('agy_health_classification') or 'none'))
          raise SystemExit(0)
          PY
            then
              terminal=1
              break
            fi
            sleep 3
          done
          test "$terminal" = 1
