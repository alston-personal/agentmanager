name: Live First Node Readiness

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: live-first-node-readiness
  cancel-in-progress: false

jobs:
  live-boundary:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Verify live ONE generation
        shell: bash
        run: |
          set -euo pipefail
          health=$(curl -fsS --max-time 3 http://127.0.0.1:8780/v1/health)
          echo "ONE_HEALTH=$health"
          bootstrap=$(curl -sS -o /tmp/agentos-bootstrap-body -w '%{http_code}' --max-time 3 'http://127.0.0.1:8780/v1/bootstrap?node_id=vopc5750')
          benchmark=$(curl -sS -o /tmp/agentos-benchmark-body -w '%{http_code}' --max-time 3 -X POST -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:8780/v1/benchmark)
          test "$bootstrap" = 401
          test "$benchmark" = 401
          echo 'one_bootstrap_route=PASS'
          echo 'one_benchmark_route=PASS'

      - name: Inspect first-node registry freshness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          from agent_core.node_registry import NodeRegistry
          node_map=NodeRegistry().node_map()
          node=next((item for item in node_map.get('nodes',[]) if item.get('node_id')=='vopc5750'),None)
          print(json.dumps({'node_map_summary':{'online_node_count':node_map.get('online_node_count')},'vopc5750':node}, indent=2, ensure_ascii=False))
          if not node:
              raise SystemExit('vopc5750 missing from registry')
          print('vopc_reported_status=' + str(node.get('reported_status') or node.get('status')))
          print('vopc_effective_status=' + str(node.get('effective_status') or node.get('status')))
          print('vopc_last_heartbeat=' + str(node.get('last_heartbeat_at') or node.get('last_heartbeat')))
          effective=str(node.get('effective_status') or node.get('status') or '')
          if effective != 'online':
              raise SystemExit('vopc5750 is not freshly online')
          PY

      - name: Queue bounded vopc5750 execution probe
        shell: bash
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time
          from pathlib import Path
          from agent_core.realm_fabric import RealmFabricStore
          node_id='vopc5750'
          task_id='node-v01-live-'+str(int(time.time()))
          task={
            'schema':'agentos.node-task/v0.1',
            'task_id':task_id,
            'action':'shell.exec',
            'executable':'python',
            'argv':['-c','import json,platform,socket; print(json.dumps({"hostname":socket.gethostname(),"platform":platform.system(),"python":platform.python_version()}))'],
            'cwd':r'C:\Users\alston.huang\AgentOS',
            'timeout_seconds':15,
            'cognition_ids_used':[],
          }
          store=RealmFabricStore()
          store.queue_task(node_id,task)
          Path('/tmp/node-v01-task-id').write_text(task_id,encoding='utf-8')
          print('node_v01_task_id='+task_id)
          PY

      - name: Wait for governed Windows receipt
        shell: bash
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          TASK_ID=$(cat /tmp/node-v01-task-id)
          for i in $(seq 1 45); do
            if python3 - "$TASK_ID" <<'PY'
          import json,sys
          from agent_core.realm_fabric import RealmFabricStore
          r=RealmFabricStore().get_receipt(sys.argv[1])
          if not r:
              raise SystemExit(1)
          print(json.dumps(r,ensure_ascii=False,indent=2))
          if r.get('ok') is not True or int(r.get('returncode') or 0)!=0:
              raise SystemExit(2)
          out=str(r.get('stdout') or '')
          if 'VOPC5750' not in out.upper() or 'WINDOWS' not in out.upper():
              raise SystemExit(3)
          print('node_v01_governed_receipt=PASS')
          PY
            then
              exit 0
            fi
            sleep 2
          done
          echo 'node_v01_governed_receipt=TIMEOUT' >&2
          exit 1

  oracle-exec-install:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Oracle execution node through governed bootstrap
        shell: bash
        run: |
          set -euo pipefail
          LIVE=/home/ubuntu/agentmanager
          ROOT=/tmp/agentos-bootstrap-control
          REQUESTS="$ROOT/requests"
          RECEIPTS="$ROOT/receipts"
          REQUEST_ID="oracle-exec-install-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REQUEST="$REQUESTS/$REQUEST_ID.request.json"
          RECEIPT="$RECEIPTS/$REQUEST_ID.json"

          cat agentos_node/bootstrap_control.py > "$LIVE/agentos_node/bootstrap_control.py"
          python3 -m py_compile "$LIVE/agentos_node/bootstrap_control.py"

          for i in $(seq 1 120); do
            [ -d "$REQUESTS" ] && [ -d "$RECEIPTS" ] && break
            sleep 1
          done
          test -d "$REQUESTS" -a -d "$RECEIPTS"

          python3 - "$REQUEST" "$REQUEST_ID" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          from datetime import datetime,timezone
          path,request_id,sha=sys.argv[1],sys.argv[2],sys.argv[3]
          payload={
            'schema':'agentos.bootstrap-request/v1',
            'request_id':request_id,
            'action':'agentos.oracle_exec.install',
            'created_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'params':{'source_commit':sha},
            'authority':{'source':'github-actions','target_user':'ubuntu','arbitrary_shell':False},
          }
          tmp=path+'.tmp'
          open(tmp,'w',encoding='utf-8').write(json.dumps(payload,sort_keys=True,indent=2)+'\n')
          os.chmod(tmp,0o644); os.replace(tmp,path); os.chmod(path,0o644)
          PY

          for i in $(seq 1 420); do [ -f "$RECEIPT" ] && break; sleep 1; done
          test -f "$RECEIPT" || { echo "oracle_exec_receipt=TIMEOUT"; exit 3; }

          python3 - "$RECEIPT" "$GITHUB_SHA" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); expected=sys.argv[2]
          assert r.get('schema')=='agentos.bootstrap-receipt/v1',r
          assert r.get('action')=='agentos.oracle_exec.install',r
          assert r.get('executor_user')=='ubuntu',r
          assert r.get('source_commit')==expected,r
          text='\n'.join(str(s.get('stdout') or '')+'\n'+str(s.get('stderr') or '') for s in r.get('steps',[]))
          assert r.get('ok') is True,text[-12000:]
          assert 'agentos_oracle_exec_install=PASS' in text,text[-12000:]
          assert 'agentos_node_id=oracle-exec' in text,text[-12000:]
          print('oracle_exec_install=PASS')
          PY

      - name: Verify Oracle execution node in Realm registry
        shell: bash
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if python3 - <<'PY'
          from agent_core.node_registry import NodeRegistry
          node=next((n for n in NodeRegistry().node_map().get('nodes',[]) if n.get('node_id')=='oracle-exec'),None)
          if not node:
              raise SystemExit(1)
          effective=str(node.get('effective_status') or node.get('status') or '')
          caps=set(node.get('capabilities') or [])
          if effective!='online':
              raise SystemExit(2)
          if not {'node.ssh.inspect','node.ssh.recover'}.issubset(caps):
              raise SystemExit(3)
          print('oracle_exec_registry=PASS')
          print('oracle_exec_status='+effective)
          print('oracle_exec_ssh_caps=PASS')
          PY
            then
              exit 0
            fi
            sleep 2
          done
          exit 1
