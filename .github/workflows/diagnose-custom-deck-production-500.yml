name: Diagnose Custom Deck Production 500

on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths:
      - ".github/workflows/diagnose-custom-deck-production-500.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Resolve Oracle target
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect failed server log and runtime state
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -u
          echo '=== CURRENT COMMIT ==='
          git -C /home/ubuntu/leopardcat-tarot rev-parse HEAD || true
          echo '=== FAILED SERVER LOG ==='
          tail -160 /tmp/fortune_server.log 2>/dev/null || true
          echo '=== DATA TREE ==='
          find /home/ubuntu/leopardcat-tarot/website/data -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null | head -80 || true
          echo '=== CURRENT SERVER ==='
          pgrep -af 'fortune_server.py' || true
          curl -fsS http://127.0.0.1:8088/api/stats || true
          echo
          REMOTE
