name: Oracle Release Layout Lab v0.7

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-release-layoutlab-v07.yml'
      - 'web_assets/layoutlab-v0.7-release-fix.js'
      - 'scripts/deploy_layoutlab_v07_release.py'

permissions:
  contents: read

concurrency:
  group: layoutlab-production-v07
  cancel-in-progress: true

jobs:
  release:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Refresh governed action runtime to exact release commit
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          STAGE=/tmp/layoutlab-v07-runtime-${GITHUB_RUN_ID}
          tar czf - \
            agentos_node/action_relay.py \
            scripts/deploy_layoutlab_static.py \
            scripts/deploy_layoutlab_v07_release.py \
            web_assets/layoutlab_v0_5.html \
            web_assets/layoutlib-browser-v0.5.js \
            web_assets/layoutlab-capability-bridge-v0.7.js \
            web_assets/layoutlab-v0.7-release-fix.js \
          | ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "rm -rf '$STAGE' && mkdir -p '$STAGE' && tar xzf - -C '$STAGE'"

          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$STAGE" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          STAGE="$1"
          SHA="$2"
          RUNTIME=/home/ubuntu/.local/share/agentos/action-runtime
          RECEIPT=/home/ubuntu/agent-data/runtime/action-relay/runtime-refresh-layoutlab-v07.json
          mkdir -p "$RUNTIME/agentos_node" "$RUNTIME/scripts" "$RUNTIME/web_assets" "$(dirname "$RECEIPT")"
          install -m 0644 "$STAGE/agentos_node/action_relay.py" "$RUNTIME/agentos_node/action_relay.py"
          install -m 0755 "$STAGE/scripts/deploy_layoutlab_static.py" "$RUNTIME/scripts/deploy_layoutlab_static.py"
          install -m 0755 "$STAGE/scripts/deploy_layoutlab_v07_release.py" "$RUNTIME/scripts/deploy_layoutlab_v07_release.py"
          for f in layoutlab_v0_5.html layoutlib-browser-v0.5.js layoutlab-capability-bridge-v0.7.js layoutlab-v0.7-release-fix.js; do
            install -m 0644 "$STAGE/web_assets/$f" "$RUNTIME/web_assets/$f"
          done
          python3 - "$RUNTIME" "$SHA" "$RECEIPT" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); sha=sys.argv[2]; receipt=Path(sys.argv[3])
          rels=[
            'agentos_node/action_relay.py',
            'scripts/deploy_layoutlab_static.py',
            'scripts/deploy_layoutlab_v07_release.py',
            'web_assets/layoutlab_v0_5.html',
            'web_assets/layoutlib-browser-v0.5.js',
            'web_assets/layoutlab-capability-bridge-v0.7.js',
            'web_assets/layoutlab-v0.7-release-fix.js',
          ]
          hashes={r:hashlib.sha256((root/r).read_bytes()).hexdigest() for r in rels}
          data={'schema':'agentos.runtime-refresh-receipt/v1','ok':True,'scope':'layoutlab-v0.7','source_commit':sha,'runtime_root':str(root),'sha256':hashes}
          receipt.write_text(json.dumps(data,sort_keys=True,indent=2)+'\n')
          print(json.dumps(data,sort_keys=True))
          PY
          rm -rf "$STAGE"
          REMOTE

      - name: Deploy exact v0.7 release from refreshed runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          SHA="$1"
          RUNTIME=/home/ubuntu/.local/share/agentos/action-runtime
          RECEIPT=/home/ubuntu/agent-data/runtime/action-relay/runtime-refresh-layoutlab-v07.json
          python3 - "$RECEIPT" "$SHA" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r.get('ok') is True, r
          assert r.get('source_commit') == sys.argv[2], r
          assert r.get('scope') == 'layoutlab-v0.7', r
          print('runtime_refresh_receipt=PASS')
          PY
          cd "$RUNTIME"
          /usr/bin/python3 scripts/deploy_layoutlab_v07_release.py | tee /tmp/layoutlab-v07-release.json
          grep -q '"ok": true' /tmp/layoutlab-v07-release.json
          grep -q 'layoutlab-v0.7.2' /tmp/layoutlab-v07-release.json
          echo 'layoutlab_v07_deploy=PASS'
          REMOTE

      - name: Public v0.7 acceptance
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://studio.milkcat.org/layout-lab
          curl -fsS --retry 6 --retry-all-errors "$BASE/" -o /tmp/layoutlab-v07-ui
          curl -fsS --retry 6 --retry-all-errors "$BASE/layoutlab-v0.7-release-fix.js" -o /tmp/layoutlab-v07-fix
          curl -fsS --retry 6 --retry-all-errors "$BASE/layoutlab-capability-bridge-v0.7.js" -o /tmp/layoutlab-v07-bridge
          grep -q 'Layout Lab v0.7 · AgentOS closed loop' /tmp/layoutlab-v07-ui
          grep -q 'v0.7 Capability learning contract' /tmp/layoutlab-v07-ui
          grep -q 'layoutlab-v0.7-release-fix.js' /tmp/layoutlab-v07-ui
          ! grep -q '<div class="badge">LayoutLib Browser Adapter v0.6</div>' /tmp/layoutlab-v07-ui
          grep -q 'robustDelete:true' /tmp/layoutlab-v07-fix
          grep -q 'start_px' /tmp/layoutlab-v07-fix
          grep -q 'end_px' /tmp/layoutlab-v07-fix
          grep -q "op==='delete_walls'" /tmp/layoutlab-v07-fix
          grep -q 'finishModel' /tmp/layoutlab-v07-bridge
          grep -q 'applyCanonicalPolicy' /tmp/layoutlab-v07-bridge
          echo 'public_v07_identity=PASS'
          echo 'robust_delete_overlay=PASS'
          echo 'capability_bridge=PASS'
