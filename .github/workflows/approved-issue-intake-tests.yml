name: Approved Issue Intake Unit Tests

on:
  pull_request:
    paths:
      - 'scripts/issue_work_intake.py'
      - 'scripts/approved_wow_paw_handoff.py'
      - 'tests/test_approved_wow_paw_handoff.py'
      - 'scripts/work_completion.py'
      - 'tests/test_issue_work_intake.py'
      - 'tests/test_runtime_intake_rollout.py'
      - 'tests/test_core_bundle_active_recovery.py'
      - 'tests/test_legacy_teams_preservation.py'
      - 'tests/test_telegram_service_fence.py'
      - 'tests/test_telegram_early_proof.py'
      - 'tests/test_immutable_service_python.py'
      - 'scripts/install_systemd_user.sh'
      - '.github/workflows/oracle-core-bundle-immutable-runtime-convergence.yml'
      - '.github/workflows/approved-issue-intake-tests.yml'
  push:
    branches: [main, core/integration]
    paths:
      - 'scripts/issue_work_intake.py'
      - 'scripts/approved_wow_paw_handoff.py'
      - 'tests/test_approved_wow_paw_handoff.py'
      - 'scripts/work_completion.py'
      - 'tests/test_issue_work_intake.py'
      - 'tests/test_runtime_intake_rollout.py'
      - 'tests/test_core_bundle_active_recovery.py'
      - 'tests/test_legacy_teams_preservation.py'
      - 'tests/test_telegram_service_fence.py'
      - 'scripts/install_systemd_user.sh'
      - '.github/workflows/oracle-core-bundle-immutable-runtime-convergence.yml'
      - '.github/workflows/approved-issue-intake-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test approved-only Issue Intake and durable Ledger
        run: python3 -m unittest -v tests.test_issue_work_intake tests.test_work_completion tests.test_runtime_intake_rollout tests.test_core_bundle_active_recovery tests.test_legacy_teams_preservation tests.test_telegram_service_fence tests.test_telegram_early_proof tests.test_immutable_service_python tests.test_approved_wow_paw_handoff
