name: Activate AgentOS Provider Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distributed-agentos-provider-activation
  cancel-in-progress: false

jobs:
  verify-production-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}

    steps:
      - name: Resolve deploy host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Verify production services and provider registration
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" <<'REMOTE'
          set -euo pipefail
          systemctl --user is-active --quiet agentos-control-plane.service
          systemctl --user is-active --quiet agentos-provider-bridge.service
          curl -fsS http://127.0.0.1:8765/health
          echo
          bridge="$(curl -fsS http://127.0.0.1:8775/health)"
          printf '%s\n' "$bridge"
          printf '%s' "$bridge" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          providers = data.get("providers") or []
          assert any(
              p.get("providerId") == "academia-gemini-reasoner"
              and "agent.reason" in (p.get("capabilities") or [])
              for p in providers
          ), data
          '
          REMOTE
