name: Oracle Diagnose Action Relay Service

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-diagnose-action-relay-service.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Read-only Action Relay service diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/action-relay-service-diagnostic.txt
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_identity=$(id)"
            echo '=== UNIT ==='
            cat /home/ubuntu/.config/systemd/user/agentos-action-relay.service 2>&1 || true
            echo '=== RUNTIME ==='
            stat -c '%U:%G %a %n' /home/ubuntu/.local/share/agentos/action-runtime /home/ubuntu/.local/share/agentos/action-runtime/agentos_node /home/ubuntu/agent-data/runtime/action-relay 2>&1 || true
            ls -la /home/ubuntu/.local/share/agentos/action-runtime/agentos_node 2>&1 || true
            echo '=== SERVICE STATUS ==='
            XDG_RUNTIME_DIR=/run/user/1001 systemctl --user --no-pager --full status agentos-action-relay.service 2>&1 || true
            echo '=== JOURNAL ==='
            XDG_RUNTIME_DIR=/run/user/1001 journalctl --user -u agentos-action-relay.service -n 80 --no-pager 2>&1 || true
            echo '=== PROCESS ==='
            ps -eo user,group,pid,ppid,stat,etime,args | grep -F 'agentos_node.action_relay --root /home/ubuntu/agent-data/runtime/action-relay' | grep -v grep || true
          } 2>&1 | tee "$OUT"
      - name: Commit diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E=.agentos/evidence/action-relay-service-diagnostic.txt
          test -f "$E" || exit 0
          cp "$E" /tmp/action-relay-service-diagnostic.txt
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .agentos/evidence
          cp /tmp/action-relay-service-diagnostic.txt "$E"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$E"
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(agentos): diagnose Action Relay service'
          git push origin HEAD:main
