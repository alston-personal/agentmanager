name: Oracle GUI Cgroup Diagnostic

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/oracle-gui-cgroup-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect GUI browser cgroup
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== host ==="
          hostname; date -u; uptime; free -h
          echo "=== pressure ==="
          cat /proc/pressure/memory || true
          echo "=== gui browser service ==="
          systemctl --user show agentos-gui-browser.service             -p ActiveState -p SubState -p MainPID             -p MemoryCurrent -p MemoryPeak -p MemoryHigh -p MemoryMax             -p MemorySwapCurrent -p TasksCurrent -p TasksMax -p CPUUsageNSec || true
          echo "=== gui browser cgroup files ==="
          CG=/sys/fs/cgroup/user.slice/user-1001.slice/user@1001.service/app.slice/agentos-gui-browser.service
          for f in memory.current memory.peak memory.high memory.max memory.swap.current memory.events memory.events.local; do
            echo "--- $f ---"
            cat "$CG/$f" 2>/dev/null || true
          done
          echo "=== chromium profile processes ==="
          ps -eo pid,ppid,stat,wchan:32,%cpu,%mem,rss,etime,cmd | grep '/home/ubuntu/.local/share/agentos/gui-worker/chromium-profile' | grep -v grep || true
          echo "=== gui browser unit definition ==="
          systemctl --user cat agentos-gui-browser.service || true
          echo "=== candidate source files ==="
          grep -RIn --exclude-dir=.git --exclude-dir=node_modules \
            -E 'agentos-gui-browser|MemoryHigh=|MemoryMax=|start-browser\.sh' \
            /home/ubuntu/agentmanager /home/ubuntu/.config/systemd/user 2>/dev/null | head -200 || true
          echo "oracle_gui_cgroup_diagnostic=PASS"
          REMOTE
