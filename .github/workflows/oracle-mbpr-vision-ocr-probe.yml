name: Oracle MBPR Vision OCR Probe
on:
  push:
    branches:
      - core/integration
    paths:
      - '.agentos/commands/mbpr-vision-ocr-probe.json'
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Capture Threads and run local Vision OCR
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          cmd=json.load(open('.agentos/commands/mbpr-vision-ocr-probe.json',encoding='utf-8'))
          assert cmd.get('node_id')=='mbpr'
          sha=str(cmd.get('source_commit') or '')
          tid='mbpr-vision-ocr-'+str(int(time.time()))
          py='/Users/tengweihuang/Library/Application Support/AgentOS/versions/18be78bbc0ccc94189f821e66da09ed4d41b268d/venv/bin/python'
          url=f'https://raw.githubusercontent.com/alston-personal/agentmanager/{sha}/scripts/macos_vision_ocr.swift'
          code=f"""import subprocess,time,tempfile,urllib.request,os
subprocess.run(['open','-a','Google Chrome','https://www.threads.com/messages'],check=False)
time.sleep(3)
img=tempfile.mktemp(suffix='.png')
swift=tempfile.mktemp(suffix='.swift')
urllib.request.urlretrieve('{url}',swift)
cap=subprocess.run(['/usr/sbin/screencapture','-x',img],text=True,capture_output=True,timeout=15)
if cap.returncode!=0: raise SystemExit(11)
ocr=subprocess.run(['/usr/bin/xcrun','swift',swift,img],text=True,capture_output=True,timeout=90)
lines=[x for x in ocr.stdout.splitlines() if x.strip()]
print('VISION_OCR_RC='+str(ocr.returncode))
print('VISION_OCR_LINES='+str(len(lines)))
print('VISION_OCR_BYTES='+str(len(ocr.stdout.encode())))
for p in (img,swift):
    try: os.unlink(p)
    except FileNotFoundError: pass
raise SystemExit(0 if ocr.returncode==0 and len(lines)>0 else 12)
"""
          task={'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':py,'argv':['-c',code],'cwd':'/Users/tengweihuang/AgentOS','timeout_seconds':120,'cognition_ids_used':[]}
          store=RealmFabricStore(); store.queue_task('mbpr',task)
          for _ in range(70):
              r=store.get_receipt(tid)
              if r:
                  out=str(r.get('stdout') or '')
                  print(out)
                  if r.get('ok') is True and int(r.get('returncode') or 0)==0 and 'VISION_OCR_LINES=' in out:
                      print('mbpr_vision_ocr_probe=PASS')
                      raise SystemExit(0)
                  print('mbpr_vision_ocr_probe=ERROR')
                  raise SystemExit(2)
              time.sleep(2)
          raise SystemExit('Vision OCR probe timeout')
          PY
