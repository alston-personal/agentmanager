name: Oracle Inspect Realm Public Endpoint

on:
  push:
    paths:
      - '.github/workflows/oracle-inspect-realm-public-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oracle-core-inspection
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect dashboard process tree without mutation
        shell: bash
        run: |
          set -euo pipefail
          OUT=.agentos/evidence/dashboard-process-tree.txt
          mkdir -p "$(dirname "$OUT")"
          {
            echo "identity=$(id)"
            echo '=== DASHBOARD PROCESS TREE ==='
            ps -eo user,pid,ppid,pgid,sid,lstart,cmd --sort=pid | grep -E '(^USER|npm start|next-server|next start|PM2)' || true
            echo '=== LISTENER 3000 ==='
            ss -ltnp 'sport = :3000' 2>&1 || true
            echo '=== CWD / STAT ==='
            for p in $(pgrep -u ubuntu -f 'npm start|next-server|next start' || true); do
              cwd=$(readlink -f "/proc/$p/cwd" 2>/dev/null || true)
              stat=$(cat "/proc/$p/stat" 2>/dev/null || true)
              cmd=$(tr '\0' ' ' < "/proc/$p/cmdline" 2>/dev/null || true)
              echo "pid=$p cwd=$cwd stat=$stat cmd=$cmd"
            done
            echo 'mutation=NONE'
          } | tee "$OUT"
      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AgentOS Evidence Bot'
          git config user.email 'agentos-evidence@users.noreply.github.com'
          git add .agentos/evidence/dashboard-process-tree.txt
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(agentos): record dashboard process tree'
          git push origin HEAD:main
