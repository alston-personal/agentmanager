name: Oracle Inspect Realm Public Endpoint

on:
  push:
    paths:
      - '.github/workflows/oracle-inspect-realm-public-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-core-inspection
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Identify existing dashboard runtime without mutation
        shell: bash
        run: |
          set -euo pipefail
          echo "identity=$(id)"
          echo "realm_health=$(curl -fsS --max-time 3 http://127.0.0.1:8780/v1/health)"
          echo '=== PORT 3000 / NODE PROCESSES ==='
          ss -ltn 2>/dev/null | grep ':3000 ' || true
          ps -eo user:20,pid,ppid,cmd --sort=pid | grep -E '[n]ext|[n]ode|3000|dashboard' | tail -80 || true
          echo '=== LIKELY DASHBOARD DIRECTORIES ==='
          for p in /home/ubuntu/*dashboard* /home/ubuntu/*studio* /home/ubuntu/agentmanager/dashboard /home/ubuntu/agentmanager/web /home/agentos-node/*dashboard*; do
            [ -e "$p" ] || continue
            stat -c '%U:%G %a %n' "$p" || true
            [ -f "$p/package.json" ] && { echo "--- $p/package.json"; head -80 "$p/package.json"; }
          done
          echo '=== LOCAL RESPONSE HEADERS ==='
          curl -sS -D - -o /dev/null --max-time 3 http://127.0.0.1:3000/dashboard | head -40 || true
          echo 'mutation=NONE'
