name: Oracle Inspect Realm Public Endpoint

on:
  push:
    paths:
      - '.github/workflows/oracle-inspect-realm-public-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-core-inspection
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect dashboard process tree without mutation
        shell: bash
        run: |
          set -euo pipefail
          echo "identity=$(id)"
          echo '=== DASHBOARD PROCESS TREE ==='
          ps -eo user,pid,ppid,pgid,sid,lstart,cmd --sort=pid | grep -E '(^USER|/home/ubuntu/agentmanager/dashboard|npm start|next-server|next start|PM2)' || true
          echo '=== LISTENER 3000 ==='
          ss -ltnp 'sport = :3000' 2>&1 || true
          echo '=== /PROC CWD FOR UBUNTU NPM/NEXT ==='
          python3 - <<'PY'
from pathlib import Path
import os
for e in Path('/proc').iterdir():
    if not e.name.isdigit():
        continue
    try:
        st=e.stat()
        if st.st_uid != 1001:
            continue
        cmd=(e/'cmdline').read_bytes().replace(b'\0',b' ').decode('utf-8','replace').strip()
        if not any(x in cmd for x in ('npm start','next-server','next start')):
            continue
        cwd=str((e/'cwd').resolve())
        stat=(e/'stat').read_text().split()
        print({'pid':int(e.name),'ppid':int(stat[3]),'pgid':int(stat[4]),'sid':int(stat[5]),'cwd':cwd,'cmd':cmd})
    except Exception as exc:
        print({'pid':e.name,'error':str(exc)})
PY
          echo 'mutation=NONE'
