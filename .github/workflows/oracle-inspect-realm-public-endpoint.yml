name: Oracle Inspect Realm Public Endpoint

on:
  push:
    paths:
      - '.github/workflows/oracle-inspect-realm-public-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-core-inspection
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect HTTPS routing authority without mutation
        shell: bash
        run: |
          set -euo pipefail
          echo "identity=$(id)"
          echo "realm_health=$(curl -fsS --max-time 3 http://127.0.0.1:8780/v1/health)"
          echo '=== STUDIO SERVER BLOCK ==='
          sed -n '1,260p' /etc/nginx/sites-enabled/studio.milkcat.org || true
          echo '=== NGINX MASTER / RELOAD AUTHORITY ==='
          ps -eo user,pid,ppid,cmd | grep '[n]ginx: master process' || true
          nginx -t 2>&1 || true
          nginx -s reload 2>&1 || true
          echo '=== EXISTING PUBLIC HEALTH CANDIDATES ==='
          for u in https://studio.milkcat.org/agentos/one/v1/health https://studio.milkcat.org/agentos/v1/health; do
            body=/tmp/agentos-public-probe
            code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 5 "$u" || true)
            bytes=$(wc -c < "$body" 2>/dev/null || echo 0)
            marker=false
            if grep -q 'agentos.one-health/v0.1' "$body" 2>/dev/null && grep -q 'realm-alston' "$body" 2>/dev/null; then marker=true; fi
            prefix=$(head -c 180 "$body" 2>/dev/null | tr '\n' ' ' | tr '\r' ' ' || true)
            echo "$u http=$code bytes=$bytes one_identity=$marker prefix=$prefix"
          done
          echo 'mutation=NONE'
