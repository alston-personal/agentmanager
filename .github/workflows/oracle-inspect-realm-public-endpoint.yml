name: Oracle Inspect Realm Public Endpoint

on:
  push:
    paths:
      - '.github/workflows/oracle-inspect-realm-public-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-core-inspection
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Identify PM2 dashboard identity without mutation
        shell: bash
        run: |
          set -euo pipefail
          echo "identity=$(id)"
          echo '=== PM2 DUMP SUMMARY ==='
          if [ -r /home/ubuntu/.pm2/dump.pm2 ]; then
            python3 - <<'PY'
import json
p='/home/ubuntu/.pm2/dump.pm2'
data=json.load(open(p))
for item in data:
    env=item.get('pm2_env') or item
    print({
      'name': env.get('name'),
      'pm_id': env.get('pm_id'),
      'pm_cwd': env.get('pm_cwd'),
      'script': env.get('pm_exec_path'),
      'args': env.get('args'),
      'status': env.get('status'),
    })
PY
          else
            echo 'dump_unreadable=true'
            stat -c '%U:%G %a %n' /home/ubuntu/.pm2 /home/ubuntu/.pm2/dump.pm2 2>/dev/null || true
          fi
          echo 'mutation=NONE'
