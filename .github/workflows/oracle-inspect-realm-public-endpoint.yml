name: Oracle Inspect Realm Public Endpoint

on:
  push:
    paths:
      - '.github/workflows/oracle-inspect-realm-public-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-core-inspection
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Identify dashboard supervisor without mutation
        shell: bash
        run: |
          set -euo pipefail
          echo "identity=$(id)"
          echo '=== DASHBOARD PROCESS TREE ==='
          ps -eo user:20,pid,ppid,lstart,cmd --sort=pid | grep -E '2770188|2770227|2770228|[p]m2|[s]ystemd.*dashboard|[n]ext start' || true
          for pid in 2770188 2770227 2770228; do
            [ -d "/proc/$pid" ] || continue
            echo "--- pid=$pid"
            echo -n 'cmd='; tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true; echo
            echo -n 'cwd='; readlink "/proc/$pid/cwd" 2>/dev/null || true
            cat "/proc/$pid/cgroup" 2>/dev/null || true
          done
          echo '=== UBUNTU USER UNITS ==='
          XDG_RUNTIME_DIR=/run/user/1001 sudo -u ubuntu systemctl --user --no-pager --type=service --all 2>/dev/null | grep -Ei 'dashboard|agent|next|studio' || true
          echo '=== PM2 ==='
          sudo -u ubuntu env HOME=/home/ubuntu pm2 list 2>/dev/null || true
          echo 'mutation=NONE'
