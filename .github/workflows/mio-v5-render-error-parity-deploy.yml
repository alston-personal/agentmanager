name: Mio V5 Render Error Parity Deploy

on:
  pull_request:
    branches: [core/integration]
    paths: ['.github/workflows/mio-v5-render-error-parity-deploy.yml']

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      STUDIO_SHA: 91139084c0e294f759a216a18cfb48c14872a398
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Deploy exact Studio Mio SHA and compare live catalog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out=$(mktemp)
          set +e
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s -- "$STUDIO_SHA" "${{ github.run_id }}" >"$out" 2>&1 <<'REMOTE'
          set -euo pipefail
          SHA="$1"; RUN="$2"
          LIVE=/home/ubuntu/zeus-writer/website/dist
          TMP=$(mktemp -d /tmp/mio-parity-XXXXXXXX)
          SRC="$TMP/studio-web"
          ROUTE="$SRC/dist/personas/mio"
          NEW="$LIVE/personas/.mio-parity-$RUN"
          cleanup(){ rm -rf "$TMP" "$NEW" 2>/dev/null || true; }
          trap cleanup EXIT
          /usr/bin/gh repo clone alston-personal/studio-web "$SRC" -- --no-checkout >/dev/null
          /usr/bin/git -C "$SRC" fetch --depth=1 origin "$SHA"
          /usr/bin/git -C "$SRC" checkout --detach "$SHA"
          cd "$SRC"
          npm install --no-package-lock --ignore-scripts >/dev/null
          npm run build >/dev/null
          HTML="$ROUTE/wardrobe/index.html"
          test -f "$HTML"
          grep -Fq '商品 registry 不一致' "$HTML"
          grep -Fq '[HTTP ' "$HTML"
          if [ -f "$LIVE/personas/mio/activity.json" ] && [ ! -f "$ROUTE/activity.json" ]; then cp "$LIVE/personas/mio/activity.json" "$ROUTE/activity.json"; fi
          cp -a "$ROUTE" "$NEW"
          find "$NEW" -type d -exec chmod 0755 {} +
          find "$NEW" -type f -exec chmod 0644 {} +
          rm -rf "$LIVE/personas/mio"
          mv "$NEW" "$LIVE/personas/mio"
          curl -kfsS --resolve studio.milkcat.org:443:127.0.0.1 "https://studio.milkcat.org/personas/mio/wardrobe/?_=$RUN" -o "$TMP/live.html"
          grep -Fq '商品 registry 不一致' "$TMP/live.html"
          echo "mio_render_error_ui=PASS source_sha=$SHA"
          curl -sS --max-time 10 'http://127.0.0.1:3000/dashboard/api/wardrobe/catalog?characterId=sunlake-milkcat-ai-001' -o "$TMP/catalog.json"
          python3 - "$TMP/catalog.json" <<'PY'
          import json,sys
          wanted=['net-32235-711','net-43774-002','net-42761-201','net-40832-002','net-40793-003','net-40685-003']
          j=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=j.get('garments') or j.get('items') or []
          ids={str(x.get('garmentId') or x.get('garment_id') or '') for x in rows if isinstance(x,dict)}
          print('catalog_count='+str(len(ids)))
          for g in wanted: print(f'catalog_{g}=' + ('PRESENT' if g in ids else 'MISSING'))
          print('catalog_parity=' + ('PASS' if all(g in ids for g in wanted) else 'FAIL'))
          PY
          REMOTE
          rc=$?
          set -e
          cat "$out"
          { echo '### Mio V5 live deploy + catalog parity'; echo; echo '```text'; cat "$out"; echo '```'; } >/tmp/parity.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /tmp/parity.md
          exit "$rc"