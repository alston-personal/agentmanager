name: AgentOS Codex Inference Surface Diagnostic

on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths:
      - '.github/workflows/agentos-antigravity-low-latency-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inference-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Resolve Oracle target
        run: |
          host="${DEPLOY_HOST_SOURCE#*://}"; host="${host%%/*}"; host="${host%%:*}"
          echo "DEPLOY_HOST=$host" >> "$GITHUB_ENV"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Diagnose account state and minimal inference over app-server
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" python3 - <<'PY'
          from __future__ import annotations
          import glob
          import json
          from pathlib import Path
          import select
          import subprocess
          import time

          MODEL='gpt-5.4-mini'; EFFORT='low'
          candidates=sorted(set(
              glob.glob(str(Path.home()/'.antigravity-ide-server/extensions/openai.chatgpt-*-linux-arm64/bin/linux-aarch64/codex'))+
              glob.glob(str(Path.home()/'.antigravity-ide-server/extensions/openai.chatgpt-*/bin/linux-aarch64/codex'))
          ), reverse=True)
          assert candidates, 'Codex binary not found'
          codex=candidates[0]
          empty=Path('/tmp/agentos-codex-inference-diag'); empty.mkdir(parents=True,exist_ok=True)
          proc=subprocess.Popen([codex,'app-server'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1,cwd=str(empty))
          assert proc.stdin and proc.stdout and proc.stderr

          responses={}; notifications=[]; server_requests=[]; agent_texts=[]; item_types=[]
          def send(obj):
              proc.stdin.write(json.dumps(obj,separators=(',',':'))+'\n'); proc.stdin.flush()
          def handle(msg):
              if not isinstance(msg,dict): return
              method=msg.get('method')
              if 'id' in msg and not method:
                  responses[msg['id']]=msg; return
              if method and 'id' in msg:
                  server_requests.append(str(method))
                  # Do not provide or expose credentials in this diagnostic.
                  if str(method).endswith('requestApproval'):
                      send({'id':msg['id'],'result':{'decision':'decline'}})
                  elif method=='currentTime/read':
                      send({'id':msg['id'],'result':{'currentTimeAt':int(time.time())}})
                  else:
                      send({'id':msg['id'],'error':{'code':-32000,'message':'AgentOS diagnostic does not provide external credentials or unsupported server requests'}})
                  return
              if method:
                  notifications.append(str(method))
                  if method=='item/completed':
                      item=(msg.get('params') or {}).get('item') or {}
                      typ=item.get('type')
                      if typ: item_types.append(str(typ))
                      if typ=='agentMessage' and isinstance(item.get('text'),str): agent_texts.append(item['text'])
          def pump_until(predicate, seconds):
              deadline=time.time()+seconds
              while time.time()<deadline:
                  if predicate(): return True
                  ready,_,_=select.select([proc.stdout],[],[],0.5)
                  if not ready:
                      if proc.poll() is not None: break
                      continue
                  line=proc.stdout.readline()
                  if not line: break
                  try: msg=json.loads(line)
                  except json.JSONDecodeError: continue
                  handle(msg)
              return predicate()

          send({'method':'initialize','id':0,'params':{'clientInfo':{'name':'agentos_diag','title':'AgentOS inference surface diagnostic','version':'0.1.0'}}})
          assert pump_until(lambda:0 in responses,8) and 'error' not in responses[0], responses.get(0)
          send({'method':'initialized','params':{}})

          send({'method':'account/read','id':2,'params':{'refreshToken':False}})
          account_ok=pump_until(lambda:2 in responses,8)
          account=responses.get(2,{})
          if account_ok and 'error' not in account:
              result=account.get('result') or {}
              # Deliberately print metadata only; never print tokens or email.
              print('account_read=passed')
              print('account_present='+str(bool(result.get('account'))).lower())
              print('requires_openai_auth='+str(bool(result.get('requiresOpenaiAuth'))).lower())
              if isinstance(result.get('account'),dict):
                  print('account_type='+str(result['account'].get('type') or 'present'))
                  if result['account'].get('planType') is not None: print('account_plan_type='+str(result['account'].get('planType')))
          else:
              print('account_read=failed')
              print('account_error_code='+str((account.get('error') or {}).get('code')))
              print('account_error_message='+str((account.get('error') or {}).get('message'))[:300])

          send({'method':'thread/start','id':10,'params':{'model':MODEL,'cwd':str(empty),'approvalPolicy':'never','sandbox':'read-only','ephemeral':True,'config':{'model_reasoning_effort':EFFORT}}})
          assert pump_until(lambda:10 in responses,10), 'thread/start timeout'
          assert 'error' not in responses[10], responses[10]
          thread_id=((responses[10].get('result') or {}).get('thread') or {}).get('id')
          assert thread_id

          send({'method':'turn/start','id':20,'params':{'threadId':thread_id,'input':[{'type':'text','text':'Reply with exactly WEAK_ACK and nothing else. Do not use tools.'}],'model':MODEL,'effort':EFFORT,'approvalPolicy':'never'}})
          turn_done=pump_until(lambda:'turn/completed' in notifications,35)
          turn_response=responses.get(20)
          print('turn_start_response='+('passed' if turn_response and 'error' not in turn_response else 'missing_or_error'))
          print('minimal_turn_completed='+str(turn_done).lower())
          print('server_requests='+(','.join(server_requests) if server_requests else 'none'))
          print('notification_methods='+(','.join(notifications[-40:]) if notifications else 'none'))
          print('item_types='+(','.join(item_types) if item_types else 'none'))
          if agent_texts: print('agent_text='+agent_texts[-1].replace('\n',' ')[:300])

          try:
              proc.terminate(); proc.wait(timeout=3)
          except Exception:
              proc.kill(); proc.wait(timeout=3)
          stderr_tail=proc.stderr.read()[-1800:].replace('\n',' ')
          print('stderr_tail='+stderr_tail)

          assert turn_response and 'error' not in turn_response, turn_response
          assert turn_done, 'minimal inference turn did not complete'
          assert agent_texts and agent_texts[-1].strip()=='WEAK_ACK', agent_texts[-1:] if agent_texts else []
          print('minimal_inference=passed')
          print('model='+MODEL)
          print('effort='+EFFORT)
          PY

      - name: State diagnostic contract
        if: always()
        run: |
          echo 'diagnostic=account-read plus minimal read-only gpt-5.4-mini low inference'
          echo 'credential_values_logged=false'
          echo 'next=if minimal inference passes, rerun full attach-only Master Experience Floor; if it fails, integrate with the authorized IDE auth/session bridge rather than weakening the floor.'
