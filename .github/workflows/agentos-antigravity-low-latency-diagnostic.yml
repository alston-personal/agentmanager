name: AgentOS Codex App-Server Surface Diagnostic

on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths:
      - '.github/workflows/agentos-antigravity-low-latency-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-server-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Resolve Oracle target
        run: |
          host="${DEPLOY_HOST_SOURCE#*://}"; host="${host%%/*}"; host="${host%%:*}"
          echo "DEPLOY_HOST=$host" >> "$GITHUB_ENV"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Query official Codex app-server model catalog over stdio
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" python3 - <<'PY'
          from __future__ import annotations
          import glob
          import json
          import os
          from pathlib import Path
          import select
          import subprocess
          import time

          patterns = [
              str(Path.home()/'.antigravity-ide-server/extensions/openai.chatgpt-*-linux-arm64/bin/linux-aarch64/codex'),
              str(Path.home()/'.antigravity-ide-server/extensions/openai.chatgpt-*/bin/linux-aarch64/codex'),
          ]
          candidates=[]
          for pattern in patterns:
              candidates.extend(glob.glob(pattern))
          candidates=sorted(set(candidates), reverse=True)
          assert candidates, 'no Codex binary discovered under Antigravity extension tree'
          codex=candidates[0]
          print('codex_binary=' + codex.replace(str(Path.home()), '~'))
          version=subprocess.run([codex, '--version'], capture_output=True, text=True, timeout=5)
          print('codex_version=' + (version.stdout.strip() or version.stderr.strip())[:240])

          control=Path.home()/'.codex/app-server-control/app-server-control.sock'
          router=Path.home()/'.codex/ipc/ipc.sock'
          print('extension_router_exists=' + str(router.exists()).lower())
          print('app_server_control_exists=' + str(control.exists()).lower())

          proc=subprocess.Popen(
              [codex, 'app-server'],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              bufsize=1,
              cwd=str(Path.home()),
          )
          assert proc.stdin and proc.stdout and proc.stderr

          def send(obj):
              proc.stdin.write(json.dumps(obj, separators=(',',':'))+'\n')
              proc.stdin.flush()

          send({'method':'initialize','id':0,'params':{
              'clientInfo':{'name':'agentos_probe','title':'AgentOS bounded surface probe','version':'0.1.0'},
              'capabilities':{'optOutNotificationMethods':['item/agentMessage/delta']},
          }})
          send({'method':'initialized','params':{}})
          send({'method':'model/list','id':1,'params':{'includeHidden':False}})

          responses={}
          deadline=time.time()+12
          while time.time()<deadline and 1 not in responses:
              ready,_,_=select.select([proc.stdout],[],[],0.5)
              if not ready:
                  if proc.poll() is not None:
                      break
                  continue
              line=proc.stdout.readline()
              if not line:
                  break
              try:
                  msg=json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(msg,dict) and isinstance(msg.get('id'),int):
                  responses[msg['id']]=msg

          try:
              proc.terminate(); proc.wait(timeout=3)
          except Exception:
              proc.kill(); proc.wait(timeout=3)

          init=responses.get(0)
          catalog=responses.get(1)
          if init is None or catalog is None:
              err=proc.stderr.read()[-1600:]
              print('app_server_initialize=' + ('passed' if init else 'missing'))
              print('model_list=' + ('passed' if catalog else 'missing'))
              print('stderr_tail=' + err.replace('\n',' ')[:1600])
              raise SystemExit(3)
          if 'error' in init:
              raise RuntimeError('initialize error: '+json.dumps(init['error'],sort_keys=True))
          if 'error' in catalog:
              raise RuntimeError('model/list error: '+json.dumps(catalog['error'],sort_keys=True))

          print('app_server_initialize=passed')
          print('model_list=passed')
          result=catalog.get('result') or {}
          models=result.get('data') or result.get('models') or []
          print('visible_model_count='+str(len(models)))
          for idx,model in enumerate(models):
              if not isinstance(model,dict):
                  continue
              model_id=str(model.get('id') or model.get('model') or model.get('slug') or '')
              display=str(model.get('displayName') or model.get('name') or '')
              efforts=model.get('supportedReasoningEfforts') or model.get('supported_reasoning_efforts') or []
              effort_names=[]
              for effort in efforts:
                  if isinstance(effort,str): effort_names.append(effort)
                  elif isinstance(effort,dict): effort_names.append(str(effort.get('reasoningEffort') or effort.get('effort') or effort.get('value') or effort.get('name') or ''))
              print(f'model[{idx}] id={model_id} display={display} efforts={",".join(x for x in effort_names if x)}')
          PY

      - name: State bounded-surface interpretation
        run: |
          echo 'diagnostic_contract=official_app_server_initialize_plus_model_list_only'
          echo 'user_turn_sent=false'
          echo 'filesystem_mutation_requested=false'
          echo 'next=select the weakest actually available model plus its minimum advertised reasoning effort for a blind Master Experience Floor probe.'
