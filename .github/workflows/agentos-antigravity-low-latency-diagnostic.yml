name: AgentOS Antigravity Low Latency Diagnostic

on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths:
      - '.github/workflows/agentos-antigravity-low-latency-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  low-latency-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Resolve Oracle target
        run: |
          host="${DEPLOY_HOST_SOURCE#*://}"; host="${host%%/*}"; host="${host%%:*}"
          echo "DEPLOY_HOST=$host" >> "$GITHUB_ENV"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Inspect executor and environment names only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          runtime=/home/ubuntu/.local/share/agentos/runtime-vnext
          executor=$(cd "$runtime" && PYTHONPATH=. /usr/bin/python3 - <<'PY'
          from agentos_node.antigravity_relay_worker import discover_executor
          e=discover_executor(); assert e; print(e[0])
          PY
          )
          echo "executor=$executor"
          "$executor" --version || true
          echo '--- relevant flags ---'
          "$executor" --help 2>&1 | grep -E -- '--(effort|tools|permission|allowed|disallowed|dangerously|bare|print|output-format)' | head -80 || true
          echo '--- ssh environment keys only ---'
          printf 'ssh_env_keys='; env | cut -d= -f1 | grep -E '^(CLAUDE|ANTHROPIC|ANTIGRAVITY|XDG|DBUS|DISPLAY|WAYLAND|SSH_)' | sort | paste -sd, - || true
          echo '--- systemd user-manager environment keys only ---'
          printf 'user_manager_env_keys='; systemctl --user show-environment 2>/dev/null | cut -d= -f1 | grep -E '^(CLAUDE|ANTHROPIC|ANTIGRAVITY|XDG|DBUS|DISPLAY|WAYLAND|PATH|HOME)' | sort | paste -sd, - || true
          echo '--- relevant ubuntu process names only ---'
          ps -u "$(id -u)" -o comm= | grep -Ei 'antigravity|claude|extension|language|node' | sort | uniq -c || true
          REMOTE

      - name: SSH empty workspace baseline
        shell: bash
        run: |
          set +e
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -u
          runtime=/home/ubuntu/.local/share/agentos/runtime-vnext
          executor=$(cd "$runtime" && PYTHONPATH=. /usr/bin/python3 - <<'PY'
          from agentos_node.antigravity_relay_worker import discover_executor
          e=discover_executor(); assert e; print(e[0])
          PY
          )
          empty=/tmp/agentos-low-probe-empty; rm -rf "$empty"; mkdir -p "$empty"; cd "$empty"
          out=/tmp/ssh_empty_baseline.out; err=/tmp/ssh_empty_baseline.err; start=$(date +%s)
          timeout -k 2s 25s "$executor" --bare --print --output-format text --effort low --tools '' --permission-mode dontAsk \
            'Reply with exactly LOW_EXECUTOR_ACK and nothing else. Do not use tools, inspect files, or modify anything.' >"$out" 2>"$err"
          rc=$?; elapsed=$(( $(date +%s)-start ))
          echo "probe=ssh_empty rc=$rc elapsed_seconds=$elapsed stdout_bytes=$(wc -c <"$out") stderr_bytes=$(wc -c <"$err")"
          printf 'stdout='; tail -c 1200 "$out"; echo
          printf 'stderr='; tail -c 1200 "$err"; echo
          exit 0
          REMOTE
          exit 0

      - name: User manager empty workspace probe
        shell: bash
        run: |
          set +e
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -u
          runtime=/home/ubuntu/.local/share/agentos/runtime-vnext
          executor=$(cd "$runtime" && PYTHONPATH=. /usr/bin/python3 - <<'PY'
          from agentos_node.antigravity_relay_worker import discover_executor
          e=discover_executor(); assert e; print(e[0])
          PY
          )
          empty=/tmp/agentos-low-probe-user-manager; rm -rf "$empty"; mkdir -p "$empty"
          out=/tmp/user_manager_probe.out; err=/tmp/user_manager_probe.err; start=$(date +%s)
          timeout -k 2s 25s systemd-run --user --wait --collect --pipe \
            --property=WorkingDirectory="$empty" \
            "$executor" --bare --print --output-format text --effort low --tools '' --permission-mode dontAsk \
            'Reply with exactly LOW_EXECUTOR_ACK and nothing else. Do not use tools, inspect files, or modify anything.' >"$out" 2>"$err"
          rc=$?; elapsed=$(( $(date +%s)-start ))
          echo "probe=user_manager rc=$rc elapsed_seconds=$elapsed stdout_bytes=$(wc -c <"$out") stderr_bytes=$(wc -c <"$err")"
          printf 'stdout='; tail -c 1600 "$out"; echo
          printf 'stderr='; tail -c 1600 "$err"; echo
          exit 0
          REMOTE
          exit 0

      - name: Summarize session-surface evidence
        shell: bash
        run: |
          echo 'diagnostic_contract=ssh_vs_user_manager_only'
          echo 'credential_values_logged=false'
          echo 'interpretation=if user_manager succeeds while ssh times out, relay should delegate executor launch to ubuntu user manager; if both time out, inspect Antigravity extension-host IPC next.'
