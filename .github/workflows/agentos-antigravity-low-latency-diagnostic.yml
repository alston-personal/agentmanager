# rerun-marker: 2026-08-27 latest-canonical-context
name: AgentOS Weak Executor Master Experience Floor

on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths:
      - '.github/workflows/agentos-antigravity-low-latency-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weak-master-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      CONFIG_ROOT: ${{ vars.AGENTOS_CONFIG_ROOT || '/home/ubuntu/agentmanager' }}
    steps:
      - name: Resolve Oracle target
        run: |
          host="${DEPLOY_HOST_SOURCE#*://}"; host="${host%%/*}"; host="${host%%:*}"
          echo "DEPLOY_HOST=$host" >> "$GITHUB_ENV"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Blind attach-only Master Floor on gpt-5.4-mini low
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$CONFIG_ROOT" <<'REMOTE'
          set -euo pipefail
          CONFIG_ROOT="$1"
          set -a
          source "$CONFIG_ROOT/.env"
          [ -f "$HOME/.config/agentos/distributed.env" ] && source "$HOME/.config/agentos/distributed.env"
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          python3 - <<'PY'
          from __future__ import annotations
          import glob
          import json
          import os
          from pathlib import Path
          import select
          import subprocess
          import time
          from urllib.request import Request, urlopen

          MODEL='gpt-5.4-mini'; EFFORT='low'; BASE='http://127.0.0.1:8765'
          req=Request(
              BASE+'/v1/attach',
              data=json.dumps({'project_id':'agentmanager','agent':{
                  'type':'blind-weak-master-floor','history':'none','model':MODEL,
                  'reasoning_effort':EFFORT,'context_source':'attach-only'}}).encode(),
              headers={'Authorization':'Bearer '+os.environ['AGENTOS_CONTROL_PLANE_TOKEN'],'Content-Type':'application/json'},
              method='POST',
          )
          with urlopen(req,timeout=10) as response: attached=json.load(response)
          context=attached['execution_context']; working=context['working_set']
          assert working['schema']=='agentos.executor-working-set/v0.1'
          assert working['active_goal']==context['active_goal']
          assert working['next_action']==context['next_action']
          assert working['current_findings']==context['current_findings']
          assert working['next_actions']==context['next_actions']
          assert working['integration_branch']==context['integration_branch']
          assert working['write_policy']==context['write_policy']
          assert working['context_freshness']['status']=='fresh'
          assert context['agent']['history']=='none'
          assert all(k not in working for k in ('latest_task','current_ir','continuation'))
          full_bytes=len(json.dumps(context,ensure_ascii=False).encode())
          working_bytes=len(json.dumps(working,ensure_ascii=False).encode())
          print('weak_attach_context=passed')
          print('working_set_schema='+working['schema'])
          print('execution_context_bytes='+str(full_bytes))
          print('working_set_bytes='+str(working_bytes))
          print('working_set_ratio='+format(working_bytes/max(full_bytes,1),'.3f'))

          candidates=sorted(set(
              glob.glob(str(Path.home()/'.antigravity-ide-server/extensions/openai.chatgpt-*-linux-arm64/bin/linux-aarch64/codex'))+
              glob.glob(str(Path.home()/'.antigravity-ide-server/extensions/openai.chatgpt-*/bin/linux-aarch64/codex'))
          ), reverse=True)
          assert candidates
          empty=Path('/tmp/agentos-master-floor-working-set'); empty.mkdir(parents=True,exist_ok=True)
          proc=subprocess.Popen([candidates[0],'app-server'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1,cwd=str(empty))
          assert proc.stdin and proc.stdout and proc.stderr
          responses={}; notifications=[]; server_requests=[]; agent_texts=[]; item_types=[]; forbidden_items=[]
          def send(obj): proc.stdin.write(json.dumps(obj,separators=(',',':'))+'\n'); proc.stdin.flush()
          def handle(msg):
              if not isinstance(msg,dict): return
              method=msg.get('method')
              if 'id' in msg and not method:
                  responses[msg['id']]=msg; return
              if method and 'id' in msg:
                  server_requests.append(str(method))
                  if str(method).endswith('requestApproval'):
                      send({'id':msg['id'],'result':{'decision':'decline'}})
                  elif method=='currentTime/read':
                      send({'id':msg['id'],'result':{'currentTimeAt':int(time.time())}})
                  else:
                      send({'id':msg['id'],'error':{'code':-32000,'message':'unsupported in read-only Master Floor'}})
                  return
              if method:
                  notifications.append(str(method))
                  if method=='item/completed':
                      item=(msg.get('params') or {}).get('item') or {}; typ=item.get('type')
                      if typ: item_types.append(str(typ))
                      if typ=='agentMessage' and isinstance(item.get('text'),str): agent_texts.append(item['text'])
                      if typ not in {None,'userMessage','agentMessage','reasoning','plan'}: forbidden_items.append(str(typ))
          def pump_until(predicate,seconds):
              deadline=time.time()+seconds
              while time.time()<deadline:
                  if predicate(): return True
                  ready,_,_=select.select([proc.stdout],[],[],0.5)
                  if not ready:
                      if proc.poll() is not None: break
                      continue
                  line=proc.stdout.readline()
                  if not line: break
                  try: msg=json.loads(line)
                  except json.JSONDecodeError: continue
                  handle(msg)
              return predicate()

          send({'method':'initialize','id':0,'params':{'clientInfo':{'name':'agentos_master_floor','title':'AgentOS weak Master Floor','version':'0.1.0'}}})
          assert pump_until(lambda:0 in responses,8) and 'error' not in responses[0], responses.get(0)
          send({'method':'initialized','params':{}})
          send({'method':'thread/start','id':10,'params':{
              'model':MODEL,'cwd':str(empty),'approvalPolicy':'never','sandbox':'read-only',
              'ephemeral':True,'config':{'model_reasoning_effort':EFFORT}}})
          assert pump_until(lambda:10 in responses,10) and 'error' not in responses[10], responses.get(10)
          thread_id=((responses[10].get('result') or {}).get('thread') or {}).get('id'); assert thread_id

          prompt=(
              'You are a fresh weak executor. You have no previous conversation and may use ONLY the AgentOS executor working set below as project state. '
              'Do not inspect files, call tools, run commands, or request more context. Return one JSON object only, with exactly these keys: '
              'active_goal,next_action,integration_branch,experimental_writes_to_main,history_assumed,should_continue,continuation_mode,current_position,governance_boundary,source. '
              'Copy active_goal and next_action exactly. Copy integration_branch. experimental_writes_to_main must come from write_policy. '
              'history_assumed must be false. source must be executor_working_set_only. '
              'Summarize current_position from current_findings in one or two sentences. State the write safety boundary in governance_boundary. '
              'Because next_actions contains safe derivable work, should_continue must be true and continuation_mode must be continue_now rather than asking the human to repeat context. '
              'WORKING_SET='+json.dumps(working,ensure_ascii=False,separators=(',',':'))
          )
          send({'method':'turn/start','id':20,'params':{
              'threadId':thread_id,'input':[{'type':'text','text':prompt}],
              'model':MODEL,'effort':EFFORT,'approvalPolicy':'never'}})
          done=pump_until(lambda:'turn/completed' in notifications,60)
          assert responses.get(20) and 'error' not in responses[20], responses.get(20)
          if not done:
              print('server_requests='+(','.join(server_requests) if server_requests else 'none'))
              print('notifications='+(','.join(notifications[-40:]) if notifications else 'none'))
              print('item_types='+(','.join(item_types) if item_types else 'none'))
          assert done, 'Master Floor turn did not complete'
          assert not forbidden_items, forbidden_items
          assert agent_texts, 'missing agentMessage'
          text=agent_texts[-1].strip()
          if text.startswith('```'):
              text=text.strip('`').strip()
              if text.startswith('json'): text=text[4:].strip()
          result=json.loads(text)
          expected_keys={'active_goal','next_action','integration_branch','experimental_writes_to_main','history_assumed','should_continue','continuation_mode','current_position','governance_boundary','source'}
          assert set(result)==expected_keys, result
          assert result['active_goal']==working['active_goal']
          assert result['next_action']==working['next_action']
          assert result['integration_branch']==working['integration_branch']
          assert result['experimental_writes_to_main']=='deny'
          assert result['history_assumed'] is False
          assert result['source']=='executor_working_set_only'
          assert result['should_continue'] is True
          assert result['continuation_mode']=='continue_now'
          assert len(result['current_position'].strip())>=40
          boundary=result['governance_boundary'].lower()
          assert 'main' in boundary and ('branch' in boundary or 'write' in boundary)

          print('weak_master_floor=passed')
          print('weak_executor_model='+MODEL)
          print('weak_executor_effort='+EFFORT)
          print('weak_history_assumed=false')
          print('weak_side_effect_items=none')
          print('weak_should_continue=true')
          print('weak_continuation_mode=continue_now')
          print('weak_current_position='+result['current_position'].replace('\n',' ')[:800])
          print('weak_governance_boundary='+result['governance_boundary'].replace('\n',' ')[:800])
          print('weak_server_requests='+(','.join(server_requests) if server_requests else 'none'))
          try:
              proc.terminate(); proc.wait(timeout=3)
          except Exception:
              proc.kill(); proc.wait(timeout=3)
          PY
          REMOTE

      - name: State Master Experience Floor contract
        run: |
          echo 'master_experience_floor=attach -> deterministic executor working set -> weakest available model'
          echo 'weak_executor=gpt-5.4-mini'
          echo 'reasoning_effort=low'
          echo 'history=none'
          echo 'thread=ephemeral'
          echo 'sandbox=read-only'
          echo 'approval_policy=never'
          echo 'required_behavior=goal continuity + governance continuity + autonomous safe continuation'
