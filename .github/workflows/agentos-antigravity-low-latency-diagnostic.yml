name: AgentOS Antigravity IPC Surface Diagnostic

on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths:
      - '.github/workflows/agentos-antigravity-low-latency-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipc-surface-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Resolve Oracle target
        run: |
          host="${DEPLOY_HOST_SOURCE#*://}"; host="${host%%/*}"; host="${host%%:*}"
          echo "DEPLOY_HOST=$host" >> "$GITHUB_ENV"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Inventory Antigravity process and Unix IPC metadata
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import os
          from pathlib import Path
          import re
          import socket
          import stat

          UID = os.getuid()
          PROC = Path('/proc')
          relevant_terms = ('antigravity', 'extensionhost', 'extension', 'language_server', 'language-server', 'claude', 'codex')

          def safe_readlink(path: Path) -> str:
              try:
                  return os.readlink(path)
              except OSError:
                  return ''

          def redact(text: str) -> str:
              if not text:
                  return ''
              home = str(Path.home())
              text = text.replace(home, '~')
              text = re.sub(r'(?i)[0-9a-f]{24,}', '<hex>', text)
              text = re.sub(r'(?i)[0-9a-f]{8}-[0-9a-f-]{20,}', '<uuid>', text)
              text = re.sub(r'\b\d{5,}\b', '<n>', text)
              return text

          def fingerprint(text: str) -> str:
              return hashlib.sha256(text.encode()).hexdigest()[:12]

          processes = {}
          for p in PROC.glob('[0-9]*'):
              try:
                  status = (p/'status').read_text(errors='ignore')
                  uid_line = next(x for x in status.splitlines() if x.startswith('Uid:'))
                  if int(uid_line.split()[1]) != UID:
                      continue
                  name = next((x.split(':',1)[1].strip() for x in status.splitlines() if x.startswith('Name:')), '')
                  exe = safe_readlink(p/'exe')
                  cwd = safe_readlink(p/'cwd')
                  hay = (name + ' ' + exe + ' ' + cwd).lower()
                  if not any(term in hay for term in relevant_terms):
                      continue
                  ppid = next((int(x.split()[1]) for x in status.splitlines() if x.startswith('PPid:')), 0)
                  processes[int(p.name)] = {'name': name, 'ppid': ppid, 'exe': exe, 'cwd': cwd}
              except (OSError, StopIteration, ValueError):
                  continue

          print('credential_values_logged=false')
          print(f'relevant_process_count={len(processes)}')
          for pid, info in sorted(processes.items()):
              print('process '
                    f'pid={pid} ppid={info["ppid"]} name={redact(info["name"])} '
                    f'exe={redact(info["exe"])} cwd={redact(info["cwd"])}')

          inode_to_path = {}
          try:
              lines = (PROC/'net/unix').read_text(errors='ignore').splitlines()[1:]
              for line in lines:
                  parts = line.split()
                  if len(parts) < 7:
                      continue
                  inode = parts[6]
                  path = parts[7] if len(parts) >= 8 else ''
                  inode_to_path[inode] = path
          except OSError:
              pass

          owned = []
          for pid, info in sorted(processes.items()):
              fd_dir = PROC/str(pid)/'fd'
              try:
                  fds = list(fd_dir.iterdir())
              except OSError:
                  continue
              for fd in fds:
                  target = safe_readlink(fd)
                  m = re.fullmatch(r'socket:\[(\d+)\]', target)
                  if not m:
                      continue
                  inode = m.group(1)
                  raw_path = inode_to_path.get(inode, '')
                  if raw_path:
                      owned.append((pid, info['name'], raw_path))

          seen = set()
          for pid, name, raw_path in owned:
              key = (pid, raw_path)
              if key in seen:
                  continue
              seen.add(key)
              print('unix_socket '
                    f'pid={pid} process={redact(name)} '
                    f'pattern={redact(raw_path)} path_hash={fingerprint(raw_path)}')
          print(f'relevant_owned_unix_socket_count={len(seen)}')

          roots = [Path(f'/run/user/{UID}'), Path.home()/'.antigravity-ide-server']
          fs_sockets = []
          for root in roots:
              if not root.exists():
                  continue
              try:
                  iterator = root.rglob('*')
                  for item in iterator:
                      try:
                          mode = item.lstat().st_mode
                      except OSError:
                          continue
                      if stat.S_ISSOCK(mode):
                          fs_sockets.append(str(item))
                          if len(fs_sockets) >= 80:
                              break
              except OSError:
                  continue
              if len(fs_sockets) >= 80:
                  break
          for raw_path in fs_sockets:
              print(f'filesystem_socket pattern={redact(raw_path)} path_hash={fingerprint(raw_path)}')
          print(f'filesystem_socket_count={len(fs_sockets)}')
          PY

      - name: State diagnostic interpretation
        run: |
          echo 'diagnostic_contract=metadata_only_no_protocol_writes'
          echo 'next=use process-owned socket patterns to identify the authorized Antigravity extension-host boundary; do not reuse standalone Claude CLI unless evidence shows it shares the IDE session.'
