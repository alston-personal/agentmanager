name: AgentOS Antigravity Low Latency Diagnostic

on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths:
      - '.github/workflows/agentos-antigravity-low-latency-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  low-latency-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Resolve Oracle target
        run: |
          host="${DEPLOY_HOST_SOURCE#*://}"; host="${host%%/*}"; host="${host%%:*}"
          echo "DEPLOY_HOST=$host" >> "$GITHUB_ENV"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Probe exact weak executor in bounded tiers
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          runtime=/home/ubuntu/.local/share/agentos/runtime-vnext
          executor=$(cd "$runtime" && PYTHONPATH=. /usr/bin/python3 - <<'PY'
          from agentos_node.antigravity_relay_worker import discover_executor
          e=discover_executor()
          assert e
          print(e[0])
          PY
          )
          echo "executor=$executor"
          "$executor" --version || true
          echo '--- relevant flags ---'
          "$executor" --help 2>&1 | grep -E -- '--(effort|tools|permission|allowed|disallowed|dangerously|bare|print|output-format)' | head -80 || true
          echo '--- non-secret environment shape ---'
          echo "ssh_tty=$([ -t 0 ] && echo yes || echo no)"
          echo "home=$HOME"
          echo "user=$(whoami)"
          printf 'named_env_keys='; env | cut -d= -f1 | grep -E '^(CLAUDE|ANTHROPIC|ANTIGRAVITY|XDG|DBUS|DISPLAY|WAYLAND|SSH_)' | sort | paste -sd, - || true

          empty=/tmp/agentos-low-probe-empty
          rm -rf "$empty"; mkdir -p "$empty"
          prompt='Reply with exactly LOW_EXECUTOR_ACK and nothing else. Do not use tools, inspect files, or modify anything.'

          probe() {
            name="$1"; cwd="$2"; shift 2
            out="/tmp/${name}.out"; err="/tmp/${name}.err"
            start=$(date +%s)
            set +e
            (cd "$cwd" && timeout 35s "$executor" "$@" "$prompt" >"$out" 2>"$err")
            rc=$?
            set -e
            elapsed=$(( $(date +%s) - start ))
            echo "probe=$name rc=$rc elapsed_seconds=$elapsed stdout_bytes=$(wc -c <"$out") stderr_bytes=$(wc -c <"$err")"
            printf '%s stdout=' "$name"; tail -c 1200 "$out" || true; echo
            printf '%s stderr=' "$name"; tail -c 1200 "$err" || true; echo
            return 0
          }

          base=(--bare --print --output-format text --effort low)
          probe empty_baseline "$empty" "${base[@]}"
          probe empty_no_tools "$empty" "${base[@]}" --tools ""
          probe empty_no_tools_dontask "$empty" "${base[@]}" --tools "" --permission-mode dontAsk
          probe runtime_no_tools_dontask "$runtime" "${base[@]}" --tools "" --permission-mode dontAsk
          REMOTE
