name: AgentOS Antigravity Low Latency Diagnostic

on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths:
      - '.github/workflows/agentos-antigravity-low-latency-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  low-latency-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Resolve Oracle target
        run: |
          host="${DEPLOY_HOST_SOURCE#*://}"; host="${host%%/*}"; host="${host%%:*}"
          echo "DEPLOY_HOST=$host" >> "$GITHUB_ENV"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Probe exact weak executor in bounded tiers
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/.local/share/agentos/runtime-vnext
          executor=$(PYTHONPATH=. /usr/bin/python3 - <<'PY'
          from agentos_node.antigravity_relay_worker import discover_executor
          e=discover_executor()
          assert e
          print(e[0])
          PY
          )
          echo "executor=$executor"
          "$executor" --version || true
          echo '--- relevant flags ---'
          "$executor" --help 2>&1 | grep -E -- '--(effort|tools|permission|allowed|disallowed|dangerously|bare|print|output-format)' | head -60 || true

          probe() {
            name="$1"; limit="$2"; prompt="$3"
            out="/tmp/${name}.out"; err="/tmp/${name}.err"
            start=$(date +%s)
            set +e
            timeout "${limit}s" "$executor" --bare --print --output-format text --effort low "$prompt" >"$out" 2>"$err"
            rc=$?
            set -e
            elapsed=$(( $(date +%s) - start ))
            echo "probe=$name rc=$rc elapsed_seconds=$elapsed stdout_bytes=$(wc -c <"$out") stderr_bytes=$(wc -c <"$err")"
            echo "--- $name stdout ---"
            tail -c 3000 "$out" || true; echo
            echo "--- $name stderr ---"
            tail -c 3000 "$err" || true; echo
          }

          probe ack 45 'Reply with exactly LOW_EXECUTOR_ACK and nothing else. Do not use tools, inspect files, or modify anything.'
          probe continuity_min 60 'You are a weak AgentOS executor with no prior chat history. Durable goal: prove AgentOS can preserve continuity for a weak executor. Kernel next action: report the goal and next action without modifying files. Reply in at most 5 lines beginning MASTER_FLOOR_ACK. Do not use tools or inspect files.'
          REMOTE
