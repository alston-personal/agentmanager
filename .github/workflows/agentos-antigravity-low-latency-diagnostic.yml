name: AgentOS Antigravity Low Latency Diagnostic

on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths:
      - '.github/workflows/agentos-antigravity-low-latency-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  low-latency-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Resolve Oracle target
        run: |
          host="${DEPLOY_HOST_SOURCE#*://}"; host="${host%%/*}"; host="${host%%:*}"
          echo "DEPLOY_HOST=$host" >> "$GITHUB_ENV"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Inspect executor and environment names only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          runtime=/home/ubuntu/.local/share/agentos/runtime-vnext
          executor=$(cd "$runtime" && PYTHONPATH=. /usr/bin/python3 - <<'PY'
          from agentos_node.antigravity_relay_worker import discover_executor
          e=discover_executor(); assert e; print(e[0])
          PY
          )
          echo "executor=$executor"
          "$executor" --version || true
          echo '--- relevant flags ---'
          "$executor" --help 2>&1 | grep -E -- '--(effort|tools|permission|allowed|disallowed|dangerously|bare|print|output-format)' | head -80 || true
          echo '--- ssh environment keys only ---'
          printf 'ssh_env_keys='; env | cut -d= -f1 | grep -E '^(CLAUDE|ANTHROPIC|ANTIGRAVITY|XDG|DBUS|DISPLAY|WAYLAND|SSH_)' | sort | paste -sd, - || true
          echo '--- live ubuntu Claude process environment keys only ---'
          python3 - <<'PY'
          from pathlib import Path
          found=0
          for status in Path('/proc').glob('[0-9]*/status'):
              try:
                  text=status.read_text(errors='ignore')
                  name=next((x.split(':',1)[1].strip() for x in text.splitlines() if x.startswith('Name:')), '')
                  uid_line=next((x for x in text.splitlines() if x.startswith('Uid:')), '')
                  if name != 'claude' or not uid_line:
                      continue
                  uid=int(uid_line.split()[1])
                  if uid != 1001:
                      continue
                  pid=status.parent.name
                  keys=[]
                  raw=(status.parent/'environ').read_bytes().split(b'\0')
                  for item in raw:
                      if b'=' not in item: continue
                      key=item.split(b'=',1)[0].decode(errors='ignore')
                      if key.startswith(('CLAUDE','ANTHROPIC','ANTIGRAVITY','XDG','DBUS','DISPLAY','WAYLAND')):
                          keys.append(key)
                  print(f'live_claude_pid={pid} env_keys={",".join(sorted(set(keys)))}')
                  found += 1
              except (OSError, ValueError, StopIteration):
                  pass
          print(f'live_claude_processes={found}')
          PY
          REMOTE

      - name: Empty workspace baseline
        shell: bash
        run: |
          set +e
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -u
          runtime=/home/ubuntu/.local/share/agentos/runtime-vnext
          executor=$(cd "$runtime" && PYTHONPATH=. /usr/bin/python3 - <<'PY'
          from agentos_node.antigravity_relay_worker import discover_executor
          e=discover_executor(); assert e; print(e[0])
          PY
          )
          empty=/tmp/agentos-low-probe-empty; rm -rf "$empty"; mkdir -p "$empty"; cd "$empty"
          out=/tmp/empty_baseline.out; err=/tmp/empty_baseline.err; start=$(date +%s)
          timeout -k 2s 25s "$executor" --bare --print --output-format text --effort low \
            'Reply with exactly LOW_EXECUTOR_ACK and nothing else. Do not use tools, inspect files, or modify anything.' >"$out" 2>"$err"
          rc=$?; elapsed=$(( $(date +%s)-start ))
          echo "probe=empty_baseline rc=$rc elapsed_seconds=$elapsed stdout_bytes=$(wc -c <"$out") stderr_bytes=$(wc -c <"$err")"
          printf 'stdout='; tail -c 1200 "$out"; echo
          printf 'stderr='; tail -c 1200 "$err"; echo
          exit 0
          REMOTE
          exit 0

      - name: Empty workspace with tools disabled
        shell: bash
        run: |
          set +e
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -u
          runtime=/home/ubuntu/.local/share/agentos/runtime-vnext
          executor=$(cd "$runtime" && PYTHONPATH=. /usr/bin/python3 - <<'PY'
          from agentos_node.antigravity_relay_worker import discover_executor
          e=discover_executor(); assert e; print(e[0])
          PY
          )
          empty=/tmp/agentos-low-probe-empty; mkdir -p "$empty"; cd "$empty"
          out=/tmp/empty_no_tools.out; err=/tmp/empty_no_tools.err; start=$(date +%s)
          timeout -k 2s 25s "$executor" --bare --print --output-format text --effort low --tools '' \
            'Reply with exactly LOW_EXECUTOR_ACK and nothing else. Do not use tools, inspect files, or modify anything.' >"$out" 2>"$err"
          rc=$?; elapsed=$(( $(date +%s)-start ))
          echo "probe=empty_no_tools rc=$rc elapsed_seconds=$elapsed stdout_bytes=$(wc -c <"$out") stderr_bytes=$(wc -c <"$err")"
          printf 'stdout='; tail -c 1200 "$out"; echo
          printf 'stderr='; tail -c 1200 "$err"; echo
          exit 0
          REMOTE
          exit 0

      - name: Empty workspace no tools dontAsk
        shell: bash
        run: |
          set +e
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -u
          runtime=/home/ubuntu/.local/share/agentos/runtime-vnext
          executor=$(cd "$runtime" && PYTHONPATH=. /usr/bin/python3 - <<'PY'
          from agentos_node.antigravity_relay_worker import discover_executor
          e=discover_executor(); assert e; print(e[0])
          PY
          )
          empty=/tmp/agentos-low-probe-empty; mkdir -p "$empty"; cd "$empty"
          out=/tmp/empty_no_tools_dontask.out; err=/tmp/empty_no_tools_dontask.err; start=$(date +%s)
          timeout -k 2s 25s "$executor" --bare --print --output-format text --effort low --tools '' --permission-mode dontAsk \
            'Reply with exactly LOW_EXECUTOR_ACK and nothing else. Do not use tools, inspect files, or modify anything.' >"$out" 2>"$err"
          rc=$?; elapsed=$(( $(date +%s)-start ))
          echo "probe=empty_no_tools_dontask rc=$rc elapsed_seconds=$elapsed stdout_bytes=$(wc -c <"$out") stderr_bytes=$(wc -c <"$err")"
          printf 'stdout='; tail -c 1200 "$out"; echo
          printf 'stderr='; tail -c 1200 "$err"; echo
          exit 0
          REMOTE
          exit 0

      - name: AgentOS runtime no tools dontAsk
        shell: bash
        run: |
          set +e
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -u
          runtime=/home/ubuntu/.local/share/agentos/runtime-vnext
          executor=$(cd "$runtime" && PYTHONPATH=. /usr/bin/python3 - <<'PY'
          from agentos_node.antigravity_relay_worker import discover_executor
          e=discover_executor(); assert e; print(e[0])
          PY
          )
          cd "$runtime"
          out=/tmp/runtime_no_tools_dontask.out; err=/tmp/runtime_no_tools_dontask.err; start=$(date +%s)
          timeout -k 2s 25s "$executor" --bare --print --output-format text --effort low --tools '' --permission-mode dontAsk \
            'Reply with exactly LOW_EXECUTOR_ACK and nothing else. Do not use tools, inspect files, or modify anything.' >"$out" 2>"$err"
          rc=$?; elapsed=$(( $(date +%s)-start ))
          echo "probe=runtime_no_tools_dontask rc=$rc elapsed_seconds=$elapsed stdout_bytes=$(wc -c <"$out") stderr_bytes=$(wc -c <"$err")"
          printf 'stdout='; tail -c 1200 "$out"; echo
          printf 'stderr='; tail -c 1200 "$err"; echo
          exit 0
          REMOTE
          exit 0
