name: Oracle Normalize Threads Replies

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-normalize-threads-replies.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Normalize private reply receipt by canonical permalink
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/threads-normalized-replies-summary.json
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" python3 - <<'PY' > "$OUT"
          import hashlib, json, os, re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit

          SRC=Path('/home/ubuntu/agent-data/runtime/vendor-reputation/threads-DcWVvpwGTSh-reply-blocks.json')
          OUT=Path('/home/ubuntu/agent-data/runtime/vendor-reputation/threads-DcWVvpwGTSh-normalized-replies.json')
          ROOT='https://www.threads.com/@nico1e.16/post/DcWVvpwGTSh'
          data=json.loads(SRC.read_text(encoding='utf-8'))
          candidates=data.get('reply_candidates') or []

          def canon(u):
              if not u: return None
              try:
                  p=urlsplit(u)
                  path=re.sub(r'/+$','',p.path)
                  return urlunsplit(('https','www.threads.com',path,'',''))
              except Exception:
                  return u

          root=canon(ROOT)
          groups={}
          unlinked=[]
          for c in candidates:
              links=[]
              for u in c.get('post_links') or []:
                  cu=canon(u)
                  if cu and '/post/' in cu and cu not in links: links.append(cu)
              # Prefer a non-root post link; if all we have is root, keep it separately as ambiguous.
              reply_links=[u for u in links if u != root]
              chosen=reply_links[0] if reply_links else (links[0] if links else None)
              if not chosen:
                  unlinked.append(c); continue
              groups.setdefault(chosen,[]).append(c)

          normalized=[]
          for permalink, rows in groups.items():
              # Smallest block is normally the least-nested DOM container and therefore least polluted by neighbors/UI.
              rows=sorted(rows,key=lambda x:len(x.get('text_block') or ''))
              best=rows[0]
              normalized.append({
                  'evidence_id':'threads:'+hashlib.sha256(permalink.encode()).hexdigest()[:20],
                  'source_type':'threads_public_reply',
                  'source_url':permalink,
                  'source_author':best.get('author'),
                  'original_text_block':best.get('text_block'),
                  'duplicate_dom_candidates':len(rows),
                  'review_status':'pending',
                  'extracted_vendor':None,
                  'evidence_signal':'unclassified',
              })

          normalized.sort(key=lambda x:x['source_url'])
          private={
              'schema':'agentos.vendor-threads-normalized/v1',
              'source_thread':ROOT,
              'observed_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'normalized_replies':normalized,
              'unlinked_candidates':unlinked,
          }
          OUT.write_text(json.dumps(private,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); os.chmod(OUT,0o600)

          non_root=sum(1 for x in normalized if canon(x['source_url'])!=root)
          root_linked=sum(1 for x in normalized if canon(x['source_url'])==root)
          authors={x.get('source_author') for x in normalized if x.get('source_author')}
          duplicate_groups=sum(1 for x in normalized if x.get('duplicate_dom_candidates',1)>1)
          summary={
              'schema':'agentos.threads-normalized-replies-summary/v1',
              'checked_at':private['observed_at'],
              'raw_reply_candidates':len(candidates),
              'unique_permalink_groups':len(normalized),
              'unique_non_root_reply_permalinks':non_root,
              'root_permalink_groups':root_linked,
              'unique_authors':len(authors),
              'duplicate_permalink_groups':duplicate_groups,
              'unlinked_candidates':len(unlinked),
              'private_normalized_path':str(OUT),
              'public_comment_text_committed':False,
          }
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          python3 -m json.tool "$OUT" >/dev/null
          cat "$OUT"
      - name: Commit sanitized normalization summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .agentos/evidence/threads-normalized-replies-summary.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/threads-normalized-replies-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(threads): normalized public replies summary'
          git push
