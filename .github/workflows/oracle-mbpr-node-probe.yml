name: Oracle MBPR Node Probe
on:
  push:
    branches:
      - core/integration
    paths:
      - '.agentos/commands/mbpr-node-probe.json'
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 3
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Queue governed MBPR probe
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          cmd=json.load(open('.agentos/commands/mbpr-node-probe.json',encoding='utf-8'))
          assert cmd.get('schema')=='agentos.realm-command/v0.1'
          assert cmd.get('action') in {'realm.node.probe','realm.node.fixed-social-probe'}
          assert cmd.get('node_id')=='mbpr'
          tid='probe-mbpr-'+str(int(time.time()))
          if cmd.get('action')=='realm.node.fixed-social-probe':
              sha=str(cmd.get('source_commit') or '')
              assert len(sha)==40
              py='/Users/tengweihuang/Library/Application Support/AgentOS/venv/bin/python'
              root='/Users/tengweihuang/Library/Application Support/AgentOS/browser-bridge'
              code=("import sys,runpy,urllib.request,tempfile; sys.path.insert(0,"+repr(root+"/site-packages")+"); p=tempfile.mktemp(suffix='.py'); urllib.request.urlretrieve('https://raw.githubusercontent.com/alston-personal/agentmanager/"+sha+"/scripts/social_session_probe.py',p); sys.argv=[p]; runpy.run_path(p,run_name='__main__')")
              task={'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':py,'argv':['-c',code],'cwd':'/Users/tengweihuang/AgentOS','timeout_seconds':30,'cognition_ids_used':[]}
          else:
              task={'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':'python3','argv':['-c',"import platform,socket; print('AGENTOS_MBPR_PROBE_PASS'); print(socket.gethostname()); print(platform.system())"],'cwd':'/Users/tengweihuang/AgentOS','timeout_seconds':20,'cognition_ids_used':[]}
          store=RealmFabricStore(); store.queue_task('mbpr',task)
          print('probe_task_id='+tid)
          for _ in range(45):
              r=store.get_receipt(tid)
              if r:
                  out=str(r.get('stdout') or '')
                  print(out)
                  if r.get('ok') is not True:
                      raise SystemExit(str(r))
                  if cmd.get('action')=='realm.node.probe' and 'AGENTOS_MBPR_PROBE_PASS' not in out:
                      raise SystemExit(str(r))
                  print('mbpr_probe=PASS')
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('mbpr probe receipt timeout')
          PY
