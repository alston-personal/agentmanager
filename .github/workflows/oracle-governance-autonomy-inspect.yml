name: Oracle Governance Autonomy Inspect

on:
  push:
    branches:
      - core/integration
    paths:
      - '.agentos/commands/governance-autonomy-inspect.json'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect autonomous governance chain read-only
        shell: bash
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          DATA = Path(os.environ["AGENT_DATA_ROOT"])
          REPO = Path("/home/ubuntu/agentmanager")

          def run(cmd, timeout=8):
              try:
                  p=subprocess.run(["bash","-lc",cmd],text=True,capture_output=True,timeout=timeout,check=False)
                  return {"returncode":p.returncode,"stdout":p.stdout[-16000:],"stderr":p.stderr[-4000:],"timed_out":False}
              except subprocess.TimeoutExpired as e:
                  return {"returncode":124,"stdout":(e.stdout or "")[-16000:] if isinstance(e.stdout,str) else "","stderr":"timeout","timed_out":True}

          def supervisor_env():
              p=run("pgrep -f 'agent_core.core_supervisor_daemon' | head -1")
              raw=(p.get("stdout") or "").strip()
              if not raw.isdigit():
                  return {"pid":None}
              pid=raw
              try:
                  parts=Path(f"/proc/{pid}/environ").read_bytes().split(b"\0")
                  env={}
                  allow={"AGENTOS_EMPLOYEE_RUNTIME_ROOT","AGENTOS_SUPERVISOR_DELIVERY_MODE","AGENTOS_SUPERVISOR_ONE_DATA_ROOT"}
                  for part in parts:
                      if b"=" not in part: continue
                      k,v=part.split(b"=",1)
                      key=k.decode("utf-8","ignore")
                      if key in allow:
                          env[key]=v.decode("utf-8","ignore")
                  return {"pid":int(pid),**env}
              except Exception as e:
                  return {"pid":int(pid),"error":type(e).__name__}

          def list_runtime(root):
              if not root:
                  return {"present":False}
              base=Path(root)
              if not base.is_dir():
                  return {"present":False,"root":str(base)}
              def names(rel, limit=80):
                  p=base/rel
                  if not p.is_dir(): return []
                  out=[]
                  for x in sorted(p.glob("*.json"), key=lambda q:q.stat().st_mtime if q.exists() else 0)[-limit:]:
                      try:
                          out.append({"name":x.name,"mtime":x.stat().st_mtime})
                      except OSError:
                          pass
                  return out
              state={}
              for rel in ("supervisor/state.json","supervisor/leader.json"):
                  p=base/rel
                  if p.is_file():
                      try:
                          d=json.loads(p.read_text(encoding="utf-8"))
                          state[rel]={"schema":d.get("schema"),"generation":d.get("generation"),"owner_id":d.get("owner_id"),"heartbeat_at":d.get("heartbeat_at"),"expires_at":d.get("expires_at")}
                      except Exception as e:
                          state[rel]={"error":type(e).__name__}
              return {"present":True,"root":str(base),"employees":names("employees"),"assignments":names("assignments"),"leases":names("lifecycle/leases"),"supervisor":state}

          def read_json(path):
              try:
                  p=Path(path)
                  if not p.is_file():
                      return {"present":False}
                  d=json.loads(p.read_text(encoding="utf-8"))
                  return {"present":True,"schema":d.get("schema"),"generation":d.get("generation"),"item_count":len(d.get("items",{})) if isinstance(d.get("items"),dict) else None,
                          "active_items":[{"work_id":k,"status":v.get("status"),"owner":v.get("owner"),"next_action":bool(v.get("next_action")),"blocker":bool(v.get("blocker"))}
                                          for k,v in (d.get("items",{}) or {}).items() if isinstance(v,dict) and v.get("status") not in {"done","cancelled"}][:30]}
              except Exception as e:
                  return {"present":True,"error":type(e).__name__}

          def summarize_runtime(root):
              root=Path(root or "/home/ubuntu/agent-data/employee-runtime")
              def docs(rel, allowed, limit=40):
                  d=root/rel
                  if not d.is_dir(): return []
                  out=[]
                  files=sorted(d.glob("*.json"), key=lambda p:p.stat().st_mtime if p.exists() else 0)[-limit:]
                  for p in files:
                      try:
                          obj=json.loads(p.read_text(encoding="utf-8"))
                          item={"file":p.name}
                          for key in allowed:
                              if key in obj:
                                  item[key]=obj.get(key)
                          out.append(item)
                      except Exception as e:
                          out.append({"file":p.name,"error":type(e).__name__})
                  return out
              return {
                  "root":str(root),
                  "employees":docs("employees",["employee_id","display_name","role_ids"]),
                  "assignments":docs("assignments",["assignment_id","employee_id","state","role_id","skill_id","updated_at","created_at"]),
                  "leases":docs("lifecycle/leases",["assignment_id","employee_id","status","generation","expires_at","last_checkpoint_at"]),
                  "deliveries":docs("supervisor/deliveries",["schema","intent_id","assignment_id","employee_id","state","status","blocker_code","updated_at","attempted_at","queued_at","claimed_at"],20),
              }

          senv=supervisor_env()
          runtime_root=senv.get("AGENTOS_EMPLOYEE_RUNTIME_ROOT") or "/home/ubuntu/agent-data/employee-runtime"
          result={
            "schema":"agentos.governance-autonomy-inspection/v0.2",
            "supervisor_env":senv,
            "processes":run("ps -eo pid,user,lstart,args | grep -E 'core_supervisor_daemon|employee_worker_host|lobster.py|completion|work_completion|watchdog' | grep -v grep || true"),
            "repo_generation":run("git -C /home/ubuntu/agentmanager rev-parse --abbrev-ref HEAD 2>/dev/null; git -C /home/ubuntu/agentmanager rev-parse HEAD 2>/dev/null; git -C /home/ubuntu/agentmanager status --porcelain=v1 2>/dev/null | head -80"),
            "role_registry":run("grep -E '^(role_set_version:|  - id:|    name:|    status:)' /home/ubuntu/agentmanager/.agent/roles/registry.yaml 2>/dev/null | head -160"),
            "core_live_pointer":run("readlink -f /home/ubuntu/agent-data/runtime/core/current 2>/dev/null || true; ls -ld /home/ubuntu/agent-data/runtime/core/current /home/ubuntu/agent-data/runtime/core 2>/dev/null || true"),
            "completion_live_pointer":run("readlink -f /home/ubuntu/agent-data/runtime/agentos-lobster/current 2>/dev/null || true; find /home/ubuntu/agent-data/releases/agentos-lobster -maxdepth 2 -type f -name 'release.json' -print 2>/dev/null | tail -5"),
            "completion_ledger_stat":run("stat -c '%U %G %a %n' /home/ubuntu/agent-data/governance /home/ubuntu/agent-data/governance/work-items.json 2>/dev/null || true"),
            "completion_ledger":read_json(DATA/"governance"/"work-items.json"),
            "runtime_summary":summarize_runtime(runtime_root),
            "user_unit_files":run("ls -l /home/ubuntu/.config/systemd/user 2>/dev/null | grep -E 'supervisor|employee|lobster|completion' || true"),
            "employee_runtime":list_runtime(runtime_root),
            "wake_inbox":run("for d in /home/ubuntu/agent-data/employee-wake-inbox /home/ubuntu/agent-data/runtime/employee-wake-inbox; do if [ -d \"$d\" ]; then echo ROOT=$d; ls -lt \"$d\" 2>/dev/null | head -80; fi; done"),
          }
          print(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True))
          PY
