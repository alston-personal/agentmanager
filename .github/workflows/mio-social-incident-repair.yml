name: Mio Social Incident Repair

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        type: string
      source_workflow:
        required: true
        type: string
      incident_issue:
        required: true
        type: string

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: mio-social-incident-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/integration

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Reconcile known Mio social bootstrap drift without consuming Oracle runner
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o ConnectionAttempts=3             -o ServerAliveInterval=10 -o ServerAliveCountMax=3             -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          LIVE=/home/ubuntu/agentmanager
          grep -q 'ACTION_READ_THREADS_WEB_DM' "$LIVE/agentos_node/bootstrap_control.py"
          grep -q 'ACTION_INSPECT_MIO_RECENT' "$LIVE/agentos_node/bootstrap_control.py"
          export XDG_RUNTIME_DIR=/run/user/1001
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          systemctl --user restart os-chronos.service
          systemctl --user is-active os-chronos.service
          echo mio_social_incident_repair=PASS
          REMOTE

      - name: Re-run failed source workflow jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run rerun "${{ inputs.source_run_id }}" --failed --repo "${{ github.repository }}"
          echo mio_source_rerun_dispatched=PASS

      - name: Comment incident
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ inputs.incident_issue }}"             --repo "${{ github.repository }}"             --body "Bounded repair executed. Source run ${{ inputs.source_run_id }} was queued for failed-job re-run. Keep open until a PASS receipt is observed."
