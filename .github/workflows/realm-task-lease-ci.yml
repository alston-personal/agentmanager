name: Realm Task Lease CI

on:
  push:
    branches:
      - fix/realm-task-lease-ack

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Realm fabric transport tests
        run: python -m unittest tests.test_realm_fabric -v
