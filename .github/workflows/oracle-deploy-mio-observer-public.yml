name: Oracle Deploy Mio Observer Public Route

on:
  workflow_dispatch:
  push:
    branches:
      - core/integration
    paths:
      - '.github/workflows/oracle-deploy-mio-observer-public.yml'
      - 'scripts/deploy_studio_web_mio_user.sh'
permissions:
  contents: read

# Core runtime is converged separately; this workflow must not overwrite live bootstrap_control.py.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/integration
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Pin Studio Web exact commit
        shell: bash
        run: |
          set -euo pipefail
          STUDIO_COMMIT="76da89cf58cca7217e6e8f8fe87d2daf5604d7ca"
          printf '%s' "$STUDIO_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          echo "STUDIO_COMMIT=$STUDIO_COMMIT" >> "$GITHUB_ENV"

      - name: Deploy Mio route through bounded bootstrap
        shell: bash
        run: |
          set -euo pipefail
          ID="studio-mio-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RECEIPT="$RUNNER_TEMP/studio-mio-receipt.json"
          EXTRA_PARAMS="$(python3 -c 'import json,os; print(json.dumps({"studio_commit":os.environ["STUDIO_COMMIT"]},separators=(",",":")))' )"
          AGENTOS_RECEIPT_TIMEOUT_SECONDS=660 \
            bash scripts/submit_oracle_bootstrap_request_remote.sh \
              agentos.studio_web_mio.deploy "$ID" "$GITHUB_SHA" "$EXTRA_PARAMS" > "$RECEIPT"

          python3 - "$RECEIPT" "$GITHUB_SHA" "$STUDIO_COMMIT" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r.get("schema")=="agentos.bootstrap-receipt/v1",r
          assert r.get("action")=="agentos.studio_web_mio.deploy",r
          assert r.get("executor_user")=="ubuntu",r
          assert r.get("executor_uid")==1001,r
          assert r.get("source_commit")==sys.argv[2],r
          scheduler=r.get("scheduler") or {}
          assert scheduler.get("worker_role")=="control",scheduler
          assert scheduler.get("worker_id")=="oracle-control",scheduler
          print("agentos_scheduler_worker="+scheduler["worker_id"]+":control")
          assert r.get("ok") is True,r
          text="\n".join(str(s.get("stdout",""))+"\n"+str(s.get("stderr","")) for s in r.get("steps",[]))
          assert "studio_web_mio_public_observer=PASS" in text,text[-16000:]
          assert sys.argv[3] in text,text[-16000:]
          print("mio_observer_public_deploy=PASS")
          PY

      - name: Production acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/production_acceptance.py \
            --url https://studio.milkcat.org/personas/mio/observer/ \
            --home-url https://studio.milkcat.org/ \
            --marker '澪的內心窗口'
          curl -L -fsS --max-time 20 https://studio.milkcat.org/personas/mio/activity.json |
            python3 -m json.tool >/dev/null

          WARDROBE_BODY="$(curl -L -fsS --max-time 20 'https://studio.milkcat.org/personas/mio/wardrobe/?acceptance=76da89c')"
          printf '%s' "$WARDROBE_BODY" | grep -Fq 'MIO DRESS-UP STUDIO · V4 LIVE TRY-ON'
          printf '%s' "$WARDROBE_BODY" | grep -Fq '防潑水帆布鞋'
          printf '%s' "$WARDROBE_BODY" | grep -Fq 'data-tryon-login'
          echo "mio_wardrobe_public_acceptance=PASS"
          echo "mio_observer_public_acceptance=PASS"


# AgentOS scheduler acceptance: verify control lane receipt
