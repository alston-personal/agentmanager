name: Oracle Deploy Mio Observer Public Route

on:
  workflow_dispatch:
  push:
    branches:
      - core/integration
    paths:
      - '.github/workflows/oracle-deploy-mio-observer-public.yml'
      - 'scripts/deploy_studio_web_mio_user.sh'

permissions:
  contents: read

concurrency:
  group: deploy-mio-observer-public
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/integration

      - name: Resolve Studio Web exact main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STUDIO_COMMIT="$(gh api repos/alston-personal/studio-web/commits/main --jq .sha)"
          printf '%s' "$STUDIO_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          echo "STUDIO_COMMIT=$STUDIO_COMMIT" >> "$GITHUB_ENV"

      - name: Deploy Mio route through bounded bootstrap
        shell: bash
        run: |
          set -euo pipefail
          LIVE=/home/ubuntu/agentmanager
          ROOT=/tmp/agentos-bootstrap-control
          REQUESTS="$ROOT/requests"
          RECEIPTS="$ROOT/receipts"
          ID="studio-mio-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REQUEST="$REQUESTS/$ID.request.json"
          RECEIPT="$RECEIPTS/$ID.json"

          cat agentos_node/bootstrap_control.py > "$LIVE/agentos_node/bootstrap_control.py"
          chmod 0664 "$LIVE/agentos_node/bootstrap_control.py" || true
          python3 -m py_compile "$LIVE/agentos_node/bootstrap_control.py"

          for i in $(seq 1 60); do
            [ -d "$REQUESTS" ] && [ -d "$RECEIPTS" ] && break
            sleep 1
          done
          test -d "$REQUESTS"
          test -d "$RECEIPTS"

          python3 - "$REQUEST" "$ID" "$GITHUB_SHA" "$STUDIO_COMMIT" <<'PY'
          import json,os,sys
          from datetime import datetime,timezone
          from pathlib import Path
          path=Path(sys.argv[1])
          payload={
            "schema":"agentos.bootstrap-request/v1",
            "request_id":sys.argv[2],
            "action":"agentos.studio_web_mio.deploy",
            "created_at":datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z"),
            "params":{"source_commit":sys.argv[3],"studio_commit":sys.argv[4]},
            "authority":{"source":"github-actions","target_user":"ubuntu","arbitrary_shell":False},
          }
          tmp=path.with_suffix(path.suffix+".tmp")
          tmp.write_text(json.dumps(payload,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          os.chmod(tmp,0o644); tmp.replace(path); os.chmod(path,0o644)
          PY

          for i in $(seq 1 600); do [ -f "$RECEIPT" ] && break; sleep 1; done
          test -f "$RECEIPT"

          python3 - "$RECEIPT" "$GITHUB_SHA" "$STUDIO_COMMIT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r.get("schema")=="agentos.bootstrap-receipt/v1",r
          assert r.get("action")=="agentos.studio_web_mio.deploy",r
          assert r.get("executor_user")=="ubuntu",r
          assert r.get("executor_uid")==1001,r
          assert r.get("source_commit")==sys.argv[2],r
          assert r.get("ok") is True,r
          text=json.dumps(r,ensure_ascii=False)
          assert "studio_web_mio_public_observer=PASS" in text,r
          assert sys.argv[3] in text,r
          print("mio_observer_public_deploy=PASS")
          PY

      - name: Public acceptance
        shell: bash
        run: |
          set -euo pipefail
          curl -L -fsS --max-time 20 https://studio.milkcat.org/personas/mio/observer/ |
            grep -Fq '澪的內心窗口'
          curl -L -fsS --max-time 20 https://studio.milkcat.org/personas/mio/activity.json |
            python3 -m json.tool >/dev/null
          echo "mio_observer_public_acceptance=PASS"
