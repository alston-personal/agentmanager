name: Low-Latency GUI Agent CI

on:
  pull_request:
    paths:
      - 'agentos_node/desktop_plan.py'
      - 'agentos_node/interactive_desktop.py'
      - 'agentos_node/thin_client.py'
      - 'agentos_node/thin_client_transport.py'
      - 'agent_core/realm_server.py'
      - 'agent_core/product_experience.py'
      - 'tests/test_low_latency_gui_agent.py'
      - 'tests/test_product_experience.py'
      - '.github/workflows/low-latency-gui-agent-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'agentos_node/desktop_plan.py'
      - 'agentos_node/interactive_desktop.py'
      - 'agentos_node/thin_client.py'
      - 'agentos_node/thin_client_transport.py'
      - 'agent_core/realm_server.py'
      - 'agent_core/product_experience.py'
      - 'tests/test_low_latency_gui_agent.py'
      - 'tests/test_product_experience.py'
      - '.github/workflows/low-latency-gui-agent-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile changed runtime modules
        run: |
          python -m py_compile             agentos_node/desktop_plan.py             agentos_node/interactive_desktop.py             agentos_node/thin_client.py             agentos_node/thin_client_transport.py             agent_core/realm_server.py             agent_core/product_experience.py
      - name: Run focused tests
        run: |
          python -m unittest             tests.test_low_latency_gui_agent             tests.test_product_experience
