name: Issue 64 Control Inbox Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue64-control-inbox-acceptance.yml'
      - 'scripts/controller_surface_inspect_vopc5750.sh'

permissions:
  contents: write

concurrency:
  group: issue-64-control-inbox-acceptance
  cancel-in-progress: false

jobs:
  accept:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify authoritative live generation remains healthy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          s=json.load(open('/home/ubuntu/agent-data/governance/core-deployment.json',encoding='utf-8'))
          desired=str(s.get('desired_core_commit') or '')
          observed=str(s.get('observed_core_commit') or '')
          generation=int(s.get('deployment_generation') or 0)
          assert len(desired)==40, s
          assert observed==desired, s
          assert generation >= 2, s
          assert s.get('lease_owner')=='agentos-core-mainline',s
          assert s.get('deployment_status')=='converged',s
          print('issue64_generation='+str(generation))
          print('issue64_desired_core_commit='+desired)
          print('issue64_observed_core_commit='+observed)
          print('issue64_deployment_status='+str(s.get('deployment_status')))
          PY
          test ! -e /home/ubuntu/.config/systemd/user/agentos-realm-fabric.service.d/runtime-generation.conf
          test -f /home/ubuntu/agent-data/governance/legacy-systemd-dropins/agentos-realm-fabric.runtime-generation.conf
          curl -fsS --max-time 3 http://127.0.0.1:8780/v1/health >/dev/null

      - name: Real Control Inbox to ONE ControllerService acceptance
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/agentos-bootstrap-control
          REQUESTS="$ROOT/requests"
          RECEIPTS="$ROOT/receipts"
          for i in $(seq 1 60); do [ -d "$REQUESTS" ] && [ -d "$RECEIPTS" ] && break; sleep 1; done
          test -d "$REQUESTS"; test -d "$RECEIPTS"
          RID="issue64-final-${GITHUB_RUN_ID}-$(date -u +%Y%m%dT%H%M%SZ)"
          REQ="$REQUESTS/$RID.request.json"
          REC="$RECEIPTS/$RID.json"
          python3 - "$REQ" "$RID" <<'PY'
          import json,os,sys
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path(sys.argv[1]); rid=sys.argv[2]
          payload={
              'schema':'agentos.bootstrap-request/v1',
              'request_id':rid,
              'action':'agentos.controller.surface-inspect-vopc5750',
              'created_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'authority':{'source':'github-actions','target_user':'ubuntu','arbitrary_shell':False},
          }
          tmp=p.with_suffix(p.suffix+'.tmp')
          tmp.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          os.chmod(tmp,0o644); tmp.replace(p); os.chmod(p,0o644)
          PY
          for i in $(seq 1 180); do [ -f "$REC" ] && break; sleep 1; done
          test -f "$REC" || { echo issue64_control_inbox_receipt=TIMEOUT; exit 3; }
          cat "$REC"
          python3 - "$REC" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r.get('schema')=='agentos.bootstrap-receipt/v1',r
          assert r.get('action')=='agentos.controller.surface-inspect-vopc5750',r
          assert r.get('executor_user')=='ubuntu',r
          assert r.get('executor_uid')==1001,r
          assert r.get('ok') is True,r
          text='\n'.join((str(s.get('stdout') or '')+'\n'+str(s.get('stderr') or '')) for s in r.get('steps',[]))
          assert 'controller_service_entered=PASS' in text,text[-12000:]
          assert 'controller_dispatch_http_code=404' not in text,text[-12000:]
          Path('/tmp/issue64-control-inbox-final.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('issue64_control_inbox_to_controller=PASS')
          PY

      - name: Publish Issue 64 acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/issue64-control-inbox-final.json
          cp /tmp/issue64-control-inbox-final.json /tmp/issue64-control-inbox-final.keep.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .agentos/evidence/issue-64
          cp /tmp/issue64-control-inbox-final.keep.json .agentos/evidence/issue-64/control-inbox.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/issue-64/control-inbox.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(agentos): accept Issue 64 Control Inbox path'
          git pull --rebase origin main
          git push origin HEAD:main
