name: Vision Studio Rain Exit Export S01

on:
  push:
    branches: [core/integration]
    paths:
      - '.agentos/commands/vision-studio-rain-exit-export-s01.json'

permissions:
  contents: read

jobs:
  export:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded export command
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          p=json.load(open('.agentos/commands/vision-studio-rain-exit-export-s01.json',encoding='utf-8'))
          assert p.get('schema')=='agentos.vision-studio-rain-exit-export/v2'
          assert p.get('project_id')=='rain-exit-v001'
          assert p.get('shot_id')=='s01'
          assert p.get('selector')=='latest-google-flow-today'
          assert re.fullmatch(r'export-rain-exit-s01-20261007-r[0-9]+',str(p.get('nonce') or ''))
          print('vision_studio_rain_exit_export=APPROVED')
          PY
      - name: Locate newest current Google Flow video
        shell: bash
        run: |
          set -euo pipefail
          latest="$(
            for root in /home/ubuntu/agent-data/artifacts/google-flow /home/ubuntu/agent-data/artifacts/google-flow-recovery; do
              [ -d "$root" ] || continue
              find "$root" -type f -name '*.mp4' -newermt '2026-10-07 00:00:00' -printf '%T@ %p\n' 2>/dev/null || true
            done | sort -nr | head -n1 | cut -d' ' -f2-
          )"
          if [ -z "$latest" ] || [ ! -f "$latest" ]; then
            echo "vision_studio_rain_exit_export=NO_CURRENT_VIDEO"
            exit 4
          fi
          sha="$(sha256sum "$latest" | awk '{print $1}')"
          bytes="$(stat -c '%s' "$latest")"
          cp "$latest" "$RUNNER_TEMP/rain-exit-s01-current.mp4"
          printf 'vision_studio_rain_exit_source=%s\n' "$latest"
          printf 'vision_studio_rain_exit_sha256=%s\n' "$sha"
          printf 'vision_studio_rain_exit_bytes=%s\n' "$bytes"
          printf '%s\n' "$sha" > "$RUNNER_TEMP/rain-exit-s01.sha256"
          printf '%s\n' "$latest" > "$RUNNER_TEMP/rain-exit-s01.source.txt"
      - name: Upload current S01 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rain-exit-s01-current-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rain-exit-s01-current.mp4
            ${{ runner.temp }}/rain-exit-s01.sha256
            ${{ runner.temp }}/rain-exit-s01.source.txt
          if-no-files-found: error
          retention-days: 7
