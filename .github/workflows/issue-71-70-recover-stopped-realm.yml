name: Issue 71 70 Recover Stopped Realm

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue-71-70-recover-stopped-realm.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: realm-fabric-deployment-authority
  cancel-in-progress: false

jobs:
  recover-accept:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 18
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      TARGET_CORE_COMMIT: 653bcf1c040748d8d76d8de85ad021cd8d822a0f
      LEASE_OWNER: agentos-core-mainline
      FORENSIC_SHA: d9087bdecd1f2afdbddfde6a81673d35006df17f0e273053367fd4b5d1997a45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify recovery authority and Action Relay v3 runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_CORE_COMMIT"
          git cat-file -e "$TARGET_CORE_COMMIT^{commit}"
          git show "$TARGET_CORE_COMMIT:agent_core/node_registry.py" | grep -q issue70_runtime_provenance_persistence_v1
          runtime=/home/ubuntu/.local/share/agentos/action-relay-runtime/agentos_node/action_relay.py
          grep -q issue71_node_registry_repair_action_v1 "$runtime"
          grep -q issue71_node_registry_forensic_digest_bridge_v2 "$runtime"
          grep -q issue71_node_registry_ubuntu_preserve_v3 "$runtime"
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('/home/ubuntu/agent-data/governance/core-deployment.json').read_text(encoding='utf-8'))
          assert int(s.get('deployment_generation') or 0)==3,s
          assert s.get('desired_core_commit')=='dedca4b1894987c4ed23fa43c442dbc11810b623',s
          assert s.get('observed_core_commit')==s.get('desired_core_commit'),s
          assert s.get('lease_owner')=='agentos-core-mainline',s
          assert s.get('lease_status')=='released',s
          assert s.get('deployment_status')=='converged',s
          print('recovery_generation3_released=PASS')
          PY

      - name: Repair live registry through already-running ubuntu Action Relay
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,time
          from pathlib import Path
          from agentos_node.action_relay import ActionRelayClient
          p=Path('/home/ubuntu/agent-data/realm/nodes.json')
          raw=p.read_bytes()
          existing_valid=False
          try:
              d=json.loads(raw.decode('utf-8'))
              existing_valid=(d.get('schema')=='agentos.node-registry/v0.1' and d.get('realm_id')=='realm-alston' and len(d.get('nodes') or {})==2)
          except Exception:
              d=None
          if existing_valid:
              evidence={'ok':True,'stage':'already_repaired','repair_mode':'already_valid','post_repair_sha256':hashlib.sha256(raw).hexdigest(),'realm_id':'realm-alston','node_count':2}
          else:
              assert hashlib.sha256(raw).hexdigest()=='d9087bdecd1f2afdbddfde6a81673d35006df17f0e273053367fd4b5d1997a45'
              c=ActionRelayClient('/home/ubuntu/agent-data/runtime/action-relay')
              cap=c.submit('agentos.maintenance.issue71_repair_node_registry',{})
              deadline=time.time()+90; evidence=None
              while time.time()<deadline:
                  evidence=c.receipt(cap['capsule_id'])
                  if evidence is not None: break
                  time.sleep(1)
              assert evidence is not None,'repair receipt timeout'
              assert evidence.get('action')=='agentos.maintenance.issue71_repair_node_registry',evidence
              assert evidence.get('executor_user')=='ubuntu',evidence
              assert evidence.get('ok') is True,evidence
              assert evidence.get('stage')=='repaired',evidence
              assert evidence.get('forensic_sha256')=='d9087bdecd1f2afdbddfde6a81673d35006df17f0e273053367fd4b5d1997a45',evidence
          repaired=json.loads(p.read_text(encoding='utf-8'))
          assert repaired.get('schema')=='agentos.node-registry/v0.1' and repaired.get('realm_id')=='realm-alston' and len(repaired.get('nodes') or {})==2,repaired
          Path('/tmp/issue71-recovery-repair.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(evidence,ensure_ascii=False,indent=2,sort_keys=True))
          print('issue71_registry_repair=PASS')
          PY

      - name: Advance generation 3 to target generation 4
        id: advance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time
          from pathlib import Path
          from agentos_node.action_relay import ActionRelayClient
          s=json.loads(Path('/home/ubuntu/agent-data/governance/core-deployment.json').read_text(encoding='utf-8'))
          target=os.environ['TARGET_CORE_COMMIT']
          if int(s.get('deployment_generation') or 0)==4 and s.get('desired_core_commit')==target:
              assert s.get('lease_status')=='active',s
              print('generation4_already_advanced=PASS')
              raise SystemExit(0)
          assert int(s.get('deployment_generation') or 0)==3 and s.get('lease_status')=='released',s
          c=ActionRelayClient('/home/ubuntu/agent-data/runtime/action-relay')
          cap=c.submit('agentos.realm-fabric.advance_deployment',{
            'current_desired_core_commit':s['desired_core_commit'],
            'next_desired_core_commit':target,
            'lease_owner':os.environ['LEASE_OWNER'],
            'expected_generation':3,
            'lease_seconds':900,
          })
          deadline=time.time()+60; r=None
          while time.time()<deadline:
              r=c.receipt(cap['capsule_id'])
              if r is not None: break
              time.sleep(1)
          assert r is not None and r.get('ok') is True,r
          assert r.get('desired_core_commit')==target and int(r.get('deployment_generation'))==4,r
          assert r.get('lease_status')=='active',r
          print('generation4_advance=PASS')
          PY

      - name: Install generation 4 through canonical CAS fence
        id: install
        shell: bash
        run: |
          set -euo pipefail
          export AGENTOS_REALM_FABRIC_SOURCE_COMMIT="$TARGET_CORE_COMMIT"
          python3 scripts/install_realm_fabric_via_action_relay.py
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          target=os.environ['TARGET_CORE_COMMIT']
          r=json.loads(Path('.agentos/evidence/realm-fabric-install-current.json').read_text(encoding='utf-8'))
          assert r.get('desired_core_commit')==target and r.get('observed_core_commit')==target,r
          assert int(r.get('deployment_generation'))==4,r
          assert r.get('deployment_status')=='converged',r
          print('generation4_install_converged=PASS')
          PY

      - name: Wait for real vopc5750 heartbeat and runtime provenance
        id: node
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,time
          from pathlib import Path
          from agent_core.node_registry import NodeRegistry
          p=Path('/home/ubuntu/agent-data/realm/nodes.json')
          initial=json.loads(p.read_text(encoding='utf-8'))
          before=((initial.get('nodes') or {}).get('vopc5750') or {}).get('last_heartbeat_at')
          accepted=None; samples=[]; deadline=time.time()+360
          while time.time()<deadline:
              raw=p.read_bytes(); d=json.loads(raw.decode('utf-8'))
              assert d.get('schema')=='agentos.node-registry/v0.1'
              samples.append(hashlib.sha256(raw).hexdigest())
              n=(d.get('nodes') or {}).get('vopc5750') or {}; runtime=n.get('runtime') or {}; after=n.get('last_heartbeat_at')
              if after and after!=before and str(runtime.get('source_commit') or '').strip():
                  accepted={'heartbeat_before':before,'heartbeat_after':after,'runtime':runtime,'node':n}; break
              time.sleep(5)
          assert accepted is not None,{'heartbeat_before':before,'sample_count':len(samples)}
          for _ in range(6):
              time.sleep(5); raw=p.read_bytes(); d=json.loads(raw.decode('utf-8')); assert d.get('schema')=='agentos.node-registry/v0.1'; samples.append(hashlib.sha256(raw).hexdigest())
          nm=NodeRegistry(p).node_map(); matches=[n for n in nm.get('nodes',[]) if n.get('node_id')=='vopc5750']
          assert len(matches)==1 and str((matches[0].get('runtime') or {}).get('source_commit') or '').strip(),matches
          ev={'schema':'agentos.issue-70-node-runtime-acceptance/v1','node_id':'vopc5750','heartbeat_before':accepted['heartbeat_before'],'heartbeat_after':accepted['heartbeat_after'],'runtime':accepted['runtime'],'capabilities':accepted['node'].get('capabilities'),'surface_count':accepted['node'].get('surface_count'),'surface_inventory':accepted['node'].get('surface_inventory'),'node_map_runtime':matches[0].get('runtime'),'node_map_status':matches[0].get('status'),'registry_valid_sample_count':len(samples),'registry_last_sha256':samples[-1]}
          Path('/tmp/issue70-recovery-runtime.json').write_text(json.dumps(ev,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(ev,ensure_ascii=False,indent=2,sort_keys=True))
          print('issue70_real_vopc_runtime=PASS')
          print('issue71_live_registry_stability=PASS')
          PY

      - name: Regress Control Inbox to ControllerService
        id: controller
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/agentos-bootstrap-control; REQUESTS="$ROOT/requests"; RECEIPTS="$ROOT/receipts"
          for i in $(seq 1 60); do [ -d "$REQUESTS" ] && [ -d "$RECEIPTS" ] && break; sleep 1; done
          test -d "$REQUESTS"; test -d "$RECEIPTS"
          RID="issue71-recovery-${GITHUB_RUN_ID}-$(date -u +%Y%m%dT%H%M%SZ)"; REQ="$REQUESTS/$RID.request.json"; REC="$RECEIPTS/$RID.json"
          python3 - "$REQ" "$RID" <<'PY'
          import json,os,sys
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path(sys.argv[1]); rid=sys.argv[2]
          v={'schema':'agentos.bootstrap-request/v1','request_id':rid,'action':'agentos.controller.surface-inspect-vopc5750','created_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'authority':{'source':'github-actions','target_user':'ubuntu','arbitrary_shell':False}}
          t=p.with_suffix(p.suffix+'.tmp'); t.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); os.chmod(t,0o644); t.replace(p); os.chmod(p,0o644)
          PY
          for i in $(seq 1 180); do [ -f "$REC" ] && break; sleep 1; done
          test -f "$REC"
          python3 - "$REC" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert r.get('schema')=='agentos.bootstrap-receipt/v1' and r.get('ok') is True,r
          assert r.get('executor_user')=='ubuntu' and r.get('executor_uid')==1001,r
          text='\n'.join(str(s.get('stdout') or '')+'\n'+str(s.get('stderr') or '') for s in r.get('steps',[]))
          assert 'controller_service_entered=PASS' in text,text[-12000:]
          assert 'controller_dispatch_http_code=404' not in text,text[-12000:]
          Path('/tmp/issue71-recovery-controller.json').write_text(json.dumps(r,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('controller_service_regression=PASS')
          PY

      - name: Release generation 4 and persist acceptance
        id: final
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time
          from datetime import datetime,timezone
          from pathlib import Path
          from agentos_node.action_relay import ActionRelayClient
          c=ActionRelayClient('/home/ubuntu/agent-data/runtime/action-relay'); target=os.environ['TARGET_CORE_COMMIT']
          cap=c.submit('agentos.realm-fabric.release_deployment',{'desired_core_commit':target,'lease_owner':os.environ['LEASE_OWNER'],'deployment_generation':4})
          deadline=time.time()+60; r=None
          while time.time()<deadline:
              r=c.receipt(cap['capsule_id'])
              if r is not None: break
              time.sleep(1)
          assert r is not None and r.get('ok') is True,r
          assert r.get('desired_core_commit')==target and r.get('observed_core_commit')==target,r
          assert r.get('deployment_status')=='converged' and r.get('lease_status')=='released',r
          summary={'schema':'agentos.issue-71-70-live-acceptance/v1','accepted_at':datetime.now(timezone.utc).isoformat(),'live_core_commit':target,'deployment_generation':4,'deployment_status':'converged','lease_status':'released','repair':json.loads(Path('/tmp/issue71-recovery-repair.json').read_text()),'runtime_acceptance':json.loads(Path('/tmp/issue70-recovery-runtime.json').read_text()),'controller_receipt':json.loads(Path('/tmp/issue71-recovery-controller.json').read_text()),'gates':{'issue71_forensic_preserved':True,'issue71_registry_repaired':True,'issue71_concurrent_regression':True,'issue71_repeated_live_reads_valid':True,'issue70_real_vopc_runtime_source_commit':True,'controller_service_regression':True,'client_resume_allowed':True}}
          Path('/tmp/issue71-70-recovery-final.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('generation4_release=PASS')
          print('CLIENT_RESUME_ALLOWED=true')
          PY
          cp /tmp/issue71-70-recovery-final.json /tmp/final.keep.json; cp /tmp/issue71-recovery-repair.json /tmp/repair.keep.json; cp /tmp/issue70-recovery-runtime.json /tmp/runtime.keep.json
          git fetch origin main; git reset --hard origin/main
          mkdir -p .agentos/evidence/issue-71 .agentos/evidence/issue-70
          cp /tmp/final.keep.json .agentos/evidence/issue-71/live-acceptance.json
          cp /tmp/repair.keep.json .agentos/evidence/issue-71/repair.json
          cp /tmp/runtime.keep.json .agentos/evidence/issue-70/runtime-provenance.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/issue-71 .agentos/evidence/issue-70
          if ! git diff --cached --quiet; then git commit -m 'evidence(agentos): accept Issues 71 and 70 live'; git pull --rebase origin main; git push origin HEAD:main; fi
          RUNTIME_COMMIT="$(python3 -c "import json;print(json.load(open('/tmp/runtime.keep.json'))['runtime']['source_commit'])")"
          B71=$(printf '%s\n' '<!-- agentos-issue-71-live-acceptance -->' 'Issue #71 live acceptance: PASS.' '' '- forensic preservation: PASS' '- governed registry repair: PASS' '- transaction-safe concurrent regression: PASS' '- repeated live registry readability: PASS' "- live Core commit: ${TARGET_CORE_COMMIT}" '- deployment generation: 4' '- final lease status: released' '- ControllerService regression: PASS' '- CLIENT_RESUME_ALLOWED: true')
          gh api "repos/${GITHUB_REPOSITORY}/issues/71/comments" -f body="$B71"
          B70=$(printf '%s\n' '<!-- agentos-issue-70-live-acceptance -->' 'Issue #70 live acceptance: PASS.' '' '- real vopc5750 heartbeat: PASS' "- runtime.source_commit: ${RUNTIME_COMMIT}" "- live Core commit: ${TARGET_CORE_COMMIT}" '- deployment generation: 4' '- ControllerService regression: PASS' '- CLIENT_RESUME_ALLOWED: true')
          gh api "repos/${GITHUB_REPOSITORY}/issues/70/comments" -f body="$B70"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/71" -f state=closed -f state_reason=completed >/dev/null
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/70" -f state=closed -f state_reason=completed >/dev/null
