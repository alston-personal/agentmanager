name: Issue 71 70 Resume After Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue-71-70-resume-after-repair.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: realm-fabric-deployment-authority
  cancel-in-progress: false

jobs:
  resume-accept:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 18
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      TARGET_CORE_COMMIT: 2fd2d052a3453aec8e3ec01f17fc48e1b1f94199
      LEASE_OWNER: agentos-core-mainline
      FORENSIC_SHA: d9087bdecd1f2afdbddfde6a81673d35006df17f0e273053367fd4b5d1997a45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify successful governed repair receipt and released generation 3
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_CORE_COMMIT"
          git cat-file -e "$TARGET_CORE_COMMIT^{commit}"
          git show "$TARGET_CORE_COMMIT:agent_core/node_registry.py" | grep -q node_registry_shared_observability_v1
          git show "$TARGET_CORE_COMMIT:agent_core/node_registry.py" | grep -q issue70_runtime_provenance_persistence_v1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          state=json.loads(Path('/home/ubuntu/agent-data/governance/core-deployment.json').read_text(encoding='utf-8'))
          assert int(state.get('deployment_generation') or 0)==3,state
          assert state.get('desired_core_commit')=='dedca4b1894987c4ed23fa43c442dbc11810b623',state
          assert state.get('observed_core_commit')==state.get('desired_core_commit'),state
          assert state.get('lease_owner')=='agentos-core-mainline',state
          assert state.get('lease_status')=='released',state
          assert state.get('deployment_status')=='converged',state

          receipts=Path('/home/ubuntu/agent-data/runtime/action-relay/receipts')
          matches=[]
          for p in receipts.glob('*.json'):
              try:
                  r=json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if r.get('action')!='agentos.maintenance.issue71_repair_node_registry':
                  continue
              if r.get('executor_user')!='ubuntu' or r.get('ok') is not True or r.get('stage')!='repaired':
                  continue
              if r.get('forensic_sha256')!='d9087bdecd1f2afdbddfde6a81673d35006df17f0e273053367fd4b5d1997a45':
                  continue
              if r.get('node_count')!=2 or r.get('realm_id')!='realm-alston':
                  continue
              matches.append((p.stat().st_mtime,p,r))
          assert matches,'no successful governed Issue 71 repair receipt found'
          matches.sort(key=lambda x:x[0])
          _,p,r=matches[-1]
          Path('/tmp/issue71-successful-repair-receipt.json').write_text(json.dumps(r,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('successful_repair_receipt='+str(p))
          print('repair_mode='+str(r.get('repair_mode')))
          print('post_repair_sha256='+str(r.get('post_repair_sha256')))
          print('resume_preflight=PASS')
          PY

      - name: Advance generation 3 to generation 4
        id: advance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          from agentos_node.action_relay import ActionRelayClient
          target=os.environ['TARGET_CORE_COMMIT']; owner=os.environ['LEASE_OWNER']
          s=json.loads(Path('/home/ubuntu/agent-data/governance/core-deployment.json').read_text(encoding='utf-8'))
          c=ActionRelayClient('/home/ubuntu/agent-data/runtime/action-relay')
          cap=c.submit('agentos.realm-fabric.advance_deployment',{
              'current_desired_core_commit':s['desired_core_commit'],
              'next_desired_core_commit':target,
              'lease_owner':owner,
              'expected_generation':3,
              'lease_seconds':900,
          })
          deadline=time.time()+60; r=None
          while time.time()<deadline:
              r=c.receipt(cap['capsule_id'])
              if r is not None: break
              time.sleep(1)
          assert r is not None and r.get('ok') is True,r
          assert r.get('desired_core_commit')==target and int(r.get('deployment_generation'))==4,r
          assert r.get('lease_status')=='active',r
          Path('/tmp/issue71-advance-generation4.json').write_text(json.dumps(r,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('generation4_advance=PASS')
          PY

      - name: Install exact generation 4 through canonical CAS fence
        id: install
        shell: bash
        run: |
          set -euo pipefail
          export AGENTOS_REALM_FABRIC_SOURCE_COMMIT="$TARGET_CORE_COMMIT"
          python3 scripts/install_realm_fabric_via_action_relay.py
          INSTALL_EPOCH="$(date +%s)"
          echo "INSTALL_EPOCH=$INSTALL_EPOCH" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          target=os.environ['TARGET_CORE_COMMIT']
          r=json.loads(Path('.agentos/evidence/realm-fabric-install-current.json').read_text(encoding='utf-8'))
          assert r.get('desired_core_commit')==target and r.get('observed_core_commit')==target,r
          assert int(r.get('deployment_generation'))==4,r
          assert r.get('deployment_status')=='converged',r
          Path('/tmp/issue71-install-generation4.json').write_text(json.dumps(r,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('generation4_install_converged=PASS')
          PY

      - name: Accept first real post-install vopc5750 heartbeat through new writer
        id: node
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,stat,time
          from pathlib import Path
          from agent_core.node_registry import NodeRegistry
          p=Path('/home/ubuntu/agent-data/realm/nodes.json')
          install_epoch=int(os.environ['INSTALL_EPOCH'])
          accepted=None; samples=[]; deadline=time.time()+420
          while time.time()<deadline:
              try:
                  raw=p.read_bytes()
              except PermissionError:
                  time.sleep(5); continue
              st=p.stat()
              mode=stat.S_IMODE(st.st_mode)
              try:
                  d=json.loads(raw.decode('utf-8'))
              except Exception as exc:
                  raise AssertionError('registry readable but invalid JSON: '+repr(exc))
              assert d.get('schema')=='agentos.node-registry/v0.1',d.get('schema')
              samples.append({'sha256':hashlib.sha256(raw).hexdigest(),'mtime':st.st_mtime,'mode':oct(mode)})
              n=(d.get('nodes') or {}).get('vopc5750') or {}
              runtime=n.get('runtime') or {}
              if (mode & 0o040) and st.st_mtime >= install_epoch and str(runtime.get('source_commit') or '').strip():
                  accepted={'node':n,'runtime':runtime,'mtime':st.st_mtime,'mode':oct(mode)}
                  break
              time.sleep(5)
          assert accepted is not None,{'install_epoch':install_epoch,'samples':samples[-10:]}
          for _ in range(6):
              time.sleep(5)
              raw=p.read_bytes(); d=json.loads(raw.decode('utf-8')); assert d.get('schema')=='agentos.node-registry/v0.1'; samples.append({'sha256':hashlib.sha256(raw).hexdigest(),'mtime':p.stat().st_mtime,'mode':oct(stat.S_IMODE(p.stat().st_mode))})
          nm=NodeRegistry(p).node_map(); matches=[n for n in nm.get('nodes',[]) if n.get('node_id')=='vopc5750']
          assert len(matches)==1,matches
          assert str((matches[0].get('runtime') or {}).get('source_commit') or '').strip(),matches[0]
          ev={
              'schema':'agentos.issue-70-node-runtime-acceptance/v1',
              'node_id':'vopc5750',
              'post_install_registry_mtime':accepted['mtime'],
              'registry_mode':accepted['mode'],
              'runtime':accepted['runtime'],
              'last_heartbeat_at':accepted['node'].get('last_heartbeat_at'),
              'capabilities':accepted['node'].get('capabilities'),
              'surface_count':accepted['node'].get('surface_count'),
              'surface_inventory':accepted['node'].get('surface_inventory'),
              'node_map_runtime':matches[0].get('runtime'),
              'node_map_status':matches[0].get('status'),
              'registry_valid_sample_count':len(samples),
              'registry_last_sha256':samples[-1]['sha256'],
              'proof':'registry became agentos-group-readable only after a post-install write by the new NodeRegistry writer',
          }
          Path('/tmp/issue70-postinstall-runtime.json').write_text(json.dumps(ev,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(ev,ensure_ascii=False,indent=2,sort_keys=True))
          print('issue70_real_postinstall_heartbeat=PASS')
          print('issue71_live_registry_stability=PASS')
          PY

      - name: Regress real Control Inbox to ControllerService
        id: controller
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/agentos-bootstrap-control; REQUESTS="$ROOT/requests"; RECEIPTS="$ROOT/receipts"
          for i in $(seq 1 60); do [ -d "$REQUESTS" ] && [ -d "$RECEIPTS" ] && break; sleep 1; done
          test -d "$REQUESTS"; test -d "$RECEIPTS"
          RID="issue71-resume-${GITHUB_RUN_ID}-$(date -u +%Y%m%dT%H%M%SZ)"; REQ="$REQUESTS/$RID.request.json"; REC="$RECEIPTS/$RID.json"
          python3 - "$REQ" "$RID" <<'PY'
          import json,os,sys
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path(sys.argv[1]); rid=sys.argv[2]
          v={'schema':'agentos.bootstrap-request/v1','request_id':rid,'action':'agentos.controller.surface-inspect-vopc5750','created_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'authority':{'source':'github-actions','target_user':'ubuntu','arbitrary_shell':False}}
          t=p.with_suffix(p.suffix+'.tmp'); t.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); os.chmod(t,0o644); t.replace(p); os.chmod(p,0o644)
          PY
          for i in $(seq 1 180); do [ -f "$REC" ] && break; sleep 1; done
          test -f "$REC" || { echo controller_receipt=TIMEOUT; exit 3; }
          python3 - "$REC" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert r.get('schema')=='agentos.bootstrap-receipt/v1' and r.get('ok') is True,r
          assert r.get('executor_user')=='ubuntu' and r.get('executor_uid')==1001,r
          text='\n'.join(str(s.get('stdout') or '')+'\n'+str(s.get('stderr') or '') for s in r.get('steps',[]))
          assert 'controller_service_entered=PASS' in text,text[-12000:]
          assert 'controller_dispatch_http_code=404' not in text,text[-12000:]
          Path('/tmp/issue71-resume-controller.json').write_text(json.dumps(r,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('controller_service_regression=PASS')
          PY

      - name: Release generation 4 and persist final acceptance
        id: final
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time
          from datetime import datetime,timezone
          from pathlib import Path
          from agentos_node.action_relay import ActionRelayClient
          target=os.environ['TARGET_CORE_COMMIT']; owner=os.environ['LEASE_OWNER']
          c=ActionRelayClient('/home/ubuntu/agent-data/runtime/action-relay')
          cap=c.submit('agentos.realm-fabric.release_deployment',{'desired_core_commit':target,'lease_owner':owner,'deployment_generation':4})
          deadline=time.time()+60; r=None
          while time.time()<deadline:
              r=c.receipt(cap['capsule_id'])
              if r is not None: break
              time.sleep(1)
          assert r is not None and r.get('ok') is True,r
          assert r.get('desired_core_commit')==target and r.get('observed_core_commit')==target,r
          assert r.get('deployment_status')=='converged' and r.get('lease_status')=='released',r
          summary={
              'schema':'agentos.issue-71-70-live-acceptance/v1',
              'accepted_at':datetime.now(timezone.utc).isoformat(),
              'live_core_commit':target,
              'deployment_generation':4,
              'deployment_status':'converged',
              'lease_status':'released',
              'repair_receipt':json.loads(Path('/tmp/issue71-successful-repair-receipt.json').read_text()),
              'runtime_acceptance':json.loads(Path('/tmp/issue70-postinstall-runtime.json').read_text()),
              'controller_receipt':json.loads(Path('/tmp/issue71-resume-controller.json').read_text()),
              'gates':{
                  'issue71_forensic_preserved':True,
                  'issue71_governed_registry_repair':True,
                  'issue71_concurrent_regression':True,
                  'issue71_repeated_live_reads_valid':True,
                  'issue70_real_postinstall_vopc_runtime_source_commit':True,
                  'controller_service_regression':True,
                  'client_resume_allowed':True,
              },
          }
          Path('/tmp/issue71-70-resume-final.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('generation4_release=PASS')
          print('CLIENT_RESUME_ALLOWED=true')
          PY

          cp /tmp/issue71-70-resume-final.json /tmp/final.keep.json
          cp /tmp/issue71-successful-repair-receipt.json /tmp/repair.keep.json
          cp /tmp/issue70-postinstall-runtime.json /tmp/runtime.keep.json
          git fetch origin main; git reset --hard origin/main
          mkdir -p .agentos/evidence/issue-71 .agentos/evidence/issue-70
          cp /tmp/final.keep.json .agentos/evidence/issue-71/live-acceptance.json
          cp /tmp/repair.keep.json .agentos/evidence/issue-71/repair.json
          cp /tmp/runtime.keep.json .agentos/evidence/issue-70/runtime-provenance.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/issue-71 .agentos/evidence/issue-70
          if ! git diff --cached --quiet; then git commit -m 'evidence(agentos): accept Issues 71 and 70 live'; git pull --rebase origin main; git push origin HEAD:main; fi
          RUNTIME_COMMIT="$(python3 -c "import json;print(json.load(open('/tmp/runtime.keep.json'))['runtime']['source_commit'])")"
          B71=$(printf '%s\n' '<!-- agentos-issue-71-live-acceptance -->' 'Issue #71 live acceptance: PASS.' '' '- forensic preservation: PASS' '- governed ubuntu Action Relay repair: PASS' '- transaction-safe concurrent writer regression: PASS' '- post-install repeated registry readability: PASS' "- live Core commit: ${TARGET_CORE_COMMIT}" '- deployment generation: 4' '- final lease status: released' '- ControllerService regression: PASS' '- CLIENT_RESUME_ALLOWED: true')
          gh api "repos/${GITHUB_REPOSITORY}/issues/71/comments" -f body="$B71"
          B70=$(printf '%s\n' '<!-- agentos-issue-70-live-acceptance -->' 'Issue #70 live acceptance: PASS.' '' '- real post-install vopc5750 heartbeat: PASS' "- runtime.source_commit: ${RUNTIME_COMMIT}" "- live Core commit: ${TARGET_CORE_COMMIT}" '- deployment generation: 4' '- ControllerService regression: PASS' '- CLIENT_RESUME_ALLOWED: true')
          gh api "repos/${GITHUB_REPOSITORY}/issues/70/comments" -f body="$B70"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/71" -f state=closed -f state_reason=completed >/dev/null
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/70" -f state=closed -f state_reason=completed >/dev/null
