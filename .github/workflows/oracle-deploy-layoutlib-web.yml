name: Oracle Deploy LayoutLib Web UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-deploy-layoutlib-web.yml'
      - 'scripts/bootstrap_layoutlib.py'
      - 'scripts/bootstrap_layoutlib_web.py'
      - 'scripts/bootstrap_layoutlib_hardening.py'
      - 'scripts/core_services/port_manager.py'

permissions:
  contents: write

jobs:
  deploy-web-ui:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Deploy persistent LayoutLib web UI and public tunnel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT="$PWD/.agentos/evidence/layoutlib-public-web.txt"
          DATA=/home/ubuntu/agent-data
          CODE=/home/agentos-node/projects/layoutlib
          USER_BIN="$HOME/.local/bin"
          RUNTIME="$DATA/runtime/layoutlib-web"
          mkdir -p "$CODE" "$USER_BIN" "$RUNTIME"

          stop_pidfile() {
            local pf="$1"
            if [ -f "$pf" ]; then
              local pid
              pid=$(cat "$pf" 2>/dev/null || true)
              if [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid" 2>/dev/null; then
                kill "$pid" 2>/dev/null || true
                for _ in $(seq 1 20); do
                  kill -0 "$pid" 2>/dev/null || break
                  sleep 0.1
                done
              fi
              rm -f "$pf"
            fi
          }

          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "hostname=$(hostname)"
            echo "identity=$(id)"
            echo "home=$HOME"
            echo "python=$(python3 --version 2>&1)"

            python3 scripts/bootstrap_layoutlib.py --target "$CODE"
            python3 scripts/bootstrap_layoutlib_web.py --target "$CODE"
            python3 scripts/bootstrap_layoutlib_hardening.py --target "$CODE"

            echo '=== PORT ALLOCATION ==='
            PORT_OUTPUT=$(AGENT_DATA_ROOT="$DATA" python3 scripts/core_services/port_manager.py allocate layoutlib-web --desc 'LayoutLib persistent Web UI/API' --start 8765 --end 8799)
            echo "$PORT_OUTPUT"
            PORT=$(AGENT_DATA_ROOT="$DATA" python3 scripts/core_services/port_manager.py list --json | python3 -c 'import json,sys; d=json.load(sys.stdin); xs=[int(k) for k,v in d.items() if v.get("project")=="layoutlib-web"]; print(min(xs))')
            echo "layoutlib_port=$PORT"

            echo '=== START WEB DAEMON ==='
            WEB_PID="$RUNTIME/web.pid"
            WEB_LOG="$RUNTIME/web.log"
            stop_pidfile "$WEB_PID"
            : > "$WEB_LOG"
            (
              unset RUNNER_TRACKING_ID
              nohup env PYTHONPATH="$CODE/src" LAYOUTLIB_WEB_QUIET=1 \
                /usr/bin/python3 "$CODE/web_demo/server.py" --host 127.0.0.1 --port "$PORT" \
                >>"$WEB_LOG" 2>&1 </dev/null &
              echo $! > "$WEB_PID"
            )
            sleep 1
            WPID=$(cat "$WEB_PID")
            kill -0 "$WPID"
            echo "web_pid=$WPID"

            echo '=== LOCAL WEB PROBE ==='
            python3 - "$PORT" <<'PY'
          import json,sys,time,urllib.request
          port=int(sys.argv[1]); last=None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(f'http://127.0.0.1:{port}/api/health', timeout=2) as r:
                      data=json.load(r)
                  assert data.get('ok') is True, data
                  print('local_web_health=PASS')
                  break
              except Exception as exc:
                  last=exc; time.sleep(.2)
          else:
              raise SystemExit(f'local web health failed: {last}')
          PY

            echo '=== CLOUDFLARED USER INSTALL ==='
            CF="$USER_BIN/cloudflared"
            if [ ! -x "$CF" ]; then
              case "$(uname -m)" in
                aarch64|arm64) ASSET=cloudflared-linux-arm64 ;;
                x86_64|amd64) ASSET=cloudflared-linux-amd64 ;;
                *) echo "unsupported_arch=$(uname -m)"; exit 3 ;;
              esac
              curl -fL --retry 3 --connect-timeout 10 --max-time 120 \
                "https://github.com/cloudflare/cloudflared/releases/latest/download/$ASSET" -o "$CF"
              chmod 0755 "$CF"
            fi
            "$CF" --version

            echo '=== START PUBLIC QUICK TUNNEL ==='
            TUNNEL_PID="$RUNTIME/tunnel.pid"
            TUNNEL_LOG="$RUNTIME/tunnel.log"
            stop_pidfile "$TUNNEL_PID"
            : > "$TUNNEL_LOG"
            (
              unset RUNNER_TRACKING_ID
              nohup "$CF" tunnel --no-autoupdate --protocol http2 --url "http://127.0.0.1:$PORT" \
                >>"$TUNNEL_LOG" 2>&1 </dev/null &
              echo $! > "$TUNNEL_PID"
            )
            TPID=$(cat "$TUNNEL_PID")
            echo "tunnel_pid=$TPID"

            PUBLIC_URL=''
            for _ in $(seq 1 90); do
              kill -0 "$TPID" 2>/dev/null || { echo 'tunnel_process_exited=YES'; cat "$TUNNEL_LOG"; exit 4; }
              PUBLIC_URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "$TUNNEL_LOG" | tail -n 1 || true)
              [ -n "$PUBLIC_URL" ] && break
              sleep 1
            done
            if [ -z "$PUBLIC_URL" ]; then
              echo 'cloudflare_quick_tunnel_url=NOT_FOUND'
              cat "$TUNNEL_LOG" || true
              exit 5
            fi
            echo "public_url=$PUBLIC_URL/"

            echo '=== EXTERNAL PUBLIC WEB PROBE ==='
            HEALTH_CODE=''
            for _ in $(seq 1 30); do
              HEALTH_CODE=$(curl -sS -o /tmp/layoutlib-public-health -w '%{http_code}' --connect-timeout 5 --max-time 12 "$PUBLIC_URL/api/health" 2>/dev/null || true)
              [ "$HEALTH_CODE" = 200 ] && break
              sleep 1
            done
            echo "public_health_http_code=${HEALTH_CODE:-000}"
            test "$HEALTH_CODE" = 200
            python3 - <<'PY'
          import json
          data=json.load(open('/tmp/layoutlib-public-health'))
          assert data.get('ok') is True and data.get('service')=='layoutlib-web', data
          print('public_health_payload=PASS')
          PY

            UI_CODE=$(curl -sS -o /tmp/layoutlib-public-ui -w '%{http_code}' --connect-timeout 5 --max-time 15 "$PUBLIC_URL/" 2>/dev/null || true)
            echo "public_ui_http_code=${UI_CODE:-000}"
            test "$UI_CODE" = 200
            grep -q 'LayoutLib' /tmp/layoutlib-public-ui
            echo 'public_ui_payload=PASS'

            echo '=== PUBLIC PARSE PROBE ==='
            python3 - "$PUBLIC_URL" "$CODE/tests/fixtures/demo_room.pgm" <<'PY'
          import base64,json,sys,urllib.request
          base=sys.argv[1].rstrip('/')
          raw=open(sys.argv[2],'rb').read()
          payload=json.dumps({
              'filename':'demo_room.pgm',
              'content_base64':base64.b64encode(raw).decode(),
              'meters_per_pixel':0.02,
              'min_wall_length_px':30,
          }).encode()
          req=urllib.request.Request(base+'/api/parse', data=payload, headers={'Content-Type':'application/json','User-Agent':'LayoutLib-acceptance/1.0'}, method='POST')
          with urllib.request.urlopen(req, timeout=25) as r:
              data=json.load(r)
          assert data.get('ok') is True, data
          assert data.get('wall_count')==4, data
          print('public_parse=PASS walls=4 spatial_ir='+data['ir']['version'])
          PY

            kill -0 "$WPID"
            kill -0 "$TPID"
            echo 'daemon_survival_during_acceptance=PASS'

            echo '=== ACCEPTANCE ==='
            echo 'persistent_web_daemon=PASS'
            echo 'persistent_tunnel_daemon=PASS'
            echo "port=$PORT"
            echo "public_url=$PUBLIC_URL/"
            echo 'public_health=PASS'
            echo 'public_ui=PASS'
            echo 'public_parse=PASS'
            echo 'goal_direct_web_ui=PASS'
          } 2>&1 | tee "$OUT"

      - name: Commit deployment evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .agentos/evidence/layoutlib-public-web.txt || printf 'deployment_step_did_not_create_evidence=YES\n' > .agentos/evidence/layoutlib-public-web.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/layoutlib-public-web.txt
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(layoutlib): public Web UI deployment diagnostics'
          git push
