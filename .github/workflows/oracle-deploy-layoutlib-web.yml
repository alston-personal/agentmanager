name: Oracle Deploy LayoutLib Web UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-deploy-layoutlib-web.yml'
      - 'scripts/bootstrap_layoutlib.py'
      - 'scripts/bootstrap_layoutlib_web.py'
      - 'scripts/bootstrap_layoutlib_hardening.py'
      - 'scripts/core_services/port_manager.py'

permissions:
  contents: write

jobs:
  deploy-web-ui:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Deploy and accept public LayoutLib Web UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT="$PWD/.agentos/evidence/layoutlib-public-web.txt"
          DATA=/home/ubuntu/agent-data
          CODE=/home/agentos-node/projects/layoutlib
          USER_BIN="$HOME/.local/bin"
          RUNTIME="$DATA/runtime/layoutlib-web"
          mkdir -p "$CODE" "$USER_BIN" "$RUNTIME"

          stop_pidfile() {
            local pf="$1"
            if [ -f "$pf" ]; then
              local pid
              pid=$(cat "$pf" 2>/dev/null || true)
              if [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid" 2>/dev/null; then
                kill "$pid" 2>/dev/null || true
                for _ in $(seq 1 30); do kill -0 "$pid" 2>/dev/null || break; sleep 0.1; done
              fi
              rm -f "$pf"
            fi
          }

          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "hostname=$(hostname)"
            echo "identity=$(id)"
            echo "python=$(python3 --version 2>&1)"

            python3 scripts/bootstrap_layoutlib.py --target "$CODE"
            python3 scripts/bootstrap_layoutlib_web.py --target "$CODE"
            python3 scripts/bootstrap_layoutlib_hardening.py --target "$CODE"

            echo '=== BROWSER IMAGE ADAPTER ==='
            python3 -m pip install --user --disable-pip-version-check 'Pillow>=10,<13'
            python3 - <<'PY'
          import PIL
          print('pillow_version='+PIL.__version__)
          PY

            echo '=== GOVERNED PORT ==='
            AGENT_DATA_ROOT="$DATA" python3 scripts/core_services/port_manager.py allocate layoutlib-web --desc 'LayoutLib persistent Web UI/API' --start 8765 --end 8799
            PORT=$(AGENT_DATA_ROOT="$DATA" python3 scripts/core_services/port_manager.py list --json | python3 -c 'import json,sys;d=json.load(sys.stdin);print(min(int(k) for k,v in d.items() if v.get("project")=="layoutlib-web"))')
            echo "layoutlib_port=$PORT"

            echo '=== START WEB DAEMON ==='
            WEB_PID="$RUNTIME/web.pid"; WEB_LOG="$RUNTIME/web.log"
            stop_pidfile "$WEB_PID"; : > "$WEB_LOG"
            (
              unset RUNNER_TRACKING_ID
              nohup env PYTHONPATH="$CODE/src" LAYOUTLIB_WEB_QUIET=1 /usr/bin/python3 \
                "$CODE/web_demo/server.py" --host 127.0.0.1 --port "$PORT" >>"$WEB_LOG" 2>&1 </dev/null &
              echo $! > "$WEB_PID"
            )
            WPID=$(cat "$WEB_PID")
            for _ in $(seq 1 30); do
              if curl -fsS --connect-timeout 2 "http://127.0.0.1:$PORT/api/health" >/tmp/layoutlib-local-health; then break; fi
              sleep .2
            done
            kill -0 "$WPID"
            grep -q '"ok": true' /tmp/layoutlib-local-health
            echo "web_pid=$WPID"
            echo 'local_health=PASS'

            echo '=== CLOUDFLARED ==='
            CF="$USER_BIN/cloudflared"
            if [ ! -x "$CF" ]; then
              case "$(uname -m)" in
                aarch64|arm64) ASSET=cloudflared-linux-arm64 ;;
                x86_64|amd64) ASSET=cloudflared-linux-amd64 ;;
                *) echo "unsupported_arch=$(uname -m)"; exit 3 ;;
              esac
              curl -fL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
                "https://github.com/cloudflare/cloudflared/releases/latest/download/$ASSET" -o "$CF"
              chmod 0755 "$CF"
            fi
            "$CF" --version

            echo '=== START QUICK TUNNEL ==='
            TUNNEL_PID="$RUNTIME/tunnel.pid"; TUNNEL_LOG="$RUNTIME/tunnel.log"
            stop_pidfile "$TUNNEL_PID"; : > "$TUNNEL_LOG"
            (
              unset RUNNER_TRACKING_ID
              nohup "$CF" tunnel --no-autoupdate --protocol http2 --url "http://127.0.0.1:$PORT" >>"$TUNNEL_LOG" 2>&1 </dev/null &
              echo $! > "$TUNNEL_PID"
            )
            TPID=$(cat "$TUNNEL_PID")
            PUBLIC_URL=''
            for _ in $(seq 1 90); do
              kill -0 "$TPID" 2>/dev/null || { echo 'tunnel_exited=YES'; cat "$TUNNEL_LOG"; exit 4; }
              PUBLIC_URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "$TUNNEL_LOG" | tail -n 1 || true)
              [ -n "$PUBLIC_URL" ] && break
              sleep 1
            done
            test -n "$PUBLIC_URL"
            echo "tunnel_pid=$TPID"
            echo "public_url=$PUBLIC_URL/"

            probe_get() {
              local path="$1" out="$2" code=000
              for _ in $(seq 1 40); do
                code=$(curl -4 -sS --retry 2 --retry-all-errors -o "$out" -w '%{http_code}' --connect-timeout 5 --max-time 15 "$PUBLIC_URL$path" 2>/dev/null || true)
                [ "$code" = 200 ] && { echo 200; return 0; }
                sleep 1
              done
              echo "$code"; return 1
            }

            echo '=== PUBLIC UI + HEALTH ==='
            UI_CODE=$(probe_get / /tmp/layoutlib-public-ui)
            echo "public_ui_http_code=$UI_CODE"
            grep -q '<title>LayoutLib Demo</title>' /tmp/layoutlib-public-ui
            grep -q 'id="file"' /tmp/layoutlib-public-ui
            grep -q 'id="run"' /tmp/layoutlib-public-ui
            echo 'public_ui_payload=PASS'
            HEALTH_CODE=$(probe_get /api/health /tmp/layoutlib-public-health)
            echo "public_health_http_code=$HEALTH_CODE"
            grep -q '"ok": true' /tmp/layoutlib-public-health
            echo 'public_health_payload=PASS'

            echo '=== BUILD PUBLIC PARSE FIXTURES ==='
            python3 - "$CODE/tests/fixtures/demo_room.pgm" <<'PY'
          import base64,io,json,sys
          from PIL import Image,ImageDraw
          def dump(name, raw):
              payload={'filename':'room.'+name,'content_base64':base64.b64encode(raw).decode(),'meters_per_pixel':0.02,'threshold':128,'min_wall_length_px':30}
              open('/tmp/layoutlib-'+name+'.json','w').write(json.dumps(payload))
          dump('pgm',open(sys.argv[1],'rb').read())
          im=Image.new('RGB',(120,90),'white'); d=ImageDraw.Draw(im)
          d.rectangle((15,12,104,16),fill='black'); d.rectangle((15,72,104,76),fill='black')
          d.rectangle((15,12,19,76),fill='black'); d.rectangle((100,12,104,76),fill='black')
          for fmt,name in [('PNG','png'),('JPEG','jpg')]:
              b=io.BytesIO(); im.save(b,format=fmt,quality=100); dump(name,b.getvalue())
          PY

            echo '=== PUBLIC PARSE ACCEPTANCE ==='
            for ext in pgm png jpg; do
              CODE_HTTP=000
              for _ in $(seq 1 30); do
                CODE_HTTP=$(curl -4 -sS --retry 2 --retry-all-errors -o "/tmp/layoutlib-$ext.out" -w '%{http_code}' \
                  --connect-timeout 5 --max-time 20 -H 'Content-Type: application/json' \
                  --data-binary "@/tmp/layoutlib-$ext.json" "$PUBLIC_URL/api/parse" 2>/dev/null || true)
                [ "$CODE_HTTP" = 200 ] && break
                sleep 1
              done
              echo "public_${ext}_http_code=$CODE_HTTP"
              test "$CODE_HTTP" = 200
              python3 - "/tmp/layoutlib-$ext.out" "$ext" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); assert d.get('ok') is True and d.get('wall_count')==4,d
          print(f'public_{sys.argv[2]}_parse=PASS walls=4 spatial_ir='+d['ir']['version'])
          PY
            done

            kill -0 "$WPID"; kill -0 "$TPID"
            mkdir -p "$DATA/projects/layoutlib"
            printf '%s/\n' "$PUBLIC_URL" > "$DATA/projects/layoutlib/public_url.txt"

            echo '=== ACCEPTANCE ==='
            echo 'web_daemon=PASS'
            echo 'tunnel_daemon=PASS'
            echo 'public_ui=PASS'
            echo 'public_health=PASS'
            echo 'public_pgm_parse=PASS'
            echo 'public_png_parse=PASS'
            echo 'public_jpg_parse=PASS'
            echo "public_url=$PUBLIC_URL/"
            echo 'goal_direct_web_ui=PASS'
          } 2>&1 | tee "$OUT"

      - name: Commit deployment evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .agentos/evidence/layoutlib-public-web.txt || printf 'deployment_step_did_not_create_evidence=YES\n' > .agentos/evidence/layoutlib-public-web.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/layoutlib-public-web.txt
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(layoutlib): final public Web UI acceptance'
          git push
