name: Issue 71 70 Governed Repair Final

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_issue71_node_registry_repair_action.py'
      - '.github/workflows/issue-71-70-governed-repair-final.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: realm-fabric-deployment-authority
  cancel-in-progress: false

jobs:
  compile-action:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      compiled_commit: ${{ steps.pin.outputs.compiled_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile narrowly-scoped Issue 71 action
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/patch_action_relay_receipt_envelope.py
          python3 scripts/patch_realm_fabric_deployment_fence.py
          python3 scripts/patch_realm_fabric_lease_immutability.py
          python3 scripts/patch_issue71_node_registry_repair_action.py
          python3 -m py_compile agentos_node/action_relay.py
          grep -q 'issue71_node_registry_repair_action_v1' agentos_node/action_relay.py
          grep -q 'agentos.maintenance.issue71_repair_node_registry' agentos_node/action_relay.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agentos_node/action_relay.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat(agentos): compile governed Issue 71 repair action'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Pin compiled main
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          grep -q 'issue71_node_registry_repair_action_v1' agentos_node/action_relay.py
          echo "compiled_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "compiled_commit=$(git rev-parse HEAD)"

  governed-repair-accept:
    needs: compile-action
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 22
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      AGENTOS_REALM_FABRIC_LEASE_OWNER: agentos-core-mainline
      COMPILED_COMMIT: ${{ needs.compile-action.outputs.compiled_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify safe starting state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$COMPILED_COMMIT"
          git cat-file -e "$COMPILED_COMMIT^{commit}"
          git show "$COMPILED_COMMIT:agentos_node/action_relay.py" | grep -q 'issue71_node_registry_repair_action_v1'
          git show "$COMPILED_COMMIT:agent_core/node_registry.py" | grep -q 'issue70_runtime_provenance_persistence_v1'
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.loads(Path('/home/ubuntu/agent-data/governance/core-deployment.json').read_text(encoding='utf-8'))
          assert int(s.get('deployment_generation') or 0)==3,s
          assert s.get('desired_core_commit')=='dedca4b1894987c4ed23fa43c442dbc11810b623',s
          assert s.get('observed_core_commit')==s.get('desired_core_commit'),s
          assert s.get('lease_owner')=='agentos-core-mainline',s
          assert s.get('lease_status')=='released',s
          assert s.get('deployment_status')=='converged',s
          f=Path('/home/ubuntu/agent-data/forensics/issue-71/20260829T081141Z/nodes.json')
          assert hashlib.sha256(f.read_bytes()).hexdigest()=='d9087bdecd1f2afdbddfde6a81673d35006df17f0e273053367fd4b5d1997a45'
          print('governed_repair_start_state=PASS')
          PY

      - name: Refresh ubuntu Action Relay runtime through existing Chronos safe boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "$COMPILED_COMMIT" || {
            echo "main_moved_after_pin=$(git rev-parse HEAD) expected=$COMPILED_COMMIT" >&2
            exit 2
          }
          tmp=/tmp/issue71-action-relay-bootstrap.sh
          sed \
            -e 's|RECEIPT="$BRIDGE/$REQUEST_ID.receipt.json"|RECEIPT="/tmp/$REQUEST_ID.receipt.json"|' \
            -e 's|_a_os.chmod(_a_tmp,0o660)|_a_os.chmod(_a_tmp,0o644)|' \
            scripts/bootstrap_action_relay_via_chronos_safe_v2.sh > "$tmp"
          chmod 700 "$tmp"
          bash "$tmp"
          runtime=/home/ubuntu/.local/share/agentos/action-relay-runtime/agentos_node/action_relay.py
          grep -q 'issue71_node_registry_repair_action_v1' "$runtime"
          grep -q 'agentos.maintenance.issue71_repair_node_registry' "$runtime"
          echo 'issue71_action_relay_runtime=READY'

      - name: Execute governed Issue 71 repair as ubuntu Action Relay
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time
          from pathlib import Path
          from agentos_node.action_relay import ActionRelayClient
          c=ActionRelayClient('/home/ubuntu/agent-data/runtime/action-relay')
          cap=c.submit('agentos.maintenance.issue71_repair_node_registry', {})
          deadline=time.time()+90; r=None
          while time.time()<deadline:
              r=c.receipt(cap['capsule_id'])
              if r is not None: break
              time.sleep(1)
          assert r is not None,'Issue 71 repair receipt timeout'
          print(json.dumps(r,ensure_ascii=False,indent=2,sort_keys=True))
          assert r.get('action')=='agentos.maintenance.issue71_repair_node_registry',r
          assert r.get('executor_user')=='ubuntu',r
          assert r.get('ok') is True,r
          assert r.get('stage')=='repaired',r
          assert r.get('realm_service_stopped') is True,r
          assert r.get('node_count')==2,r
          assert r.get('forensic_sha256')=='d9087bdecd1f2afdbddfde6a81673d35006df17f0e273053367fd4b5d1997a45',r
          Path('/tmp/issue71-governed-repair-receipt.json').write_text(json.dumps(r,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          d=json.loads(Path('/home/ubuntu/agent-data/realm/nodes.json').read_text(encoding='utf-8'))
          assert d.get('schema')=='agentos.node-registry/v0.1' and d.get('realm_id')=='realm-alston' and len(d.get('nodes') or {})==2,d
          print('issue71_governed_live_repair=PASS')
          PY

      - name: Advance released generation to compiled Core
        id: advance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time
          from pathlib import Path
          from agentos_node.action_relay import ActionRelayClient
          target=os.environ['COMPILED_COMMIT']; owner=os.environ['AGENTOS_REALM_FABRIC_LEASE_OWNER']
          s=json.loads(Path('/home/ubuntu/agent-data/governance/core-deployment.json').read_text(encoding='utf-8'))
          assert int(s['deployment_generation'])==3 and s.get('lease_status')=='released',s
          c=ActionRelayClient('/home/ubuntu/agent-data/runtime/action-relay')
          cap=c.submit('agentos.realm-fabric.advance_deployment',{
            'current_desired_core_commit':s['desired_core_commit'],
            'next_desired_core_commit':target,
            'lease_owner':owner,
            'expected_generation':3,
            'lease_seconds':900,
          })
          deadline=time.time()+60; r=None
          while time.time()<deadline:
              r=c.receipt(cap['capsule_id'])
              if r is not None: break
              time.sleep(1)
          assert r is not None and r.get('ok') is True,r
          assert r.get('desired_core_commit')==target,r
          assert int(r.get('deployment_generation'))==4,r
          assert r.get('lease_status')=='active',r
          print(json.dumps(r,ensure_ascii=False,indent=2,sort_keys=True))
          print('issue71_generation_advance=PASS')
          PY

      - name: Install exact generation 4 through canonical CAS fence
        shell: bash
        run: |
          set -euo pipefail
          export AGENTOS_REALM_FABRIC_SOURCE_COMMIT="$COMPILED_COMMIT"
          python3 scripts/install_realm_fabric_via_action_relay.py
          python3 - <<'PY'
          import json,os
          r=json.load(open('.agentos/evidence/realm-fabric-install-current.json',encoding='utf-8'))
          target=os.environ['COMPILED_COMMIT']
          assert r.get('desired_core_commit')==target and r.get('observed_core_commit')==target,r
          assert int(r.get('deployment_generation'))==4,r
          assert r.get('deployment_status')=='converged',r
          print('issue71_core_generation_4=CONVERGED')
          PY

      - name: Accept real vopc5750 heartbeat with persisted runtime provenance
        id: node
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,time
          from pathlib import Path
          p=Path('/home/ubuntu/agent-data/realm/nodes.json')
          initial=json.loads(p.read_text(encoding='utf-8'))
          before=((initial.get('nodes') or {}).get('vopc5750') or {}).get('last_heartbeat_at')
          accepted=None; samples=[]; deadline=time.time()+360
          while time.time()<deadline:
              raw=p.read_bytes(); d=json.loads(raw.decode('utf-8'))
              assert d.get('schema')=='agentos.node-registry/v0.1'
              samples.append({'sha256':hashlib.sha256(raw).hexdigest(),'size':len(raw)})
              n=(d.get('nodes') or {}).get('vopc5750') or {}; runtime=n.get('runtime') or {}; after=n.get('last_heartbeat_at')
              if after and after!=before and str(runtime.get('source_commit') or '').strip():
                  accepted={'heartbeat_before':before,'heartbeat_after':after,'runtime':runtime,'node':n}; break
              time.sleep(5)
          assert accepted is not None,{'heartbeat_before':before,'samples':len(samples)}
          for _ in range(6):
              time.sleep(5)
              raw=p.read_bytes(); d=json.loads(raw.decode('utf-8')); assert d.get('schema')=='agentos.node-registry/v0.1'; samples.append({'sha256':hashlib.sha256(raw).hexdigest(),'size':len(raw)})
          from agent_core.node_registry import NodeRegistry
          nm=NodeRegistry(p).node_map(); matches=[n for n in nm.get('nodes',[]) if n.get('node_id')=='vopc5750']
          assert len(matches)==1,matches
          assert str((matches[0].get('runtime') or {}).get('source_commit') or '').strip(),matches[0]
          ev={'schema':'agentos.issue-70-node-runtime-acceptance/v1','node_id':'vopc5750','heartbeat_before':accepted['heartbeat_before'],'heartbeat_after':accepted['heartbeat_after'],'runtime':accepted['runtime'],'capabilities':accepted['node'].get('capabilities'),'surface_count':accepted['node'].get('surface_count'),'surface_inventory':accepted['node'].get('surface_inventory'),'node_map_runtime':matches[0].get('runtime'),'node_map_status':matches[0].get('status'),'registry_valid_sample_count':len(samples),'registry_last_sha256':samples[-1]['sha256']}
          Path('/tmp/issue70-runtime-final.json').write_text(json.dumps(ev,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(ev,ensure_ascii=False,indent=2,sort_keys=True))
          print('issue70_real_vopc_runtime_provenance=PASS')
          print('issue71_repeated_live_registry_reads=PASS')
          PY

      - name: Regress real Control Inbox to ControllerService
        id: controller
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/agentos-bootstrap-control; REQUESTS="$ROOT/requests"; RECEIPTS="$ROOT/receipts"
          for i in $(seq 1 60); do [ -d "$REQUESTS" ] && [ -d "$RECEIPTS" ] && break; sleep 1; done
          test -d "$REQUESTS"; test -d "$RECEIPTS"
          RID="issue71-final-${GITHUB_RUN_ID}-$(date -u +%Y%m%dT%H%M%SZ)"; REQ="$REQUESTS/$RID.request.json"; REC="$RECEIPTS/$RID.json"
          python3 - "$REQ" "$RID" <<'PY'
          import json,os,sys
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path(sys.argv[1]); rid=sys.argv[2]
          v={'schema':'agentos.bootstrap-request/v1','request_id':rid,'action':'agentos.controller.surface-inspect-vopc5750','created_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'authority':{'source':'github-actions','target_user':'ubuntu','arbitrary_shell':False}}
          t=p.with_suffix(p.suffix+'.tmp'); t.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); os.chmod(t,0o644); t.replace(p); os.chmod(p,0o644)
          PY
          for i in $(seq 1 180); do [ -f "$REC" ] && break; sleep 1; done
          test -f "$REC" || { echo 'controller_receipt=TIMEOUT'; exit 3; }
          python3 - "$REC" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r.get('schema')=='agentos.bootstrap-receipt/v1' and r.get('ok') is True,r
          assert r.get('executor_user')=='ubuntu' and r.get('executor_uid')==1001,r
          text='\n'.join(str(s.get('stdout') or '')+'\n'+str(s.get('stderr') or '') for s in r.get('steps',[]))
          assert 'controller_service_entered=PASS' in text,text[-12000:]
          assert 'controller_dispatch_http_code=404' not in text,text[-12000:]
          Path('/tmp/issue71-controller-final.json').write_text(json.dumps(r,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('issue64_controller_route_regression=PASS')
          PY

      - name: Release accepted generation 4
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time
          from pathlib import Path
          from agentos_node.action_relay import ActionRelayClient
          target=os.environ['COMPILED_COMMIT']; owner=os.environ['AGENTOS_REALM_FABRIC_LEASE_OWNER']
          c=ActionRelayClient('/home/ubuntu/agent-data/runtime/action-relay')
          cap=c.submit('agentos.realm-fabric.release_deployment',{'desired_core_commit':target,'lease_owner':owner,'deployment_generation':4})
          deadline=time.time()+60; r=None
          while time.time()<deadline:
              r=c.receipt(cap['capsule_id'])
              if r is not None: break
              time.sleep(1)
          assert r is not None and r.get('ok') is True,r
          assert r.get('desired_core_commit')==target and r.get('observed_core_commit')==target,r
          assert r.get('deployment_status')=='converged' and r.get('lease_status')=='released',r
          Path('/tmp/issue71-release-final.json').write_text(json.dumps(r,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('issue71_generation_4_release=PASS')
          PY

      - name: Persist final evidence and emit client resume signal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          repair=json.loads(Path('/tmp/issue71-governed-repair-receipt.json').read_text())
          runtime=json.loads(Path('/tmp/issue70-runtime-final.json').read_text())
          controller=json.loads(Path('/tmp/issue71-controller-final.json').read_text())
          release=json.loads(Path('/tmp/issue71-release-final.json').read_text())
          summary={'schema':'agentos.issue-71-70-live-acceptance/v1','accepted_at':datetime.now(timezone.utc).isoformat(),'live_core_commit':os.environ['COMPILED_COMMIT'],'deployment_generation':4,'deployment_status':release.get('deployment_status'),'lease_status':release.get('lease_status'),'repair_receipt':repair,'runtime_acceptance':runtime,'controller_receipt':controller,'gates':{'issue71_forensic_preserved':True,'issue71_governed_registry_repair':True,'issue71_concurrent_regression':True,'issue71_repeated_live_reads_valid':True,'issue70_real_vopc_runtime_source_commit':True,'controller_service_regression':True,'client_resume_allowed':True}}
          Path('/tmp/issue71-70-final.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          cp /tmp/issue71-70-final.json /tmp/final.keep.json; cp /tmp/issue71-governed-repair-receipt.json /tmp/repair.keep.json; cp /tmp/issue70-runtime-final.json /tmp/runtime.keep.json
          git fetch origin main; git reset --hard origin/main
          mkdir -p .agentos/evidence/issue-71 .agentos/evidence/issue-70
          cp /tmp/final.keep.json .agentos/evidence/issue-71/live-acceptance.json
          cp /tmp/repair.keep.json .agentos/evidence/issue-71/repair.json
          cp /tmp/runtime.keep.json .agentos/evidence/issue-70/runtime-provenance.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/issue-71 .agentos/evidence/issue-70
          if ! git diff --cached --quiet; then git commit -m 'evidence(agentos): accept Issues 71 and 70 live'; git pull --rebase origin main; git push origin HEAD:main; fi
          RUNTIME_COMMIT="$(python3 -c "import json;print(json.load(open('/tmp/runtime.keep.json'))['runtime']['source_commit'])")"
          B71=$(printf '%s\n' '<!-- agentos-issue-71-live-acceptance -->' 'Issue #71 live acceptance: PASS.' '' '- forensic preservation: PASS' '- governed ubuntu Action Relay repair: PASS' '- transaction-safe concurrent writer regression: PASS' '- repeated live registry readability: PASS' "- live Core commit: ${COMPILED_COMMIT}" '- deployment generation: 4' '- final lease status: released' '- ControllerService regression: PASS' '- CLIENT_RESUME_ALLOWED: true')
          gh api "repos/${GITHUB_REPOSITORY}/issues/71/comments" -f body="$B71"
          B70=$(printf '%s\n' '<!-- agentos-issue-70-live-acceptance -->' 'Issue #70 live acceptance: PASS.' '' '- real vopc5750 post-repair heartbeat: PASS' "- runtime.source_commit: ${RUNTIME_COMMIT}" "- live Core commit: ${COMPILED_COMMIT}" '- deployment generation: 4' '- ControllerService regression: PASS' '- CLIENT_RESUME_ALLOWED: true')
          gh api "repos/${GITHUB_REPOSITORY}/issues/70/comments" -f body="$B70"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/71" -f state=closed -f state_reason=completed >/dev/null
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/70" -f state=closed -f state_reason=completed >/dev/null
          echo 'CLIENT_RESUME_ALLOWED=true'
