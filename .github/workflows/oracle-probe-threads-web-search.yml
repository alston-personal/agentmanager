name: Oracle Probe Threads Web Search

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe logged-in Threads web discovery via Oracle GUI
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const http = require('http');
          const querystring = require('querystring');

          function httpJson(method, url) {
            return new Promise((resolve, reject) => {
              const u = new URL(url);
              const req = http.request({
                method, hostname: u.hostname, port: u.port, path: u.pathname + u.search
              }, res => {
                let data='';
                res.on('data', d => data += d);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); } catch (e) { reject(e); }
                });
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

          async function main(){
            if (typeof WebSocket === 'undefined') {
              console.log('threads_web_search_probe=NODE_WEBSOCKET_UNAVAILABLE');
              process.exit(2);
            }
            const base='http://127.0.0.1:9222';
            const queries=['動漫','迷因','塔羅','AI創作','社群經營','內容創作','日常吐槽'];
            const q=queries[0];
            const targetUrl='https://www.threads.com/search?q='+encodeURIComponent(q)+'&serp_type=recent';
            const target=await httpJson('PUT', base+'/json/new?'+encodeURIComponent(targetUrl));
            const wsurl=String(target.webSocketDebuggerUrl||'');
            if(!wsurl) throw new Error('missing_websocket_debugger_url');

            const ws=new WebSocket(wsurl);
            await new Promise((resolve,reject)=>{
              const t=setTimeout(()=>reject(new Error('ws_open_timeout')),8000);
              ws.addEventListener('open',()=>{clearTimeout(t); resolve();},{once:true});
              ws.addEventListener('error',e=>{clearTimeout(t); reject(e);},{once:true});
            });

            let seq=0;
            const pending=new Map();
            ws.addEventListener('message', ev=>{
              const msg=JSON.parse(String(ev.data));
              if(msg.id && pending.has(msg.id)){
                const {resolve}=pending.get(msg.id);
                pending.delete(msg.id);
                resolve(msg);
              }
            });
            function cmd(method,params={}){
              return new Promise((resolve,reject)=>{
                const id=++seq;
                const timer=setTimeout(()=>{
                  pending.delete(id);
                  reject(new Error('cdp_timeout:'+method));
                },10000);
                pending.set(id,{resolve:(v)=>{clearTimeout(timer);resolve(v);}});
                ws.send(JSON.stringify({id,method,params}));
              });
            }

            await cmd('Runtime.evaluate',{expression:'location.href',returnByValue:true});
            async function readRows(query){
              await cmd('Runtime.evaluate',{expression:'location.href='+JSON.stringify('https://www.threads.com/search?q='+encodeURIComponent(query)+'&serp_type=recent')});
              await sleep(6500);
              const expr=`(()=>{
              const links=[...document.querySelectorAll('a[href*="/post/"]')];
              const rows=[];
              const seen=new Set();
              for(const a of links){
                const href=a.href;
                if(seen.has(href)) continue;
                seen.add(href);
                let node=a;
                for(let i=0;i<8 && node;i++,node=node.parentElement){
                  const txt=(node.innerText||'').trim();
                  if(txt.length>=20){
                    rows.push({href,text:txt.slice(0,600)});
                    break;
                  }
                }
                if(rows.length>=12) break;
              }
              return {
                url:location.href,
                title:document.title,
                body:(document.body?.innerText||'').slice(0,2000),
                rows
              };
            })()`;
              const res=await cmd('Runtime.evaluate',{expression:expr,returnByValue:true});
              return (((res||{}).result||{}).result||{}).value||{};
            }
            const all=[];
            const seen=new Set();
            for(const query of queries){
              const val=await readRows(query);
              const body=String(val.body||'');
              const loggedOut=/Log in|登入/.test(body);
              for(const row of (Array.isArray(val.rows)?val.rows:[])){
                const href=String(row.href||'').replace(/\/media$/,'');
                const text=String(row.text||'').trim();
                if(!href||!text||seen.has(href)) continue;
                seen.add(href);
                const normalized=text.toLowerCase();
                const relevant=normalized.includes(query.toLowerCase());
                if(!relevant) continue;
                all.push({query,href,text:text.slice(0,500),logged_out:loggedOut});
                if(all.length>=16) break;
              }
              if(all.length>=16) break;
            }
            ws.close();
            console.log('threads_web_search_probe=PASS');
            console.log('threads_web_search_candidate_count='+all.length);
            console.log('threads_web_search_candidates='+JSON.stringify(all));
          }

          main().catch(err=>{
            console.error('threads_web_search_probe=ERROR');
            console.error(String(err&&err.stack||err));
            process.exit(1);
          });
          JS
