name: PR Backlog Reconciliation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/pr_backlog_reconcile.py'
      - 'tests/test_pr_backlog_reconcile.py'
      - '.github/workflows/pr-backlog-reconciliation.yml'
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read
  pull-requests: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build conservative open-PR snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          prs = get(f"https://api.github.com/repos/{repo}/pulls?state=open&per_page=100")
          closed = get(f"https://api.github.com/repos/{repo}/pulls?state=closed&sort=updated&direction=desc&per_page=100")
          rows = []
          for pr in prs:
              n = pr["number"]
              detail = get(f"https://api.github.com/repos/{repo}/pulls/{n}")
              compare = get(f"https://api.github.com/repos/{repo}/compare/main...{detail['head']['sha']}")
              rows.append({
                  "number": n,
                  "title": detail["title"],
                  "url": detail["html_url"],
                  "updated_at": detail["updated_at"],
                  "body": detail.get("body") or "",
                  "base": detail["base"]["ref"],
                  "head": detail["head"]["ref"],
                  "ahead_by": compare.get("ahead_by"),
                  "behind_by": compare.get("behind_by"),
                  "mergeable_state": detail.get("mergeable_state"),
                  "files": len(compare.get("files") or []),
              })
          merged_rows = []
          for pr in closed:
              if not pr.get("merged_at"):
                  continue
              merged_rows.append({
                  "number": pr["number"],
                  "title": pr["title"],
                  "url": pr["html_url"],
                  "updated_at": pr["updated_at"],
                  "merged_at": pr["merged_at"],
                  "body": pr.get("body") or "",
                  "base": pr["base"]["ref"],
                  "head": pr["head"]["ref"],
              })
          with open("/tmp/pr-backlog-snapshot.json", "w", encoding="utf-8") as f:
              json.dump(
                  {"pull_requests": rows, "merged_pull_requests": merged_rows},
                  f,
                  ensure_ascii=False,
                  indent=2,
              )
          PY
      - name: Reconcile dry-run
        run: |
          python3 scripts/pr_backlog_reconcile.py             --snapshot /tmp/pr-backlog-snapshot.json             --out /tmp/pr-backlog-report.json
          cat /tmp/pr-backlog-report.json
      - name: Unit tests
        run: python3 -m unittest -v tests.test_pr_backlog_reconcile
      - uses: actions/upload-artifact@v4
        with:
          name: pr-backlog-reconciliation
          path: /tmp/pr-backlog-report.json
          retention-days: 14
