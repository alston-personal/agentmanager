name: Force VO10005870 Liveness Reload

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/force-vo10005870-liveness-reload.yml'

permissions:
  contents: read

jobs:
  reload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Force unique reload and verify PID plus liveness
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          f=RealmFabricStore()

          reload_id='force-liveness-reload-20261002-131640'
          ps=r'''$old=(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'python.exe' -and $_.CommandLine -match '-m agentos_node\.client_cli run' } | Select-Object -First 1).ProcessId
          $script=@'
          Start-Sleep -Seconds 3
          Stop-ScheduledTask -TaskName "AgentOS Thin Client" -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -eq "python.exe" -and $_.CommandLine -match "-m agentos_node\.client_cli run" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2
          Start-ScheduledTask -TaskName "AgentOS Thin Client"
          '@
          Start-Process powershell.exe -WindowStyle Hidden -ArgumentList @('-NoProfile','-NonInteractive','-Command',$script)
          Write-Output ("OLD_PID="+$old)
          Write-Output "RELOAD_SCHEDULED=PASS"'''
          if f.get_receipt(reload_id) is None:
              f.queue_task('VO10005870',{
                  'schema':'agentos.node-task/v0.1','task_id':reload_id,'action':'shell.exec',
                  'executable':'powershell','argv':['-NoProfile','-NonInteractive','-Command',ps],
                  'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':20,
                  'cognition_ids_used':['demo://liveness-v3/20261002'],
              })
          for _ in range(30):
              r=f.get_receipt(reload_id)
              if r is not None:
                  print('RELOAD='+json.dumps(r,ensure_ascii=False,separators=(',',':')))
                  assert r.get('ok') is True and int(r.get('returncode') or 0)==0, r
                  assert 'OLD_PID=190000' in str(r.get('stdout') or ''), r
                  break
              time.sleep(1)
          else:
              raise SystemExit('reload_receipt_missing')

          time.sleep(15)

          verify_id='force-liveness-verify-20261002-131640'
          code="import json,time,os; from pathlib import Path; p=Path(os.environ.get('AGENTOS_CLIENT_HOME'))/'daemon-liveness.json'; a=json.loads(p.read_text(encoding='utf-8')) if p.exists() else None; time.sleep(4); b=json.loads(p.read_text(encoding='utf-8')) if p.exists() else None; print(json.dumps({'path':str(p),'first':a,'second':b,'advanced':bool(a and b and int(b['recorded_at_unix'])>int(a['recorded_at_unix']))},ensure_ascii=False))"
          if f.get_receipt(verify_id) is None:
              f.queue_task('VO10005870',{
                  'schema':'agentos.node-task/v0.1','task_id':verify_id,'action':'shell.exec',
                  'executable':r'C:\Users\alston.huang\AppData\Local\Programs\Python\Python312\python.exe',
                  'argv':['-c',code],
                  'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':15,
                  'cognition_ids_used':['demo://liveness-v3/20261002'],
              })
          for _ in range(45):
              r=f.get_receipt(verify_id)
              if r is not None:
                  print('VERIFY='+json.dumps(r,ensure_ascii=False,separators=(',',':')))
                  assert r.get('ok') is True and int(r.get('returncode') or 0)==0, r
                  out=(r.get('stdout') or '').lower()
                  assert '"advanced": true' in out, r
                  data=json.loads(r.get('stdout') or '{}')
                  assert int((data.get('second') or {}).get('pid') or 0) != 190000, data
                  print('LIVENESS_RELOAD=PASS')
                  break
              time.sleep(1)
          else:
              raise SystemExit('verify_receipt_missing')
          PY
          REMOTE
