name: LCCB Provider HTTP Diagnostic

on:
  push:
    branches: [feature/state-kernel-v2]
    paths:
      - ".agentos/triggers/lccb-provider-http-diagnostic"

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      CONFIG_ROOT: ${{ vars.AGENTOS_CONFIG_ROOT || '/home/ubuntu/agentmanager' }}
      MODEL: gemini-3.1-flash-lite

    steps:
      - name: Resolve target
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Probe OpenAI-compatible HTTP and shape
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-22}"
          RESULT=$(ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$CONFIG_ROOT" "$MODEL" <<'REMOTE'
          set -euo pipefail
          CONFIG_ROOT="$1"; MODEL="$2"
          set -a
          source "$CONFIG_ROOT/.env"
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          python3 - "$AI_API_BASE_URL" "$AI_API_ACADEMIA_KEY" "$MODEL" <<'PY'
          import json, sys, urllib.error, urllib.request
          base, key, model = sys.argv[1:4]
          body = json.dumps({"model":model,"messages":[{"role":"user","content":"Return only this JSON object: {\"ok\":\"ok\"}"}],"temperature":0,"max_tokens":64}).encode()
          req = urllib.request.Request(base.rstrip('/') + '/chat/completions', data=body, method='POST', headers={'Authorization':'Bearer ' + key,'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  raw = response.read().decode('utf-8')
                  code = response.status
          except urllib.error.HTTPError as exc:
              print(f"http-{exc.code}")
              raise SystemExit(0)
          except Exception as exc:
              print("transport-" + type(exc).__name__.lower())
              raise SystemExit(0)
          try:
              payload = json.loads(raw)
          except Exception:
              print(f"http-{code}-nonjson")
              raise SystemExit(0)
          try:
              content = payload['choices'][0]['message']['content']
          except Exception:
              print(f"http-{code}-badshape")
              raise SystemExit(0)
          try:
              parsed = json.loads(str(content).strip().strip('`').removeprefix('json').strip())
              ok = isinstance(parsed, dict) and parsed.get('ok') == 'ok'
          except Exception:
              ok = False
          print(f"http-{code}-shape-ok-contentjson-{'ok' if ok else 'bad'}")
          PY
          REMOTE
          )
          RESULT=$(printf '%s' "$RESULT" | tail -n1 | tr -cd 'a-zA-Z0-9._-')
          test -n "$RESULT" || RESULT=empty
          export RESULT
          payload=$(python3 - <<'PY'
          import json, os
          result=os.environ['RESULT'][:80]
          state='success' if result.startswith('http-200-shape-ok') else 'failure'
          print(json.dumps({'state':state,'context':'agentos/lccb-provider-' + result,'description':'sanitized provider probe: ' + result}))
          PY
          )
          curl --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
