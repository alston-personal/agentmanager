name: Distributed AgentOS CI

on:
  push:
    branches:
      - feature/distributed-agentos-runtime
  pull_request:
    branches:
      - main
    paths:
      - "runtime_core/**"
      - "agent_core/control_plane.py"
      - "agent_core/distributed_control_plane.py"
      - "agent_core/distributed_gateway.py"
      - "agent_core/project_state.py"
      - "agent_core/runtime_dispatcher.py"
      - "agent_core/push_dispatch.py"
      - "agent_core/dispatching_gateway.py"
      - "agentos_node/control_plane_client.py"
      - "agentos_node/remote_worker.py"
      - "agentos_node/web_agent_adapter.py"
      - "agentos_node/provider_bridge.py"
      - "agentos_node/provider_bridge_server.py"
      - "agentos_node/ide_adapter.py"
      - "agentos_node/ide_cli.py"
      - "scripts/distributed_worker.py"
      - "scripts/distributed_gateway.py"
      - "scripts/distributed_remote_worker.py"
      - "scripts/web_agent_adapter.py"
      - "scripts/provider_bridge.py"
      - "tests/test_control_plane.py"
      - "tests/test_distributed_runtime.py"
      - "tests/test_distributed_control_plane.py"
      - "tests/test_distributed_gateway.py"
      - "tests/test_distributed_http_client.py"
      - "tests/test_web_agent_adapter.py"
      - "tests/test_runtime_dispatcher.py"
      - "tests/test_dispatching_gateway.py"
      - "tests/test_push_task_lease.py"
      - "tests/test_push_dispatch.py"
      - "tests/test_provider_bridge.py"
      - "tests/test_provider_bridge_server.py"
      - "tests/test_project_state.py"
      - "tests/test_project_state_http.py"
      - "tests/test_ide_adapter.py"
      - ".github/workflows/distributed-agentos-*.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  distributed-runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pyyaml

      - name: Run Distributed AgentOS tests
        run: >-
          python -m pytest -q
          tests/test_control_plane.py
          tests/test_distributed_runtime.py
          tests/test_distributed_control_plane.py
          tests/test_distributed_gateway.py
          tests/test_distributed_http_client.py
          tests/test_web_agent_adapter.py
          tests/test_runtime_dispatcher.py
          tests/test_dispatching_gateway.py
          tests/test_push_task_lease.py
          tests/test_push_dispatch.py
          tests/test_provider_bridge.py
          tests/test_provider_bridge_server.py
          tests/test_project_state.py
          tests/test_project_state_http.py
          tests/test_ide_adapter.py
