# Narrow production release for the canonical Studio Web vendor reputation UI.
name: Oracle Release Vendor Reputation Canonical

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-release-vendor-reputation-canonical.yml'

permissions:
  contents: read

concurrency:
  group: vendor-reputation-production-canonical
  cancel-in-progress: true

jobs:
  release:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    env:
      SOURCE_REPOSITORY: alston-personal/studio-web
      SOURCE_SHA: 214994caa93760c071b98f6a806841f38ba60a45
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Build pinned canonical Studio Web and publish vendors only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          REPO="$1"; SOURCE_SHA="$2"; RUN_ID="$3"
          LIVE=/home/ubuntu/zeus-writer/website/dist
          TMP=$(mktemp -d /tmp/vendor-reputation-ui-release-XXXXXX)
          SRC="$TMP/studio-web"
          BACKUP=/home/ubuntu/agent-data/releases/studio-web/vendor-reputation/${SOURCE_SHA:0:12}-${RUN_ID}
          NEW_VENDOR="$LIVE/.vendors-${RUN_ID}"
          DEPLOYED=0

          cleanup() {
            rm -rf "$TMP" "$NEW_VENDOR" 2>/dev/null || true
          }
          rollback() {
            set +e
            if [ "$DEPLOYED" = 1 ]; then
              rm -rf "$LIVE/vendors"
              if [ -d "$BACKUP/vendors.previous" ]; then
                cp -a "$BACKUP/vendors.previous" "$LIVE/vendors"
              fi
            fi
            cleanup
          }
          trap 'rollback' ERR
          trap 'cleanup' EXIT

          test -d "$LIVE"
          /usr/bin/gh auth status >/dev/null
          /usr/bin/gh repo clone "$REPO" "$SRC" -- --no-checkout
          /usr/bin/git -C "$SRC" fetch --depth=1 origin "$SOURCE_SHA"
          /usr/bin/git -C "$SRC" checkout --detach "$SOURCE_SHA"
          test "$(/usr/bin/git -C "$SRC" rev-parse HEAD)" = "$SOURCE_SHA"

          cd "$SRC"
          npm install --no-package-lock --ignore-scripts
          npm run build

          test -f dist/vendors/index.html
          grep -Fq 'Vendor Reputation · MVP' dist/vendors/index.html
          grep -Fq 'COMMUNITY VENDOR INDEX' dist/vendors/index.html
          grep -Fq '/api/vendor-reputation/v1/status' dist/vendors/index.html
          grep -Fq '資料服務暫時無法取得' dist/vendors/index.html
          ! grep -Fq 'uniqueReplies: 33' dist/vendors/index.html
          echo 'canonical_vendor_live_consumer_build=PASS'

          mkdir -p "$BACKUP"
          if [ -d "$LIVE/vendors" ]; then
            cp -a "$LIVE/vendors" "$BACKUP/vendors.previous"
          fi

          cp -a dist/vendors "$NEW_VENDOR"
          find "$NEW_VENDOR" -type d -exec chmod 0755 {} +
          find "$NEW_VENDOR" -type f -exec chmod 0644 {} +
          rm -rf "$LIVE/vendors"
          mv "$NEW_VENDOR" "$LIVE/vendors"
          DEPLOYED=1

          curl -kfsS --retry 3 --resolve studio.milkcat.org:443:127.0.0.1 \
            https://studio.milkcat.org/vendors/ -o "$TMP/vendors-live"
          grep -Fq 'Vendor Reputation · MVP' "$TMP/vendors-live"
          grep -Fq 'COMMUNITY VENDOR INDEX' "$TMP/vendors-live"
          grep -Fq '/api/vendor-reputation/v1/status' "$TMP/vendors-live"
          ! grep -Fq 'uniqueReplies: 33' "$TMP/vendors-live"

          curl -kfsS --retry 3 --resolve studio.milkcat.org:443:127.0.0.1 \
            https://studio.milkcat.org/api/vendor-reputation/v1/status -o "$TMP/status-live"
          python3 - "$TMP/status-live" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert isinstance(data.get('evidence'),int)
          assert isinstance(data.get('sourceAuthors'),int)
          assert isinstance(data.get('vendors'),int)
          PY
          echo 'local_nginx_vendor_live_consumer_acceptance=PASS'

          trap - ERR
          printf '%s\n' \
            "schema=studio-web.vendor-reputation-release/v2" \
            "source_repository=$REPO" \
            "source_sha=$SOURCE_SHA" \
            "scope=/vendors/" \
            "api=/api/vendor-reputation/v1/status" \
            "backup=$BACKUP" \
            "ok=true" > "$BACKUP/receipt.txt"
          echo "vendor_reputation_ui_deploy=PASS backup=$BACKUP"
          REMOTE

      - name: Public acceptance
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://studio.milkcat.org
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors "$BASE/vendors/?_=$GITHUB_RUN_ID" -o /tmp/vendors-public
          grep -Fq 'Vendor Reputation · MVP' /tmp/vendors-public
          grep -Fq 'COMMUNITY VENDOR INDEX' /tmp/vendors-public
          grep -Fq '/api/vendor-reputation/v1/status' /tmp/vendors-public
          ! grep -Fq 'uniqueReplies: 33' /tmp/vendors-public
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors "$BASE/api/vendor-reputation/v1/status?_=$GITHUB_RUN_ID" -o /tmp/vendor-status-public
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/vendor-status-public'))
          assert data['evidence'] >= 0
          assert data['sourceAuthors'] >= 0
          assert data['vendors'] >= 0
          PY
          echo 'public_vendor_live_consumer=PASS'
