name: WoW Companion Suite Contract
on:
  pull_request:
    paths:
      - "integrations/wow/companion_suite/**"
      - "integrations/wow/AgentOSWoW/**"
      - "integrations/wow/AgentOSWoW_R001/**"
      - "scripts/wow_companion_*.py"
      - "tests/test_wow_companion_*.py"
      - ".github/workflows/wow-companion-suite-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  suite-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify suite and AI reply contracts
        run: python -m unittest tests.test_wow_companion_suite tests.test_wow_companion_reply tests.test_wow_companion_byok tests.test_wow_companion_ingress tests.test_wow_companion_slot tests.test_wow_companion_client_candidate tests.test_wow_companion_frames tests.test_wow_companion_receiver tests.test_wow_companion_bridge_adapter -v
      - name: Verify plans are dry-run only
        run: |
          python scripts/wow_companion_suite.py --profile minimal > /tmp/wow-plan.json
          python -c 'import json; p=json.load(open("/tmp/wow-plan.json")); assert p["installable"] is False and p["execution"]=="dry-run-only"'
