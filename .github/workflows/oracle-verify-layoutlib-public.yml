name: Oracle Verify LayoutLib Public Web UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-verify-layoutlib-public.yml'
      - 'scripts/core_services/port_manager.py'

permissions:
  contents: write

jobs:
  verify-public-ui:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify surviving daemons and public UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/layoutlib-public-web-acceptance.txt
          RUNTIME=/home/ubuntu/agent-data/runtime/layoutlib-web
          CODE=/home/agentos-node/projects/layoutlib
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            WEB_PID=$(cat "$RUNTIME/web.pid")
            TUNNEL_PID=$(cat "$RUNTIME/tunnel.pid")
            kill -0 "$WEB_PID"
            kill -0 "$TUNNEL_PID"
            echo "web_pid_survived=$WEB_PID"
            echo "tunnel_pid_survived=$TUNNEL_PID"
            PUBLIC_URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "$RUNTIME/tunnel.log" | tail -n 1)
            test -n "$PUBLIC_URL"
            echo "public_url=$PUBLIC_URL/"

            echo '=== UI GET ==='
            UI_CODE=000
            for _ in $(seq 1 20); do
              UI_CODE=$(curl -sS --retry 2 --retry-all-errors -o /tmp/layoutlib-ui -w '%{http_code}' --connect-timeout 5 --max-time 15 "$PUBLIC_URL/" 2>/dev/null || true)
              [ "$UI_CODE" = 200 ] && break
              sleep 1
            done
            echo "public_ui_http_code=$UI_CODE"
            test "$UI_CODE" = 200
            grep -q '<title>LayoutLib Demo</title>' /tmp/layoutlib-ui
            grep -q 'id="file"' /tmp/layoutlib-ui
            grep -q 'id="run"' /tmp/layoutlib-ui
            echo 'public_ui_payload=PASS'

            echo '=== HEALTH GET ==='
            HEALTH_CODE=$(curl -sS --retry 5 --retry-all-errors -o /tmp/layoutlib-health -w '%{http_code}' --connect-timeout 5 --max-time 15 "$PUBLIC_URL/api/health")
            echo "public_health_http_code=$HEALTH_CODE"
            test "$HEALTH_CODE" = 200

            echo '=== PARSE POST ==='
            python3 - "$PUBLIC_URL" "$CODE/tests/fixtures/demo_room.pgm" <<'PY'
          import base64,json,sys,time,urllib.request
          base=sys.argv[1].rstrip('/')
          raw=open(sys.argv[2],'rb').read()
          payload=json.dumps({'filename':'demo_room.pgm','content_base64':base64.b64encode(raw).decode(),'meters_per_pixel':0.02,'min_wall_length_px':30}).encode()
          last=None
          for _ in range(12):
              try:
                  req=urllib.request.Request(base+'/api/parse',data=payload,headers={'Content-Type':'application/json','User-Agent':'LayoutLib-acceptance/1.0'},method='POST')
                  with urllib.request.urlopen(req,timeout=25) as r: data=json.load(r)
                  assert data.get('ok') is True and data.get('wall_count')==4, data
                  print('public_parse=PASS walls=4 spatial_ir='+data['ir']['version'])
                  break
              except Exception as exc:
                  last=exc; time.sleep(1)
          else: raise SystemExit(f'public parse failed: {last}')
          PY
            echo '=== ACCEPTANCE ==='
            echo 'post_job_daemon_survival=PASS'
            echo 'public_ui=PASS'
            echo 'public_health=PASS'
            echo 'public_parse=PASS'
            echo 'goal_direct_web_ui=PASS'
          } 2>&1 | tee "$OUT"
      - name: Commit acceptance evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .agentos/evidence/layoutlib-public-web-acceptance.txt || printf 'verification_did_not_create_evidence=YES\n' > .agentos/evidence/layoutlib-public-web-acceptance.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/layoutlib-public-web-acceptance.txt
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(layoutlib): public Web UI acceptance'
          git push
