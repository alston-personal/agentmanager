name: Oracle Verify LayoutLib Public Web UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-verify-layoutlib-public.yml'

permissions:
  contents: write

jobs:
  verify-public-ui:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify surviving daemons and current public UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/layoutlib-public-web-acceptance.txt
          RUNTIME=/home/ubuntu/agent-data/runtime/layoutlib-web
          CODE=/home/agentos-node/projects/layoutlib
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            WEB_PID=$(cat "$RUNTIME/web.pid"); TUNNEL_PID=$(cat "$RUNTIME/tunnel.pid")
            kill -0 "$WEB_PID"; kill -0 "$TUNNEL_PID"
            echo "web_pid_survived=$WEB_PID"
            echo "tunnel_pid_survived=$TUNNEL_PID"
            PUBLIC_URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "$RUNTIME/tunnel.log" | tail -n 1)
            test -n "$PUBLIC_URL"
            echo "public_url=$PUBLIC_URL/"

            get200() {
              local url="$1" out="$2" code=000
              for _ in $(seq 1 30); do
                code=$(curl -4 -sS --retry 2 --retry-all-errors -o "$out" -w '%{http_code}' --connect-timeout 5 --max-time 15 "$url" 2>/dev/null || true)
                [ "$code" = 200 ] && { echo 200; return 0; }
                sleep 1
              done
              echo "$code"; return 1
            }

            UI_CODE=$(get200 "$PUBLIC_URL/" /tmp/layoutlib-ui)
            echo "public_ui_http_code=$UI_CODE"
            grep -q '<title>LayoutLib Demo</title>' /tmp/layoutlib-ui
            grep -q 'id="file"' /tmp/layoutlib-ui
            grep -q 'id="run"' /tmp/layoutlib-ui
            echo 'public_ui_payload=PASS'

            HEALTH_CODE=$(get200 "$PUBLIC_URL/api/health" /tmp/layoutlib-health)
            echo "public_health_http_code=$HEALTH_CODE"
            grep -q '"ok": true' /tmp/layoutlib-health
            echo 'public_health_payload=PASS'

            python3 - "$CODE/tests/fixtures/demo_room.pgm" <<'PY'
          import base64,json,sys
          raw=open(sys.argv[1],'rb').read()
          open('/tmp/layoutlib-verify.json','w').write(json.dumps({'filename':'demo_room.pgm','content_base64':base64.b64encode(raw).decode(),'meters_per_pixel':0.02,'min_wall_length_px':30}))
          PY
            PARSE_CODE=000
            for _ in $(seq 1 30); do
              PARSE_CODE=$(curl -4 -sS --retry 2 --retry-all-errors -o /tmp/layoutlib-parse -w '%{http_code}' --connect-timeout 5 --max-time 20 -H 'Content-Type: application/json' --data-binary @/tmp/layoutlib-verify.json "$PUBLIC_URL/api/parse" 2>/dev/null || true)
              [ "$PARSE_CODE" = 200 ] && break
              sleep 1
            done
            echo "public_parse_http_code=$PARSE_CODE"
            test "$PARSE_CODE" = 200
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/layoutlib-parse')); assert d.get('ok') is True and d.get('wall_count')==4,d
          print('public_parse=PASS walls=4 spatial_ir='+d['ir']['version'])
          PY
            kill -0 "$WEB_PID"; kill -0 "$TUNNEL_PID"
            echo '=== ACCEPTANCE ==='
            echo 'post_job_daemon_survival=PASS'
            echo 'public_ui=PASS'
            echo 'public_health=PASS'
            echo 'public_parse=PASS'
            echo 'goal_direct_web_ui=PASS'
          } 2>&1 | tee "$OUT"
      - name: Commit acceptance evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .agentos/evidence/layoutlib-public-web-acceptance.txt || printf 'verification_did_not_create_evidence=YES\n' > .agentos/evidence/layoutlib-public-web-acceptance.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/layoutlib-public-web-acceptance.txt
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(layoutlib): post-job public Web UI acceptance'
          git push
