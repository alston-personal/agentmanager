name: Oracle MBPR Browser Readiness
on:
  push:
    branches:
      - core/integration
    paths:
      - '.agentos/commands/mbpr-browser-readiness.json'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 3
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect MBPR browser readiness
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          cmd=json.load(open('.agentos/commands/mbpr-browser-readiness.json',encoding='utf-8'))
          assert cmd.get('node_id')=='mbpr'
          code="from pathlib import Path; import importlib.util,json; home=Path.home(); apps=Path('/Applications'); result={'launchagent_plist':(home/'Library/LaunchAgents/org.milkcat.agentos.thin-client.plist').exists(),'playwright_python':importlib.util.find_spec('playwright') is not None,'chrome':(apps/'Google Chrome.app').exists(),'chromium':(apps/'Chromium.app').exists(),'safari':(apps/'Safari.app').exists()}; print(json.dumps(result,sort_keys=True))"
          tid='browser-ready-mbpr-'+str(int(time.time()))
          store=RealmFabricStore()
          store.queue_task('mbpr',{'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':'python3','argv':['-c',code],'cwd':'/Users/tengweihuang/AgentOS','timeout_seconds':20,'cognition_ids_used':[]})
          for _ in range(45):
              r=store.get_receipt(tid)
              if r:
                  assert r.get('ok') is True,r
                  print(r.get('stdout') or '')
                  print('mbpr_browser_readiness=PASS')
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('mbpr browser readiness timeout')
          PY
