name: Oracle Realm Node Open URL

on:
  push:
    paths:
      - '.agentos/commands/realm-node-open-url.json'

permissions:
  contents: write

concurrency:
  group: oracle-realm-node-open-url
  cancel-in-progress: false

jobs:
  open-url:
    if: github.actor == 'alstonhuang'
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Queue governed open-url task and wait for receipt
        shell: bash
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          CMD=.agentos/commands/realm-node-open-url.json
          OUT=/tmp/realm-node-open-url-result.json
          python3 - "$CMD" "$OUT" <<'PY'
          import json,re,sys,time
          from pathlib import Path
          from agent_core.realm_fabric import RealmFabricStore
          from agent_core.node_registry import NodeRegistry

          cmd=json.load(open(sys.argv[1],encoding='utf-8'))
          assert cmd.get('schema') == 'agentos.realm-command/v0.1', cmd
          assert cmd.get('action') == 'realm.node.open_url', cmd
          node_id=str(cmd.get('node_id') or '')
          url=str(cmd.get('url') or '')
          assert node_id == 'vopc5750', 'v0.1 direct-control test pinned to first Windows node'
          assert url == 'https://www.google.com/search?q=agentos', 'URL is not allowlisted for this acceptance test'

          registry=NodeRegistry().node_map()
          node=next((n for n in registry['nodes'] if n.get('node_id') == node_id), None)
          assert node is not None and node.get('status') == 'online', node

          task_id='open-url-'+node_id+'-'+str(int(time.time()))
          task={
            'schema':'agentos.node-task/v0.1',
            'task_id':task_id,
            'action':'shell.exec',
            'executable':'powershell',
            'argv':['-NoProfile','-NonInteractive','-Command',f"Start-Process '{url}'"],
            'cwd':r'C:\Users\alston.huang\AgentOS',
            'timeout_seconds':15,
            'cognition_ids_used':[],
          }
          fabric=RealmFabricStore()
          queued=fabric.queue_task(node_id,task)
          deadline=time.time()+90
          receipt=None
          while time.time()<deadline:
            receipt=fabric.get_receipt(task_id)
            if receipt:
              break
            time.sleep(2)
          result={'ok': bool(receipt and receipt.get('ok') is True), 'node':node, 'queued_task':queued, 'receipt':receipt}
          Path(sys.argv[2]).write_text(json.dumps(result,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          assert receipt is not None, f'no receipt for {task_id}'
          assert receipt.get('ok') is True, receipt
          print('realm_node_open_url=PASS')
          print('task_id='+task_id)
          PY

      - name: Publish non-secret control evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/realm-node-open-url-result.json || exit 0
          mkdir -p .agentos/evidence
          cp /tmp/realm-node-open-url-result.json .agentos/evidence/realm-node-open-url-current.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/realm-node-open-url-current.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(agentos): record direct Windows browser control'
          git push origin HEAD:main
