name: Persona PDCA Runtime Origin Probe

on:
  push:
    branches:
      - core/integration
    paths:
      - 'agentos_node/bootstrap_control.py'
      - 'agent_core/runner_window.py'
      - 'agent_core/realm_server.py'
      - 'scripts/probe_mio_pdca_runtime_origin_user.sh'
      - '.github/workflows/persona-pdca-runtime-origin-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos
    steps:
      - uses: actions/checkout@v4

      - name: Mint scheduler credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          v=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert v.count('.')==2
          print(v)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Probe live PDCA runtime origin
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 40); do
            OUT="$RUNNER_TEMP/pdca-origin-${attempt}.txt"
            set +e
            AGENTOS_DISPATCH_WAIT_SECONDS=90 bash scripts/agentos_dispatch.sh \
              persona.runtime pdca.origin.probe "$GITHUB_SHA" > "$OUT"
            rc=$?
            set -e
            cat "$OUT"
            if [ "$rc" = 0 ] && python3 - "$OUT" "$GITHUB_SHA" <<'PY'
          import json,sys
          path,expected=sys.argv[1:3]
          completed=None
          for raw in open(path,encoding='utf-8'):
              raw=raw.strip()
              if not raw.startswith('{'): continue
              try: row=json.loads(raw)
              except json.JSONDecodeError: continue
              if row.get('state')=='completed' and isinstance(row.get('receipt'),dict):
                  completed=row
          assert completed is not None
          r=completed['receipt']
          assert r.get('ok') is True,r
          assert r.get('source_commit')==expected,r
          ev=r.get('evidence') or []
          assert any(x=='persona_pdca_runtime_probe=PASS' for x in ev),ev
          print('persona_pdca_origin_receipt=PASS')
          for line in ev:
              if line.startswith(('persona_pdca_runtime_unit=','persona_pdca_runtime_directive=','persona_pdca_runtime_file=','persona_pdca_runtime_sha256=','persona_pdca_runtime_units_found=')):
                  print(line)
          PY
            then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = 1
