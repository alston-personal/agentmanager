# Immutable Galaxy monitor runtime migration. No social cycle is triggered here.
name: Oracle Install Galaxy Threads Experiment Monitor

on:
  push:
    branches:
      - core/integration
    paths:
      - '.github/workflows/oracle-install-galaxy-threads-experiment-monitor.yml'
      - 'scripts/migrate_galaxy_monitor_immutable_runtime_user.sh'
      - 'scripts/install_galaxy_threads_experiment_monitor_user.sh'
      - 'scripts/monitor_social_post_experiment_user.py'
      - 'scripts/run_social_post_experiment_queue_user.py'
      - 'agentos_node/social/post_experiment.py'
      - 'agentos_node/bootstrap_control.py'
      - 'agentos_node/bootstrap_scheduler.py'
      - 'agent_core/runner_window.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: oracle-galaxy-monitor-runtime-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}

    steps:
      - uses: actions/checkout@v4

      - name: Mint GitHub OIDC Runner Window credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Wait for governed migration intent
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 5 \
              -H "Authorization: Bearer $AGENTOS_CONTROLLER_TOKEN" \
              "$AGENTOS_RUNNER_WINDOW_BASE/v1/dispatch" > "$RUNNER_TEMP/catalog.json"; then
              if python3 - "$RUNNER_TEMP/catalog.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=d.get('intents') or d.get('catalog') or []
          got={(x.get('capability'),x.get('operation')) for x in rows if isinstance(x,dict)}
          raise SystemExit(0 if ('social.monitor','runtime.migrate') in got else 1)
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 2
          done
          test "$ready" = 1
          echo "galaxy_monitor_migration_intent=PASS"

      - name: Migrate runtime through Runner Window
        shell: bash
        run: |
          set -euo pipefail
          AGENTOS_DISPATCH_WAIT_SECONDS=180 \
            bash scripts/agentos_dispatch.sh social.monitor runtime.migrate "$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/galaxy-monitor-migration.txt"
          python3 - "$RUNNER_TEMP/galaxy-monitor-migration.txt" "$GITHUB_SHA" <<'PY'
          import json,sys
          docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
          assert docs, 'missing migration receipt'
          receipt=docs[-1].get('receipt') or {}
          assert receipt.get('ok') is True, receipt
          assert receipt.get('source_commit') == sys.argv[2], receipt
          print('galaxy_monitor_runtime_migration_receipt=PASS')
          PY

      - name: Start SSH agent for read-only live verification
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Verify immutable live unit roots
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CURRENT=/home/ubuntu/.local/share/agentos/galaxy-experiment-monitor/current
          RELEASE="$(readlink -f "$CURRENT")"
          test -n "$RELEASE"
          case "$RELEASE" in
            /home/ubuntu/.local/share/agentos/galaxy-experiment-monitor/releases/*) ;;
            *) echo "ERROR: unexpected Galaxy monitor release: $RELEASE" >&2; exit 20;;
          esac
          for unit in agentos-galaxy-experiment-monitor.service agentos-mio-agy-relay.service; do
            wd="$(systemctl --user show "$unit" -p WorkingDirectory --value)"
            test "$(readlink -f "$wd")" = "$RELEASE"
            fragment="$(systemctl --user show "$unit" -p FragmentPath --value)"
            drops="$(systemctl --user show "$unit" -p DropInPaths --value)"
            echo "galaxy_monitor_live_unit=$unit"
            echo "galaxy_monitor_fragment=$(basename "$fragment")"
            echo "galaxy_monitor_dropin_count=$(printf '%s' "$drops" | wc -w)"
            found=0
            for path in "$fragment" $drops; do
              [ -f "$path" ] || continue
              if grep -Fq '/home/ubuntu/agentmanager' "$path"; then
                echo "galaxy_monitor_mutable_ref_file=$(basename "$path")"
                found=1
              fi
              grep -Fq "$RELEASE" "$path" || true
            done
            test "$found" = 0 || { echo "ERROR: mutable checkout remains in $unit" >&2; exit 21; }
            echo "galaxy_monitor_live_unit=$unit:immutable"
          done
          echo "galaxy_monitor_live_release=$RELEASE"
          echo "galaxy_monitor_live_runtime=PASS"
          REMOTE

      - name: Read back real Galaxy learning JSONL without social writes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_USER"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$ORACLE_HOST" 'python3 -' <<'PY'
          import hashlib, json, math, re, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('/home/ubuntu/agent-data/runtime/social/post-experiments')
          release = Path('/home/ubuntu/.local/share/agentos/galaxy-experiment-monitor/current').resolve()
          try:
              generation = (release / 'GENERATION').read_text(encoding='utf-8')
              valid_generation = bool(re.search(r'^source_commit=[0-9a-f]{40}$', generation, re.M))
          except OSError:
              valid_generation = False
          active = subprocess.run(['systemctl', '--user', 'is-active', 'agentos-galaxy-experiment-monitor.timer'],
                                  capture_output=True, text=True, timeout=10, check=False)
          timer_ok = active.returncode == 0 and active.stdout.strip() == 'active'
          print('galaxy_learning_timer_active=' + str(timer_ok).lower())
          print('galaxy_learning_generation_valid=' + str(valid_generation).lower())
          cutoff = datetime(2026, 11, 10, 1, 25, tzinfo=timezone.utc)
          rows = []
          for file in sorted(root.glob('*/*/learning.jsonl')):
              if file.is_symlink():
                  continue
              for raw in file.read_text(encoding='utf-8').splitlines():
                  try:
                      row = json.loads(raw)
                      stamp = datetime.fromisoformat(str(row.get('captured_at') or '').replace('Z', '+00:00'))
                      if stamp.tzinfo and stamp.astimezone(timezone.utc) >= cutoff and row.get('platform') == 'threads':
                          rows.append((stamp, file, row))
                  except (ValueError, TypeError, AttributeError):
                      continue
          print('galaxy_learning_post_release_count=' + str(len(rows)))
          print('galaxy_learning_queue_count=' + str(len(list((root / 'queue').glob('*.json')))))
          print('galaxy_learning_completed_count=' + str(len(list((root / 'completed').glob('*.json')))))
          verdict = 'NO_ELIGIBLE_REAL_ROW'
          for stamp, file, row in sorted(rows, key=lambda x: x[0], reverse=True):
              snapshot = None
              snapshots = file.with_name('snapshots.jsonl')
              if snapshots.is_file() and not snapshots.is_symlink():
                  for raw in snapshots.read_text(encoding='utf-8').splitlines():
                      try:
                          item = json.loads(raw)
                          if (item.get('captured_at') == row.get('captured_at') and
                              item.get('experiment_id') == row.get('experiment_id') and
                              item.get('account_username') == row.get('account_username') and
                              str((item.get('post') or {}).get('id') or '') == str(row.get('post_id') or '')):
                              snapshot = item
                      except (ValueError, AttributeError):
                          pass
              if snapshot is None:
                  verdict = 'MISSING_MATCHING_SNAPSHOT'
                  continue
              caption = (snapshot.get('post') or {}).get('text')
              digest = hashlib.sha256(caption.encode('utf-8')).hexdigest() if isinstance(caption, str) and caption.strip() else None
              elapsed = row.get('elapsed_minutes')
              maturity = ('early' if elapsed < 1440 else 'developing' if elapsed < 10080 else 'mature') if type(elapsed) is int and elapsed >= 0 else None
              metrics = row.get('metrics')
              numeric = isinstance(metrics, dict) and bool(metrics) and all(type(v) in (int, float) and math.isfinite(v) for v in metrics.values())
              expected_ready = bool(digest and row.get('insights_status') == 'pass' and numeric)
              checks = {
                  'schema': row.get('schema') == 'agentos.social-post-learning-observation/v1',
                  'caption_sha256': digest is not None and digest == row.get('caption_sha256'),
                  'maturity': maturity is not None and maturity == row.get('maturity'),
                  'source_evidence_ready': row.get('source_evidence_ready') is expected_ready,
                  'analysis_eligible': row.get('analysis_eligible') is False,
                  'causal_claim_allowed': row.get('causal_claim_allowed') is False,
                  'insights_status': isinstance(row.get('insights_status'), str),
              }
              for key, passed in checks.items():
                  print('galaxy_learning_' + key + '=' + ('PASS' if passed else 'FAIL'))
              print('galaxy_learning_observed_at=' + stamp.astimezone(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))
              verdict = 'PASS' if all(checks.values()) and timer_ok and valid_generation else 'INCOMPLETE'
              break
          print('galaxy_learning_acceptance=' + verdict)
          # A missing row is not a deployment failure or proof of learning.
          PY
