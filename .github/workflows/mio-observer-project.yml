name: Mio Observer Projection

on:
  workflow_dispatch:
  push:
    branches:
      - core/integration
    paths:
      - '.github/workflows/mio-observer-project.yml'
      - 'scripts/project_mio_observer_user.py'
      - 'scripts/project_mio_observer_user.sh'

permissions:
  contents: read

concurrency:
  group: mio-observer-project
  cancel-in-progress: true

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/integration
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Project observer through AgentOS scheduler
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/submit_oracle_bootstrap_request_remote.sh
          ID="mio-observer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RECEIPT="$RUNNER_TEMP/mio-observer-receipt.json"
          AGENTOS_RECEIPT_TIMEOUT_SECONDS=240 \
            bash scripts/submit_oracle_bootstrap_request_remote.sh \
              agentos.mio_observer.project "$ID" "$GITHUB_SHA" '{}' > "$RECEIPT"
          python3 - "$RECEIPT" "$GITHUB_SHA" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r.get("schema")=="agentos.bootstrap-receipt/v1",r
          assert r.get("action")=="agentos.mio_observer.project",r
          assert r.get("source_commit")==sys.argv[2],r
          assert r.get("ok") is True,r
          scheduler=r.get("scheduler") or {}
          assert scheduler.get("worker_role")=="maintenance",scheduler
          assert scheduler.get("worker_id")=="oracle-maintenance",scheduler
          print("mio_observer_scheduler=oracle-maintenance")
          print("mio_observer_bootstrap=PASS")
          PY

      - name: Fetch generated projections
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" \
            'cat /tmp/mio-observer-public.json' > mio-observer-public.json
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" \
            'cat /tmp/mio-observer-owner.json' > mio-observer-owner.json
          python3 - <<'PY'
          import json
          public=json.load(open('mio-observer-public.json',encoding='utf-8'))
          owner=json.load(open('mio-observer-owner.json',encoding='utf-8'))
          assert 'scheduling' in public,public
          pool=owner.get('runner_pool') or {}
          assert 'oracle-gui' in (pool.get('workers') or {}),pool
          assert 'agentos-router' in (pool.get('workers') or {}),pool
          print('mio_observer_runner_pool_projection=PASS')
          PY

      - name: Upload public projection
        uses: actions/upload-artifact@v4
        with:
          name: mio-observer-public
          path: mio-observer-public.json
          retention-days: 3
          if-no-files-found: error

      - name: Upload owner projection
        uses: actions/upload-artifact@v4
        with:
          name: mio-observer-owner
          path: mio-observer-owner.json
          retention-days: 3
          if-no-files-found: error

