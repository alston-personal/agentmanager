name: Oracle Drift Backup

on:
  push:
    branches:
      - ops/oracle-drift-probe-20260904
    paths:
      - ".github/workflows/oracle-drift-backup.yml"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}

    steps:
      - name: Validate backup connection
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST_SOURCE:-}"
          test -n "${DEPLOY_USER:-}"
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Backup Oracle tracked drift locally
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          cd "$ROOT"

          DATA_ROOT="${AGENT_DATA_ROOT:-${AGENT_DATA_DIR:-$HOME/agent-data}}"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP_ROOT="$DATA_ROOT/runtime/backups/oracle-drift-$STAMP"
          mkdir -p "$BACKUP_ROOT"
          chmod 700 "$BACKUP_ROOT"

          git rev-parse HEAD > "$BACKUP_ROOT/head.txt"
          git symbolic-ref --short -q HEAD > "$BACKUP_ROOT/branch.txt" || printf '%s\n' DETACHED > "$BACKUP_ROOT/branch.txt"
          git status --short --untracked-files=no > "$BACKUP_ROOT/status.txt"
          git diff --binary -- . > "$BACKUP_ROOT/tracked.patch"
          git diff --name-only --diff-filter=ACMRT -- . > "$BACKUP_ROOT/files.txt"

          if [ -s "$BACKUP_ROOT/files.txt" ]; then
            tar -czf "$BACKUP_ROOT/files.tar.gz" -T "$BACKUP_ROOT/files.txt"
            while IFS= read -r path; do
              [ -f "$path" ] || continue
              sha256sum -- "$path"
            done < "$BACKUP_ROOT/files.txt" > "$BACKUP_ROOT/sha256.txt"
          fi

          chmod 600 "$BACKUP_ROOT"/* 2>/dev/null || true

          echo "backup_created=true"
          echo "backup_name=$(basename "$BACKUP_ROOT")"
          echo "head=$(cat "$BACKUP_ROOT/head.txt")"
          echo "tracked_files=$(wc -l < "$BACKUP_ROOT/files.txt" | tr -d ' ')"
          echo "patch_bytes=$(wc -c < "$BACKUP_ROOT/tracked.patch" | tr -d ' ')"
          echo "working_tree_mutated=false"
          REMOTE
