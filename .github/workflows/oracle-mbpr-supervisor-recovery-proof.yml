name: Oracle MBPR Supervisor Recovery Proof
on:
  push:
    branches:
      - core/integration
    paths:
      - '.agentos/commands/mbpr-supervisor-recovery-proof.json'
permissions:
  contents: read
jobs:
  prove:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Schedule Thin Client termination after receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          cmd=json.load(open('.agentos/commands/mbpr-supervisor-recovery-proof.json',encoding='utf-8'))
          assert cmd.get('schema')=='agentos.realm-command/v0.1'
          assert cmd.get('action')=='realm.node.supervisor-recovery-proof'
          assert cmd.get('node_id')=='mbpr'
          tid='mbpr-supervisor-stop-'+str(int(time.time()))
          code="import os,subprocess; uid=str(os.getuid()); subprocess.Popen(['/bin/sh','-c','sleep 5; /bin/launchctl kill SIGTERM gui/'+uid+'/org.milkcat.agentos.thin-client'],stdin=subprocess.DEVNULL,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,start_new_session=True,close_fds=True); print('MBPR_SUPERVISOR_STOP_SCHEDULED')"
          store=RealmFabricStore()
          store.queue_task('mbpr',{'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':'python3','argv':['-c',code],'cwd':'/Users/tengweihuang/AgentOS','timeout_seconds':20,'cognition_ids_used':[]})
          for _ in range(30):
              r=store.get_receipt(tid)
              if r:
                  out=str(r.get('stdout') or '')
                  if r.get('ok') is not True or 'MBPR_SUPERVISOR_STOP_SCHEDULED' not in out:
                      raise SystemExit(str(r))
                  print('mbpr_supervisor_stop_schedule=PASS')
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('supervisor stop schedule receipt timeout')
          PY
      - name: Verify autonomous recovery heartbeat
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          from agent_core.node_registry import NodeRegistry
          time.sleep(8)
          deadline=time.time()+90
          while time.time()<deadline:
              node=next((n for n in NodeRegistry().node_map().get('nodes',[]) if n.get('node_id')=='mbpr'),None)
              if node and node.get('status')=='online' and int(node.get('heartbeat_age_seconds') or 9999) < 20:
                  print('mbpr_supervisor_recovery_heartbeat=PASS')
                  raise SystemExit(0)
              time.sleep(3)
          raise SystemExit('MBPR supervisor did not recover heartbeat')
          PY
      - name: Verify governed task after recovery
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          from agent_core.realm_fabric import RealmFabricStore
          tid='mbpr-supervisor-post-recovery-'+str(int(time.time()))
          store=RealmFabricStore()
          store.queue_task('mbpr',{'schema':'agentos.node-task/v0.1','task_id':tid,'action':'process.inspect','query':'agentos_node','limit':20,'cognition_ids_used':[]})
          for _ in range(40):
              r=store.get_receipt(tid)
              if r:
                  if r.get('ok') is not True: raise SystemExit(str(r))
                  print('mbpr_supervisor_recovery_task=PASS')
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('post-recovery governed task timeout')
          PY
