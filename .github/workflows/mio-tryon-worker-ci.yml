name: Mio Try-On Worker CI

on:
  pull_request:
    paths:
      - 'scripts/tryon_render_worker.py'
      - 'tests/test_tryon_render_worker.py'
      - '.github/workflows/mio-tryon-worker-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/tryon_render_worker.py'
      - 'tests/test_tryon_render_worker.py'
      - '.github/workflows/mio-tryon-worker-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run try-on worker tests
        run: python -m pytest -q tests/test_tryon_render_worker.py
