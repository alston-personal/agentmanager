name: Oracle Codex CLI Live Acceptance

on:
  push:
    branches:
      - core/integration
    paths:
      - '.github/workflows/oracle-codex-cli-live-acceptance.yml'
      - 'agentos_node/codex_cli_install_provider.py'
      - 'agentos_node/codex_provider_adapter.py'
      - 'scripts/install_oracle_codex_cli.sh'
      - 'agent_core/executor_job_contract.py'
      - 'agentos_node/executor_job_adapter.py'
      - 'agentos_node/executor_job_action_relay.py'
      - '.github/workflows/oracle-action-runtime-rollout.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: oracle-codex-cli-live-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos

    steps:
      - uses: actions/checkout@v4

      - name: Mint GitHub OIDC scheduler credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Roll out exact runtime generation
        shell: bash
        run: |
          set -euo pipefail
          AGENTOS_DISPATCH_WAIT_SECONDS=720             bash scripts/agentos_dispatch.sh agentos.runtime repair "$GITHUB_SHA"             | tee "$RUNNER_TEMP/codex-runtime-rollout.txt"
          python3 - "$RUNNER_TEMP/codex-runtime-rollout.txt" "$GITHUB_SHA" <<'PY'
          import json,sys
          docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
          assert docs
          receipt=docs[-1].get('receipt') or {}
          assert receipt.get('ok') is True, receipt
          assert receipt.get('source_commit')==sys.argv[2], receipt
          print('codex_runtime_rollout=PASS')
          PY

      - name: Install or adopt Codex CLI
        shell: bash
        run: |
          set -euo pipefail
          AGENTOS_DISPATCH_WAIT_SECONDS=180             bash scripts/agentos_dispatch.sh agentos.executor job.submit "$GITHUB_SHA" job_type=codex.cli.install             | tee "$RUNNER_TEMP/codex-install-submit.txt"

          job_id="$(python3 - "$RUNNER_TEMP/codex-install-submit.txt" <<'PY'
          import json,sys
          docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
          receipt=(docs[-1].get('receipt') or {}) if docs else {}
          job=receipt.get('executor_job') or {}
          assert receipt.get('ok') is True, receipt
          value=str(job.get('job_id') or '')
          assert value.startswith('action-'), job
          print(value)
          PY
          )"

          for i in $(seq 1 120); do
            out="$RUNNER_TEMP/codex-install-inspect-$i.txt"
            AGENTOS_DISPATCH_WAIT_SECONDS=90               bash scripts/agentos_dispatch.sh agentos.executor job.inspect "$GITHUB_SHA" job_id="$job_id" > "$out"
            set +e
            python3 - "$out" <<'PY'
          import json,sys
          docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
          if not docs:
              raise SystemExit(1)
          receipt=docs[-1].get('receipt') or {}
          if receipt.get('executor_job_state')!='completed':
              raise SystemExit(1)
          job=receipt.get('executor_job_receipt') or {}
          classification=str(job.get('classification') or 'none')
          print('codex_cli_install_classification='+classification)
          print('codex_cli_version='+str(job.get('codex_cli_version') or 'none'))
          if classification=='CODEX_CLI_INSTALL_PASS' and job.get('install_receipt_ok') is True:
              raise SystemExit(0)
          raise SystemExit(2)
          PY
            rc=$?
            set -e
            if [ "$rc" = 0 ]; then
              echo 'codex_cli_install_live_acceptance=PASS'
              break
            fi
            if [ "$rc" = 2 ]; then
              echo 'codex_cli_install_live_acceptance=TERMINAL_FAIL' >&2
              cat "$out" >&2
              exit 2
            fi
            sleep 3
          done

      - name: Probe authenticated Codex model turn
        shell: bash
        run: |
          set -euo pipefail
          AGENTOS_DISPATCH_WAIT_SECONDS=180             bash scripts/agentos_dispatch.sh agentos.executor job.submit "$GITHUB_SHA" job_type=codex.cli.health             | tee "$RUNNER_TEMP/codex-health-submit.txt"

          job_id="$(python3 - "$RUNNER_TEMP/codex-health-submit.txt" <<'PY'
          import json,sys
          docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
          receipt=(docs[-1].get('receipt') or {}) if docs else {}
          job=receipt.get('executor_job') or {}
          assert receipt.get('ok') is True, receipt
          value=str(job.get('job_id') or '')
          assert value.startswith('action-'), job
          print(value)
          PY
          )"

          for i in $(seq 1 60); do
            out="$RUNNER_TEMP/codex-health-inspect-$i.txt"
            AGENTOS_DISPATCH_WAIT_SECONDS=90               bash scripts/agentos_dispatch.sh agentos.executor job.inspect "$GITHUB_SHA" job_id="$job_id" > "$out"
            set +e
            python3 - "$out" <<'PY'
          import json,sys
          docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
          if not docs:
              raise SystemExit(1)
          receipt=docs[-1].get('receipt') or {}
          if receipt.get('executor_job_state')!='completed':
              raise SystemExit(1)
          job=receipt.get('executor_job_receipt') or {}
          classification=str(job.get('classification') or 'none')
          print('codex_cli_health_classification='+classification)
          print('codex_cli_health_authorized='+str(job.get('authorized')))
          print('codex_cli_health_routable='+str(job.get('routable')))
          if classification=='CODEX_CLI_HEALTH_READY' and job.get('successful') is True:
              raise SystemExit(0)
          raise SystemExit(2)
          PY
            rc=$?
            set -e
            if [ "$rc" = 0 ]; then
              echo 'codex_cli_health_live_acceptance=PASS'
              exit 0
            fi
            if [ "$rc" = 2 ]; then
              echo 'codex_cli_health_live_acceptance=TERMINAL_FAIL'
              cat "$out"
              exit 2
            fi
            sleep 3
          done
          echo 'codex_cli_health_live_acceptance=TIMEOUT'
          exit 3

      - name: Upload sanitized Codex evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-codex-cli-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/codex-runtime-rollout.txt
            ${{ runner.temp }}/codex-install-submit.txt
            ${{ runner.temp }}/codex-health-submit.txt
            ${{ runner.temp }}/codex-install-inspect-*.txt
            ${{ runner.temp }}/codex-health-inspect-*.txt
          if-no-files-found: warn
          retention-days: 14
