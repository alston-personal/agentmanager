name: AgentOS Core Runtime Candidate Contract

on:
  push:
    branches:
      - feature/realm-node-fabric-readiness
    paths:
      - '.github/workflows/core-runtime-candidate-contract.yml'
      - 'agent_core/controller_api.py'
      - 'agent_core/controller_service.py'
      - 'agent_core/node_registry.py'
      - 'agent_core/realm_server.py'
      - 'agent_core/resolve_facade.py'
      - 'agent_core/runtime_ota.py'
      - 'tests/test_controller_api.py'
      - 'tests/test_controller_service.py'
      - 'tests/test_node_registry_concurrency.py'
      - 'tests/test_realm_resolve_endpoint.py'
      - 'tests/test_resolve_facade.py'
      - 'tests/test_runtime_ota.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install pytest pyyaml
      - name: Compile Core runtime candidate
        run: |
          python -m py_compile \
            agent_core/controller_api.py \
            agent_core/controller_service.py \
            agent_core/node_registry.py \
            agent_core/realm_server.py \
            agent_core/resolve_facade.py \
            agent_core/runtime_ota.py
      - name: Run accepted Core contracts
        run: |
          python -m pytest -q \
            tests/test_controller_api.py \
            tests/test_controller_service.py \
            tests/test_node_registry_concurrency.py \
            tests/test_realm_resolve_endpoint.py \
            tests/test_resolve_facade.py \
            tests/test_runtime_ota.py
      - name: Candidate acceptance marker
        run: |
          echo 'legacy_controller_contract=PASS'
          echo 'runtime_controller_contract=PASS'
          echo 'resolve_contract=PASS'
          echo 'node_registry_concurrency=PASS'
          echo 'core_runtime_candidate=PASS'
