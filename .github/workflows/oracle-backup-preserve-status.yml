name: Oracle Backup Preserve Status

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/oracle-backup-preserve-status.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect preservation progress
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$ORACLE_HOST" bash -s <<'REMOTE'
          echo 'RCLONE_PROCESSES'
          ps -eo pid,etimes,args | grep '[r]clone copyto' || true
          echo 'RCLONE_IO'
          for pid in $(pgrep -f 'rclone copyto .*recovered-oracle-underlay-20261001' || true); do
            echo "pid=$pid"
            cat "/proc/$pid/io" 2>/dev/null || true
          done
          echo 'REMOTE_RECOVERY_FILES'
          timeout 20 rclone lsf gdrive:backups/recovered-oracle-underlay-20261001 --files-only --format 'sp' 2>/dev/null || true
          echo 'EXACT_RECOVERY'
          for name in agentos_backup_20260930_030001.tar.gz agentos_backup_20261001_030001.tar.gz; do
            echo "-- $name"
            local_file="$HOME/gdrive/backups/$name"
            if [ -f "$local_file" ]; then
              echo "local_size=$(stat -c %s "$local_file")"
              echo "local_md5=$(md5sum "$local_file" | awk '{print $1}')"
            else
              echo 'local_missing=yes'
            fi
            remote="gdrive:backups/recovered-oracle-underlay-20261001/$name"
            echo "remote_size=$(timeout 20 rclone lsf "$remote" --files-only --format s 2>/dev/null | head -n1 || true)"
            echo "remote_md5=$(timeout 45 rclone md5sum "$remote" 2>/dev/null | awk 'NR==1{print $1}' || true)"
          done
          echo 'FINALIZER_STATE'
          cat "$HOME/.local/state/agentos/gdrive-underlay-finalize.state" 2>/dev/null || true
          systemctl --user is-active agentos-gdrive-underlay-finalize.timer 2>/dev/null || true
          systemctl --user is-active agentos-remote-backup.timer 2>/dev/null || true
          systemctl --user is-active agentos-gdrive-mount.service 2>/dev/null || true
          echo 'ROOT_SPACE'
          df -h /
          REMOTE
