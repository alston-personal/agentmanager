name: Oracle Backup Preserve Status

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/oracle-backup-preserve-status.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect preservation progress
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$ORACLE_HOST" bash -s <<'REMOTE'
          echo 'RCLONE_PROCESSES'
          ps -eo pid,etimes,args | grep '[r]clone copyto' || true
          echo 'RCLONE_IO'
          for pid in $(pgrep -f 'rclone copyto .*recovered-oracle-underlay-20261001' || true); do
            echo "pid=$pid"
            cat "/proc/$pid/io" 2>/dev/null || true
          done
          echo 'REMOTE_RECOVERY_FILES'
          timeout 20 rclone lsf gdrive:backups/recovered-oracle-underlay-20261001 --files-only --format 'sp' 2>/dev/null || true
          echo 'ROOT_SPACE'
          df -h /
          REMOTE
# status refresh 2026-10-01T07:35+08:00
# status refresh 2026-10-01T07:38+08:00
# status refresh 2026-10-01T07:43+08:00
