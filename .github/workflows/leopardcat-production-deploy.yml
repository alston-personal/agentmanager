name: LeopardCat Governed Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [chore/leopardcat-runtime-inspect]
    paths:
      - '.github/workflows/leopardcat-production-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start governed SSH identity
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Deploy LeopardCat deck-owned share theme safely
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          ROOT=/home/ubuntu/leopardcat-tarot
          WEB="$ROOT/website"
          OLD=f35709108233df39e2a4a9237ea44139ee9ca066
          TARGET=d1cae4fc34d2bfaec00bbbab54a058d33a4595cc

          echo '=== preflight ==='
          test -d "$ROOT/.git"
          test "$(git -C "$ROOT" branch --show-current)" = main
          HEAD=$(git -C "$ROOT" rev-parse HEAD)
          echo "head_before=$HEAD"
          test "$HEAD" = "$OLD" -o "$HEAD" = "$TARGET"

          mapfile -t DIRTY < <(git -C "$ROOT" status --porcelain | sed -E 's/^.. //')
          for f in "${DIRTY[@]:-}"; do
            test -z "$f" && continue
            case "$f" in
              website/dist/index.html|website/stats.json) ;;
              *) echo "unexpected_dirty=$f"; exit 20 ;;
            esac
          done
          echo "dirty_allowed=${#DIRTY[@]}"

          BACKUP=/tmp/leopardcat-stats-${GITHUB_RUN_ID:-manual}.json
          cp "$WEB/stats.json" "$BACKUP"
          git -C "$ROOT" checkout -- website/dist/index.html

          echo '=== sync source ==='
          git -C "$ROOT" fetch origin main
          git -C "$ROOT" merge --ff-only origin/main
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET"
          echo "head_after=$(git -C "$ROOT" rev-parse HEAD)"
          cp "$BACKUP" "$WEB/stats.json"

          echo '=== verify share-theme source contract ==='
          grep -q 'normalizeShareTheme' "$WEB/main.js"
          grep -q 'applyShareTheme' "$WEB/main.js"
          grep -q 'deck.share_theme' "$WEB/main.js"
          grep -q 'share_theme: dict' "$WEB/divination/decks.py"
          grep -q 'sharing.deck-owned-share-theme' "$ROOT/governance/capabilities.json"
          echo 'deck_share_theme_source=present'

          echo '=== build production frontend ==='
          test -e "$WEB/public/art/renders"
          test -e "$WEB/public/cards"
          cd "$WEB"
          npm ci
          npm run build

          JS_ASSET=$(sed -nE 's#.*src="(/assets/index-[^"]+\.js)".*#\1#p' dist/index.html | head -1)
          CSS_ASSET=$(sed -nE 's#.*href="(/assets/index-[^"]+\.css)".*#\1#p' dist/index.html | head -1)
          test -n "$JS_ASSET"
          test -n "$CSS_ASSET"
          test -f "dist$JS_ASSET"
          test -f "dist$CSS_ASSET"
          echo "js_asset=$JS_ASSET"
          echo "css_asset=$CSS_ASSET"

          echo '=== restart ownership ==='
          systemctl --user stop leopardcat-tarot.service || true
          for pid in $(pgrep -f '/usr/bin/python3 fortune_server.py' || true); do
            cwd=$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)
            cmd=$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)
            if [ "$cwd" = "$WEB" ] && [ "$cmd" = '/usr/bin/python3 fortune_server.py ' ]; then
              echo "terminating_stale_pid=$pid"
              kill "$pid" || true
            fi
          done
          for i in $(seq 1 20); do
            if ! ss -ltnp 2>/dev/null | grep -q ':8088'; then break; fi
            sleep 1
          done
          if ss -ltnp 2>/dev/null | grep -q ':8088'; then
            echo 'port_8088_still_busy=YES'
            exit 21
          fi

          systemctl --user start leopardcat-tarot.service
          for i in $(seq 1 30); do
            if systemctl --user is-active --quiet leopardcat-tarot.service && curl -fsS --max-time 2 http://127.0.0.1:8088/api/v1/decks/leopardcat >/tmp/leopardcat-deck.json; then
              break
            fi
            sleep 1
          done
          systemctl --user is-active leopardcat-tarot.service
          grep -q '"share_theme"' /tmp/leopardcat-deck.json
          grep -q 'spirit-memo' /tmp/leopardcat-deck.json
          echo 'deck_share_theme_api=present'

          echo '=== verify served bundle ==='
          curl -fsS --max-time 5 "http://127.0.0.1:8088$JS_ASSET" -o /tmp/leopardcat-release.js
          curl -fsS --max-time 5 "http://127.0.0.1:8088$CSS_ASSET" -o /tmp/leopardcat-release.css
          test "$(sha256sum "dist$JS_ASSET" | awk '{print $1}')" = "$(sha256sum /tmp/leopardcat-release.js | awk '{print $1}')"
          test "$(sha256sum "dist$CSS_ASSET" | awk '{print $1}')" = "$(sha256sum /tmp/leopardcat-release.css | awk '{print $1}')"

          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 https://leopardcat-tarot.milkcat.org/)
          echo "public_http=$code"
          test "$code" = 200
          curl -fsS --max-time 8 "https://leopardcat-tarot.milkcat.org$JS_ASSET" -o /tmp/leopardcat-public-release.js
          test "$(sha256sum "dist$JS_ASSET" | awk '{print $1}')" = "$(sha256sum /tmp/leopardcat-public-release.js | awk '{print $1}')"
          curl -fsS --max-time 8 https://leopardcat-tarot.milkcat.org/api/v1/decks/leopardcat -o /tmp/leopardcat-public-deck.json
          grep -q '"share_theme"' /tmp/leopardcat-public-deck.json

          echo "service_pid=$(systemctl --user show -p MainPID --value leopardcat-tarot.service)"
          echo 'leopardcat_share_theme_deploy=PASS'
          REMOTE
