name: LeopardCat Governed Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [chore/leopardcat-runtime-inspect]
    paths:
      - '.github/workflows/leopardcat-production-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start governed SSH identity
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Deploy LeopardCat reading OG share preview safely
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          ROOT=/home/ubuntu/leopardcat-tarot
          WEB="$ROOT/website"
          TARGET=c455c47a789d9b147f878122d3ec9edc612a8a60

          echo '=== preflight ==='
          test -d "$ROOT/.git"
          test "$(git -C "$ROOT" branch --show-current)" = main
          HEAD=$(git -C "$ROOT" rev-parse HEAD)
          echo "head_before=$HEAD"
          echo "target=$TARGET"

          echo '=== full runtime status ==='
          git -C "$ROOT" status --porcelain --untracked-files=all || true
          mapfile -t DIRTY < <(git -C "$ROOT" status --porcelain --untracked-files=all | sed -E 's/^.. //')
          for f in "${DIRTY[@]:-}"; do
            test -z "$f" && continue
            case "$f" in
              website/dist/index.html|website/stats.json|website/node_modules/.vite/*) ;;
              website/fortune_server.py|website/divination/analytics.py|website/print_service.py|website/public/admin/print.html|docs/README_PRINT.md|scripts/generate_print_a4_pdf.py|art/renders/card-back.png|print_output/*) ;;
              *) echo "unexpected_dirty=$f"; exit 20 ;;
            esac
          done
          echo "dirty_allowed=${#DIRTY[@]}"

          echo '=== preserve local print work ==='
          PRINT_BACKUP=/tmp/leopardcat-print-${GITHUB_RUN_ID:-manual}
          rm -rf "$PRINT_BACKUP"
          mkdir -p "$PRINT_BACKUP"
          for p in             website/print_service.py             website/public/admin/print.html             docs/README_PRINT.md             scripts/generate_print_a4_pdf.py             art/renders/card-back.png             print_output
          do
            if [ -e "$ROOT/$p" ]; then
              mkdir -p "$PRINT_BACKUP/$(dirname "$p")"
              cp -a "$ROOT/$p" "$PRINT_BACKUP/$p"
            fi
          done

          rm -rf "$WEB/node_modules/.vite"
          STATS_BACKUP=/tmp/leopardcat-stats-${GITHUB_RUN_ID:-manual}.json
          cp "$WEB/stats.json" "$STATS_BACKUP"

          # Remove tracked-file drift and the old untracked analytics module before fast-forward.
          git -C "$ROOT" checkout -- website/fortune_server.py website/dist/index.html
          if ! git -C "$ROOT" ls-files --error-unmatch website/divination/analytics.py >/dev/null 2>&1; then
            rm -f "$ROOT/website/divination/analytics.py"
          fi

          echo '=== sync source ==='
          git -C "$ROOT" fetch origin main
          echo '=== divergence diagnostics ==='
          echo "merge_base=$(git -C "$ROOT" merge-base HEAD origin/main || true)"
          echo "left_right=$(git -C "$ROOT" rev-list --left-right --count HEAD...origin/main || true)"
          echo '--- local-only commits ---'
          git -C "$ROOT" log --oneline --decorate origin/main..HEAD || true
          echo '--- local-only commit details ---'
          git -C "$ROOT" show --stat --summary --oneline HEAD || true
          git -C "$ROOT" diff --name-status "$(git -C "$ROOT" merge-base HEAD origin/main)"..HEAD || true
          echo '--- remote-only commits ---'
          git -C "$ROOT" log --oneline --decorate HEAD..origin/main | head -40 || true
          echo '--- graph ---'
          git -C "$ROOT" log --oneline --decorate --graph --all -20 || true
          if [ "$(git -C "$ROOT" rev-parse HEAD)" != "$TARGET" ]; then
            git -C "$ROOT" branch -f backup/oracle-pre-direct-entry-e0dcfb6 e0dcfb6129e6b845bc018ca1cd5405346e3baf45
            git -C "$ROOT" reset --hard origin/main
          fi
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET"
          echo "head_after=$(git -C "$ROOT" rev-parse HEAD)"
          cp "$STATS_BACKUP" "$WEB/stats.json"

          echo '=== restore local print work ==='
          for p in             website/print_service.py             website/public/admin/print.html             docs/README_PRINT.md             scripts/generate_print_a4_pdf.py             art/renders/card-back.png             print_output
          do
            if [ -e "$PRINT_BACKUP/$p" ]; then
              mkdir -p "$ROOT/$(dirname "$p")"
              rm -rf "$ROOT/$p"
              cp -a "$PRINT_BACKUP/$p" "$ROOT/$p"
            fi
          done

          if ! grep -q '^from print_service import handle_print_get$' "$WEB/fortune_server.py"; then
            sed -i '/^from divination\.threads_publishing import ThreadsPublishingService, ThreadsPublishingError$/a from print_service import handle_print_get' "$WEB/fortune_server.py"
          fi
          if ! grep -q 'handle_print_get(self, path, query, CARD_MANIFEST)' "$WEB/fortune_server.py"; then
            perl -0pi -e 's/(        query = url_parts\[1\] if len\(url_parts\) > 1 else ""\n\n)/$1        if handle_print_get(self, path, query, CARD_MANIFEST):\n            return\n\n/' "$WEB/fortune_server.py"
          fi
          test -f "$WEB/print_service.py"
          grep -q 'from print_service import handle_print_get' "$WEB/fortune_server.py"
          grep -q 'handle_print_get(self, path, query, CARD_MANIFEST)' "$WEB/fortune_server.py"
          echo 'local_print_hotfix_preserved=YES'

          echo '=== verify share contracts ==='
          grep -q 'normalizeShareTheme' "$WEB/main.js"
          grep -q 'applyShareTheme' "$WEB/main.js"
          grep -q 'deck.share_theme' "$WEB/main.js"
          grep -q 'share_theme: dict' "$WEB/divination/decks.py"
          grep -q 'sharing.deck-owned-share-theme' "$ROOT/governance/capabilities.json"
          grep -q 'persistReadingSharePreview' "$WEB/main.js"
          grep -q "threadsShareU.searchParams.set('preview', String(Date.now()))" "$WEB/main.js"
          grep -q 'share-image.png' "$WEB/fortune_server.py"
          grep -q 'sharing.reading-og-share-preview' "$ROOT/governance/capabilities.json"
          echo 'deck_share_theme_source=present'
          echo 'reading_og_share_preview_source=present'
          echo 'threads_preview_cache_buster=present'

          echo '=== build production frontend ==='
          test -e "$WEB/public/art/renders"
          test -e "$WEB/public/cards"
          cd "$WEB"
          npm ci
          npm run build

          JS_ASSET=$(sed -nE 's#.*src="(/assets/index-[^"]+\.js)".*#\1#p' dist/index.html | head -1)
          CSS_ASSET=$(sed -nE 's#.*href="(/assets/index-[^"]+\.css)".*#\1#p' dist/index.html | head -1)
          test -n "$JS_ASSET"
          test -n "$CSS_ASSET"
          test -f "dist$JS_ASSET"
          test -f "dist$CSS_ASSET"
          echo "js_asset=$JS_ASSET"
          echo "css_asset=$CSS_ASSET"

          echo '=== restart ownership ==='
          systemctl --user stop leopardcat-tarot.service || true
          for pid in $(pgrep -f 'fortune_server.py' || true); do
            cwd=$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)
            cmd=$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)
            if { [ "$cwd" = "$WEB" ] && [ "$cmd" = '/usr/bin/python3 fortune_server.py ' ]; } || [ "$cmd" = "/usr/bin/python3 $WEB/fortune_server.py " ]; then
              echo "terminating_stale_pid=$pid cmd=$cmd"
              kill "$pid" || true
            fi
          done
          for i in $(seq 1 20); do
            if ! ss -ltnp 2>/dev/null | grep -q ':8088'; then break; fi
            sleep 1
          done
          if ss -ltnp 2>/dev/null | grep -q ':8088'; then
            echo 'port_8088_still_busy=YES'
            echo '=== port 8088 diagnostics ==='
            ss -ltnp 2>/dev/null | grep ':8088' || true
            command -v lsof >/dev/null && lsof -nP -iTCP:8088 -sTCP:LISTEN || true
            pgrep -af 'fortune_server|8088|leopardcat' || true
            systemctl --user status leopardcat-tarot.service --no-pager || true
            exit 21
          fi

          systemctl --user start leopardcat-tarot.service
          for i in $(seq 1 30); do
            if systemctl --user is-active --quiet leopardcat-tarot.service && curl -fsS --max-time 2 http://127.0.0.1:8088/api/v1/decks/leopardcat >/tmp/leopardcat-deck.json; then
              break
            fi
            sleep 1
          done
          systemctl --user is-active leopardcat-tarot.service
          grep -q '"share_theme"' /tmp/leopardcat-deck.json
          grep -q 'spirit-memo' /tmp/leopardcat-deck.json
          echo 'deck_share_theme_api=present'

          echo '=== verify root OG contract ==='
          curl -fsS --max-time 5 http://127.0.0.1:8088/ -o /tmp/leopardcat-root.html
          grep -q 'property="og:image"' /tmp/leopardcat-root.html
          grep -q 'property="og:title"' /tmp/leopardcat-root.html
          echo 'root_og_metadata=present'

          echo '=== verify served bundle ==='
          curl -fsS --max-time 5 "http://127.0.0.1:8088$JS_ASSET" -o /tmp/leopardcat-release.js
          curl -fsS --max-time 5 "http://127.0.0.1:8088$CSS_ASSET" -o /tmp/leopardcat-release.css
          test "$(sha256sum "dist$JS_ASSET" | awk '{print $1}')" = "$(sha256sum /tmp/leopardcat-release.js | awk '{print $1}')"
          test "$(sha256sum "dist$CSS_ASSET" | awk '{print $1}')" = "$(sha256sum /tmp/leopardcat-release.css | awk '{print $1}')"

          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 https://leopardcat-tarot.milkcat.org/)
          echo "public_http=$code"
          test "$code" = 200
          curl -fsS --max-time 8 "https://leopardcat-tarot.milkcat.org$JS_ASSET" -o /tmp/leopardcat-public-release.js
          test "$(sha256sum "dist$JS_ASSET" | awk '{print $1}')" = "$(sha256sum /tmp/leopardcat-public-release.js | awk '{print $1}')"
          curl -fsS --max-time 8 https://leopardcat-tarot.milkcat.org/ -o /tmp/leopardcat-public-root.html
          grep -q 'property="og:image"' /tmp/leopardcat-public-root.html
          curl -fsS --max-time 8 https://leopardcat-tarot.milkcat.org/api/v1/decks/leopardcat -o /tmp/leopardcat-public-deck.json
          grep -q '"share_theme"' /tmp/leopardcat-public-deck.json

          echo '=== verify direct-entry reading UX ==='
          curl -fsS --max-time 8 https://leopardcat-tarot.milkcat.org/read.html -o /tmp/leopardcat-public-read.html
          grep -q '有什麼事情，正在讓你放不下？' /tmp/leopardcat-public-read.html
          grep -q '寫下你現在最想問的一件事' /tmp/leopardcat-public-read.html
          grep -q '開始占卜' /tmp/leopardcat-public-read.html
          curl -fsS --max-time 8 https://leopardcat-tarot.milkcat.org/locales_v10.json -o /tmp/leopardcat-public-locales.json
          grep -q '石虎塔羅' /tmp/leopardcat-public-locales.json
          grep -q '有一件事放不下嗎' /tmp/leopardcat-public-locales.json
          echo 'direct_entry_ux=PASS'

          echo "service_pid=$(systemctl --user show -p MainPID --value leopardcat-tarot.service)"
          echo 'leopardcat_reading_og_deploy=PASS'
          REMOTE
