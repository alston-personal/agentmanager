name: Oracle Verify Layout Lab Static Official

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-deploy-layoutlab-static-official.yml'

permissions:
  contents: write

# This legacy workflow is acceptance-only. Production mutation is owned by
# oracle-release-layoutlab-v07.yml. Never call deploy_layoutlab_static.py here:
# that base deploy intentionally starts from the historical layoutlab_v0_5.html
# source and would overwrite the release-patched production index.
concurrency:
  group: layoutlab-production-v07
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Assert release ownership invariant
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/oracle-release-layoutlab-v07.yml
          test -f scripts/deploy_layoutlab_v07_release.py
          grep -q "RELEASE = '0.7.9'" scripts/deploy_layoutlab_v07_release.py
          ! grep -q 'layoutlab.static.deploy' .github/workflows/oracle-deploy-layoutlab-static-official.yml
          ! grep -q 'deploy_layoutlab_static.py' .github/workflows/oracle-deploy-layoutlab-static-official.yml || grep -q 'Never call deploy_layoutlab_static.py here' .github/workflows/oracle-deploy-layoutlab-static-official.yml
          echo 'release_ownership=PASS'

      - name: Independent public v0.7.9 acceptance only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/layoutlab-static-official-acceptance.txt
          BASE=https://studio.milkcat.org/layout-lab
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            curl -fsS --retry 8 --retry-all-errors "$BASE/" -o /tmp/layoutlab-official-ui
            curl -fsS --retry 8 --retry-all-errors "$BASE/layoutlib-spatial-semantics-v0.1.js?v=0.7.9" -o /tmp/layoutlab-semantics
            curl -fsS --retry 8 --retry-all-errors "$BASE/layoutlab-editor-ui-v0.7.js?v=0.7.9" -o /tmp/layoutlab-editor-ui
            curl -fsS --retry 8 --retry-all-errors "$BASE/layoutlab-v0.7-release-fix.js?v=0.7.9" -o /tmp/layoutlab-release-fix
            grep -q '<div class="badge" data-release="0.7.9">v0.7.9</div>' /tmp/layoutlab-official-ui
            grep -q 'layoutlib-spatial-semantics-v0.1.js?v=0.7.9' /tmp/layoutlab-official-ui
            grep -q 'candidateOpenings' /tmp/layoutlab-semantics
            grep -q 'classifyOpening' /tmp/layoutlab-semantics
            grep -q 'segmentRooms' /tmp/layoutlab-semantics
            grep -q 'token_cost:0' /tmp/layoutlab-semantics
            grep -q 'LayoutLibEditor' /tmp/layoutlab-editor-ui
            grep -q "const RELEASE='0.7.9'" /tmp/layoutlab-release-fix
            grep -q 'installSemanticOverlay' /tmp/layoutlab-release-fix
            grep -q "fillText('門'" /tmp/layoutlab-release-fix
            grep -q "fillText('窗'" /tmp/layoutlab-release-fix
            ! grep -q 'AgentOS closed loop' /tmp/layoutlab-official-ui
            echo 'public_v079_identity=PASS'
            echo 'semantic_door_window_overlay=PASS'
            echo 'legacy_static_overwrite_disabled=PASS'
          } 2>&1 | tee "$OUT"

      - name: Commit acceptance evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp .agentos/evidence/layoutlab-static-official-acceptance.txt /tmp/layoutlab-static-official-acceptance.txt 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .agentos/evidence
          cp /tmp/layoutlab-static-official-acceptance.txt .agentos/evidence/layoutlab-static-official-acceptance.txt 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/layoutlab-static-official-acceptance.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(layoutlab): verify release-owned official browser UI'
          git push origin HEAD:main
