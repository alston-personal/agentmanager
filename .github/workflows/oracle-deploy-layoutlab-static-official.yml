name: Oracle Deploy Layout Lab Static Official

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-deploy-layoutlab-static-official.yml'
      - 'web_assets/layoutlab_official.html'
      - 'web_assets/layoutlib-browser-v0.3.js'
      - 'scripts/deploy_layoutlab_static.py'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - name: Wait for governed runtime refresh
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME=/home/ubuntu/.local/share/agentos/action-runtime
          SRC_HTML=$(sha256sum web_assets/layoutlab_official.html | awk '{print $1}')
          SRC_LIB=$(sha256sum web_assets/layoutlib-browser-v0.3.js | awk '{print $1}')
          SRC_DEPLOY=$(sha256sum scripts/deploy_layoutlab_static.py | awk '{print $1}')
          for i in $(seq 1 120); do
            if [ -f "$RUNTIME/web_assets/layoutlab_official.html" ] && \
               [ -f "$RUNTIME/web_assets/layoutlib-browser-v0.3.js" ] && \
               [ -f "$RUNTIME/scripts/deploy_layoutlab_static.py" ]; then
              RUN_HTML=$(sha256sum "$RUNTIME/web_assets/layoutlab_official.html" | awk '{print $1}')
              RUN_LIB=$(sha256sum "$RUNTIME/web_assets/layoutlib-browser-v0.3.js" | awk '{print $1}')
              RUN_DEPLOY=$(sha256sum "$RUNTIME/scripts/deploy_layoutlab_static.py" | awk '{print $1}')
              if [ "$SRC_HTML" = "$RUN_HTML" ] && [ "$SRC_LIB" = "$RUN_LIB" ] && [ "$SRC_DEPLOY" = "$RUN_DEPLOY" ]; then
                echo "runtime_asset_refresh=PASS"
                echo "runtime_deploy_script_refresh=PASS"
                exit 0
              fi
            fi
            sleep 1
          done
          echo "runtime_refresh=TIMEOUT"
          exit 3

      - name: Submit deterministic static deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/layoutlab-static-official.txt
          ROOT=/home/ubuntu/agent-data/runtime/action-relay
          CID=$(PYTHONPATH="$PWD" python3 - <<'PY'
          from agentos_node.action_relay import ActionRelayClient
          print(ActionRelayClient('/home/ubuntu/agent-data/runtime/action-relay').submit('layoutlab.static.deploy', {'site':'studio.milkcat.org'})['capsule_id'])
          PY
          )
          RECEIPT="$ROOT/receipts/$CID.json"
          for i in $(seq 1 60); do [ -f "$RECEIPT" ] && break; sleep 1; done
          test -f "$RECEIPT" || { echo "receipt timeout: $CID"; exit 2; }
          { echo "capsule_id=$CID"; cat "$RECEIPT"; } | tee "$OUT"
          python3 - "$RECEIPT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r.get('action') == 'layoutlab.static.deploy', r
          assert r.get('ok') is True, r
          assert r.get('executor_user') == 'ubuntu', r
          print('deterministic_static_deploy=PASS')
          PY

      - name: Independent public acceptance
        shell: bash
        run: |
          set -euo pipefail
          OUT=.agentos/evidence/layoutlab-static-official-acceptance.txt
          URL=https://studio.milkcat.org/layout-lab/
          LIB=https://studio.milkcat.org/layout-lab/layoutlib-browser-v0.3.js
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            CODE=$(curl -sS -o /tmp/layoutlab-static-ui -w '%{http_code}' --retry 5 --retry-all-errors --connect-timeout 5 --max-time 20 "$URL")
            LIBCODE=$(curl -sS -o /tmp/layoutlab-lib -w '%{http_code}' --retry 5 --retry-all-errors --connect-timeout 5 --max-time 20 "$LIB")
            echo "public_ui_http_code=$CODE"
            echo "public_library_http_code=$LIBCODE"
            test "$CODE" = 200
            test "$LIBCODE" = 200
            grep -q '<title>Layout Lab | Milkcat Studio</title>' /tmp/layoutlab-static-ui
            grep -q 'LayoutLib Browser Adapter v0.4.1' /tmp/layoutlab-static-ui
            grep -q '＋ 補牆' /tmp/layoutlab-static-ui
            grep -q '⌫ 擦牆' /tmp/layoutlab-static-ui
            grep -q '拉一段已知長度' /tmp/layoutlab-static-ui
            grep -q "version:'0.4.1'" /tmp/layoutlab-lib
            grep -q 'eraseStrokePx' /tmp/layoutlab-lib
            grep -q 'createScaleCalibration' /tmp/layoutlab-lib
            echo 'public_payload_identity=PASS'
            echo 'layoutlib_editor_capabilities=PASS'
            echo 'layoutlib_manual_scale_calibration=PASS'
            echo 'stable_official_url=https://studio.milkcat.org/layout-lab/'
            echo 'official_layoutlab_web_ui=PASS'
          } 2>&1 | tee "$OUT"

      - name: Commit deployment evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp .agentos/evidence/layoutlab-static-official.txt /tmp/layoutlab-static-official.txt 2>/dev/null || true
          cp .agentos/evidence/layoutlab-static-official-acceptance.txt /tmp/layoutlab-static-official-acceptance.txt 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .agentos/evidence
          cp /tmp/layoutlab-static-official.txt .agentos/evidence/layoutlab-static-official.txt 2>/dev/null || true
          cp /tmp/layoutlab-static-official-acceptance.txt .agentos/evidence/layoutlab-static-official-acceptance.txt 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/layoutlab-static-official*.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(layoutlab): stable official browser UI acceptance'
          git push origin HEAD:main
