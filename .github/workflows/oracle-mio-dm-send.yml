name: Oracle Mio DM Send
on:
  push:
    branches:
      - core/integration
    paths:
      - '.agentos/commands/mio-dm-send.json'
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: threads-mio-gui
  cancel-in-progress: false

# Core runtime is converged separately; this workflow must not overwrite live bootstrap_control.py.
jobs:
  send:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    env:
      PYTHONPATH: ${{ github.workspace }}
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
    steps:
      - uses: actions/checkout@v4
      - name: Validate send command
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,re
          c=json.load(open('.agentos/commands/mio-dm-send.json',encoding='utf-8'))
          assert c.get('schema')=='agentos.mio-dm-send-command/v1'
          target=str(c.get('target') or '').strip().lstrip('@')
          assert re.fullmatch(r'[A-Za-z0-9._]{1,64}',target),'invalid_target'
          decision_run_id=int(c.get('decision_run_id') or 0)
          assert decision_run_id>0
          status=str(c.get('status') or 'pending')
          assert status in ('pending','human_assisted_completed')
          print('mio_dm_send_command=PASS:'+status)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as e:
              e.write('MIO_DM_SKIP='+('1' if status=='human_assisted_completed' else '0')+'\n')
              e.write('MIO_DM_TARGET='+target+'\n')
              e.write('MIO_DM_DECISION_RUN_ID='+str(decision_run_id)+'\n')
          PY
      - name: Download validated decision artifact
        if: ${{ env.MIO_DM_SKIP != '1' }}
        uses: actions/download-artifact@v4
        with:
          name: mio-dm-decision
          path: /tmp/mio-dm-decision
          github-token: ${{ github.token }}
          repository: alston-personal/agentmanager
          run-id: ${{ env.MIO_DM_DECISION_RUN_ID }}
      - name: Send governed Threads DM and verify readback
        if: ${{ env.MIO_DM_SKIP != '1' }}
        shell: bash
        env:
          MIO_DM_DECISION_PATH: /tmp/mio-dm-decision/mio-dm-decision.json
          MIO_DM_TARGET: ${{ env.MIO_DM_TARGET }}
        run: |
          python3 scripts/send_mio_threads_dm_from_decision.py

      - name: Route Mio social incident
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/route_mio_social_incident.py
