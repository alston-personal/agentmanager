name: Mio Oracle Live GUI Threads Home Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/persona_gui_live_home_diagnostic.py'
      - 'scripts/probe_threads_web_dm_login_user.sh'
      - 'tests/test_mio_legacy_identity_recovery.py'
      - '.github/workflows/mio-gui-live-home-diagnostic.yml'
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate fail-closed classification
        run: python3 -m unittest tests.test_persona_gui_live_home_diagnostic tests.test_mio_legacy_identity_recovery -v
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Restore historical 9224 Mio account-bound GUI identity receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          PORT="${DEPLOY_SSH_PORT:-22}"
          REMOTE="/tmp/mio-identity-probe-${GITHUB_RUN_ID}.sh"
          scp -P "$PORT" -o StrictHostKeyChecking=accept-new scripts/probe_threads_web_dm_login_user.sh "$TARGET:$REMOTE"
          ssh -p "$PORT" -o StrictHostKeyChecking=accept-new "$TARGET" "trap 'rm -f $REMOTE' EXIT; bash '$REMOTE'"
      - name: Inspect existing 9224 Chromium and Mio supervisor after identity probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          PORT="${DEPLOY_SSH_PORT:-22}"
          ssh -p "$PORT" -o StrictHostKeyChecking=accept-new "$TARGET" 'bash -s' <<'REMOTE'
          set -u
          echo "mio_renderer_diagnostic=START"
          for unit in agentos-gui-browser.service mio-threads-session-supervisor.timer mio-threads-session-supervisor.service; do
            state="$(systemctl --user is-active "$unit" 2>/dev/null || true)"
            case "$state" in active|inactive|failed|activating|deactivating) ;; *) state=unknown;; esac
            echo "unit_${unit//[^a-zA-Z0-9]/_}=$state"
          done
          python3 - <<'PY'
          import json,urllib.request
          for port in (9222,9223,9224):
              try:
                  with urllib.request.urlopen(f"http://127.0.0.1:{port}/json/list",timeout=4) as f:
                      targets=json.load(f)
                  pages=[x for x in targets if x.get("type")=="page"]
                  print(f"cdp_{port}_status=REACHABLE")
                  print(f"cdp_{port}_page_count={len(pages)}")
                  print(f"cdp_{port}_blank_count={sum(x.get('url')=='about:blank' for x in pages)}")
                  if port == 9224:
                      from urllib.parse import urlsplit
                      from collections import Counter
                      def kind(item):
                          url=str(item.get('url') or '')
                          if url == 'about:blank': return 'BLANK'
                          try: parsed=urlsplit(url)
                          except ValueError: return 'OTHER'
                          if parsed.hostname not in ('www.threads.com','threads.com'): return 'OTHER'
                          if parsed.path.rstrip('/') == '/messages': return 'THREADS_MESSAGES'
                          if parsed.path.rstrip('/') in ('','/'): return 'THREADS_HOME'
                          if parsed.path.startswith('/@'): return 'THREADS_PROFILE_OR_POST'
                          return 'THREADS_OTHER'
                      counts=Counter(kind(item) for item in pages)
                      for category in ('THREADS_MESSAGES','THREADS_HOME','THREADS_PROFILE_OR_POST','THREADS_OTHER','BLANK','OTHER'):
                          print(f'mio_9224_tab_class_{category}={counts[category]}')
                      assert sum(counts.values()) == len(pages)

              except Exception:
                  print(f"cdp_{port}_status=UNAVAILABLE")
          PY
          STATE=/home/ubuntu/agent-data/runtime/mio-threads-session-supervisor/status.json
          if test -r "$STATE"; then
            python3 - "$STATE" <<'PY'
          import json,sys
          try:
              state=json.load(open(sys.argv[1]))
              status=str(state.get("session_state") or "UNKNOWN")
              print("mio_supervisor_state="+(status if status in {"AUTHENTICATED","LOGIN_REQUIRED","BLOCKED","UNKNOWN","PROBE_ERROR"} else "OTHER"))
          except Exception: print("mio_supervisor_state=INVALID")
          PY
          else echo 'mio_supervisor_state=NOT_PRESENT'; fi
          echo "mio_renderer_diagnostic=DONE"
          REMOTE
