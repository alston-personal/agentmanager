name: Register Market Master Canonical Project

on:
  push:
    paths:
      - '.github/workflows/register-market-master-project.yml'
      - 'scripts/register_canonical_project.py'

permissions:
  contents: read

concurrency:
  group: register-market-master-project
  cancel-in-progress: false

jobs:
  register:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
    steps:
      - uses: actions/checkout@v4

      - name: Register canonical project
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/register_canonical_project.py market-master-evolution \
            --display-name "Market Master Evolution" \
            --repo "alston-personal/agentmanager" \
            --branch "main" \
            --canonical-path "/home/ubuntu/agentmanager" \
            --node "oracle-core-node" \
            --alias "Market Master" \
            --alias "Behavioral Market Learning" \
            --summary "AgentOS market behavior learning, replay, strategy-delta evolution, and prediction validation." \
            --current-focus "Historical data loader and Market Replay MVP" \
            --next-action "Complete immutable historical data inventory and loader MVP" \
            --replace

      - name: Verify project store
        shell: bash
        run: |
          set -euo pipefail
          test -f /home/ubuntu/agent-data/projects/market-master-evolution/project.yaml
          test -f /home/ubuntu/agent-data/projects/market-master-evolution/STATUS.md
          test -d /home/ubuntu/agent-data/projects/market-master-evolution/memory
          grep -q 'project_id: market-master-evolution' /home/ubuntu/agent-data/projects/market-master-evolution/project.yaml
          grep -q 'alston-personal/agentmanager' /home/ubuntu/agent-data/projects/market-master-evolution/project.yaml
          grep -q './projects/market-master-evolution/STATUS.md' /home/ubuntu/agent-data/DASHBOARD.md
          echo 'market_master_registration=PASS'
