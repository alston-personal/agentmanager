name: Diagnostic 1682 Work Completion Compatibility
on:
  pull_request:
    paths:
      - 'tests/test_work_completion_mainline_contract.py'
      - '.github/workflows/diagnostic-1682-completion.yml'
permissions:
  contents: read
jobs:
  completion-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v tests.test_work_completion tests.test_work_completion_mainline_contract
