name: Oracle Probe Privilege Boundary

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-probe-privilege.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe non-interactive privilege paths
        shell: bash
        run: |
          set -uo pipefail
          echo "identity=$(id)"
          echo '=== sudo list ==='
          timeout 5 sudo -n -l 2>&1 || true
          echo '=== sudo as ubuntu ==='
          timeout 5 sudo -n -u ubuntu id 2>&1 || true
          echo '=== sudo root ==='
          timeout 5 sudo -n id 2>&1 || true
          echo '=== runuser ==='
          timeout 5 runuser -u ubuntu -- id 2>&1 || true
          echo '=== su ==='
          timeout 5 su -s /bin/sh -c id ubuntu 2>&1 || true
          echo '=== sg agentos ==='
          timeout 5 sg agentos -c 'id' 2>&1 || true
          echo '=== ubuntu user manager via --machine ==='
          timeout 8 systemctl --user --machine=ubuntu@.host is-active agentos-antigravity-relay.service 2>&1 || true
          echo '=== ubuntu transient user unit via --machine ==='
          timeout 8 systemd-run --user --machine=ubuntu@.host --wait --pipe /usr/bin/id 2>&1 || true
          echo '=== ubuntu user bus direct ==='
          timeout 8 env XDG_RUNTIME_DIR=/run/user/1001 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1001/bus systemctl --user is-active agentos-antigravity-relay.service 2>&1 || true
          echo 'probe_complete=YES'
