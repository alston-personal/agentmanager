name: Diagnose Realm Fabric Drop-ins

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-realm-dropins.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read-only drop-in inspection
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/ubuntu/.config/systemd/user/agentos-realm-fabric.service.d
          echo "dropin_root=$ROOT"
          if [ -d "$ROOT" ]; then
            find "$ROOT" -maxdepth 1 -type f -printf '%f\n' | sort
            for f in "$ROOT"/*.conf; do
              [ -f "$f" ] || continue
              echo "=== $f ==="
              cat "$f"
            done
          fi
          echo '=== effective unit ==='
          cat /home/ubuntu/.config/systemd/user/agentos-realm-fabric.service
