name: Oracle Exact Blocker Relocate

on:
  push:
    branches:
      - ops/oracle-drift-probe-20260904
    paths:
      - ".github/workflows/oracle-exact-blocker-relocate.yml"

permissions:
  contents: read

jobs:
  relocate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}

    steps:
      - name: Validate connection
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST_SOURCE:-}"
          test -n "${DEPLOY_USER:-}"
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Relocate exact three blockers into local backup
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          cd "$ROOT"

          EXPECTED_HEAD="42f21560c7d7e6692373938358f57b9262e198f0"
          TARGET_SHA="1dbdf20d76597e438c900df7ccb434a962e05075"
          [ "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" ] || { echo "relocate_refused=head_mismatch"; exit 2; }
          [ -z "$(git status --porcelain --untracked-files=no)" ] || { echo "relocate_refused=tracked_tree_dirty"; exit 2; }
          sudo -n true

          EVIDENCE=".agentos/evidence/layoutlab-official-v2.txt"
          BOOTSTRAP="agentos_node/bootstrap_control.py"
          ROUTE="dashboard/app/api/agentos/[...path]/route.ts"

          git fetch origin "$TARGET_SHA"
          for path in "$EVIDENCE" "$BOOTSTRAP" "$ROUTE"; do
            [ -f "$path" ] || { echo "relocate_refused=missing_local:$path"; exit 2; }
            git cat-file -e "$TARGET_SHA:$path" || { echo "relocate_refused=target_missing:$path"; exit 2; }
          done

          DATA_ROOT="${AGENT_DATA_ROOT:-${AGENT_DATA_DIR:-$HOME/agent-data}}"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP_ROOT="$DATA_ROOT/runtime/backups/oracle-untracked-$STAMP"
          mkdir -p "$BACKUP_ROOT/files/.agentos/evidence" "$BACKUP_ROOT/files/agentos_node" "$BACKUP_ROOT/files/dashboard/app/api/agentos/[...path]"
          chmod 700 "$BACKUP_ROOT" "$BACKUP_ROOT/files"

          printf '%s\n' "$EXPECTED_HEAD" > "$BACKUP_ROOT/head.txt"
          printf '%s\n' "$TARGET_SHA" > "$BACKUP_ROOT/target.txt"
          printf '%s\n' "$EVIDENCE" "$BOOTSTRAP" "$ROUTE" > "$BACKUP_ROOT/files.txt"
          sha256sum -- "$EVIDENCE" "$BOOTSTRAP" "$ROUTE" > "$BACKUP_ROOT/source-sha256.txt"

          sudo -n mv -- "$EVIDENCE" "$BACKUP_ROOT/files/$EVIDENCE"
          mv -- "$BOOTSTRAP" "$BACKUP_ROOT/files/$BOOTSTRAP"
          mv -- "$ROUTE" "$BACKUP_ROOT/files/$ROUTE"
          sudo -n chown -R "$(id -u):$(id -g)" "$BACKUP_ROOT"
          chmod -R go-rwx "$BACKUP_ROOT"

          [ ! -e "$EVIDENCE" ] || { echo "relocate_failed=still_exists:$EVIDENCE"; exit 2; }
          [ ! -e "$BOOTSTRAP" ] || { echo "relocate_failed=still_exists:$BOOTSTRAP"; exit 2; }
          [ ! -e "$ROUTE" ] || { echo "relocate_failed=still_exists:$ROUTE"; exit 2; }
          [ -z "$(git status --porcelain --untracked-files=no)" ] || { echo "relocate_failed=tracked_tree_dirty_after"; exit 2; }

          echo "untracked_relocate_completed=true"
          echo "backup_name=$(basename "$BACKUP_ROOT")"
          echo "relocated_count=3"
          echo "tracked_dirty_count=0"
          REMOTE
