name: Main Action Runtime Migration 20261007
# protected-main post-Gateway OIDC acceptance (Gateway release dd141cc8 verified)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-action-runtime-migration-20261007.yml'
      # ONE provider/dispatch source, not a generic Core website deploy trigger.
      - 'agent_core/executor_job_contract.py'
      - 'agentos_node/deployment_inspect_provider.py'
      - 'agentos_node/executor_job_action_relay.py'
      - 'agentos_node/executor_job_adapter.py'
      - 'agentos_node/action_relay.py'
      - 'scripts/inspect_realm_oidc_process_readonly.py'
      - 'tests/test_realm_oidc_process_readonly.py'

  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/main-action-runtime-migration-20261007.yml'
      - 'agent_core/executor_job_contract.py'
      - 'agentos_node/deployment_inspect_provider.py'
      - 'agentos_node/executor_job_action_relay.py'
      - 'agentos_node/executor_job_adapter.py'
      - 'agentos_node/action_relay.py'
      - 'scripts/inspect_realm_oidc_process_readonly.py'
      - 'tests/test_realm_oidc_process_readonly.py'
      - 'tests/test_deployment_inspect_one.py'
      - 'tests/test_main_runtime_deploy_routing.py'

permissions:
  contents: read
  id-token: write

# Reuse the existing Oracle Action Runtime rollout lock; do not update two
# incompatible generations of the same action relay simultaneously.
concurrency:
  group: oracle-action-runtime-rollout
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate fixed ONE deployment inspection contracts
        run: |
          set -euo pipefail
          python3 -m py_compile agent_core/executor_job_contract.py agentos_node/executor_job_adapter.py agentos_node/executor_job_action_relay.py agentos_node/deployment_inspect_provider.py
          python3 -m unittest tests.test_deployment_capability tests.test_deployment_inspect_one tests.test_main_runtime_deploy_routing tests.test_realm_oidc_process_readonly -v
          # Realm scheduler OIDC permission must admit ONLY the exact signed
          # protected-main repair workflow; never broaden to all main workflows.
          python3 -m pip install --disable-pip-version-check -q pytest
          python3 -m pytest -q tests/test_realm_scheduler_oidc.py
  audit-realm-runtime:
    needs: [validate]
    if: github.event_name == 'push'
    # Observe current Oracle node without changing Gateway, ONE or Action Relay.
    # This deliberately runs independently of the existing governed repair lane.
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read current Realm process and installed source provenance without secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/inspect_realm_oidc_process_readonly.py "${GITHUB_SHA}" > "${RUNNER_TEMP}/realm-oidc-attestation.json"
          python3 -m json.tool "${RUNNER_TEMP}/realm-oidc-attestation.json" > /dev/null
          python3 - "${RUNNER_TEMP}/realm-oidc-attestation.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          print("realm_oidc_classification="+d["classification"])
          print("realm_process_cwd_matches_canonical="+str(d["process_cwd_matches_canonical"]).lower())
          print("realm_source_oidc_allowlist_present="+str(d["source_allows_exact_main_repair"]).lower())
          print("realm_installed_file_matches_exact_source="+str(d["installed_matches_expected_commit"]).lower())
          print("realm_loaded_module_proved="+str(d["authoritative_loaded_module_proved"]).lower())
          PY
      - name: Save bounded, non-secret process identity receipt
        uses: actions/upload-artifact@v4
        with:
          name: realm-oidc-process-attestation
          path: ${{ runner.temp }}/realm-oidc-attestation.json
          if-no-files-found: error
          retention-days: 7

  migrate:
    needs: [validate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos
    steps:
      - name: Mint trusted main scheduler credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Confirm runtime repair catalog
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl -sS --max-time 15 \
            -D "$RUNNER_TEMP/catalog.headers" \
            -o "$RUNNER_TEMP/catalog.json" \
            -w '%{http_code}' \
            -H "Authorization: Bearer $AGENTOS_CONTROLLER_TOKEN" \
            "$AGENTOS_RUNNER_WINDOW_BASE/v1/dispatch" || true)"
          if [ "$STATUS" != 200 ]; then
            # Only known error categories and boolean claim-matches cross the CI log.
            # Never print bearer token, JWT bytes, full body or sensitive headers.
            python3 - "$RUNNER_TEMP/catalog.json" "$RUNNER_TEMP/catalog.headers" "$STATUS" <<'PY'
          import base64,json,os,sys
          from pathlib import Path
          raw=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          try:
              error=str(json.loads(raw).get('error') or '').lower()
          except (ValueError,TypeError,AttributeError):
              error=''
          classes={
              'github oidc ref invalid':'OIDC_REF_NOT_AUTHORIZED',
              'github oidc signature invalid':'OIDC_SIGNATURE_INVALID',
              'github oidc jwks unavailable':'OIDC_JWKS_UNAVAILABLE',
              'github oidc signing key unknown':'OIDC_SIGNING_KEY_UNKNOWN',
              'github oidc event invalid':'OIDC_EVENT_NOT_AUTHORIZED',
              'github oidc token outside validity window':'OIDC_EXPIRED',
              'github oidc token lifetime invalid':'OIDC_LIFETIME_INVALID',
              'github oidc repository invalid':'OIDC_REPOSITORY_INVALID',
              'github oidc audience invalid':'OIDC_AUDIENCE_INVALID',
              'github oidc issuer invalid':'OIDC_ISSUER_INVALID',
              'missing bearer credential':'BEARER_MISSING',
              'invalid controller credential':'CONTROLLER_CREDENTIAL_INVALID',
          }
          reason=next((value for key,value in classes.items() if key in error),'UNCLASSIFIED')
          headers=Path(sys.argv[2]).read_text(encoding='utf-8',errors='replace').lower()
          print('runtime_catalog_http_status='+sys.argv[3])
          print('runtime_catalog_gateway_response='+str('x-agentos-realm-gateway: v0.1' in headers).lower())
          print('runtime_catalog_rejection_category='+reason)
          token=os.environ.get('AGENTOS_CONTROLLER_TOKEN','')
          try:
              payload=token.split('.')[1]
              claims=json.loads(base64.urlsafe_b64decode(payload+'='*(-len(payload)%4)))
              main_ref='refs/'+'heads/'+'main'  # Match the workflow's main-only trigger without git mutation syntax.
              expected='alston-personal/agentmanager/.github/workflows/main-action-runtime-migration-20261007.yml@'+main_ref
              checks={
                  'repo': claims.get('repository')=='alston-personal/agentmanager',
                  'ref': claims.get('ref')==main_ref,
                  'workflow': claims.get('workflow_ref')==expected,
                  'event': claims.get('event_name')=='push',
                  'sha': claims.get('sha')==os.environ.get('GITHUB_SHA'),
                  'audience': 'agentos-scheduler' in ([claims.get('aud')] if isinstance(claims.get('aud'),str) else (claims.get('aud') or [])),
              }
              for key,good in sorted(checks.items()):
                  print('oidc_claim_'+key+'_match='+str(bool(good)).lower())
          except (ValueError,IndexError,TypeError):
              print('oidc_claim_decoding=FAILED')
          raise SystemExit(1)
          PY
          fi
          python3 - "$RUNNER_TEMP/catalog.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=d.get('intents') or d.get('catalog') or []
          matches=[x for x in rows if isinstance(x,dict) and x.get('capability')=='agentos.runtime' and x.get('operation')=='repair']
          assert matches,d
          print(json.dumps(matches,indent=2))
          print('runtime_repair_catalog=PASS')
          PY

      - name: Dispatch exact trusted main runtime repair
        shell: bash
        run: |
          set -euo pipefail
          TARGET_COMMIT="$GITHUB_SHA"
          printf '%s' "$TARGET_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          BODY="$(python3 - "$TARGET_COMMIT" <<'PY'
          import json,sys
          print(json.dumps({
            "schema":"agentos.runner-window-dispatch/v1",
            "capability":"agentos.runtime",
            "operation":"repair",
            "source_commit":sys.argv[1],
            "payload":{}
          },separators=(",",":")))
          PY
          )"
          SUBMIT="$RUNNER_TEMP/submit.json"
          code="$(curl -sS -o "$SUBMIT" -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $AGENTOS_CONTROLLER_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$BODY" "$AGENTOS_RUNNER_WINDOW_BASE/v1/dispatch" || true)"
          cat "$SUBMIT"; echo
          test "$code" = 202
          REQUEST_ID="$(python3 - "$SUBMIT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('ok') is True,d
          print(d['request_id'])
          PY
          )"
          echo "request_id=$REQUEST_ID"
          deadline=$((SECONDS+720))
          while [ "$SECONDS" -lt "$deadline" ]; do
            STATUS="$RUNNER_TEMP/status.json"
            code="$(curl -sS -o "$STATUS" -w '%{http_code}' --max-time 20 \
              -H "Authorization: Bearer $AGENTOS_CONTROLLER_TOKEN" \
              "$AGENTOS_RUNNER_WINDOW_BASE/v1/dispatch/requests/$REQUEST_ID" || true)"
            if [ "$code" = 200 ]; then
              state="$(python3 - "$STATUS" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding='utf-8')).get('state') or 'unknown')
          PY
          )"
              echo "state=$state"
              if [ "$state" = completed ]; then
                cat "$STATUS"; echo
                cp "$STATUS" "$RUNNER_TEMP/final.json"
                break
              fi
            fi
            sleep 2
          done
          test -f "$RUNNER_TEMP/final.json"
          python3 - "$RUNNER_TEMP/final.json" "$TARGET_COMMIT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          r=d.get('receipt') or {}
          print(json.dumps(r,indent=2,ensure_ascii=False))
          assert r.get('ok') is True,r
          assert r.get('source_commit')==sys.argv[2],r
          evidence=[str(x) for x in (r.get('evidence') or [])]
          assert 'action_relay_install=PASS' in evidence,evidence
          assert f'agentos_source_commit={sys.argv[2]}' in evidence,evidence
          print('oracle_action_runtime_main_migration=PASS')
          PY
