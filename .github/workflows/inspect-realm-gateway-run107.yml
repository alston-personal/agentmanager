name: Inspect Realm Gateway Run 107

on:
  push:
    branches:
      - inspect/realm-gateway-run107
    paths:
      - '.github/workflows/inspect-realm-gateway-run107.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Read run107 terminal receipt
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" \
            "python3 -c 'import json; p=\"/tmp/agentos-bootstrap-control/receipts/realm-gateway-36830120832-1.json\"; d=json.load(open(p,encoding=\"utf-8\")); safe={\"schema\":d.get(\"schema\"),\"request_id\":d.get(\"request_id\"),\"action\":d.get(\"action\"),\"source_commit\":d.get(\"source_commit\"),\"ok\":d.get(\"ok\"),\"error\":d.get(\"error\"),\"failure_class\":d.get(\"failure_class\"),\"executor_user\":d.get(\"executor_user\"),\"started_at\":d.get(\"started_at\"),\"completed_at\":d.get(\"completed_at\"),\"scheduler\":d.get(\"scheduler\"),\"steps\":[{\"step\":x.get(\"step\"),\"returncode\":x.get(\"returncode\"),\"stdout_tail\":str(x.get(\"stdout\") or \"\")[-2200:],\"stderr_tail\":str(x.get(\"stderr\") or \"\")[-2200:]} for x in (d.get(\"steps\") or [])]}; print(json.dumps(safe,indent=2,sort_keys=True))'"
