name: Inspect Realm Gateway Run 107

on:
  push:
    branches:
      - inspect/realm-gateway-run107
    paths:
      - '.github/workflows/inspect-realm-gateway-run107.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Read scheduler and request state
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          REQUEST_ID='realm-gateway-36830120832-1'
          DATA=/home/ubuntu/agent-data
          ROOT=/tmp/agentos-bootstrap-control
          echo 'scheduler_status_begin'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/home/ubuntu/agent-data/runtime/bootstrap-scheduler/status.json')
          if not p.exists():
              print('scheduler_status=MISSING')
          else:
              d=json.loads(p.read_text())
              safe={
                'updated_at':d.get('updated_at'),
                'node':d.get('node'),
                'queue_depth':d.get('queue_depth'),
                'workers':{},
              }
              for wid,row in (d.get('workers') or {}).items():
                  cur=row.get('current_job') if isinstance(row,dict) else None
                  safe['workers'][wid]={
                    'role':row.get('role'),
                    'state':row.get('state'),
                    'heartbeat':row.get('heartbeat'),
                    'current_job': None if not isinstance(cur,dict) else {
                      'request_id':cur.get('request_id'),
                      'action':cur.get('action'),
                      'priority':cur.get('priority'),
                      'locks':cur.get('locks'),
                    }
                  }
              print(json.dumps(safe,indent=2,sort_keys=True))
          PY
          echo 'scheduler_status_end'
          for kind in requests receipts rejected; do
            p="$ROOT/$kind/$REQUEST_ID"
            [ "$kind" = requests ] && p="$p.request.json"
            [ "$kind" = receipts ] && p="$p.json"
            [ "$kind" = rejected ] && p="$p.request.json"
            if [ -f "$p" ]; then
              echo "$kind=PRESENT"
              if [ "$kind" = receipts ]; then
                python3 - "$p" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          out={
            'schema':d.get('schema'),'request_id':d.get('request_id'),'action':d.get('action'),
            'source_commit':d.get('source_commit'),'ok':d.get('ok'),'error':d.get('error'),
            'started_at':d.get('started_at'),'completed_at':d.get('completed_at'),
            'scheduler':d.get('scheduler'),
            'steps':[{
              'step':s.get('step'),'returncode':s.get('returncode'),'error':s.get('error'),
              'stdout_tail':str(s.get('stdout') or '')[-1200:],
              'stderr_tail':str(s.get('stderr') or '')[-1200:]
            } for s in (d.get('steps') or [])]
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
              fi
            else
              echo "$kind=ABSENT"
            fi
          done
          REMOTE
