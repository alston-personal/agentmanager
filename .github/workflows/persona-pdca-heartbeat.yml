name: Persona PDCA Heartbeat

on:
  workflow_dispatch:
    inputs:
      persona_path:
        description: Persona path inside my-agent-data
        required: false
        default: personas/sunlake-milkcat
  push:
    branches: [main]
    paths:
      - 'scripts/persona_pdca_tick.py'
      - 'scripts/persona_social_executor.py'
      - 'scripts/persona_media_request_worker.py'
      - 'scripts/persona_media_asset.py'
      - 'scripts/persona_media_review.py'
      - 'scripts/persona_reference_install.py'
      - 'scripts/persona_wardrobe_sources.py'
      - 'scripts/validate_mio_visual_manifest.py'
      - 'scripts/persona_image_generate_flux.py'
      - 'scripts/capability_experience_ledger.py'
      - 'scripts/persona_internal_activity_executor.py'
      - 'scripts/persona_reply_intent_generator.py'
      - 'scripts/publish_mio_public_activity.py'
      - 'scripts/persona_post_intent_generator.py'
      - 'scripts/persona_growth_metrics_collector.py'
      - 'scripts/run_persona_pdca_heartbeat_user.sh'
      - 'scripts/run_persona_social_actions_user.sh'
      - 'scripts/install_persona_pdca_timer_user.sh'
      - '.github/workflows/persona-pdca-heartbeat.yml'

permissions:
  contents: read

concurrency:
  group: persona-pdca-sunlake-milkcat
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PERSONA_PATH: ${{ github.event.inputs.persona_path || 'personas/sunlake-milkcat' }}
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Verify carrier
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/persona_pdca_tick.py
          test -f scripts/persona_social_executor.py
          test -f scripts/persona_internal_activity_executor.py
          test -f scripts/persona_reply_intent_generator.py
          test -f scripts/persona_post_intent_generator.py
          test -f scripts/persona_wardrobe_sources.py
          test -f scripts/persona_growth_metrics_collector.py
          test -n "${DEPLOY_USER:-}"
          echo "persona_pdca_carrier=PASS"

      - name: Install local Persona PDCA timer
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_TICK="/tmp/persona_pdca_tick-install-$GITHUB_RUN_ID.py"
          REMOTE_RUNNER="/tmp/run_persona_pdca_heartbeat-$GITHUB_RUN_ID.sh"
          REMOTE_SOCIAL_EXECUTOR="/tmp/persona_social_executor-install-$GITHUB_RUN_ID.py"
          REMOTE_INTERNAL_EXECUTOR="/tmp/persona_internal_activity_executor-install-$GITHUB_RUN_ID.py"
          REMOTE_REPLY_INTENT_GENERATOR="/tmp/persona_reply_intent_generator-install-$GITHUB_RUN_ID.py"
          REMOTE_PUBLIC_ACTIVITY_PUBLISHER="/tmp/publish_mio_public_activity-install-$GITHUB_RUN_ID.py"
          REMOTE_POST_INTENT_GENERATOR="/tmp/persona_post_intent_generator-install-$GITHUB_RUN_ID.py"
          REMOTE_SOCIAL_RUNNER="/tmp/run_persona_social_actions-$GITHUB_RUN_ID.sh"
          REMOTE_GROWTH_METRICS="/tmp/persona_growth_metrics_collector-$GITHUB_RUN_ID.py"
          REMOTE_MEDIA_WORKER="/tmp/persona_media_request_worker-$GITHUB_RUN_ID.py"
          REMOTE_IMAGE_EXECUTOR="/tmp/persona_image_generate_flux-$GITHUB_RUN_ID.py"
          REMOTE_EXPERIENCE_LEDGER="/tmp/capability_experience_ledger-$GITHUB_RUN_ID.py"
          REMOTE_INSTALLER="/tmp/install_persona_pdca_timer-$GITHUB_RUN_ID.sh"
          REMOTE_MEDIA_ASSET="/tmp/persona_media_asset-$GITHUB_RUN_ID.py"
          REMOTE_VISUAL_VALIDATOR="/tmp/validate_mio_visual_manifest-$GITHUB_RUN_ID.py"
          REMOTE_MEDIA_REVIEW="/tmp/persona_media_review-$GITHUB_RUN_ID.py"
          REMOTE_WARDROBE_SOURCES="/tmp/persona_wardrobe_sources-$GITHUB_RUN_ID.py"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/persona_wardrobe_sources.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_WARDROBE_SOURCES"
          REMOTE_REFERENCE_INSTALLER="/tmp/persona_reference_install-$GITHUB_RUN_ID.py"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/persona_reference_install.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_REFERENCE_INSTALLER"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/persona_media_review.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_MEDIA_REVIEW"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/persona_media_asset.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_MEDIA_ASSET"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/validate_mio_visual_manifest.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_VISUAL_VALIDATOR"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/persona_media_request_worker.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_MEDIA_WORKER"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/persona_image_generate_flux.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_IMAGE_EXECUTOR"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/capability_experience_ledger.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_EXPERIENCE_LEDGER"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            scripts/persona_pdca_tick.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_TICK"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            scripts/run_persona_pdca_heartbeat_user.sh "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_RUNNER"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            scripts/run_persona_social_actions_user.sh "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_SOCIAL_RUNNER"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            scripts/persona_social_executor.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_SOCIAL_EXECUTOR"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            scripts/persona_internal_activity_executor.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_INTERNAL_EXECUTOR"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            scripts/persona_reply_intent_generator.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_REPLY_INTENT_GENERATOR"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            scripts/publish_mio_public_activity.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_PUBLIC_ACTIVITY_PUBLISHER"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            scripts/persona_post_intent_generator.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_POST_INTENT_GENERATOR"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            scripts/persona_growth_metrics_collector.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_GROWTH_METRICS"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            scripts/install_persona_pdca_timer_user.sh "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_INSTALLER"
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash "$REMOTE_INSTALLER" "$REMOTE_TICK" "$REMOTE_RUNNER" "$REMOTE_SOCIAL_EXECUTOR" "$REMOTE_INTERNAL_EXECUTOR" "$REMOTE_REPLY_INTENT_GENERATOR" "$REMOTE_PUBLIC_ACTIVITY_PUBLISHER" "$REMOTE_POST_INTENT_GENERATOR" "$REMOTE_SOCIAL_RUNNER" "$REMOTE_GROWTH_METRICS" "$REMOTE_MEDIA_WORKER" "$REMOTE_IMAGE_EXECUTOR" "$REMOTE_EXPERIENCE_LEDGER" "$REMOTE_MEDIA_ASSET" "$REMOTE_VISUAL_VALIDATOR" "$REMOTE_MEDIA_REVIEW" "$REMOTE_REFERENCE_INSTALLER" "$REMOTE_WARDROBE_SOURCES"
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            rm -f "$REMOTE_TICK" "$REMOTE_RUNNER" "$REMOTE_SOCIAL_RUNNER" "$REMOTE_SOCIAL_EXECUTOR" "$REMOTE_INTERNAL_EXECUTOR" "$REMOTE_REPLY_INTENT_GENERATOR" "$REMOTE_PUBLIC_ACTIVITY_PUBLISHER" "$REMOTE_POST_INTENT_GENERATOR" "$REMOTE_GROWTH_METRICS" "$REMOTE_MEDIA_WORKER" "$REMOTE_IMAGE_EXECUTOR" "$REMOTE_EXPERIENCE_LEDGER" "$REMOTE_MEDIA_ASSET" "$REMOTE_VISUAL_VALIDATOR" "$REMOTE_MEDIA_REVIEW" "$REMOTE_REFERENCE_INSTALLER" "$REMOTE_WARDROBE_SOURCES" "$REMOTE_INSTALLER"

      - name: Install approved Mio reference privately
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            python3 /home/ubuntu/.local/lib/agentos/persona_reference_install.py --source-sha "$GITHUB_SHA"

      - name: Transfer PDCA runtime to Oracle execution identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SCRIPT="/tmp/persona_pdca_tick-$GITHUB_RUN_ID.py"
          REMOTE_SOCIAL_EXECUTOR="/tmp/persona_social_executor-$GITHUB_RUN_ID.py"
          REMOTE_INTERNAL_EXECUTOR="/tmp/persona_internal_activity_executor-$GITHUB_RUN_ID.py"
          REMOTE_REPLY_INTENT_GENERATOR="/tmp/persona_reply_intent_generator-$GITHUB_RUN_ID.py"
          REMOTE_POST_INTENT_GENERATOR="/tmp/persona_post_intent_generator-$GITHUB_RUN_ID.py"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/persona_pdca_tick.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_SCRIPT"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/persona_social_executor.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_SOCIAL_EXECUTOR"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/persona_internal_activity_executor.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_INTERNAL_EXECUTOR"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/persona_reply_intent_generator.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_REPLY_INTENT_GENERATOR"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/persona_post_intent_generator.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_POST_INTENT_GENERATOR"
          echo "REMOTE_SCRIPT=$REMOTE_SCRIPT" >> "$GITHUB_ENV"
          echo "REMOTE_SOCIAL_EXECUTOR=$REMOTE_SOCIAL_EXECUTOR" >> "$GITHUB_ENV"
          echo "REMOTE_INTERNAL_EXECUTOR=$REMOTE_INTERNAL_EXECUTOR" >> "$GITHUB_ENV"
          echo "REMOTE_REPLY_INTENT_GENERATOR=$REMOTE_REPLY_INTENT_GENERATOR" >> "$GITHUB_ENV"
          echo "REMOTE_POST_INTENT_GENERATOR=$REMOTE_POST_INTENT_GENERATOR" >> "$GITHUB_ENV"

      - name: Run and persist one PDCA cycle on Oracle
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new             "${DEPLOY_USER}@${DEPLOY_HOST}"             bash -s -- "$PERSONA_PATH" "$REMOTE_SCRIPT" "$REMOTE_SOCIAL_EXECUTOR" "$REMOTE_INTERNAL_EXECUTOR" "$REMOTE_REPLY_INTENT_GENERATOR" "$REMOTE_POST_INTENT_GENERATOR" "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          PERSONA_PATH="$1"
          SCRIPT="$2"
          SOCIAL_EXECUTOR="$3"
          INTERNAL_EXECUTOR="$4"
          REPLY_INTENT_GENERATOR="$5"
          POST_INTENT_GENERATOR="$6"
          RUN_ID="$7"
          export AGENTOS_MIO_GARMENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH="$HOME/.local/lib/agentos${PYTHONPATH:+:$PYTHONPATH}"
          DATA_REPO=$(mktemp -d /tmp/persona-agent-data-XXXXXX)
          RECEIPT="/tmp/persona-pdca-receipt-$RUN_ID.json"
          cleanup() {
            rm -rf "$DATA_REPO" "$SCRIPT" "$SOCIAL_EXECUTOR" "$INTERNAL_EXECUTOR" "$REPLY_INTENT_GENERATOR" "$POST_INTENT_GENERATOR" "$RECEIPT"
          }
          trap cleanup EXIT

          /usr/bin/gh auth status >/dev/null
          /usr/bin/gh auth setup-git
          /usr/bin/gh repo clone alston-personal/my-agent-data "$DATA_REPO" -- --branch main --single-branch
          git -C "$DATA_REPO" config --unset-all credential.helper || true
          git -C "$DATA_REPO" config credential.https://github.com.helper '!/usr/bin/gh auth git-credential'

          test -f "$DATA_REPO/$PERSONA_PATH/persona_state.json"
          test -f "$DATA_REPO/$PERSONA_PATH/ir/current.json"
          test -f "$DATA_REPO/$PERSONA_PATH/pdca/config.json"

          python3 "$SCRIPT" --persona-dir "$DATA_REPO/$PERSONA_PATH" --receipt-out "$RECEIPT" --trigger workflow_dispatch
          python3 -m json.tool "$RECEIPT" >/dev/null
          python3 "$INTERNAL_EXECUTOR" --persona-dir "$DATA_REPO/$PERSONA_PATH"
          python3 "$REPLY_INTENT_GENERATOR" --persona-dir "$DATA_REPO/$PERSONA_PATH"
          python3 "$POST_INTENT_GENERATOR" --persona-dir "$DATA_REPO/$PERSONA_PATH"
          SOCIAL_RECEIPT="$DATA_REPO/$PERSONA_PATH/pdca/social_receipts/$(date -u +%Y%m%dT%H%M%SZ).json"
          mkdir -p "$(dirname "$SOCIAL_RECEIPT")"
          python3 "$SOCIAL_EXECUTOR" --persona-dir "$DATA_REPO/$PERSONA_PATH" --username mio.milkcat --receipt-out "$SOCIAL_RECEIPT"
          python3 -m json.tool "$SOCIAL_RECEIPT" >/dev/null

          cd "$DATA_REPO"
          git config user.name 'agentos-persona-pdca[bot]'
          git config user.email 'agentos-persona-pdca[bot]@users.noreply.github.com'
          git add "$PERSONA_PATH/pdca" "$PERSONA_PATH/events/events.jsonl"
          if ! git diff --cached --quiet; then
            CYCLE=$(python3 -c "import json; print(json.load(open('$PERSONA_PATH/pdca/state.json'))['cycle'])")
            git commit -m "persona(mio): persist autonomous PDCA cycle $CYCLE"
            git push
          fi

          python3 - "$DATA_REPO/$PERSONA_PATH" "$RECEIPT" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); receipt=Path(sys.argv[2])
          s=json.load(open(p/"pdca/state.json",encoding="utf-8"))
          last=json.load(open(receipt,encoding="utf-8"))
          assert s["status"]=="RUNNING", s
          assert int(s["cycle"]) >= 1, s
          assert last["cycle"] == s["cycle"], (last,s)
          assert last["truth_boundary"]["external_receipt_required"] is True
          print(f"persona_pdca_acceptance=PASS cycle={s['cycle']} intent={last['plan']['selected_intent']}")
          PY

          cat "$RECEIPT"
          REMOTE

      - name: Inspect Persona timer runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY_RUNTIME'
          import hashlib,json,os,re,socket,subprocess,sys
          from datetime import datetime,timezone
          from pathlib import Path

          CORE="agentos-persona-pdca-heartbeat"
          SOCIAL="agentos-persona-social-actions"
          PROPS=("LoadState","ActiveState","SubState","Result","ExecMainStatus",
                 "ExecMainStartTimestamp","ExecMainExitTimestamp",
                 "LastTriggerUSec","NextElapseUSecRealtime")
          STATES={"LoadState":{"loaded","error","masked","not-found","bad-setting","stub","merged"},
                  "ActiveState":{"active","reloading","inactive","failed","activating","deactivating","maintenance","refreshing"},
                  "SubState":{"running","dead","exited","failed","waiting","elapsed","start","start-pre","start-post",
                              "stop","stop-sigterm","stop-sigkill","stop-post","final-sigterm","final-sigkill",
                              "auto-restart","cleaning","reload","condition","listening"},
                  "Result":{"success","protocol","timeout","exit-code","signal","core-dump","watchdog",
                            "start-limit-hit","resources","oom-kill","exec-condition","assert","dependency","skipped"}}
          DATE=re.compile(r"^[A-Z][a-z]{2} [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,6})? [A-Z0-9+:-]{1,12}$")
          MARKER=re.compile(r"^(persona_pdca_runtime|persona_social_action_runtime|persona_social_state_integrity|persona_social_reply_intent|persona_social_post_intent)=([A-Z_]{1,48})(?: |$)")

          def read_command(command):
              try:
                  result=subprocess.run(command,text=True,capture_output=True,timeout=10,
                      env={**os.environ,"LC_ALL":"C","SYSTEMD_COLORS":"0"})
                  if result.returncode!=0: return None,"READ_FAILED"
                  return result.stdout,None
              except subprocess.TimeoutExpired: return None,"READ_TIMEOUT"
              except OSError: return None,"READ_UNAVAILABLE"

          def unit_snapshot(unit):
              raw,error=read_command(["systemctl","--user","show",unit,
                                     *[part for prop in PROPS for part in ("-p",prop)]])
              if error: return {"read_status":error,"properties":{}}
              values={}; invalid=0
              for line in raw.splitlines():
                  key,sep,value=line.partition("=")
                  if not sep or key not in PROPS: continue
                  if not value: values[key]=None; continue
                  valid=(value in STATES[key] if key in STATES else
                         bool(re.fullmatch(r"[0-9]{1,6}",value)) if key=="ExecMainStatus" else
                         bool(DATE.fullmatch(value)))
                  if valid: values[key]=int(value) if key=="ExecMainStatus" else value
                  else: invalid+=1; values.pop(key,None)
              missing=[key for key in ("LoadState","ActiveState","SubState") if key not in values]
              return {"read_status":"INVALID_PROPERTIES" if invalid else "MISSING_PROPERTIES" if missing else "PASS",
                      "properties":values,"invalid_property_count":invalid,"missing_properties":missing}

          def journal_snapshot(unit,since,until=None):
              command=["journalctl","--user","-u",unit,"--since",since,"-n","200",
                       "--no-pager","--output=json"]
              if until: command.extend(["--until",until])
              raw,error=read_command(command)
              report={"unit":unit,"since":since,"until":until,"row_limit":200,
                      "read_status":error or "PASS","observed_rows":0,"malformed_rows":0,"invalid_marker_timestamps":0,
                      "markers":[],"coverage":"BOUNDED_NOT_EXHAUSTIVE"}
              if error: return report
              for line in raw.splitlines()[-200:]:
                  try:
                      row=json.loads(line)
                      if not isinstance(row,dict): raise ValueError("row_not_object")
                  except (ValueError,TypeError):
                      report["malformed_rows"]+=1; continue
                  report["observed_rows"]+=1
                  message=row.get("MESSAGE")
                  match=MARKER.match(message) if isinstance(message,str) else None
                  if not match: continue
                  stamp=str(row.get("__REALTIME_TIMESTAMP") or "")
                  if not re.fullmatch(r"[0-9]{1,20}",stamp):
                      report["invalid_marker_timestamps"]+=1; continue
                  try: observed=datetime.fromtimestamp(int(stamp)/1000000,timezone.utc).isoformat().replace("+00:00","Z")
                  except (OverflowError,ValueError,OSError):
                      report["invalid_marker_timestamps"]+=1; continue
                  report["markers"].append({"timestamp":observed,"name":match[1],"value":match[2]})
              if report["malformed_rows"] or report["invalid_marker_timestamps"]: report["read_status"]="PARTIAL_PARSE"
              return report

          def source_hash(path):
              try: return hashlib.sha256(Path(path).read_bytes()).hexdigest()
              except OSError: return None

          def inspect():
              node=socket.gethostname()
              production=os.getuid()==1001 and node=="instance-20260129-0852"
              units={name:unit_snapshot(name) for base in (CORE,SOCIAL)
                     for name in (base+".service",base+".timer")}
              journals={
                  "core_incident_1730":journal_snapshot(CORE+".service","2026-10-11 22:15:00 UTC","2026-10-11 22:40:00 UTC"),
                  "core_recent":journal_snapshot(CORE+".service","2 hours ago"),
                  "social_recent":journal_snapshot(SOCIAL+".service","2 hours ago")}
              sources={"core_runner":"/home/ubuntu/.local/bin/agentos-persona-pdca-heartbeat",
                       "social_runner":"/home/ubuntu/.local/bin/agentos-persona-social-actions",
                       "core_tick":"/home/ubuntu/.local/lib/agentos/persona_pdca_tick.py",
                       "internal_executor":"/home/ubuntu/.local/lib/agentos/persona_internal_activity_executor.py",
                       "reply_generator":"/home/ubuntu/.local/lib/agentos/persona_reply_intent_generator.py",
                       "post_generator":"/home/ubuntu/.local/lib/agentos/persona_post_intent_generator.py",
                       "social_executor":"/home/ubuntu/.local/lib/agentos/persona_social_executor.py"}
              hashes={name:source_hash(path) for name,path in sources.items()}
              complete=(all(x["read_status"]=="PASS" for x in [*units.values(),*journals.values()])
                        and all(value is not None for value in hashes.values()))
              return {"schema":"agentos.execution-receipt/v1","operation":"persona.runtime.inspect",
                      "node":node,"authority":{"kind":"runtime_node" if production else "offline_fixture",
                                               "sandbox_fallback_allowed":False},
                      "environment":"production" if production else "offline",
                      "observed_at":datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
                      "python_version":".".join(str(x) for x in sys.version_info[:3]),
                      "status":"completed" if complete else "partial",
                      "units":units,"journals":journals,
                      "source_sha256":hashes,
                      "functional_acceptance":"NOT_EVALUATED","publication_allowed":False}

          if __name__=="__main__": print(json.dumps(inspect(),sort_keys=True))
          PY_RUNTIME
          REMOTE

      - name: Refresh current Mio public activity snapshot
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          DATA_REPO=$(mktemp -d /tmp/mio-public-snapshot-XXXXXX)
          cleanup(){ rm -rf "$DATA_REPO"; }
          trap cleanup EXIT
          /usr/bin/gh auth status >/dev/null
          /usr/bin/gh auth setup-git >/dev/null
          git clone --depth=1 --filter=blob:none --sparse --branch main --single-branch \
            https://github.com/alston-personal/my-agent-data.git "$DATA_REPO" >/dev/null
          git -C "$DATA_REPO" sparse-checkout set personas/sunlake-milkcat
          PUBLISHER=/home/ubuntu/.local/lib/agentos/publish_mio_public_activity.py
          test -f "$PUBLISHER"
          python3 "$PUBLISHER" \
            --persona-dir "$DATA_REPO/personas/sunlake-milkcat" \
