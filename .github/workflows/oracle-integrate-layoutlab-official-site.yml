name: Oracle Integrate Layout Lab Into Official Site

on:
  push:
    paths:
      - '.github/workflows/oracle-integrate-layoutlab-official-site.yml'

permissions:
  contents: read

jobs:
  inspect_metashield_media_runtime:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect media runtime diagnostics and error sink
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE' | tee .agentos/evidence/metashield-media-runtime-inspect.txt
          set -euo pipefail
          ROOT=/home/ubuntu/metashield-protocol
          echo "version=$(python3 -c 'import json;print(json.load(open("'$ROOT'/extension/manifest.json"))["version"])')"
          echo '===== reportBackgroundError definition/calls ====='
          grep -RniE 'function reportBackgroundError|reportBackgroundError\(|background:media-upload' "$ROOT/extension" "$ROOT/backend" 2>/dev/null --exclude-dir=node_modules | sed -n '1,220p' || true
          line=$(grep -n 'function reportBackgroundError' "$ROOT/extension/background.js" | head -1 | cut -d: -f1 || true)
          if test -n "$line"; then start=$((line-15)); end=$((line+90)); nl -ba "$ROOT/extension/background.js" | sed -n "${start},${end}p"; fi
          echo '===== likely runtime logs ====='
          find "$ROOT" /home/ubuntu/agent-data -maxdepth 5 -type f \( -name '*.log' -o -name '*.jsonl' -o -name '*error*' -o -name '*diagnostic*' \) 2>/dev/null | grep -Ei 'chamber|metashield|backend|runtime|error|diagnostic' | sed -n '1,240p' || true
          echo '===== recent matching log lines ====='
          grep -RniE 'background:media-upload|Platform media fetch failed|Media API error|not enough balance|imageUploadFailed|media fallback upload failed' "$ROOT" /home/ubuntu/agent-data 2>/dev/null --exclude-dir=node_modules --exclude='*.map' | tail -240 || true
          echo '===== backend processes ====='
          ps -ef | grep -Ei 'chamber|metashield' | grep -v grep || true
          echo '===== git status ====='
          git -C "$ROOT" status --short --branch
          REMOTE
      - uses: actions/upload-artifact@v4
        with:
          name: metashield-media-runtime-inspect
          path: .agentos/evidence/metashield-media-runtime-inspect.txt
          if-no-files-found: error
