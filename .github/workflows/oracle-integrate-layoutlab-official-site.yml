name: Oracle Integrate Layout Lab Into Official Site

on:
  push:
    paths:
      - '.github/workflows/oracle-integrate-layoutlab-official-site.yml'
      - 'scripts/metashield_fix_legacy_owner_keyring.py'

permissions:
  contents: read

jobs:
  metashield_fix_legacy_owner_keyring:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Copy legacy keyring patch
        shell: bash
        run: |
          set -euo pipefail
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/metashield_fix_legacy_owner_keyring.py "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/metashield_fix_legacy_owner_keyring.py"
      - name: Patch and verify extension legacy keyring
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .agentos/evidence
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE' | tee .agentos/evidence/metashield-legacy-owner-keyring.txt
          set -euo pipefail
          ROOT=/home/ubuntu/metashield-protocol
          python3 /tmp/metashield_fix_legacy_owner_keyring.py
          node --check "$ROOT/extension/background.js"
          grep -q '"version": "1.0.63"' "$ROOT/extension/manifest.json"
          grep -q 'async function storeLegacyOwnerKey' "$ROOT/extension/background.js"
          grep -q 'preservedCurrentOwner: true' "$ROOT/extension/background.js"
          test "$(grep -c 'shouldPreserveCurrentOwnerKey(ownerUserId, shareB.ownerAddress)' "$ROOT/extension/background.js")" -ge 2
          if test -f "$ROOT/scripts/test-threads-background.js"; then
            cd "$ROOT"
            node scripts/test-threads-background.js
          fi
          echo '===== diff ====='
          git -C "$ROOT" diff -- extension/background.js extension/manifest.json | sed -n '1,420p'
          echo '===== worktree ====='
          git -C "$ROOT" status --short --branch
          REMOTE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metashield-legacy-owner-keyring
          path: .agentos/evidence/metashield-legacy-owner-keyring.txt
          if-no-files-found: warn
