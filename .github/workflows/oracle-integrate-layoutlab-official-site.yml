name: Oracle Integrate Layout Lab Into Official Site

on:
  push:
    paths:
      - '.github/workflows/oracle-integrate-layoutlab-official-site.yml'

permissions:
  contents: read

jobs:
  inspect_metashield_irys_dependency:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect Irys dependency declaration and runtime resolution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE' | tee .agentos/evidence/metashield-irys-dependency-inspect.txt
          set -euo pipefail
          ROOT=/home/ubuntu/metashield-protocol
          echo "version=$(python3 -c 'import json;print(json.load(open("'$ROOT'/extension/manifest.json"))["version"])')"
          echo '===== package manifests ====='
          find "$ROOT" -maxdepth 3 -type f \( -name package.json -o -name package-lock.json -o -name npm-shrinkwrap.json -o -name pnpm-lock.yaml -o -name yarn.lock \) -print
          for f in "$ROOT/package.json" "$ROOT/api/package.json"; do
            if test -f "$f"; then echo "--- $f"; cat "$f"; fi
          done
          echo '===== irys references ====='
          grep -RniE "@irys/sdk|from ['\"]@irys/sdk['\"]|require\(['\"]@irys/sdk['\"]\)" "$ROOT" 2>/dev/null --exclude-dir=.git --exclude-dir=node_modules | sed -n '1,240p' || true
          echo '===== installed module ====='
          for p in "$ROOT/node_modules/@irys/sdk" "$ROOT/api/node_modules/@irys/sdk"; do
            if test -e "$p"; then echo "$p PRESENT"; ls -ld "$p"; else echo "$p MISSING"; fi
          done
          echo '===== npm resolution ====='
          cd "$ROOT"
          node -e "import('@irys/sdk').then(()=>console.log('root import PASS')).catch(e=>console.log('root import FAIL:',e.message))"
          if test -d "$ROOT/api"; then
            cd "$ROOT/api"
            node -e "import('@irys/sdk').then(()=>console.log('api import PASS')).catch(e=>console.log('api import FAIL:',e.message))"
          fi
          echo '===== npm ls ====='
          (cd "$ROOT" && npm ls @irys/sdk --depth=0) || true
          if test -f "$ROOT/api/package.json"; then (cd "$ROOT/api" && npm ls @irys/sdk --depth=0) || true; fi
          echo '===== api process ====='
          ps -ef | grep -E '[n]ode .*metashield-protocol/.*/?server.js|[n]ode .*api/server.js' || true
          echo '===== service units ====='
          systemctl --user --no-pager --type=service 2>/dev/null | grep -Ei 'chamber|metashield|echo' || true
          systemctl --no-pager --type=service 2>/dev/null | grep -Ei 'chamber|metashield|echo' || true
          echo '===== git status ====='
          git -C "$ROOT" status --short --branch
          REMOTE
      - uses: actions/upload-artifact@v4
        with:
          name: metashield-irys-dependency-inspect
          path: .agentos/evidence/metashield-irys-dependency-inspect.txt
          if-no-files-found: error
