name: Oracle Integrate Layout Lab Into Official Site

on:
  push:
    paths:
      - '.github/workflows/oracle-integrate-layoutlab-official-site.yml'
      - 'scripts/metashield_runtime_echo_inspect.sh'

permissions:
  contents: read

jobs:
  metashield_runtime_echo_inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Copy inspection script
        shell: bash
        run: |
          set -euo pipefail
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/metashield_runtime_echo_inspect.sh "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/metashield_runtime_echo_inspect.sh"
      - name: Inspect runtime and Echo state
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .agentos/evidence
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "bash /tmp/metashield_runtime_echo_inspect.sh" | tee .agentos/evidence/metashield-runtime-echo-inspect.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metashield-runtime-echo-inspect
          path: .agentos/evidence/metashield-runtime-echo-inspect.txt
          if-no-files-found: warn
