name: Oracle Integrate Layout Lab Into Official Site

on:
  push:
    paths:
      - '.github/workflows/oracle-integrate-layoutlab-official-site.yml'

permissions:
  contents: read

jobs:
  inspect_metashield:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect MetaShield local worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE' | tee .agentos/evidence/metashield-after-timeout.txt
          set -euo pipefail
          ROOT=/home/ubuntu/metashield-protocol
          echo "executor_user=$(whoami)"
          echo "workspace=$ROOT"
          echo "branch=$(git -C "$ROOT" rev-parse --abbrev-ref HEAD)"
          echo "head=$(git -C "$ROOT" rev-parse HEAD)"
          echo "version=$(python3 -c 'import json;print(json.load(open("'$ROOT'/extension/manifest.json"))["version"])')"
          echo 'status_begin'
          git -C "$ROOT" status --short --branch
          echo 'status_end'
          echo 'diffstat_begin'
          git -C "$ROOT" diff --stat
          echo 'diffstat_end'
          echo 'changed_files_begin'
          git -C "$ROOT" diff --name-only
          echo 'changed_files_end'
          echo 'recent_commits_begin'
          git -C "$ROOT" log -5 --oneline
          echo 'recent_commits_end'
          REMOTE
      - uses: actions/upload-artifact@v4
        with:
          name: metashield-after-timeout
          path: .agentos/evidence/metashield-after-timeout.txt
          if-no-files-found: error
