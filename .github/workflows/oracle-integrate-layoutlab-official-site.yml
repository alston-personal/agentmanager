name: Oracle Integrate Layout Lab Into Official Site

on:
  push:
    paths:
      - '.github/workflows/oracle-integrate-layoutlab-official-site.yml'
      - 'scripts/metashield_install_g9_regressions.py'

permissions:
  contents: read

jobs:
  metashield_g9_regressions:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Copy G9 regression installer
        shell: bash
        run: |
          set -euo pipefail
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/metashield_install_g9_regressions.py "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/metashield_install_g9_regressions.py"
      - name: Install and run G9 regressions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .agentos/evidence
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE' | tee .agentos/evidence/metashield-g9-regressions.txt
          set -euo pipefail
          ROOT=/home/ubuntu/metashield-protocol
          python3 /tmp/metashield_install_g9_regressions.py
          cd "$ROOT"
          node scripts/test-threads-background.js
          node scripts/test-no-irrecoverable-preservation.js
          echo '===== manifest ====='
          python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])'
          echo '===== test files ====='
          git status --short -- scripts/test-threads-background.js scripts/test-no-irrecoverable-preservation.js
          REMOTE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metashield-g9-regressions
          path: .agentos/evidence/metashield-g9-regressions.txt
          if-no-files-found: warn
