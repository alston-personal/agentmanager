name: Oracle Integrate Layout Lab Into Official Site

on:
  push:
    paths:
      - '.github/workflows/oracle-integrate-layoutlab-official-site.yml'

permissions:
  contents: read

jobs:
  repair_metashield_irys_runtime:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Rebuild Chamber API dependencies and restart service
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE' | tee .agentos/evidence/metashield-irys-runtime-repair.txt
          set -euo pipefail
          ROOT=/home/ubuntu/metashield-protocol
          API="$ROOT/api"
          echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "extension_version=$(python3 -c 'import json;print(json.load(open("'$ROOT'/extension/manifest.json"))["version"])')"
          echo '===== before ====='
          if test -d "$API/node_modules/@irys/sdk"; then echo 'irys_before=PRESENT'; else echo 'irys_before=MISSING'; fi
          (cd "$API" && npm ls @irys/sdk --depth=0) || true
          echo '===== npm ci ====='
          cd "$API"
          npm ci --omit=dev
          echo '===== import readiness ====='
          node -e "import('@irys/sdk').then(()=>{console.log('irys_import=PASS')}).catch(e=>{console.error(e);process.exit(2)})"
          test -d "$API/node_modules/@irys/sdk"
          echo '===== restart pm2 ====='
          pm2 describe chamber-api >/tmp/chamber-api-before.txt
          pm2 restart chamber-api --update-env
          sleep 2
          pm2 describe chamber-api | sed -n '1,120p'
          echo '===== health ====='
          curl -fsS http://127.0.0.1:3011/chamber-api/health
          echo
          echo '===== after ====='
          echo 'irys_after=PRESENT'
          (cd "$API" && npm ls @irys/sdk --depth=0)
          echo 'runtime_repair=PASS'
          REMOTE
          grep -q '^irys_import=PASS$' .agentos/evidence/metashield-irys-runtime-repair.txt
          grep -q '^runtime_repair=PASS$' .agentos/evidence/metashield-irys-runtime-repair.txt
      - uses: actions/upload-artifact@v4
        with:
          name: metashield-irys-runtime-repair
          path: .agentos/evidence/metashield-irys-runtime-repair.txt
          if-no-files-found: error
