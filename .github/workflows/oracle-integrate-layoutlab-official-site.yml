name: Oracle Integrate Layout Lab Into Official Site

on:
  push:
    paths:
      - '.github/workflows/oracle-integrate-layoutlab-official-site.yml'

permissions:
  contents: read

jobs:
  inspect_metashield:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect MetaShield launch-surface files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE' | tee .agentos/evidence/metashield-launch-surface-inspect.txt
          set -euo pipefail
          ROOT=/home/ubuntu/metashield-protocol/extension
          for spec in 'mvp-validation.js:1:260' 'sidepanel.html:180:430' 'sidepanel.js:1:260' 'sidepanel.js:260:620' 'i18n.js:1:340'; do
            f=${spec%%:*}; rest=${spec#*:}; a=${rest%%:*}; b=${rest##*:}
            echo "===== $f:$a-$b ====="
            sed -n "${a},${b}p" "$ROOT/$f"
          done
          REMOTE
      - uses: actions/upload-artifact@v4
        with:
          name: metashield-launch-surface-inspect
          path: .agentos/evidence/metashield-launch-surface-inspect.txt
          if-no-files-found: error
