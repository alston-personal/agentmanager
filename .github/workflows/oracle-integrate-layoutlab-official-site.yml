name: Oracle Integrate Layout Lab Into Official Site

on:
  push:
    paths:
      - '.github/workflows/oracle-integrate-layoutlab-official-site.yml'

permissions:
  contents: read

jobs:
  inspect_metashield:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect MetaShield extension structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE' | tee .agentos/evidence/metashield-extension-structure.txt
          set -euo pipefail
          ROOT=/home/ubuntu/metashield-protocol
          echo 'tree_begin'
          find "$ROOT/extension" -maxdepth 3 -type f | sed "s#^$ROOT/##" | sort | sed -n '1,260p'
          echo 'tree_end'
          echo 'package_files_begin'
          find "$ROOT" -maxdepth 2 -type f \( -name 'package.json' -o -name 'pyproject.toml' -o -name 'README*' -o -name 'vite.config.*' \) | sed "s#^$ROOT/##" | sort
          echo 'package_files_end'
          echo 'keywords_begin'
          grep -RniE 'Reborn|affiliate|Pioneer|Genesis|Echo|Threads|Instagram|Twitter|Facebook|Devnet|mainnet|logical_source_id' "$ROOT/extension" --exclude-dir=node_modules --exclude='*.map' | sed "s#^$ROOT/##" | sed -n '1,320p' || true
          echo 'keywords_end'
          REMOTE
      - uses: actions/upload-artifact@v4
        with:
          name: metashield-extension-structure
          path: .agentos/evidence/metashield-extension-structure.txt
          if-no-files-found: error
