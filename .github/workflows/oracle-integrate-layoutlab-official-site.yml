name: Oracle Integrate Layout Lab Into Official Site

on:
  push:
    paths:
      - '.github/workflows/oracle-integrate-layoutlab-official-site.yml'
      - 'scripts/metashield_patch_media_i18n.py'

permissions:
  contents: read

jobs:
  patch_metashield_media_i18n:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Copy deterministic patch helper
        shell: bash
        run: |
          set -euo pipefail
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/metashield_patch_media_i18n.py "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/metashield_patch_media_i18n.py"
      - name: Apply media upload diagnostics and bump tester version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "python3 /tmp/metashield_patch_media_i18n.py && echo status_begin && git -C /home/ubuntu/metashield-protocol status --short --branch && echo status_end" | tee .agentos/evidence/metashield-media-i18n-v1.0.61.txt
          grep -q '^version_after=1.0.61$' .agentos/evidence/metashield-media-i18n-v1.0.61.txt
          grep -q 'media.imageUploadFailed' .agentos/evidence/metashield-media-i18n-v1.0.61.txt
      - uses: actions/upload-artifact@v4
        with:
          name: metashield-media-i18n-v1.0.61
          path: .agentos/evidence/metashield-media-i18n-v1.0.61.txt
          if-no-files-found: error
