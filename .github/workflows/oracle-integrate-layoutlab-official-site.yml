name: Oracle Integrate Layout Lab Into Official Site

on:
  push:
    paths:
      - '.github/workflows/oracle-integrate-layoutlab-official-site.yml'

permissions:
  contents: read

jobs:
  inspect_metashield:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect fallback upload and i18n definitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE' | tee .agentos/evidence/metashield-image-upload-deep-inspect.txt
          set -euo pipefail
          ROOT=/home/ubuntu/metashield-protocol/extension
          echo '===== background.js 520-735 ====='
          nl -ba "$ROOT/background.js" | sed -n '520,735p'
          echo '===== i18n.js 1-260 ====='
          nl -ba "$ROOT/i18n.js" | sed -n '1,260p'
          echo '===== locale key search ====='
          for f in "$ROOT/_locales/en/messages.json" "$ROOT/_locales/zh_TW/messages.json"; do
            echo "--- ${f#$ROOT/} ---"
            grep -nE 'imageUploadFailed|uploadFailed|noSuccessfulUpload|devnetQuota|platformImagePost' "$f" || true
          done
          echo '===== config and fallback endpoints ====='
          grep -RniE 'imgur|r2|fallback|mediaUpload|uploadUrl|uploadEndpoint|fallbackStorage' "$ROOT" --exclude-dir=node_modules --exclude='*.map' | sed -n '1,300p' || true
          REMOTE
      - uses: actions/upload-artifact@v4
        with:
          name: metashield-image-upload-deep-inspect
          path: .agentos/evidence/metashield-image-upload-deep-inspect.txt
          if-no-files-found: error
