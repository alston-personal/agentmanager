name: Oracle Integrate Layout Lab Into Official Site

on:
  push:
    paths:
      - '.github/workflows/oracle-integrate-layoutlab-official-site.yml'
      - 'scripts/metashield_fix_no_irrecoverable_gate.py'
      - 'scripts/metashield_apply_g9_gate.sh'

permissions:
  contents: read

jobs:
  metashield_fix_no_irrecoverable_gate:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 12
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Copy G9 patch and runner
        shell: bash
        run: |
          set -euo pipefail
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/metashield_fix_no_irrecoverable_gate.py "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/metashield_fix_no_irrecoverable_gate.py"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/metashield_apply_g9_gate.sh "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/metashield_apply_g9_gate.sh"
      - name: Apply and verify G9
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .agentos/evidence
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "bash /tmp/metashield_apply_g9_gate.sh" | tee .agentos/evidence/metashield-no-irrecoverable-gate.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metashield-no-irrecoverable-gate
          path: .agentos/evidence/metashield-no-irrecoverable-gate.txt
          if-no-files-found: warn
