name: Inspect Social Runtime Schema

on:
  push:
    branches: [inspect/social-runtime-schema]
    paths:
      - '.github/workflows/inspect-social-runtime-schema.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Read Mio recent Threads conversations safely
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path

          env={}
          for line in Path("/home/ubuntu/.config/agentos/social-runtime.env").read_text().splitlines():
              if not line or line.lstrip().startswith("#") or "=" not in line: continue
              k,v=line.split("=",1); env[k]=v.strip().strip("'").strip('"')
          registry=json.loads(env["AGENTOS_SOCIAL_PRODUCTS_JSON"])
          key=registry["galaxy"]["api_key"]
          binding="galaxy:threads:persona:28875580788721778"
          account="28875580788721778"

          def post(payload):
              req=urllib.request.Request("http://127.0.0.1:8771/v1/social/status",
                  data=json.dumps(payload).encode(),
                  headers={"content-type":"application/json","accept":"application/json","X-AgentOS-Product-Key":key},
                  method="POST")
              with urllib.request.urlopen(req,timeout=15) as r:
                  return json.loads(r.read())

          base={"schema":"agentos.social-request/v1","product_id":"galaxy","platform":"threads",
                "account_binding_id":binding}
          ident=post({**base,"operation":"identity.read"})
          posts=post({**base,"operation":"post.read"})
          items=(posts.get("result") or {}).get("items") or []
          out={"identity":(ident.get("result") or {}).get("identity"),"posts":[]}
          for p in items[:12]:
              if not p.get("id"): continue
              try:
                  rr=post({**base,"operation":"replies.read","object_id":str(p["id"])})
                  replies=(rr.get("result") or {}).get("items") or []
              except Exception:
                  replies=[]
              out["posts"].append({
                  "id":p.get("id"),"text":p.get("text"),"timestamp":p.get("timestamp"),
                  "permalink":p.get("permalink"),
                  "replies":[{
                      "id":x.get("id"),"username":x.get("username"),"text":x.get("text"),
                      "timestamp":x.get("timestamp"),
                      "replied_to_id":(x.get("replied_to") or {}).get("id"),
                      "permalink":x.get("permalink")
                  } for x in replies[-40:]]
              })
          print(json.dumps(out,ensure_ascii=False,indent=2))
          print("social_runtime_keys_present="+",".join(sorted(k for k in env if "CONTROL" in k or "PRODUCT" in k or "SOCIAL" in k)))
          PY
          REMOTE
