name: Inspect Social Runtime Schema

on:
  push:
    branches: [inspect/social-runtime-schema]
    paths:
      - '.github/workflows/inspect-social-runtime-schema.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Probe Social API validation without side effects
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error

          def request(path, payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(
                  "http://127.0.0.1:8771"+path,
                  data=data,
                  headers={"content-type":"application/json","accept":"application/json"},
                  method="GET" if payload is None else "POST",
              )
              try:
                  with urllib.request.urlopen(req,timeout=4) as r:
                      body=r.read().decode("utf-8","replace")
                      return {"status":r.status,"body":body[:1200]}
              except urllib.error.HTTPError as e:
                  body=e.read().decode("utf-8","replace")
                  return {"status":e.code,"body":body[:1200]}
              except Exception as e:
                  return {"status":"error","body":repr(e)}

          out={
              "health":request("/healthz"),
              "status_empty":request("/v1/social/status",{}),
              "reply_empty":request("/v1/social/reply",{}),
              "publish_empty":request("/v1/social/publish",{}),
              "reply_shape_probe":request("/v1/social/reply",{
                  "schema":"agentos.social-request/v1",
                  "product_id":"invalid-probe",
                  "platform":"threads",
                  "operation":"reply"
              }),
              "publish_shape_probe":request("/v1/social/publish",{
                  "schema":"agentos.social-request/v1",
                  "product_id":"invalid-probe",
                  "platform":"threads",
                  "operation":"publish"
              })
          }
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          REMOTE
