name: Inspect Social Runtime Schema

on:
  push:
    branches: [inspect/social-runtime-schema]
    paths:
      - '.github/workflows/inspect-social-runtime-schema.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe Social target-account contract safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          URL="https://studio.milkcat.org/dashboard/api/social/v1/social/reply"
          base={"schema":"agentos.social-request/v1","product_id":"invalid-probe","platform":"threads","operation":"reply","write_intent_id":"pdca-safe-probe"}
          variants={
              "binding":{"account_binding_id":"probe"},
              "object":{"object_id":"probe"},
              "reply_to":{"reply_to_id":"probe"},
              "binding_object":{"account_binding_id":"probe","object_id":"probe"},
              "binding_reply_to":{"account_binding_id":"probe","reply_to_id":"probe"},
              "binding_object_reply_to":{"account_binding_id":"probe","object_id":"probe","reply_to_id":"probe"}
          }
          out={}
          for name,extra in variants.items():
              p=dict(base); p.update(extra)
              req=urllib.request.Request(URL,data=json.dumps(p).encode(),headers={"content-type":"application/json","accept":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=8) as r:
                      status=r.status; body=r.read().decode("utf-8","replace")[:1200]
              except urllib.error.HTTPError as e:
                  status=e.code; body=e.read().decode("utf-8","replace")[:1200]
              except Exception as e:
                  status="error"; body=repr(e)
              out[name]={"status":status,"body":body}
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
