name: Inspect Social Runtime Schema

on:
  push:
    branches: [inspect/social-runtime-schema]
    paths:
      - '.github/workflows/inspect-social-runtime-schema.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe Social write operation names safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          BASE="https://studio.milkcat.org/dashboard/api/social"
          def post(path,operation):
              payload={"schema":"agentos.social-request/v1","product_id":"invalid-probe","platform":"threads","operation":operation}
              req=urllib.request.Request(BASE+path,data=json.dumps(payload).encode(),headers={"content-type":"application/json","accept":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=8) as r:
                      return {"status":r.status,"body":r.read().decode("utf-8","replace")[:1000]}
              except urllib.error.HTTPError as e:
                  return {"status":e.code,"body":e.read().decode("utf-8","replace")[:1000]}
              except Exception as e:
                  return {"status":"error","body":repr(e)}
          ops=["reply","reply.create","reply.send","reply.write","write.reply","comment.reply","publish","publish.create","publish.send","publish.write","post.publish","post.create"]
          out={}
          for op in ops:
              path="/v1/social/publish" if ("publish" in op or op=="post.create") else "/v1/social/reply"
              out[op]=post(path,op)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
