name: Inspect Social Runtime Schema

on:
  push:
    branches: [inspect/social-runtime-schema]
    paths:
      - '.github/workflows/inspect-social-runtime-schema.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe Social API validation without side effects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error

          BASE="https://studio.milkcat.org/dashboard/api/social"
          def request(path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(
                  BASE+path,
                  data=data,
                  headers={"content-type":"application/json","accept":"application/json"},
                  method="GET" if payload is None else "POST",
              )
              try:
                  with urllib.request.urlopen(req,timeout=8) as r:
                      body=r.read().decode("utf-8","replace")
                      return {"status":r.status,"body":body[:1600]}
              except urllib.error.HTTPError as e:
                  return {"status":e.code,"body":e.read().decode("utf-8","replace")[:1600]}
              except Exception as e:
                  return {"status":"error","body":repr(e)}

          probes={
              "health":request("/healthz"),
              "status_empty":request("/v1/social/status",{}),
              "reply_empty":request("/v1/social/reply",{}),
              "publish_empty":request("/v1/social/publish",{}),
              "reply_shape":request("/v1/social/reply",{
                  "schema":"agentos.social-request/v1","product_id":"invalid-probe","platform":"threads","operation":"reply"
              }),
              "publish_shape":request("/v1/social/publish",{
                  "schema":"agentos.social-request/v1","product_id":"invalid-probe","platform":"threads","operation":"publish"
              })
          }
          print(json.dumps(probes,ensure_ascii=False,indent=2))
          PY
