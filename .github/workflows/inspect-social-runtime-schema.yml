name: Inspect Social Runtime Schema

on:
  push:
    branches: [inspect/social-runtime-schema]
    paths:
      - '.github/workflows/inspect-social-runtime-schema.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect sanitized Social runtime implementation
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          echo '=== listener ==='
          ss -ltnp 2>/dev/null | grep ':8771 ' || true
          echo '=== candidate processes ==='
          ps -eo pid,user,args | grep -E '[8]771|[s]ocial.*runtime|[s]ocial.*service|[u]vicorn|[g]unicorn' | head -30 || true
          echo '=== route definitions ==='
          grep -Rsn --exclude='*.map' --exclude='*.min.js' --exclude-dir=node_modules --exclude-dir=.git             -E '/v1/social/(reply|publish|status|connect)|social/reply|social/publish'             /home/ubuntu /opt /srv 2>/dev/null | head -120 || true
          echo '=== service manifests ==='
          find /home/ubuntu /opt /srv -maxdepth 6 -type f \( -name 'package.json' -o -name 'pyproject.toml' -o -name 'requirements.txt' -o -name 'compose.yaml' \)             -print 2>/dev/null | grep -Ei 'social|agentos' | head -80 || true
          REMOTE
