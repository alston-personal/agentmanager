name: Inspect Social Runtime Schema

on:
  push:
    branches: [inspect/social-runtime-schema]
    paths:
      - '.github/workflows/inspect-social-runtime-schema.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Discover allowed SocialRequest fields safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error, concurrent.futures
          URL="https://studio.milkcat.org/dashboard/api/social/v1/social/reply"
          base={"schema":"agentos.social-request/v1","product_id":"invalid-probe","platform":"threads","operation":"reply"}
          candidates={
            "account_binding_id":"probe","object_id":"probe","text":"probe","content":"probe","message":"probe",
            "reply_to_id":"probe","target_id":"probe","parent_id":"probe","thread_id":"probe","post_id":"probe",
            "media_urls":[],"media":[],"attachments":[],"payload":{},"data":{},
            "intent":"write","write_intent":"write","write_intent_id":"probe","write_intent_token":"probe",
            "explicit_intent":True,"explicit_write":True,"write_confirmed":True,"confirmed":True,
            "approval_id":"probe","acceptance_id":"probe","authorization_id":"probe","idempotency_key":"probe",
            "dry_run":True,"reason":"probe","source":"probe","actor":"probe","actor_id":"probe"
          }
          def probe(item):
              k,v=item
              p=dict(base); p[k]=v
              req=urllib.request.Request(URL,data=json.dumps(p).encode(),headers={"content-type":"application/json","accept":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=8) as r:
                      body=r.read().decode("utf-8","replace")[:800]; status=r.status
              except urllib.error.HTTPError as e:
                  status=e.code; body=e.read().decode("utf-8","replace")[:800]
              except Exception as e:
                  status="error"; body=repr(e)
              return k,{"status":status,"body":body}
          out={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              for k,res in ex.map(probe,candidates.items()):
                  out[k]=res
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
