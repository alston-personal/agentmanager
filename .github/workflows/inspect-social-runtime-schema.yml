name: Inspect Social Runtime Schema

on:
  push:
    branches: [inspect/social-runtime-schema]
    paths:
      - '.github/workflows/inspect-social-runtime-schema.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Read sanitized Social runtime contract
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          ROOT=/home/ubuntu/.local/share/agentos/social-runtime/agentos_node/social
          echo '=== contracts.py ==='
          sed -n '1,110p' "$ROOT/contracts.py"
          echo '=== governance.py ==='
          sed -n '1,110p' "$ROOT/governance.py"
          echo '=== runtime_http.py request parsing/routes ==='
          sed -n '420,560p' "$ROOT/runtime_http.py"
          echo '=== runtime_storage.py acceptance ==='
          sed -n '120,195p' "$ROOT/runtime_storage.py"
          REMOTE
