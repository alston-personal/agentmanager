name: Oracle GUI Worker Browser Smoke
on:
  push:
    branches:
      - core/integration
    paths:
      - '.agentos/commands/oracle-gui-worker-smoke.json'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Drive persistent Chromium through CDP
        shell: bash
        run: |
          set -euo pipefail
          sudo -n -H -u ubuntu /bin/bash -lc '
          test -x "$HOME/.local/share/agentos/gui-worker/venv/bin/python"
          exec "$HOME/.local/share/agentos/gui-worker/venv/bin/python" - <<'"'"'PY'"'"'
          import json
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.connect_over_cdp('http://127.0.0.1:9222')
              contexts=browser.contexts
              assert contexts
              ctx=contexts[0]
              page=ctx.pages[0] if ctx.pages else ctx.new_page()
              page.goto('https://example.com',wait_until='domcontentloaded',timeout=20000)
              title=page.title()
              url=page.url
              assert title=='Example Domain',title
              assert url.startswith('https://example.com'),url
              print('oracle_gui_browser_smoke=PASS')
              print('oracle_gui_browser_contexts='+str(len(contexts)))
              print('oracle_gui_browser_pages='+str(len(ctx.pages)))
              print('oracle_gui_browser_title='+title)
          PY
          '
