name: Diagnose Milkcat Usage Dashboard Route

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-diagnose-usage-dashboard.yml'

permissions:
  contents: read

concurrency:
  group: diagnose-production-dashboard
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Start existing Oracle SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Inspect shared source, live release, PM2 and routes without mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_USER"
          PORT="${DEPLOY_PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "$DEPLOY_USER@127.0.0.1" bash -s <<'REMOTE'
          set -euo pipefail
          SHARED=/home/ubuntu/agentmanager
          SHARED_APP="$SHARED/dashboard"
          LIVE=/home/ubuntu/agent-data/runtime/dashboard/current
          CONFIG=/home/ubuntu/.config/milkcat/dashboard.env.local

          echo "audit_timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'shared_head='
          git -c safe.directory="$SHARED" -C "$SHARED" rev-parse HEAD || true
          test -f "$SHARED_APP/app/admin/usage/page.tsx" && echo 'shared_usage_source=present' || echo 'shared_usage_source=missing'

          PID=$(ss -H -ltnp 'sport = :3000' 2>/dev/null | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | sort -u)
          [[ "$PID" =~ ^[0-9]+$ ]]
          RUNTIME_APP=$(readlink -f "/proc/$PID/cwd")
          printf 'dashboard_listener_pid=%s\n' "$PID"
          printf 'dashboard_runtime_cwd=%s\n' "$RUNTIME_APP"
          printf 'dashboard_live_pointer=%s\n' "$(readlink -f "$LIVE" 2>/dev/null || true)"

          test -f "$RUNTIME_APP/.next/server/app-paths-manifest.json"
          python3 - "$RUNTIME_APP/.next/server/app-paths-manifest.json" <<'PY'
          import json,sys
          paths=json.load(open(sys.argv[1],encoding='utf8'))
          for route in ('/admin/usage/page','/api/admin/usage/route','/api/auth/session/route'):
              print(f'runtime_built_route={route} present={route in paths}')
          PY

          export PM2_HOME=/home/ubuntu/.pm2
          PM2_CLI=''
          for candidate in /home/ubuntu/.npm/_npx/*/node_modules/pm2/bin/pm2; do
            test -f "$candidate" || continue
            pkg="${candidate%/bin/pm2}/package.json"
            test -f "$pkg" || continue
            version=$(node -p 'require(process.argv[1]).version' "$pkg" 2>/dev/null || true)
            if [ "$version" = '7.0.1' ]; then PM2_CLI="$candidate"; break; fi
          done
          if [ -n "$PM2_CLI" ] && [ -S "$PM2_HOME/rpc.sock" ]; then
            PM2_JSON=$(mktemp /tmp/dashboard-pm2-XXXXXXXX.json)
            node "$PM2_CLI" jlist > "$PM2_JSON"
            python3 - "$PM2_JSON" <<'PY'
          import json,sys
          apps=json.load(open(sys.argv[1],encoding='utf8'))
          rows=[a for a in apps if a.get('name')=='agentos-dashboard']
          assert len(rows)==1, f'dashboard_pm2_target_count={len(rows)}'
          app=rows[0]; env=app.get('pm2_env') or {}
          print('dashboard_pm2_target_count=1')
          print('dashboard_pm2_id='+str(app.get('pm_id')))
          print('dashboard_pm2_name='+str(app.get('name')))
          print('dashboard_pm2_status='+str(env.get('status')))
          print('dashboard_pm2_cwd='+str(env.get('pm_cwd') or ''))
          print('dashboard_pm2_script='+str(env.get('pm_exec_path') or ''))
          keys=sorted(k for k in env if isinstance(k,str) and k.startswith(('GOOGLE_','MILKCAT_','FENGSHUI_','LEOPARDCAT_','ADMIN_','JWT_')))
          print('dashboard_pm2_sensitive_key_names='+','.join(keys))
          PY
            rm -f "$PM2_JSON"
          else
            echo 'dashboard_pm2_target_count=UNAVAILABLE'
          fi

          python3 - "$CONFIG" "$RUNTIME_APP/.env.local" <<'PY'
          import pathlib,stat,sys
          required={'JWT_SECRET','GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET'}
          for label,raw in [('canonical_config',sys.argv[1]),('runtime_env_local',sys.argv[2])]:
              p=pathlib.Path(raw)
              if not p.is_file():
                  print(label+'_file=MISSING')
                  continue
              st=p.lstat()
              print(label+'_regular='+str(stat.S_ISREG(st.st_mode) and not stat.S_ISLNK(st.st_mode)))
              print(label+'_mode_octal='+oct(stat.S_IMODE(st.st_mode)))
              keys=set()
              for line in p.read_text(encoding='utf8').splitlines():
                  line=line.strip()
                  if line and not line.startswith('#') and '=' in line:
                      keys.add(line.split('=',1)[0].strip())
              for key in sorted(required):
                  print(label+'_'+key.lower()+'_present='+str(key in keys))
          PY

          for route in /dashboard/ /dashboard/api/auth/session /dashboard/admin/usage /dashboard/api/admin/usage; do
            pub=$(curl --noproxy '*' -k -sS -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 --resolve studio.milkcat.org:443:127.0.0.1 "https://studio.milkcat.org$route" || true)
            direct=$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 "http://127.0.0.1:3000$route" || true)
            printf 'route=%s local_nginx=%s dashboard_upstream=%s\n' "$route" "$pub" "$direct"
          done
          echo 'dashboard_diagnostic=COMPLETE_READ_ONLY'
          REMOTE
