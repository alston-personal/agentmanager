name: Diagnose Milkcat Usage Dashboard Route

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-diagnose-usage-dashboard.yml'

permissions:
  contents: read

concurrency:
  group: oracle-diagnose-usage-dashboard
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Start existing Oracle SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Inspect dashboard build, process and routes without mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_USER"
          ssh -o StrictHostKeyChecking=accept-new -p "$DEPLOY_PORT" "$DEPLOY_USER@127.0.0.1" bash -s <<'REMOTE'
          set -euo pipefail
          echo "audit_timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ROOT=/home/ubuntu/agentmanager
          APP="$ROOT/dashboard"
          echo '=== DEPLOYED SOURCE AND BUILD ==='
          git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD || true
          test -f "$APP/app/admin/usage/page.tsx" && echo 'usage_source=present' || echo 'usage_source=missing'
          test -f "$APP/app/api/admin/usage/route.ts" && echo 'usage_api_source=present' || echo 'usage_api_source=missing'
          if test -f "$APP/.next/server/app-paths-manifest.json"; then
            python3 - "$APP/.next/server/app-paths-manifest.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              paths = json.load(f)
          for path in ('/admin/usage/page', '/api/admin/usage/route', '/api/auth/session/route'):
              print(f'built_route={path} present={path in paths}')
          PY
          else
            echo 'app_paths_manifest=missing'
          fi
          echo '=== REMOTE PROCESS MANAGER ENVIRONMENT ==='
          id -un
          command -v node || true
          command -v npm || true
          command -v pm2 || true
          for candidate in /home/ubuntu/.nvm/versions/node/*/bin/pm2 /home/ubuntu/.npm-global/bin/pm2 /usr/local/bin/pm2 /usr/bin/pm2; do
            if test -e "$candidate"; then
              printf 'pm2_candidate=%s\n' "$candidate"
            fi
          done
          test -d /home/ubuntu/.pm2 && echo 'ubuntu_pm2_home=present' || echo 'ubuntu_pm2_home=missing'
          echo '=== RUNTIME PACKAGE LOCATIONS ==='
          npm root -g || true
          npm prefix -g || true
          for root in /usr/lib/node_modules /usr/local/lib/node_modules /home/ubuntu/.npm-global /home/ubuntu/.local/share/pnpm /home/ubuntu/.nvm /opt; do
            if test -d "$root"; then
              find "$root" -maxdepth 7 \( -name pm2 -o -name Daemon.js \) -print 2>/dev/null | head -20 || true
            fi
          done
          echo '=== DASHBOARD LISTENER AND PROCESS ==='
          ss -ltn 'sport = :3000' || true
          ps -eo user,pid,ppid,args | grep -E '[n]ext start|[n]ext-server|[n]pm start' | head -15 || true
          echo '=== LOCAL PUBLIC AND UPSTREAM STATUS ==='
          for route in /dashboard/ /dashboard/api/auth/session /dashboard/admin/usage /dashboard/api/admin/usage; do
            pub=$(curl --noproxy '*' -k -sS -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 --resolve studio.milkcat.org:443:127.0.0.1 "https://studio.milkcat.org$route" || true)
            direct=$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 "http://127.0.0.1:3000$route" || true)
            printf 'route=%s local_nginx=%s dashboard_upstream=%s\n' "$route" "$pub" "$direct"
          done
          echo 'diagnostic_reason=owner_reported_usage_404_2026-09-25'
          echo '=== DASHBOARD RUNTIME ISOLATION PREFLIGHT ==='
          PID=$(ss -H -ltnp 'sport = :3000' 2>/dev/null | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | sort -u | head -1)
          if [[ "$PID" =~ ^[0-9]+$ ]]; then
            printf 'dashboard_listener_pid=%s\n' "$PID"
            printf 'dashboard_listener_cwd='; readlink -f "/proc/$PID/cwd" || true
            printf 'dashboard_listener_parent='; awk '{print $4}' "/proc/$PID/stat" 2>/dev/null || true
            python3 - "$PID" <<'PY'
          import os, pathlib, sys
          pid=sys.argv[1]
          keys=[
              'JWT_SECRET','ADMIN_USERNAME','ADMIN_PASSWORD_HASH',
              'GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET',
              'GITHUB_CLIENT_ID','GITHUB_CLIENT_SECRET',
              'LINE_CLIENT_ID','LINE_CLIENT_SECRET',
              'FACEBOOK_CLIENT_ID','FACEBOOK_CLIENT_SECRET',
              'NEXT_PUBLIC_SITE_URL',
          ]
          raw=(pathlib.Path('/proc')/pid/'environ').read_bytes().split(b'\0')
          present={part.split(b'=',1)[0].decode('utf8','ignore') for part in raw if b'=' in part}
          for key in keys:
              print('dashboard_process_env_'+key.lower()+'_present='+str(key in present))
          PY
          fi
          export PM2_HOME=/home/ubuntu/.pm2
          PM2_CLI=''
          for candidate in /home/ubuntu/.npm/_npx/*/node_modules/pm2/bin/pm2; do
            test -f "$candidate" || continue
            pkg="${candidate%/bin/pm2}/package.json"
            test -f "$pkg" || continue
            version=$(node -p 'require(process.argv[1]).version' "$pkg" 2>/dev/null || true)
            if [ "$version" = '7.0.1' ]; then PM2_CLI="$candidate"; break; fi
          done
          if [ -n "$PM2_CLI" ] && [ -S "$PM2_HOME/rpc.sock" ]; then
            node "$PM2_CLI" jlist | python3 - <<'PY'
          import json,sys
          apps=json.load(sys.stdin)
          rows=[a for a in apps if a.get('pm2_env',{}).get('pm_cwd')=='/home/ubuntu/agentmanager/dashboard']
          print('dashboard_pm2_target_count='+str(len(rows)))
          for app in rows:
              env=app.get('pm2_env',{})
              print('dashboard_pm2_id='+str(app.get('pm_id')))
              print('dashboard_pm2_name='+str(app.get('name')))
              print('dashboard_pm2_status='+str(env.get('status')))
              print('dashboard_pm2_script='+str(env.get('pm_exec_path') or ''))
          PY
          fi
          python3 - <<'PY'
          import os,pathlib,stat
          p=pathlib.Path('/home/ubuntu/agentmanager/.env')
          keys=[
              'JWT_SECRET','ADMIN_USERNAME','ADMIN_PASSWORD_HASH',
              'GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET',
              'GITHUB_CLIENT_ID','GITHUB_CLIENT_SECRET',
              'LINE_CLIENT_ID','LINE_CLIENT_SECRET',
              'FACEBOOK_CLIENT_ID','FACEBOOK_CLIENT_SECRET',
              'NEXT_PUBLIC_SITE_URL',
          ]
          if not p.is_file():
              print('dashboard_shared_env_file=MISSING')
          else:
              st=p.lstat()
              print('dashboard_shared_env_regular='+str(stat.S_ISREG(st.st_mode) and not stat.S_ISLNK(st.st_mode)))
              print('dashboard_shared_env_mode_octal='+oct(stat.S_IMODE(st.st_mode)))
              data={}
              for raw in p.read_text(encoding='utf8').splitlines():
                  line=raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key,_=line.split('=',1); data[key.strip()]=True
              for key in keys:
                  print('dashboard_shared_env_'+key.lower()+'_present='+str(key in data))
          PY
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          if systemctl --user show-environment >/dev/null 2>&1; then
            echo 'dashboard_user_systemd=AVAILABLE'
          else
            echo 'dashboard_user_systemd=UNAVAILABLE'
          fi
          echo 'dashboard_runtime_isolation_preflight=COMPLETE_READ_ONLY'
          echo '=== CHECKS COMPLETE: READ ONLY ==='
          REMOTE
