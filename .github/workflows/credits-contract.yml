name: Credits Contract

on:
  pull_request:
    paths:
      - 'agent_core/credit_ledger.py'
      - 'agent_core/credit_service.py'
      - 'agent_core/credit_http.py'
      - 'scripts/install_systemd_user.sh'
      - '.agent/SERVICES.md'
      - '.agent/governance/credit_pricing.json'
      - 'tests/test_credit_ledger.py'
      - 'tests/test_credit_service.py'
      - 'tests/test_credit_http.py'
      - '.github/workflows/credits-contract.yml'
  push:
    branches: [main]
    paths:
      - 'agent_core/credit_ledger.py'
      - 'agent_core/credit_service.py'
      - 'agent_core/credit_http.py'
      - 'scripts/install_systemd_user.sh'
      - '.agent/SERVICES.md'
      - '.agent/governance/credit_pricing.json'
      - 'tests/test_credit_ledger.py'
      - 'tests/test_credit_service.py'
      - '.github/workflows/credits-contract.yml'

jobs:
  credits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile credits modules
        run: python -m py_compile agent_core/credit_ledger.py agent_core/credit_service.py agent_core/credit_http.py
      - name: Validate Credits service install contract
        run: |
          bash -n scripts/install_systemd_user.sh
          grep -q 'milkcat-credits.service' scripts/install_systemd_user.sh
          grep -q 'MILKCAT_CREDITS_MODE=shadow' scripts/install_systemd_user.sh
          grep -q 'allocate_port(' scripts/install_systemd_user.sh
          grep -q 'milkcat_credits.env' scripts/install_systemd_user.sh
          grep -q 'MILKCAT_CREDITS_URL=http://127.0.0.1:' scripts/install_systemd_user.sh
      - name: Run credits contract tests
        run: python -m pytest -q tests/test_credit_ledger.py tests/test_credit_service.py tests/test_credit_http.py
