name: Mio Wardrobe Live Frontend Diagnostic
# rerun-marker-20261002

on:
  pull_request:
    branches: [core/integration]
    paths: ['.github/workflows/mio-wardrobe-live-frontend-diagnostic.yml']

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect live HTML and NET image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=$(mktemp)
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' >"$out" 2>&1 <<'REMOTE'
          set -euo pipefail
          HTML=/home/ubuntu/zeus-writer/website/dist/personas/mio/wardrobe/index.html
          test -f "$HTML"
          echo '=== frontend markers ==='
          grep -F 'milkcat.mio.wardrobe.runtime/v1' "$HTML" >/dev/null && echo runtime_state=present || echo runtime_state=missing
          grep -F 'milkcat.mio.pwaHandoff/v1' "$HTML" >/dev/null && echo pwa_handoff=present || echo pwa_handoff=missing
          grep -F "window.open('about:blank'" "$HTML" >/dev/null && echo sync_popup=present || echo sync_popup=missing
          echo '=== handoff roundtrip ==='
          LIVE_DASH="$(readlink -f /home/ubuntu/agent-data/runtime/dashboard/current)"
          CONFIG=/home/ubuntu/.config/milkcat/dashboard.env.local
          ADMIN=/home/ubuntu/.config/milkcat/admin-identities
          JWT_SECRET_VALUE="$(python3 - "$CONFIG" <<'PY'
          import pathlib,sys
          for raw in pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              line=raw.strip()
              if not line or line.startswith('#') or '=' not in line: continue
              k,v=line.split('=',1)
              if k.strip()=='JWT_SECRET':
                  print(v.strip().strip('"').strip("'")); break
          PY
          )"
          ADMIN_KEY="$(grep -Ev '^[[:space:]]*(#|$)' "$ADMIN" | head -n1 | tr -d '\r')"
          export JWT_SECRET_VALUE ADMIN_KEY
          TOKEN="$(cd "$LIVE_DASH" && node - <<'NODE'
          const jwt=require('jsonwebtoken');
          const key=process.env.ADMIN_KEY||'', secret=process.env.JWT_SECRET_VALUE||'';
          let provider='',subject='',username='handoff-admin'; const marker=':username:';
          if(key.includes(marker)){const i=key.indexOf(marker);provider=key.slice(0,i);username=key.slice(i+marker.length);subject='handoff-probe-subject';}
          else {const i=key.indexOf(':'); if(i<1) process.exit(3); provider=key.slice(0,i); subject=key.slice(i+1);}
          process.stdout.write(jwt.sign({username,provider,subject,exp:Math.floor(Date.now()/1000)+900},secret));
          NODE
          )"
          unset JWT_SECRET_VALUE ADMIN_KEY
          START=/tmp/mio-handoff-start.json
          code="$(curl -sS -o "$START" -w '%{http_code}' -X POST 'http://127.0.0.1:3000/dashboard/api/wardrobe/auth-handoff?action=start')"
          test "$code" = 200
          HID="$(python3 - "$START" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding='utf-8')); assert j.get('handoffId'); print(j['handoffId'])
          PY
          )"
          code="$(curl -sS -o /tmp/mio-handoff-complete -w '%{http_code}' -H "Cookie: auth_token=$TOKEN" "http://127.0.0.1:3000/dashboard/api/wardrobe/auth-handoff?handoff=$HID")"
          test "$code" = 200
          code="$(curl -sS -D /tmp/mio-handoff-headers -o /tmp/mio-handoff-exchange -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "{\"handoffId\":\"$HID\"}" 'http://127.0.0.1:3000/dashboard/api/wardrobe/auth-handoff?action=exchange')"
          test "$code" = 200
          grep -qi '^set-cookie: auth_token=' /tmp/mio-handoff-headers
          COOKIE="$(awk 'BEGIN{IGNORECASE=1}/^set-cookie: auth_token=/{sub(/^set-cookie: /,""); split($0,a,";"); print a[1]; exit}' /tmp/mio-handoff-headers | tr -d '\r')"
          test -n "$COOKIE"
          curl -sS -H "Cookie: $COOKIE" 'http://127.0.0.1:3000/dashboard/api/auth/session' -o /tmp/mio-handoff-session
          python3 - /tmp/mio-handoff-session <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding='utf-8'))
          assert j.get('loggedIn') is True, j
          assert j.get('role') == 'admin', j
          print('handoff_roundtrip=PASS role=admin')
          PY
          echo '=== image probe ==='
          URL='https://net.wimg.tw/files/1/products/735109_color_002E799BDE889B2.jpg?v=32570'
          curl -sSIL --max-time 12 "$URL" | sed -n '1,12p' || true
          code=$(curl -sS -L -o /tmp/net-43774.jpg -w '%{http_code}' --max-time 20 "$URL" || true)
          type=$(file -b --mime-type /tmp/net-43774.jpg 2>/dev/null || true)
          bytes=$(wc -c < /tmp/net-43774.jpg 2>/dev/null || echo 0)
          echo "image_http=$code image_type=$type image_bytes=$bytes"
          NEW_URL='https://net.wimg.tw/files/1/products/735109_400_002E799BDE889B2.jpg?v=32582'
          new_code=$(curl -sS -L -o /tmp/net-43774-full.jpg -w '%{http_code}' --max-time 20 "$NEW_URL" || true)
          new_type=$(file -b --mime-type /tmp/net-43774-full.jpg 2>/dev/null || true)
          new_bytes=$(wc -c < /tmp/net-43774-full.jpg 2>/dev/null || echo 0)
          echo "full_image_http=$new_code full_image_type=$new_type full_image_bytes=$new_bytes"
          echo '=== product image candidates ==='
          curl -sSL --max-time 20 'https://www.net-fashion.net/product/736366' -o /tmp/net-product.html || true
          grep -Eo 'https?://[^"[:space:]<>]+\.(jpg|jpeg|png|webp)(\?[^"[:space:]<>]*)?' /tmp/net-product.html 2>/dev/null | grep -Ei '736366|43774|735109' | head -40 || true
          grep -Eo '[^"[:space:]<>]+\.(jpg|jpeg|png|webp)(\?[^"[:space:]<>]*)?' /tmp/net-product.html 2>/dev/null | grep -Ei '736366|43774|735109' | head -40 || true
          REMOTE
          cat "$out"
          { echo '### Mio live frontend diagnostic'; echo; echo '```text'; cat "$out"; echo '```'; } >/tmp/diag.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /tmp/diag.md