name: Oracle vopc5750 Provenance Repair

on:
  push:
    branches:
      - feature/realm-node-fabric-readiness
    paths:
      - '.github/workflows/oracle-vopc5750-provenance-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/realm-node-fabric-readiness
          fetch-depth: 1
      - name: Repair provenance without restart
        shell: bash
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          REF=$(git rev-parse HEAD)
          python3 - "$REF" <<'PY' >/tmp/vopc5750-provenance-task.txt
          import re,sys,time
          from agent_core.realm_fabric import RealmFabricStore
          ref=sys.argv[1]
          assert re.fullmatch(r'[0-9a-f]{40}', ref)
          node='vopc5750'
          tid='provenance-repair-'+node+'-'+str(int(time.time()))
          ps=r'''$ErrorActionPreference='Stop'
          $install=Join-Path $env:LOCALAPPDATA 'AgentOS'
          $base='https://raw.githubusercontent.com/alston-personal/agentmanager/REF'
          Invoke-WebRequest -UseBasicParsing -Headers @{'Cache-Control'='no-cache'} -Uri "$base/agentos_node/runtime_provenance.py" -OutFile (Join-Path $install 'agentos_node\runtime_provenance.py')
          $prov=[ordered]@{
            schema='agentos.thin-client-runtime/v0.1'
            source_ref='feature/realm-node-fabric-readiness'
            source_commit='REF'
            installed_at=(Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            install_mode='provenance-repair-no-restart'
          }
          $json=$prov | ConvertTo-Json
          [System.IO.File]::WriteAllText((Join-Path $install 'runtime-provenance.json'),$json,(New-Object System.Text.UTF8Encoding($false)))
          Write-Output 'agentos_provenance_repair=PASS'
          Write-Output ('agentos_source_commit=REF')
          '''.replace('REF',ref)
          task={'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':'powershell','argv':['-NoProfile','-NonInteractive','-Command',ps],'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':30,'cognition_ids_used':[]}
          RealmFabricStore().queue_task(node,task)
          print(tid)
          PY
      - name: Wait for receipt and heartbeat provenance
        shell: bash
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          TASK=$(cat /tmp/vopc5750-provenance-task.txt)
          REF=$(git rev-parse HEAD)
          for i in $(seq 1 45); do
            python3 - "$TASK" "$REF" <<'PY' && exit 0 || true
          import json,sys
          from agent_core.realm_fabric import RealmFabricStore
          from agent_core.node_registry import NodeRegistry
          task,ref=sys.argv[1:3]
          r=RealmFabricStore().get_receipt(task)
          if not r or r.get('ok') is not True or int(r.get('returncode') or 0)!=0:
              raise SystemExit(1)
          node=next((n for n in NodeRegistry().node_map().get('nodes',[]) if n.get('node_id')=='vopc5750'),None)
          if not node: raise SystemExit(1)
          runtime=node.get('runtime') or {}
          if runtime.get('source_commit') != ref:
              raise SystemExit(1)
          print(json.dumps({'receipt':r,'runtime':runtime,'runtime_status':node.get('runtime_status'),'capabilities':node.get('capabilities')},ensure_ascii=False,indent=2,sort_keys=True))
          raise SystemExit(0)
          PY
            sleep 2
          done
          echo 'provenance convergence timeout' >&2
          exit 1
