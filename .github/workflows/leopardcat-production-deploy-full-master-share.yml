name: LeopardCat Governed Language Quality Deploy

on:
  workflow_dispatch:
  push:
    branches: [chore/leopardcat-runtime-inspect]
    paths:
      - '.github/workflows/leopardcat-production-deploy-full-master-share.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start governed SSH identity
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Deploy and live-smoke language quality fix
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          ROOT=/home/ubuntu/leopardcat-tarot
          WEB="$ROOT/website"
          OLD=9d698ed400a89921b3aecf82bd4b4766ee85476c
          TARGET=083f19c614253741c12fa7ffdaca6aff8ed3ac23

          echo '=== preflight ==='
          test -d "$ROOT/.git"
          test "$(git -C "$ROOT" branch --show-current)" = main
          HEAD=$(git -C "$ROOT" rev-parse HEAD)
          echo "head_before=$HEAD"
          test "$HEAD" = "$OLD" -o "$HEAD" = "$TARGET"
          mapfile -t DIRTY < <(git -C "$ROOT" status --porcelain | sed -E 's/^.. //')
          for f in "${DIRTY[@]:-}"; do
            test -z "$f" && continue
            case "$f" in
              website/dist/index.html|website/stats.json|website/node_modules/.vite/*) ;;
              *) echo "unexpected_dirty=$f"; exit 20 ;;
            esac
          done
          rm -rf "$WEB/node_modules/.vite"
          BACKUP=/tmp/leopardcat-stats-language-quality-${GITHUB_RUN_ID:-manual}.json
          cp "$WEB/stats.json" "$BACKUP"
          git -C "$ROOT" checkout -- website/dist/index.html

          echo '=== sync source ==='
          git -C "$ROOT" fetch origin main
          git -C "$ROOT" merge --ff-only origin/main
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET"
          echo "head_after=$(git -C "$ROOT" rev-parse HEAD)"
          cp "$BACKUP" "$WEB/stats.json"

          echo '=== verify quality source ==='
          grep -q 'DENSE_SCRIPT' "$WEB/divination/ai_gateway.py"
          grep -q '_minimum_chars_for' "$WEB/divination/ai_gateway.py"
          test -f "$WEB/tests/test_language_aware_master_quality.py"
          cd "$WEB"
          python3 -m py_compile divination/ai_gateway.py

          echo '=== build production frontend ==='
          test -e "$WEB/public/art/renders"
          test -e "$WEB/public/cards"
          npm ci
          npm run build
          JS_ASSET=$(sed -nE 's#.*src="(/assets/index-[^"]+\.js)".*#\1#p' dist/index.html | head -1)
          CSS_ASSET=$(sed -nE 's#.*href="(/assets/index-[^"]+\.css)".*#\1#p' dist/index.html | head -1)
          test -n "$JS_ASSET"; test -n "$CSS_ASSET"
          test -f "dist$JS_ASSET"; test -f "dist$CSS_ASSET"
          echo "js_asset=$JS_ASSET"
          echo "css_asset=$CSS_ASSET"

          echo '=== restart service ==='
          systemctl --user stop leopardcat-tarot.service || true
          for pid in $(pgrep -f '/usr/bin/python3 fortune_server.py' || true); do
            cwd=$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)
            cmd=$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)
            if [ "$cwd" = "$WEB" ] && [ "$cmd" = '/usr/bin/python3 fortune_server.py ' ]; then kill "$pid" || true; fi
          done
          for i in $(seq 1 20); do ! ss -ltnp 2>/dev/null | grep -q ':8088' && break; sleep 1; done
          ! ss -ltnp 2>/dev/null | grep -q ':8088'
          systemctl --user start leopardcat-tarot.service
          for i in $(seq 1 30); do
            if systemctl --user is-active --quiet leopardcat-tarot.service && curl -fsS --max-time 2 http://127.0.0.1:8088/ >/tmp/leopardcat-root.html; then break; fi
            sleep 1
          done
          systemctl --user is-active --quiet leopardcat-tarot.service

          echo '=== verify local/public bundle ==='
          curl -fsS --max-time 5 "http://127.0.0.1:8088$JS_ASSET" -o /tmp/leopardcat-language-local.js
          curl -fsS --max-time 5 "http://127.0.0.1:8088$CSS_ASSET" -o /tmp/leopardcat-language-local.css
          test "$(sha256sum "dist$JS_ASSET" | awk '{print $1}')" = "$(sha256sum /tmp/leopardcat-language-local.js | awk '{print $1}')"
          test "$(sha256sum "dist$CSS_ASSET" | awk '{print $1}')" = "$(sha256sum /tmp/leopardcat-language-local.css | awk '{print $1}')"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 https://leopardcat-tarot.milkcat.org/)
          echo "public_http=$code"; test "$code" = 200
          curl -fsS --max-time 8 "https://leopardcat-tarot.milkcat.org$JS_ASSET" -o /tmp/leopardcat-language-public.js
          test "$(sha256sum "dist$JS_ASSET" | awk '{print $1}')" = "$(sha256sum /tmp/leopardcat-language-public.js | awk '{print $1}')"

          echo '=== live zh/ja Master smoke ==='
          python3 - <<'PY'
          import json, urllib.request, urllib.error, sys
          cases=[('zh-TW','最近的方向應該怎麼看？'),('ja','これからの仕事の流れについて教えてください。')]
          failed=False
          for lang,q in cases:
              payload={'method':'tarot','persona':'leopardcat','question':q,'lang':lang,'seed':'prod-language-quality-'+lang,'input':{'deck_id':'leopardcat','spread':'single'}}
              req=urllib.request.Request('http://127.0.0.1:8088/api/v1/readings',data=json.dumps(payload,ensure_ascii=False).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      data=json.loads(r.read().decode())
                  text=str(data.get('reading') or '')
                  ok=(r.status==200 and bool(text))
                  print(f'case={lang} http={r.status} reading_present={str(bool(text)).lower()} reading_length={len(text)}')
                  failed = failed or not ok
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: data=json.loads(raw)
                  except Exception: data={}
                  print(f'case={lang} http={e.code} error={data.get("error")} code={data.get("code")} retryable={data.get("retryable")}')
                  failed=True
          if failed:
              raise SystemExit(42)
          PY

          echo "service_pid=$(systemctl --user show -p MainPID --value leopardcat-tarot.service)"
          echo 'leopardcat_language_quality_deploy=PASS'
          REMOTE
