name: Legacy Branch Workflow Publisher Inventory (Read Only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/legacy-workflow-publisher-inventory.yml'
      - 'scripts/audit_legacy_workflow_publishers.py'
      - 'tests/test_audit_legacy_workflow_publishers.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify scanner contract without external effects
        run: |
          python -m pip install 'PyYAML>=6,<7'
          python -m unittest tests.test_audit_legacy_workflow_publishers
      - name: Fetch only the old branch source as data
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin             +refs/heads/core/integration:refs/remotes/origin/core/integration
          sha="$(git rev-parse refs/remotes/origin/core/integration)"
          test "${#sha}" = 40
          printf 'legacy_source_sha=%s\n' "$sha"
          mkdir -p "$RUNNER_TEMP/legacy-workflow-snapshot"
          git archive refs/remotes/origin/core/integration .github/workflows             | tar -xf - -C "$RUNNER_TEMP/legacy-workflow-snapshot"
      - name: Inventory ALL legacy workflows without executing them
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_legacy_workflow_publishers.py             --root "$RUNNER_TEMP/legacy-workflow-snapshot"             --output "$RUNNER_TEMP/legacy-workflow-census.json"             --expected-count 453
          python - "$RUNNER_TEMP/legacy-workflow-census.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          print("## Legacy Workflow Census (read-only)")
          print("Entire core/integration source inventory. Static flags are NOT provider enabled-state or deployed-version proof.")
          for k in ("workflow_count", "legacy_push_count", "mutating_legacy_push_count",
                    "priority_review_count"):
              print("- " + k + ": " + str(d[k]))
          print("- Full per-path classification is in the attached JSON artifact.")
          PY
      - name: Upload non-secret static inventory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-workflow-publisher-inventory
          path: ${{ runner.temp }}/legacy-workflow-census.json
          retention-days: 7
          if-no-files-found: warn
