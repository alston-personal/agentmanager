name: Oracle MBPR Threads Conversation Read
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 3
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Open requested Threads conversation and read visible content
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          cmd=json.load(open('.agentos/commands/mbpr-threads-conversation-read.json',encoding='utf-8'))
          assert cmd.get('node_id')=='mbpr'
          username=str(cmd.get('username') or '')
          assert username=='0__0.ayoub'
          sha=str(cmd.get('source_commit') or '')
          assert len(sha)==40
          tid='mbpr-threads-conversation-read-'+str(int(time.time()))
          code=("import json,runpy,sys,tempfile,urllib.request; "
                "p=tempfile.mktemp(suffix='.py'); "
                "urllib.request.urlretrieve('https://raw.githubusercontent.com/alston-personal/agentmanager/"+sha+"/scripts/threads_existing_chrome_reader.py',p); "
                "sys.argv=[p,'--read','--conversation',"+repr(username)+",'--max-chars','20000']; "
                "runpy.run_path(p,run_name='__main__')")
          task={'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':'python3','argv':['-c',code],'cwd':'/Users/tengweihuang/AgentOS','timeout_seconds':30,'cognition_ids_used':[]}
          store=RealmFabricStore(); store.queue_task('mbpr',task)
          for _ in range(45):
              r=store.get_receipt(tid)
              if r:
                  out=str(r.get('stdout') or '')
                  if r.get('ok') is not True or int(r.get('returncode') or 0)!=0 or not out:
                      print('threads_conversation_read=ERROR')
                      raise SystemExit(2)
                  obj=json.loads(out)
                  if not obj.get('found'):
                      print('threads_conversation_read=NOT_FOUND')
                      raise SystemExit(3)
                  open('/tmp/threads-conversation-read.txt','w',encoding='utf-8').write(json.dumps(obj,ensure_ascii=False))
                  print('threads_conversation_read=PASS')
                  print('threads_conversation_read_receipt='+tid)
                  print('threads_conversation_read_bytes='+str(len(out.encode())))
                  print('threads_conversation_transport='+str(obj.get('transport') or 'unknown'))
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('threads conversation read timeout')
          PY
      - name: Upload private conversation artifact
        uses: actions/upload-artifact@v4
        with:
          name: threads-conversation-read
          path: /tmp/threads-conversation-read.txt
          retention-days: 1
          if-no-files-found: error
