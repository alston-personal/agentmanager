name: Oracle Inspect Backup Units

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/oracle-inspect-backup-units.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect backup units
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$ORACLE_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          for f in "$HOME/.config/systemd/user/agentos-backup.service" "$HOME/.config/systemd/user/agentos-backup.timer" "$HOME/.config/systemd/user/agentos-remote-backup.service" "$HOME/.config/systemd/user/agentos-remote-backup.timer"; do
            echo "### $f"
            sed -n '1,160p' "$f" 2>/dev/null || echo missing
          done
          REMOTE
