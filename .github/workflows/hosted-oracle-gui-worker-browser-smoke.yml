name: Hosted Oracle GUI Worker Browser Smoke
on:
  push:
    branches:
      - core/integration
    paths:
      - '.agentos/commands/oracle-gui-worker-hosted-smoke.json'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST_SOURCE:-}"
          test -n "${DEPLOY_USER:-}"
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Smoke Oracle GUI Worker through existing SSH authority
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = "ubuntu"
          ROOT="$HOME/.local/share/agentos/gui-worker"
          test -x "$ROOT/venv/bin/python"
          "$ROOT/venv/bin/python" - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.connect_over_cdp('http://127.0.0.1:9222')
              contexts=browser.contexts
              assert contexts
              ctx=contexts[0]
              page=ctx.pages[0] if ctx.pages else ctx.new_page()
              page.goto('https://example.com',wait_until='domcontentloaded',timeout=20000)
              assert page.title()=='Example Domain'
              assert page.url.startswith('https://example.com')
              print('oracle_gui_browser_smoke=PASS')
              print('oracle_gui_browser_contexts='+str(len(contexts)))
              print('oracle_gui_browser_pages='+str(len(ctx.pages)))
          PY
          REMOTE
