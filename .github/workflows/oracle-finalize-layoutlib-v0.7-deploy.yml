name: Oracle Deploy Tested LayoutLib v0.7 Closed Loop

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-finalize-layoutlib-v0.7-deploy.yml'

permissions:
  contents: read

concurrency:
  group: layoutlib-v0-7-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 12
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Stage payload through localhost SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          tar czf - \
            agentos_node/capability_http.py \
            agentos_node/capability_store.py \
            agentos_node/capability_runtime.py \
            agentos_node/capability_consolidator.py \
            web_assets/layoutlab_v0_5.html \
            web_assets/layoutlib-browser-v0.5.js \
            web_assets/layoutlab-capability-bridge-v0.7.js \
            scripts/deploy_layoutlab_static.py \
            ops/nginx/layoutlib-capability-gateway.conf \
          | ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'rm -rf /tmp/layoutlib-v07 && mkdir -p /tmp/layoutlib-v07 && tar xzf - -C /tmp/layoutlib-v07'

      - name: Install gateway, route, and static UI
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          SRC=/tmp/layoutlib-v07
          APP=/opt/layoutlib-capability-gateway
          STORE=/var/lib/agentos-capabilities
          SITE=/etc/nginx/sites-available/studio.milkcat.org
          SNIP="$SRC/ops/nginx/layoutlib-capability-gateway.conf"
          BACKUP="${SITE}.layoutlib-v07.$(date +%Y%m%d%H%M%S).bak"
          HEALTH_TMP=$(mktemp)
          trap 'rm -f "$HEALTH_TMP"' EXIT
          sudo -n true
          id agentos-node >/dev/null

          sudo install -d -o root -g root -m 0755 "$APP/agentos_node"
          for f in capability_http.py capability_store.py capability_runtime.py capability_consolidator.py; do
            sudo install -m 0644 "$SRC/agentos_node/$f" "$APP/agentos_node/$f"
          done
          printf '%s\n' '"""Deployed AgentOS capability gateway."""' | sudo tee "$APP/agentos_node/__init__.py" >/dev/null
          sudo chmod 0644 "$APP/agentos_node/__init__.py"
          sudo install -d -o agentos-node -g agentos-node -m 0700 "$STORE"

          cat >/tmp/layoutlib-capability-gateway.service <<EOF
          [Unit]
          Description=AgentOS LayoutLib Capability Gateway v0.7
          After=network.target
          [Service]
          Type=simple
          User=agentos-node
          Group=agentos-node
          WorkingDirectory=$APP
          Environment=PYTHONPATH=$APP
          ExecStart=/usr/bin/python3 -m agentos_node.capability_http --host 127.0.0.1 --port 8767 --root $STORE
          Restart=always
          RestartSec=2
          UMask=0077
          [Install]
          WantedBy=multi-user.target
          EOF
          sudo install -m 0644 /tmp/layoutlib-capability-gateway.service /etc/systemd/system/layoutlib-capability-gateway.service
          sudo systemctl daemon-reload
          sudo systemctl stop layoutlib-capability-gateway.service 2>/dev/null || true

          # Retire the earlier temporary nohup gateway, if it still owns 8767.
          stale_pids=$(sudo ss -ltnp 'sport = :8767' 2>/dev/null | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | sort -u || true)
          for pid in $stale_pids; do
            cmd=$(sudo ps -p "$pid" -o args= 2>/dev/null || true)
            case "$cmd" in
              *agentos_node.capability_http*8767*)
                echo "retiring_stale_gateway_pid=$pid"
                sudo kill "$pid" || true
                ;;
            esac
          done
          sleep 1

          sudo systemctl enable --now layoutlib-capability-gateway.service
          sudo systemctl restart layoutlib-capability-gateway.service
          code=000
          for i in $(seq 1 20); do
            : > "$HEALTH_TMP"
            code=$(curl -sS --max-time 2 -o "$HEALTH_TMP" -w '%{http_code}' http://127.0.0.1:8767/healthz || true)
            [ "$code" = 200 ] && grep -q agentos-capability-gateway "$HEALTH_TMP" && break
            sleep 1
          done
          echo "local_gateway_health_http=$code"
          cat "$HEALTH_TMP"
          test "$code" = 200
          grep -q agentos-capability-gateway "$HEALTH_TMP"
          systemctl is-active --quiet layoutlib-capability-gateway.service

          sudo cp -a "$SITE" "$BACKUP"
          if ! sudo grep -q 'BEGIN LAYOUTLIB CAPABILITY GATEWAY V0.7' "$SITE"; then
            sudo python3 - "$SITE" "$SNIP" <<'PY'
          from pathlib import Path
          import sys
          site=Path(sys.argv[1]); snippet=Path(sys.argv[2]).read_text(); text=site.read_text()
          needle='    error_page 404 /index.html;'
          if text.count(needle) != 1:
              raise SystemExit(f'expected one insertion anchor, found {text.count(needle)}')
          block='    # BEGIN LAYOUTLIB CAPABILITY GATEWAY V0.7\n' + ''.join('    '+line+'\n' for line in snippet.splitlines()) + '    # END LAYOUTLIB CAPABILITY GATEWAY V0.7\n\n'
          site.write_text(text.replace(needle, block+needle))
          PY
          fi
          if ! sudo nginx -t; then
            sudo cp -a "$BACKUP" "$SITE"
            sudo nginx -t
            exit 3
          fi
          sudo systemctl reload nginx

          cd "$SRC"
          python3 scripts/deploy_layoutlab_static.py
          systemctl is-active --quiet layoutlib-capability-gateway.service
          echo 'persistent_gateway=PASS'
          echo 'nginx_public_route=PASS'
          echo 'static_v0_7_deploy=PASS'
          REMOTE

      - name: Prove public experience convergence and canonical bootstrap
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://studio.milkcat.org/layout-lab
          HEALTH_TMP=$(mktemp)
          RECEIPT_TMP=$(mktemp)
          CANONICAL_TMP=$(mktemp)
          trap 'rm -f "$HEALTH_TMP" "$RECEIPT_TMP" "$CANONICAL_TMP"' EXIT
          curl -fsS "$BASE/api/healthz" -o "$HEALTH_TMP"
          cat "$HEALTH_TMP"
          grep -q agentos-capability-gateway "$HEALTH_TMP"
          for row in 'proof-a 92 0.25' 'proof-b 88 0.75' 'proof-c 87 1.0'; do
            set -- $row
            payload=$(printf '{"experience":{"schema":"agentos.capability-experience/v1","experience_id":"v07-%s","capability_id":"layoutlib.profile-detection","node_id":"%s","observation":{"profile_features":{"background_luma":240,"edge_density":0.2,"contrast":0.58}},"policy_used":{"threshold":%s,"min_wall_length_px":16},"outcome":{"accepted":true,"correction_cost":1,"quality":%s},"provenance":{"experiment":"layoutlib-v0.7-public-proof"}}}' "$1" "$1" "$2" "$3")
            code=$(curl -sS -o "$RECEIPT_TMP" -w '%{http_code}' -H 'Content-Type: application/json' --data "$payload" "$BASE/api/capability/experience")
            test "$code" = 202
            grep -q '"accepted": true' "$RECEIPT_TMP"
          done
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -u agentos-node env PYTHONPATH=/opt/layoutlib-capability-gateway /usr/bin/python3 -m agentos_node.capability_consolidator --root /var/lib/agentos-capabilities --promote --authority-receipt-json '{\"decision_id\":\"layoutlib-v0.7-release-proof\",\"approved_by\":\"release-workflow\",\"scope\":\"profile-bootstrap\"}'" \
            | tee /tmp/v07-consolidation
          grep -q '"promoted": true' /tmp/v07-consolidation
          curl -fsS "$BASE/api/capability/layoutlib.profile-detection/canonical" -o "$CANONICAL_TMP"
          python3 - "$CANONICAL_TMP" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); s=d['state']
          assert s['state_kind']=='canonical', s
          assert s['support'] >= 3, s
          t=float(s['payload']['policy']['threshold'])
          assert 87 <= t < 89.5, t
          print('fresh_node_canonical_bootstrap=PASS', t)
          PY

      - name: Public v0.7 static acceptance
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://studio.milkcat.org/layout-lab
          UI_TMP=$(mktemp)
          BRIDGE_TMP=$(mktemp)
          LIB_TMP=$(mktemp)
          trap 'rm -f "$UI_TMP" "$BRIDGE_TMP" "$LIB_TMP"' EXIT
          curl -fsS "$BASE/" -o "$UI_TMP"
          curl -fsS "$BASE/layoutlab-capability-bridge-v0.7.js" -o "$BRIDGE_TMP"
          curl -fsS "$BASE/layoutlib-browser-v0.5.js" -o "$LIB_TMP"
          grep -q '<title>Layout Lab | Milkcat Studio</title>' "$UI_TMP"
          grep -q 'layoutlab-capability-bridge-v0.7.js' "$UI_TMP"
          grep -q finishModel "$BRIDGE_TMP"
          grep -q 'agentos.capability-experience/v1' "$BRIDGE_TMP"
          grep -q applyCanonicalPolicy "$BRIDGE_TMP"
          grep -q 'layoutlib.capability.pending.v1' "$BRIDGE_TMP"
          grep -q correction_cost "$BRIDGE_TMP"
          grep -q "version:'0.6.0'" "$LIB_TMP"
          echo 'layoutlib_v0_7_public_acceptance=PASS'
