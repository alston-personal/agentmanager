name: Ops LeopardCat Reading Receipt Probe

on:
  push:
    branches: [ops/leopardcat-runtime-inspect]
    paths:
      - '.github/workflows/ops-leopardcat-reading-receipt-probe.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Verify read-only receipt API and three-card state
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/$(id -un)/leopardcat-tarot/website
          test "$(git -C .. rev-parse HEAD)" = 'e945e2abdbc00f1c88c753ead8a41575be16957d'
          python3 - <<'PY'
          import json, secrets, sqlite3, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          from divination.sessions import ReadingSessionStore

          db = Path('data/reading_sessions.sqlite3')
          store = ReadingSessionStore(db, ttl_seconds=86400)
          reading_id = 'receipt-probe-' + secrets.token_hex(8)
          method_result = {
              'method':'tarot', 'spread':'three_card', 'deck':{'deck_id':'leopardcat'},
              'cards':[
                  {'card_id':'card-ma-00-the-fool','position':'past','position_label':'過去','orientation':'upright'},
                  {'card_id':'card-ma-01-the-magician','position':'present','position_label':'現在','orientation':'reversed'},
                  {'card_id':'card-ma-02-the-high-priestess','position':'future','position_label':'未來','orientation':'upright'},
              ]
          }
          issued = None
          try:
              issued = store.create(reading_id=reading_id, method='tarot', persona='leopardcat', deck_id='leopardcat', method_result=method_result)
              assert issued['session_token'] != issued['share_token']
              url = 'http://127.0.0.1:8088/api/v1/readings/' + urllib.parse.quote(reading_id) + '?shareToken=' + urllib.parse.quote(issued['share_token'])
              with urllib.request.urlopen(url, timeout=5) as r:
                  assert r.status == 200
                  payload = json.loads(r.read().decode('utf-8'))
              assert payload['share_mode'] == 'symbolic-read-only'
              assert payload['method_result']['spread'] == 'three_card'
              cards = payload['method_result']['cards']
              assert len(cards) == 3
              assert [c['orientation'] for c in cards] == ['upright','reversed','upright']
              for forbidden in ('question','reading','session_token','share_token'):
                  assert forbidden not in payload
              wrong = 'http://127.0.0.1:8088/api/v1/readings/' + urllib.parse.quote(reading_id) + '?shareToken=wrong'
              try:
                  urllib.request.urlopen(wrong, timeout=5)
                  raise AssertionError('wrong share token unexpectedly accepted')
              except urllib.error.HTTPError as e:
                  assert e.code == 404
              source = Path('main.js').read_text(encoding='utf-8')
              assert "searchParams.set('reading', envelope.reading_id)" in source
              assert "searchParams.set('share', envelope.share_token)" in source
              assert "shareU.searchParams.set('card'" not in source
              assert "sessionStorage.setItem(READING_SNAPSHOT_KEY" in source
              print('production_head_verified=true')
              print('share_token_separate_from_session=true')
              print('shared_api_symbolic_only=true')
              print('three_card_receipt_complete=true')
              print('per_card_orientation_preserved=true')
              print('wrong_share_token_rejected=true')
              print('share_url_reading_based=true')
              print('reload_snapshot_contract_present=true')
          finally:
              with sqlite3.connect(db) as con:
                  con.execute('DELETE FROM reading_sessions WHERE reading_id=?', (reading_id,))
              print('synthetic_probe_removed=true')
          PY
          REMOTE
