name: Oracle Fixed Repository Provision via Bootstrap Control

on:
  workflow_dispatch:
    inputs:
      repository_group:
        description: Fixed repository group for the existing Oracle Bootstrap owner
        type: choice
        required: true
        default: ziwei-master
        options:
          - ziwei-master
          - wow-2297
permissions:
  contents: read

jobs:
  provision:
    if: github.actor == 'alstonhuang'
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      REPOSITORY_GROUP: ${{ inputs.repository_group }}
    steps:
      - uses: actions/checkout@v4
      - name: Submit approved fixed repository provision action to ubuntu bootstrap control
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/agentos-bootstrap-control
          REQUESTS="$ROOT/requests"
          RECEIPTS="$ROOT/receipts"
          # Never infer an action from a caller-provided repository name.
          case "$REPOSITORY_GROUP" in
            ziwei-master)
              ACTION=agentos.repository.provision_ziwei_master
              SOURCE_REF=core/integration
              ;;
            wow-2297)
              ACTION=agentos.repository.provision_wow_2297_repos
              SOURCE_REF=main
              ;;
            *) echo 'error=unsupported_repository_group' >&2; exit 2 ;;
          esac
          REQUEST_ID="fixed-repo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REQUEST="$REQUESTS/$REQUEST_ID.request.json"
          RECEIPT="$RECEIPTS/$REQUEST_ID.json"
          SOURCE_COMMIT=$(git ls-remote origin "refs/heads/$SOURCE_REF" | awk '{print $1}')
          printf '%s\n' "$SOURCE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          if [ "$REPOSITORY_GROUP" = wow-2297 ]; then
            test "$GITHUB_REF_NAME" = main || { echo 'error=main_ref_required' >&2; exit 2; }
            test "$GITHUB_SHA" = "$SOURCE_COMMIT" || { echo 'error=stale_main_source' >&2; exit 2; }
          fi
          for i in $(seq 1 60); do [ -d "$REQUESTS" ] && [ -d "$RECEIPTS" ] && break; sleep 1; done
          test -d "$REQUESTS"; test -d "$RECEIPTS"
          python3 - "$REQUEST" "$REQUEST_ID" "$SOURCE_COMMIT" "$ACTION" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path(sys.argv[1]); rid=sys.argv[2]; sha=sys.argv[3]; action=sys.argv[4]
          payload={
            'schema':'agentos.bootstrap-request/v1',
            'request_id':rid,
            'action':action,
            'created_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'params':{'source_commit':sha},
            'authority':{'source':'github-actions','target_user':'ubuntu','arbitrary_shell':False},
          }
          tmp=path.with_suffix(path.suffix+'.tmp')
          tmp.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          os.chmod(tmp,0o644); tmp.replace(path); os.chmod(path,0o644)
          PY
          for i in $(seq 1 120); do [ -f "$RECEIPT" ] && break; sleep 1; done
          test -f "$RECEIPT" || { echo 'ziwei_repo_receipt=TIMEOUT'; exit 3; }
          python3 - "$RECEIPT" "$SOURCE_COMMIT" "$ACTION" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          expected=sys.argv[2]
          action=sys.argv[3]
          assert r.get('schema')=='agentos.bootstrap-receipt/v1'
          assert r.get('action')==action
          assert r.get('executor_user')=='ubuntu'
          assert r.get('executor_uid')==1001
          assert r.get('source_commit')==expected
          assert r.get('ok') is True
          lines=[]
          for step in r.get('steps',[]):
              lines.extend(str(step.get('stdout') or '').splitlines())
          if action=='agentos.repository.provision_ziwei_master':
              assert 'repo=alston-personal/ziwei-master' in lines
              assert any(x in lines for x in ('classification=CREATED_PRIVATE','classification=ALREADY_EXISTS_PRIVATE'))
              print('ziwei_repo_provision=PASS')
          elif action=='agentos.repository.provision_wow_2297_repos':
              assert 'wow_2297_repository_provision=PASS' in lines
              assert 'repo=alston-personal/wow-agentos-addon' in lines
              assert 'repo=alston-personal/wow-nav-assist' in lines
              ids=[x.split('=',1)[1] for x in lines if x.startswith('repository_id=')]
              assert len(ids)==2 and len(set(ids))==2 and all(x.isdecimal() for x in ids)
              assert lines.count('private=true')==2
              print('wow_2297_repo_provision=PASS')
              print('repo_ids='+','.join(ids))
          else:
              raise AssertionError('unknown_bootstrap_action')
          print('source_commit='+expected)
          PY
