name: Deploy Distributed AgentOS Core

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-agentos-core.yml"
      - "scripts/install_systemd_user.sh"
      - "scripts/install_services.py"
      - "agent_core/platform/linux.py"
      - "agent_core/credit_http.py"
      - "agent_core/credit_service.py"
      - "agent_core/credit_ledger.py"
      - ".agent/governance/credit_pricing.json"
      - "scripts/os_watchdog.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-agentos-core.yml"
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Branch, tag, or SHA to deploy into the stable Oracle Core checkout
        required: true
        default: main
        type: string
      expected_sha:
        description: Optional exact lowercase 40-char SHA; required for runtime-converger bootstrap
        required: false
        default: ''
        type: string
      bootstrap_runtime_converger:
        description: Explicit one-time install of bounded node.runtime.converge carrier (core/integration only)
        required: false
        default: false
        type: boolean
      verify_public_url:
        description: Also verify AGENTOS_CONTROL_PLANE_PUBLIC_URL after local health succeeds
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: distributed-agentos-cloud-core
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_ref || 'main' }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || (github.event_name == 'push' && github.sha || '') }}
      BOOTSTRAP_RUNTIME_CONVERGER: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_runtime_converger || false }}
      VERIFY_PUBLIC_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_public_url || false }}

    steps:
      - name: Report bootstrap run started to PR 2
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body=$(cat <<EOF
          <!-- agentos-core-bootstrap-start -->
          Distributed AgentOS Core bootstrap run **STARTED**.

          - main workflow commit: ${GITHUB_SHA}
          - deployment requested by protected-main push: true

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          if ! gh api "repos/${GITHUB_REPOSITORY}/issues/2/comments" -f body="$body"; then
            echo "WARN: bootstrap status reporting is unavailable; continuing with authoritative preflight/deploy path" >&2
          fi

      - name: Validate deploy connection configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in DEPLOY_HOST_SOURCE DEPLOY_USER; do
            if [ -z "${!key:-}" ]; then
              echo "Missing deployment setting: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 2
          fi

          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          if [ -z "$DEPLOY_HOST" ]; then
            echo "Unable to derive deployment host"
            exit 2
          fi
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

          if [ "$BOOTSTRAP_RUNTIME_CONVERGER" = "true" ]; then
            if [ "$DEPLOY_REF" != "core/integration" ]; then
              echo "Runtime converger bootstrap requires deploy_ref=core/integration" >&2
              exit 2
            fi
            if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "Runtime converger bootstrap requires exact lowercase expected_sha" >&2
              exit 2
            fi
          elif [ -n "$EXPECTED_SHA" ] && ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "expected_sha must be empty or a lowercase 40-character SHA" >&2
            exit 2
          fi

      - name: Start SSH agent
        id: ssh_agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Preflight Oracle Core
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test -d "$ROOT/.git" || { echo "Stable AgentOS checkout not found: $ROOT"; exit 2; }
          test -f "$ROOT/.env" || { echo "Missing $ROOT/.env"; exit 2; }
          cd "$ROOT"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "INFO: shared checkout has tracked local changes; immutable release worktree keeps them outside deployment:"
            git status --short --untracked-files=no
          fi
          test -f "$HOME/.agentos.secrets" || echo "WARN: ~/.agentos.secrets does not exist"
          systemctl --user --version >/dev/null
          python3 --version
          echo "preflight_sha=$(git rev-parse HEAD)"
          REMOTE

      - name: One-shot recover proven Git-backed dirty checkout
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'diag/oracle-core-safe-dirty-recovery-trigger' &&
          github.actor == 'alstonhuang' &&
          github.event.pull_request.title == 'trigger: recover Oracle Core known Git dirty checkout'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          cd "$ROOT"
          python3 - <<'PY'
import json
import os
from pathlib import Path
import subprocess
from datetime import datetime, timezone

EXPECTED_HEAD = "43d3edbbb4ab8b0e883c04e5297c8aaa724cbd4c"
EXPECTED = {
    "agent_core/controller_api.py": ("1892f5b359fdb33716637f71b06af64c59caca4d", "396a6f7b6aa07eef5942445233ca1bbe2a7af850"),
    "agent_core/controller_service.py": ("88a27f37f4cf43dfa5500bcef6ec9e2de50c389e", "396a6f7b6aa07eef5942445233ca1bbe2a7af850"),
    "agent_core/realm_server.py": ("bcb132a582ebdf96a946384d8957d99862a77cea", "396a6f7b6aa07eef5942445233ca1bbe2a7af850"),
    "agentos_node/bootstrap_control.py": ("3dc50809d685a1def799e53ef209c53272045545", "396a6f7b6aa07eef5942445233ca1bbe2a7af850"),
    "agentos_node/bootstrap_scheduler.py": ("fac71d4ac3f39515d85f56c32327ffc6eac2cf97", "396a6f7b6aa07eef5942445233ca1bbe2a7af850"),
    "agentos_node/gemini_web_bridge.py": ("c7737d79c11af93e52fa179a3f7b1800c0387f9f", "396a6f7b6aa07eef5942445233ca1bbe2a7af850"),
    "agentos_node/web_agent_surface.py": ("1f138724bf80c689c15d675e1c22fbce595200cd", "396a6f7b6aa07eef5942445233ca1bbe2a7af850"),
    "dashboard/app/api/agentos/[...path]/route.ts": ("70a6c2eed1baf14550f26b99adfe15325f9281c4", "396a6f7b6aa07eef5942445233ca1bbe2a7af850"),
    "scripts/mio_persona_social_loop_user.py": ("b64b3ee5a8b8d380a9b5b0202d1e5d3a28e30a7b", "396a6f7b6aa07eef5942445233ca1bbe2a7af850"),
    "scripts/threads_web_dm_bridge_user.py": ("32e9390ec8edb65089b2e53053adfff02f12fd9d", "396a6f7b6aa07eef5942445233ca1bbe2a7af850"),
    "scripts/update_scheduler_board.py": ("53b9eef5a72a2e66b39e4f2046947946adf06dd8", "2636f4c0583c7110a9a15d17e0c287bc08607655"),
}

def git(*args: str) -> str:
    proc = subprocess.run(
        ["git", *args],
        text=True,
        stdout=subprocess.PIPE,
        stderr=subprocess.PIPE,
        check=False,
    )
    if proc.returncode != 0:
        raise SystemExit("git verification failed: " + " ".join(args[:2]))
    return proc.stdout.strip()

head = git("rev-parse", "HEAD")
if head != EXPECTED_HEAD:
    raise SystemExit(f"unexpected Oracle checkout HEAD: {head}")

raw = subprocess.check_output(
    ["git", "status", "--porcelain=v1", "-z", "--untracked-files=no"],
    text=False,
)
entries = []
for item in raw.split(b"\0"):
    if not item:
        continue
    text = item.decode("utf-8")
    if len(text) < 4:
        raise SystemExit("invalid git status record")
    status, rel = text[:2], text[3:]
    entries.append((status, rel))

actual_paths = {rel for _, rel in entries}
if actual_paths != set(EXPECTED):
    raise SystemExit(
        "dirty path set changed; refusing recovery: "
        + json.dumps(sorted(actual_paths), ensure_ascii=False)
    )
if any(status != " M" for status, _ in entries):
    raise SystemExit("dirty status is not ordinary unstaged modification; refusing recovery")

evidence = []
for rel, (expected_blob, provenance_commit) in EXPECTED.items():
    path = Path(rel)
    if path.is_symlink() or not path.is_file():
        raise SystemExit(f"dirty path is not a regular file: {rel}")
    worktree_blob = git("hash-object", "--", rel)
    if worktree_blob != expected_blob:
        raise SystemExit(f"dirty blob changed; refusing recovery: {rel}")
    provenance_blob = git("rev-parse", f"{provenance_commit}:{rel}")
    if provenance_blob != worktree_blob:
        raise SystemExit(f"Git provenance mismatch; refusing recovery: {rel}")
    head_blob = git("rev-parse", f"HEAD:{rel}")
    evidence.append({
        "path": rel,
        "status": " M",
        "worktree_blob": worktree_blob,
        "provenance_commit": provenance_commit,
        "head_blob": head_blob,
        "content_exposed": False,
    })

data_root = Path(os.environ.get("AGENT_DATA_ROOT") or os.environ.get("AGENT_DATA_DIR") or (Path.home() / "agent-data"))
receipt_dir = data_root / "runtime" / "backups" / "checkout-drift"
receipt_dir.mkdir(parents=True, exist_ok=True)
receipt = receipt_dir / "known-git-recovery-20261006.json"
payload = {
    "schema": "agentos.known-git-checkout-recovery/v1",
    "repository": "alston-personal/agentmanager",
    "observed_head": head,
    "classification": "ALL_DIRTY_CONTENT_GIT_PROVENANCED",
    "recovery": "pending",
    "paths": evidence,
    "content_exposed": False,
    "credential_exposed": False,
}
tmp = receipt.with_suffix(".tmp")
tmp.write_text(json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8")
os.replace(tmp, receipt)

subprocess.run(["git", "checkout", "HEAD", "--", *EXPECTED.keys()], check=True)
after = git("status", "--porcelain=v1", "--untracked-files=no")
if after:
    raise SystemExit("tracked checkout still dirty after bounded recovery")

payload["recovery"] = "completed"
payload["recovered_at"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
tmp.write_text(json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8")
os.replace(tmp, receipt)
print("oracle_core_known_git_dirty_recovery=PASS")
print("oracle_core_recovered_head=" + head)
print("oracle_core_recovered_path_count=" + str(len(EXPECTED)))
PY
          REMOTE

      - name: Pull request preflight summary
        if: ${{ github.event_name == 'pull_request' && success() }}
        run: |
          echo "Oracle deployment channel preflight succeeded."
          echo "Pull requests never deploy."

      - name: Deploy and verify local Control Plane
        id: deploy_core
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$ROOT" "$DEPLOY_REF" "$EXPECTED_SHA" "$BOOTSTRAP_RUNTIME_CONVERGER" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          REF="$2"
          EXPECTED="$3"
          BOOTSTRAP_CONVERGER="$4"
          cd "$ROOT"

          SHARED_SHA="$(git rev-parse HEAD)"
          DATA_ROOT="${AGENT_DATA_ROOT:-${AGENT_DATA_DIR:-$HOME/agent-data}}"
          CAPABILITY_MARKER="$DATA_ROOT/runtime/action-relay/capabilities.json"
          RELEASE_ROOT="${AGENTOS_RELEASE_ROOT:-$HOME/.local/share/agentos-core-releases}"
          CURRENT_LINK="${AGENTOS_RELEASE_CURRENT:-$HOME/.local/share/agentos-core-current}"
          mkdir -p "$RELEASE_ROOT"
          PREVIOUS_RELEASE=""
          if [ -L "$CURRENT_LINK" ]; then
            PREVIOUS_RELEASE="$(readlink -f "$CURRENT_LINK")"
          fi

          rollback() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "Deployment failed; attempting runtime rollback" >&2
              if [ "$BOOTSTRAP_CONVERGER" = "true" ]; then
                rm -f "$CAPABILITY_MARKER" || true
              fi
              if [ -n "$PREVIOUS_RELEASE" ] && [ -d "$PREVIOUS_RELEASE" ]; then
                [ -e "$PREVIOUS_RELEASE/.env" ] || ln -s "$ROOT/.env" "$PREVIOUS_RELEASE/.env" || true
                PYTHONPATH="$PREVIOUS_RELEASE" python3 "$PREVIOUS_RELEASE/scripts/install_services.py" --project-root "$PREVIOUS_RELEASE" --data-root "$DATA_ROOT" || true
                ln -sfn "$PREVIOUS_RELEASE" "$CURRENT_LINK" || true
              fi
              if [ "$BOOTSTRAP_CONVERGER" = "true" ] && [ -f scripts/install_realm_fabric_user.sh ]; then
                bash scripts/install_realm_fabric_user.sh || true
              fi
              curl -fsS http://127.0.0.1:8765/health || true
            fi
            exit "$rc"
          }
          trap rollback EXIT

          git fetch --prune origin "$REF"
          TARGET_SHA="$(git rev-parse FETCH_HEAD)"
          if [ -n "$EXPECTED" ] && [ "$TARGET_SHA" != "$EXPECTED" ]; then
            echo "Refusing deployment: expected SHA does not equal current ref head" >&2
            exit 2
          fi
          if [ "$BOOTSTRAP_CONVERGER" = "true" ]; then
            [ "$REF" = "core/integration" ] || { echo "Converger bootstrap ref mismatch" >&2; exit 2; }
            [ "$TARGET_SHA" = "$EXPECTED" ] || { echo "Converger bootstrap exact-SHA mismatch" >&2; exit 2; }
          fi

          RELEASE="$RELEASE_ROOT/$TARGET_SHA"
          if [ ! -d "$RELEASE/.git" ] && [ ! -f "$RELEASE/.git" ]; then
            git worktree add --detach "$RELEASE" "$TARGET_SHA"
          fi
          test "$(git -C "$RELEASE" rev-parse HEAD)" = "$TARGET_SHA"
          [ -e "$RELEASE/.env" ] || ln -s "$ROOT/.env" "$RELEASE/.env"

          echo "Deploying immutable release $TARGET_SHA from $REF"
          echo "Shared checkout remains at $SHARED_SHA and is not mutated."

          PYTHONPATH="$RELEASE" python3 - <<'PY'
          import agent_core
          import agentos_node
          import runtime_core
          from agent_core.platform import get_platform_driver
          print("source_import=PASS")
          print("platform=" + get_platform_driver().platform_name())
          PY
          bash -n "$RELEASE/scripts/install_systemd_user.sh"

          set -a
          source .env
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a

          if [ "${AGENT_MODE:-CLIENT}" != "CORE" ]; then
            echo "AGENT_MODE must be CORE on the deployment host" >&2
            exit 2
          fi
          if [ -z "${AGENTOS_CONTROL_PLANE_TOKEN:-}" ]; then
            echo "AGENTOS_CONTROL_PLANE_TOKEN is missing" >&2
            exit 2
          fi

          INSTALL_JSON="$(PYTHONPATH="$RELEASE" python3 "$RELEASE/scripts/install_services.py" --project-root "$RELEASE" --data-root "$DATA_ROOT")"
          printf '%s\n' "$INSTALL_JSON"
          if ! printf '%s' "$INSTALL_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("mode")=="systemd"'; then
            echo "AgentOS service installation did not complete in systemd mode" >&2
            systemctl --user --no-pager --full status milkcat-credits.service || true
            journalctl --user -u milkcat-credits.service -n 120 --no-pager || true
            tail -n 160 "$DATA_ROOT/logs/milkcat_credits.log" 2>/dev/null || true
            exit 1
          fi
          systemctl --user is-active --quiet agentos-control-plane.service
          curl -fsS http://127.0.0.1:8765/health
          echo
          if ! systemctl --user is-active --quiet milkcat-credits.service; then
            systemctl --user --no-pager --full status milkcat-credits.service || true
            journalctl --user -u milkcat-credits.service -n 120 --no-pager || true
            tail -n 160 "$DATA_ROOT/logs/milkcat_credits.log" 2>/dev/null || true
            exit 1
          fi
          if ! curl -fsS http://127.0.0.1:8767/healthz | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["service"]=="milkcat-credits" and d["mode"]=="shadow"; print("milkcat_credits_shadow=PASS")'; then
            systemctl --user --no-pager --full status milkcat-credits.service || true
            journalctl --user -u milkcat-credits.service -n 120 --no-pager || true
            exit 1
          fi
          systemctl --user --no-pager --full status milkcat-credits.service | head -n 30

          if [ "$BOOTSTRAP_CONVERGER" = "true" ]; then
            bash scripts/bootstrap_runtime_converger_oracle.sh "$REF" "$TARGET_SHA"
          fi

          mkdir -p "$DATA_ROOT/runtime"
          ln -sfn "$RELEASE" "$CURRENT_LINK"
          printf '%s\n' "$SHARED_SHA" > "$DATA_ROOT/runtime/previous-agentos-core-sha"
          printf '%s\n' "$TARGET_SHA" > "$DATA_ROOT/runtime/bootstrapped-agentos-core-sha"
          printf '%s\n' "$RELEASE" > "$DATA_ROOT/runtime/bootstrapped-agentos-core-release"
          trap - EXIT
          REMOTE

      - name: Verify public Control Plane route
        id: public_verify
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_public_url }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          cd "$ROOT"
          set -a
          source .env
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          test -n "${AGENTOS_CONTROL_PLANE_PUBLIC_URL:-}" || { echo "AGENTOS_CONTROL_PLANE_PUBLIC_URL is missing"; exit 2; }
          curl -fsS -H "Authorization: Bearer ${AGENTOS_CONTROL_PLANE_TOKEN}" \
            "${AGENTOS_CONTROL_PLANE_PUBLIC_URL%/}/v1/projects/agentmanager/state"
          echo
          REMOTE

      - name: Report bootstrap result to PR 2
        if: ${{ always() && github.event_name == 'push' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          SSH_AGENT_OUTCOME: ${{ steps.ssh_agent.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        shell: bash
        run: |
          if [ "$PREFLIGHT_OUTCOME" = "success" ]; then
            verdict="SUCCESS"
          else
            verdict="FAILED"
          fi
          body=$(cat <<EOF
          <!-- agentos-core-bootstrap -->
          Distributed AgentOS Core bootstrap preflight: **${verdict}**

          - main workflow commit: ${GITHUB_SHA}
          - config: ${CONFIG_OUTCOME}
          - ssh-agent: ${SSH_AGENT_OUTCOME}
          - Oracle preflight: ${PREFLIGHT_OUTCOME}
          - deployment step: ${{ steps.deploy_core.outcome }}
          - deployed ref: ${DEPLOY_REF}
          - expected sha: ${EXPECTED_SHA}

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          if ! gh api "repos/${GITHUB_REPOSITORY}/issues/2/comments" -f body="$body"; then
            echo "WARN: bootstrap result reporting is unavailable; authoritative job outcome is unchanged" >&2
          fi

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Target host: ${DEPLOY_HOST:-unresolved}"
          echo "Target ref: ${DEPLOY_REF}"
          echo "Stable checkout: ${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          echo "Runtime converger bootstrap requested: ${BOOTSTRAP_RUNTIME_CONVERGER}"
          echo "Public verification requested: ${VERIFY_PUBLIC_URL}"
