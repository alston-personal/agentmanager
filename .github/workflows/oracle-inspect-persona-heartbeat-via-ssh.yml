name: Oracle Inspect Persona Heartbeat Via SSH
on:
  push:
    paths:
      - '.github/workflows/oracle-inspect-persona-heartbeat-via-ssh.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect current deployment state
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          echo '=== HEARTBEAT STATUS ==='
          systemctl --user --no-pager --full status agentos-persona-pdca-heartbeat.service 2>&1 || true
          echo '=== SOCIAL STATUS ==='
          systemctl --user --no-pager --full status agentos-persona-social-actions.service 2>&1 || true
          echo '=== FILE TIMES ==='
          stat -c '%y %n' "$HOME/.local/bin/agentos-persona-pdca-heartbeat-v2" "$HOME/.local/bin/agentos-persona-social-actions" 2>&1 || true
          echo '=== PROCESSES ==='
          ps -eo pid,ppid,etime,args | grep -E '[a]gentos-persona-pdca-heartbeat|[a]gentos-persona-social-actions|[p]ersona-agent-data' || true
          echo '=== TIMER ==='
          systemctl --user list-timers --all --no-pager | grep -E 'agentos-persona-(pdca-heartbeat|social-actions)' || true
          REMOTE
