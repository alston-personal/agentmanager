name: Oracle Inspect Persona Heartbeat Via SSH
on:
  push:
    paths:
      - '.github/workflows/oracle-inspect-persona-heartbeat-via-ssh.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Find local heartbeat starter
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          echo '=== MIO OBSERVER UNIT ==='
          systemctl --user cat agentos-mio-observer.service agentos-mio-observer.timer 2>&1 || true
          echo '=== ALL USER TIMERS AROUND FIVE MINUTES ==='
          systemctl --user list-timers --all --no-pager 2>&1 | grep -E 'persona|mio|observer|completion|maintenance|reconcile' || true
          echo '=== HEARTBEAT START REFERENCES ==='
          grep -RInsE 'agentos-persona-pdca-heartbeat\.service|agentos-persona-pdca-heartbeat-v2|systemctl.+persona-pdca'             "$HOME/.local/bin" "$HOME/.local/lib/agentos" "$HOME/.config/systemd/user" "$HOME/agentmanager/scripts" 2>/dev/null | head -n 1000 || true
          echo '=== MIO OBSERVER EXECUTABLE ==='
          for p in "$HOME/.local/bin/agentos-mio-observer" "$HOME/.local/lib/agentos/mio_observer.py" "$HOME/.local/lib/agentos/mio-observer.py"; do
            [ -e "$p" ] || continue
            echo "--- $p"
            sed -n '1,320p' "$p" 2>&1 || true
          done
          echo '=== RECENT OBSERVER JOURNAL ==='
          journalctl --user -u agentos-mio-observer.service --since '2026-10-06 16:40:00' --no-pager -o short-iso 2>&1 || true
          REMOTE
