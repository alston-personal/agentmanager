name: Oracle Inspect Persona Heartbeat Via SSH
on:
  push:
    paths:
      - '.github/workflows/oracle-inspect-persona-heartbeat-via-ssh.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect no-start installer acceptance
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          echo '=== HEARTBEAT TIMER ==='
          systemctl --user list-timers --all --no-pager | grep agentos-persona-pdca-heartbeat || true
          echo '=== HEARTBEAT SERVICE ==='
          systemctl --user show agentos-persona-pdca-heartbeat.service -p ActiveState -p SubState -p ExecMainStartTimestamp --no-pager
          echo '=== INSTALLER MARKERS ==='
          grep -n 'install_live_cycle=SKIPPED\|installer_must_not_advance_autonomous_cycle\|systemctl --user start agentos-persona-pdca-heartbeat.service' "$HOME/.local/bin/agentos-persona-pdca-heartbeat-v2" "$HOME/agentmanager/scripts/install_persona_pdca_timer_user.sh" 2>/dev/null || true
          echo '=== CURRENT PROCESSES ==='
          ps -eo pid,ppid,etime,args | grep -E '[a]gentos-persona-pdca-heartbeat-v2|systemctl --user start agentos-persona-pdca-heartbeat.service' || true
          REMOTE
