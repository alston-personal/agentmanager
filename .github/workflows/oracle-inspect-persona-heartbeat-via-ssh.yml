name: Oracle Inspect Persona Heartbeat Via SSH
on:
  push:
    paths:
      - '.github/workflows/oracle-inspect-persona-heartbeat-via-ssh.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect Oursong activation coupling
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          echo '=== STALE OURSONG ACTIVATOR ==='
          sed -n '1,220p' "$HOME/agentmanager/scripts/activate_oursong_persona_user.sh" 2>&1 || true
          echo '=== REFERENCES ==='
          grep -RInsE 'activate_oursong_persona_user\.sh|activate_oursong_persona|agentos-persona-pdca-heartbeat\.service'             "$HOME/.config/systemd/user" "$HOME/.local/bin" "$HOME/.local/lib/agentos" "$HOME/agentmanager/.github/workflows" "$HOME/agentmanager/scripts" 2>/dev/null | head -n 1200 || true
          echo '=== OURSONG UNITS ==='
          systemctl --user list-unit-files --no-pager 2>&1 | grep -i oursong || true
          for f in "$HOME"/.config/systemd/user/*oursong*; do
            [ -e "$f" ] || continue
            echo "--- $f"
            sed -n '1,220p' "$f" 2>&1 || true
          done
          echo '=== RECENT OURSONG JOURNAL ==='
          journalctl --user --since '2026-10-06 16:40:00' --no-pager -o short-iso 2>&1 | grep -Ei 'oursong|persona-pdca-heartbeat' || true
          REMOTE
