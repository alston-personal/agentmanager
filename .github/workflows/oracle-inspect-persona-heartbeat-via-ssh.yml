name: Oracle Inspect Persona Heartbeat Via SSH
on:
  push:
    paths:
      - '.github/workflows/oracle-inspect-persona-heartbeat-via-ssh.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect stale Oursong activation workflow
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          echo '=== STALE OURSONG WORKFLOW ==='
          sed -n '1,260p' "$HOME/agentmanager/.github/workflows/oursong-persona-activation.yml" 2>&1 || true
          echo '=== STALE REPO HEAD/STATUS ==='
          git -C "$HOME/agentmanager" rev-parse HEAD 2>&1 || true
          git -C "$HOME/agentmanager" status --short --branch 2>&1 || true
          echo '=== RECENT ACTIVATOR MTIME ==='
          stat "$HOME/agentmanager/scripts/activate_oursong_persona_user.sh" 2>&1 || true
          REMOTE
