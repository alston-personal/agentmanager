name: Oracle Runner Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-runner-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, oracle]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe host and persist evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "hostname=$(hostname)"
            echo "whoami=$(whoami)"
            echo "uname=$(uname -a)"
            echo "workspace=$PWD"
            if test -d /home/ubuntu/agentmanager; then echo "agentmanager_exists=true"; else echo "agentmanager_exists=false"; fi
            if test -d /home/ubuntu/agent-data; then echo "agent_data_exists=true"; else echo "agent_data_exists=false"; fi
            if test -f /home/agentos-node/runner/.runner; then echo "runner_registration_exists=true"; else echo "runner_registration_exists=false"; fi
          } | tee .agentos/evidence/oracle-runner-probe.txt

      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "agentos-node"
          git config user.email "agentos-node@users.noreply.github.com"
          git add .agentos/evidence/oracle-runner-probe.txt
          if git diff --cached --quiet; then
            echo "No evidence change to commit"
            exit 0
          fi
          git commit -m "evidence(agentos): Oracle runner probe"
          git push
