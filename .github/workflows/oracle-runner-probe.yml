name: Oracle Runner Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-runner-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, oracle]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe host and workspace permissions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/oracle-node-permission-audit.txt
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "hostname=$(hostname)"
            echo "whoami=$(whoami)"
            echo "uid_gid=$(id)"
            echo "groups=$(id -Gn)"
            echo "uname=$(uname -a)"
            echo "runner_workspace=$PWD"
            echo
            echo "=== PATH ACCESS ==="
            for p in /home/ubuntu /home/ubuntu/agentmanager /home/ubuntu/agent-data /home/agentos-node /home/agentos-node/runner; do
              echo "PATH=$p"
              if test -e "$p"; then
                stat -c 'owner=%U group=%G mode=%a type=%F' "$p" || true
                test -r "$p" && echo 'read=true' || echo 'read=false'
                test -w "$p" && echo 'write=true' || echo 'write=false'
                test -x "$p" && echo 'execute=true' || echo 'execute=false'
              else
                echo 'exists=false'
              fi
              echo
            done

            echo "=== UBUNTU HOME TOP LEVEL ==="
            ls -la /home/ubuntu 2>&1 | sed -n '1,120p' || true

            echo
            echo "=== CANDIDATE PROJECT DIRECTORIES ==="
            find /home/ubuntu -maxdepth 2 -mindepth 1 -type d \
              \( -name .git -o -name node_modules -o -name .cache -o -name .config -o -name .local \) -prune -o \
              -maxdepth 2 -mindepth 1 -type d -print 2>/dev/null | sed -n '1,160p' || true

            echo
            echo "=== AGENTMANAGER LOCAL REPO ==="
            if test -d /home/ubuntu/agentmanager/.git; then
              git -C /home/ubuntu/agentmanager rev-parse --abbrev-ref HEAD 2>&1 || true
              git -C /home/ubuntu/agentmanager rev-parse HEAD 2>&1 || true
              git -C /home/ubuntu/agentmanager status --short --branch 2>&1 | sed -n '1,80p' || true
            else
              echo 'not_git_repo_or_inaccessible=true'
            fi

            echo
            echo "=== AGENT-DATA LOCAL REPO ==="
            if test -d /home/ubuntu/agent-data/.git; then
              git -C /home/ubuntu/agent-data rev-parse --abbrev-ref HEAD 2>&1 || true
              git -C /home/ubuntu/agent-data rev-parse HEAD 2>&1 || true
              git -C /home/ubuntu/agent-data status --short --branch 2>&1 | sed -n '1,80p' || true
            else
              echo 'not_git_repo_or_inaccessible=true'
            fi
          } | tee "$OUT"

      - name: Audit runner-pool capacity and registration authority
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_pool_audit=BEGIN"
          echo "nproc=$(nproc)"
          echo "loadavg=$(cat /proc/loadavg)"
          awk '/MemTotal|MemAvailable|SwapTotal|SwapFree/ {print "mem_"tolower($1)"="$2" "$3}' /proc/meminfo
          echo "=== runner units ==="
          systemctl list-units --type=service --all --no-legend 'actions.runner.*.service' || true
          echo "=== runner directories ==="
          find /home/agentos-node -maxdepth 2 -type f -name '.runner' -print 2>/dev/null || true
          if sudo -n true 2>/dev/null; then echo "sudo_noninteractive=true"; else echo "sudo_noninteractive=false"; fi
          if command -v gh >/dev/null 2>&1 && gh auth status >/tmp/gh-status.txt 2>&1; then
            echo "gh_authenticated=true"
            machine_token="$(gh auth token 2>/dev/null || true)"
            if test -n "$machine_token"; then
              code="$(curl -sS -o /tmp/runner-reg.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $machine_token" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runners/registration-token" || true)"
              echo "machine_runner_registration_http=$code"
              python3 - <<'PY'
import json
from pathlib import Path
p=Path('/tmp/runner-reg.json')
d={}
if p.exists():
    try: d=json.loads(p.read_text())
    except Exception: pass
print('machine_runner_registration_token_available=' + ('true' if bool(d.get('token')) else 'false'))
print('machine_runner_registration_expires_at=' + str(d.get('expires_at') or ''))
PY
              rm -f /tmp/runner-reg.json
            else
              echo "machine_runner_registration_http=no_token"
            fi
          else
            echo "gh_authenticated=false"
          fi
          echo "runner_pool_audit=PASS"

      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "agentos-node"
          git config user.email "agentos-node@users.noreply.github.com"
          git add .agentos/evidence/oracle-node-permission-audit.txt
          if git diff --cached --quiet; then
            echo "No evidence change to commit"
            exit 0
          fi
          git commit -m "evidence(agentos): Oracle node permission audit"
          git push
