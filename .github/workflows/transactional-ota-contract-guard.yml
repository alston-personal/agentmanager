name: Transactional OTA Contract Guard
on:
  push:
    branches: [core/integration]
    paths:
      - 'scripts/windows/transactional_ota*.ps1'
      - 'agent_core/runtime_ota_acceptance.py'
      - 'tests/test_*ota*'
      - '.github/workflows/oracle-vopc5750-transactional-ota.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest
      - run: python -m pytest -q tests/test_windows_transactional_ota_contract.py tests/test_runtime_ota_acceptance.py
      - name: Parse PowerShell OTA scripts
        shell: pwsh
        run: |
          $files = @(
            'scripts/windows/transactional_ota.ps1',
            'scripts/windows/transactional_ota_guard.ps1',
            'scripts/windows/transactional_ota_finalize.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $file"
            }
          }
          Write-Host 'transactional_ota_powershell_parse=PASS'
