name: Transactional OTA Contract Guard
on:
  push:
    branches: [core/integration]
    paths:
      - 'scripts/windows/transactional_ota*.ps1'
      - 'agent_core/runtime_ota_acceptance.py'
      - 'tests/test_*ota*'
      - '.github/workflows/oracle-vopc5750-transactional-ota.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pytest -q tests/test_windows_transactional_ota_contract.py tests/test_runtime_ota_acceptance.py
