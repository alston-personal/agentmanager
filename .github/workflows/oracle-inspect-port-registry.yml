name: Oracle Inspect Port Registry

on:
  workflow_dispatch:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/oracle-inspect-port-registry.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect governed ports and live listeners
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -u
          echo '=== PORT REGISTRY ==='
          cat /home/ubuntu/agent-data/config/port_registry.json 2>/dev/null || true
          echo '=== LIVE 3000/8780 ==='
          ss -ltnp 2>/dev/null | grep -E ':3000|:8780' || true
          echo '=== PROCESS OWNERS ==='
          for p in 3000 8780; do
            echo "port=$p"
            ss -ltnp 2>/dev/null | grep ":$p" || true
          done
          REMOTE
