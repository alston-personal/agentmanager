name: Diagnostic 1682 ONE Inspect Contract
on:
  pull_request:
    paths:
      - '.github/workflows/oracle-realm-one-inspect.yml'
      - '.github/workflows/diagnostic-1682-one-inspect.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded inspect workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/oracle-realm-one-inspect.yml')
          s=p.read_text()
          assert 'workflow_dispatch:' in s
          assert "' .agentos/commands/realm-one-runtime-inspect.json'".replace("' ","'") in s
          assert "github.actor == 'alstonhuang'" in s
          assert 'relay_receipts()' in s
          assert "'vopc5750_pending_tasks'" in s
          assert 'actions/upload-artifact@v4' in s
          print('one_inspect_contract=PASS')
          PY
