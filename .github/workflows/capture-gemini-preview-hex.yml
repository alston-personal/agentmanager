name: Capture Gemini Preview Hex

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/capture-gemini-preview-hex.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Capture preview as hex chunks
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          f=RealmFabricStore(); tid='capture-gemini-preview-hex-20261006-1048'
          code="from PIL import ImageGrab; import io; im=ImageGrab.grab(all_screens=True).convert('RGB'); im.thumbnail((640,360)); b=io.BytesIO(); im.save(b,format='JPEG',quality=28,optimize=True); h=b.getvalue().hex(); print('HEX_TOTAL='+str(len(h))); [print('HEX_%05d='%i+h[i:i+800]) for i in range(0,len(h),800)]"
          if f.get_receipt(tid) is None:
              f.queue_task('VO10005870',{'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':r'C:\Users\alston.huang\AppData\Local\Programs\Python\Python312\python.exe','argv':['-c',code],'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':15,'cognition_ids_used':['demo://screen-preview/20261006']})
          for _ in range(30):
              r=f.get_receipt(tid)
              if r:
                  print(r.get('stdout') or '')
                  raise SystemExit(0)
              time.sleep(1)
          raise SystemExit('preview_receipt_missing')
          PY
          REMOTE
