name: LCCB Oracle Model Diagnostic

on:
  push:
    branches: [feature/state-kernel-v2]
    paths:
      - ".agentos/triggers/lccb-oracle-model-diagnostic"

permissions:
  contents: read
  statuses: write

jobs:
  diagnose-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      CONFIG_ROOT: ${{ vars.AGENTOS_CONFIG_ROOT || '/home/ubuntu/agentmanager' }}
      MODEL: gemini-3.1-flash-lite
      EXPERIMENT_SHA: ${{ github.sha }}

    steps:
      - name: Resolve target
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Prepare frozen diagnostic pack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-22}"
          set +e
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$EXPERIMENT_SHA" "$GITHUB_RUN_ID" "$CONFIG_ROOT" "$MODEL" <<'REMOTE'
          set -euo pipefail
          SHA="$1"; RUN_ID="$2"; CONFIG_ROOT="$3"; MODEL="$4"
          WORK="/tmp/agentos-lccb-modeldiag-${RUN_ID}"
          rm -rf "$WORK"
          git clone --quiet https://github.com/alston-personal/agentmanager.git "$WORK"
          git -C "$WORK" fetch --quiet origin "$SHA"
          git -C "$WORK" checkout --quiet --detach "$SHA"
          cd "$WORK"
          set -a
          source "$CONFIG_ROOT/.env"
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          test -n "${AI_API_BASE_URL:-}" && test -n "${AI_API_ACADEMIA_KEY:-}"
          printf 'export LCCB_BASE_URL=%q\n' "$AI_API_BASE_URL" > "$WORK/provider.env"
          printf 'export LCCB_API_KEY=%q\n' "$AI_API_ACADEMIA_KEY" >> "$WORK/provider.env"
          printf 'export LCCB_MODEL=%q\n' "$MODEL" >> "$WORK/provider.env"
          chmod 600 "$WORK/provider.env"
          python3 scripts/build_lccb_synthetic_pack.py --output artifacts/lccb-meridian --seed 73129 --events 1000
          chmod 000 artifacts/lccb-meridian/private/labels.jsonl
          REMOTE
          rc=$?
          set -e
          state=success; desc="LCCB diagnostic setup passed"
          if [ "$rc" -ne 0 ]; then state=failure; desc="LCCB diagnostic setup failed rc=$rc"; fi
          export state desc
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({"state":os.environ["state"],"context":"agentos/lccb-setup","description":os.environ["desc"][:140]}))
          PY
          )
          curl --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
          test "$rc" -eq 0

      - name: Diagnose age 0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-22}"
          set +e
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" "cd '/tmp/agentos-lccb-modeldiag-${GITHUB_RUN_ID}' && source provider.env && python3 scripts/run_lccb_openai_compatible.py --pack artifacts/lccb-meridian --output artifacts/diag-age0.jsonl --stages 0 --temperature 0 --repeat 1"
          rc=$?
          set -e
          state=success; desc="LCCB age0 model call and parse passed"
          if [ "$rc" -ne 0 ]; then state=failure; desc="LCCB age0 model call/parse failed rc=$rc"; fi
          export state desc
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({"state":os.environ["state"],"context":"agentos/lccb-age0","description":os.environ["desc"][:140]}))
          PY
          )
          curl --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
          test "$rc" -eq 0

      - name: Diagnose age 100
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-22}"
          set +e
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" "cd '/tmp/agentos-lccb-modeldiag-${GITHUB_RUN_ID}' && source provider.env && python3 scripts/run_lccb_openai_compatible.py --pack artifacts/lccb-meridian --output artifacts/diag-age100.jsonl --stages 100 --temperature 0 --repeat 1"
          rc=$?
          set -e
          state=success; desc="LCCB age100 model call and parse passed"
          if [ "$rc" -ne 0 ]; then state=failure; desc="LCCB age100 model call/parse failed rc=$rc"; fi
          export state desc
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({"state":os.environ["state"],"context":"agentos/lccb-age100","description":os.environ["desc"][:140]}))
          PY
          )
          curl --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
          test "$rc" -eq 0

      - name: Diagnose age 1000
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-22}"
          set +e
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" "cd '/tmp/agentos-lccb-modeldiag-${GITHUB_RUN_ID}' && source provider.env && python3 scripts/run_lccb_openai_compatible.py --pack artifacts/lccb-meridian --output artifacts/diag-age1000.jsonl --stages 1000 --temperature 0 --repeat 1"
          rc=$?
          set -e
          state=success; desc="LCCB age1000 model call and parse passed"
          if [ "$rc" -ne 0 ]; then state=failure; desc="LCCB age1000 model call/parse failed rc=$rc"; fi
          export state desc
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({"state":os.environ["state"],"context":"agentos/lccb-age1000","description":os.environ["desc"][:140]}))
          PY
          )
          curl --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
          test "$rc" -eq 0

      - name: Diagnose exact repeat-3 model series
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-22}"
          set +e
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" "cd '/tmp/agentos-lccb-modeldiag-${GITHUB_RUN_ID}' && source provider.env && python3 scripts/run_lccb_openai_compatible.py --pack artifacts/lccb-meridian --output artifacts/diag-repeat3.jsonl --stages 0,100,1000 --temperature 0 --repeat 3"
          rc=$?
          set -e
          state=success; desc="LCCB repeat3 model execution passed"
          if [ "$rc" -ne 0 ]; then state=failure; desc="LCCB repeat3 model execution failed rc=$rc"; fi
          export state desc
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({"state":os.environ["state"],"context":"agentos/lccb-repeat3-model","description":os.environ["desc"][:140]}))
          PY
          )
          curl --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
          test "$rc" -eq 0

      - name: Cleanup diagnostic workspace
        if: always()
        shell: bash
        run: |
          set +e
          PORT="${DEPLOY_SSH_PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" "chmod 600 '/tmp/agentos-lccb-modeldiag-${GITHUB_RUN_ID}/artifacts/lccb-meridian/private/labels.jsonl' 2>/dev/null || true; rm -rf '/tmp/agentos-lccb-modeldiag-${GITHUB_RUN_ID}'" >/dev/null 2>&1
          exit 0
