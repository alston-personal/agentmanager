name: Oracle Legacy GDrive Underlay Check

on:
  push:
    branches:
      - diag/oracle-gdrive-storage-recovery-20261001
    paths:
      - '.github/workflows/oracle-legacy-gdrive-underlay-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect retired underlay
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$ORACLE_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          P="$HOME/gdrive"
          echo "legacy_exists=$([ -e "$P" ] && echo yes || echo no)"
          echo '=== recovery state ==='
          ps -eo pid,etimes,args | grep '[r]clone copyto .*recovered-oracle-underlay-20261001' || true
          for name in agentos_backup_20260930_030001.tar.gz agentos_backup_20261001_030001.tar.gz; do
            local_file="$HOME/gdrive/backups/$name"
            echo "-- $name"
            if [ -f "$local_file" ]; then
              local_size="$(stat -c %s "$local_file")"
              local_md5="$(md5sum "$local_file" | awk '{print $1}')"
              echo "local_size=$local_size"
              echo "local_md5=$local_md5"
            else
              local_size=""
              local_md5=""
              echo 'local_missing=yes'
            fi
            remote_size="$(timeout 30 rclone lsf "gdrive:backups/recovered-oracle-underlay-20261001/$name" --files-only --format s 2>/dev/null | head -n1 || true)"
            remote_md5="$(timeout 60 rclone md5sum "gdrive:backups/recovered-oracle-underlay-20261001/$name" 2>/dev/null | awk 'NR==1{print $1}' || true)"
            echo "remote_size=${remote_size:-missing}"
            echo "remote_md5=${remote_md5:-missing}"
            if [ -n "$local_size" ] && [ "$remote_size" = "$local_size" ] && [ -n "$local_md5" ] && [ "$remote_md5" = "$local_md5" ]; then
              echo 'recovery_verified=yes'
            else
              echo 'recovery_verified=no'
            fi
          done
          echo '=== service state ==='
          systemctl --user is-enabled agentos-gdrive-mount.service 2>/dev/null || true
          systemctl --user is-active agentos-gdrive-mount.service 2>/dev/null || true
          systemctl --user is-enabled agentos-gdrive-health.timer 2>/dev/null || true
          systemctl --user is-active agentos-gdrive-health.timer 2>/dev/null || true
          systemctl --user is-enabled agentos-remote-backup.timer 2>/dev/null || true
          systemctl --user is-active agentos-remote-backup.timer 2>/dev/null || true
          systemctl --user is-enabled agentos-gdrive-underlay-finalize.timer 2>/dev/null || true
          systemctl --user is-active agentos-gdrive-underlay-finalize.timer 2>/dev/null || true
          cat "$HOME/.local/state/agentos/gdrive-underlay-finalize.state" 2>/dev/null || true
          mountpoint -q "$HOME/.local/share/agentos/gdrive-remote-v2" && echo 'canonical_mount_ready=yes' || echo 'canonical_mount_ready=no'
          [ -L "$HOME/gdrive" ] && echo "legacy_symlink=$(readlink "$HOME/gdrive")" || true
          if [ -e "$P" ]; then
            stat -c 'mode=%a owner=%U group=%G size=%s mtime=%y' "$P"
            echo 'top:'
            find "$P" -mindepth 1 -maxdepth 2 -printf '%y %p\n' 2>/dev/null | head -n 80 || true
            echo 'files:'
            find "$P" -xdev -type f -printf '%s %p\n' 2>/dev/null | head -n 80 || true
            echo "bytes=$(du -sb "$P" 2>/dev/null | awk '{print $1}')"
            if command -v lsof >/dev/null 2>&1; then
              lsof +D "$P" 2>/dev/null | head -n 80 || true
            fi
          fi
          REMOTE
