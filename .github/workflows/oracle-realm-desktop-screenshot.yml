name: Oracle Realm Desktop Screenshot

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: oracle-realm-desktop-screenshot
  cancel-in-progress: false

jobs:
  inspect:
    if: github.actor == 'alstonhuang'
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Queue window inspection and collect receipt
        shell: bash
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time
          from pathlib import Path
          from agent_core.realm_fabric import RealmFabricStore
          cmd=json.load(open('.agentos/commands/realm-desktop-screenshot.json',encoding='utf-8'))
          assert cmd.get('schema')=='agentos.realm-command/v0.1'
          assert cmd.get('action')=='realm.desktop.screenshot'
          node_id=str(cmd.get('node_id') or '')
          assert node_id=='vopc5750'
          task_id='desktop-screenshot-'+node_id+'-'+str(int(time.time()))
          task={'schema':'agentos.node-task/v0.1','task_id':task_id,'action':'desktop.screenshot','quality':55,'cognition_ids_used':[]}
          fabric=RealmFabricStore(); fabric.queue_task(node_id,task)
          deadline=time.time()+90; receipt=None
          while time.time()<deadline:
              receipt=fabric.get_receipt(task_id)
              if receipt: break
              time.sleep(2)
          assert receipt is not None, f'no receipt for {task_id}'
          assert receipt.get('ok') is True, receipt
          import base64
          image=base64.b64decode(str(receipt.pop('image_base64')))
          Path('/tmp/vopc5750-desktop.bmp').write_bytes(image)
          Path('/tmp/realm-desktop-screenshot.json').write_text(json.dumps(receipt,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('desktop_screenshot=PASS')
          print('task_id='+task_id)
          PY
      - name: Upload private screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: vopc5750-desktop-screenshot
          path: |
            /tmp/vopc5750-desktop.bmp
            /tmp/realm-desktop-screenshot.json
          if-no-files-found: error
          retention-days: 1
