name: LeopardCat Runtime Inspect via AgentOS Oracle

on:
  workflow_dispatch:
  push:
    branches: [chore/leopardcat-runtime-inspect]
    paths:
      - '.github/workflows/leopardcat-runtime-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start governed SSH identity
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect LeopardCat production runtime read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -u
          ROOT=/home/ubuntu/leopardcat-tarot
          echo '=== identity ==='
          id
          hostname
          echo

          echo '=== production git ==='
          echo "repo=$ROOT"
          echo "head=$(git -C "$ROOT" rev-parse HEAD 2>/dev/null || true)"
          echo "branch=$(git -C "$ROOT" branch --show-current 2>/dev/null || true)"
          echo 'status_begin'
          git -C "$ROOT" status --short --branch 2>/dev/null || true
          echo 'status_end'
          echo 'dirty_name_status_begin'
          git -C "$ROOT" diff --name-status 2>/dev/null || true
          git -C "$ROOT" diff --cached --name-status 2>/dev/null || true
          git -C "$ROOT" ls-files --others --exclude-standard 2>/dev/null | sed 's/^/?\t/' || true
          echo 'dirty_name_status_end'
          echo

          echo '=== port 8088 ==='
          ss -ltnp 2>/dev/null | grep ':8088' || true
          pids="$(ss -ltnp 2>/dev/null | sed -n 's/.*:8088 .*pid=\([0-9][0-9]*\).*/\1/p' | sort -u)"
          for pid in $pids; do
            echo "pid=$pid"
            echo "cwd=$(readlink -f /proc/$pid/cwd 2>/dev/null || true)"
            echo -n 'cmdline='; tr '\0' ' ' < /proc/$pid/cmdline 2>/dev/null || true; echo
          done
          echo

          echo '=== service ==='
          systemctl --user --no-pager --full status leopardcat-tarot.service 2>/dev/null | sed -n '1,40p' || true
          echo

          echo '=== local policy ==='
          curl -sS --max-time 5 http://127.0.0.1:8088/api/v1/ai-policy || true
          echo
          echo '=== public health ==='
          curl -sS -o /dev/null -w 'public_http=%{http_code}\n' --max-time 8 https://leopardcat-tarot.milkcat.org/ || true
          REMOTE
