name: Oracle Dashboard Blue First Cutover

on:
  push:
    branches: [core/integration]
    paths:
      - 'scripts/deploy_dashboard_blue_slot_user.sh'
      - '.github/workflows/oracle-dashboard-blue-first-cutover.yml'

permissions:
  contents: read

concurrency:
  group: oracle-dashboard-production-deploy
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Build, verify and activate blue slot
        shell: bash
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=accept-new -P "${DEPLOY_PORT:-22}" scripts/deploy_dashboard_blue_slot_user.sh "${DEPLOY_USER}@${ORACLE_HOST}:/tmp/deploy_dashboard_blue_slot_user.sh"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" \
            "chmod 700 /tmp/deploy_dashboard_blue_slot_user.sh && /tmp/deploy_dashboard_blue_slot_user.sh '$GITHUB_SHA' '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT'"
      - name: Prove public auth continuity after cutover
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            code=$(curl -sS -o /tmp/public-session -w '%{http_code}' --max-time 5 https://studio.milkcat.org/dashboard/api/auth/session || true)
            [ "$code" = 200 ] && break
            sleep 0.5
          done
          test "$code" = 200
          echo "dashboard_blue_public_auth_continuity=PASS"
