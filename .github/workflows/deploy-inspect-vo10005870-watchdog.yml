name: Stage VO10005870 Liveness V2

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/deploy-inspect-vo10005870-watchdog.yml'

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Stage pinned runtime files
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          f=RealmFabricStore()
          tid='stage-liveness-v2-pinned-20261002-1445'
          ps=r'''$ErrorActionPreference='Stop'
          $root=Join-Path $env:LOCALAPPDATA 'AgentOS'
          $transport=Join-Path $root 'agentos_node\thin_client_transport.py'
          $watchdogV3=Join-Path $root 'scripts\thin_client_watchdog-v3.ps1'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/alston-personal/agentmanager/4b37e0c78696021a0078673540a4b2fd044bbb17/agentos_node/thin_client_transport.py' -OutFile $transport
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/alston-personal/agentmanager/96df1533ef06e8e4782ca089f5625ca49011be58/scripts/windows/thin_client_watchdog.ps1' -OutFile $watchdogV3
          $tt=Get-Content -Raw -LiteralPath $transport
          $wt=Get-Content -Raw -LiteralPath $watchdogV3
          if($tt -notmatch '_liveness_lease_path'){throw 'transport_pin_validation_failed'}
          if($wt -notmatch 'daemon-liveness\.json'){throw 'watchdog_pin_validation_failed'}
          Stop-ScheduledTask -TaskName 'AgentOS Thin Client Watchdog' -ErrorAction SilentlyContinue
          $wa=New-ScheduledTaskAction -Execute 'powershell.exe' -Argument ('-NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File "'+$watchdogV3+'" -TaskName "AgentOS Thin Client"')
          Set-ScheduledTask -TaskName 'AgentOS Thin Client Watchdog' -Action $wa | Out-Null
          Start-ScheduledTask -TaskName 'AgentOS Thin Client Watchdog'
          Write-Output ('TRANSPORT_BYTES='+(Get-Item $transport).Length)
          Write-Output ('WATCHDOG_V3_BYTES='+(Get-Item $watchdogV3).Length)
          Write-Output 'STAGE_PINNED=PASS' '''
          if f.get_receipt(tid) is None:
              f.queue_task('VO10005870',{
                  'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec',
                  'executable':'powershell','argv':['-NoProfile','-NonInteractive','-Command',ps],
                  'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':30,
                  'cognition_ids_used':['demo://liveness-v2/20261002'],
              })
          for _ in range(45):
              r=f.get_receipt(tid)
              if r is not None:
                  print(json.dumps(r,ensure_ascii=False,separators=(',',':')))
                  assert r.get('ok') is True and int(r.get('returncode') or 0)==0, r
                  assert 'STAGE_PINNED=PASS' in str(r.get('stdout') or ''), r
                  break
              time.sleep(1)
          else:
              raise SystemExit('stage_receipt_missing')
          PY
          REMOTE
