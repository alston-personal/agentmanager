name: Deploy And Inspect VO10005870 Watchdog

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/deploy-inspect-vo10005870-watchdog.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Deploy and inspect watchdog
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          f=RealmFabricStore()
          tid='deploy-inspect-watchdog-20261002-1424'
          ps=r'''$ErrorActionPreference='Stop'
          $dst=Join-Path $env:LOCALAPPDATA 'AgentOS\scripts\thin_client_watchdog.ps1'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/alston-personal/agentmanager/fix/windows-thin-client-watchdog/scripts/windows/thin_client_watchdog.ps1' -OutFile $dst
          Stop-ScheduledTask -TaskName 'AgentOS Thin Client Watchdog' -ErrorAction SilentlyContinue
          Start-ScheduledTask -TaskName 'AgentOS Thin Client Watchdog'
          $old=Join-Path $env:USERPROFILE '.agentos\heartbeat-lease.json'
          $new=Join-Path $env:LOCALAPPDATA 'AgentOS\state\heartbeat-lease.json'
          Write-Output ('WATCHDOG_BYTES='+(Get-Item $dst).Length)
          Write-Output ('OLD_EXISTS='+(Test-Path $old))
          Write-Output ('NEW_EXISTS='+(Test-Path $new))
          if(Test-Path $new){Write-Output ('NEW_LEASE='+(Get-Content -Raw -LiteralPath $new).Trim())}
          $log=Join-Path $env:LOCALAPPDATA 'AgentOS\watchdog\watchdog.log'
          if(Test-Path $log){Write-Output 'LOG_BEGIN'; Get-Content -LiteralPath $log -Tail 40; Write-Output 'LOG_END'}'''
          if f.get_receipt(tid) is None:
              f.queue_task('VO10005870',{
                  'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec',
                  'executable':'powershell','argv':['-NoProfile','-NonInteractive','-Command',ps],
                  'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':30,
                  'cognition_ids_used':['demo://watchdog-debug/20261002'],
              })
          for _ in range(45):
              r=f.get_receipt(tid)
              if r is not None:
                  print(json.dumps(r,ensure_ascii=False,separators=(',',':')))
                  assert r.get('ok') is True and int(r.get('returncode') or 0)==0, r
                  break
              time.sleep(1)
          else:
              raise SystemExit('watchdog_deploy_receipt_missing')
          PY
          REMOTE
