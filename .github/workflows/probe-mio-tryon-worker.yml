name: Probe Mio Try-On Worker

on:
  push:
    branches: [feat/mio-tryon-worker]
    paths:
      - '.github/workflows/probe-mio-tryon-worker.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run one real FASHN try-on job
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/mio-tryon-probe
          rm -rf "$ROOT"
          mkdir -p "$ROOT/projects/dressup-simulator/render_jobs/runtime"
          cat > "$ROOT/projects/dressup-simulator/render_jobs/runtime/probe.json" <<'JSON'
          {
            "schema":"agentos.tryon-render-job/v1",
            "jobId":"probe",
            "characterId":"sunlake-milkcat-ai-001",
            "characterVersion":"mio-body-v1",
            "view":"front",
            "pose":"neutral_standing",
            "status":"queued",
            "requestedAt":"2026-09-28T04:00:00Z",
            "startedAt":null,
            "completedAt":null,
            "failedAt":null,
            "supersededBy":null,
            "input":{
              "baseBodyAsset":"https://studio.milkcat.org/personas/mio/mio-avatar.webp",
              "layerOrder":["upper_main"],
              "selectedLayers":{
                "upper_main":{
                  "garmentId":"net-43774-002",
                  "name":"合身坑條圓領上衣",
                  "layer":"upper_main",
                  "sourceImageUrl":"https://net.wimg.tw/files/1/products/735109_color_002E799BDE889B2.jpg?v=32570"
                }
              }
            },
            "output":{"asset":null,"previewAsset":null,"width":null,"height":null},
            "error":null
          }
          JSON
          AGENT_DATA_ROOT="$ROOT" AGENTOS_TRYON_ONCE=1 python3 scripts/tryon_render_worker.py
          cat "$ROOT/projects/dressup-simulator/render_jobs/runtime/probe.json"
          test -s "$ROOT/projects/dressup-simulator/render_assets/probe.png"
          file "$ROOT/projects/dressup-simulator/render_assets/probe.png"
