name: Product Employee Runtime Source Guard

on:
  pull_request:
    branches:
      - core/integration
    paths:
      - '.github/workflows/product-employee-runtime-rollout.yml'
      - 'agent_core/work_intent.py'
      - 'agent_core/governed_execution.py'
      - 'agent_core/employee_runtime.py'
      - 'agent_core/employee_lifecycle.py'
      - 'agent_core/employee_wake.py'
      - 'agent_core/core_supervisor_delivery.py'
      - 'agentos_node/employee_wake_inbox.py'
      - 'agentos_node/product_employee_worker.py'
      - 'agentos_node/product_employee_worker_cli.py'
      - 'agentos_node/employee_worker_host.py'
      - 'agentos_node/employee_worker_host_runtime.py'
      - 'governance/execution-authority.json'
      - 'governance/employee-worker-adapters-v2.json'
      - 'tests/test_product_employee_worker.py'
      - 'tests/test_product_employee_runtime_rollout.py'
  push:
    branches:
      - core/integration
    paths:
      - '.github/workflows/product-employee-runtime-rollout.yml'
      - 'agent_core/work_intent.py'
      - 'agent_core/governed_execution.py'
      - 'agent_core/employee_runtime.py'
      - 'agent_core/employee_lifecycle.py'
      - 'agent_core/employee_wake.py'
      - 'agent_core/core_supervisor_delivery.py'
      - 'agentos_node/employee_wake_inbox.py'
      - 'agentos_node/product_employee_worker.py'
      - 'agentos_node/product_employee_worker_cli.py'
      - 'agentos_node/employee_worker_host.py'
      - 'agentos_node/employee_worker_host_runtime.py'
      - 'governance/execution-authority.json'
      - 'governance/employee-worker-adapters-v2.json'
      - 'tests/test_product_employee_worker.py'
      - 'tests/test_product_employee_runtime_rollout.py'

permissions:
  contents: read

jobs:
  source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install existing test dependencies
        run: python -m pip install PyYAML pytest

      - name: Validate bounded Product Employee source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'alston-personal/agentmanager'
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$GITHUB_BASE_REF" = 'core/integration'
          else
            test "$GITHUB_REF" = 'refs/heads/core/integration'
          fi
          printf '%s' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile \
            agentos_node/product_employee_worker.py \
            agentos_node/product_employee_worker_cli.py \
            agentos_node/employee_worker_host.py \
            agentos_node/employee_worker_host_runtime.py
          python -m pytest -q \
            tests/test_product_employee_worker.py \
            tests/test_product_employee_contracts.py

      - name: Enforce immutable-runtime deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'scripts.rollout_product_employee_runtime' .github/workflows/product-employee-runtime-rollout.yml
          ! grep -q 'self-hosted' .github/workflows/product-employee-runtime-rollout.yml
          ! grep -q 'node.runtime.converge' .github/workflows/product-employee-runtime-rollout.yml
          echo 'product_employee_source_guard=PASS runtime_mutation=DEFERRED_TO_IMMUTABLE_RELEASE_CONTROLLER'

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile \
            agentos_node/product_employee_worker.py \
            agentos_node/product_employee_worker_cli.py \
            agentos_node/employee_worker_host.py \
            agentos_node/employee_worker_host_runtime.py
          python -m pytest -q \
            tests/test_product_employee_worker.py \
            tests/test_product_employee_contracts.py

      - name: Enforce immutable-runtime deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'scripts.rollout_product_employee_runtime' .github/workflows/product-employee-runtime-rollout.yml
          ! grep -q 'self-hosted' .github/workflows/product-employee-runtime-rollout.yml
          ! grep -q 'node.runtime.converge' .github/workflows/product-employee-runtime-rollout.yml
          echo 'product_employee_source_guard=PASS runtime_mutation=DEFERRED_TO_IMMUTABLE_RELEASE_CONTROLLER'
