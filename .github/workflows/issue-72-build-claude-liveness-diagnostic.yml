name: Issue 72 Build Claude Liveness Diagnostic

on:
  push:
    branches: [core/issue-72-claude-liveness]
    paths: [.github/workflows/issue-72-build-claude-liveness-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/issue-72-claude-liveness
          fetch-depth: 0

      - name: Add bounded diagnostic action and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path=Path('agentos_node/action_relay.py')
          text=path.read_text(encoding='utf-8')
          marker='def _antigravity_restart(params: dict[str, Any]) -> dict[str, Any]:\n'
          if 'def _claude_liveness_diagnose(' not in text:
              block=r'''CLAUDE_LIVENESS_PROBES = frozenset({"auth_status", "headless_print", "restricted_headless_print"})
          CLAUDE_LIVENESS_MARKER = "AGENTOS_CLAUDE_LIVENESS_PASS"


          def _sha256_text(value: str) -> str:
              return hashlib.sha256(value.encode("utf-8", errors="replace")).hexdigest()


          def _claude_probe_result(
              argv: list[str],
              *,
              command_class: str,
              timeout: float,
              marker: str | None = None,
          ) -> dict[str, Any]:
              started = time.monotonic()
              stdout = ""
              stderr = ""
              returncode = 124
              timed_out = False
              try:
                  completed = subprocess.run(
                      argv,
                      cwd=str(Path.home()),
                      text=True,
                      capture_output=True,
                      timeout=timeout,
                      check=False,
                  )
                  stdout = completed.stdout or ""
                  stderr = completed.stderr or ""
                  returncode = int(completed.returncode)
              except subprocess.TimeoutExpired as exc:
                  timed_out = True
                  raw_stdout = exc.stdout or ""
                  raw_stderr = exc.stderr or ""
                  stdout = raw_stdout.decode(errors="replace") if isinstance(raw_stdout, bytes) else str(raw_stdout)
                  stderr = raw_stderr.decode(errors="replace") if isinstance(raw_stderr, bytes) else str(raw_stderr)
              elapsed_ms = int((time.monotonic() - started) * 1000)
              lowered = (stdout + "\n" + stderr).lower()
              unsupported = any(
                  token in lowered
                  for token in (
                      "unknown option", "unknown command", "unrecognized option",
                      "unrecognized command", "invalid option", "no such command",
                  )
              )
              result: dict[str, Any] = {
                  "command_class": command_class,
                  "returncode": returncode,
                  "timed_out": timed_out,
                  "elapsed_ms": elapsed_ms,
                  "stdout_bytes": len(stdout.encode("utf-8", errors="replace")),
                  "stderr_bytes": len(stderr.encode("utf-8", errors="replace")),
                  "stdout_sha256": _sha256_text(stdout),
                  "stderr_sha256": _sha256_text(stderr),
                  "supported": not unsupported,
              }
              if marker is not None:
                  result["expected_marker"] = marker
                  result["marker_present"] = marker in stdout
              if command_class == "auth_status":
                  if unsupported:
                      auth_state = "unsupported"
                  elif any(token in lowered for token in ("not logged in", "not authenticated", "unauthenticated", "login required")):
                      auth_state = "not_authenticated"
                  elif any(token in lowered for token in ("logged in", "authenticated")):
                      auth_state = "authenticated"
                  elif returncode == 0 and not timed_out:
                      auth_state = "status_ok_unclassified"
                  else:
                      auth_state = "unknown"
                  result["auth_state"] = auth_state
              return result


          def _claude_liveness_diagnose(params: dict[str, Any]) -> dict[str, Any]:
              if set(params) != {"probe"}:
                  raise ValueError("unexpected parameters")
              probe = str(params.get("probe") or "").strip()
              if probe not in CLAUDE_LIVENESS_PROBES:
                  raise ValueError("unsupported Claude liveness probe")

              # Import lazily so the deterministic Action Relay stays independent
              # from the model relay except for this explicitly-authorized probe.
              from agentos_node.antigravity_relay_worker import discover_executor

              provider, executor = discover_executor("claude")
              if provider != "claude" or not executor:
                  return {
                      "ok": True,
                      "probe": probe,
                      "probe_ok": False,
                      "supported": False,
                      "classification": "executor_unavailable",
                  }

              binary = executor[0]
              version = "unknown"
              parts = Path(binary).parts
              for part in parts:
                  prefix = "anthropic.claude-code-"
                  suffix = "-linux-arm64"
                  if part.startswith(prefix) and part.endswith(suffix):
                      version = part[len(prefix):-len(suffix)]
                      break

              prompt = f"Return exactly {CLAUDE_LIVENESS_MARKER}. Do not use tools."
              if probe == "auth_status":
                  argv = [binary, "auth", "status"]
                  result = _claude_probe_result(argv, command_class=probe, timeout=20.0)
                  probe_ok = result["returncode"] == 0 and not result["timed_out"] and result.get("auth_state") != "not_authenticated"
              else:
                  fixed = [binary]
                  if probe == "restricted_headless_print":
                      fixed.append("--restricted")
                  fixed.extend(["--bare", "--print", "--output-format", "text", "--effort", "low", prompt])
                  result = _claude_probe_result(
                      fixed,
                      command_class=probe,
                      timeout=30.0,
                      marker=CLAUDE_LIVENESS_MARKER,
                  )
                  probe_ok = (
                      result["returncode"] == 0
                      and not result["timed_out"]
                      and result.get("marker_present") is True
                  )

              # `ok` means the bounded diagnostic action itself completed and
              # emitted sanitized evidence. Probe health is carried separately.
              return {
                  "ok": True,
                  "probe": probe,
                  "probe_ok": bool(probe_ok),
                  "provider": "claude",
                  "executor_version": version,
                  "result": result,
                  "raw_output_persisted": False,
                  "arbitrary_argv": False,
              }


          '''
              # Dedent the intentionally indented raw literal from this workflow.
              import textwrap
              block=textwrap.dedent(block)
              if marker not in text:
                  raise SystemExit('antigravity restart insertion marker missing')
              text=text.replace(marker, block+marker, 1)

          action_line='    "agentos.antigravity.restart": _antigravity_restart,\n'
          diagnostic_line='    "agentos.claude.liveness_diagnose": _claude_liveness_diagnose,\n'
          if diagnostic_line not in text:
              if action_line not in text:
                  raise SystemExit('ACTIONS insertion marker missing')
              text=text.replace(action_line, action_line+diagnostic_line, 1)
          path.write_text(text,encoding='utf-8')

          test=Path('tests/test_claude_liveness_action.py')
          test.write_text(r'''import subprocess
          import unittest
          from unittest.mock import patch

          from agentos_node.action_relay import (
              ACTIONS,
              CLAUDE_LIVENESS_MARKER,
              _claude_liveness_diagnose,
          )


          class ClaudeLivenessActionTests(unittest.TestCase):
              def test_action_is_allowlisted_but_not_generic_shell(self):
                  self.assertIn("agentos.claude.liveness_diagnose", ACTIONS)
                  with self.assertRaises(ValueError):
                      _claude_liveness_diagnose({"probe": "shell.exec"})
                  with self.assertRaises(ValueError):
                      _claude_liveness_diagnose({"probe": "auth_status", "argv": ["id"]})

              @patch("agentos_node.antigravity_relay_worker.discover_executor")
              @patch("agentos_node.action_relay.subprocess.run")
              def test_headless_probe_returns_sanitized_marker_evidence(self, run, discover):
                  discover.return_value = ("claude", ["/tmp/anthropic.claude-code-2.1.251-linux-arm64/resources/native-binary/claude"])
                  run.return_value = subprocess.CompletedProcess([], 0, stdout=CLAUDE_LIVENESS_MARKER + "\n", stderr="")
                  result = _claude_liveness_diagnose({"probe": "headless_print"})
                  self.assertTrue(result["ok"])
                  self.assertTrue(result["probe_ok"])
                  self.assertEqual(result["executor_version"], "2.1.251")
                  self.assertFalse(result["raw_output_persisted"])
                  self.assertNotIn("stdout", result["result"])
                  self.assertNotIn("stderr", result["result"])
                  self.assertNotIn("argv", result["result"])
                  self.assertTrue(result["result"]["marker_present"])
                  invoked = run.call_args.args[0]
                  self.assertIn("--print", invoked)
                  self.assertNotIn("--restricted", invoked)

              @patch("agentos_node.antigravity_relay_worker.discover_executor")
              @patch("agentos_node.action_relay.subprocess.run")
              def test_restricted_probe_is_fixed_and_reports_unsupported(self, run, discover):
                  discover.return_value = ("claude", ["/tmp/claude"])
                  run.return_value = subprocess.CompletedProcess([], 2, stdout="", stderr="unknown option --restricted")
                  result = _claude_liveness_diagnose({"probe": "restricted_headless_print"})
                  self.assertTrue(result["ok"])
                  self.assertFalse(result["probe_ok"])
                  self.assertFalse(result["result"]["supported"])
                  self.assertIn("--restricted", run.call_args.args[0])

              @patch("agentos_node.antigravity_relay_worker.discover_executor")
              @patch("agentos_node.action_relay.subprocess.run")
              def test_auth_status_classification_does_not_persist_output(self, run, discover):
                  discover.return_value = ("claude", ["/tmp/claude"])
                  run.return_value = subprocess.CompletedProcess([], 0, stdout="Authenticated as hidden@example.invalid", stderr="")
                  result = _claude_liveness_diagnose({"probe": "auth_status"})
                  self.assertEqual(result["result"]["auth_state"], "authenticated")
                  self.assertNotIn("hidden@example.invalid", repr(result))

              @patch("agentos_node.antigravity_relay_worker.discover_executor")
              @patch("agentos_node.action_relay.subprocess.run")
              def test_timeout_is_terminal_sanitized_evidence(self, run, discover):
                  discover.return_value = ("claude", ["/tmp/claude"])
                  run.side_effect = subprocess.TimeoutExpired(["/tmp/claude"], 30, output=b"partial", stderr=b"")
                  result = _claude_liveness_diagnose({"probe": "headless_print"})
                  self.assertTrue(result["result"]["timed_out"])
                  self.assertEqual(result["result"]["returncode"], 124)
                  self.assertFalse(result["probe_ok"])
                  self.assertNotIn("partial", repr(result))


          if __name__ == "__main__":
              unittest.main()
          ''',encoding='utf-8')
          # Remove workflow indentation from the test module.
          import textwrap
          test.write_text(textwrap.dedent(test.read_text(encoding='utf-8')),encoding='utf-8')
          PY

      - name: Run narrow relay tests
        run: |
          python3 -m unittest tests.test_action_relay tests.test_claude_liveness_action -v
          python3 -m py_compile agentos_node/action_relay.py tests/test_claude_liveness_action.py

      - name: Commit bounded diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add agentos_node/action_relay.py tests/test_claude_liveness_action.py
          git diff --cached --quiet && exit 0
          git commit -m 'feat(agentos): add bounded Claude liveness diagnostic for #72'
          git push origin HEAD:core/issue-72-claude-liveness
