name: Auth Live Sequence Diagnostic

on:
  pull_request:
    branches: [core/integration]
    paths: ['.github/workflows/auth-live-sequence-diagnostic.yml']

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect recent auth request sequence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out=$(mktemp)
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' >"$out" 2>&1 <<'REMOTE'
          set -euo pipefail
          echo '=== live release ==='
          readlink -f /home/ubuntu/agent-data/runtime/dashboard/current || true
          echo '=== recent auth access ==='
          for log in /var/log/nginx/access.log /var/log/nginx/*access*.log; do
            [ -f "$log" ] || continue
            tail -n 4000 "$log" | grep -E '/dashboard/api/auth/(signin/google|callback/google|session)|/dashboard/api/wardrobe/auth-handoff' | tail -160 || true
          done | awk '{print $4, $6, $7, $9, $11}' | tail -160
          echo '=== recent dashboard auth journal ==='
          journalctl --user -u agentos-dashboard.service --since '20 minutes ago' --no-pager 2>/dev/null | grep -Ei 'oauth|callback|google|auth|cookie|jwt|signin' | tail -120 || true
          echo '=== current session unauth probe ==='
          code=$(curl -sS -o /tmp/auth-session -w '%{http_code}' --max-time 5 http://127.0.0.1:3000/dashboard/api/auth/session || true)
          echo "session_http=$code body=$(cat /tmp/auth-session 2>/dev/null)"
          REMOTE
          cat "$out"
          { echo '### Auth live sequence'; echo; echo '```text'; cat "$out"; echo '```'; } >/tmp/diag.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /tmp/diag.md