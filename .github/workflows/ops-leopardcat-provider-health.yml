name: Ops LeopardCat Provider Health
on:
  push:
    branches: [ops/leopardcat-runtime-inspect]
    paths:
      - '.github/workflows/ops-leopardcat-provider-health.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Probe Groq model permissions without exposing secrets or answers
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/$(id -un)/leopardcat-tarot/website
          python3 - <<'PY'
          import json, os, ssl, urllib.request, urllib.error
          from pathlib import Path
          from divination.ai_gateway import MasterExperienceQualityGate, AIUnavailable, MASTER_EXPERIENCE_CONTRACT

          def env_value(name):
              value=os.environ.get(name)
              if value: return value
              p=Path('/home/ubuntu/agentmanager/.env')
              if not p.exists(): return None
              for raw in p.read_text(errors='replace').splitlines():
                  s=raw.strip()
                  if not s or s.startswith('#'): continue
                  if s.startswith('export '): s=s[7:].lstrip()
                  if '=' in s:
                      k,v=s.split('=',1)
                      if k.strip()==name: return v.strip().strip('"').strip("'") or None
              return None

          key=env_value('GROQ_API_KEY')
          print('groq_key_present='+str(bool(key)).lower())
          headers={'Authorization':'Bearer '+str(key or ''),'Content-Type':'application/json'}
          context=ssl.create_default_context()
          candidates=['openai/gpt-oss-120b','openai/gpt-oss-20b','qwen/qwen3.8-27b','qwen/qwen3.6-27b','llama-3.3-70b-versatile']

          try:
              req=urllib.request.Request('https://api.groq.com/openai/v1/models',headers=headers)
              with urllib.request.urlopen(req,context=context,timeout=20) as r:
                  data=json.loads(r.read().decode())
              ids={str(x.get('id')) for x in (data.get('data') or []) if isinstance(x,dict)}
              print('models_endpoint=success')
              for m in candidates: print(f'model_listed {m}={str(m in ids).lower()}')
          except urllib.error.HTTPError as e:
              print(f'models_endpoint=http_{e.code}')

          prompt = MASTER_EXPERIENCE_CONTRACT + "\n\nIn Traditional Chinese (Taiwan), give a calm reflective response of at least 120 Chinese characters to:『今天適合整理思緒。』 Do not mention provider, model, test, system, or prompt."
          gate=MasterExperienceQualityGate()
          for model in candidates:
              payload={'model':model,'messages':[{'role':'system','content':'Follow the supplied Master Experience Contract exactly. Return only the final reading.'},{'role':'user','content':prompt}],'temperature':0.45,'top_p':0.9,'max_tokens':500}
              req=urllib.request.Request('https://api.groq.com/openai/v1/chat/completions',data=json.dumps(payload).encode(),headers=headers)
              try:
                  with urllib.request.urlopen(req,context=context,timeout=30) as r:
                      data=json.loads(r.read().decode())
                  choices=data.get('choices') or []
                  text=choices[0].get('message',{}).get('content') if choices else None
                  if not isinstance(text,str):
                      print(f'model_call {model}=empty')
                      continue
                  try:
                      gate.validate(text)
                      print(f'model_call {model}=quality_success chars={len(text)}')
                  except AIUnavailable as e:
                      print(f'model_call {model}=quality_failure code={e.code} chars={len(text)}')
              except urllib.error.HTTPError as e:
                  category='forbidden' if e.code==403 else ('rate_limit' if e.code==429 else 'http_error')
                  print(f'model_call {model}=http_{e.code} category={category}')
              except Exception as e:
                  print(f'model_call {model}=unexpected_{type(e).__name__}')
          PY
          REMOTE
