name: Oracle Codex Experience Live #117

on:
  push:
    branches:
      - core/issue-117-experience-memory
    paths:
      - '.github/workflows/oracle-codex-experience-live-117.yml'
      - 'agent_core/experience.py'
      - 'agent_core/experience_store.py'
      - 'agentos_node/experience_mcp_stdio.py'
      - 'experience/agentos-core-oracle.seed.json'
      - 'scripts/install_codex_experience_mcp_oracle.py'
      - 'scripts/oracle_codex_experience_regression.py'
      - 'scripts/oracle_codex_experience_regression_entry_v2.py'
      - 'scripts/run_issue_117_codex_experience_oracle.sh'
      - 'scripts/seed_one_experience.py'
      - 'tests/test_experience_memory.py'
      - 'tests/test_experience_store.py'
      - 'tests/test_experience_mcp_stdio.py'
      - 'tests/test_install_codex_experience_mcp_oracle.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oracle-codex-experience-live-117
  cancel-in-progress: false

jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      AGENTOS_REPO_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/issue-117-experience-memory
          fetch-depth: 0

      - name: Validate governed Oracle connection
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST_SOURCE:-}" || { echo 'Missing AGENTOS_DEPLOY_HOST/N8N_BASE_URL'; exit 2; }
          test -n "${DEPLOY_USER:-}" || { echo 'Missing AGENTOS_DEPLOY_USER/N8N_DEPLOY_USER'; exit 2; }
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Run immutable #117 helper as ubuntu boundary
        id: live
        shell: bash
        run: |
          set +e
          ROOT="${AGENTOS_REPO_ROOT:-/home/ubuntu/agentmanager}"
          REMOTE_OUTPUT="/home/ubuntu/agent-data/runtime/issue-117-codex-experience-regression-${GITHUB_RUN_ID}.json"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$ROOT" "$REMOTE_OUTPUT" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          OUTPUT="$2"
          test "$(id -un)" = "ubuntu" || { echo "ERROR: governed Codex regression requires ubuntu executor identity" >&2; exit 2; }
          test -d "$ROOT/.git" || { echo "ERROR: AgentOS checkout missing: $ROOT" >&2; exit 3; }
          export AGENTOS_REPO="$ROOT"
          export AGENTOS_EXPERIENCE_REGRESSION_OUTPUT="$OUTPUT"
          git -C "$ROOT" fetch --no-tags origin core/issue-117-experience-memory
          git -C "$ROOT" show FETCH_HEAD:scripts/run_issue_117_codex_experience_oracle.sh | bash
          REMOTE
          rc=$?
          set -e
          echo "remote_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "remote_output=$REMOTE_OUTPUT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Retrieve sanitized regression evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR=".agentos/evidence/experience/oracle-issue117-codex-live-${GITHUB_RUN_ID}"
          mkdir -p "$OUT_DIR"
          REMOTE_OUTPUT="${{ steps.live.outputs.remote_output }}"
          test -n "$REMOTE_OUTPUT" || REMOTE_OUTPUT="/home/ubuntu/agent-data/runtime/issue-117-codex-experience-regression-${GITHUB_RUN_ID}.json"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cat '$REMOTE_OUTPUT'" > "$OUT_DIR/regression.json"
          python3 - "$OUT_DIR/regression.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          print('schema='+str(p.get('schema')))
          print('experiment_id='+str(p.get('experiment_id')))
          print('verdict='+str(p.get('verdict')))
          print('baseline_score='+str((p.get('baseline') or {}).get('score',{}).get('score')))
          print('hydrated_score='+str((p.get('hydrated') or {}).get('score',{}).get('score')))
          print('uplift='+str(p.get('uplift')))
          print('hydration_receipt_ok='+str((p.get('checks') or {}).get('hydration_receipt_ok')))
          print('credential_exposed='+str(p.get('credential_exposed')))
          PY

      - name: Persist branch-scoped evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR=".agentos/evidence/experience/oracle-issue117-codex-live-${GITHUB_RUN_ID}"
          test -f "$OUT_DIR/regression.json" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT_DIR/regression.json"
          git diff --cached --quiet && exit 0
          git commit -m "evidence(agentos): Codex Experience live regression ${GITHUB_RUN_ID}"
          git fetch origin core/issue-117-experience-memory
          git rebase origin/core/issue-117-experience-memory
          git push origin HEAD:core/issue-117-experience-memory

      - name: Enforce live verdict after evidence persistence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR=".agentos/evidence/experience/oracle-issue117-codex-live-${GITHUB_RUN_ID}"
          test -f "$OUT_DIR/regression.json" || { echo 'No regression evidence retrieved'; exit 4; }
          python3 - "$OUT_DIR/regression.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          if p.get('verdict') != 'PASS':
              raise SystemExit('Codex Experience regression verdict='+str(p.get('verdict')))
          print('agentos_issue117_codex_experience_regression=PASS')
          PY
