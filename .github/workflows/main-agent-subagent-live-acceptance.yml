name: Main Agent Subagent Live Acceptance

on:
  push:
    branches:
      - core/integration
    paths:
      - '.github/workflows/main-agent-subagent-live-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: main-agent-subagent-live-acceptance
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos

    steps:
      - uses: actions/checkout@v4

      - name: Preflight canonical lane
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/core/integration'
          printf '%s' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          bash -n scripts/agentos_dispatch.sh

      - name: Mint GitHub OIDC scheduler credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Wait for live executor-job intents
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 5               -H "Authorization: Bearer $AGENTOS_CONTROLLER_TOKEN"               "$AGENTOS_RUNNER_WINDOW_BASE/v1/dispatch"               > "$RUNNER_TEMP/runner-window-catalog.json"; then
              if python3 - "$RUNNER_TEMP/runner-window-catalog.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=d.get('intents') or d.get('catalog') or []
          pairs={(x.get('capability'),x.get('operation')) for x in rows if isinstance(x,dict)}
          need={('agentos.executor','job.submit'),('agentos.executor','job.inspect')}
          raise SystemExit(0 if need.issubset(pairs) else 1)
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 2
          done
          test "$ready" = 1
          echo "main_agent_executor_intents=PASS"

      - name: Submit bounded #892 engineering Subagent job
        shell: bash
        run: |
          set -euo pipefail
          AGENTOS_DISPATCH_WAIT_SECONDS=180             bash scripts/agentos_dispatch.sh               agentos.executor job.submit "$GITHUB_SHA"               job_type=engineering.windows-thin-client.fix             | tee "$RUNNER_TEMP/subagent-submit.txt"

          grep -q 'runner_window_dispatch=PASS' "$RUNNER_TEMP/subagent-submit.txt"

          python3 - "$RUNNER_TEMP/subagent-submit.txt" "$GITHUB_ENV" <<'PY'
          import json,sys
          docs=[]
          for line in open(sys.argv[1],encoding='utf-8'):
              line=line.strip()
              if line.startswith('{'):
                  docs.append(json.loads(line))
          assert docs, 'missing submit receipt'
          receipt=docs[-1].get('receipt') or {}
          submission=receipt.get('executor_job') or {}
          assert receipt.get('ok') is True, receipt
          assert submission.get('schema')=='agentos.executor-job-submission/v1', submission
          assert submission.get('job_type')=='engineering.windows-thin-client.fix', submission
          assert submission.get('credential_exposed') is False, submission
          job_id=str(submission.get('job_id') or '')
          assert job_id.startswith('action-'), submission
          with open(sys.argv[2],'a',encoding='utf-8') as fh:
              fh.write('AGENTOS_SUBAGENT_JOB_ID='+job_id+'\n')
          print('main_agent_subagent_submit=PASS')
          print('main_agent_subagent_job_id='+job_id)
          PY

      - name: Inspect Subagent receipt until terminal
        shell: bash
        run: |
          set -euo pipefail
          : "${AGENTOS_SUBAGENT_JOB_ID:?missing job id}"
          : > "$RUNNER_TEMP/subagent-inspect-history.jsonl"
          terminal=0

          for i in $(seq 1 45); do
            out="$RUNNER_TEMP/subagent-inspect-$i.txt"
            AGENTOS_DISPATCH_WAIT_SECONDS=120               bash scripts/agentos_dispatch.sh                 agentos.executor job.inspect "$GITHUB_SHA"                 job_id="$AGENTOS_SUBAGENT_JOB_ID"               | tee "$out"

            python3 - "$out" "$RUNNER_TEMP/subagent-inspect-history.jsonl" <<'PY'
          import json,sys
          docs=[]
          for line in open(sys.argv[1],encoding='utf-8'):
              line=line.strip()
              if line.startswith('{'):
                  docs.append(json.loads(line))
          assert docs, 'missing inspect receipt'
          receipt=docs[-1].get('receipt') or {}
          state=str(receipt.get('executor_job_state') or '')
          safe=receipt.get('executor_job_receipt')
          row={'state':state,'receipt':safe}
          with open(sys.argv[2],'a',encoding='utf-8') as fh:
              fh.write(json.dumps(row,separators=(',',':'),sort_keys=True)+'\n')
          if safe is not None:
              assert isinstance(safe,dict), safe
              assert safe.get('credential_exposed') is False, safe
              assert safe.get('job_type')=='engineering.windows-thin-client.fix', safe
              print('terminal=1')
          else:
              print('terminal=0')
          PY

            if grep -q '^terminal=1$' "$out"; then
              terminal=1
              cp "$out" "$RUNNER_TEMP/subagent-final.txt"
              break
            fi
            sleep 10
          done

          test "$terminal" = 1

      - name: Verify bounded terminal receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/subagent-final.txt" <<'PY'
          import json,sys
          docs=[]
          for line in open(sys.argv[1],encoding='utf-8'):
              line=line.strip()
              if line.startswith('{'):
                  docs.append(json.loads(line))
          assert docs
          outer=docs[-1].get('receipt') or {}
          receipt=outer.get('executor_job_receipt') or {}
          assert receipt.get('schema')=='agentos.executor-job-receipt/v1', receipt
          assert receipt.get('job_type')=='engineering.windows-thin-client.fix', receipt
          assert receipt.get('credential_exposed') is False, receipt
          assert receipt.get('executor_class')=='antigravity-engineering', receipt
          # Engineering worker completion is intentionally not global acceptance.
          # Main Agent / #889 still owns verification and closure.
          print('main_agent_subagent_terminal_receipt=PASS')
          print('main_agent_verification_required=YES')
          print('subagent_classification='+str(receipt.get('classification') or 'unknown'))
          print('subagent_successful='+str(bool(receipt.get('successful'))).lower())
          PY

      - name: Upload sanitized Main Agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-agent-subagent-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/subagent-submit.txt
            ${{ runner.temp }}/subagent-inspect-history.jsonl
            ${{ runner.temp }}/subagent-final.txt
          if-no-files-found: warn
          retention-days: 14
