name: Inspect VO10005870 Watchdog Runtime

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/inspect-vo10005870-watchdog-runtime.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect watchdog runtime
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          f=RealmFabricStore()
          tid='inspect-watchdog-runtime-20261002-1525'
          ps=r'''$ErrorActionPreference='Stop'
          $candidates=@(
            (Join-Path $env:USERPROFILE '.agentos\heartbeat-lease.json'),
            (Join-Path $env:LOCALAPPDATA 'AgentOS\heartbeat-lease.json'),
            (Join-Path $env:LOCALAPPDATA 'AgentOS\.agentos\heartbeat-lease.json')
          )
          $leases=@()
          foreach($p in $candidates){
            $leases += [pscustomobject]@{path=$p;exists=(Test-Path $p);content=$(if(Test-Path $p){Get-Content -Raw -LiteralPath $p}else{''})}
          }
          $wd=Get-ScheduledTask -TaskName 'AgentOS Thin Client Watchdog'
          $tc=Get-ScheduledTask -TaskName 'AgentOS Thin Client'
          $wdi=Get-ScheduledTaskInfo -TaskName 'AgentOS Thin Client Watchdog'
          $tci=Get-ScheduledTaskInfo -TaskName 'AgentOS Thin Client'
          [pscustomobject]@{
            leases=$leases;
            watchdog=[pscustomobject]@{
              state=[string]$wd.State;
              execute=[string]$wd.Actions.Execute;
              arguments=[string]$wd.Actions.Arguments;
              lastRun=$wdi.LastRunTime;
              lastResult=$wdi.LastTaskResult;
              nextRun=$wdi.NextRunTime
            };
            thin_client=[pscustomobject]@{
              state=[string]$tc.State;
              execute=[string]$tc.Actions.Execute;
              arguments=[string]$tc.Actions.Arguments;
              lastRun=$tci.LastRunTime;
              lastResult=$tci.LastTaskResult;
              nextRun=$tci.NextRunTime
            }
          } | ConvertTo-Json -Depth 6 -Compress'''
          if f.get_receipt(tid) is None:
              f.queue_task('VO10005870',{
                  'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec',
                  'executable':'powershell','argv':['-NoProfile','-NonInteractive','-Command',ps],
                  'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':20,
                  'cognition_ids_used':['demo://watchdog-debug/20261002'],
              })
          for _ in range(30):
              r=f.get_receipt(tid)
              if r is not None:
                  print(json.dumps(r,ensure_ascii=False,separators=(',',':')))
                  assert r.get('ok') is True and int(r.get('returncode') or 0)==0, r
                  break
              time.sleep(1)
          else:
              raise SystemExit('watchdog_runtime_receipt_missing')
          PY
          REMOTE
