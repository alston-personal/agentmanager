name: Diagnostic 1682 Realm Resolve Compatibility
on:
  pull_request:
    paths:
      - 'tests/test_realm_resolve_endpoint.py'
      - 'tests/test_realm_resolve_endpoint_extended.py'
      - '.github/workflows/diagnostic-1682-realm-resolve.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v tests.test_realm_resolve_endpoint tests.test_realm_resolve_endpoint_extended
