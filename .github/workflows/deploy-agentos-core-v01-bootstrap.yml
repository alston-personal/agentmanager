name: Bootstrap AgentOS Core v0.1 Native Path

on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths:
      - '.agentos/development-context.json'
      - 'agentos_client/**'
      - 'agent_core/canonical_context.py'
      - 'agent_core/context_compiler.py'
      - 'agent_core/distributed_control_plane.py'
      - 'agent_core/distributed_gateway.py'
      - 'agentos_node/remote_worker.py'
      - 'scripts/agentos_node_daemon.py'
      - 'scripts/install_distributed_systemd_user.sh'
      - 'tests/test_agentos_core_v01.py'
      - 'tests/test_canonical_context_reconciliation.py'
      - '.github/workflows/deploy-agentos-core-v01-bootstrap.yml'

permissions:
  contents: read

jobs:
  deploy-native-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      CONFIG_ROOT: ${{ vars.AGENTOS_CONFIG_ROOT || '/home/ubuntu/agentmanager' }}
      RELEASE_ROOT: ${{ vars.AGENTOS_DISTRIBUTED_DEPLOY_ROOT || '/home/ubuntu/agentos-distributed' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Source contract
        run: |
          python -m pip install pytest >/dev/null
          python -m pytest -q tests/test_agentos_core_v01.py tests/test_canonical_context_reconciliation.py
          python -m py_compile agentos_client/*.py agent_core/canonical_context.py agent_core/context_compiler.py agent_core/distributed_control_plane.py agent_core/distributed_gateway.py agentos_node/remote_worker.py scripts/agentos_node_daemon.py
          bash -n scripts/install_distributed_systemd_user.sh
      - name: Resolve Oracle target
        run: |
          host="${DEPLOY_HOST_SOURCE#*://}"; host="${host%%/*}"; host="${host%%:*}"
          echo "DEPLOY_HOST=$host" >> "$GITHUB_ENV"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Deploy and prove native continuity plus reconciliation
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$CONFIG_ROOT" "$RELEASE_ROOT" <<'REMOTE'
          set -euo pipefail
          CONFIG_ROOT="$1"; RELEASE_ROOT="$2"
          REPO=https://github.com/alston-personal/agentmanager.git
          if [ ! -d "$RELEASE_ROOT/.git" ]; then git clone "$REPO" "$RELEASE_ROOT"; fi
          git -C "$RELEASE_ROOT" fetch origin feature/distributed-agentos-runtime
          SHA=$(git -C "$RELEASE_ROOT" rev-parse FETCH_HEAD)
          git -C "$RELEASE_ROOT" checkout --detach "$SHA"
          cd "$RELEASE_ROOT"
          PYTHONPATH=. python3 -m pytest -q tests/test_agentos_core_v01.py tests/test_canonical_context_reconciliation.py
          PYTHONPATH=. python3 -m py_compile agentos_client/*.py agent_core/canonical_context.py agent_core/context_compiler.py agent_core/distributed_control_plane.py agent_core/distributed_gateway.py agentos_node/remote_worker.py scripts/agentos_node_daemon.py

          set -a
          source "$CONFIG_ROOT/.env"
          [ -f "$HOME/.config/agentos/distributed.env" ] && source "$HOME/.config/agentos/distributed.env"
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          export AGENTOS_DISTRIBUTED_SERVICES_ENABLED=1
          export AGENTOS_DISTRIBUTED_PYTHON="$(command -v python3)"
          AGENTOS_CONFIG_ROOT="$CONFIG_ROOT" bash scripts/install_distributed_systemd_user.sh

          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/health >/tmp/core-health.json 2>/dev/null && break; sleep 1; done
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/core-health.json'))
          assert d['status']=='ok' and d['protocol']=='agentos.core/v0.1'
          print('core_health=passed')
          PY
          systemctl --user is-active --quiet agentos-control-plane.service
          systemctl --user is-active --quiet agentos-node.service

          TOKEN="$AGENTOS_CONTROL_PLANE_TOKEN"
          BASE=http://127.0.0.1:8765
          AUTH="Authorization: Bearer $TOKEN"

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -d '{"project_id":"core-v01-proof","agent":{"type":"github-bootstrap","model":"none"}}' "$BASE/v1/attach" >/tmp/a1.json
          SESSION=$(python3 -c "import json; print(json.load(open('/tmp/a1.json'))['session_id'])")
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -d "{\"project_id\":\"core-v01-proof\",\"goal\":\"prove native execution\",\"capability\":\"agentos.ir.validate\",\"payload\":{\"source\":\"native\"},\"session_id\":\"$SESSION\"}" "$BASE/v1/tasks" >/tmp/task.json
          TASK=$(python3 -c "import json; print(json.load(open('/tmp/task.json'))['task']['taskId'])")
          for _ in $(seq 1 30); do curl -fsS -H "$AUTH" "$BASE/v1/receipts/$TASK" >/tmp/receipt.json; terminal=$(python3 -c "import json; print(str(json.load(open('/tmp/receipt.json'))['terminal']).lower())"); [ "$terminal" = true ] && break; sleep 1; done
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/receipt.json'))
          assert r['terminal'] is True and r['status']=='succeeded', r
          assert r['executor']=='oracle-core-node' and r['evidence']['validated'] is True
          print('native_task_receipt=passed')
          PY

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -d '{"project_id":"core-v01-proof","agent":{"type":"new-session"}}' "$BASE/v1/attach" >/tmp/a2.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/a2.json'))
          assert a['state']['latestTask'] is not None and a['state']['recommendedAction']=='continue'
          assert a['execution_context']['latest_task']['taskId']==a['state']['latestTask']['taskId']
          assert a['execution_context']['recommended_action']=='continue'
          print('cross_session_attach=passed')
          print('cross_session_execution_context=passed')
          PY

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -d '{"project_id":"agentmanager","agent":{"type":"blind-fresh-session","history":"none"}}' "$BASE/v1/attach" >/tmp/blind-attach.json
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/blind-attach.json'))['execution_context']
          assert c['schema']=='agentos.execution-context/v0.1' and c['active_goal'] and c['current_findings'] and c['next_actions']
          assert c['next_action']==c['next_actions'][0]
          assert c['integration_branch']=='feature/distributed-agentos-runtime'
          assert c['write_policy']['branch_required_for_writes'] is True
          assert c['agent']['history']=='none'
          assert c['runtime_context'] and c['runtime_context']['revision'] >= 1
          print('blind_fresh_session_context=passed')
          print('blind_runtime_context_revision='+str(c['runtime_context']['revision']))
          print('blind_active_goal='+c['active_goal'])
          print('blind_next_action='+c['next_action'])
          PY

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -d '{"project_id":"agentos-core","agent":{"type":"native-test-proof"}}' "$BASE/v1/attach" >/tmp/test-attach.json
          TSESSION=$(python3 -c "import json; print(json.load(open('/tmp/test-attach.json'))['session_id'])")
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -d "{\"project_id\":\"agentos-core\",\"goal\":\"run allowlisted Core v0.1 tests natively\",\"capability\":\"agentos.project.test\",\"payload\":{\"profile\":\"core-v01\",\"argv\":[\"false\"]},\"session_id\":\"$TSESSION\"}" "$BASE/v1/tasks" >/tmp/native-test-task.json
          NTEST=$(python3 -c "import json; print(json.load(open('/tmp/native-test-task.json'))['task']['taskId'])")
          for _ in $(seq 1 90); do curl -fsS -H "$AUTH" "$BASE/v1/receipts/$NTEST" >/tmp/native-test-receipt.json; terminal=$(python3 -c "import json; print(str(json.load(open('/tmp/native-test-receipt.json'))['terminal']).lower())"); [ "$terminal" = true ] && break; sleep 1; done
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/native-test-receipt.json'))
          assert r['terminal'] is True and r['status']=='succeeded', r
          assert r['executor']=='oracle-core-node', r
          e=r['evidence']
          assert e['project_id']=='agentos-core' and e['profile']=='core-v01' and e['passed'] is True and e['returncode']==0, e
          print('native_project_test=passed')
          print('native_project_test_executor='+r['executor'])
          PY

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -d '{"project_id":"leopardcat-tarot","agent":{"type":"native-inspection-proof"}}' "$BASE/v1/attach" >/tmp/leopard-attach.json
          LSESSION=$(python3 -c "import json; print(json.load(open('/tmp/leopard-attach.json'))['session_id'])")
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -d "{\"project_id\":\"leopardcat-tarot\",\"goal\":\"inspect live repository without GitHub Actions executor\",\"capability\":\"agentos.project.inspect\",\"payload\":{},\"session_id\":\"$LSESSION\"}" "$BASE/v1/tasks" >/tmp/inspect-task.json
          ITASK=$(python3 -c "import json; print(json.load(open('/tmp/inspect-task.json'))['task']['taskId'])")
          for _ in $(seq 1 30); do curl -fsS -H "$AUTH" "$BASE/v1/receipts/$ITASK" >/tmp/inspect-receipt.json; terminal=$(python3 -c "import json; print(str(json.load(open('/tmp/inspect-receipt.json'))['terminal']).lower())"); [ "$terminal" = true ] && break; sleep 1; done
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/inspect-receipt.json'))
          assert r['terminal'] is True and r['status']=='succeeded', r
          assert r['executor']=='oracle-core-node'
          result=r['evidence']
          assert result['project_id']=='leopardcat-tarot' and len(result['head'])==40
          print('native_project_inspect=passed')
          print('native_project_head='+result['head'])
          PY
          echo "native_core_sha=$SHA"
          REMOTE
