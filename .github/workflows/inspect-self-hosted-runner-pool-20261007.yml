name: Inspect Self Hosted Runner Pool 20261007

on:
  push:
    branches:
      - ops/live-windows-node-inspection-20261007
    paths:
      - '.github/workflows/inspect-self-hosted-runner-pool-20261007.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect runner inventory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/$GH_REPO/actions/runners?per_page=100"             | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps([{"id":r.get("id"),"name":r.get("name"),"status":r.get("status"),"busy":r.get("busy"),"labels":[x.get("name") for x in r.get("labels",[])]} for r in d.get("runners",[])],indent=2))'
