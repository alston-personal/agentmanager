name: Mio Image Manifest Gate CI

on:
  pull_request:
    paths:
      - 'scripts/validate_mio_image_manifest.py'
      - 'tests/test_validate_mio_image_manifest.py'
      - '.github/workflows/mio-image-manifest-gate-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Manifest gate unit tests
        run: python -m unittest discover -s tests -p 'test_validate_mio_image_manifest.py' -v
