name: Browser Divination OS v1 Production
on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths: ['.github/workflows/browser-divination-v1-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Public production browser smoke
        shell: bash
        run: |
          cat > divination-v1-production.mjs <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const base='https://leopardcat-tarot.milkcat.org';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:900}});

          await page.goto(base+'/read.html?deck=leopardcat',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>document.getElementById('persona-select')?.value==='leopardcat');
          const identity=await page.evaluate(()=>({
            brand:document.getElementById('brand-link')?.textContent||'',
            title:document.title,
            bg:getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(),
            paper:getComputedStyle(document.documentElement).getPropertyValue('--paper').trim(),
            back:document.getElementById('back-to-deck')?.textContent||''
          }));
          assert.doesNotMatch(identity.brand,/Divination OS/i);
          assert.match(identity.brand,/靈山|石虎/);
          assert.match(identity.title,/詢問大師/);
          assert.equal(identity.bg.toLowerCase(),'#030504');
          assert.equal(identity.paper.toLowerCase(),'#111714');
          assert.match(identity.back,/石虎塔羅/);
          console.log('production_brand_theme_continuity=passed');

          let readingCalls=0;
          let followupPayload=null;
          await page.route('**/api/v1/readings',async route=>{
            readingCalls++;
            const body=JSON.parse(route.request().postData()||'{}');
            if(readingCalls===1){
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({
                reading_id:'rd_prod_ux',session_token:'prod-ux-token',expires_at:9999999999,
                method:'tarot',persona:'leopardcat',lang:'zh-TW',
                method_result:{method:'tarot',spread:'single',deck:{deck_id:'leopardcat',name:'靈山靈貓・石虎塔羅'},cards:[{card_id:'card-cu-08-eight-of-cups',orientation:'upright',position:'focus',position_label:'核心',image:'/art/renders/card-cu-08-eight-of-cups.webp',title:{zh:'聖杯八',en:'Eight of Cups'}}]},
                reading:"旅人，這張牌邀請你離開已不再滋養你的道路。\n\n<div class='hidden-quote' style='display:none'>離開不是失去，而是為新的山徑留出空間。</div>",
                capsule:{schema:'divination-reading/1',method:'tarot',result:{method:'tarot',spread:'single',cards:[{card_id:'card-cu-08-eight-of-cups',orientation:'upright'}]},contract:{redraw_forbidden:true}},
                handoff:{capsule:{schema:'divination-reading/1'},generic_prompt:'prompt',providers:[{id:'chatgpt',name:'ChatGPT',url:'https://chatgpt.com',prompt:'p'},{id:'claude',name:'Claude',url:'https://claude.ai',prompt:'p'},{id:'gemini',name:'Gemini',url:'https://gemini.google.com',prompt:'p'}]}
              })});
            }else{
              followupPayload=body;
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({
                reading_id:'rd_prod_ux',session_token:'prod-ux-token',method:'tarot',persona:'leopardcat',
                method_result:{method:'tarot',spread:'single',cards:[{card_id:'card-cu-08-eight-of-cups',orientation:'upright'}]},
                reading:"同一張牌下，大師的回答會延續原本的脈絡。<div class='hidden-quote' style='display:none'>同一山徑，可以從不同角度看見方向。</div>"
              })});
            }
          });

          await page.locator('#question').fill('我是不是該離開現在的方向？');
          await page.locator('#draw').click();
          await page.waitForFunction(()=>!document.getElementById('result').classList.contains('hidden'));
          const visibleReading=await page.locator('#reading').innerText();
          const readingHtml=await page.locator('#reading').innerHTML();
          assert.doesNotMatch(visibleReading,/<div|hidden-quote|display:none/i);
          assert.doesNotMatch(readingHtml,/hidden-quote/);
          assert.match(await page.locator('#reading .golden-quote').innerText(),/離開不是失去/);
          assert.ok(await page.locator('#followup').isVisible());
          assert.equal(await page.locator('#handoff-details').getAttribute('open'),null);
          assert.match(await page.locator('#handoff-details > summary').innerText(),/備援|進階/);
          console.log('production_hidden_html_sanitized=passed');
          console.log('production_external_ai_is_backup=passed');

          await page.locator('#followup-input').fill('那我現在最該先做什麼？');
          await page.locator('#followup-send').click();
          await page.waitForFunction(()=>document.querySelectorAll('#followup-history .assistant').length===1);
          assert.equal(followupPayload.readingId,'rd_prod_ux');
          assert.equal(followupPayload.sessionToken,'prod-ux-token');
          assert.equal(followupPayload.question,'那我現在最該先做什麼？');
          assert.ok(!followupPayload.input,'follow-up must not request a redraw');
          const followupText=await page.locator('#followup-history .assistant').innerText();
          assert.doesNotMatch(followupText,/<div|hidden-quote|display:none/i);
          assert.match(followupText,/同一張牌/);
          console.log('production_in_site_followup_same_reading=passed');

          const mobile=await browser.newPage({viewport:{width:375,height:812}});
          await mobile.goto(base+'/read.html?deck=leopardcat',{waitUntil:'networkidle'});
          const overflow=await mobile.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
          assert.ok(overflow<=1,`horizontal overflow ${overflow}px`);
          console.log('production_mobile_layout=passed');

          await browser.close();
          NODE
          node divination-v1-production.mjs
