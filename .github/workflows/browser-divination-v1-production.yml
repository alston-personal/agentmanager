name: Browser Divination OS v1 Production
on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths: ['.github/workflows/browser-divination-v1-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Public production browser smoke
        shell: bash
        run: |
          cat > divination-v1-production.mjs <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const base='https://leopardcat-tarot.milkcat.org';
          const methodsResp=await fetch(base+'/api/v1/methods');
          assert.equal(methodsResp.status,200);
          const catalog=await methodsResp.json();
          const methods=Object.fromEntries(catalog.methods.map(x=>[x.method_id,x]));
          assert.ok(methods.tarot && methods.lenormand);
          assert.ok(methods.lenormand.spreads.some(x=>x.id==='box9' && x.card_count===9));
          console.log('production_public_methods=passed');

          // Isolate public reverse-proxy POST behavior before involving browser UI.
          const directStarted=Date.now();
          const directResp=await fetch(base+'/api/v1/readings',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({method:'lenormand',persona:'master',question:'Production direct HTTPS smoke',lang:'zh-TW',seed:'production-public-direct',input:{spread:'three'}}),
            signal:AbortSignal.timeout(90000)
          });
          const directText=await directResp.text();
          console.log(`production_direct_post_status=${directResp.status}`);
          console.log(`production_direct_post_ms=${Date.now()-directStarted}`);
          console.log(`production_direct_post_content_type=${directResp.headers.get('content-type')||''}`);
          let directData={};
          try{ directData=JSON.parse(directText); }catch(_){ console.log('production_direct_post_body_prefix='+directText.slice(0,180).replace(/\s+/g,' ')); }
          assert.ok([200,503].includes(directResp.status),`public direct POST status ${directResp.status}`);
          assert.equal(directData.method_result?.method,'lenormand');
          assert.equal(directData.capsule?.schema,'divination-reading/1');
          console.log('production_public_direct_post=passed');

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          page.on('console',msg=>console.log('browser_console['+msg.type()+']='+msg.text()));
          page.on('pageerror',err=>console.log('browser_pageerror='+err.message));
          page.on('requestfailed',req=>console.log('browser_requestfailed='+req.url()+' '+(req.failure()?.errorText||'')));

          await page.goto(base+'/read.html?deck=leopardcat',{waitUntil:'networkidle'});
          assert.equal(await page.locator('[data-method="tarot"]').getAttribute('class'),'active');
          await page.waitForFunction(()=>document.getElementById('persona-select')?.value==='leopardcat');
          assert.equal(await page.locator('#persona-select').inputValue(),'leopardcat');
          console.log('production_browser_tarot_default_persona=passed');

          await page.locator('[data-method="lenormand"]').click();
          await page.waitForSelector('[data-spread="box9"]');
          await page.waitForFunction(()=>document.getElementById('persona-select')?.value==='master');
          assert.equal(await page.locator('#persona-select').inputValue(),'master');
          await page.locator('[data-spread="box9"]').click();
          await page.locator('#question').fill('Production browser smoke：接下來應注意什麼？');

          const responsePromise=page.waitForResponse(r=>r.url().endsWith('/api/v1/readings'),{timeout:90000});
          const browserStarted=Date.now();
          await page.locator('#draw').click();
          const readingResp=await responsePromise;
          console.log(`production_browser_post_status=${readingResp.status()}`);
          console.log(`production_browser_post_ms=${Date.now()-browserStarted}`);
          const browserBody=await readingResp.text().catch(()=> '');
          console.log(`production_browser_post_content_type=${readingResp.headers()['content-type']||''}`);
          if(![200,503].includes(readingResp.status())) console.log('production_browser_post_body_prefix='+browserBody.slice(0,180).replace(/\s+/g,' '));
          await page.waitForTimeout(1000);
          const uiState=await page.evaluate(()=>({
            resultHidden:document.getElementById('result')?.classList.contains('hidden'),
            status:document.getElementById('status')?.textContent||'',
            cards:document.querySelectorAll('#cards .draw-card').length,
            fallbackHidden:document.getElementById('ai-fallback')?.classList.contains('hidden')
          }));
          console.log('production_browser_ui_state='+JSON.stringify(uiState));

          assert.ok([200,503].includes(readingResp.status()),`browser POST status ${readingResp.status()}`);
          assert.equal(uiState.resultHidden,false,'result should be visible after legal 200/503 response');
          assert.equal(uiState.cards,9);
          assert.ok(await page.locator('#structure').isVisible());
          assert.match(await page.locator('#structure').innerText(),/中心牌|相鄰組合/);
          assert.ok(await page.locator('#handoff').isVisible());
          assert.equal(await page.locator('#provider-actions .provider-btn').count(),3);
          const capsule=JSON.parse((await page.locator('#capsule-json').textContent())||'{}');
          assert.equal(capsule.schema,'divination-reading/1');
          assert.equal(capsule.method,'lenormand');
          assert.equal(capsule.result.spread,'box9');
          assert.equal(capsule.result.cards.length,9);
          assert.equal(new Set(capsule.result.cards.map(x=>x.card_id)).size,9);
          assert.equal(capsule.contract.redraw_forbidden,true);
          if(readingResp.status()===503){
            assert.ok(await page.locator('#ai-fallback').isVisible());
            assert.match(await page.locator('#reading').innerText(),/自己的 AI|Reading Capsule|抽牌完成/);
            console.log('production_browser_ai_state=zero_cost_fallback');
          }else{
            assert.ok((await page.locator('#reading').innerText()).trim().length>20);
            console.log('production_browser_ai_state=available');
          }
          console.log('production_browser_lenormand_box9=passed');
          console.log('production_browser_capsule_handoff=passed');

          const root=await browser.newPage({viewport:{width:1280,height:900}});
          await root.goto(base+'/?deck=leopardcat',{waitUntil:'domcontentloaded'});
          const primary=root.locator('[data-primary-reading]').first();
          assert.match(await primary.getAttribute('href'),/\/read\.html/);
          console.log('production_browser_progressive_entry=passed');

          const mobile=await browser.newPage({viewport:{width:375,height:812}});
          await mobile.goto(base+'/read.html?method=lenormand',{waitUntil:'networkidle'});
          assert.ok(await mobile.locator('#question').isVisible());
          assert.ok(await mobile.locator('#draw').isVisible());
          const overflow=await mobile.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
          assert.ok(overflow<=1,`horizontal overflow ${overflow}px`);
          console.log('production_browser_mobile_layout=passed');

          await browser.close();
          NODE
          node divination-v1-production.mjs
