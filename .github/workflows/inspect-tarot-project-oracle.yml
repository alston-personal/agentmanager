name: Inspect Tarot Project On Oracle

on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths:
      - ".github/workflows/inspect-tarot-project-oracle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-tarot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      PROJECT_ROOT: /home/ubuntu/agentmanager/workspace/leopardcat-tarot

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/distributed-agentos-runtime

      - name: Resolve Oracle target
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Inspect actual LeopardCat Tarot project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/oracle-inspection
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$PROJECT_ROOT" > artifacts/oracle-inspection/leopardcat-tarot.txt <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          echo '=== HOST ==='
          hostname
          echo "root=$ROOT"
          echo "exists=$(test -d "$ROOT" && echo yes || echo no)"
          test -d "$ROOT"

          echo '=== GIT ==='
          git -C "$ROOT" remote -v 2>/dev/null || true
          git -C "$ROOT" branch --show-current 2>/dev/null || true
          git -C "$ROOT" log -1 --oneline 2>/dev/null || true

          echo '=== TOP LEVEL ==='
          find "$ROOT" -maxdepth 2 -mindepth 1 -printf '%P\n' 2>/dev/null | sort | head -n 300

          echo '=== DIVINATION / READING / REVERSAL REFERENCES ==='
          grep -RInE --exclude-dir=.git --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.webp' \
            'divination|reading|spread|shuffle|draw|upright|revers|正位|逆位|占卜|抽牌|牌陣|clarif|orientation|telegram|line bot|webhook|FastAPI|Flask|Express' \
            "$ROOT" 2>/dev/null | head -n 800 || true

          echo '=== LIKELY ENGINE / SERVICE FILES ==='
          find "$ROOT" -maxdepth 5 -type f \
            \( -iname '*divin*' -o -iname '*read*' -o -iname '*tarot*' -o -iname '*spread*' -o -iname '*bot*' -o -iname '*api*' -o -iname '*service*' \) \
            -printf '%P\n' 2>/dev/null | sort | head -n 400

          echo '=== PACKAGE / PYTHON MANIFESTS ==='
          for f in package.json pyproject.toml requirements.txt README.md; do
            if [ -f "$ROOT/$f" ]; then
              echo "--- $f ---"
              sed -n '1,220p' "$ROOT/$f"
            fi
          done
          REMOTE

      - name: Commit inspection receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/oracle-inspection/leopardcat-tarot.txt
          if git diff --cached --quiet; then
            echo 'inspection_receipt=unchanged'
          else
            git commit -m 'chore(agentos): record Oracle LeopardCat Tarot inspection'
            git push origin HEAD:feature/distributed-agentos-runtime
          fi
