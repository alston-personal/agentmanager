name: Inspect Tarot Project On Oracle

on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths:
      - ".github/workflows/inspect-tarot-project-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-tarot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}

    steps:
      - name: Resolve Oracle target
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Locate tarot project and inspect candidate structure
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== host ==='
          hostname
          echo '=== candidate paths ==='
          find "$HOME" /opt /srv /var/www -maxdepth 6 \
            \( -iname '*tarot*' -o -iname '*石虎*' -o -iname '*leopard*' \) \
            -print 2>/dev/null | head -n 200

          echo '=== likely project roots ==='
          find "$HOME" /opt /srv /var/www -maxdepth 6 -type f \
            \( -name 'package.json' -o -name 'pyproject.toml' -o -name 'requirements.txt' -o -name 'docker-compose.yml' -o -name 'compose.yml' -o -name 'README.md' \) \
            -print 2>/dev/null | grep -Ei 'tarot|石虎|leopard' | head -n 200 || true

          echo '=== textual references ==='
          grep -RIlE '石虎.{0,20}塔羅|塔羅.{0,20}石虎|tarot' "$HOME"/projects "$HOME"/workspace "$HOME"/agent-data "$HOME"/agentmanager 2>/dev/null | head -n 200 || true
          REMOTE
