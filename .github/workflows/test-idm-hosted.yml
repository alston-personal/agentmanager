name: Test IDM VTON Hosted

on:
  push:
    branches: [ops/test-idm-hosted]
    paths:
      - '.github/workflows/test-idm-hosted.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install client
        run: python -m pip install --quiet "gradio_client>=1.13,<3"
      - name: Call public IDM VTON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, tempfile, os
          from pathlib import Path
          from gradio_client import Client, handle_file

          def dl(url, suffix):
              req=urllib.request.Request(url,headers={"User-Agent":"AgentOS-IDM-Test/1.0"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  data=r.read()
                  print("download",url,"bytes",len(data),"type",r.headers.get("Content-Type"))
              fd,name=tempfile.mkstemp(suffix=suffix); os.close(fd)
              Path(name).write_bytes(data)
              return name

          person=dl("https://studio.milkcat.org/personas/mio/mio-avatar.webp",".webp")
          garment=dl("https://net.wimg.tw/files/1/products/735109_color_002E799BDE889B2.jpg?v=32570",".jpg")
          spaces=["ChrisJohnson111/IDM-VTON","Nymbo/IDM-VTON","pngwn/IDM-VTON"]
          for space in spaces:
              try:
                  print("SPACE",space)
                  c=Client(space, download_files=True, verbose=False, httpx_kwargs={"timeout":300.0})
                  try:
                      print("API",c.view_api(return_format="dict"))
                  except Exception as e:
                      print("VIEW_API_ERR",type(e).__name__,str(e))
                  result=c.predict(
                      dict={
                          "background": handle_file(person),
                          "layers": [],
                          "composite": None,
                      },
                      handle_file(garment),
                      "white short sleeve round neck top",
                      True,
                      False,
                      30,
                      42,
                      api_name="/tryon",
                  )
                  print("OUTPUT",result)
                  candidate=result[0] if isinstance(result,(list,tuple)) and result else result
                  if isinstance(candidate,dict):
                      candidate=candidate.get("path") or candidate.get("url")
                  p=Path(candidate) if isinstance(candidate,str) else None
                  print("CANDIDATE",candidate,"EXISTS",bool(p and p.exists()),"SIZE",(p.stat().st_size if p and p.exists() else None))
                  if p and p.exists() and p.stat().st_size>1000:
                      print("IDM_HOSTED=PASS space="+space)
                      raise SystemExit(0)
              except Exception as e:
                  print("ERR",space,type(e).__name__,str(e))
          raise SystemExit(1)
          PY
