name: Live Runner Window Catalog Probe

on:
  pull_request:
    branches: [core/integration]
    paths:
      - '.github/workflows/live-runner-window-catalog-probe.yml'
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/live-runner-window-catalog-probe.yml'

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -Fq 'live_runner_window_catalog_probe=PASS' .github/workflows/live-runner-window-catalog-probe.yml

  probe:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Mint scheduler credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Read live Runner Window catalog
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20             -H "Authorization: Bearer $TOKEN"             https://studio.milkcat.org/dashboard/api/agentos/v1/dispatch > "$RUNNER_TEMP/catalog.json"
          python3 - "$RUNNER_TEMP/catalog.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=d.get('intents') or d.get('catalog') or []
          print(json.dumps(rows,indent=2,ensure_ascii=False))
          print('intent_count='+str(len(rows)))
          print('live_runner_window_catalog_probe=PASS')
          PY
