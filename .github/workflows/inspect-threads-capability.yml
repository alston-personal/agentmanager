name: Inspect AgentOS Threads Capability
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-threads-capability.yml'
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    steps:
      - uses: actions/checkout@v4
      - name: Export AgentOS Threads module contract
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/threads-module-contract.txt"
          {
            echo '=== agent_core/employee_threads.py ==='
            sed -n '1,320p' /home/ubuntu/agentmanager/agent_core/employee_threads.py
            echo '=== tests/test_employee_threads.py ==='
            sed -n '1,360p' /home/ubuntu/agentmanager/tests/test_employee_threads.py
            echo '=== related runtime invocation matches ==='
            grep -RniE --exclude-dir=.git --exclude='*.sqlite*' 'employee_threads|ThreadsEmployee|threads.*fetch|fetch.*threads' /home/ubuntu/agentmanager/agent_core /home/ubuntu/agentmanager/tests /home/ubuntu/agentmanager/*.py 2>/dev/null | head -240 || true
          } | tee "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: threads-module-contract
          path: ${{ runner.temp }}/threads-module-contract.txt
          retention-days: 1
