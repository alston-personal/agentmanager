name: Inspect AgentOS Threads Capability
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-threads-capability.yml'
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    steps:
      - uses: actions/checkout@v4
      - name: Trace social Threads ingestion producer
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/social-threads-module-contract.txt"
          {
            echo '=== known vendor reputation artifacts ==='
            ls -lah /home/ubuntu/agent-data/runtime/vendor-reputation/threads-* 2>/dev/null | head -80 || true
            echo '=== producer references by exact artifact stem ==='
            grep -RniE --exclude-dir=.git --exclude='*.sqlite*' 'vendor-reputation|normalized-replies|visible-text|rendered-text|reply-blocks|public-evidence' /home/ubuntu/agentmanager /home/ubuntu/agent-data 2>/dev/null | head -500 || true
            echo '=== social Threads URL/code references excluding employee_threads ==='
            grep -RniE --exclude-dir=.git --exclude='employee_threads.py' --exclude='test_employee_threads.py' --exclude='*.sqlite*' 'threads\.com|threads\.net|www\.threads|Threads API|THREADS_' /home/ubuntu/agentmanager /home/ubuntu/agent-data 2>/dev/null | head -500 || true
            echo '=== likely scripts/modules ==='
            find /home/ubuntu/agentmanager /home/ubuntu/agent-data -type f \( -iname '*thread*' -o -iname '*vendor*reput*' -o -iname '*social*' \) 2>/dev/null | grep -vE '/node_modules/|/\.git/' | head -300 || true
          } | tee "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: social-threads-module-contract
          path: ${{ runner.temp }}/social-threads-module-contract.txt
          retention-days: 1
