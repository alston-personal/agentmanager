name: Inspect AgentOS Threads Capability
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-threads-capability.yml'
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    steps:
      - uses: actions/checkout@v4
      - name: Inspect known Threads evidence provenance
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/social-threads-provenance.txt"
          ROOT=/home/ubuntu/agent-data/runtime/vendor-reputation
          {
            for f in \
              "$ROOT/threads-DcWVvpwGTSh-public-evidence.json" \
              "$ROOT/threads-DcWVvpwGTSh-visible-text.json" \
              "$ROOT/threads-DcWVvpwGTSh-rendered-text.json" \
              "$ROOT/threads-DcWVvpwGTSh-normalized-replies.json"; do
              echo "=== $f ==="
              if [ -f "$f" ]; then sed -n '1,260p' "$f"; else echo missing; fi
            done
            echo '=== nearby scripts modified around artifacts ==='
            find /home/ubuntu/agent-data/runtime -maxdepth 5 -type f \( -name '*.py' -o -name '*.js' -o -name '*.mjs' -o -name '*.sh' -o -name '*.json' \) -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -250
          } | tee "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: social-threads-provenance
          path: ${{ runner.temp }}/social-threads-provenance.txt
          retention-days: 1
