name: Oracle Provision WoW 2297 Repositories via Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-provision-wow-2297-repos
  cancel-in-progress: false

jobs:
  provision:
    if: github.actor == 'alstonhuang'
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Submit approved fixed repository action to existing ubuntu Bootstrap
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/agentos-bootstrap-control
          REQUESTS="$ROOT/requests"
          RECEIPTS="$ROOT/receipts"
          REQUEST_ID="wow-2297-repos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REQUEST="$REQUESTS/$REQUEST_ID.request.json"
          RECEIPT="$RECEIPTS/$REQUEST_ID.json"
          SOURCE_COMMIT="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$SOURCE_COMMIT" || { echo 'error=main_advanced_after_dispatch' >&2; exit 2; }
          for i in $(seq 1 40); do [ -d "$REQUESTS" ] && [ -d "$RECEIPTS" ] && break; sleep 1; done
          test -d "$REQUESTS"; test -d "$RECEIPTS"
          python3 - "$REQUEST" "$REQUEST_ID" "$SOURCE_COMMIT" <<'PY'
          import json,os,sys
          from datetime import datetime,timezone
          from pathlib import Path
          path=Path(sys.argv[1])
          request_id=sys.argv[2]
          sha=sys.argv[3]
          payload={
              "schema":"agentos.bootstrap-request/v1",
              "request_id":request_id,
              "action":"agentos.repository.provision_wow_2297_repos",
              "created_at":datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z"),
              "params":{"source_commit":sha},
              "authority":{"source":"github-actions","target_user":"ubuntu","arbitrary_shell":False},
          }
          temp=path.with_suffix(path.suffix+".tmp")
          temp.write_text(json.dumps(payload,sort_keys=True)+"\n",encoding="utf-8")
          os.chmod(temp,0o644)
          temp.replace(path)
          os.chmod(path,0o644)
          PY
          for i in $(seq 1 120); do [ -f "$RECEIPT" ] && break; sleep 1; done
          test -f "$RECEIPT" || { echo 'wow_repo_receipt=TIMEOUT' >&2; exit 3; }
          python3 - "$RECEIPT" "$SOURCE_COMMIT" <<'PY'
          import json,re,sys
          receipt=json.load(open(sys.argv[1],encoding="utf-8"))
          sha=sys.argv[2]
          assert receipt.get("schema")=="agentos.bootstrap-receipt/v1"
          assert receipt.get("action")=="agentos.repository.provision_wow_2297_repos"
          assert receipt.get("source_commit")==sha
          assert receipt.get("executor_user")=="ubuntu"
          assert receipt.get("executor_uid")==1001
          assert receipt.get("ok") is True
          combined="\n".join(str(x.get("stdout") or "") for x in receipt.get("steps",[]))
          assert "wow_2297_repository_provision=PASS" in combined
          for repo in ("alston-personal/wow-agentos-addon","alston-personal/wow-nav-assist"):
              assert "repo="+repo+"\n" in combined
          ids=re.findall(r"(?m)^repository_id=([0-9]+)$",combined)
          assert len(ids)==2 and len(set(ids))==2
          assert combined.count("private=true")==2
          print("wow_2297_repo_provision_receipt=PASS")
          print("source_commit="+sha)
          print("repository_ids="+",".join(ids))
          PY
