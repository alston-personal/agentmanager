name: vopc5750 cmd observer snapshot now

on:
  push:
    branches:
      - feature/realm-node-fabric-readiness
    paths:
      - .github/workflows/vopc5750-cmd-observer-snapshot-now.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/realm-node-fabric-readiness
          fetch-depth: 0

      - name: Queue immediate observer snapshot
        id: queue
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
        run: |
          python3 - <<'PY'
          import os, time
          from agent_core.realm_fabric import RealmFabricStore
          task_id=f"vopc5750-cmd-snapshot-now-{int(time.time())}"
          script=r'''$ErrorActionPreference='SilentlyContinue'
          $root=Join-Path $env:LOCALAPPDATA 'AgentOS'
          $log=Join-Path $root 'cmd-process-trace.jsonl'
          $state=Join-Path $root 'cmd-observer-state.json'
          $events=@()
          if(Test-Path -LiteralPath $log){
            $lines=@(Get-Content -LiteralPath $log -Tail 30)
            foreach($line in $lines){
              try { $events += ($line | ConvertFrom-Json) } catch {}
            }
          }
          $stateObj=$null
          if(Test-Path -LiteralPath $state){ try { $stateObj=Get-Content -Raw -LiteralPath $state | ConvertFrom-Json } catch {} }
          $current=@()
          foreach($p in @(Get-CimInstance Win32_Process | Where-Object { $_.Name -match '^(?i:cmd\.exe|powershell\.exe|pwsh\.exe|wscript\.exe|cscript\.exe)$' })){
            $parent=Get-CimInstance Win32_Process -Filter ("ProcessId="+[int]$p.ParentProcessId) -ErrorAction SilentlyContinue
            $current += [ordered]@{
              process_name=[string]$p.Name; pid=[int]$p.ProcessId; parent_pid=[int]$p.ParentProcessId;
              command_line=[string]$p.CommandLine;
              parent_name=if($parent){[string]$parent.Name}else{$null};
              parent_command_line=if($parent){[string]$parent.CommandLine}else{$null}
            }
          }
          [ordered]@{
            schema='agentos.cmd-observer-snapshot-now/v1'
            observed_at=(Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
            observer_state=$stateObj
            event_count=$events.Count
            events=$events
            current_shells=$current
          } | ConvertTo-Json -Depth 8 -Compress
          '''
          store=RealmFabricStore()
          store.queue_task('vopc5750', {
            'schema':'agentos.node-task/v0.1','task_id':task_id,'action':'shell.exec',
            'executable':'powershell','argv':['-NoProfile','-NonInteractive','-Command',script],
            'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':30,'cognition_ids_used':[]
          })
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f: f.write(f"task_id={task_id}\n")
          PY

      - name: Persist snapshot evidence
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
          TASK_ID: ${{ steps.queue.outputs.task_id }}
        run: |
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          from agent_core.realm_fabric import RealmFabricStore
          task_id=os.environ['TASK_ID']; store=RealmFabricStore(); receipt=None
          for _ in range(45):
            receipt=store.get_receipt(task_id)
            if receipt: break
            time.sleep(2)
          if not receipt: raise SystemExit('snapshot receipt missing')
          stdout=str(receipt.get('stdout') or '').strip().splitlines()
          payload={'schema':'agentos.cmd-observer-snapshot-evidence/v1','task_id':task_id,'node_receipt_ok':bool(receipt.get('ok')),'returncode':receipt.get('returncode'),'stderr_tail':str(receipt.get('stderr') or '')[-2000:]}
          if stdout:
            try: payload['snapshot']=json.loads(stdout[-1])
            except Exception: payload['stdout_tail']='\n'.join(stdout[-20:])[-8000:]
          out=Path('.agentos/evidence/node-lifecycle/vopc5750-cmd-observer-snapshot-now.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agentos/evidence/node-lifecycle/vopc5750-cmd-observer-snapshot-now.json
          git commit -m 'evidence(agentos-node): snapshot vopc5750 cmd observer immediately' || exit 0
          git push origin HEAD:feature/realm-node-fabric-readiness
