name: Mio DM Oursong Acceptance

on:
  push:
    branches:
      - core/integration
    paths:
      - '.github/workflows/mio-dm-oursong-acceptance.yml'
      - 'agentos_node/bootstrap_control.py'
      - 'agentos_node/bootstrap_scheduler.py'
      - 'agent_core/runner_window.py'
      - 'scripts/run_mio_dm_oracle_oursong_acceptance_user.sh'
      - 'scripts/mio_dm_oracle_oursong_acceptance.py'

permissions:
  contents: read
  id-token: write

concurrency:
  group: mio-dm-oursong-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos
    steps:
      - uses: actions/checkout@v4

      - name: Validate bounded source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mio_dm_oracle_oursong_acceptance.py agentos_node/bootstrap_control.py agentos_node/bootstrap_scheduler.py agent_core/runner_window.py
          bash -n scripts/run_mio_dm_oracle_oursong_acceptance_user.sh
          grep -Fq 'TARGET="oursong_alstonhuang"' scripts/mio_dm_oracle_oursong_acceptance.py

      - name: Mint Runner Window credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Run bounded Mio to Oursong DM acceptance
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/mio-dm-oursong.txt"
          AGENTOS_DISPATCH_WAIT_SECONDS=180 \
            bash scripts/agentos_dispatch.sh \
              threads.dm oursong.acceptance "$GITHUB_SHA" \
              > "$OUT"
          grep -q 'runner_window_dispatch=PASS' "$OUT"
          python3 - "$OUT" "$GITHUB_SHA" <<'PY'
          import json,sys
          path,expected=sys.argv[1:3]
          completed=None
          for raw in open(path,encoding='utf-8'):
              raw=raw.strip()
              if not raw.startswith('{'):
                  continue
              try: row=json.loads(raw)
              except json.JSONDecodeError: continue
              if row.get('state')=='completed' and isinstance(row.get('receipt'),dict):
                  completed=row
          assert completed is not None, 'completed receipt missing'
          receipt=completed['receipt']
          assert receipt.get('source_commit')==expected, receipt
          scheduler=receipt.get('scheduler') or {}
          assert scheduler.get('worker_role')=='gui', scheduler
          assert scheduler.get('worker_id')=='oracle-gui', scheduler
          text='\n'.join(str(s.get('stdout') or '') for s in receipt.get('steps') or [])
          safe=[]
          for line in text.splitlines():
              if line.startswith(('mio_dm_oursong_acceptance=','mio_dm_oursong_send=','mio_dm_oursong_readback=')):
                  safe.append(line)
          print('agentos_scheduler_worker=oracle-gui:gui')
          for line in safe: print(line)
          assert receipt.get('ok') is True, safe
          assert 'mio_dm_oursong_acceptance=PASS' in safe, safe
          assert 'mio_dm_oursong_readback=PASS' in safe, safe
          PY
