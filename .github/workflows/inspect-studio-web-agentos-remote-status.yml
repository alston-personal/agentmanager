name: Inspect Studio Web AgentOS Remote Status

on:
  push:
    paths:
      - '.github/workflows/inspect-studio-web-agentos-remote-status.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Inspect AgentOS remote bootstrap workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/oracle-bootstrap-studio-web-remote-via-agentos.yml/runs?per_page=5" > /tmp/runs.json
          python3 - <<'PY' > .agentos/evidence/studio-web-agentos-remote-status.txt
          import json
          for r in json.load(open('/tmp/runs.json')).get('workflow_runs',[]):
              for k in ('id','status','conclusion','head_sha','created_at','updated_at'):
                  print(f'{k}={r.get(k)}')
              print('---')
          PY
          cat .agentos/evidence/studio-web-agentos-remote-status.txt
      - name: Commit status evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/studio-web-agentos-remote-status.txt
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(studio-web): inspect AgentOS remote status'
          git pull --rebase origin main
          git push
