name: Oracle Bootstrap Vendor Service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-bootstrap-vendor-service.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_DEPLOY_SSH_KEY }}

      - name: Probe and bootstrap isolated vendor service on Oracle
        shell: bash
        env:
          DEPLOY_HOST: 127.0.0.1
          DEPLOY_USER: ${{ secrets.ORACLE_DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.ORACLE_DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE' > .agentos/evidence/vendor-service-bootstrap.json
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path

          base = Path('/home/ubuntu/vendor-reputation-service')
          base.mkdir(parents=True, exist_ok=True)

          gh = shutil.which('gh')
          gh_auth_ok = False
          gh_user = None
          if gh:
              p = subprocess.run([gh, 'auth', 'status'], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, timeout=15)
              gh_auth_ok = p.returncode == 0
              if gh_auth_ok:
                  q = subprocess.run([gh, 'api', 'user', '--jq', '.login'], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, timeout=15)
                  if q.returncode == 0:
                      gh_user = q.stdout.strip() or None

          # Project-local bootstrap only; no AgentOS Core files are touched.
          (base / 'app').mkdir(exist_ok=True)
          (base / 'sql').mkdir(exist_ok=True)
          (base / 'docs').mkdir(exist_ok=True)

          readme = '''# Vendor Reputation Service\n\nCanonical domain service for vendor identity, evidence, reviews, and derived reputation.\n\nConsumers such as studio-web must use the service API instead of owning vendor domain data.\n'''
          (base / 'README.md').write_text(readme, encoding='utf-8')

          schema = '''CREATE EXTENSION IF NOT EXISTS pg_trgm;\n\nCREATE TABLE IF NOT EXISTS vendors (\n  id uuid PRIMARY KEY,\n  canonical_name text NOT NULL,\n  status text NOT NULL DEFAULT 'active',\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE IF NOT EXISTS vendor_aliases (\n  id bigserial PRIMARY KEY,\n  vendor_id uuid NOT NULL REFERENCES vendors(id) ON DELETE CASCADE,\n  alias text NOT NULL,\n  UNIQUE(vendor_id, alias)\n);\n\nCREATE TABLE IF NOT EXISTS evidence (\n  id uuid PRIMARY KEY,\n  source_type text NOT NULL,\n  source_url text NOT NULL,\n  source_object_id text,\n  observed_at timestamptz,\n  original_text text,\n  review_status text NOT NULL DEFAULT 'pending',\n  provenance jsonb NOT NULL DEFAULT '{}'::jsonb,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  UNIQUE(source_type, source_url)\n);\n\nCREATE TABLE IF NOT EXISTS vendor_mentions (\n  id bigserial PRIMARY KEY,\n  evidence_id uuid NOT NULL REFERENCES evidence(id) ON DELETE CASCADE,\n  vendor_id uuid REFERENCES vendors(id) ON DELETE SET NULL,\n  extracted_name text,\n  service_category text,\n  region text,\n  signal text NOT NULL DEFAULT 'unclear',\n  confidence numeric(4,3),\n  review_status text NOT NULL DEFAULT 'pending'\n);\n\nCREATE TABLE IF NOT EXISTS reviews (\n  id uuid PRIMARY KEY,\n  vendor_id uuid NOT NULL REFERENCES vendors(id) ON DELETE CASCADE,\n  evidence_id uuid REFERENCES evidence(id) ON DELETE SET NULL,\n  rating numeric(2,1) CHECK (rating >= 1 AND rating <= 5),\n  body text,\n  occurred_at timestamptz NOT NULL,\n  created_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE IF NOT EXISTS reputation_policies (\n  id text PRIMARY KEY,\n  half_life_days integer NOT NULL,\n  prior_mean numeric(3,2) NOT NULL,\n  prior_weight numeric(6,2) NOT NULL,\n  active boolean NOT NULL DEFAULT false,\n  created_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE IF NOT EXISTS reputation_snapshots (\n  id bigserial PRIMARY KEY,\n  vendor_id uuid NOT NULL REFERENCES vendors(id) ON DELETE CASCADE,\n  policy_id text NOT NULL REFERENCES reputation_policies(id),\n  score numeric(5,3),\n  evidence_count integer NOT NULL DEFAULT 0,\n  effective_weight numeric(10,4) NOT NULL DEFAULT 0,\n  confidence numeric(5,4) NOT NULL DEFAULT 0,\n  computed_at timestamptz NOT NULL DEFAULT now()\n);\n\nINSERT INTO reputation_policies(id, half_life_days, prior_mean, prior_weight, active)\nVALUES ('temporal-bayes-v1', 365, 3.5, 3, true)\nON CONFLICT (id) DO NOTHING;\n'''
          (base / 'sql' / '001_initial.sql').write_text(schema, encoding='utf-8')

          api = '''# API v1\n\nRead API:\n- GET /v1/vendors\n- GET /v1/vendors/{id}\n- GET /v1/vendors/{id}/evidence\n- GET /v1/vendors/{id}/reputation\n- GET /v1/search?q=...\n\nReview/admin API:\n- POST /v1/evidence\n- POST /v1/vendor-candidates\n- POST /v1/review-queue/{id}/approve\n- POST /v1/review-queue/{id}/reject\n'''
          (base / 'docs' / 'API_V1.md').write_text(api, encoding='utf-8')

          if not (base / '.git').exists():
              subprocess.run(['git', 'init', '-b', 'main', str(base)], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              subprocess.run(['git', '-C', str(base), 'config', 'user.name', 'Sunlake'], check=True)
              subprocess.run(['git', '-C', str(base), 'config', 'user.email', 'register@milkcat.org'], check=True)
          subprocess.run(['git', '-C', str(base), 'add', '.'], check=True)
          diff = subprocess.run(['git', '-C', str(base), 'diff', '--cached', '--quiet'])
          if diff.returncode != 0:
              subprocess.run(['git', '-C', str(base), 'commit', '-m', 'bootstrap: vendor reputation domain service'], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)

          repo_created = False
          repo_url = None
          repo_error = None
          if gh_auth_ok:
              check = subprocess.run([gh, 'repo', 'view', 'alston-personal/vendor-reputation-service', '--json', 'url', '--jq', '.url'], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, timeout=20)
              if check.returncode == 0:
                  repo_url = check.stdout.strip() or None
              else:
                  create = subprocess.run([gh, 'repo', 'create', 'alston-personal/vendor-reputation-service', '--private', '--source', str(base), '--remote', 'origin', '--push'], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, timeout=60)
                  repo_created = create.returncode == 0
                  if repo_created:
                      view = subprocess.run([gh, 'repo', 'view', 'alston-personal/vendor-reputation-service', '--json', 'url', '--jq', '.url'], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, timeout=20)
                      if view.returncode == 0:
                          repo_url = view.stdout.strip() or None
                  else:
                      repo_error = (create.stderr or create.stdout).strip()[:300]

          print(json.dumps({
              'schema': 'milkcat.vendor-service-bootstrap/v1',
              'oracle_path': str(base),
              'git_initialized': (base / '.git').exists(),
              'gh_installed': bool(gh),
              'gh_auth_ok': gh_auth_ok,
              'gh_user': gh_user,
              'repo_created': repo_created,
              'repo_url': repo_url,
              'repo_error': repo_error,
              'core_modified': False,
              'domain_schema_written': True,
              'api_spec_written': True
          }, ensure_ascii=False, indent=2))
          PY
          REMOTE
          python3 -m json.tool .agentos/evidence/vendor-service-bootstrap.json >/dev/null
          cat .agentos/evidence/vendor-service-bootstrap.json

      - name: Commit sanitized bootstrap evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .agentos/evidence/vendor-service-bootstrap.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/vendor-service-bootstrap.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(vendors): Oracle vendor service bootstrap'
          git push
