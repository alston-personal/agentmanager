name: Oracle Realm Node Bootstrap Runtime Converge

on:
  push:
    branches:
      - feature/realm-node-fabric-readiness
    paths:
      - '.agentos/commands/realm-node-self-update.json'
      - '.github/workflows/oracle-realm-node-self-update.yml'

permissions:
  contents: write

concurrency:
  group: oracle-realm-node-self-update
  cancel-in-progress: false

jobs:
  update:
    if: github.actor == 'alstonhuang'
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/realm-node-fabric-readiness
          fetch-depth: 0

      - name: Normalize Node OTA capability contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('agentos_node/thin_client.py')
          s=p.read_text(encoding='utf-8')
          old="caps = ['context.harvest', 'process.inspect', 'tool.presence', 'agent.surface.inspect']"
          new="caps = ['context.harvest', 'process.inspect', 'tool.presence', 'agent.surface.inspect', 'node.runtime.converge']"
          if new in s:
              print('node_runtime_converge_capability=already-present')
          else:
              if old not in s:
                  raise SystemExit('capability manifest anchor missing')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
              print('node_runtime_converge_capability=patched')
          PY
          if ! git diff --quiet -- agentos_node/thin_client.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
            git add agentos_node/thin_client.py
            git commit -m 'fix(agentos-node): advertise governed runtime convergence'
            git push origin HEAD:feature/realm-node-fabric-readiness
          fi
          echo "bootstrap_source_commit=$(git rev-parse HEAD)" | tee /tmp/node-bootstrap-ref.env

      - name: Queue first-node bootstrap runtime converge
        shell: bash
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          source /tmp/node-bootstrap-ref.env
          OUT=/tmp/realm-node-self-update-result.json
          python3 - "$OUT" "$bootstrap_source_commit" <<'PY'
          import json,re,sys,time
          from pathlib import Path
          from agent_core.realm_fabric import RealmFabricStore

          node_id='vopc5750'
          ref=sys.argv[2]
          if not re.fullmatch(r'[0-9a-f]{40}',ref):
              raise SystemExit('invalid source commit')

          script = r'''$ErrorActionPreference='Stop'
          $install=Join-Path $env:LOCALAPPDATA 'AgentOS'
          $taskName='AgentOS Thin Client'
          $watchdogName='AgentOS Thin Client Watchdog'
          if ($null -eq (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue)) { throw 'Thin Client scheduled task missing' }
          if ($null -eq (Get-ScheduledTask -TaskName $watchdogName -ErrorAction SilentlyContinue)) { throw 'Watchdog scheduled task missing' }

          $base='https://raw.githubusercontent.com/alston-personal/agentmanager/REF'
          $files=@(
            'agentos_node/thin_client.py',
            'agentos_node/runtime_provenance.py',
            'agentos_node/interactive_desktop.py',
            'agentos_node/thin_client_transport.py',
            'agentos_node/client_cli.py',
            'agentos_node/agent_surfaces.py',
            'agentos_node/session_bridge.py',
            'agentos_node/onboarding.py'
          )
          foreach($rel in $files){
            $dest=Join-Path $install ($rel -replace '/','\')
            $parent=Split-Path -Parent $dest
            New-Item -ItemType Directory -Force -Path $parent | Out-Null
            Invoke-WebRequest -UseBasicParsing -Headers @{'Cache-Control'='no-cache'} -Uri "$base/$rel" -OutFile $dest
          }

          $provenance=[ordered]@{
            schema='agentos.thin-client-runtime/v0.1'
            source_ref='feature/realm-node-fabric-readiness'
            source_commit='REF'
            installed_at=(Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            install_mode='bootstrap-preserve-lifecycle'
          }
          $provenance | ConvertTo-Json | Set-Content -Encoding UTF8 -Path (Join-Path $install 'runtime-provenance.json')

          $restart = "Start-Sleep -Seconds 8; Stop-ScheduledTask -TaskName '$taskName' -ErrorAction SilentlyContinue; Start-Sleep -Seconds 1; Start-ScheduledTask -TaskName '$taskName'"
          Start-Process powershell.exe -WindowStyle Hidden -ArgumentList @('-NoProfile','-NonInteractive','-Command',$restart)

          Write-Output 'agentos_runtime_bootstrap=PASS'
          Write-Output 'agentos_watchdog_preserved=PASS'
          Write-Output ('agentos_source_commit=REF')
          Write-Output 'agentos_restart=deferred-stop-start'
          '''.replace('REF',ref)

          task_id='bootstrap-runtime-'+node_id+'-'+str(int(time.time()))
          task={
            'schema':'agentos.node-task/v0.1',
            'task_id':task_id,
            'action':'shell.exec',
            'executable':'powershell',
            'argv':['-NoProfile','-NonInteractive','-Command',script],
            'cwd':r'C:\Users\alston.huang\AgentOS',
            'timeout_seconds':90,
            'cognition_ids_used':[]
          }
          queued=RealmFabricStore().queue_task(node_id,task)
          Path(sys.argv[1]).write_text(json.dumps({'ok':True,'node_id':node_id,'ref':ref,'task':queued},indent=2)+'\n',encoding='utf-8')
          print('bootstrap_task_id='+task_id)
          PY

      - name: Wait for bootstrap receipt
        shell: bash
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          TASK=$(python3 -c "import json; print(json.load(open('/tmp/realm-node-self-update-result.json'))['task']['task_id'])")
          for i in $(seq 1 45); do
            python3 - "$TASK" <<'PY' && exit 0 || true
          import sys
          from agent_core.realm_fabric import RealmFabricStore
          r=RealmFabricStore().get_receipt(sys.argv[1])
          if r and r.get('ok') is True and int(r.get('returncode') or 0) == 0:
              out=str(r.get('stdout') or '')
              required=('agentos_runtime_bootstrap=PASS','agentos_watchdog_preserved=PASS')
              if all(x in out for x in required):
                  print('bootstrap_receipt=PASS')
                  print(out)
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
            sleep 2
          done
          echo 'bootstrap receipt timeout' >&2
          exit 1

      - name: Report non-secret evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/realm-node-self-update-result.json || exit 0
          cat /tmp/realm-node-self-update-result.json
