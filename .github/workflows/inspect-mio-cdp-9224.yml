name: Inspect Mio CDP 9224
on:
  push:
    paths:
      - '.github/workflows/inspect-mio-cdp-9224.yml'
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Restart Mio browser only
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          systemctl --user restart agentos-threads-browser-mio.service
          systemctl --user reset-failed mio-threads-session-supervisor.service || true
          sleep 6
          systemctl --user is-active --quiet agentos-threads-browser-mio.service
          curl -fsS --max-time 3 http://127.0.0.1:9224/json/version >/tmp/mio-cdp-version.json
          python3 - <<'PY'
import json
d=json.load(open('/tmp/mio-cdp-version.json'))
assert d.get('webSocketDebuggerUrl')
print('mio_cdp_http=PASS')
PY
          df -h /
          REMOTE
