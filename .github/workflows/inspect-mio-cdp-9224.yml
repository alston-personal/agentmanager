name: Inspect Mio CDP 9224
on:
  push:
    paths:
      - '.github/workflows/inspect-mio-cdp-9224.yml'
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Remove old Playwright browser revisions
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/.cache/ms-playwright"
          echo '=== BEFORE ==='
          df -h /
          du -sh "$ROOT"/* 2>/dev/null | sort -h || true
          echo '=== DELETE OLD CHROMIUM REVISIONS ==='
          for d in "$ROOT"/chromium-*; do
            [ -d "$d" ] || continue
            case "$(basename "$d")" in
              chromium-1243) echo "keep $d" ;;
              *) echo "remove $d"; rm -rf -- "$d" ;;
            esac
          done
          for d in "$ROOT"/chromium_headless_shell-*; do
            [ -d "$d" ] || continue
            case "$(basename "$d")" in
              chromium_headless_shell-1243) echo "keep $d" ;;
              *) echo "remove $d"; rm -rf -- "$d" ;;
            esac
          done
          echo '=== AFTER ==='
          df -h /
          du -sh "$ROOT"/* 2>/dev/null | sort -h || true
          REMOTE
