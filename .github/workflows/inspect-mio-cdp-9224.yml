name: Inspect Mio CDP 9224
on:
  push:
    paths:
      - '.github/workflows/inspect-mio-cdp-9224.yml'
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Reap stale persona temp stages
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          echo '=== BEFORE ==='
          df -h /
          echo '=== CANDIDATES ==='
          find /tmp -maxdepth 1 -mindepth 1 -type d -mmin +10 \
            \( -name 'agentos-threads-dm-read.*' -o -name 'persona-agent-data-*' -o -name 'persona-social-data-*' -o -name 'mio-public-snapshot-*' \) \
            -print 2>/dev/null | sort
          find /tmp -maxdepth 1 -mindepth 1 -type d -mmin +10 \
            \( -name 'agentos-threads-dm-read.*' -o -name 'persona-agent-data-*' -o -name 'persona-social-data-*' -o -name 'mio-public-snapshot-*' \) \
            -print0 2>/dev/null | xargs -0 -r rm -rf --
          echo '=== AFTER ==='
          df -h /
          REMOTE
