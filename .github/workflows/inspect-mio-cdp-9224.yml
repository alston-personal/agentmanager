name: Inspect Mio CDP 9224
on:
  push:
    paths:
      - '.github/workflows/inspect-mio-cdp-9224.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect Mio session supervisor
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          echo '=== SUPERVISOR STATUS ==='
          systemctl --user --no-pager --full status mio-threads-session-supervisor.service 2>&1 || true
          echo '=== SUPERVISOR UNIT ==='
          systemctl --user cat mio-threads-session-supervisor.service mio-threads-session-supervisor.timer 2>&1 || true
          echo '=== SUPERVISOR JOURNAL ==='
          journalctl --user -u mio-threads-session-supervisor.service -n 120 --no-pager -o short-iso 2>&1 || true
          echo '=== MIO BROWSER STATUS ==='
          systemctl --user --no-pager --full status agentos-threads-browser-mio.service 2>&1 || true
          REMOTE
