name: Inspect Mio CDP 9224
on:
  push:
    paths:
      - '.github/workflows/inspect-mio-cdp-9224.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DEPLOY_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect Mio CDP
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          echo '=== LISTENERS ==='
          ss -ltnp 2>/dev/null | grep -E ':9222|:9223|:9224' || true
          echo '=== CDP HTTP ==='
          for p in 9222 9223 9224; do
            echo "--- port=$p"
            curl -fsS --max-time 3 "http://127.0.0.1:$p/json/version" 2>&1 | head -c 1200 || true
            echo
          done
          echo '=== USER UNITS ==='
          systemctl --user list-units --all --no-pager | grep -Ei 'gui|browser|chrome|threads|mio|oursong' || true
          echo '=== UNIT FILES ==='
          systemctl --user list-unit-files --no-pager | grep -Ei 'gui|browser|chrome|threads|mio|oursong' || true
          echo '=== CHROME PROCESSES ==='
          ps -eo pid,ppid,lstart,args | grep -E '[c]hrom(e|ium).*remote-debugging-port=(9222|9223|9224)' || true
          REMOTE
