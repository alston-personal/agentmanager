name: Oracle Approved Issue Intake

on:
  # Deploy-aware intake in the EXISTING workflow, not a second queue.
  workflow_run:
    workflows: ["Oracle Core Bundle Immutable Runtime Convergence"]
    types: [completed]
    branches: [core/integration]
  # Run this single time when the new trigger is first merged to default branch.
  # Subsequent runs come from successful Core convergence and normal schedule.
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-approved-issue-intake.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: oracle-approved-issue-intake
  cancel-in-progress: false

jobs:
  sync:
    # Failed convergence must never be used to claim an installed Core Runtime.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Fetch bounded, labeled Issue snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/alston-personal/agentmanager/issues?state=open&labels=agentos%3Aapproved&per_page=100"
          curl --fail --silent --show-error --max-time 20 --retry 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$url" > "${RUNNER_TEMP}/approved-issues.json"
          python3 - "${RUNNER_TEMP}/approved-issues.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          if not isinstance(data,list) or len(data)>=100:
              raise SystemExit("intake_snapshot_not_exhaustive")
          print("approved_issue_snapshot_count="+str(len(data)))
          PY
      - name: Register eligible, approved Issues against Oracle durable Ledger
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          target="${DEPLOY_USER}@${ORACLE_HOST}"
          port="${DEPLOY_PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "$port" "$target" \
            'mkdir -p /home/ubuntu/agent-data/governance/issue-intake'
          scp -q -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -P "$port" \
            "${RUNNER_TEMP}/approved-issues.json" "$target:/home/ubuntu/agent-data/governance/issue-intake/latest-approved-issues.json"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "$port" "$target" 'bash -s' <<'REMOTE'
          set -euo pipefail
          data=/home/ubuntu/agent-data
          release="$(readlink -f "$data/runtime/core/current")"
          test -f "$release/scripts/issue_work_intake.py"
          test -f "$release/scripts/work_completion.py"
          # Intake is data-only; do not require a particular executor service
          # for receiving an approved engineering task.
          /usr/bin/python3 "$release/scripts/issue_work_intake.py" \
            --issues-json "$data/governance/issue-intake/latest-approved-issues.json" \
            --state "$data/governance/work-items.json" \
            --workspace "$data/proofs/lobster-mvp1-local-port" > "$data/governance/issue-intake/last-sync-result.json"
          /usr/bin/python3 - "$data/governance/issue-intake/last-sync-result.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          print("issue_intake_total="+str(len(data)))
          print("issue_intake_accepted="+str(sum(x.get("status")=="accepted" for x in data)))
          print("issue_intake_rejected="+str(sum(x.get("status")=="skipped" for x in data)))
          print("issue_intake_already_terminal="+str(sum(x.get("status")=="already_terminal" for x in data)))
          PY
          # Read-only ledger summary: do not mistake admission for verified execution.
          /usr/bin/python3 - "$data/governance/work-items.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as stream:
              items=json.load(stream).get("items",{})
          for number in (1655,1656):
              work_id=f"gh-issue-{number}-readonly"
              item=items.get(work_id) or {}
              verification=item.get("verification") or {}
              evidence=item.get("evidence") or []
              verified=(item.get("status")=="done" and verification.get("status")=="passed" and len(evidence)>0)
              print(f"lobster_issue_{number}_status={item.get('status','missing')}")
              print(f"lobster_issue_{number}_verified_done={'true' if verified else 'false'}")
          PY
          # Exact WoW receipt readback. Admission is not Executor authority.
          /usr/bin/python3 - "$data/governance/work-items.json" <<'PY'
          import json,sys
          items=json.load(open(sys.argv[1],encoding="utf-8")).get("items",{})
          item=items.get("gh-issue-2134-engineering") or {}
          print("wow_2134_work_item_status="+str(item.get("status") or "missing"))
          print("wow_2134_work_item_owner="+str(item.get("owner") or "unassigned"))
          print("wow_2134_execution_authorized="+str(item.get("execution_authorized") is True).lower())
          PY
          # Project the canonical, already-accepted WoW WorkItem to Paw's
          # existing read-only engineering inspection Assignment. This creates
          # no lease and does not authorize execution or deployment.
          test -f "$release/scripts/approved_wow_paw_handoff.py"
          PYTHONPATH="$release" /usr/bin/python3 "$release/scripts/approved_wow_paw_handoff.py" \
            --completion-state "$data/governance/work-items.json" \
            --runtime-root "$data/employee-runtime" > "$data/governance/issue-intake/last-wow-paw-handoff.json"
          /usr/bin/python3 - "$data/governance/issue-intake/last-wow-paw-handoff.json" "$data/governance/work-items.json" <<'PY'
          import json,sys
          receipt=json.load(open(sys.argv[1],encoding="utf-8"))
          item=json.load(open(sys.argv[2],encoding="utf-8")).get("items",{}).get("gh-issue-2134-engineering") or {}
          if receipt.get("schema") != "agentos.approved-wow-paw-handoff-receipt/v1":
              raise SystemExit("wow_paw_receipt_invalid")
          status="REGISTERED" if receipt.get("assignment_registered") is True else "WAITING"
          print("wow_2134_paw_assignment_projection="+status)
          print("wow_2134_completion_status="+str(item.get("status") or "missing"))
          kind=str(item.get("last_blocker_kind") or "UNKNOWN")
          if kind not in {"NONE","HUMAN_AUTH","RUNTIME_HEALTH","PROVIDER_CAPACITY","VERIFICATION","UNKNOWN","MARKET_DATA"}:
              kind="UNKNOWN"
          print("wow_2134_blocker_kind="+kind)
          wake=item.get("wake_condition") or {}
          print("wow_2134_wake_kind="+str(wake.get("kind") if wake.get("kind") in ("time","external") else "none"))
          PY
          # Atlas #2243: same existing Core WorkItemStore/Employee Runtime path as
          # the scoped WoW projection, with its OWN exact source/authority fence.
          # This creates only a read-only Paw Assignment. It does not claim,
          # enable S4 delivery, authorize engineering writes or deploy Atlas.
          test -f "$release/scripts/approved_atlas_paw_handoff.py"
          PYTHONPATH="$release" /usr/bin/python3 "$release/scripts/approved_atlas_paw_handoff.py" \
            --completion-state "$data/governance/work-items.json" \
            --runtime-root "$data/employee-runtime" > "$data/governance/issue-intake/last-atlas-paw-handoff.json"
          /usr/bin/python3 - "$data/governance/issue-intake/last-atlas-paw-handoff.json" "$data/governance/work-items.json" "$data/employee-runtime" <<'PY'
          import json,sys
          from pathlib import Path
          result=json.load(open(sys.argv[1],encoding="utf-8"))
          items=json.load(open(sys.argv[2],encoding="utf-8")).get("items",{})
          item=items.get("gh-issue-2243-engineering") or {}
          if result.get("schema") != "agentos.approved-atlas-paw-handoff-receipt/v1":
              raise SystemExit("atlas_paw_receipt_invalid")
          status=str(item.get("status") or "missing")
          print("atlas_2243_work_item_status="+status)
          print("atlas_2243_work_item_owner="+str(item.get("owner") or "unassigned"))
          print("atlas_2243_execution_authorized="+str(item.get("execution_authorized") is True).lower())
          print("atlas_2243_paw_assignment_registered="+str(result.get("assignment_registered") is True).lower())
          print("atlas_2243_paw_assignment_id="+str(result.get("assignment_id") or "missing"))
          root=Path(sys.argv[3])
          aid="paw-atlas-2243-inspect-v1"
          def load(path):
              try:
                  obj=json.loads(path.read_text(encoding="utf-8"))
                  return obj if isinstance(obj,dict) else {}
              except (OSError,ValueError):
                  return {}
          assignment=load(root/"assignments"/(aid+".json"))
          lease=load(root/"lifecycle"/"leases"/(aid+".json"))
          print("atlas_2243_employee_assignment_state="+str(assignment.get("state") if assignment.get("state") in ("pending","active","blocked","handoff","completed","cancelled") else "missing"))
          print("atlas_2243_employee_lease_state="+str(lease.get("status") if lease.get("status") in ("active","completed","blocked","handoff","cancelled","expired") else "missing"))
          PY
          # Independent read-only receipt projection for ONE/Supervisor claim:
          # registering an Assignment never equals a claim, delivery or result.
          /usr/bin/python3 - "$data/employee-runtime" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          assignment_id="paw-wow-2134-inspect-v1"
          def read(path):
              try:
                  obj=json.loads(path.read_text(encoding="utf-8"))
                  return obj if isinstance(obj,dict) else {}
              except (FileNotFoundError, OSError, ValueError):
                  return {}
          def safe(value, allowed):
              return value if value in allowed else "unknown"
          assignment=read(root/"assignments"/(assignment_id+".json"))
          state=safe(assignment.get("state"),{"pending","active","blocked","handoff","completed","cancelled"})
          if not assignment: state="missing"
          print("wow_2134_employee_assignment_state="+state)
          lease=read(root/"lifecycle"/"leases"/(assignment_id+".json"))
          lease_status=safe(lease.get("status"),{"active","completed","blocked","handoff","cancelled","expired"})
          if not lease: lease_status="missing"
          print("wow_2134_employee_lease_state="+lease_status)
          generation=lease.get("generation",0)
          print("wow_2134_employee_lease_generation="+str(generation if type(generation) is int and 0 <= generation <= 1000000 else 0))
          deliveries=root/"supervisor"/"deliveries"
          states=[]
          if deliveries.is_dir():
              for path in sorted(deliveries.glob("reconcile_*.json"))[-300:]:
                  row=read(path)
                  if row.get("assignment_id")==assignment_id and row.get("employee_id")=="the-paw":
                      states.append(safe(row.get("status"),{"queued","awaiting_claim","claimed","blocked","failed","unknown","superseded","terminal_observed"}))
          print("wow_2134_supervisor_delivery_state="+(states[-1] if states else "missing"))
          receipts=root/"lifecycle"/"receipts"/assignment_id
          files=sorted(receipts.glob("*.json")) if receipts.is_dir() else []
          latest=read(files[-1]) if files else {}
          outcome=safe(latest.get("outcome"),{"completed","blocked","handoff","cancelled"}) if latest else "missing"
          print("wow_2134_employee_receipt_outcome="+outcome)
          PY
          # Read-only Supervisor S4 health projection. No raw env, secrets,
          # Node registry, employee memory, credentials, or action parameters.
          /usr/bin/python3 - "$data" <<'PY'
          import json,re,subprocess,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          conf=Path("/home/ubuntu/.config/agentos")
          base=conf/"core-supervisor.env"
          delivery=conf/"core-supervisor-delivery.env"
          def exact_mode(path):
              if not path.is_file(): return "missing"
              for line in path.read_text(encoding="utf-8",errors="replace").splitlines():
                  if re.fullmatch(r"AGENTOS_SUPERVISOR_DELIVERY_MODE=(disabled|one_direct)",line.strip()):
                      return line.strip().split("=",1)[1]
              return "unconfigured"
          mode=exact_mode(delivery) if delivery.is_file() else exact_mode(base)
          print("wow_2134_supervisor_delivery_mode="+mode)
          print("wow_2134_supervisor_one_realm_present="+str((root/"realm"/"fabric.json").is_file() and (root/"realm"/"nodes.json").is_file()).lower())
          try:
              p=subprocess.run(["systemctl","--user","is-active","agentos-core-supervisor.service"],
                  text=True,capture_output=True,timeout=4,check=False)
              active="active" if p.returncode==0 and p.stdout.strip()=="active" else "inactive"
          except (OSError,subprocess.TimeoutExpired):
              active="unknown"
          print("wow_2134_supervisor_service_state="+active)
          cycle=root/"employee-runtime"/"supervisor"/"state.json"
          try: state=json.loads(cycle.read_text(encoding="utf-8"))
          except (OSError,ValueError): state={}
          if not isinstance(state,dict): state={}
          count=state.get("cycle_generation")
          print("wow_2134_supervisor_cycle_generation="+str(count if type(count) is int and count>=0 else 0))
          for name in ("delivery_dispatch_count","delivery_blocked_count","delivery_error_count"):
              value=state.get(name)
              print("wow_2134_supervisor_"+name+"="+str(value if type(value) is int and value>=0 else 0))
          PY
          echo "ORACLE_APPROVED_ISSUE_INTAKE=PASS"
          echo "engineering_registration_is_not_execution_authorization=true"
          echo "issue_intake_source=github_open_explicitly_approved"
          REMOTE

      - name: Reconcile verified two-Issue MVP receipts back to GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          target="${DEPLOY_USER}@${ORACLE_HOST}"
          port="${DEPLOY_PORT:-22}"
          # Project the authoritative verified Ledger receipt; do not re-run task acceptance during synchronization.
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "$port" "$target" 'python3 -' > "${RUNNER_TEMP}/verified-receipts.json" <<'PY'
          import json, pathlib
          path = pathlib.Path("/home/ubuntu/agent-data/governance/work-items.json")
          items = json.loads(path.read_text(encoding="utf-8")).get("items", {})
          result = []
          snapshots = json.loads(pathlib.Path("/home/ubuntu/agent-data/governance/issue-intake/last-sync-result.json").read_text(encoding="utf-8"))
          for row in snapshots:
              if row.get("status") not in ("accepted", "already_terminal"):
                  continue
              number = row.get("number")
              if not isinstance(number, int) or number < 1 or row.get("work_id") != f"gh-issue-{number}-readonly":
                  continue
              item = items.get(f"gh-issue-{number}-readonly") or {}
              verification = item.get("verification") or {}
              passed = (item.get("status") == "done"
                        and verification.get("status") == "passed"
                        and bool(item.get("evidence")))
              result.append({"issue": number, "verified": passed and item.get("source") == f"https://github.com/alston-personal/agentmanager/issues/{number}"})
          print(json.dumps(result, separators=(",", ":")))
          PY
          # Only the two exact explicitly approved test Issues may be closed by this MVP.
          # Validate the currently open GitHub issue's labels and immutable read-only Action before mutation.
          python3 - "${RUNNER_TEMP}/verified-receipts.json" "${RUNNER_TEMP}/approved-issues.json" <<'PY' > "${RUNNER_TEMP}/close-issues.txt"
          import json,re,sys
          receipts = json.load(open(sys.argv[1],encoding="utf-8"))
          issues = json.load(open(sys.argv[2],encoding="utf-8"))
          by_number = {i.get("number"):i for i in issues if isinstance(i,dict) and "pull_request" not in i}
          for row in receipts:
              number=row["issue"]
              match=re.search(r"(?m)^Action:\s*檢查連接埠 ([0-9]{1,5})\s*$", (by_number.get(number,{}) or {}).get("body") or "")
              port=int(match.group(1)) if match else 0
              issue=by_number.get(number,{})
              labels={x.get("name") for x in issue.get("labels",[]) if isinstance(x,dict)}
              body=issue.get("body") or ""
              eligible=(row["verified"] is True and 1 <= port <= 65535
                 and issue.get("state")=="open"
                 and {"agentos:approved","agentos:lobster","agentos:readonly"} <= labels
                 and re.search(r"(?m)^Action:\s*檢查連接埠 "+str(port)+r"\s*$",body)
                 and re.search(r"(?m)^Acceptance:\s*\S+",body)
                 and not (labels & {"blocked","needs-decision","needs-approval","security","production-change"})
                 and issue.get("html_url")==f"https://github.com/alston-personal/agentmanager/issues/{number}")
              if eligible:
                  print(number)
          PY
          verified_open="$(python3 - "${RUNNER_TEMP}/verified-receipts.json" "${RUNNER_TEMP}/approved-issues.json" <<'CHECK'
          import json,sys
          rows=json.load(open(sys.argv[1],encoding="utf-8"))
          issues=json.load(open(sys.argv[2],encoding="utf-8"))
          opens={x.get("number") for x in issues if isinstance(x,dict) and x.get("state")=="open"}
          print(sum(row["verified"] is True and row["issue"] in opens for row in rows))
          CHECK
          )"
          eligible_count="$(wc -l < "${RUNNER_TEMP}/close-issues.txt")"
          echo "receipt_sync_verified_open=$verified_open eligible=$eligible_count"
          if [ "$verified_open" -gt "$eligible_count" ]; then
            echo "receipt_sync_eligibility_mismatch=FAIL" >&2
            exit 12
          fi
          closed_count=0
          while IFS= read -r issue; do
            test -n "$issue" || continue
            [[ "$issue" =~ ^[1-9][0-9]*$ ]] || exit 10
            # Recheck server-side issue state immediately before closing. Safe on reruns.
            data="$(curl -fsS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/alston-personal/agentmanager/issues/$issue")"
            python3 - "$issue" "$data" <<'VALIDATE'
          import json,re,sys
          n=int(sys.argv[1]); issue=json.loads(sys.argv[2])
          labels={x.get("name") for x in issue.get("labels",[]) if isinstance(x,dict)}
          body=issue.get("body") or ""
          match=re.search(r"(?m)^Action:\s*檢查連接埠 ([0-9]{1,5})\s*$",body)
          assert issue.get("number")==n and issue.get("state")=="open"
          assert issue.get("html_url")==f"https://github.com/alston-personal/agentmanager/issues/{n}"
          assert {"agentos:approved","agentos:lobster","agentos:readonly"}<=labels
          assert not(labels & {"blocked","needs-decision","needs-approval","security","production-change"})
          assert match and 1<=int(match.group(1))<=65535
          assert re.search(r"(?m)^Acceptance:\s*\S+",body)
          VALIDATE
            current="$(printf '%s' "$data" | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')"
            test "$current" = open || continue
            body="$(printf 'Oracle durable Ledger completion receipt independently verified. Evidence: https://github.com/alston-personal/agentmanager/actions/runs/%s (job receipt reconciliation). Scope: read-only localhost port inspection.\n' "$GITHUB_RUN_ID")"
            curl -fsS --max-time 20 -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' \
              -d "$(python3 -c 'import json,sys; print(json.dumps({"body":sys.argv[1]}))' "$body")" \
              "https://api.github.com/repos/alston-personal/agentmanager/issues/$issue/comments" >/dev/null
            curl -fsS --max-time 20 -X PATCH -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' \
              -d '{"state":"closed","state_reason":"completed"}' \
              "https://api.github.com/repos/alston-personal/agentmanager/issues/$issue" >/dev/null
            echo "receipt_github_issue_closed=$issue"
            closed_count=$((closed_count+1))
          done < "${RUNNER_TEMP}/close-issues.txt"
          echo "receipt_sync_closed_count=$closed_count"
          test "$closed_count" -eq "$eligible_count"
