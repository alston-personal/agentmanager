name: Vision Studio Rain Exit Resume S01

on:
  push:
    branches: [core/integration]
    paths:
      - '.agentos/commands/vision-studio-rain-exit-resume-s01.json'

permissions:
  contents: read
  id-token: write

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos
    steps:
      - uses: actions/checkout@v4
      - name: Validate approved resume command
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          p=json.load(open('.agentos/commands/vision-studio-rain-exit-resume-s01.json',encoding='utf-8'))
          assert p.get('schema')=='agentos.vision-studio-rain-exit-resume/v1'
          assert p.get('project_id')=='rain-exit-v001'
          assert p.get('shot_id')=='s01'
          assert p.get('approved') is True
          assert p.get('max_points')==15
          assert re.fullmatch(r'resume-rain-exit-s01-20261006-r[0-9]+',str(p.get('nonce') or ''))
          print('vision_studio_rain_exit_resume_command=APPROVED')
          PY
      - name: Mint OIDC credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
      - name: Resume approved Rain Exit S01
        shell: bash
        run: |
          set -euo pipefail
          AGENTOS_DISPATCH_WAIT_SECONDS=1200 \
            bash scripts/agentos_dispatch.sh media.google-flow rain-exit-s01.resume-approved "$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/rain-exit-resume-s01.txt"
          grep -q 'runner_window_dispatch=PASS' "$RUNNER_TEMP/rain-exit-resume-s01.txt"
          grep -q 'google_flow_rain_exit_resume=PASS' "$RUNNER_TEMP/rain-exit-resume-s01.txt"
      - name: Upload resume receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vision-studio-rain-exit-resume-s01-${{ github.run_id }}
          path: ${{ runner.temp }}/rain-exit-resume-s01.txt
          if-no-files-found: warn
          retention-days: 7
