name: Inspect Gemini Generation State

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/inspect-gemini-generation-state.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect Gemini screen and downloads
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          f=RealmFabricStore(); tid='inspect-gemini-generation-state-20261006-1115'
          code="""import pathlib,datetime,json,ctypes,io,base64
from PIL import ImageGrab
u=ctypes.windll.user32
h=1117002
u.ShowWindow(h,9); u.BringWindowToTop(h); u.SetForegroundWindow(h)
d=pathlib.Path.home()/'Downloads'
rows=[]
for p in d.glob('Gemini_Generated_Image*'):
 st=p.stat(); rows.append({'path':str(p),'bytes':st.st_size,'mtime':datetime.datetime.fromtimestamp(st.st_mtime,datetime.timezone.utc).isoformat()})
rows=sorted(rows,key=lambda x:x['mtime'],reverse=True)[:8]
state=pathlib.Path(r'C:\\Users\\alston.huang\\AgentOS\\agentos-demo\\agentos-demo-state.json')
print('DOWNLOADS='+json.dumps(rows,ensure_ascii=False,separators=(',',':')))
print('DEMO_STATE='+(state.read_text(encoding='utf-8') if state.exists() else 'MISSING'))
im=ImageGrab.grab(bbox=(0,0,1920,1080),all_screens=True).convert('RGB'); im.thumbnail((480,270)); b=io.BytesIO(); im.save(b,format='JPEG',quality=24,optimize=True); s=base64.b64encode(b.getvalue()).decode('ascii'); print('SAFE_B64='+'.'.join(s[i:i+3] for i in range(0,len(s),3)))
"""
          if f.get_receipt(tid) is None:
              f.queue_task('VO10005870',{'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':r'C:\Users\alston.huang\AppData\Local\Programs\Python\Python312\python.exe','argv':['-c',code],'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':15,'cognition_ids_used':['demo://gemini-threads/20261006']})
          for _ in range(30):
              r=f.get_receipt(tid)
              if r:
                  print(r.get('stdout') or '')
                  raise SystemExit(0)
              time.sleep(1)
          raise SystemExit('inspect_receipt_missing')
          PY
          REMOTE
