name: PR1504 Realm Lease Test

on:
  push:
    branches:
      - ops/test-pr1504-realm-lease
    paths:
      - '.github/workflows/pr1504-realm-lease-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-integration-realm-task-lease-ack
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Realm fabric regression
        run: python -m unittest tests.test_realm_fabric -v
