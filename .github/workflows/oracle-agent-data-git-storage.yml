name: Oracle Agent Data Git Storage

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/oracle-agent-data-git-storage.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ vars.ORACLE_HOST || '161.33.24.170' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect agent-data git object storage
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$ORACLE_HOST" bash -s <<'REMOTE'
          set -u
          REPO="$HOME/agent-data"
          echo '=== disk ==='
          df -h /
          echo '=== git status summary ==='
          git -C "$REPO" status --porcelain=v1 -uno | head -n 100 || true
          echo '=== count objects ==='
          git -C "$REPO" count-objects -vH || true
          echo '=== git subtrees ==='
          for p in "$REPO/.git/objects" "$REPO/.git/objects/pack" "$REPO/.git/logs" "$REPO/.git/refs"; do
            [ -e "$p" ] || continue
            du -sh "$p" 2>/dev/null || true
          done
          echo '=== packs ==='
          find "$REPO/.git/objects/pack" -maxdepth 1 -type f -printf '%s\t%TY-%Tm-%TdT%TH:%TM:%TS\t%f\n' 2>/dev/null | sort -nr | head -n 80 || true
          echo '=== reflog sizes ==='
          du -h -d2 "$REPO/.git/logs" 2>/dev/null | sort -h | tail -n 40 || true
          REMOTE
