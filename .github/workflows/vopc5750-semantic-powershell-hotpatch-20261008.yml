name: VOPC5750 Semantic PowerShell Hotpatch 20261008

on:
  push:
    branches:
      - ops/vopc5750-semantic-powershell-hotpatch-20261008
    paths:
      - '.github/workflows/vopc5750-semantic-powershell-hotpatch-20261008.yml'

permissions:
  contents: read

jobs:
  hotpatch:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 6
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
    steps:
      - uses: actions/checkout@v4

      - name: Patch foreground-only PowerShell semantic backend
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,time,uuid
          from pathlib import Path
          from agent_core.realm_fabric import RealmFabricStore

          expected=hashlib.sha256(Path('agentos_node/semantic_preview.py').read_bytes()).hexdigest()
          patch_code = r'''
          import hashlib, json, os, signal, subprocess, sys, urllib.request
          from pathlib import Path

          install = Path(os.environ["LOCALAPPDATA"]) / "AgentOS"
          try:
              root = Path((install / "current-runtime.txt").read_text(encoding="ascii").strip())
              pointer_source = "current-runtime.txt"
          except Exception:
              accepted = sorted(
                  (install / "accepted-runtimes").glob("*.txt"),
                  key=lambda p: p.stat().st_mtime,
                  reverse=True,
              )
              if not accepted:
                  raise
              root = Path(accepted[0].read_text(encoding="ascii").strip())
              pointer_source = accepted[0].name

          url = "https://raw.githubusercontent.com/alston-personal/agentmanager/7802b315df4505c75b08c0089bb0a6b0e35d26f3/agentos_node/semantic_preview.py"
          data = urllib.request.urlopen(url, timeout=20).read()
          target = root / "agentos_node" / "semantic_preview.py"
          tmp = target.with_suffix(".py.new")
          tmp.write_bytes(data)
          os.replace(tmp, target)

          parent_pid = os.getppid()
          restart_code = (
              "import os,signal,time;"
              "time.sleep(5);"
              f"os.kill({parent_pid}, signal.SIGTERM)"
          )
          flags = subprocess.DETACHED_PROCESS | subprocess.CREATE_NO_WINDOW
          subprocess.Popen(
              [sys.executable, "-c", restart_code],
              creationflags=flags,
              close_fds=True,
          )
          print(json.dumps({
              "patched": str(target),
              "sha256": hashlib.sha256(data).hexdigest(),
              "runtime_root": str(root),
              "pointer_source": pointer_source,
              "restart_parent_pid": parent_pid,
          }))
          '''

          fabric=RealmFabricStore()
          task_id='task-semantic-powershell-hotpatch-'+uuid.uuid4().hex
          fabric.queue_task('vopc5750',{
              'schema':'agentos.node-task/v0.1',
              'task_id':task_id,
              'action':'shell.exec',
              'executable':'python',
              'argv':['-c',patch_code],
              'cwd':r'C:\Users\alston.huang\AgentOS',
              'timeout_seconds':45,
          })
          receipt=None
          deadline=time.time()+60
          while time.time()<deadline:
              receipt=fabric.get_receipt(task_id)
              if receipt:
                  break
              time.sleep(1)
          print(json.dumps(receipt,indent=2,sort_keys=True))
          assert receipt and receipt.get('ok') is True,receipt
          assert receipt.get('returncode')==0,receipt
          payload=json.loads(str(receipt.get('stdout') or '').strip().splitlines()[-1])
          assert payload.get('sha256')==expected,(payload,expected)
          print('POWERSHELL_SEMANTIC_HOTPATCH=PASS')
          PY

      - name: Wait for supervisor restart
        run: sleep 15

      - name: Verify fresh heartbeat
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from agent_core.node_registry import NodeRegistry
          data=NodeRegistry().node_map()
          node=next((n for n in data.get('nodes',[]) if n.get('node_id')=='vopc5750'),None)
          assert node and node.get('status')=='online',node
          assert float(node.get('heartbeat_age_seconds') or 9999)<30,node
          print('POST_POWERSHELL_HOTPATCH_HEARTBEAT=PASS')
          PY

      - name: Accept semantic preview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,uuid
          from agent_core.realm_fabric import RealmFabricStore

          fabric=RealmFabricStore()
          task_id='task-semantic-powershell-'+uuid.uuid4().hex
          fabric.queue_task('vopc5750',{
              'schema':'agentos.node-task/v0.1',
              'task_id':task_id,
              'action':'desktop.semantic_preview',
              'max_pixels':160000,
              'quality':45,
          })

          receipt=None
          deadline=time.time()+35
          while time.time()<deadline:
              receipt=fabric.get_receipt(task_id)
              if receipt:
                  break
              time.sleep(1)

          if receipt and isinstance(receipt.get('preview'),dict) and isinstance(receipt['preview'].get('image_base64'),str):
              receipt=dict(receipt)
              preview=dict(receipt['preview'])
              preview['image_base64']='<omitted:'+str(len(preview['image_base64']))+'>'
              receipt['preview']=preview
          print(json.dumps(receipt,indent=2,sort_keys=True))
          assert receipt,'SEMANTIC_POWERSHELL_RECEIPT_TIMEOUT'
          assert receipt.get('ok') is True,receipt
          assert receipt.get('read_only') is True,receipt
          assert receipt.get('mode')=='foreground-window-only',receipt
          assert receipt.get('capture_backend')=='powershell-system-drawing',receipt
          assert receipt.get('state_hash'),receipt
          assert isinstance(receipt.get('foreground'),dict),receipt
          assert isinstance(receipt.get('preview'),dict),receipt
          assert receipt['preview'].get('mime_type')=='image/jpeg',receipt
          print('SEMANTIC_PREVIEW_LIVE_ACCEPTANCE=PASS')
          PY
