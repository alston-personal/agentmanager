name: GUI Transport Probe

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/gui-transport-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Verify watchdog recovery
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json,time
          from agent_core.node_registry import NodeRegistry
          from agent_core.realm_fabric import RealmFabricStore
          task_id='gui-demo-watchdog-after-uia-20261002-1115'
          node=next((n for n in (NodeRegistry().node_map().get('nodes') or []) if str(n.get('node_id') or '')=='VO10005870'),None)
          print('NODE_BEFORE='+json.dumps(node,ensure_ascii=False,separators=(',',':')))
          f=RealmFabricStore()
          if f.get_receipt(task_id) is None:
              f.queue_task('VO10005870', {
                  'schema':'agentos.node-task/v0.1',
                  'task_id':task_id,
                  'action':'desktop.session.inspect',
                  'cognition_ids_used':['demo://watchdog-after-uia/20261002'],
              })
          for _ in range(25):
              r=f.get_receipt(task_id)
              if r is not None:
                  print('RECEIPT='+json.dumps(r,ensure_ascii=False,separators=(',',':')))
                  raise SystemExit(0)
              time.sleep(1)
          print('PENDING='+json.dumps((f.load().get('tasks') or {}).get('VO10005870') or [],ensure_ascii=False,separators=(',',':')))
          raise SystemExit('watchdog_recovery_probe_no_receipt')
          PY
          REMOTE
