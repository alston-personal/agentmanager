name: Generate Mio Neutral Dress-Up Base

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-mio-neutral-base.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN }}
    steps:
      - name: Generate neutral technical base and open Studio Web PR
        shell: bash
        run: |
          set -euo pipefail
          read_hf_token_file() {
            python3 - "$1" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          if not p.is_file():
              raise SystemExit(0)
          for raw in p.read_text(encoding="utf-8").splitlines():
              line=raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key,value=line.split("=",1)
              if key.strip() in {"HF_TOKEN","HUGGINGFACE_TOKEN"}:
                  print(value.strip().strip('"').strip("'"))
                  break
          PY
          }
          if [ -z "${HF_TOKEN:-}" ]; then
            for TOKEN_FILE in /home/ubuntu/agentmanager/.env /home/ubuntu/.config/agentos/mio-tryon.env /home/ubuntu/.env; do
              VALUE="$(read_hf_token_file "$TOKEN_FILE" || true)"
              if [ -n "$VALUE" ]; then
                HF_TOKEN="$VALUE"
                echo "hf_token_source=$TOKEN_FILE"
                break
              fi
            done
          fi
          if [ -z "${HF_TOKEN:-}" ]; then
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
            PID="$(systemctl --user show -p MainPID --value agentos-mio-tryon-render-worker.service 2>/dev/null || true)"
            if [[ "$PID" =~ ^[1-9][0-9]*$ ]] && [ -r "/proc/$PID/environ" ]; then
              HF_TOKEN="$(python3 - "$PID" <<'PY'
          import sys
          raw=open(f"/proc/{sys.argv[1]}/environ","rb").read().split(b"\0")
          for row in raw:
              if row.startswith(b"HF_TOKEN=") or row.startswith(b"HUGGINGFACE_TOKEN="):
                  print(row.split(b"=",1)[1].decode("utf-8","ignore"))
                  break
          PY
          )"
              [ -n "${HF_TOKEN:-}" ] && echo "hf_token_source=running_tryon_worker"
            fi
          fi
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "hf_token_missing=FAIL checked local dotenv, AgentOS env file, and running worker" >&2
            exit 2
          fi
          export HF_TOKEN
          echo "::add-mask::$HF_TOKEN"
          WORK="$(mktemp -d /tmp/mio-neutral-base-XXXXXX)"
          trap 'rm -rf "$WORK"' EXIT
          SOURCE="$WORK/mio-source.webp"
          OUTPUT="$WORK/mio-base-v2.webp"

          if curl -kfsS --retry 3 --resolve studio.milkcat.org:443:127.0.0.1               "https://studio.milkcat.org/personas/mio/mio-avatar.webp?_=$GITHUB_RUN_ID"               -o "$SOURCE"; then
            echo "mio_source=local_nginx"
          else
            curl -fsS --retry 5 --retry-delay 2               "https://studio.milkcat.org/personas/mio/mio-avatar.webp?_=$GITHUB_RUN_ID"               -o "$SOURCE"
            echo "mio_source=public"
          fi
          test -s "$SOURCE"
          echo "mio_source_bytes=$(wc -c < "$SOURCE")"

          VENV="/home/ubuntu/.local/share/mio-tryon-venv"
          if [ ! -x "$VENV/bin/python" ]; then
            VENV="$WORK/venv"
            python3 -m venv "$VENV"
            "$VENV/bin/python" -m pip install --quiet --upgrade pip
            "$VENV/bin/python" -m pip install --quiet "gradio_client>=1.13,<3" "Pillow>=10,<13"
            echo "mio_tryon_venv=BOOTSTRAPPED"
          else
            echo "mio_tryon_venv=REUSED"
          fi
          "$VENV/bin/python" -c 'from gradio_client import Client, handle_file; from PIL import Image; print("mio_neutral_generator_imports=PASS")'
          "$VENV/bin/python" - "$SOURCE" "$OUTPUT" <<'PY'
          import inspect, os, pathlib, sys
          from gradio_client import Client, handle_file
          from PIL import Image

          source = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          token = (os.environ.get("HF_TOKEN") or "").strip()
          kwargs = {
              "download_files": True,
              "verbose": False,
              "httpx_kwargs": {"timeout": 420.0},
          }
          params = inspect.signature(Client).parameters
          if token:
              if "token" in params:
                  kwargs["token"] = token
              elif "hf_token" in params:
                  kwargs["hf_token"] = token

          instruction = (
              "Keep this exact woman as the same canonical character. Preserve her face, identity, hairstyle, "
              "hair color, body proportions, skin tone, neutral standing pose, camera angle, framing, lighting "
              "and plain studio background. Remove the current fashion outfit and accessories. Replace them with "
              "only a plain opaque modest virtual fitting technical base: fitted light-neutral crew-neck "
              "short-sleeve top plus matching fitted mid-thigh shorts. Barefoot. No shoes, no bag, no jewelry, "
              "no logos, no outerwear. This is a technical base garment, not underwear. No nudity. Keep her full "
              "body visible from head to toes. Photorealistic image only."
          )

          errors = []
          candidate = None
          for space_id in ("black-forest-labs/FLUX.1-Kontext-Dev", "mcp-tools/FLUX.1-Kontext-Dev"):
              try:
                  editor = Client(space_id, **kwargs)
                  result = editor.predict(
                      input_image=handle_file(str(source)),
                      prompt=instruction,
                      seed=0,
                      randomize_seed=False,
                      guidance_scale=2.5,
                      steps=22,
                      api_name="/infer",
                  )
                  raw = result[0] if isinstance(result, (list, tuple)) and result else result
                  if isinstance(raw, dict):
                      raw = raw.get("path") or raw.get("url")
                  if isinstance(raw, str) and raw:
                      candidate = raw
                      print(f"mio_neutral_editor={space_id}")
                      break
                  errors.append(f"{space_id}:unexpected_result:{result!r}"[:500])
              except Exception as exc:
                  errors.append(f"{space_id}:{type(exc).__name__}:{exc}"[:700])

          if not candidate:
              raise RuntimeError("all neutral-base editors failed: " + " | ".join(errors))
          img = Image.open(candidate).convert("RGB")
          if img.width < 512 or img.height < 768:
              raise RuntimeError(f"generated base too small: {img.width}x{img.height}")
          img.save(output, format="WEBP", quality=95, method=6)
          print(f"mio_neutral_base_generated=PASS size={img.width}x{img.height} bytes={output.stat().st_size}")
          PY
          test -s "$OUTPUT"

          REPO="$WORK/studio-web"
          gh repo clone alston-personal/studio-web "$REPO" -- --branch main --single-branch
          cd "$REPO"
          BRANCH="fix/mio-neutral-base-v2-$GITHUB_RUN_ID"
          git checkout -b "$BRANCH"
          cp "$OUTPUT" public/personas/mio/mio-base-v2.webp

          python3 - <<'PY'
          from pathlib import Path
          import re

          page = Path("src/pages/personas/mio/wardrobe/index.astro")
          text = page.read_text(encoding="utf-8")
          new = re.sub(
              r"const canonicalBaseData = 'data:image/webp;base64,[^']+';",
              "const canonicalBaseData = '/personas/mio/mio-base-v2.webp';",
              text,
              count=1,
          )
          if new == text:
              raise SystemExit("canonicalBaseData data URI pattern not found")
          new = new.replace(
              "目前顯示澪的中性技術基準身形",
              "目前顯示澪的中性技術底衣基準",
          ).replace(
              "起始狀態：澪的中性技術基準身形",
              "起始狀態：澪的中性技術底衣基準",
          ).replace(
              "人物窗格暫時保留中性技術基準身形",
              "人物窗格暫時保留中性技術底衣基準",
          ).replace(
              "試穿生成失敗；仍顯示中性技術基準身形",
              "試穿生成失敗；仍顯示中性技術底衣基準",
          )
          page.write_text(new, encoding="utf-8")

          profile = Path("src/data/mioPublicProfile.ts")
          p = profile.read_text(encoding="utf-8")
          p2 = p.replace("bodyAnchorVersion: 'mio-body-v1'", "bodyAnchorVersion: 'mio-body-v2-neutral-base'", 1)
          p2 = p2.replace("internalBodyReferenceVersion: 'mio-internal-body-v1'", "internalBodyReferenceVersion: 'mio-internal-body-v2-neutral-base'", 1)
          if p2 == p:
              raise SystemExit("body anchor version patterns not found")
          profile.write_text(p2, encoding="utf-8")
          PY

          git config user.name "AgentOS"
          git config user.email "agentos@milkcat.org"
          git add public/personas/mio/mio-base-v2.webp src/pages/personas/mio/wardrobe/index.astro src/data/mioPublicProfile.ts
          git commit -m "fix(mio): use neutral technical base for dress-up"
          git push origin "$BRANCH"

          PR_URL="$(gh pr create             --repo alston-personal/studio-web             --base main             --head "$BRANCH"             --title "fix(mio): use neutral technical base for dress-up"             --body "Use a dedicated modest neutral technical base image for Mio's dress-up studio. The initial state has no wardrobe items selected; selected garments render on top of this base. The base preserves Mio's canonical identity and proportions.")"
          echo "studio_pr=$PR_URL"
