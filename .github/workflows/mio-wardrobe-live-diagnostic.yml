name: Mio Wardrobe Live Diagnostic

on:
  pull_request:
    branches: [core/integration]
    paths: ['.github/workflows/mio-wardrobe-live-diagnostic.yml']

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect route ownership
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$(mktemp)"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' >"$out" 2>&1 <<'REMOTE' || true
          set -u
          echo '=== port 3000 owner ==='
          ss -ltnp '( sport = :3000 )' || true
          pids="$(fuser 3000/tcp 2>/dev/null || true)"
          for pid in $pids; do
            echo "PID=$pid"
            ps -fp "$pid" || true
            echo -n 'cwd='; readlink -f "/proc/$pid/cwd" || true
            echo -n 'cmd='; tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null; echo
            echo -n 'cgroup='; cat "/proc/$pid/cgroup" 2>/dev/null | tr '\n' ' '; echo
          done
          echo '=== pm2 ==='
          command -v pm2 >/dev/null && pm2 jlist 2>/dev/null | python3 -c 'import json,sys; a=json.load(sys.stdin); print([{"name":x.get("name"),"pid":x.get("pid"),"cwd":x.get("pm2_env",{}).get("pm_cwd"),"status":x.get("pm2_env",{}).get("status")} for x in a])' || true
          echo '=== dashboard unit ==='
          systemctl --user cat agentos-dashboard.service 2>/dev/null || true
          systemctl --user show agentos-dashboard.service -p ActiveState -p SubState -p MainPID -p ExecMainStartTimestamp -p FragmentPath 2>/dev/null || true
          echo '=== route files in dashboard cwd/repo ==='
          for root in /home/ubuntu/agentmanager/dashboard /home/ubuntu/agentmanager/apps /home/ubuntu/agentmanager /home/ubuntu/dashboard; do
            [ -d "$root" ] || continue
            echo "ROOT=$root"
            timeout 8s find "$root" -maxdepth 8 -type f 2>/dev/null | grep -E '/(api/)?wardrobe/|tryon|auth-handoff' | head -80 || true
          done
          echo '=== exact route text ==='
          timeout 10s grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next -E 'wardrobe/(catalog|tryon|auth-handoff)|mio-tryon-render' /home/ubuntu/agentmanager 2>/dev/null | head -120 || true
          echo '=== live probes ==='
          for path in /dashboard/api/wardrobe/catalog?characterId=sunlake-milkcat-ai-001 /dashboard/api/wardrobe/tryon/render /dashboard/api/wardrobe/auth-handoff?action=start /dashboard/api/auth/session; do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 5 "http://127.0.0.1:3000$path" || true)"
            echo "$code $path :: $(head -c 220 /tmp/body 2>/dev/null | tr '\n' ' ')"
          done
          REMOTE
          cat "$out"
          { echo '### Mio Wardrobe route ownership'; echo; echo '```text'; cat "$out"; echo '```'; } >/tmp/diag.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /tmp/diag.md