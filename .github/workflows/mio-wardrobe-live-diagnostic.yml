name: Mio Wardrobe Live Diagnostic

on:
  pull_request:
    branches: [core/integration]
    paths: ['.github/workflows/mio-wardrobe-live-diagnostic.yml']

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect current production wardrobe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$(mktemp)"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' >"$out" 2>&1 <<'REMOTE' || true
          set -u
          echo '=== runtime ==='
          echo "live=$(readlink -f /home/ubuntu/agent-data/runtime/dashboard/current 2>/dev/null || true)"
          ss -H -ltnp 'sport = :3000' || true
          pid="$(ss -H -ltnp 'sport = :3000' 2>/dev/null | grep -oE 'pid=[0-9]+' | cut -d= -f2 | sort -u || true)"
          if [[ "$pid" =~ ^[0-9]+$ ]]; then echo "pid=$pid cwd=$(readlink -f /proc/$pid/cwd 2>/dev/null || true)"; fi
          systemctl --user show agentos-dashboard.service -p ActiveState -p SubState -p MainPID --no-pager || true
          echo '=== routes ==='
          for spec in '/dashboard/api/wardrobe/catalog?characterId=sunlake-milkcat-ai-001' '/dashboard/api/wardrobe/tryon/render' '/dashboard/api/wardrobe/intake'; do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 6 "http://127.0.0.1:3000$spec" || true)"
            echo "$code $spec :: $(head -c 220 /tmp/body 2>/dev/null | tr '\n' ' ')"
          done
          echo '=== latest jobs ==='
          find /home/ubuntu/agent-data/projects/dressup-simulator/render_jobs/runtime -maxdepth 1 -type f -name '*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -3 | cut -d' ' -f2- | while read -r j; do
            python3 - "$j" <<'PY'
          import json,sys,os
          j=json.load(open(sys.argv[1],encoding='utf-8'))
          print(os.path.basename(sys.argv[1]),j.get('status'),j.get('requestedAt'),(j.get('error') or {}).get('message'))
          PY
          done
          REMOTE
          cat "$out"
          { echo '### Mio Wardrobe production state'; echo; echo '```text'; cat "$out"; echo '```'; } >/tmp/diag.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /tmp/diag.md