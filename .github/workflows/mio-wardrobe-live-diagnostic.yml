name: Mio Wardrobe Live Diagnostic

on:
  pull_request:
    branches: [core/integration]
    paths:
      - '.github/workflows/mio-wardrobe-live-diagnostic.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect live wardrobe try-on path
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$(mktemp)"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' >"$out" 2>&1 <<'REMOTE' || true
          set -u
          echo '=== host/time ==='
          hostname; date -Is; uptime
          echo '=== route probes ==='
          for url in \
            'https://studio.milkcat.org/dashboard/api/wardrobe/catalog?characterId=sunlake-milkcat-ai-001' \
            'https://studio.milkcat.org/dashboard/api/wardrobe/tryon/render' \
            'https://studio.milkcat.org/dashboard/api/auth/session'
          do
            code="$(curl -ksS -o /tmp/mio-probe-body -w '%{http_code}' --max-time 12 "$url" || true)"
            echo "$code $url"
            head -c 300 /tmp/mio-probe-body 2>/dev/null | tr '\n' ' '; echo
          done
          echo '=== services ==='
          systemctl --no-pager --type=service --all 2>/dev/null | grep -Ei 'agentos|studio|dashboard|wardrobe|try.?on|render' | head -100 || true
          systemctl --user --no-pager --type=service --all 2>/dev/null | grep -Ei 'agentos|studio|dashboard|wardrobe|try.?on|render' | head -100 || true
          echo '=== source hits ==='
          for root in /home/ubuntu/agentmanager /home/ubuntu/agent-data /opt /srv /var/www; do
            [ -d "$root" ] || continue
            timeout 10s grep -RIl --exclude-dir=.git --exclude-dir=node_modules --exclude='*.log' -E 'wardrobe/tryon/render|tryon-render-job|renderer_failed|ready_for_tryon' "$root" 2>/dev/null | head -30 || true
          done | sort -u
          echo '=== recent evidence ==='
          journalctl --since '8 hours ago' --no-pager 2>/dev/null | grep -Ei 'wardrobe|try.?on|renderer|render job|provider|hugging|replicate|fal|image.*generation' | tail -220 || true
          echo 'mio_wardrobe_live_diagnostic=PASS'
          REMOTE
          cat "$out"
          {
            echo '### Mio Wardrobe live diagnostic'
            echo
            echo '```text'
            tail -n 450 "$out"
            echo '```'
          } > /tmp/diag-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /tmp/diag-comment.md