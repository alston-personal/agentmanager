name: Mio Wardrobe Live Diagnostic

on:
  pull_request:
    branches: [core/integration]
    paths: ['.github/workflows/mio-wardrobe-live-diagnostic.yml']

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect wardrobe data contracts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$(mktemp)"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' >"$out" 2>&1 <<'REMOTE' || true
          set -u
          ROOT=/home/ubuntu/agent-data/projects/dressup-simulator
          echo '=== dressup files ==='
          find "$ROOT" -maxdepth 3 -type f 2>/dev/null | sort | head -120 || true
          echo '=== recent jobs ==='
          find "$ROOT/render_jobs/runtime" -maxdepth 1 -type f -name '*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -8 | cut -d' ' -f2- || true
          recent="$(find "$ROOT/render_jobs/runtime" -maxdepth 1 -type f -name '*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)"
          if [ -n "$recent" ]; then echo '=== latest job ==='; cat "$recent"; fi
          echo '=== candidate catalog-like json ==='
          for f in $(find "$ROOT" /home/ubuntu/agent-data -maxdepth 5 -type f -name '*.json' 2>/dev/null | grep -Ei 'wardrobe|garment|catalog|outfit' | head -30); do
            echo "--- $f"; head -c 3000 "$f"; echo
          done
          echo '=== auth route filenames ==='
          find /home/ubuntu/agentmanager/dashboard/app/api/auth -maxdepth 5 -type f 2>/dev/null | sort || true
          REMOTE
          cat "$out"
          { echo '### Mio Wardrobe data contracts'; echo; echo '```text'; cat "$out"; echo '```'; } >/tmp/diag.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /tmp/diag.md