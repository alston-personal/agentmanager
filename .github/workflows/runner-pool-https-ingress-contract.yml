name: Runner Pool HTTPS Ingress Contract

on:
  push:
    branches: [feat/runner-pool-https-ingress-20261002, core/integration]
    paths:
      - 'agent_core/realm_server.py'
      - 'agent_core/runner_window.py'
      - 'agentos_node/bootstrap_control.py'
      - 'dashboard/app/api/agentos/**'
      - 'scripts/agentos_dispatch.sh'
      - 'tests/test_runner_pool_https_ingress.py'
      - 'tests/test_runner_window.py'
      - 'tests/test_universal_agentos_dispatch.py'
      - 'tests/test_runner_pool_workflow_cutover.py'
      - '.github/workflows/oracle-social-runtime-rollout.yml'
      - '.github/workflows/oracle-publish-mio-approved.yml'
  pull_request:
    branches: [core/integration]
    paths:
      - 'agent_core/realm_server.py'
      - 'agentos_node/bootstrap_control.py'
      - 'dashboard/app/api/agentos/**'
      - 'tests/test_runner_pool_https_ingress.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet pytest
      - run: python3 -m pytest -q tests/test_runner_pool_https_ingress.py tests/test_realm_scheduler_oidc.py tests/test_runner_pool_workflow_cutover.py tests/test_runner_window.py tests/test_universal_agentos_dispatch.py
      - run: bash -n scripts/agentos_dispatch.sh
