name: Oracle Guard Backup Mount

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/oracle-guard-backup-mount.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Install fail-closed backup wrapper
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$ORACLE_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cat > "$HOME/backup_agentos_guarded.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if ! mountpoint -q "$HOME/gdrive"; then
            echo "$(date -Is) backup_refused=gdrive_not_mounted" >&2
            exit 42
          fi
          exec "$HOME/backup_agentos.sh"
          SH
          chmod 700 "$HOME/backup_agentos_guarded.sh"
          current="$(crontab -l 2>/dev/null || true)"
          updated="$(printf '%s\n' "$current" | sed 's#0 3 \* \* \* /home/[^ ]*/backup_agentos\.sh#0 3 * * * /home/ubuntu/backup_agentos_guarded.sh#')"
          printf '%s\n' "$updated" | crontab -
          crontab -l | grep -F 'backup_agentos_guarded.sh'
          echo 'backup_mount_guard=PASS'
          REMOTE
