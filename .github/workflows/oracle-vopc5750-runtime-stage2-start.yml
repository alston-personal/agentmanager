name: Oracle vopc5750 Runtime Stage2 Start
# Formal Node Golden Path acceptance against the live generation-5 runtime authority.

on:
  push:
    branches:
      - feature/realm-node-fabric-readiness
    paths:
      - '.github/workflows/oracle-vopc5750-runtime-stage2-start.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      TARGET_RUNTIME_COMMIT: e50e0fab411eb5c05e5aaa4f866e7282fcb04045
      LIVE_CORE_RELEASE: /home/ubuntu/.local/share/agentos/realm-fabric/releases/e50e0fab411eb5c05e5aaa4f866e7282fcb04045
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/realm-node-fabric-readiness
          fetch-depth: 1

      - name: Verify exact managed runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          test -d "$LIVE_CORE_RELEASE/agent_core"
          PYTHONPATH="$LIVE_CORE_RELEASE" python3 - <<'PY'
          import json,os
          from pathlib import Path
          from agent_core.controller_api import ControllerService
          from agent_core.realm_fabric import RealmFabricStore
          ref=os.environ['TARGET_RUNTIME_COMMIT']
          state=json.loads(Path('/home/ubuntu/agent-data/governance/core-deployment.json').read_text(encoding='utf-8'))
          assert int(state.get('deployment_generation') or 0)==5,state
          assert state.get('desired_core_commit')==ref and state.get('observed_core_commit')==ref,state
          assert state.get('deployment_status')=='converged' and state.get('lease_status')=='released',state
          controller=ControllerService(RealmFabricStore())
          node=controller.node('vopc5750')
          runtime=node.get('runtime') or {}
          roots=node.get('workspace_roots') or {}
          assert node.get('status')=='online',node
          assert runtime.get('source_commit')==ref,node
          assert node.get('runtime_status')=='converged',node
          assert isinstance(roots.get('readable'),list) and roots['readable'],node
          print(json.dumps({'node':node,'deployment':state},ensure_ascii=False,indent=2,sort_keys=True))
          print('stage2_managed_runtime_baseline=PASS')
          PY

      - name: Persist discovery and readiness regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$LIVE_CORE_RELEASE" python3 - <<'PY'
          import json,time
          from agent_core.controller_api import ControllerService
          from agent_core.realm_fabric import RealmFabricStore
          from agent_core.node_registry import NodeRegistry

          node='vopc5750'
          store=RealmFabricStore()
          controller=ControllerService(store)
          observed=controller.node(node)
          roots=observed.get('workspace_roots') or {}
          cwd=(roots.get('readable') or [None])[0]
          if not cwd:
              raise SystemExit('missing workspace authority')

          def wait_receipt(task_id, attempts=60):
              for _ in range(attempts):
                  receipt=store.get_receipt(task_id)
                  if receipt:
                      return receipt
                  time.sleep(2)
              raise SystemExit(f'receipt timeout: {task_id}')

          discovery_id='golden-discovery-'+str(int(time.time()))
          store.queue_task(node,{
              'schema':'agentos.node-task/v0.1',
              'task_id':discovery_id,
              'action':'agent.surface.inspect',
              'cognition_ids_used':[],
          })
          discovery=wait_receipt(discovery_id,30)
          print('golden_discovery_receipt='+json.dumps(discovery,ensure_ascii=False,sort_keys=True))
          if discovery.get('ok') is not True or discovery.get('action')!='agent.surface.inspect':
              raise SystemExit('golden discovery failed')
          if not isinstance(discovery.get('surface_inventory'),dict):
              raise SystemExit('golden discovery missing surface inventory')
          print('golden_discovery=PASS')

          verify_id='golden-readiness-'+str(int(time.time()))
          ps=r'''$ErrorActionPreference='Stop'
          $launcher=Join-Path $env:LOCALAPPDATA 'AgentOS\agentos-client.cmd'
          if(-not (Test-Path $launcher)){ throw "missing launcher: $launcher" }
          & $launcher verify
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          '''
          store.queue_task(node,{
              'schema':'agentos.node-task/v0.1',
              'task_id':verify_id,
              'action':'shell.exec',
              'executable':'powershell',
              'argv':['-NoProfile','-NonInteractive','-Command',ps],
              'cwd':cwd,
              'timeout_seconds':120,
              'cognition_ids_used':[],
          })
          readiness=wait_receipt(verify_id,75)
          print('golden_readiness_receipt='+json.dumps(readiness,ensure_ascii=False,sort_keys=True))
          if readiness.get('ok') is not True or int(readiness.get('returncode') or 0)!=0:
              raise SystemExit('agentos-client verify failed')

          observed=None
          for _ in range(45):
              observed=next((n for n in NodeRegistry().node_map().get('nodes',[]) if n.get('node_id')==node),None)
              benchmark=(observed or {}).get('benchmark') or {}
              if benchmark.get('schema')=='agentos.one-uplift-report/v0.1' and benchmark.get('report_kind')=='readiness-regression':
                  break
              time.sleep(2)
          benchmark=(observed or {}).get('benchmark') or {}
          print('golden_benchmark='+json.dumps(benchmark,ensure_ascii=False,sort_keys=True))
          if benchmark.get('schema')!='agentos.one-uplift-report/v0.1':
              raise SystemExit('readiness benchmark not persisted')
          if benchmark.get('report_kind')!='readiness-regression':
              raise SystemExit('unexpected benchmark kind')
          if benchmark.get('node_ready') is not True:
              raise SystemExit('node_ready is not true')
          lifecycle=benchmark.get('lifecycle') or {}
          if lifecycle.get('supervisor_ready') is not True:
              raise SystemExit('lifecycle supervisor is not ready')
          if benchmark.get('regressed_dimensions') != 0:
              raise SystemExit('readiness regression detected')
          runtime=(observed or {}).get('runtime') or {}
          if runtime.get('source_commit')!='e50e0fab411eb5c05e5aaa4f866e7282fcb04045':
              raise SystemExit('runtime authority drifted during readiness acceptance')
          print('golden_readiness_regression=PASS')
          print('golden_benchmark_persisted=PASS')
          print('node_ready=true')
          PY
