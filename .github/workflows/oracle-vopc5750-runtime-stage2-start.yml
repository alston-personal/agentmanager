name: Oracle vopc5750 Runtime Stage2 Start

on:
  push:
    branches:
      - feature/realm-node-fabric-readiness
    paths:
      - '.github/workflows/oracle-vopc5750-runtime-stage2-start.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/realm-node-fabric-readiness
          fetch-depth: 1
      - name: Activate staged Thin Client
        shell: bash
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          REF=$(git rev-parse HEAD)
          python3 - "$REF" <<'PY' >/tmp/vopc5750-stage2-task.txt
          import sys,time
          from agent_core.realm_fabric import RealmFabricStore
          ref=sys.argv[1]
          node='vopc5750'
          tid='runtime-stage2-start-'+node+'-'+str(int(time.time()))
          ps=r'''$ErrorActionPreference='Stop'
          $install=Join-Path $env:LOCALAPPDATA 'AgentOS'
          $taskName='AgentOS Thin Client'
          $watchdogName='AgentOS Thin Client Watchdog'
          Get-ScheduledTask -TaskName $taskName -ErrorAction Stop | Out-Null
          Get-ScheduledTask -TaskName $watchdogName -ErrorAction Stop | Out-Null

          $prov=[ordered]@{
            schema='agentos.thin-client-runtime/v0.1'
            source_ref='feature/realm-node-fabric-readiness'
            source_commit='REF'
            installed_at=(Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            install_mode='stage2-deferred-restart'
          }
          $json=$prov | ConvertTo-Json
          [System.IO.File]::WriteAllText((Join-Path $install 'runtime-provenance.json'),$json,(New-Object System.Text.UTF8Encoding($false)))

          $restart="Start-Sleep -Seconds 5; Stop-ScheduledTask -TaskName '$taskName' -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2; Start-ScheduledTask -TaskName '$taskName'"
          Start-Process powershell.exe -WindowStyle Hidden -ArgumentList @('-NoProfile','-NonInteractive','-Command',$restart)
          Write-Output 'agentos_runtime_stage2_start=PASS'
          Write-Output 'agentos_restart=deferred-stop-start'
          Write-Output 'agentos_watchdog_preserved=PASS'
          Write-Output 'agentos_source_commit=REF'
          '''.replace('REF',ref)
          task={'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':'powershell','argv':['-NoProfile','-NonInteractive','-Command',ps],'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':20,'cognition_ids_used':[]}
          RealmFabricStore().queue_task(node,task)
          print(tid)
          PY
      - name: Wait for start receipt and exact converged heartbeat
        shell: bash
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          TASK=$(cat /tmp/vopc5750-stage2-task.txt)
          REF=$(git rev-parse HEAD)
          for i in $(seq 1 75); do
            python3 - "$TASK" "$REF" <<'PY' && exit 0 || true
          import json,sys
          from agent_core.realm_fabric import RealmFabricStore
          from agent_core.node_registry import NodeRegistry
          task,ref=sys.argv[1:3]
          r=RealmFabricStore().get_receipt(task)
          if not r or r.get('ok') is not True or int(r.get('returncode') or 0)!=0:
              raise SystemExit(1)
          if 'agentos_runtime_stage2_start=PASS' not in str(r.get('stdout') or ''):
              raise SystemExit(1)
          node=next((n for n in NodeRegistry().node_map().get('nodes',[]) if n.get('node_id')=='vopc5750'),None)
          if not node or node.get('status')!='online':
              raise SystemExit(1)
          caps=set(node.get('capabilities') or [])
          runtime=node.get('runtime') or {}
          ok=(
              'agent.surface.inspect' in caps
              and 'node.runtime.converge' in caps
              and runtime.get('source_commit') == ref
          )
          if ok:
              print(json.dumps({'receipt':r,'node':node},ensure_ascii=False,indent=2,sort_keys=True))
              raise SystemExit(0)
          raise SystemExit(1)
          PY
            sleep 2
          done
          echo 'stage2 exact heartbeat convergence timeout' >&2
          exit 1

      - name: Persist discovery and readiness regression
        shell: bash
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          from agent_core.node_registry import NodeRegistry

          node='vopc5750'
          store=RealmFabricStore()

          def wait_receipt(task_id, attempts=60):
              for _ in range(attempts):
                  receipt=store.get_receipt(task_id)
                  if receipt:
                      return receipt
                  time.sleep(2)
              raise SystemExit(f'receipt timeout: {task_id}')

          discovery_id='golden-discovery-'+str(int(time.time()))
          store.queue_task(node,{
              'schema':'agentos.node-task/v0.1',
              'task_id':discovery_id,
              'action':'agent.surface.inspect',
              'cognition_ids_used':[],
          })
          discovery=wait_receipt(discovery_id,30)
          print('golden_discovery_receipt='+json.dumps(discovery,ensure_ascii=False,sort_keys=True))
          if discovery.get('ok') is not True or discovery.get('action')!='agent.surface.inspect':
              raise SystemExit('golden discovery failed')
          if not isinstance(discovery.get('surface_inventory'),dict):
              raise SystemExit('golden discovery missing surface inventory')
          print('golden_discovery=PASS')

          verify_id='golden-readiness-'+str(int(time.time()))
          ps=r'''$ErrorActionPreference='Stop'
          $launcher=Join-Path $env:LOCALAPPDATA 'AgentOS\agentos-client.cmd'
          if(-not (Test-Path $launcher)){ throw "missing launcher: $launcher" }
          & $launcher verify
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          '''
          store.queue_task(node,{
              'schema':'agentos.node-task/v0.1',
              'task_id':verify_id,
              'action':'shell.exec',
              'executable':'powershell',
              'argv':['-NoProfile','-NonInteractive','-Command',ps],
              'cwd':r'C:\Users\alston.huang\AgentOS',
              'timeout_seconds':90,
              'cognition_ids_used':[],
          })
          readiness=wait_receipt(verify_id,60)
          print('golden_readiness_receipt='+json.dumps(readiness,ensure_ascii=False,sort_keys=True))
          if readiness.get('ok') is not True or int(readiness.get('returncode') or 0)!=0:
              raise SystemExit('agentos-client verify failed')

          observed=None
          for _ in range(30):
              observed=next((n for n in NodeRegistry().node_map().get('nodes',[]) if n.get('node_id')==node),None)
              benchmark=(observed or {}).get('benchmark') or {}
              if benchmark.get('schema')=='agentos.one-uplift-report/v0.1' and benchmark.get('report_kind')=='readiness-regression':
                  break
              time.sleep(2)
          benchmark=(observed or {}).get('benchmark') or {}
          print('golden_benchmark='+json.dumps(benchmark,ensure_ascii=False,sort_keys=True))
          if benchmark.get('schema')!='agentos.one-uplift-report/v0.1':
              raise SystemExit('readiness benchmark not persisted')
          if benchmark.get('report_kind')!='readiness-regression':
              raise SystemExit('unexpected benchmark kind')
          if benchmark.get('node_ready') is not True:
              raise SystemExit('node_ready is not true')
          lifecycle=benchmark.get('lifecycle') or {}
          if lifecycle.get('supervisor_ready') is not True:
              raise SystemExit('lifecycle supervisor is not ready')
          if benchmark.get('regressed_dimensions') != 0:
              raise SystemExit('readiness regression detected')
          print('golden_readiness_regression=PASS')
          print('golden_benchmark_persisted=PASS')
          print('node_ready=true')
          PY
