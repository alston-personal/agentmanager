name: VOPC5750 Semantic Hotpatch 20261008

on:
  push:
    branches:
      - ops/vopc5750-semantic-hotpatch-20261008
    paths:
      - '.github/workflows/vopc5750-semantic-hotpatch-20261008.yml'

permissions:
  contents: read

jobs:
  hotpatch:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 6
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
    steps:
      - uses: actions/checkout@v4

      - name: Patch current runtime through governed shell.exec
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,uuid
          from agent_core.realm_fabric import RealmFabricStore

          patch_code = r'''
          import json, os, signal, subprocess, sys, urllib.request
          from pathlib import Path

          install = Path(os.environ["LOCALAPPDATA"]) / "AgentOS"
          try:
              root = Path((install / "current-runtime.txt").read_text(encoding="ascii").strip())
              pointer_source = "current-runtime.txt"
          except Exception:
              accepted = sorted(
                  (install / "accepted-runtimes").glob("*.txt"),
                  key=lambda p: p.stat().st_mtime,
                  reverse=True,
              )
              if not accepted:
                  raise
              root = Path(accepted[0].read_text(encoding="ascii").strip())
              pointer_source = accepted[0].name

          url = "https://raw.githubusercontent.com/alston-personal/agentmanager/532de5f98ec5295eadac9fc6bfadcbbb8051a9e5/agentos_node/semantic_preview.py"
          data = urllib.request.urlopen(url, timeout=20).read()
          target = root / "agentos_node" / "semantic_preview.py"
          tmp = target.with_suffix(".py.new")
          tmp.write_bytes(data)
          os.replace(tmp, target)

          parent_pid = os.getppid()
          restart_code = (
              "import os,signal,time;"
              "time.sleep(5);"
              f"os.kill({parent_pid}, signal.SIGTERM)"
          )
          flags = subprocess.DETACHED_PROCESS | subprocess.CREATE_NO_WINDOW
          subprocess.Popen(
              [sys.executable, "-c", restart_code],
              creationflags=flags,
              close_fds=True,
          )
          print(json.dumps({
              "patched": str(target),
              "bytes": len(data),
              "runtime_root": str(root),
              "pointer_source": pointer_source,
              "restart_parent_pid": parent_pid,
          }))
          '''

          task_id='task-semantic-hotpatch-'+uuid.uuid4().hex
          fabric=RealmFabricStore()
          fabric.queue_task('vopc5750',{
              'schema':'agentos.node-task/v0.1',
              'task_id':task_id,
              'action':'shell.exec',
              'executable':'python',
              'argv':['-c',patch_code],
              'cwd':r'C:\Users\alston.huang\AgentOS',
              'timeout_seconds':45,
          })

          receipt=None
          deadline=time.time()+60
          while time.time()<deadline:
              receipt=fabric.get_receipt(task_id)
              if receipt:
                  break
              time.sleep(1)
          print(json.dumps(receipt,indent=2,sort_keys=True))
          assert receipt, 'HOTPATCH_RECEIPT_TIMEOUT'
          assert receipt.get('ok') is True, receipt
          assert receipt.get('returncode') == 0, receipt
          stdout=str(receipt.get('stdout') or '')
          assert '"patched"' in stdout, receipt
          print('SEMANTIC_HOTPATCH_RECEIPT=PASS')
          PY

      - name: Wait for supervised client restart
        shell: bash
        run: sleep 15

      - name: Verify fresh heartbeat after restart
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from agent_core.node_registry import NodeRegistry
          data=NodeRegistry().node_map()
          node=next((n for n in data.get('nodes',[]) if n.get('node_id')=='vopc5750'),None)
          print(json.dumps(node,indent=2,sort_keys=True))
          assert node and node.get('status')=='online', node
          assert float(node.get('heartbeat_age_seconds') or 9999) < 30, node
          print('POST_HOTPATCH_HEARTBEAT=PASS')
          PY

      - name: Probe isolated semantic preview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,uuid
          from agent_core.realm_fabric import RealmFabricStore

          fabric=RealmFabricStore()
          task_id='task-semantic-isolated-'+uuid.uuid4().hex
          fabric.queue_task('vopc5750',{
              'schema':'agentos.node-task/v0.1',
              'task_id':task_id,
              'action':'desktop.semantic_preview',
              'max_pixels':160000,
              'timeout_seconds':8,
          })

          receipt=None
          deadline=time.time()+25
          while time.time()<deadline:
              receipt=fabric.get_receipt(task_id)
              if receipt:
                  break
              time.sleep(1)

          store=fabric.load()
          queue=list((store.get('tasks') or {}).get('vopc5750') or [])
          record=next((x for x in queue if isinstance(x,dict) and x.get('task_id')==task_id),None)
          print(json.dumps({'receipt':receipt,'queue_record':record},indent=2,sort_keys=True))
          assert receipt, 'ISOLATED_SEMANTIC_RECEIPT_TIMEOUT'
          if receipt.get('ok') is not True:
              error=str(receipt.get('error') or '')
              assert 'semantic preview worker' in error, receipt
              print('SEMANTIC_WORKER_BOUNDED_FAILURE=PASS')
          else:
              assert receipt.get('read_only') is True, receipt
              assert receipt.get('worker',{}).get('isolated') is True, receipt
              print('SEMANTIC_PREVIEW_ISOLATED=PASS')
          PY
