name: Inspect Realm Readiness Boundary

on:
  push:
    branches:
      - feature/realm-node-fabric-readiness
    paths:
      - '.github/workflows/inspect-readiness-boundary.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect cross-user runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          echo '=== runner identity ==='
          id
          echo '=== spool ==='
          namei -l /home/ubuntu/agent-data/runtime/antigravity-relay || true
          find /home/ubuntu/agent-data/runtime/antigravity-relay -maxdepth 2 -printf '%M %u %g %p\n' 2>/dev/null | head -80 || true
          echo '=== ACL ==='
          command -v getfacl >/dev/null && getfacl -p /home/ubuntu/agent-data/runtime/antigravity-relay /home/ubuntu/agent-data/runtime/antigravity-relay/inbox /home/ubuntu/agent-data/runtime/antigravity-relay/processing /home/ubuntu/agent-data/runtime/antigravity-relay/receipts || true
          echo '=== relay process ==='
          ps -eo pid,user,group,supgrp,args | grep antigravity_relay_worker | grep -v grep || true
          echo '=== ONE process ==='
          ps -eo pid,user,group,supgrp,args | grep 'agent_core.realm_cli serve' | grep -v grep || true
          echo '=== ubuntu user unit files ==='
          cat /home/ubuntu/.config/systemd/user/agentos-antigravity-relay.service 2>/dev/null || true
          cat /home/ubuntu/.config/systemd/user/agentos-realm-fabric.service 2>/dev/null || true
          echo '=== writable probes ==='
          test -w /home/ubuntu/agent-data/runtime/antigravity-relay/inbox && echo inbox_write=YES || echo inbox_write=NO
          test -w /home/ubuntu/agent-data/runtime/antigravity-relay/processing && echo processing_write=YES || echo processing_write=NO
          test -w /home/ubuntu/agent-data/runtime/antigravity-relay/receipts && echo receipts_write=YES || echo receipts_write=NO
