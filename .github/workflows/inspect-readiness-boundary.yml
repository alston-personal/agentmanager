name: Inspect Realm Readiness Boundary

on:
  push:
    branches:
      - feature/realm-node-fabric-readiness
    paths:
      - '.github/workflows/inspect-readiness-boundary.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - name: Verify live ONE generation
        shell: bash
        run: |
          set -euo pipefail
          id
          health=$(curl -fsS --max-time 3 http://127.0.0.1:8780/v1/health)
          echo "ONE_HEALTH=$health"
          bootstrap=$(curl -sS -o /tmp/agentos-bootstrap-body -w '%{http_code}' --max-time 3 'http://127.0.0.1:8780/v1/bootstrap?node_id=vopc5750')
          benchmark=$(curl -sS -o /tmp/agentos-benchmark-body -w '%{http_code}' --max-time 3 -X POST -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:8780/v1/benchmark)
          test "$bootstrap" = 401
          test "$benchmark" = 401
          echo one_bootstrap_route=PASS
          echo one_benchmark_route=PASS
          ps -eo pid,user,group,supgrp,args | grep antigravity_relay_worker | grep -v grep

      - name: Probe headless executor providers
        shell: bash
        run: |
          set +e
          echo '=== embedded claude ==='
          CLAUDE=$(find /home/ubuntu/.antigravity-ide-server/extensions -path '*/resources/native-binary/claude' -type f | sort -V | tail -1)
          echo "claude=$CLAUDE"
          timeout 10s "$CLAUDE" --version
          echo "claude_version_exit=$?"
          timeout 20s "$CLAUDE" --print --output-format text --effort low --no-session-persistence --dangerously-skip-permissions 'Return exactly AGENTOS_CLAUDE_SMOKE_PASS'
          echo "claude_model_exit=$?"

          echo '=== agy ==='
          command -v agy || true
          timeout 30s agy run --task 'Return exactly AGENTOS_AGY_SMOKE_PASS' --workspace /home/ubuntu/agentmanager
          echo "agy_exit=$?"
          set -e

      - name: Verify cross-user relay transport only
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time
          from agentos_node.antigravity_relay import AntigravityRelayClient
          client = AntigravityRelayClient('/home/ubuntu/agent-data/runtime/antigravity-relay')
          capsule = client.submit(
              project_id='realm-readiness-transport-smoke',
              canonical_ir={'goal':'Prove cross-user relay transport and receipt production.'},
              instruction='Return exactly AGENTOS_RELAY_TRANSPORT_PASS. Do not modify state.',
              workspace='/home/ubuntu/agentmanager',
          )
          cid=capsule['capsule_id']
          print('capsule_id='+cid)
          for _ in range(115):
              receipt=client.receipt(cid)
              if receipt:
                  print(json.dumps(receipt, indent=2, ensure_ascii=False))
                  encoded=json.dumps(receipt, ensure_ascii=False)
                  if 'PermissionError' in encoded or 'Permission denied' in encoded:
                      raise SystemExit('cross-user permission regression')
                  print('cross_user_transport_receipt=PASS')
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('transport receipt timeout')
          PY

      - name: Inspect first-node registry freshness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/home/ubuntu/agent-data/realm/nodes.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          nodes = data.get('nodes') or {}
          node = nodes.get('vopc5750') if isinstance(nodes, dict) else None
          if node is None and isinstance(nodes, list):
              node = next((item for item in nodes if item.get('node_id') == 'vopc5750'), None)
          print(json.dumps({'vopc5750': node}, indent=2, ensure_ascii=False))
          if not node:
              raise SystemExit('vopc5750 missing from registry')
          print('vopc_reported_status=' + str(node.get('reported_status') or node.get('status')))
          print('vopc_effective_status=' + str(node.get('effective_status') or node.get('status')))
          print('vopc_last_heartbeat=' + str(node.get('last_heartbeat_at') or node.get('last_heartbeat')))
          PY
