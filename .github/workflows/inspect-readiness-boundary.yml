name: Inspect Realm Readiness Boundary

on:
  push:
    branches:
      - feature/realm-node-fabric-readiness
    paths:
      - '.github/workflows/inspect-readiness-boundary.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect cross-user runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          echo '=== runner identity ==='
          id
          echo '=== spool ==='
          namei -l /home/ubuntu/agent-data/runtime/antigravity-relay || true
          find /home/ubuntu/agent-data/runtime/antigravity-relay -maxdepth 2 -printf '%M %u %g %p\n' 2>/dev/null | head -80 || true
          echo '=== relay runtime ==='
          namei -l /home/ubuntu/.local/share/agentos/runtime-vnext/agentos_node/antigravity_relay_worker.py 2>/dev/null || true
          stat -c '%A %U %G %a %n' /home/ubuntu/.local/share/agentos/runtime-vnext /home/ubuntu/.local/share/agentos/runtime-vnext/agentos_node /home/ubuntu/.local/share/agentos/runtime-vnext/agentos_node/antigravity_relay_worker.py 2>/dev/null || true
          test -w /home/ubuntu/.local/share/agentos/runtime-vnext/agentos_node/antigravity_relay_worker.py && echo runtime_worker_write=YES || echo runtime_worker_write=NO
          echo '=== ACL tooling ==='
          command -v getfacl || true
          command -v setfacl || true
          echo '=== relay process ==='
          ps -eo pid,user,group,supgrp,args | grep antigravity_relay_worker | grep -v grep || true
          echo '=== action relay process ==='
          ps -eo pid,user,group,supgrp,args | grep action_relay | grep -v grep || true
          echo '=== ONE process ==='
          ps -eo pid,user,group,supgrp,args | grep 'agent_core.realm_cli serve' | grep -v grep || true
          echo '=== ubuntu user unit files ==='
          stat -c '%A %U %G %a %n' /home/ubuntu/.config/systemd/user /home/ubuntu/.config/systemd/user/agentos-antigravity-relay.service 2>/dev/null || true
          cat /home/ubuntu/.config/systemd/user/agentos-antigravity-relay.service 2>/dev/null || true
          cat /home/ubuntu/.config/systemd/user/agentos-action-relay.service 2>/dev/null || true
          cat /home/ubuntu/.config/systemd/user/agentos-realm-fabric.service 2>/dev/null || true
          echo '=== writable probes ==='
          for p in /home/ubuntu/.config/systemd/user /home/ubuntu/.config/systemd/user/agentos-antigravity-relay.service /home/ubuntu/agent-data/runtime/antigravity-relay/inbox /home/ubuntu/agent-data/runtime/antigravity-relay/processing /home/ubuntu/agent-data/runtime/antigravity-relay/receipts; do
            test -w "$p" && echo "write=YES $p" || echo "write=NO $p"
          done
