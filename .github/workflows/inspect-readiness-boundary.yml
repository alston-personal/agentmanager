name: Inspect Realm Readiness Boundary

on:
  push:
    branches:
      - feature/realm-node-fabric-readiness
    paths:
      - '.github/workflows/inspect-readiness-boundary.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect cross-user runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          echo '=== runner identity ==='
          id
          echo '=== spool ==='
          namei -l /home/ubuntu/agent-data/runtime/antigravity-relay || true
          echo '=== relay runtime ==='
          stat -c '%A %U %G %a %n' /home/ubuntu/.local/share/agentos/runtime-vnext /home/ubuntu/.local/share/agentos/runtime-vnext/agentos_node /home/ubuntu/.local/share/agentos/runtime-vnext/agentos_node/antigravity_relay_worker.py 2>/dev/null || true
          test -w /home/ubuntu/.local/share/agentos/runtime-vnext/agentos_node/antigravity_relay_worker.py && echo runtime_worker_write=YES || echo runtime_worker_write=NO
          echo '=== action runtime ==='
          namei -l /home/ubuntu/.local/share/agentos/action-runtime/agentos_node/action_relay.py 2>/dev/null || true
          stat -c '%A %U %G %a %n' /home/ubuntu/.local/share/agentos/action-runtime /home/ubuntu/.local/share/agentos/action-runtime/agentos_node /home/ubuntu/.local/share/agentos/action-runtime/agentos_node/action_relay.py 2>/dev/null || true
          test -w /home/ubuntu/.local/share/agentos/action-runtime/agentos_node/action_relay.py && echo action_runtime_write=YES || echo action_runtime_write=NO
          echo '=== processes ==='
          ps -eo pid,user,group,supgrp,args | grep -E 'antigravity_relay_worker|action_relay|agent_core.realm_cli serve' | grep -v grep || true
          echo '=== units ==='
          cat /home/ubuntu/.config/systemd/user/agentos-antigravity-relay.service 2>/dev/null || true
          cat /home/ubuntu/.config/systemd/user/agentos-action-relay.service 2>/dev/null || true
          cat /home/ubuntu/.config/systemd/user/agentos-realm-fabric.service 2>/dev/null || true
          echo '=== action spool write ==='
          for p in /home/ubuntu/agent-data/runtime/action-relay /home/ubuntu/agent-data/runtime/action-relay/inbox /home/ubuntu/agent-data/runtime/action-relay/receipts; do
            stat -c '%A %U %G %a %n' "$p" 2>/dev/null || true
            test -w "$p" && echo "write=YES $p" || echo "write=NO $p"
          done
