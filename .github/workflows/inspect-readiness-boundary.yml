name: Inspect Realm Readiness Boundary

on:
  push:
    branches:
      - feature/realm-node-fabric-readiness
    paths:
      - '.github/workflows/inspect-readiness-boundary.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - name: Verify live ONE generation
        shell: bash
        run: |
          set -euo pipefail
          id
          health=$(curl -fsS --max-time 3 http://127.0.0.1:8780/v1/health)
          echo "ONE_HEALTH=$health"
          bootstrap=$(curl -sS -o /tmp/agentos-bootstrap-body -w '%{http_code}' --max-time 3 'http://127.0.0.1:8780/v1/bootstrap?node_id=vopc5750')
          benchmark=$(curl -sS -o /tmp/agentos-benchmark-body -w '%{http_code}' --max-time 3 -X POST -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:8780/v1/benchmark)
          test "$bootstrap" = 401
          test "$benchmark" = 401
          echo one_bootstrap_route=PASS
          echo one_benchmark_route=PASS
          ps -eo pid,user,group,supgrp,args | grep antigravity_relay_worker | grep -v grep

      - name: Fingerprint live relay generation
        shell: bash
        run: |
          set -euo pipefail
          WORKER=/home/ubuntu/.local/share/agentos/runtime-vnext/agentos_node/antigravity_relay_worker.py
          MANIFEST=/home/ubuntu/.local/share/agentos/runtime-vnext/runtime-provenance.json
          UNIT=/home/ubuntu/.config/systemd/user/agentos-antigravity-relay.service
          echo "live_worker=$WORKER"
          stat -c 'live_worker_mtime=%y owner=%U group=%G mode=%a size=%s' "$WORKER"
          ACTUAL_SHA=$(sha256sum "$WORKER" | awk '{print $1}')
          echo "live_worker_sha256=$ACTUAL_SHA"
          echo '=== live worker provider markers ==='
          grep -nE 'AGENTOS_ANTIGRAVITY_PROVIDER|provider.?[:=]|discover_provider' "$WORKER" || true
          echo '=== live unit provider/runtime markers ==='
          grep -nE 'Environment=AGENTOS_ANTIGRAVITY_PROVIDER|Environment=AGENTOS_RUNTIME_|WorkingDirectory|ExecStart' "$UNIT" || true
          if ! grep -q 'AGENTOS_ANTIGRAVITY_PROVIDER' "$WORKER"; then
            echo 'live_relay_generation=STALE_NO_PROVIDER_ABSTRACTION'
            exit 42
          fi
          if ! grep -q 'Environment=AGENTOS_ANTIGRAVITY_PROVIDER=agy' "$UNIT"; then
            echo 'live_relay_provider=NOT_AGY'
            exit 43
          fi
          if [ ! -f "$MANIFEST" ]; then
            echo 'live_relay_provenance=MISSING'
            exit 44
          fi
          python3 - "$MANIFEST" "$ACTUAL_SHA" "$UNIT" <<'PY'
          import json, sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          actual_sha = sys.argv[2]
          unit = Path(sys.argv[3]).read_text(encoding='utf-8')
          print('runtime_provenance=' + json.dumps(manifest, sort_keys=True))
          if manifest.get('schema') != 'agentos.runtime-provenance/v1':
              raise SystemExit('runtime provenance schema mismatch')
          if manifest.get('provider') != 'agy':
              raise SystemExit('runtime provenance provider drift')
          if manifest.get('worker_sha256') != actual_sha:
              raise SystemExit('runtime provenance worker digest drift')
          source_ref = str(manifest.get('source_ref') or '')
          source_commit = str(manifest.get('source_commit') or '')
          if source_ref != 'feature/realm-node-fabric-readiness' or not source_commit:
              raise SystemExit('runtime provenance source drift')
          required = [
              f'Environment=AGENTOS_RUNTIME_SOURCE_REF={source_ref}',
              f'Environment=AGENTOS_RUNTIME_SOURCE_COMMIT={source_commit}',
              f'Environment=AGENTOS_RUNTIME_WORKER_SHA256={actual_sha}',
          ]
          missing = [item for item in required if item not in unit]
          if missing:
              raise SystemExit('runtime unit provenance drift: ' + ','.join(missing))
          print('live_relay_provenance=PASS')
          PY
          echo 'live_relay_generation=PASS'
          echo 'live_relay_provider=agy'

      - name: Verify executor isolation boundary
        shell: bash
        run: |
          set -euo pipefail
          if find /home/ubuntu/.antigravity-ide-server/extensions -path '*/resources/native-binary/claude' -type f >/tmp/claude-paths 2>/tmp/claude-find-error; then
            echo direct_embedded_claude_visibility=VISIBLE
            cat /tmp/claude-paths
          else
            echo direct_embedded_claude_visibility=ISOLATED
            cat /tmp/claude-find-error
          fi
          if command -v agy >/tmp/agy-path 2>/dev/null; then
            echo direct_agy_visibility=VISIBLE
            cat /tmp/agy-path
          else
            echo direct_agy_visibility=ISOLATED
          fi
          echo 'Direct provider visibility is diagnostic only; governed execution must cross the ubuntu relay boundary.'

      - name: Verify cross-user relay end-to-end
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time
          from agentos_node.antigravity_relay import AntigravityRelayClient

          expected = 'AGENTOS_RELAY_E2E_PASS'
          client = AntigravityRelayClient('/home/ubuntu/agent-data/runtime/antigravity-relay')
          capsule = client.submit(
              project_id='realm-readiness-e2e-smoke',
              canonical_ir={'goal':'Prove governed cross-user relay execution and receipt production.'},
              instruction=f'Return exactly {expected}. Do not modify state.',
              workspace='/home/ubuntu/agentmanager',
          )
          cid = capsule['capsule_id']
          print('capsule_id=' + cid)
          for _ in range(115):
              receipt = client.receipt(cid)
              if receipt:
                  print(json.dumps(receipt, indent=2, ensure_ascii=False))
                  encoded = json.dumps(receipt, ensure_ascii=False)
                  if 'PermissionError' in encoded or 'Permission denied' in encoded:
                      raise SystemExit('cross-user permission regression')
                  if receipt.get('provider') != 'agy':
                      raise SystemExit('relay provider drift: expected agy')
                  if not receipt.get('ok'):
                      raise SystemExit('relay executor did not complete successfully')
                  if expected not in str(receipt.get('stdout') or ''):
                      raise SystemExit('relay executor returned no expected model result')
                  print('cross_user_relay_e2e=PASS')
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('relay receipt timeout')
          PY

      - name: Verify first-node heartbeat freshness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          stale_after = 30.0
          path = Path('/home/ubuntu/agent-data/realm/nodes.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          nodes = data.get('nodes') or {}
          node = nodes.get('vopc5750') if isinstance(nodes, dict) else None
          if node is None and isinstance(nodes, list):
              node = next((item for item in nodes if item.get('node_id') == 'vopc5750'), None)
          print(json.dumps({'vopc5750': node}, indent=2, ensure_ascii=False))
          if not node:
              raise SystemExit('vopc5750 missing from registry')

          raw = node.get('last_heartbeat_at') or node.get('last_heartbeat')
          if not raw:
              raise SystemExit('vopc5750 heartbeat missing')
          heartbeat = datetime.fromisoformat(str(raw).replace('Z', '+00:00'))
          age = (datetime.now(timezone.utc) - heartbeat).total_seconds()
          reported = node.get('reported_status') or node.get('status')
          effective = 'online' if reported == 'online' and age <= stale_after else 'offline'
          reason = 'fresh_heartbeat' if effective == 'online' else 'heartbeat_stale'
          print('vopc_reported_status=' + str(reported))
          print('vopc_effective_status=' + effective)
          print('vopc_status_reason=' + reason)
          print(f'vopc_heartbeat_age_seconds={age:.1f}')
          print('vopc_last_heartbeat=' + str(raw))
          if effective != 'online':
              raise SystemExit('vopc5750 heartbeat is stale')
          print('vopc_heartbeat_freshness=PASS')
          PY
