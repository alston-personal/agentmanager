name: Character Fusion Failure Receipt Probe

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/character-fusion-failure-receipt-probe.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BASE: https://studio.milkcat.org/dashboard/api/agentos
      REQUEST_ID: agentos.character_fusion.smoke-1791776490-350feb4f
    steps:
      - name: Mint scheduler credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          v=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert v.count('.')==2
          print(v)
          PY
          )"
          echo "::add-mask::$token"
          printf 'TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Read bounded failure detail
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 -H "Authorization: Bearer $TOKEN"             "$BASE/v1/dispatch/requests/$REQUEST_ID" > "$RUNNER_TEMP/request.json"
          python3 - "$RUNNER_TEMP/request.json" <<'PY'
          import json,re,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          r=d.get('receipt') or {}
          print("state="+str(d.get('state') or 'unknown'))
          print("ok="+str(r.get('ok')).lower())
          print("failure_class="+str(r.get('failure_class') or 'none'))
          print("failed_steps="+",".join(str(x)[:120] for x in (r.get('failed_steps') or [])[:10]))
          err=str(r.get('error') or '')
          err=re.sub(r'(?i)(api[_-]?key|token|secret|password)=\S+',r'\1=[REDACTED]',err)
          err=re.sub(r'https?://\S+','[URL]',err)
          print("error="+err[:700].replace("\n"," | "))
          ev=r.get('evidence') or []
          print("evidence_count="+str(len(ev)))
          for i,item in enumerate(ev[:8],1):
              s=str(item)
              s=re.sub(r'(?i)(api[_-]?key|token|secret|password)=\S+',r'\1=[REDACTED]',s)
              print(f"evidence_{i}="+s[:400].replace("\n"," | "))
          print("character_fusion_failure_receipt_probe=PASS")
          PY
