name: Oracle Core Bundle Immutable Runtime Convergence

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/oracle-core-bundle-immutable-runtime-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-core-bundle-immutable-runtime-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Converge Core service bundle to exact immutable release
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          SOURCE_COMMIT="$1"
          REPO=/home/ubuntu/agentmanager
          DATA_ROOT=/home/ubuntu/agent-data
          RELEASE_ROOT="$DATA_ROOT/releases/core"
          RUNTIME_ROOT="$DATA_ROOT/runtime/core"
          RELEASE="$RELEASE_ROOT/$SOURCE_COMMIT"
          CURRENT="$RUNTIME_ROOT/current"
          UNIT_DIR=/home/ubuntu/.config/systemd/user
          BACKUP="$(mktemp -d /tmp/agentos-core-units.XXXXXX)"
          UNITS=(
            os-chronos.service
            agent-maintenance.service
            agent-maintenance.timer
            tg-commander.service
            teams-commander.service
            cat-ink-syncer.service
            os-lobster.service
            agentos-core-supervisor.service
            agentos-employee-worker-host.service
          )
          SERVICES=(
            os-chronos.service
            tg-commander.service
            teams-commander.service
            cat-ink-syncer.service
            os-lobster.service
            agentos-core-supervisor.service
            agentos-employee-worker-host.service
          )
          mkdir -p "$RELEASE_ROOT" "$RUNTIME_ROOT"

          test -d "$REPO/.git"
          test -f "$REPO/.env"
          git -C "$REPO" fetch --no-tags origin "$SOURCE_COMMIT" >/dev/null
          git -C "$REPO" cat-file -e "$SOURCE_COMMIT^{commit}"

          for unit in "${UNITS[@]}"; do
            [ -f "$UNIT_DIR/$unit" ] && cp -a "$UNIT_DIR/$unit" "$BACKUP/$unit"
          done
          : > "$BACKUP/active-services"
          for unit in "${SERVICES[@]}"; do
            systemctl --user is-active --quiet "$unit" 2>/dev/null && echo "$unit" >> "$BACKUP/active-services" || true
          done
          systemctl --user is-active --quiet agent-maintenance.timer 2>/dev/null && echo agent-maintenance.timer >> "$BACKUP/active-services" || true

          # Preserve the live Employee Worker Host intent during migration. The
          # historical host may have been activated before the enable toggle was
          # persisted in the shared .env. Reuse only its existing bounded
          # host-local environment; do not infer or invent wake/node identity.
          if grep -qx 'agentos-employee-worker-host.service' "$BACKUP/active-services"; then
            WORKER_ENV=/home/ubuntu/.config/agentos/employee-worker-host.env
            test -f "$WORKER_ENV"
            set -a
            source "$WORKER_ENV"
            export AGENTOS_CORE_EMPLOYEE_WORKER_HOST_ENABLE=1
            set +a
            echo "core_bundle_worker_intent=PRESERVE_ACTIVE"
          fi

          rollback() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "core_bundle_rollback=START" >&2
              for unit in "${UNITS[@]}"; do
                if [ -f "$BACKUP/$unit" ]; then
                  cp -a "$BACKUP/$unit" "$UNIT_DIR/$unit"
                fi
              done
              systemctl --user daemon-reload || true
              while read -r unit; do
                [ -n "$unit" ] && systemctl --user restart "$unit" || true
              done < "$BACKUP/active-services"
              echo "core_bundle_rollback=DONE" >&2
            fi
            rm -rf "$BACKUP"
            exit "$rc"
          }
          trap rollback EXIT

          if [ ! -e "$RELEASE/.git" ]; then
            git -C "$REPO" worktree add --detach "$RELEASE" "$SOURCE_COMMIT"
          fi
          test "$(git -C "$RELEASE" rev-parse HEAD)" = "$SOURCE_COMMIT"
          # Fail closed if stale Lobster role-name references return in this release.
          if grep -Fq '{role}' "$RELEASE/scripts/lobster.py"; then
            echo "core_bundle_lobster_role_name_regression=FAIL"
            exit 24
          fi
          echo "core_bundle_lobster_role_name_regression=PASS"
          # Guard the noninteractive Claude CLI invocation of durable Lobster.
          if ! grep -Fq '"--print",' "$RELEASE/scripts/lobster.py"; then
            echo "core_bundle_lobster_headless_cli=FAIL"
            exit 25
          fi
          echo "core_bundle_lobster_headless_cli=PASS"
          [ -e "$RELEASE/.env" ] || ln -s "$REPO/.env" "$RELEASE/.env"

          set -a
          source "$REPO/.env"
          [ -f /home/ubuntu/.agentos.secrets ] && source /home/ubuntu/.agentos.secrets
          set +a
          test "${AGENT_MODE:-CLIENT}" = CORE

          # Track the candidate's own appended stderr, not old log errors.
          LOBSTER_LOG="$DATA_ROOT/logs/lobster.log"
          LOBSTER_LOG_OFFSET="$(stat -c %s "$LOBSTER_LOG" 2>/dev/null || echo 0)"
          INSTALL_JSON="$(PYTHONPATH="$RELEASE" python3 "$RELEASE/scripts/install_services.py" --project-root "$RELEASE" --data-root "$DATA_ROOT")"
          printf '%s\n' "$INSTALL_JSON"
          printf '%s' "$INSTALL_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("mode")=="systemd", d'

          # Preserve availability: everything that was active before must be active after.
          while read -r unit; do
            [ -n "$unit" ] || continue
            systemctl --user is-active --quiet "$unit"
            echo "core_bundle_preserved_active=$unit"
          done < "$BACKUP/active-services"

          # Critical autonomous-control services must be live regardless of old state.
          systemctl --user is-active --quiet os-chronos.service
          systemctl --user is-active --quiet agentos-core-supervisor.service
          # A pre-existing crash loop is not an active service preserved by the installer.
          # Explicitly restart the bounded Lobster unit against the exact candidate release.
          systemctl --user reset-failed os-lobster.service || true
          systemctl --user restart os-lobster.service
          # Lobster must actually survive startup; a momentary active state is not acceptance.
          systemctl --user is-active --quiet os-lobster.service
          lobster_pid="$(systemctl --user show os-lobster.service -p MainPID --value)"
          test -n "$lobster_pid" && test "$lobster_pid" != 0
          lobster_cwd="$(readlink -f "/proc/$lobster_pid/cwd")"
          test "$lobster_cwd" = "$RELEASE"
          lobster_restarts_before="$(systemctl --user show os-lobster.service -p NRestarts --value)"
          sleep 12
          # On startup regression, show only the newest safe exception class
          # and an allowlisted identifier; keep full logs private on Oracle.
          if ! systemctl --user is-active --quiet os-lobster.service; then
            echo "core_bundle_lobster_stability=FAIL"
            LOBSTER_LOG_OFFSET="$LOBSTER_LOG_OFFSET" /usr/bin/python3 - "$LOBSTER_LOG" <<'LOBSTER_DIAG'
          import os, pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          offset = int(os.environ.get("LOBSTER_LOG_OFFSET", "0"))
          raw = path.read_bytes() if path.is_file() else b""
          if len(raw) < offset:
              offset = 0
          lines = raw[offset:].decode("utf-8", "replace").splitlines()
          matches = []
          allowed = {"NameError", "ModuleNotFoundError", "ImportError", "SyntaxError", "IndentationError", "AttributeError", "TypeError", "ValueError", "PermissionError", "FileNotFoundError", "RuntimeError", "KeyError", "TimeoutError", "AssertionError", "SystemExit", "OSError"}
          for line in lines:
              m = re.match(r"^([A-Za-z]+(?:Error|Exit)): (.*)$", line.strip())
              if m and m.group(1) in allowed:
                  matches.append(m.groups())
          latest = matches[-1] if matches else None
          print("core_bundle_lobster_candidate_exception=" + (latest[0] if latest else "unknown"))
          if latest and latest[0] == "NameError":
              m = re.fullmatch(r"name '([A-Za-z_][A-Za-z_0-9]*)' is not defined", latest[1])
              print("core_bundle_lobster_candidate_undefined=" + (m.group(1) if m else "unknown"))
          LOBSTER_DIAG
            exit 23
          fi
          lobster_restarts_after="$(systemctl --user show os-lobster.service -p NRestarts --value)"
          test "$lobster_restarts_before" = "$lobster_restarts_after"
          echo "core_bundle_lobster_stable=PASS"
          if [ "${AGENTOS_CORE_EMPLOYEE_WORKER_HOST_ENABLE:-0}" = 1 ]; then
            systemctl --user is-active --quiet agentos-employee-worker-host.service
          fi

          # Actual running processes, not merely unit text, must execute from the immutable release.
          for unit in os-chronos.service tg-commander.service cat-ink-syncer.service agentos-core-supervisor.service; do
            pid="$(systemctl --user show "$unit" -p MainPID --value)"
            test -n "$pid" && test "$pid" != 0
            cwd="$(readlink -f "/proc/$pid/cwd")"
            case "$cwd" in
              "$RELEASE"|"$RELEASE"/*) ;;
              *) echo "ERROR: $unit still runs from non-release cwd=$cwd" >&2; exit 20;;
            esac
            echo "core_bundle_runtime=$unit:immutable"
          done
          if systemctl --user is-active --quiet agentos-employee-worker-host.service; then
            worker_wd="$(systemctl --user show agentos-employee-worker-host.service -p WorkingDirectory --value)"
            test "$(readlink -f "$worker_wd")" = "$RELEASE" || {
              echo "ERROR: worker host unit WorkingDirectory is not exact release: $worker_wd" >&2
              exit 21
            }
            worker_exec="$(systemctl --user show agentos-employee-worker-host.service -p ExecStart --value)"
            case "$worker_exec" in
              *"/usr/bin/sg agentos -c"*employee_worker_host_daemon*) ;;
              *) echo "ERROR: worker host lost bounded agentos execution boundary" >&2; exit 22;;
            esac
            worker_pid="$(systemctl --user show agentos-employee-worker-host.service -p MainPID --value)"
            test -n "$worker_pid" && test "$worker_pid" != 0
            systemctl --user --no-pager --full status agentos-employee-worker-host.service | grep -q 'employee_worker_host_daemon'
            echo "core_bundle_runtime=agentos-employee-worker-host.service:immutable"
            echo "core_bundle_worker_group_boundary=PASS"
          fi

          ln -sfn "$RELEASE" "$CURRENT"
          test "$(readlink -f "$CURRENT")" = "$RELEASE"
          echo "core_bundle_source_commit=$SOURCE_COMMIT"
          echo "core_bundle_release=$RELEASE"
          echo "core_bundle_current=$CURRENT"
          echo "core_bundle_immutable_runtime=PASS"
          trap - EXIT
          rm -rf "$BACKUP"
          REMOTE
