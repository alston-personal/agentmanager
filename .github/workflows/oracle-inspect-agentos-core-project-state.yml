name: Inspect AgentOS Core Project State

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-inspect-agentos-core-project-state.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
    steps:
      - uses: actions/checkout@v4
      - name: Read-only project identity and state inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path('/home/ubuntu/agent-data/projects')
          print('projects_root_exists=', root.is_dir())
          if not root.is_dir():
              raise SystemExit(0)
          print('project_dirs=', json.dumps(sorted(p.name for p in root.iterdir() if p.is_dir()), ensure_ascii=False))

          for project_name in ('agentos-core','agentmanager'):
              target=root/project_name
              print(f'=== {project_name} ===')
              print('exists=', target.is_dir())
              if not target.is_dir():
                  continue

              safe_names=[]
              for p in sorted(target.rglob('*')):
                  if not p.is_file():
                      continue
                  rel=p.relative_to(target).as_posix()
                  low=rel.lower()
                  if any(x in low for x in ('secret','token','credential','password','private','key.pem','.env')):
                      continue
                  if p.stat().st_size > 2_000_000:
                      continue
                  safe_names.append(rel)
              print('files=', json.dumps(safe_names, ensure_ascii=False, indent=2))

              candidates=[]
              for rel in safe_names:
                  low=rel.lower()
                  if any(x in low for x in ('checkpoint','continuity','state','execution-head','ir.json','handoff','identity','current')):
                      candidates.append(rel)
              print('state_candidates=', json.dumps(candidates, ensure_ascii=False, indent=2))

              for rel in candidates:
                  p=target/rel
                  if p.suffix.lower() != '.json':
                      continue
                  try:
                      data=json.loads(p.read_text(encoding='utf-8'))
                  except Exception as exc:
                      print('candidate_parse_error=', rel, type(exc).__name__)
                      continue
                  if isinstance(data, dict):
                      summary={k:data.get(k) for k in (
                          'schema','project_id','project','name','status','goal','version','updated_at','observed_at',
                          'node_id','node','branch','head','local_head','repo','repository','next_action','current_goal'
                      ) if k in data}
                      print('candidate_summary=', rel, json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY
