name: Inspect AgentOS Core Project State

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-inspect-agentos-core-project-state.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
    steps:
      - uses: actions/checkout@v4
      - name: Read-only current Project Store authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              import yaml
          except Exception as exc:
              raise SystemExit('PyYAML unavailable: '+str(exc))

          root=Path('/home/ubuntu/agent-data/projects')
          allowed=(
              'id','project_id','name','display_name','aliases','schema','version','status','type','kind','description',
              'repo','repository','source','branch','canonical_path','checkout','node','node_id','runtime','deployment',
              'state','state_document','checkpoint','continuity','current_goal','goal','next_action','owner','supersedes',
              'created_at','updated_at','last_verified_at'
          )
          for name in ('agentmanager','layoutlib'):
              p=root/name
              print(f'=== {name} ===')
              y=p/'project.yaml'
              print('project_yaml_exists=',y.is_file())
              if y.is_file():
                  obj=yaml.safe_load(y.read_text(encoding='utf-8'))
                  if isinstance(obj,dict):
                      print('project_yaml_keys=',json.dumps(sorted(obj.keys()),ensure_ascii=False))
                      print('project_yaml_summary=',json.dumps({k:obj.get(k) for k in allowed if k in obj},ensure_ascii=False,sort_keys=True,indent=2))
              s=p/'STATUS.md'
              print('status_md_exists=',s.is_file())
              if s.is_file():
                  lines=[]
                  for raw in s.read_text(encoding='utf-8').splitlines():
                      line=raw.strip()
                      if line.startswith('#') or any(tok in line.lower() for tok in ('status','project','goal','next','repo','branch','checkpoint','current','canonical')):
                          lines.append(raw[:500])
                      if len(lines)>=30: break
                  print('status_signals=',json.dumps(lines,ensure_ascii=False,indent=2))
          PY
