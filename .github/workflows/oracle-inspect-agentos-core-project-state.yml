name: Inspect AgentOS Core Project State

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-inspect-agentos-core-project-state.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
    steps:
      - uses: actions/checkout@v4
      - name: Read-only project identity and state inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path('/home/ubuntu/agent-data/projects')
          print('projects_root_exists=', root.is_dir())
          if not root.is_dir():
              raise SystemExit(0)
          print('project_dirs=', json.dumps(sorted(p.name for p in root.iterdir() if p.is_dir()), ensure_ascii=False))

          safe_fields=(
              'schema','project_id','project','id','name','aliases','status','goal','version','updated_at','observed_at',
              'node_id','node','branch','head','local_head','repo','repository','canonical_path','checkout','source',
              'next_action','current_goal','checkpoint','latest_checkpoint','state_document','continuity','ir','phase'
          )
          exact_records=('project.json','status.json','execution.json','ir/latest.json')

          for project_name in ('agentos-core','agentmanager'):
              target=root/project_name
              print(f'=== {project_name} ===')
              print('exists=', target.is_dir())
              if not target.is_dir():
                  continue

              for rel in exact_records:
                  p=target/rel
                  print('record_exists=', rel, p.is_file())
                  if not p.is_file():
                      continue
                  try:
                      data=json.loads(p.read_text(encoding='utf-8'))
                  except Exception as exc:
                      print('record_parse_error=', rel, type(exc).__name__)
                      continue
                  if isinstance(data, dict):
                      summary={k:data.get(k) for k in safe_fields if k in data}
                      print('record_summary=', rel, json.dumps(summary, ensure_ascii=False, sort_keys=True))

              for rel in ('ir/checkpoint-000001.json','ir/checkpoint-000002.json','ir/checkpoint-000003.json'):
                  p=target/rel
                  if not p.is_file():
                      continue
                  try:
                      data=json.loads(p.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  if isinstance(data,dict):
                      summary={k:data.get(k) for k in safe_fields if k in data}
                      print('checkpoint_summary=', rel, json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY
