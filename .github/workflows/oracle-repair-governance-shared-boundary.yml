name: Repair Governance Shared Boundary (retired legacy carrier)

# Legacy direct Oracle shared-directory chmod repair retired under #1682.
# Canonical immutable release and bounded authority control must be used instead.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy shared-boundary mutation
        run: |
          echo 'RETIRED_LEGACY_CARRIER: direct Oracle shared governance mutation is disabled'
          exit 1
