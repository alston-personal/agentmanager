name: Oracle Deploy Mio Try-On Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/tryon_render_worker.py'
      - '.github/workflows/oracle-deploy-mio-tryon-worker.yml'

permissions:
  contents: read

concurrency:
  group: oracle-mio-tryon-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install worker and system service
        shell: bash
        run: |
          set -euo pipefail
          sudo -n install -d -m 755 -o ubuntu -g ubuntu /home/ubuntu/.local/bin
          sudo -n install -m 755 -o ubuntu -g ubuntu scripts/tryon_render_worker.py /home/ubuntu/.local/bin/agentos-mio-tryon-render-worker.py

          cat > /tmp/agentos-mio-tryon-render-worker.service <<'UNIT'
          [Unit]
          Description=AgentOS Mio Outfit Try-On Render Worker
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=ubuntu
          Group=ubuntu
          Environment=HOME=/home/ubuntu
          Environment=AGENT_DATA_ROOT=/home/ubuntu/agent-data
          Environment=AGENTOS_TRYON_POLL_SECONDS=2
          Environment=PYTHONUNBUFFERED=1
          ExecStart=/usr/bin/python3 /home/ubuntu/.local/bin/agentos-mio-tryon-render-worker.py
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo -n install -m 644 /tmp/agentos-mio-tryon-render-worker.service /etc/systemd/system/agentos-mio-tryon-render-worker.service
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable --now agentos-mio-tryon-render-worker.service
          sleep 2
          sudo -n systemctl is-active agentos-mio-tryon-render-worker.service
          sudo -n systemctl --no-pager --full status agentos-mio-tryon-render-worker.service | head -n 30
