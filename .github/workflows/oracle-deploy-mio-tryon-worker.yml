name: Oracle Deploy Mio Try-On Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/tryon_render_worker.py'
      - '.github/workflows/oracle-deploy-mio-tryon-worker.yml'

permissions:
  contents: read

concurrency:
  group: oracle-mio-tryon-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Install worker as ubuntu user service
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          REMOTE_SCRIPT="/tmp/agentos-mio-tryon-render-worker-$GITHUB_RUN_ID.py"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            scripts/tryon_render_worker.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_SCRIPT"

          HF_TOKEN_B64="$(printf '%s' "${HF_TOKEN:-}" | base64 -w0)"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$REMOTE_SCRIPT" "$HF_TOKEN_B64" <<'REMOTE'
          set -euo pipefail
          REMOTE_SCRIPT="$1"
          HF_TOKEN_B64="${2:-}"
          HF_TOKEN_VALUE=""
          if [ -n "$HF_TOKEN_B64" ]; then
            HF_TOKEN_VALUE="$(printf '%s' "$HF_TOKEN_B64" | base64 -d)"
          fi
          install -d -m 700 "$HOME/.local/bin" "$HOME/.local/share" "$HOME/.config/systemd/user"
          install -m 755 "$REMOTE_SCRIPT" "$HOME/.local/bin/agentos-mio-tryon-render-worker.py"
          rm -f "$REMOTE_SCRIPT"

          VENV="$HOME/.local/share/mio-tryon-venv"
          if [ ! -x "$VENV/bin/python" ]; then
            python3 -m venv "$VENV"
          fi
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
          "$VENV/bin/python" -m pip install --quiet --upgrade "gradio_client>=1.13,<3" "Pillow>=10,<13" "huggingface_hub>=0.34,<2"
          "$VENV/bin/python" -c 'from gradio_client import Client, handle_file; from PIL import Image; from huggingface_hub import InferenceClient; print("gradio_client_import=PASS"); print("pillow_import=PASS"); print("hf_inference_client_import=PASS")'
          "$VENV/bin/python" -m py_compile "$HOME/.local/bin/agentos-mio-tryon-render-worker.py"
          echo "tryon_worker_compile=PASS"

          cat > "$HOME/.config/systemd/user/agentos-mio-tryon-render-worker.service" <<'UNIT'
          [Unit]
          Description=AgentOS Mio Outfit Try-On Render Worker
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          Environment=HOME=/home/ubuntu
          Environment=AGENT_DATA_ROOT=/home/ubuntu/agent-data
          Environment=AGENTOS_TRYON_POLL_SECONDS=2
          Environment=PYTHONUNBUFFERED=1
          EnvironmentFile=-/home/ubuntu/.config/agentos/mio-tryon.env
          ExecStart=/home/ubuntu/.local/share/mio-tryon-venv/bin/python /home/ubuntu/.local/bin/agentos-mio-tryon-render-worker.py
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=default.target
          UNIT

          install -d -m 700 "$HOME/.config/agentos"

          # Never erase a working Oracle-local token merely because the Actions
          # secret is unset. Resolve credentials in explicit precedence order:
          # Actions secret -> existing worker env -> agentmanager dotenv -> home dotenv.
          if [ -z "$HF_TOKEN_VALUE" ]; then
            HF_TOKEN_VALUE="$(python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path.home() / ".config" / "agentos" / "mio-tryon.env",
              Path("/home/ubuntu/agentmanager/.env"),
              Path.home() / ".env",
          ]
          keys = {"HF_TOKEN", "HUGGINGFACE_TOKEN"}
          for path in candidates:
              if not path.is_file():
                  continue
              for raw in path.read_text(encoding="utf-8", errors="replace").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  if line.startswith("export "):
                      line = line[7:].strip()
                  if "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  if key.strip() not in keys:
                      continue
                  value = value.strip().strip('"').strip("'")
                  if value:
                      print(value)
                      raise SystemExit(0)
          PY
            )"
          fi

          if [ -z "$HF_TOKEN_VALUE" ]; then
            echo "mio_tryon_hf_token=MISSING" >&2
            echo "Refusing to replace the worker runtime without a usable HF token." >&2
            exit 23
          fi

          umask 077
          printf 'HF_TOKEN=%s\n' "$HF_TOKEN_VALUE" > "$HOME/.config/agentos/mio-tryon.env"
          chmod 600 "$HOME/.config/agentos/mio-tryon.env"
          echo "mio_tryon_hf_token=CONFIGURED"

          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          test -S "$XDG_RUNTIME_DIR/bus"
          systemctl --user daemon-reload
          systemctl --user enable agentos-mio-tryon-render-worker.service
          systemctl --user restart agentos-mio-tryon-render-worker.service
          sleep 2
          systemctl --user is-active agentos-mio-tryon-render-worker.service
          systemctl --user --no-pager --full status agentos-mio-tryon-render-worker.service | head -n 30

          ROOT=/home/ubuntu/agent-data/projects/dressup-simulator
          CACHE_DIR="$ROOT/render_cache"
          install -d -m 700 "$CACHE_DIR"
          VERIFIED_SOURCE="$ROOT/render_assets/mio-live-e2e-36397707913.webp"
          VERIFIED_CACHE="$CACHE_DIR/c4a850d62a8dd41826d583e229ee230e009ef536aa4b1fae9d7036ede4a394c8.webp"
          if [ -s "$VERIFIED_SOURCE" ] && [ ! -s "$VERIFIED_CACHE" ]; then
            cp "$VERIFIED_SOURCE" "$VERIFIED_CACHE.tmp"
            chmod 600 "$VERIFIED_CACHE.tmp"
            mv "$VERIFIED_CACHE.tmp" "$VERIFIED_CACHE"
          fi
          test -s "$VERIFIED_CACHE"
          echo "mio_historical_cache_present=PASS bytes=$(wc -c < "$VERIFIED_CACHE")"
          # Historical smoke assets are not proof of visual approval.
          # The cache guard must reject legacy entries without signed-off review metadata.
          "$VENV/bin/python" - "$VERIFIED_CACHE" <<'PY'
          import importlib.util, json, pathlib, sys
          worker=pathlib.Path.home()/".local/bin/agentos-mio-tryon-render-worker.py"
          spec=importlib.util.spec_from_file_location("mio_tryon_worker",worker)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          fixture={
              "characterId":"sunlake-milkcat-ai-001",
              "characterVersion":"mio-body-v1",
              "view":"front","pose":"neutral_standing",
              "input":{"selectedLayers":{"upper_main":{"garmentId":"net-43774-002"}}}
          }
          layers=["upper_main"]
          cached=mod.cache_path(mod.outfit_cache_key(fixture,layers))
          assert cached == pathlib.Path(sys.argv[1]), (cached,sys.argv[1])
          original=mod.CACHE_DIR
          import tempfile
          with tempfile.TemporaryDirectory(prefix="mio-cache-policy-") as temp:
              mod.CACHE_DIR=pathlib.Path(temp)
              target=mod.cache_path(mod.outfit_cache_key(fixture,layers))
              target.write_bytes(b"candidate" * 200)
              assert mod.cached_render(fixture,layers) is None
              sidecar=target.with_suffix(".json")
              sidecar.write_text(json.dumps({"qualityAccepted":False}),encoding="utf-8")
              assert mod.cached_render(fixture,layers) is None
              sidecar.write_text(json.dumps({"qualityAccepted":True}),encoding="utf-8")
              assert mod.cached_render(fixture,layers) is not None
          mod.CACHE_DIR=original
          print("mio_cache_quality_guard=PASS")
          PY

          # Deployment tests only the running worker and fail-closed cache policy.
          # Do not call stale render-cache hits a successful model inference.
          echo "mio_fresh_inference=NOT_TESTED"
          echo "mio_worker_deployment=PASS"
          REMOTE
