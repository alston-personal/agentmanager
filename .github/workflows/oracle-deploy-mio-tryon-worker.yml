name: Oracle Deploy Mio Try-On Worker

on:
  workflow_dispatch:
  push:
    branches: [fix/oracle-postreboot-mio-hf-recovery]
    paths:
      - 'scripts/tryon_render_worker.py'
      - '.github/workflows/oracle-deploy-mio-tryon-worker.yml'

permissions:
  contents: read

concurrency:
  group: oracle-mio-tryon-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Install worker as ubuntu user service
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          REMOTE_SCRIPT="/tmp/agentos-mio-tryon-render-worker-$GITHUB_RUN_ID.py"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            scripts/tryon_render_worker.py "${DEPLOY_USER}@${DEPLOY_HOST}:$REMOTE_SCRIPT"

          HF_TOKEN_B64=""
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$REMOTE_SCRIPT" "$HF_TOKEN_B64" <<'REMOTE'
          set -euo pipefail
          REMOTE_SCRIPT="$1"
          HF_TOKEN_B64="${2:-}"
          HF_TOKEN_VALUE=""
          LOCAL_ENV="/home/ubuntu/agentmanager/.env"
          if [ -f "$LOCAL_ENV" ]; then
            HF_TOKEN_VALUE="$(sed -n 's/^HF_TOKEN=//p' "$LOCAL_ENV" | tail -n 1)"
          fi
          if [ -z "$HF_TOKEN_VALUE" ] && [ -n "$HF_TOKEN_B64" ]; then
            HF_TOKEN_VALUE="$(printf '%s' "$HF_TOKEN_B64" | base64 -d)"
          fi
          test -n "$HF_TOKEN_VALUE" || { echo "HF_TOKEN missing from $LOCAL_ENV and workflow secret"; exit 22; }
          echo "mio_hf_token_source=oracle_local_env"
          install -d -m 700 "$HOME/.local/bin" "$HOME/.local/share" "$HOME/.config/systemd/user"
          install -m 755 "$REMOTE_SCRIPT" "$HOME/.local/bin/agentos-mio-tryon-render-worker.py"
          rm -f "$REMOTE_SCRIPT"

          VENV="$HOME/.local/share/mio-tryon-venv"
          if [ ! -x "$VENV/bin/python" ]; then
            python3 -m venv "$VENV"
          fi
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
          "$VENV/bin/python" -m pip install --quiet --upgrade "gradio_client>=1.13,<3" "Pillow>=10,<13"
          "$VENV/bin/python" -c 'from gradio_client import Client, handle_file; from PIL import Image; print("gradio_client_import=PASS"); print("pillow_import=PASS")'
          "$VENV/bin/python" -m py_compile "$HOME/.local/bin/agentos-mio-tryon-render-worker.py"
          echo "tryon_worker_compile=PASS"

          cat > "$HOME/.config/systemd/user/agentos-mio-tryon-render-worker.service" <<'UNIT'
          [Unit]
          Description=AgentOS Mio Outfit Try-On Render Worker
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          Environment=HOME=/home/ubuntu
          Environment=AGENT_DATA_ROOT=/home/ubuntu/agent-data
          Environment=AGENTOS_TRYON_POLL_SECONDS=2
          Environment=PYTHONUNBUFFERED=1
          EnvironmentFile=-/home/ubuntu/.config/agentos/mio-tryon.env
          ExecStart=/home/ubuntu/.local/share/mio-tryon-venv/bin/python /home/ubuntu/.local/bin/agentos-mio-tryon-render-worker.py
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=default.target
          UNIT

          install -d -m 700 "$HOME/.config/agentos"
          if [ -n "$HF_TOKEN_VALUE" ]; then
            umask 077
            printf 'HF_TOKEN=%s\n' "$HF_TOKEN_VALUE" > "$HOME/.config/agentos/mio-tryon.env"
          else
            rm -f "$HOME/.config/agentos/mio-tryon.env"
          fi

          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          test -S "$XDG_RUNTIME_DIR/bus"
          systemctl --user daemon-reload
          systemctl --user enable agentos-mio-tryon-render-worker.service
          systemctl --user restart agentos-mio-tryon-render-worker.service
          sleep 2
          systemctl --user is-active agentos-mio-tryon-render-worker.service
          systemctl --user --no-pager --full status agentos-mio-tryon-render-worker.service | head -n 30

          ROOT=/home/ubuntu/agent-data/projects/dressup-simulator
          CACHE_DIR="$ROOT/render_cache"
          install -d -m 700 "$CACHE_DIR"
          VERIFIED_SOURCE="$ROOT/render_assets/mio-live-e2e-36397707913.webp"
          VERIFIED_CACHE="$CACHE_DIR/c4a850d62a8dd41826d583e229ee230e009ef536aa4b1fae9d7036ede4a394c8.webp"
          if [ -s "$VERIFIED_SOURCE" ] && [ ! -s "$VERIFIED_CACHE" ]; then
            cp "$VERIFIED_SOURCE" "$VERIFIED_CACHE.tmp"
            chmod 600 "$VERIFIED_CACHE.tmp"
            mv "$VERIFIED_CACHE.tmp" "$VERIFIED_CACHE"
          fi
          test -s "$VERIFIED_CACHE"
          echo "mio_verified_real_render_cache=PASS bytes=$(wc -c < "$VERIFIED_CACHE")"

          JOB_DIR="$ROOT/render_jobs/runtime"
          ASSET_DIR="$ROOT/render_assets"
          JOB_ID="mio-worker-selftest-$RANDOM-$(date +%s)"
          JOB="$JOB_DIR/$JOB_ID.json"
          ASSET="$ASSET_DIR/$JOB_ID.webp"
          mkdir -p "$JOB_DIR" "$ASSET_DIR"

          python3 - "$JOB" "$JOB_ID" <<'PY'
          import json, pathlib, sys
          from datetime import datetime, timezone
          path=pathlib.Path(sys.argv[1]); job_id=sys.argv[2]
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          job={
            "schema":"agentos.tryon-render-job/v1",
            "jobId":job_id,
            "characterId":"sunlake-milkcat-ai-001",
            "characterVersion":"mio-body-v1",
            "view":"front","pose":"neutral_standing","status":"queued",
            "requestedAt":now,"startedAt":None,"completedAt":None,"failedAt":None,"supersededBy":None,
            "input":{
              "baseBodyAsset":"/personas/mio/mio-avatar.webp",
              "layerOrder":["upper_main"],
              "selectedLayers":{
                "upper_main":{"garmentId":"net-43774-002","name":"white top","layer":"upper_main","sourceImageUrl":"https://net.wimg.tw/files/1/products/735109_color_002E799BDE889B2.jpg?v=32570"}
              }
            },
            "output":{"asset":None,"previewAsset":None,"width":None,"height":None},
            "error":None
          }
          path.write_text(json.dumps(job,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          path.chmod(0o600)
          PY

          SELFTEST_OK=0
          for i in $(seq 1 120); do
            STATE=$(python3 - "$JOB" <<'PY'
          import json,sys
          try:
              print(json.load(open(sys.argv[1],encoding='utf-8')).get('status','missing'))
          except Exception:
              print('missing')
          PY
          )
            echo "tryon_worker_selftest_state=$STATE poll=$i"
            if [ "$STATE" = ready ]; then
              test -s "$ASSET"
              BYTES=$(wc -c < "$ASSET")
              test "$BYTES" -gt 1000
              echo "mio_tryon_worker_selftest=PASS bytes=$BYTES"
              SELFTEST_OK=1
              break
            fi
            if [ "$STATE" = failed ]; then
              cat "$JOB"
              journalctl --user -u agentos-mio-tryon-render-worker.service -n 80 --no-pager || true
              break
            fi
            sleep 2
          done
          test "$SELFTEST_OK" -eq 1
          rm -f "$JOB" "$ASSET"
          REMOTE
