name: Oracle Install LayoutLib Capability Gateway

# Installing/restarting a product-specific persistent service is an explicit
# runtime authority event. Generic AgentOS capability implementation pushes
# must not implicitly mutate the LayoutLib runtime.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layoutlib-capability-gateway-install
  cancel-in-progress: true

jobs:
  install:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install and start user service
        shell: bash
        run: |
          set -euo pipefail
          OUT=.agentos/evidence/layoutlib-capability-gateway-install.txt
          mkdir -p .agentos/evidence
          APP="$HOME/.local/share/agentos-capability-gateway"
          STORE="$HOME/.local/share/agentos/capabilities"
          UNIT="$HOME/.config/systemd/user/layoutlab-capability-gateway.service"
          mkdir -p "$APP/agentos_node" "$STORE" "$(dirname "$UNIT")"
          cp agentos_node/capability_http.py "$APP/agentos_node/capability_http.py"
          cp agentos_node/capability_store.py "$APP/agentos_node/capability_store.py"
          cat > "$APP/agentos_node/__init__.py" <<'PY'
          """Deployed AgentOS capability gateway subset."""
          PY
          cat > "$UNIT" <<EOF
          [Unit]
          Description=AgentOS LayoutLib Capability Gateway
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=$APP
          Environment=PYTHONPATH=$APP
          ExecStart=/usr/bin/python3 -m agentos_node.capability_http --host 127.0.0.1 --port 8767 --root $STORE
          Restart=always
          RestartSec=2
          UMask=0077

          [Install]
          WantedBy=default.target
          EOF

          USER_UID=$(id -u)
          START_METHOD=none
          if [ -S "/run/user/$USER_UID/bus" ]; then
            export XDG_RUNTIME_DIR="/run/user/$USER_UID"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
            if systemctl --user daemon-reload && systemctl --user enable --now layoutlab-capability-gateway.service; then
              START_METHOD=systemd-user-bus
            fi
          fi
          if [ "$START_METHOD" = none ]; then
            if systemctl --user --machine="$(id -un)@.host" daemon-reload >/tmp/layoutlib-machine-systemd.log 2>&1 \
              && systemctl --user --machine="$(id -un)@.host" enable --now layoutlab-capability-gateway.service >>/tmp/layoutlib-machine-systemd.log 2>&1; then
              START_METHOD=systemd-user-machine
            fi
          fi
          if [ "$START_METHOD" = none ]; then
            old=$(pgrep -f "$APP.*agentos_node.capability_http.*8767" || true)
            [ -z "$old" ] || kill $old || true
            # GitHub runner cleanup targets descendants carrying RUNNER_TRACKING_ID.
            # Remove only that tracking variable for this intentionally persistent,
            # user-owned daemon; the unit file remains the preferred reboot path.
            env -u RUNNER_TRACKING_ID PYTHONPATH="$APP" nohup /usr/bin/python3 -m agentos_node.capability_http \
              --host 127.0.0.1 --port 8767 --root "$STORE" \
              >"$APP/gateway.log" 2>&1 </dev/null &
            echo $! > "$APP/gateway.pid"
            START_METHOD=nohup-fallback
          fi

          code=000
          for i in $(seq 1 20); do
            code=$(curl -sS --max-time 2 -o /tmp/layoutlib-cap-health -w '%{http_code}' http://127.0.0.1:8767/healthz || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          test "$code" = 200
          cat > /tmp/layoutlib-exp.json <<'JSON'
          {"experience":{"schema":"agentos.capability-experience/v1","experience_id":"exp-install-smoke-v1","capability_id":"layoutlib.profile-detection","node_id":"oracle-install-smoke","observation":{"profile_features":{"edge_density":0.2}},"policy_used":{"threshold":88,"min_wall_length_px":16},"outcome":{"accepted":true,"correction_cost":1.0,"quality":0.5},"provenance":{"source":"install-smoke"}}}
          JSON
          post=$(curl -sS --max-time 3 -o /tmp/layoutlib-exp-receipt -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @/tmp/layoutlib-exp.json http://127.0.0.1:8767/capability/experience)
          test "$post" = 202
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "service=layoutlab-capability-gateway.service"
            echo "start_method=$START_METHOD"
            echo "bind=127.0.0.1:8767"
            echo "store=$STORE"
            echo "health_http=$code"
            echo "health_body=$(cat /tmp/layoutlib-cap-health)"
            echo "ingest_http=$post"
            echo "ingest_body=$(cat /tmp/layoutlib-exp-receipt)"
            ps -eo user,group,pid,etime,args | grep '[a]gentos_node.capability_http' || true
            echo 'local_capability_gateway=PASS'
          } | tee "$OUT"
      - name: Upload install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layoutlib-capability-gateway-install-evidence
          path: .agentos/evidence/layoutlib-capability-gateway-install.txt
          if-no-files-found: ignore
          retention-days: 30
