name: Issue 72 Prepare Minimal Integration Diff

on:
  push:
    branches: [core/issue-72-claude-liveness]
    paths: [.github/workflows/issue-72-cleanup-rebase.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/issue-72-claude-liveness
          fetch-depth: 0

      - name: Rebase work onto current Core integration and remove diagnostic scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin core/integration
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          # The permanent change is deliberately only the Claude executor contract
          # plus its regression tests. Restore the Action Relay and remove all
          # temporary investigation workflows/evidence before integration.
          git checkout origin/core/integration -- agentos_node/action_relay.py
          git rm -f tests/test_claude_liveness_action.py 2>/dev/null || true
          git rm -f .agentos/evidence/core/issue-72-runtime-write-boundary.json 2>/dev/null || true
          git rm -f .github/workflows/issue-72-build-claude-liveness-diagnostic.yml 2>/dev/null || true
          git rm -f .github/workflows/issue-72-live-ubuntu-claude-probes.yml 2>/dev/null || true
          git rm -f .github/workflows/issue-72-runtime-write-boundary-probe.yml 2>/dev/null || true
          git rm -f .github/workflows/issue-72-fix-claude-oauth-headless.yml 2>/dev/null || true
          git rm -f .github/workflows/issue-72-cleanup-rebase.yml 2>/dev/null || true

          git add agentos_node/action_relay.py
          git commit -m 'chore(agentos): remove temporary #72 diagnostic scaffolding' || true
          git merge --no-edit origin/core/integration

      - name: Verify minimal Claude relay fix against current Core
        run: |
          python3 -m unittest tests.test_antigravity_relay_worker -v
          python3 -m py_compile agentos_node/antigravity_relay_worker.py tests/test_antigravity_relay_worker.py
          ! grep -n 'return \[str(candidate), "--bare"' agentos_node/antigravity_relay_worker.py
          git diff --check origin/core/integration...HEAD
          echo '=== integration diff ==='
          git diff --stat origin/core/integration...HEAD
          git diff --name-only origin/core/integration...HEAD

      - name: Push cleaned issue branch
        run: git push origin HEAD:core/issue-72-claude-liveness
