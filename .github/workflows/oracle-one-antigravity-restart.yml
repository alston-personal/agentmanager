name: Oracle ONE Refresh via Antigravity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    if: github.actor == 'alstonhuang'
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    steps:
      - name: Restart accepted immutable ONE runtime
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=/home/ubuntu/agent-data/runtime/core/current
          RELEASE="$(readlink -f "$CURRENT" 2>/dev/null || true)"
          test -n "$RELEASE"
          case "$RELEASE" in
            /home/ubuntu/agent-data/releases/core/*) ;;
            *) echo "ERROR: Core current is not immutable: $RELEASE" >&2; exit 20;;
          esac

          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user restart agentos-realm-fabric.service

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 4 http://127.0.0.1:8780/v1/health >/tmp/one-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          systemctl --user is-active --quiet agentos-realm-fabric.service
          echo "one_runtime_release=$RELEASE"
          echo "mutable_checkout_mutation=NONE"
          echo "one_runtime_generation_refresh=PASS"

      - name: Verify ONE endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 5 http://127.0.0.1:8780/v1/health >/dev/null
          test "$(curl -sS -o /tmp/bootstrap.out -w '%{http_code}' --max-time 5 'http://127.0.0.1:8780/v1/bootstrap?node_id=vopc5750')" != 404
          test "$(curl -sS -o /tmp/benchmark.out -w '%{http_code}' --max-time 5 -X POST -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:8780/v1/benchmark)" != 404
          echo 'one_runtime_generation=PASS'
