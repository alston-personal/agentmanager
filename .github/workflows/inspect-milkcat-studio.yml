# inspection trigger 2026-08-25 nginx-perms
name: Inspect MilkCat Studio Integration Surface

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-milkcat-studio.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect website and local hosting configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/milkcat-studio-inspection.txt
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "hostname=$(hostname)"
            echo '=== HTTP HEADERS ==='
            curl -k -sS -I --max-time 15 https://studio.milkcat.org/ || true
            echo '=== EXACT STUDIO NGINX ==='
            sed -n '1,260p' /etc/nginx/sites-enabled/studio.milkcat.org 2>/dev/null || true
            echo '=== NGINX PERMISSIONS ==='
            id
            stat -c '%n owner=%U group=%G mode=%a' /etc/nginx /etc/nginx/sites-enabled /etc/nginx/sites-enabled/studio.milkcat.org 2>/dev/null || true
            test -w /etc/nginx/sites-enabled/studio.milkcat.org && echo nginx_config_writable=yes || echo nginx_config_writable=no
            echo '--- sudo -n -l ---'
            sudo -n -l 2>&1 || true
            echo '=== LISTENERS ==='
            ss -lnt | sed -n '1,220p' || true
            echo '=== PROCESSES ==='
            ps -eo user,pid,ppid,args --sort=pid | grep -Ei 'node|python|uvicorn|gunicorn|astro|npm|8090|300[0-9]|301[0-9]|3020' | grep -v grep | head -n 260 || true
            echo '=== WEBSITE CHECKOUT ==='
            if [ -d /home/ubuntu/zeus-writer ]; then
              cd /home/ubuntu/zeus-writer
              echo "repo=$(git remote get-url origin 2>/dev/null || true)"
              echo "branch=$(git branch --show-current 2>/dev/null || true)"
              echo "sha=$(git rev-parse HEAD 2>/dev/null || true)"
              echo "status=$(git status --porcelain 2>/dev/null | wc -l)"
            fi
          } 2>&1 | tee "$OUT"
      - name: Commit inspection evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/milkcat-studio-inspection.txt
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(studio): inspect nginx permissions'
          git push
