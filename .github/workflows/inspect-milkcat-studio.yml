name: Resolve MilkCat Dashboard Upstream

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-milkcat-studio.yml'

permissions:
  contents: write

jobs:
  inspect-dashboard:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Resolve port 3000 process
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/dashboard-upstream.txt
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "hostname=$(hostname)"
            echo '=== PORT 3000 ==='
            ss -lntp 'sport = :3000' 2>&1 || true
            PID=$(ss -lntp 'sport = :3000' 2>/dev/null | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -1)
            if [ -z "$PID" ]; then
              PID=$(pgrep -f '(^| )[^ ]*(node|npm|next)[^ ]*.*3000|next-server' | head -1 || true)
            fi
            echo "pid=${PID:-unknown}"
            if [ -n "$PID" ] && [ -d "/proc/$PID" ]; then
              echo "user=$(stat -c %U /proc/$PID)"
              echo "cwd=$(readlink -f /proc/$PID/cwd 2>/dev/null || true)"
              printf 'cmdline='; tr '\0' ' ' < /proc/$PID/cmdline 2>/dev/null || true; echo
              echo "exe=$(readlink -f /proc/$PID/exe 2>/dev/null || true)"
              echo '--- env hints ---'
              tr '\0' '\n' < /proc/$PID/environ 2>/dev/null | grep -E '^(PORT|PWD|NODE_ENV|npm_|NEXT_|AGENTOS_)=' | sed -E 's/(TOKEN|SECRET|KEY|PASSWORD)=.*/\1=[REDACTED]/' || true
            fi
            echo '=== KNOWN ROUTE HEALTH ==='
            curl -sS -o /tmp/dashboard-health.out -w 'http=%{http_code}\n' http://127.0.0.1:3000/dashboard 2>&1 || true
            head -c 300 /tmp/dashboard-health.out 2>/dev/null || true; echo
          } 2>&1 | tee "$OUT"
      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/dashboard-upstream.txt
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(studio): resolve dashboard upstream'
          git push
