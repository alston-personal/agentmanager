name: Resolve MilkCat Dashboard Upstream

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-milkcat-studio.yml'

permissions:
  contents: write

jobs:
  inspect-dashboard:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Resolve TCP 3000 owner without fallback guessing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/dashboard-upstream.txt
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "hostname=$(hostname)"
            echo '=== PORT 3000 ==='
            ss -lntp 'sport = :3000' 2>&1 || true
            echo '=== FUSER ==='
            fuser -v 3000/tcp 2>&1 || true
            echo '=== LSOF ==='
            lsof -nP -iTCP:3000 -sTCP:LISTEN 2>&1 || true
            PID=$(fuser 3000/tcp 2>/dev/null | tr -cd '0-9 ' | awk '{print $1}' || true)
            echo "socket_pid=${PID:-unknown}"
            if [ -n "$PID" ] && [ -d "/proc/$PID" ]; then
              echo '=== VERIFIED PROCESS ==='
              ps -o user,pid,ppid,lstart,args -p "$PID" || true
              P1=$(ps -o ppid= -p "$PID" | tr -d ' ' || true)
              [ -n "$P1" ] && ps -o user,pid,ppid,lstart,args -p "$P1" || true
              P2=$([ -n "$P1" ] && ps -o ppid= -p "$P1" | tr -d ' ' || true)
              [ -n "$P2" ] && ps -o user,pid,ppid,lstart,args -p "$P2" || true
              echo '=== CGROUP ==='; cat "/proc/$PID/cgroup" 2>&1 || true
            else
              echo 'process_identity=unresolved_due_to_permissions'
            fi
            echo '=== KNOWN ROUTE HEALTH ==='
            curl -sS -o /tmp/dashboard-health.out -w 'http=%{http_code}\n' http://127.0.0.1:3000/dashboard 2>&1 || true
            head -c 300 /tmp/dashboard-health.out 2>/dev/null || true; echo
          } 2>&1 | tee "$OUT"
      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/dashboard-upstream.txt
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(studio): verify dashboard socket owner'
          git push
