name: Oracle Core Runtime Converge Now

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  converge:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    steps:
      - name: Restart current immutable Core services only
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = "agentos-node"
          CURRENT=/home/ubuntu/agent-data/runtime/core/current
          RELEASE="$(readlink -f "$CURRENT" 2>/dev/null || true)"
          test -n "$RELEASE"
          case "$RELEASE" in
            /home/ubuntu/agent-data/releases/core/*) ;;
            *) echo "ERROR: current Core runtime is not an immutable release: $RELEASE" >&2; exit 20;;
          esac
          test -d "$RELEASE"
          echo "core_runtime_current=$RELEASE"

          # This compatibility workflow no longer mutates the source cache.
          # It only restarts the already-accepted immutable generation.
          sudo -n -u ubuntu env             XDG_RUNTIME_DIR=/run/user/1001             DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1001/bus             systemctl --user restart os-chronos.service agentos-core-supervisor.service

          sudo -n -u ubuntu env             XDG_RUNTIME_DIR=/run/user/1001             DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1001/bus             systemctl --user is-active --quiet os-chronos.service

          sudo -n -u ubuntu env             XDG_RUNTIME_DIR=/run/user/1001             DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1001/bus             systemctl --user is-active --quiet agentos-core-supervisor.service

          for unit in os-chronos.service agentos-core-supervisor.service; do
            pid="$(sudo -n -u ubuntu env XDG_RUNTIME_DIR=/run/user/1001 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1001/bus systemctl --user show "$unit" -p MainPID --value)"
            test -n "$pid" && test "$pid" != 0
            cwd="$(readlink -f "/proc/$pid/cwd")"
            case "$cwd" in
              "$RELEASE"|"$RELEASE"/*) ;;
              *) echo "ERROR: $unit escaped immutable runtime cwd=$cwd" >&2; exit 21;;
            esac
            echo "core_runtime_restart=$unit:PASS"
          done
          echo "mutable_checkout_mutation=NONE"
          echo "core_runtime_converge_compat=PASS"
