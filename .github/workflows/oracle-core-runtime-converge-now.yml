name: Oracle Core Runtime Converge Now

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy mutable-checkout repair is retired
        run: |
          echo 'legacy_core_runtime_converge=RETIRED'
          echo 'reason=Core production runtime is governed by immutable /home/ubuntu/agent-data/releases/core generations.'
          echo 'mutable_checkout_mutation=FORBIDDEN'
          echo 'Use the governed Core immutable-runtime convergence/deployment path instead.'
