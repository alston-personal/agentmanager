name: Oracle Bootstrap Milkcat Owner Admin

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: oracle-milkcat-owner-admin-bootstrap
  cancel-in-progress: false

jobs:
  grant:
    if: ${{ github.event.issue.number == 449 && !github.event.issue.pull_request && github.event.comment.user.login == 'alstonhuang' && github.event.comment.user.id == 5249206 }}
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Validate owner command
        id: request
        shell: bash
        run: |
          set -euo pipefail
          TARGET_B64=$(python3 - "$GITHUB_EVENT_PATH" <<'PY'
          import base64, datetime, json, re, sys
          with open(sys.argv[1], encoding='utf8') as stream:
              event = json.load(stream)
          comment = event['comment']
          author = comment['user']
          assert author.get('login') == 'alstonhuang' and author.get('id') == 5249206
          assert event['issue']['number'] == 449 and 'pull_request' not in event['issue']
          created = datetime.datetime.fromisoformat(comment['created_at'].replace('Z', '+00:00'))
          now = datetime.datetime.now(datetime.timezone.utc)
          assert datetime.timedelta(0) <= now - created <= datetime.timedelta(minutes=10), 'admin_grant_command_expired'
          obj = json.loads(comment['body'])
          assert isinstance(obj, dict) and set(obj) == {'schema', 'action', 'identity'}
          assert obj['schema'] == 'milkcat.admin-bootstrap/v1' and obj['action'] == 'grant'
          identity = obj['identity']
          assert isinstance(identity, str) and re.fullmatch(r'google:username:[a-z0-9._%+-]+@milkcat\.org', identity)
          print(base64.b64encode(identity.encode('ascii')).decode('ascii'))
          PY
          )
          echo "::add-mask::$TARGET_B64"
          echo "target_b64=$TARGET_B64" >> "$GITHUB_OUTPUT"
          echo 'owner_bootstrap_command=AUTHORIZED'

      - name: Start existing Oracle SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Update owner-only Oracle allowlist
        env:
          TARGET_B64: ${{ steps.request.outputs.target_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_USER"
          PORT="${DEPLOY_PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "$DEPLOY_USER@127.0.0.1" bash -s -- "$TARGET_B64" <<'REMOTE'
          set -euo pipefail
          python3 - "$1" <<'PY'
          import base64, os, pathlib, re, stat, sys, tempfile
          identity = base64.b64decode(sys.argv[1], validate=True).decode('ascii')
          assert re.fullmatch(r'google:username:[a-z0-9._%+-]+@milkcat\.org', identity)
          directory = pathlib.Path.home() / '.config' / 'milkcat'
          directory.mkdir(mode=0o700, parents=True, exist_ok=True)
          dst = directory / 'admin-identities'
          folder = directory.lstat()
          assert stat.S_ISDIR(folder.st_mode) and folder.st_uid == os.getuid()
          assert (folder.st_mode & 0o077) == 0, 'admin_dir_permissions_insecure'
          if dst.exists() or dst.is_symlink():
              st = dst.lstat()
              assert stat.S_ISREG(st.st_mode) and st.st_uid == os.getuid()
              assert (st.st_mode & 0o077) == 0, 'admin_file_permissions_insecure'
              existing = re.split(r'[\r\n,]+', dst.read_text(encoding='utf8'))
          else:
              existing = []
          members = {s.strip().lower() for s in existing if s.strip()}
          members.add(identity)
          fd, name = tempfile.mkstemp(prefix='.admin-identities-', dir=directory)
          try:
              with os.fdopen(fd, 'w', encoding='utf8') as stream:
                  stream.write('\n'.join(sorted(members)) + '\n')
                  stream.flush()
                  os.fsync(stream.fileno())
              os.chmod(name, 0o600)
              os.replace(name, dst)
          finally:
              if os.path.exists(name):
                  os.unlink(name)
          verify = dst.lstat()
          assert stat.S_ISREG(verify.st_mode) and verify.st_uid == os.getuid()
          assert (verify.st_mode & 0o077) == 0
          assert identity in dst.read_text(encoding='utf8').splitlines()
          print('milkcat_private_admin_allowlist=PASS')
          PY
          auth_code=$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 http://127.0.0.1:3000/dashboard/api/auth/session)
          admin_code=$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 http://127.0.0.1:3000/dashboard/api/admin/usage)
          test "$auth_code" = 200 && test "$admin_code" = 401
          echo "milkcat_owner_admin_grant=PASS auth_status=$auth_code unauth_admin_status=$admin_code"
          REMOTE
