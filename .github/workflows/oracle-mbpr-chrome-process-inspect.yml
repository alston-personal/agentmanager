name: Oracle MBPR Chrome Process Inspect
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 3
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Chrome process arguments
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          cmd=json.load(open('.agentos/commands/mbpr-chrome-process-inspect.json',encoding='utf-8'))
          assert cmd.get('node_id')=='mbpr'
          tid='mbpr-chrome-process-'+str(int(time.time()))
          store=RealmFabricStore()
          store.queue_task('mbpr',{'schema':'agentos.node-task/v0.1','task_id':tid,'action':'process.inspect','query':'Google Chrome','limit':50,'cognition_ids_used':[]})
          for _ in range(40):
              r=store.get_receipt(tid)
              if r:
                  if r.get('ok') is not True: raise SystemExit(str(r))
                  print(json.dumps({'processes':r.get('processes'),'count':r.get('count')},ensure_ascii=False))
                  print('mbpr_chrome_process_inspect=PASS')
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('Chrome process inspect timeout')
          PY
