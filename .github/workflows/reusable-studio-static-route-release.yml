name: Reusable Studio Static Route Release

on:
  workflow_call:
    inputs:
      source_sha:
        description: Pinned canonical alston-personal/studio-web commit SHA
        required: true
        type: string
      route:
        description: Single static route directory under dist, without slashes
        required: true
        type: string
      backup_key:
        description: Release backup namespace under agent-data/releases/studio-web
        required: true
        type: string
      receipt_schema:
        description: Receipt schema identifier
        required: true
        type: string
      acceptance_anchors:
        description: Newline-delimited literal strings required in built/local/public HTML
        required: true
        type: string
      acceptance_nested_routes:
        description: Optional newline-separated hall slugs to verify on the public site after publication
        required: false
        type: string
        default: ''
      acceptance_nested_anchors:
        description: Optional newline-separated literal strings required in each public nested route HTML
        required: false
        type: string
        default: ''
      acceptance_focused_nested_route:
        description: Optional one nested route needing an additional route-specific HTML anchor
        required: false
        type: string
        default: ''
      acceptance_focused_nested_anchor:
        description: Additional literal marker required only in the specified nested route
        required: false
        type: string
        default: ''
      acceptance_js_module:
        description: Optional relative JS module path whose public response must have executable JavaScript MIME
        required: false
        type: string
        default: ''
      acceptance_js_anchor:
        description: Literal body marker required in the accepted JavaScript module
        required: false
        type: string
        default: ''
      credit_account:
        description: Optional funded Milkcat Platform credit account; empty disables metering
        required: false
        type: string
        default: ''
      credit_cost:
        description: Integer credits reserved/committed when credit_account is enabled
        required: false
        type: number
        default: 0
    secrets:
      AGENTOS_DEPLOY_USER:
        required: false
      AGENTOS_DEPLOY_SSH_PORT:
        required: false
      AGENTOS_DEPLOY_SSH_KEY:
        required: false
      N8N_DEPLOY_USER:
        required: false
      N8N_DEPLOY_SSH_PORT:
        required: false
      N8N_DEPLOY_SSH_KEY:
        required: false

permissions:
  contents: read

jobs:
  release:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 12
    env:
      SOURCE_REPOSITORY: alston-personal/studio-web
      SOURCE_SHA: ${{ inputs.source_sha }}
      ROUTE: ${{ inputs.route }}
      BACKUP_KEY: ${{ inputs.backup_key }}
      RECEIPT_SCHEMA: ${{ inputs.receipt_schema }}
      ACCEPTANCE_ANCHORS: ${{ inputs.acceptance_anchors }}
      ACCEPTANCE_NESTED_ROUTES: ${{ inputs.acceptance_nested_routes }}
      ACCEPTANCE_NESTED_ANCHORS: ${{ inputs.acceptance_nested_anchors }}
      ACCEPTANCE_FOCUSED_NESTED_ROUTE: ${{ inputs.acceptance_focused_nested_route }}
      ACCEPTANCE_FOCUSED_NESTED_ANCHOR: ${{ inputs.acceptance_focused_nested_anchor }}
      ACCEPTANCE_JS_MODULE: ${{ inputs.acceptance_js_module }}
      ACCEPTANCE_JS_ANCHOR: ${{ inputs.acceptance_js_anchor }}
      CREDIT_ACCOUNT: ${{ inputs.credit_account }}
      CREDIT_COST: ${{ inputs.credit_cost }}
      PLATFORM_EXECUTION_ID: studio-static-route-${{ inputs.route }}-${{ github.run_id }}
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROUTE" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$BACKUP_KEY" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$RECEIPT_SCHEMA" =~ ^[A-Za-z0-9._/-]+$ ]]
          test -n "$ACCEPTANCE_ANCHORS"
          while IFS= read -r anchor || [ -n "$anchor" ]; do
            [ -z "$anchor" ] && continue
            case "$anchor" in
              *$'\n'*|*$'\r'*) echo 'invalid acceptance anchor' >&2; exit 1 ;;
            esac
          done <<< "$ACCEPTANCE_ANCHORS"
          if [ -n "$CREDIT_ACCOUNT" ]; then
            [[ "$CREDIT_COST" =~ ^[1-9][0-9]*$ ]]
          else
            test "$CREDIT_COST" = "0"
          fi
          echo "studio_static_route_contract=PASS route=$ROUTE source_sha=$SOURCE_SHA"

      - name: Prepare governed platform execution
        if: ${{ inputs.credit_account != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/milkcat_platform_execution.py prepare \
            --execution-id "$PLATFORM_EXECUTION_ID" \
            --account-id "$CREDIT_ACCOUNT" \
            --credit-cost "$CREDIT_COST" \
            --capability studio.static-route.release \
            --sync-studio-capabilities
          echo "milkcat_platform_execution=PREPARED id=$PLATFORM_EXECUTION_ID account=$CREDIT_ACCOUNT cost=$CREDIT_COST"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Build pinned Studio Web and publish one static route
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ANCHORS_B64=$(printf '%s' "$ACCEPTANCE_ANCHORS" | base64 -w0)
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$ROUTE" "$BACKUP_KEY" "$RECEIPT_SCHEMA" "$GITHUB_RUN_ID" "$ANCHORS_B64" <<'REMOTE'
          set -euo pipefail
          REPO="$1"; SOURCE_SHA="$2"; ROUTE="$3"; BACKUP_KEY="$4"; RECEIPT_SCHEMA="$5"; RUN_ID="$6"; ANCHORS_B64="$7"
          LIVE=/home/ubuntu/zeus-writer/website/dist
          TMP=$(mktemp -d /tmp/studio-static-route-release-XXXXXX)
          SRC="$TMP/studio-web"
          ROUTE_DIR="$SRC/dist/$ROUTE"
          ANCHOR_FILE="$TMP/acceptance-anchors.txt"
          BACKUP=/home/ubuntu/agent-data/releases/studio-web/$BACKUP_KEY/${SOURCE_SHA:0:12}-${RUN_ID}
          NEW_ROUTE="$LIVE/.${ROUTE}-${RUN_ID}"
          DEPLOYED=0

          printf '%s' "$ANCHORS_B64" | base64 -d > "$ANCHOR_FILE"

          validate_html() {
            target="$1"
            while IFS= read -r anchor || [ -n "$anchor" ]; do
              [ -z "$anchor" ] && continue
              grep -Fq -- "$anchor" "$target"
            done < "$ANCHOR_FILE"
          }
          cleanup() {
            rm -rf "$TMP" "$NEW_ROUTE" 2>/dev/null || true
          }
          rollback() {
            if [ "$DEPLOYED" = 1 ]; then
              rm -rf "$LIVE/$ROUTE" || true
              if [ -d "$BACKUP/$ROUTE.previous" ]; then
                cp -a "$BACKUP/$ROUTE.previous" "$LIVE/$ROUTE" || true
              fi
            fi
          }
          on_error() {
            rc=$?
            trap - ERR
            rollback || true
            cleanup || true
            exit "$rc"
          }
          trap 'on_error' ERR
          trap 'cleanup' EXIT

          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROUTE" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$BACKUP_KEY" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          test -d "$LIVE"
          /usr/bin/gh auth status >/dev/null
          /usr/bin/gh repo clone "$REPO" "$SRC" -- --no-checkout
          /usr/bin/git -C "$SRC" fetch --depth=1 origin "$SOURCE_SHA"
          /usr/bin/git -C "$SRC" checkout --detach "$SOURCE_SHA"
          test "$(/usr/bin/git -C "$SRC" rev-parse HEAD)" = "$SOURCE_SHA"

          cd "$SRC"
          npm install --no-package-lock --ignore-scripts
          npm run build

          echo "studio_static_route_build_pwd=$(pwd)"
          echo "studio_static_route_expected_dir=$ROUTE_DIR"
          test -f "$ROUTE_DIR/index.html"
          validate_html "$ROUTE_DIR/index.html"
          echo "studio_static_route_build_acceptance=PASS route=$ROUTE"

          mkdir -p "$BACKUP"
          if [ -d "$LIVE/$ROUTE" ]; then
            cp -a "$LIVE/$ROUTE" "$BACKUP/$ROUTE.previous"
          fi

          cp -a "$ROUTE_DIR" "$NEW_ROUTE"
          find "$NEW_ROUTE" -type d -exec chmod 0755 {} +
          find "$NEW_ROUTE" -type f -exec chmod 0644 {} +

          ASSET_REFS="$TMP/astro-assets.txt"
          # Nested route pages may reference different hashed CSS/JS than index.html.
          find "$ROUTE_DIR" -type f -name '*.html' -print0 \
            | xargs -0 -r grep -ohE '/_astro/[A-Za-z0-9._/-]+' \
            | sort -u > "$ASSET_REFS" || true
          if [ -s "$ASSET_REFS" ]; then
            mkdir -p "$LIVE/_astro"
            while IFS= read -r ref; do
              [ -z "$ref" ] && continue
              src_asset="$SRC/dist$ref"
              live_asset="$LIVE$ref"
              test -f "$src_asset"
              mkdir -p "$(dirname "$live_asset")"
              if [ -f "$live_asset" ]; then
                cmp -s "$src_asset" "$live_asset"
              else
                cp -a "$src_asset" "$live_asset"
                chmod 0644 "$live_asset"
              fi
            done < "$ASSET_REFS"
          fi

          rm -rf "$LIVE/$ROUTE"
          mv "$NEW_ROUTE" "$LIVE/$ROUTE"
          DEPLOYED=1

          curl -kfsS --retry 3 --resolve studio.milkcat.org:443:127.0.0.1 \
            "https://studio.milkcat.org/$ROUTE/" -o "$TMP/route-live"
          validate_html "$TMP/route-live"
          if [ -s "$ASSET_REFS" ]; then
            while IFS= read -r ref; do
              [ -z "$ref" ] && continue
              test -f "$LIVE$ref"
              curl -kfsS --retry 3 --resolve studio.milkcat.org:443:127.0.0.1 \
                "https://studio.milkcat.org$ref" -o /dev/null
            done < "$ASSET_REFS"
          fi
          echo "local_nginx_studio_static_route_acceptance=PASS route=$ROUTE"
          echo "local_nginx_studio_static_assets_acceptance=PASS route=$ROUTE"

          printf '%s\n' \
            "schema=$RECEIPT_SCHEMA" \
            "source_repository=$REPO" \
            "source_sha=$SOURCE_SHA" \
            "scope=/$ROUTE/" \
            "backup=$BACKUP" \
            "ok=true" > "$BACKUP/receipt.txt"
          trap - ERR
          echo "studio_static_route_deploy=PASS route=$ROUTE backup=$BACKUP"
          REMOTE

      - name: Public acceptance
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://studio.milkcat.org
          OUT=/tmp/studio-static-route-public-${GITHUB_RUN_ID}
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors "$BASE/$ROUTE/?_=$GITHUB_RUN_ID" -o "$OUT"
          while IFS= read -r anchor || [ -n "$anchor" ]; do
            [ -z "$anchor" ] && continue
            grep -Fq -- "$anchor" "$OUT"
          done <<< "$ACCEPTANCE_ANCHORS"

          ASSET_REFS=/tmp/studio-static-route-public-assets-${GITHUB_RUN_ID}
          grep -oE '/_astro/[A-Za-z0-9._/-]+' "$OUT" | sort -u > "$ASSET_REFS" || true
          if [ -s "$ASSET_REFS" ]; then
            while IFS= read -r ref; do
              [ -z "$ref" ] && continue
              curl -fsS --retry 8 --retry-delay 2 --retry-all-errors "$BASE$ref" -o /dev/null
            done < "$ASSET_REFS"
          fi
          # A module's HTTP 200 is insufficient: browsers reject an ES module
          # if Nginx serves it as octet-stream. Keep this check inside public
          # acceptance so a failure triggers the existing backed-up rollback.
          if [ -n "$ACCEPTANCE_JS_MODULE" ]; then
            [[ "$ACCEPTANCE_JS_MODULE" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*\.js$ ]] &&
              [[ "$ACCEPTANCE_JS_MODULE" != *..* ]] || { echo 'invalid JS module path' >&2; exit 2; }
            [ -n "$ACCEPTANCE_JS_ANCHOR" ] || { echo 'missing JS module anchor' >&2; exit 2; }
            JS_HEADERS="${OUT}-module.headers"
            JS_BODY="${OUT}-module.js"
            curl -fsS --retry 8 --retry-delay 2 --retry-all-errors -D "$JS_HEADERS" \
              "$BASE/$ROUTE/$ACCEPTANCE_JS_MODULE?_=$GITHUB_RUN_ID" -o "$JS_BODY"
            grep -Eiq '^content-type:[[:space:]]*(application|text)/(x-)?javascript([;[:space:]]|$)' "$JS_HEADERS" ||
              { echo 'public JS module MIME rejected' >&2; exit 1; }
            grep -Fq -- "$ACCEPTANCE_JS_ANCHOR" "$JS_BODY" ||
              { echo 'public JS module body rejected' >&2; exit 1; }
            echo "public_studio_static_js_module_acceptance=PASS route=$ROUTE/$ACCEPTANCE_JS_MODULE"
          fi
          echo "public_studio_static_route_acceptance=PASS route=$ROUTE"
          echo "public_studio_static_assets_acceptance=PASS route=$ROUTE"
          # Public nested pages are checked within the same job so any failure
          # triggers the existing backed-up route rollback on the next step.
          FOCUSED_NESTED_FOUND=0
          if [ -n "$ACCEPTANCE_FOCUSED_NESTED_ROUTE" ]; then
            [[ "$ACCEPTANCE_FOCUSED_NESTED_ROUTE" =~ ^[a-z0-9][a-z0-9-]*$ ]] ||
              { echo 'invalid focused nested route' >&2; exit 2; }
            [ -n "$ACCEPTANCE_FOCUSED_NESTED_ANCHOR" ] ||
              { echo 'missing focused nested anchor' >&2; exit 2; }
          fi
          while IFS= read -r nested || [ -n "$nested" ]; do
            [ -z "$nested" ] && continue
            [[ "$nested" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo 'invalid nested route' >&2; exit 2; }
            NESTED_OUT="${OUT}-${nested}"
            curl -fsS --retry 8 --retry-delay 2 --retry-all-errors "$BASE/$ROUTE/$nested/?_=$GITHUB_RUN_ID" -o "$NESTED_OUT"
            while IFS= read -r anchor || [ -n "$anchor" ]; do
              [ -z "$anchor" ] && continue
              grep -Fq -- "$anchor" "$NESTED_OUT"
            done <<< "$ACCEPTANCE_NESTED_ANCHORS"
            if [ -n "$ACCEPTANCE_FOCUSED_NESTED_ROUTE" ] &&
               [ "$nested" = "$ACCEPTANCE_FOCUSED_NESTED_ROUTE" ]; then
              grep -Fq -- "$ACCEPTANCE_FOCUSED_NESTED_ANCHOR" "$NESTED_OUT" ||
                { echo 'focused nested route anchor rejected' >&2; exit 1; }
              FOCUSED_NESTED_FOUND=1
              echo "public_studio_static_focused_nested_route_acceptance=PASS route=$ROUTE/$nested"
            fi
            echo "public_studio_static_nested_route_acceptance=PASS route=$ROUTE/$nested"
          done <<< "$ACCEPTANCE_NESTED_ROUTES"
          if [ -n "$ACCEPTANCE_FOCUSED_NESTED_ROUTE" ] &&
             [ "$FOCUSED_NESTED_FOUND" -ne 1 ]; then
            echo 'focused nested route not in acceptance list' >&2
            exit 1
          fi

      - name: Roll back route after public acceptance failure
        if: ${{ failure() && steps.publish.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$ROUTE" "$BACKUP_KEY" "$RECEIPT_SCHEMA" "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          REPO="$1"; SOURCE_SHA="$2"; ROUTE="$3"; BACKUP_KEY="$4"; RECEIPT_SCHEMA="$5"; RUN_ID="$6"
          LIVE=/home/ubuntu/zeus-writer/website/dist
          BACKUP=/home/ubuntu/agent-data/releases/studio-web/$BACKUP_KEY/${SOURCE_SHA:0:12}-${RUN_ID}

          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROUTE" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$BACKUP_KEY" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          test -d "$BACKUP"

          rm -rf "$LIVE/$ROUTE"
          if [ -d "$BACKUP/$ROUTE.previous" ]; then
            cp -a "$BACKUP/$ROUTE.previous" "$LIVE/$ROUTE"
          fi

          printf '%s\n' \
            "schema=$RECEIPT_SCHEMA" \
            "source_repository=$REPO" \
            "source_sha=$SOURCE_SHA" \
            "scope=/$ROUTE/" \
            "backup=$BACKUP" \
            "ok=false" \
            "rolled_back=true" \
            "failure_stage=public_acceptance" > "$BACKUP/receipt.txt"
          echo "public_failure_rollback=PASS route=$ROUTE backup=$BACKUP"
          REMOTE

      - name: Settle governed platform execution
        if: ${{ always() && inputs.credit_account != '' }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          RECEIPT="${AGENT_DATA_ROOT:-/home/ubuntu/agent-data}/platform/executions/${PLATFORM_EXECUTION_ID}.json"
          if [ ! -f "$RECEIPT" ]; then
            echo "milkcat_platform_execution=NO_RESERVATION id=$PLATFORM_EXECUTION_ID"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            python3 scripts/milkcat_platform_execution.py settle \
              --execution-id "$PLATFORM_EXECUTION_ID" \
              --success
          else
            python3 scripts/milkcat_platform_execution.py settle \
              --execution-id "$PLATFORM_EXECUTION_ID" \
              --failure
          fi
          echo "milkcat_platform_execution=SETTLED id=$PLATFORM_EXECUTION_ID job_status=$JOB_STATUS"
