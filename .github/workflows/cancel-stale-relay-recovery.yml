name: Cancel Superseded Relay Recovery Runs

on:
  push:
    paths:
      - '.github/workflows/cancel-stale-relay-recovery.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel obsolete self-hosted recovery runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP_SAFE_SHA: f708d117ab36c191fc9760c9a135da93aebc5ec6
        shell: bash
        run: |
          set -euo pipefail

          cancel_run() {
            local run_id="$1"
            code=$(curl -sS -o /tmp/cancel-$run_id.out -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GH_REPO/actions/runs/$run_id/cancel")
            cat /tmp/cancel-$run_id.out || true
            echo "run_id=$run_id http_code=$code"
            case "$code" in 202|409) ;; *) return 1 ;; esac
          }

          for run_id in 32858420762 32858849735 32858516453; do
            cancel_run "$run_id"
          done

          list_active() {
            local workflow="$1"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GH_REPO/actions/workflows/$workflow/runs?per_page=20"
          }

          # Retire every active run of the old inline bootstrap.
          list_active oracle-bootstrap-action-relay-via-chronos.yml | python3 -c '
          import json,sys
          for r in json.load(sys.stdin).get("workflow_runs", []):
              if r.get("status") in {"queued","in_progress","waiting","pending"}:
                  print(r["id"])
          ' > /tmp/old-inline-runs
          while read -r run_id; do [ -z "$run_id" ] || cancel_run "$run_id"; done < /tmp/old-inline-runs

          # Keep only the run created from the latest safe-script commit.
          list_active oracle-bootstrap-action-relay-via-chronos-safe.yml | python3 -c '
          import json,sys
          keep=sys.argv[1]
          for r in json.load(sys.stdin).get("workflow_runs", []):
              if r.get("status") in {"queued","in_progress","waiting","pending"} and r.get("head_sha") != keep:
                  print(r["id"])
          ' "$KEEP_SAFE_SHA" > /tmp/old-safe-runs
          while read -r run_id; do [ -z "$run_id" ] || cancel_run "$run_id"; done < /tmp/old-safe-runs

          echo 'superseded_recovery_cancel=PASS'
