name: Cancel Superseded Relay Recovery Runs

on:
  push:
    paths:
      - '.github/workflows/cancel-stale-relay-recovery.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel obsolete self-hosted recovery runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # These runs belong to the superseded LLM self-repair path. Cancelling
          # them only releases CI capacity; quarantined capsules remain untouched.
          for run_id in 32858420762 32858849735 32858516453; do
            echo "Cancelling superseded run $run_id"
            code=$(curl -sS -o /tmp/cancel-$run_id.out -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GH_REPO/actions/runs/$run_id/cancel")
            cat /tmp/cancel-$run_id.out || true
            echo "http_code=$code"
            case "$code" in
              202|409) ;;
              *) exit 1 ;;
            esac
          done
          echo 'superseded_recovery_cancel=PASS'
