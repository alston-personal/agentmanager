name: Cancel Superseded Relay Recovery Runs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cancel-stale-relay-recovery.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only explicitly obsolete recovery runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          cancel_run() {
            local run_id="$1"
            code=$(curl -sS -o /tmp/cancel-$run_id.out -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GH_REPO/actions/runs/$run_id/cancel")
            cat /tmp/cancel-$run_id.out || true
            echo "run_id=$run_id http_code=$code"
            case "$code" in 202|409) ;; *) return 1 ;; esac
          }

          # Explicit historical/superseded attempts only.  32863178952 was
          # triggered after the control module changed but before the matching
          # workflow changed to the ubuntu-owned /tmp rendezvous contract.
          for run_id in 32858420762 32858849735 32858516453 32861439353 32862880330 32863178952; do
            cancel_run "$run_id"
          done

          # The original inline Chronos bootstrap is retired. Cancel any active
          # run from that legacy workflow, but leave current corrected bootstrap
          # control-plane runs alone.
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/oracle-bootstrap-action-relay-via-chronos.yml/runs?per_page=20" \
            | python3 -c '
          import json,sys
          for r in json.load(sys.stdin).get("workflow_runs", []):
              if r.get("status") in {"queued","in_progress","waiting","pending"}:
                  print(r["id"])
          ' > /tmp/old-inline-runs
          while read -r run_id; do
            [ -z "$run_id" ] || cancel_run "$run_id"
          done < /tmp/old-inline-runs

          echo 'current_corrected_bootstrap_auto_cancel=DISABLED'
          echo 'superseded_recovery_cancel=PASS'
