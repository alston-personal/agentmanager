name: Inspect VO10005870 Watchdog Logs

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/inspect-vo10005870-watchdog-logs.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Read watchdog and task state
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          f=RealmFabricStore()
          tid='inspect-watchdog-logs-20261002-1519'
          ps=r'''$log=Join-Path $env:LOCALAPPDATA 'AgentOS\watchdog\watchdog.log'
          $state=Join-Path $env:LOCALAPPDATA 'AgentOS\watchdog\state.json'
          $lease=Join-Path $env:USERPROFILE '.agentos\heartbeat-lease.json'
          $tasks=@()
          foreach($name in @('AgentOS Thin Client','AgentOS Thin Client Watchdog')){
            $t=Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue
            $i=Get-ScheduledTaskInfo -TaskName $name -ErrorAction SilentlyContinue
            if($t){$tasks += [pscustomobject]@{name=$name;state=[string]$t.State;lastRun=$i.LastRunTime;lastResult=$i.LastTaskResult;nextRun=$i.NextRunTime}}
          }
          $logLines=@()
          if(Test-Path $log){$logLines=Get-Content -LiteralPath $log -Tail 80}
          [pscustomobject]@{
            log_lines=$logLines;
            state=(if(Test-Path $state){Get-Content -Raw -LiteralPath $state}else{''});
            lease=(if(Test-Path $lease){Get-Content -Raw -LiteralPath $lease}else{''});
            tasks=$tasks
          } | ConvertTo-Json -Depth 5 -Compress'''
          if f.get_receipt(tid) is None:
              f.queue_task('VO10005870',{
                  'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec',
                  'executable':'powershell','argv':['-NoProfile','-NonInteractive','-Command',ps],
                  'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':20,
                  'cognition_ids_used':['demo://watchdog-debug/20261002'],
              })
          for _ in range(30):
              r=f.get_receipt(tid)
              if r is not None:
                  print(json.dumps(r,ensure_ascii=False,separators=(',',':')))
                  assert r.get('ok') is True and int(r.get('returncode') or 0)==0, r
                  break
              time.sleep(1)
          else:
              raise SystemExit('watchdog_log_receipt_missing')
          PY
          REMOTE
