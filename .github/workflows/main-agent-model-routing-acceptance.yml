name: Main Agent Model Routing Acceptance

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/main-agent-model-routing-acceptance.yml'
      - 'agentos_node/engineering_subagent_provider.py'
      - 'agentos_node/executor_provider_adapters.py'
      - 'agentos_node/codex_provider_adapter.py'
      - 'agentos_node/antigravity_relay_worker.py'
      - 'agentos_node/executor_profiles/**'
      - '.agentos/executors/**'
      - 'agentos_node/executor_reconcile.py'
      - 'agent_core/executor_job_contract.py'
      - 'agentos_node/executor_job_adapter.py'
      - 'agentos_node/executor_job_action_relay.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: main-agent-engineering-model-control
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos

    steps:
      - uses: actions/checkout@v4

      - name: Mint GitHub OIDC scheduler credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Ensure exact Action Runtime generation
        shell: bash
        run: |
          set -euo pipefail
          AGENTOS_DISPATCH_WAIT_SECONDS=720 \
            bash scripts/agentos_dispatch.sh agentos.runtime repair "$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/routing-runtime-rollout.txt"
          python3 - "$RUNNER_TEMP/routing-runtime-rollout.txt" "$GITHUB_SHA" <<'PY'
          import json,sys
          docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
          assert docs, 'missing runtime repair receipt'
          receipt=docs[-1].get('receipt') or {}
          assert receipt.get('schema')=='agentos.bootstrap-receipt/v1', receipt
          assert receipt.get('ok') is True, receipt
          assert receipt.get('source_commit')==sys.argv[2], receipt
          assert receipt.get('failure_class') in (None,''), receipt
          print('model_routing_exact_runtime=PASS')
          print('model_routing_runtime_source_commit='+sys.argv[2])
          PY

      - name: Refresh stable executor health snapshot
        id: health_submit
        shell: bash
        run: |
          set -euo pipefail
          AGENTOS_DISPATCH_WAIT_SECONDS=180 \
            bash scripts/agentos_dispatch.sh \
              agentos.executor job.submit "$GITHUB_SHA" \
              job_type=engineering.executor.health \
              | tee "$RUNNER_TEMP/routing-health-submit.txt"
          python3 - "$RUNNER_TEMP/routing-health-submit.txt" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
          assert docs
          receipt=docs[-1].get('receipt') or {}
          job=receipt.get('executor_job') or {}
          assert receipt.get('ok') is True, receipt
          assert job.get('job_type')=='engineering.executor.health', job
          job_id=str(job.get('job_id') or '')
          assert job_id.startswith('action-'), job
          with open(sys.argv[2],'a',encoding='utf-8') as f:
              f.write('job_id='+job_id+'\n')
          print('model_routing_health_submit=PASS')
          PY

      - name: Verify refreshed durable executor health before routing
        id: health
        shell: bash
        run: |
          set -euo pipefail
          job_id="${{ steps.health_submit.outputs.job_id }}"
          terminal=0
          refresh_oidc() {
            local url token
            url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
            curl -fsS --max-time 15 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" > "$RUNNER_TEMP/oidc-refresh.json"
            token="$(python3 - "$RUNNER_TEMP/oidc-refresh.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
            )"
            echo "::add-mask::$token"
            export AGENTOS_CONTROLLER_TOKEN="$token"
          }
          : > "$RUNNER_TEMP/routing-health-inspect.txt"
          for i in $(seq 1 80); do
            if [ "$i" = 1 ] || [ $(( (i - 1) % 20 )) = 0 ]; then
              refresh_oidc
            fi
            out="$RUNNER_TEMP/routing-health-inspect-$i.txt"
            AGENTOS_DISPATCH_WAIT_SECONDS=90 \
              bash scripts/agentos_dispatch.sh \
                agentos.executor job.inspect "$GITHUB_SHA" \
                job_id="$job_id" > "$out"
            cat "$out" >> "$RUNNER_TEMP/routing-health-inspect.txt"
            if python3 - "$out" "$RUNNER_TEMP/routing-health-terminal.json" <<'PY'
          import json,sys
          docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
          if not docs:
              raise SystemExit(1)
          receipt=docs[-1].get('receipt') or {}
          if receipt.get('executor_job_state')!='completed':
              raise SystemExit(1)
          job=receipt.get('executor_job_receipt')
          if not isinstance(job,dict):
              raise SystemExit(1)
          json.dump(job,open(sys.argv[2],'w',encoding='utf-8'),sort_keys=True,indent=2)
          raise SystemExit(0)
          PY
            then
              terminal=1
              break
            fi
            sleep 3
          done
          test "$terminal" = 1
          python3 - "$RUNNER_TEMP/routing-health-terminal.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r.get('job_type')=='engineering.executor.health', r
          assert r.get('classification')=='ENGINEERING_EXECUTOR_HEALTH_READY', r
          assert r.get('successful') is True, r
          selected=str(r.get('selected_provider') or '')
          assert selected in {'claude','agy','codex'}, r
          with open(sys.argv[2],'a',encoding='utf-8') as f:
              f.write('selected_provider='+selected+'\n')
          print('model_routing_health_gate=PASS')
          print('model_routing_health_selected_provider='+selected)
          for provider in ('claude','agy','gemini','codex'):
              print(f'model_routing_{provider}_state='+str(r.get(provider+'_state') or 'none'))
              print(f'model_routing_{provider}_ready_count='+str(r.get(provider+'_ready_count') if r.get(provider+'_ready_count') is not None else 'none'))
              print(f'model_routing_{provider}_health_classification='+str(r.get(provider+'_health_classification') or 'none'))
          PY
      - name: Submit health-routed model smoke
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          refresh_oidc() {
            local url token
            url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
            curl -fsS --max-time 15 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" > "$RUNNER_TEMP/oidc-refresh.json"
            token="$(python3 - "$RUNNER_TEMP/oidc-refresh.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
            )"
            echo "::add-mask::$token"
            export AGENTOS_CONTROLLER_TOKEN="$token"
          }
          refresh_oidc
          AGENTOS_DISPATCH_WAIT_SECONDS=180             bash scripts/agentos_dispatch.sh               agentos.executor job.submit "$GITHUB_SHA"               job_type=engineering.model.smoke               | tee "$RUNNER_TEMP/model-submit.txt"
          python3 - "$RUNNER_TEMP/model-submit.txt" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
          assert docs
          receipt=docs[-1].get('receipt') or {}
          job=receipt.get('executor_job') or {}
          assert receipt.get('ok') is True, receipt
          assert job.get('job_type')=='engineering.model.smoke', job
          job_id=str(job.get('job_id') or '')
          assert job_id.startswith('action-'), job
          with open(sys.argv[2],'a',encoding='utf-8') as f:
              f.write('job_id='+job_id+'\n')
          print('model_routing_submit=PASS')
          PY

      - name: Inspect routed model receipt
        shell: bash
        run: |
          set -euo pipefail
          job_id="${{ steps.submit.outputs.job_id }}"
          terminal=0
          refresh_oidc() {
            local url token
            url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
            curl -fsS --max-time 15 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" > "$RUNNER_TEMP/oidc-refresh.json"
            token="$(python3 - "$RUNNER_TEMP/oidc-refresh.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
            )"
            echo "::add-mask::$token"
            export AGENTOS_CONTROLLER_TOKEN="$token"
          }
          : > "$RUNNER_TEMP/model-inspect.txt"
          for i in $(seq 1 80); do
            if [ "$i" = 1 ] || [ $(( (i - 1) % 20 )) = 0 ]; then
              refresh_oidc
            fi
            out="$RUNNER_TEMP/model-inspect-$i.txt"
            AGENTOS_DISPATCH_WAIT_SECONDS=90               bash scripts/agentos_dispatch.sh                 agentos.executor job.inspect "$GITHUB_SHA"                 job_id="$job_id" > "$out"
            cat "$out" >> "$RUNNER_TEMP/model-inspect.txt"
            if python3 - "$out" "$RUNNER_TEMP/model-terminal.json" <<'PY'
          import json,sys
          docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
          if not docs:
              raise SystemExit(1)
          receipt=docs[-1].get('receipt') or {}
          if receipt.get('executor_job_state')!='completed':
              raise SystemExit(1)
          job=receipt.get('executor_job_receipt')
          if not isinstance(job,dict):
              raise SystemExit(1)
          json.dump(job,open(sys.argv[2],'w',encoding='utf-8'),sort_keys=True,indent=2)
          raise SystemExit(0)
          PY
            then
              terminal=1
              break
            fi
            sleep 4
          done
          test "$terminal" = 1
          python3 - "$RUNNER_TEMP/model-terminal.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r.get('job_type')=='engineering.model.smoke', r
          assert r.get('classification')=='ENGINEERING_MODEL_SMOKE_COMPLETED_PENDING_VERIFICATION', r
          assert r.get('executor_provider') in {'claude','agy','codex'}, r
          assert r.get('selected_provider') == r.get('executor_provider'), r
          assert r.get('executor_returncode')==0, r
          assert r.get('executor_timed_out') is False, r
          assert r.get('credential_exposed') is False, r
          assert r.get('successful') is False, r
          print('model_routing_acceptance=PASS')
          print('model_routing_selected_provider='+str(r.get('executor_provider')))
          print('main_agent_verification_required=YES')
          PY

      - name: Upload sanitized routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-agent-model-routing-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/routing-runtime-rollout.txt
            ${{ runner.temp }}/routing-health-submit.txt
            ${{ runner.temp }}/routing-health-inspect.txt
            ${{ runner.temp }}/routing-health-terminal.json
            ${{ runner.temp }}/model-submit.txt
            ${{ runner.temp }}/model-inspect.txt
            ${{ runner.temp }}/model-terminal.json
          if-no-files-found: warn
          retention-days: 14
