name: Mio Try-On Direct Smoke

on:
  push:
    branches: [ops/mio-tryon-smoke-direct]
    paths:
      - '.github/workflows/mio-tryon-direct-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    steps:
      - name: Verify runtime write access and submit VTON job
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/ubuntu/agent-data/projects/dressup-simulator
          JOB_DIR="$ROOT/render_jobs/runtime"
          ASSET_DIR="$ROOT/render_assets"
          mkdir -p "$JOB_DIR" "$ASSET_DIR" 2>/dev/null || true
          stat -c 'JOB_DIR mode=%a owner=%U group=%G' "$JOB_DIR"
          stat -c 'ASSET_DIR mode=%a owner=%U group=%G' "$ASSET_DIR"
          test -w "$JOB_DIR"
          JOB_ID="mio-direct-smoke-$GITHUB_RUN_ID"
          JOB="$JOB_DIR/$JOB_ID.json"
          ASSET="$ASSET_DIR/$JOB_ID.webp"
          python3 - "$JOB" "$JOB_ID" <<'PY'
          import json, pathlib, sys
          from datetime import datetime, timezone
          path=pathlib.Path(sys.argv[1]); job_id=sys.argv[2]
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          job={
            "schema":"agentos.tryon-render-job/v1",
            "jobId":job_id,
            "characterId":"sunlake-milkcat-ai-001",
            "characterVersion":"mio-body-v1",
            "view":"front","pose":"neutral_standing","status":"queued",
            "requestedAt":now,"startedAt":None,"completedAt":None,"failedAt":None,"supersededBy":None,
            "input":{
              "baseBodyAsset":"/personas/mio/mio-avatar.webp",
              "layerOrder":["upper_main","lower_main"],
              "selectedLayers":{
                "upper_main":{"garmentId":"net-43774-002","name":"white top","layer":"upper_main","sourceImageUrl":"https://net.wimg.tw/files/1/products/735109_color_002E799BDE889B2.jpg?v=32570"},
                "lower_main":{"garmentId":"net-32235-711","name":"navy pants","layer":"lower_main","sourceImageUrl":"https://s-net.wimg.tw//act/32235-711-1024-01.jpg?v=32570"}
              }
            },
            "output":{"asset":None,"previewAsset":None,"width":None,"height":None},
            "error":None
          }
          path.write_text(json.dumps(job,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          for i in $(seq 1 150); do
            STATE=$(python3 - "$JOB" <<'PY'
          import json,sys
          try: print(json.load(open(sys.argv[1],encoding='utf-8')).get('status','missing'))
          except Exception: print('missing')
          PY
          )
            echo "state=$STATE poll=$i"
            if [ "$STATE" = ready ]; then
              test -s "$ASSET"
              BYTES=$(wc -c < "$ASSET")
              test "$BYTES" -gt 1000
              echo "MIO_TRYON_DIRECT_SMOKE=PASS bytes=$BYTES"
              exit 0
            fi
            if [ "$STATE" = failed ]; then
              cat "$JOB"
              exit 1
            fi
            sleep 2
          done
          echo "MIO_TRYON_DIRECT_SMOKE=TIMEOUT"
          cat "$JOB" || true
          exit 1
