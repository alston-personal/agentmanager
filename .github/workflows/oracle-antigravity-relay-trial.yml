name: Oracle Antigravity Relay Trial

# retrigger marker: 2026-08-25T10:17+08:00 recheck after executor timeout window
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-antigravity-relay-trial.yml'

permissions:
  contents: write

jobs:
  relay-trial:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    steps:
      - name: Checkout vNext
        uses: actions/checkout@v4

      - name: Submit bounded canonical capsule and persist diagnostics
        shell: bash
        run: |
          set -u
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "Refusing experimental relay trial on main" >&2
            exit 2
          fi
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/oracle-antigravity-relay-diagnostic.txt
          export PYTHONPATH="$PWD"
          export AGENTOS_RELAY_ROOT=/home/ubuntu/agent-data/runtime/antigravity-relay
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "whoami=$(whoami)"
            echo "groups=$(id -Gn)"
            echo "ref=${GITHUB_REF_NAME}"
            echo "head=$(git rev-parse HEAD)"
            echo
            echo "=== RELAY DIRECTORY BEFORE ==="
            stat -c '%A %a %U %G %n' "$AGENTOS_RELAY_ROOT" "$AGENTOS_RELAY_ROOT/inbox" "$AGENTOS_RELAY_ROOT/processing" "$AGENTOS_RELAY_ROOT/receipts" 2>&1 || true
            find "$AGENTOS_RELAY_ROOT" -maxdepth 2 -type f -printf '%M %u %g %p\n' 2>&1 | tail -80 || true
            echo
            echo "=== RELAY PROCESS ==="
            ps -eo user=,pid=,comm=,args= | grep -E 'agentos_node.antigravity_relay_worker' | grep -v grep || true
          } | tee "$OUT"

          python3 - <<'PY' 2>&1 | tee -a "$OUT"
          import json, os, time, traceback
          from pathlib import Path
          from agentos_node.antigravity_relay import AntigravityRelayClient

          root = os.environ['AGENTOS_RELAY_ROOT']
          client = AntigravityRelayClient(root)
          canonical_ir = {
              'schema': 'agentos.canonical-ir/relay-trial-v1',
              'goal': 'Continue AgentOS research by validating that a real weak executor can preserve the Master Experience Floor from canonical context.',
              'project_id': 'agentmanager',
              'constraints': [
                  'READ-ONLY trial: do not modify files, git state, services, or external systems.',
                  'Treat canonical context as authoritative; do not infer a different goal from workspace history.',
                  'Distinguish VERIFIED, RECONSTRUCTED, and UNKNOWN.',
                  'Return a concrete next action rather than generic advice.'
              ],
              'decisions': [
                  'feature/distributed-agentos-runtime is the canonical vNext integration branch.',
                  'The current closure gap is Node Cognitive Bridge / executor receipt continuity.',
                  'The ubuntu-owned Antigravity relay is the authorized cross-user executor boundary.'
              ],
              'frontier': {
                  'current_hypothesis': 'Canonical execution context can raise a weak executor above its session-local baseline.',
                  'next_experiment': 'Use this relay receipt as the first real executor evidence and evaluate whether it preserves goal, constraints, and next action.'
              }
          }
          instruction = (
              'This is a read-only Master Experience Floor trial. Using ONLY the supplied Canonical IR as authoritative state, '
              'return: (1) the active goal, (2) the current hypothesis, (3) the exact next action, '
              '(4) what is VERIFIED vs UNKNOWN, and (5) one governance risk that must remain blocked. '
              'Do not modify any file or system.'
          )
          try:
              capsule = client.submit(
                  project_id='agentmanager', canonical_ir=canonical_ir, instruction=instruction,
                  workspace='/home/ubuntu/agentmanager', executor_hint='antigravity-claude-low')
              capsule_id = capsule['capsule_id']
              Path('.agentos/evidence/oracle-antigravity-relay-capsule.json').write_text(
                  json.dumps(capsule, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              print('submitted_capsule=' + capsule_id)
              deadline = time.monotonic() + 210
              receipt = None
              while time.monotonic() < deadline:
                  receipt = client.receipt(capsule_id)
                  if receipt is not None:
                      break
                  time.sleep(2)
              if receipt is None:
                  print('receipt_status=timeout')
              else:
                  Path('.agentos/evidence/oracle-antigravity-relay-receipt.json').write_text(
                      json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
                  print('receipt_status=received')
                  print(json.dumps({'ok': receipt.get('ok'), 'returncode': receipt.get('returncode'), 'error': receipt.get('error')}, ensure_ascii=False))
          except Exception:
              print('submit_or_wait_exception=true')
              traceback.print_exc()
          PY

          {
            echo
            echo "=== RELAY DIRECTORY AFTER ==="
            stat -c '%A %a %U %G %n' "$AGENTOS_RELAY_ROOT" "$AGENTOS_RELAY_ROOT/inbox" "$AGENTOS_RELAY_ROOT/processing" "$AGENTOS_RELAY_ROOT/receipts" 2>&1 || true
            find "$AGENTOS_RELAY_ROOT" -maxdepth 2 -type f -printf '%M %u %g %p\n' 2>&1 | tail -120 || true
          } | tee -a "$OUT"

      - name: Commit diagnostic and any receipt to explicit source branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "agentos-node"
          git config user.email "agentos-node@users.noreply.github.com"
          git add .agentos/evidence/oracle-antigravity-relay-diagnostic.txt
          test -f .agentos/evidence/oracle-antigravity-relay-capsule.json && git add .agentos/evidence/oracle-antigravity-relay-capsule.json || true
          test -f .agentos/evidence/oracle-antigravity-relay-receipt.json && git add .agentos/evidence/oracle-antigravity-relay-receipt.json || true
          if git diff --cached --quiet; then
            echo 'No diagnostic change to commit'
            exit 0
          fi
          git commit -m "evidence(agentos): persist Antigravity relay diagnostic"
          git push origin "HEAD:${GITHUB_REF_NAME}"
