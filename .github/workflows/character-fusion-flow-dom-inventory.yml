name: Character Fusion Flow DOM Inventory

on:
  pull_request:
    branches: [core/integration]
    paths:
      - '.github/workflows/character-fusion-flow-dom-inventory.yml'
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/character-fusion-flow-dom-inventory.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -Fq 'flow_dom_inventory=PASS' .github/workflows/character-fusion-flow-dom-inventory.yml

  inventory:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inventory Flow controls via raw CDP
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 \
            -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'python3 -' <<'PY'
          import asyncio, json, urllib.request, websockets
          PORT=9225
          with urllib.request.urlopen(f"http://127.0.0.1:{PORT}/json/list",timeout=5) as r:
              rows=json.loads(r.read().decode())
          target=next((x for x in rows if x.get("type")=="page" and "flow.google.com/project/" in str(x.get("url") or "")),None)
          if not target:
              raise SystemExit("flow_project_session=NOT_FOUND")
          async def main():
              async with websockets.connect(target["webSocketDebuggerUrl"],open_timeout=5,max_size=8*1024*1024) as ws:
                  seq=0
                  async def call(method,params=None):
                      nonlocal seq
                      seq+=1; ident=seq
                      await ws.send(json.dumps({"id":ident,"method":method,"params":params or {}}))
                      while True:
                          msg=json.loads(await ws.recv())
                          if msg.get("id")==ident:
                              if msg.get("error"): raise RuntimeError(msg["error"])
                              return msg.get("result") or {}
                  expr=r'''(() => {
                    const visible = el => !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length);
                    const clean = s => (s||'').replace(/\s+/g,' ').trim().slice(0,180);
                    const selectors=['button','[role="button"]','input','textarea','[contenteditable="true"]','select','a'];
                    const out=[]; const seen=new Set();
                    for(const sel of selectors){
                      for(const el of document.querySelectorAll(sel)){
                        if(!visible(el)) continue;
                        const row={
                          tag:el.tagName.toLowerCase(),
                          role:el.getAttribute('role')||'',
                          type:el.getAttribute('type')||'',
                          aria:clean(el.getAttribute('aria-label')),
                          title:clean(el.getAttribute('title')),
                          text:clean(el.innerText||el.textContent),
                          placeholder:clean(el.getAttribute('placeholder')),
                          testid:clean(el.getAttribute('data-testid')||el.getAttribute('data-test-id'))
                        };
                        const key=JSON.stringify(row);
                        if(!seen.has(key)){seen.add(key);out.push(row);}
                      }
                    }
                    return {url:location.href,title:document.title,controls:out.slice(0,240)};
                  })()'''
                  r=await call("Runtime.evaluate",{"expression":expr,"returnByValue":True,"awaitPromise":True})
                  print(json.dumps((r.get("result") or {}).get("value"),ensure_ascii=False))
                  print("flow_dom_inventory=PASS")
          asyncio.run(main())
          PY
