name: Dashboard Final-Path Redeploy

on:
  pull_request:
    branches: [core/integration]
    paths: ['.github/workflows/dashboard-final-path-redeploy.yml']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      TARGET_SHA: 5e0e13b43f23fcba69f0f315619c83724dd82ccd
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Deploy exact final-path build
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" "cd /home/ubuntu/agentmanager && git fetch --no-tags origin '$TARGET_SHA' && git show '$TARGET_SHA:scripts/deploy_mio_wardrobe_dashboard_user.sh' > /tmp/deploy-dashboard-final-path.sh && chmod 700 /tmp/deploy-dashboard-final-path.sh && /tmp/deploy-dashboard-final-path.sh '$TARGET_SHA' '${{ github.run_id }}'"
      - name: Verify live wardrobe/auth routes
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          live=$(readlink -f /home/ubuntu/agent-data/runtime/dashboard/current)
          echo "live=$live"
          echo "$live" | grep -F '5e0e13b43f23fcba69f0f315619c83724dd82ccd'
          for p in \
            '/dashboard/api/auth/session' \
            '/dashboard/api/wardrobe/catalog?characterId=sunlake-milkcat-ai-001'; do
              code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 5 "http://127.0.0.1:3000$p" || true)
              echo "$p -> $code"
              test "$code" = 200
          done
          code=$(curl -sS -o /tmp/handoff -w '%{http_code}' --max-time 5 -X POST 'http://127.0.0.1:3000/dashboard/api/wardrobe/auth-handoff?action=start' || true)
          echo "handoff_start=$code"
          test "$code" = 200
          code=$(curl -sS -o /tmp/render -w '%{http_code}' --max-time 5 -X POST -H 'Content-Type: application/json' --data '{"characterId":"sunlake-milkcat-ai-001","selectedLayers":{"lower_main":"net-32235-711"}}' 'http://127.0.0.1:3000/dashboard/api/wardrobe/tryon/render' || true)
          echo "render_unauth=$code"
          test "$code" = 401
          echo 'dashboard_final_path_live=PASS'
          REMOTE