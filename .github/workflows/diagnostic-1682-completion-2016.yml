name: Diagnostic 1682 Completion Contract
on:
  pull_request:
    paths:
      - 'scripts/work_completion.py'
      - '.github/workflows/diagnostic-1682-completion-2016.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v tests.test_work_completion tests.test_work_completion_integration_contract
