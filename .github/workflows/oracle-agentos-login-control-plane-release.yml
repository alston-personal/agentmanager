name: AgentOS Control Plane Immutable Login Release (#2198)

# Auto-release protected-main AgentOS Console changes via this same immutable lane; no release-marker-only PR needed for future UI changes.
# Source-locked rollout for verified platform admin landing (#2234); no automatic owner elevation.
# Source-locked rollout for /my-one account logout/switch UI (#2230); preserve existing governed deployment and rollback.
# Source-locked rollout for Realm Owner Node Map, code approval, and tenant-device join.
# Source-locked retry after fixing anonymous /my-one 401 inspector contract.
# Source-locked rollout for approved CREATE to per-account isolated Realm bootstrap.
# Source-locked rollout for post-approval navigation and accurate pending ONE stage.
# Source-locked rollout for verified applicant metadata and richer platform governance review.
# Source-locked rollout for actionable platform login/account-switch UI without role changes.
# Source-locked rollout to expose precise 401/403 governance denial without weakening permissions.
# Source-locked rollout for platform-authorized Realm request review interface.
# Source-locked rollout for authenticated AgentOS Realm onboarding intake and review.
# Source-locked combined rollout for AgentOS post-OAuth session landing and scoped cookie.
# Follow-up release after correcting canonical virtual Host on local OAuth probe.
# This file is a one-time exact-generation release carrier for the AgentOS
# Control Plane, distinct from Studio / Dashboard blue-green deployment.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-agentos-login-control-plane-release.yml'
      - 'agent_core/companion_web.py'
      - 'scripts/inspect_distributed_control_plane.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentos-control-plane-immutable-release
  cancel-in-progress: false

jobs:
  deploy:
    outputs:
      admin_configured: ${{ steps.admin_attestation.outputs.admin_configured }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Deploy immutable AgentOS Control Plane exact source, verify and rollback on failure
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          # Distinct from the Studio Dashboard and ONE 8780 deployment.
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
              -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" \
              bash -s -- "${GITHUB_SHA}" <<'REMOTE'
          set -euo pipefail
          SOURCE_SHA="$1"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(id -un)" = ubuntu
          REPO=/home/ubuntu/agentmanager
          test -d "$REPO/.git"
          git -C "$REPO" fetch --no-tags origin "$SOURCE_SHA"
          git -C "$REPO" cat-file -e "$SOURCE_SHA^{commit}"
          # Reuse the existing Studio Dashboard blue/green release to update
          # the shared Next OAuth origin resolver, with its existing rollback.
          DASH_DEPLOY=/tmp/agentos-shared-auth-dashboard-"$SOURCE_SHA".sh
          git -C "$REPO" show "$SOURCE_SHA:scripts/deploy_dashboard_blue_green_user.sh" > "$DASH_DEPLOY"
          chmod 700 "$DASH_DEPLOY"
          DASH_RUN_ID="$(date +%s%N)"
          "$DASH_DEPLOY" "$SOURCE_SHA" "$DASH_RUN_ID" 1
          echo "shared_dashboard_auth_source=$SOURCE_SHA"

          # Fail closed when provider credentials are absent, without printing
          # credential values or session cookies.
          curl -fsS --max-time 8 https://studio.milkcat.org/dashboard/api/auth/session |
            python3 -c 'import json,sys; p=json.load(sys.stdin).get("providers") or {}; required=("google","github","facebook","line"); missing=[v for v in required if p.get(v) is not True]; print("shared_auth_providers_configured="+str(4-len(missing))+"/4"); sys.exit(33 if missing else 0)'

          DEPLOY=/tmp/agentos-control-plane-deploy-"$SOURCE_SHA".sh
          git -C "$REPO" show "$SOURCE_SHA:scripts/deploy_distributed_control_plane.sh" > "$DEPLOY"
          chmod 700 "$DEPLOY"
          trap 'rm -f "$DEPLOY" "$DASH_DEPLOY"' EXIT
          echo "deployment_target=agentos-control-plane.service"
          echo "deployment_source=$SOURCE_SHA"
          # Existing service-specific deploy controller implements immutable
          # worktree, single-writer lock, systemd cutover and rollback on error.
          AGENTOS_REPO="$REPO" "$DEPLOY" "$SOURCE_SHA"
          ACCEPTED="$(cat /home/ubuntu/agent-data/runtime/control-plane/accepted-release)"
          EXPECTED="/home/ubuntu/agent-data/releases/control-plane/$SOURCE_SHA"
          test "$ACCEPTED" = "$EXPECTED"
          systemctl --user is-active --quiet agentos-control-plane.service
          # Reconcile historic, independently approved CREATE requests using
          # the exact accepted source; no reapproval or use of realm-alston.
          # Prints counts only, never account identifiers or OAuth credentials.
          (cd "$ACCEPTED" &&
            AGENT_DATA_ROOT=/home/ubuntu/agent-data python3 -m agent_core.realm_provisioning)
          echo "accepted_release=$ACCEPTED"
          echo "agentos_control_plane_login_release=PASS"
          echo "studio_dashboard_mutation=CONTROLLED_BLUE_GREEN"
          REMOTE

      - name: Read effective serving Dashboard admin configuration (no user session)
        id: admin_attestation
        shell: bash
        run: |
          set -euo pipefail
          # Read-only check of the *serving* Dashboard process after blue/green switch.
          # This never prints owner allowlist entries or credentials and never grants a role.
          RESULT="$(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" \
            bash -s -- "${GITHUB_SHA}" <<'REMOTE'
          set -euo pipefail
          SOURCE_SHA="$1"
          REPO=/home/ubuntu/agentmanager
          SITE=/etc/nginx/sites-enabled/studio.milkcat.org
          ACTIVE_PORT="$(sed -n 's/.*set \$agentos_dashboard_upstream http:\/\/127\.0\.0\.1:\([0-9][0-9]*\);.*/\1/p' "$SITE" | head -n1)"
          case "$ACTIVE_PORT" in 3040|3041) ;; *) echo 'agentos_admin_identity_configured=UNKNOWN'; exit 0 ;; esac
          DIAG="/tmp/agentos-dashboard-owner-readonly-$SOURCE_SHA.py"
          git -C "$REPO" show "$SOURCE_SHA:scripts/inspect_dashboard_admin_identity_user.py" > "$DIAG"
          chmod 700 "$DIAG"
          trap 'rm -f "$DIAG"' EXIT
          python3 "$DIAG" --active-port "$ACTIVE_PORT" --identity 'google:username:register@milkcat.org'
          REMOTE
          )"
          printf '%s\n' "$RESULT"
          ADMIN_MATCH="$(printf '%s\n' "$RESULT" | sed -n 's/^agentos_admin_identity_configured=\(PASS\|MISSING\|UNKNOWN\)$/\1/p' | tail -n1)"
          case "$ADMIN_MATCH" in PASS|MISSING|UNKNOWN) ;; *) ADMIN_MATCH=UNKNOWN ;; esac
          printf 'admin_configured=%s\n' "$ADMIN_MATCH" >> "$GITHUB_OUTPUT"

  report-release-receipt:
    # This is a separate, least-privilege job: deployment secrets stay in deploy.
    # Report failures too; never require the owner to locate an Actions Run ID.
    if: ${{ always() }}
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Publish source-pinned deployment result to original #2198
        uses: actions/github-script@v7
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          ADMIN_CONFIGURED: ${{ needs.deploy.outputs.admin_configured }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = 2198;
            const marker = `<!-- agentos-control-plane-release:${context.runId} -->`;
            const result = process.env.DEPLOY_RESULT || 'unknown';
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### AgentOS #2198 immutable Control Plane deployment receipt',
              `- Run: ${url}`,
              `- Source SHA: \`${context.sha}\``,
              `- Deploy job: **${result}**`,
              result === 'success'
                ? '- Acceptance: deploy job completed; inspect the run logs for exact accepted-release SHA. Authenticated admin/tenant sessions remain separate acceptance gates.'
                : '- Acceptance: **not established**. Inspect the linked deploy job failure and retain the existing rollback contract.',
              `- Active Dashboard owner admin configuration: ${['PASS', 'MISSING', 'UNKNOWN'].includes(process.env.ADMIN_CONFIGURED) ? process.env.ADMIN_CONFIGURED : 'UNKNOWN'} (configuration only; live OAuth session role not attested)`,
              '- Work item: #2198 (existing; no new issue or deployment lane).',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = comments.find(item => item.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
