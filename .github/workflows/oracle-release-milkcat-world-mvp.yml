# Thin consumer for the shared Studio static-route production release capability.
name: Oracle Release Milkcat World MVP

on:
  workflow_dispatch:
    inputs:
      credit_account:
        description: Optional funded Milkcat Platform credit account; leave blank for unmetered release
        required: false
        type: string
        default: ''
      credit_cost:
        description: Integer credits to reserve/commit when metering is enabled
        required: false
        type: number
        default: 0
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-release-milkcat-world-mvp.yml'
      - '.github/workflows/reusable-studio-static-route-release.yml'

permissions:
  contents: read

concurrency:
  group: milkcat-world-production-mvp
  cancel-in-progress: true

jobs:
  release:
    uses: ./.github/workflows/reusable-studio-static-route-release.yml
    with:
      source_sha: cfa50f0cb16305d7e0e007764e076ed142e5d83c
      route: world
      backup_key: milkcat-world
      receipt_schema: studio-web.milkcat-world-release/v4
      acceptance_anchors: |-
        Milkcat World
        走進 Milkcat
        id="milkcat-world"
        LAYOUTLIB · CANONICAL SPATIAL LIBRARY
        three@0.186.0
      credit_account: ${{ inputs.credit_account || '' }}
      credit_cost: ${{ inputs.credit_cost || 0 }}
    secrets:
      AGENTOS_DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER }}
      AGENTOS_DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT }}
      AGENTOS_DEPLOY_SSH_KEY: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY }}
      N8N_DEPLOY_USER: ${{ secrets.N8N_DEPLOY_USER }}
      N8N_DEPLOY_SSH_PORT: ${{ secrets.N8N_DEPLOY_SSH_PORT }}
      N8N_DEPLOY_SSH_KEY: ${{ secrets.N8N_DEPLOY_SSH_KEY }}
