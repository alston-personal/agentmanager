name: Oracle Deploy Realm Gateway

on:
  push:
    branches:
      - core/integration
    paths:
      - 'dashboard/app/api/agentos/**'
      - 'scripts/deploy_realm_gateway_user.sh'
      - 'agent_core/realm_server.py'
      - 'agent_core/controller_api.py'
      - 'agent_core/controller_service.py'
      - 'agent_core/runner_window.py'
      - 'agentos_node/bootstrap_control.py'
      - '.github/workflows/oracle-deploy-realm-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-dashboard-production-deploy
  cancel-in-progress: false

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Prove route identity and bootstrap/resolve allowlist on a clean Next server
        shell: bash
        run: |
          set -euo pipefail
          npm start >/tmp/agentos-next.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS --max-time 2 http://127.0.0.1:3000/dashboard >/dev/null 2>&1 && break
            sleep 1
          done
          for path in /api/agentos/v1/health /dashboard/api/agentos/v1/health; do
            headers=/tmp/agentos-h; body=/tmp/agentos-b
            code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' --max-time 4 "http://127.0.0.1:3000$path" || true)
            marker=false
            grep -qi '^x-agentos-realm-gateway: v0.1' "$headers" 2>/dev/null && marker=true
            echo "clean_next_path=$path http=$code gateway_identity=$marker prefix=$(head -c 180 "$body" | tr '\n' ' ' | tr '\r' ' ')"
          done
          code=$(curl -sS -D /tmp/agentos-h -o /tmp/agentos-b -w '%{http_code}' --max-time 4 http://127.0.0.1:3000/dashboard/api/agentos/v1/health || true)
          grep -qi '^x-agentos-realm-gateway: v0.1' /tmp/agentos-h
          test "$code" = 502
          bootstrap_code=$(curl -sS -D /tmp/agentos-bh -o /tmp/agentos-bb -w '%{http_code}' --max-time 4 'http://127.0.0.1:3000/dashboard/api/agentos/v1/bootstrap?node_id=probe' || true)
          grep -qi '^x-agentos-realm-gateway: v0.1' /tmp/agentos-bh
          test "$bootstrap_code" = 502
          ! grep -q 'Realm gateway route not allowlisted' /tmp/agentos-bb
          resolve_code=$(curl -sS -D /tmp/agentos-rh -o /tmp/agentos-rb -w '%{http_code}' --max-time 4 \
            -H 'Content-Type: application/json' \
            -d '{"schema":"agentos.resolve-request/v1","node_id":"probe","intent":"continue","project":"agentos-core"}' \
            http://127.0.0.1:3000/dashboard/api/agentos/v1/resolve || true)
          grep -qi '^x-agentos-realm-gateway: v0.1' /tmp/agentos-rh
          test "$resolve_code" = 502
          ! grep -q 'Realm gateway route not allowlisted' /tmp/agentos-rb
          dispatch_code=$(curl -sS -D /tmp/agentos-dh -o /tmp/agentos-db -w '%{http_code}' --max-time 4 \
            http://127.0.0.1:3000/dashboard/api/agentos/v1/dispatch || true)
          grep -qi '^x-agentos-realm-gateway: v0.1' /tmp/agentos-dh
          test "$dispatch_code" = 502
          ! grep -q 'Realm gateway route not allowlisted' /tmp/agentos-db
          echo 'clean_next_gateway_route=PASS'
          echo 'clean_next_bootstrap_allowlist=PASS'
          echo 'clean_next_resolve_allowlist=PASS'
          echo 'clean_next_dispatch_allowlist=PASS'


  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Request pinned Realm gateway deploy through AgentOS scheduler
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID="realm-gateway-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RECEIPT="$RUNNER_TEMP/realm-gateway-receipt.json"
          AGENTOS_RECEIPT_TIMEOUT_SECONDS=480             bash scripts/submit_oracle_bootstrap_request_remote.sh               agentos.realm_gateway.deploy "$REQUEST_ID" "$GITHUB_SHA" '{}' > "$RECEIPT"
          cat "$RECEIPT"
          python3 - "$RECEIPT" "$GITHUB_SHA" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); source_commit=sys.argv[2]
          s=r.get('scheduler') or {}
          assert r.get('schema') == 'agentos.bootstrap-receipt/v1', r
          assert r.get('action') == 'agentos.realm_gateway.deploy', r
          assert r.get('executor_user') == 'ubuntu', r
          assert r.get('executor_uid') == 1001, r
          assert r.get('source_commit') == source_commit, r
          assert r.get('ok') is True, r
          assert s.get('node') == 'oracle', s
          assert s.get('worker_role') == 'maintenance', s
          assert s.get('worker_id') == 'oracle-maintenance', s
          assert 'oracle-core-runtime' in set(s.get('locks') or []), s
          text='\n'.join((step.get('stdout','')+'\n'+step.get('stderr','')) for step in r.get('steps',[]))
          assert f'route_source={source_commit}:dashboard/app/api/agentos/[...path]/route.ts' in text, text[-12000:]
          assert 'dashboard_build=PASS' in text, text[-12000:]
          assert 'realm_gateway_bootstrap_local=PASS' in text, text[-12000:]
          assert 'realm_gateway_bootstrap_public=PASS' in text, text[-12000:]
          assert f'realm_gateway_source_commit={source_commit}' in text, text[-12000:]
          assert 'realm_gateway_public=PASS' in text, text[-12000:]
          assert 'nginx_mutation=NONE' in text, text[-12000:]
          print('realm_gateway_deploy=PASS')
          print('realm_gateway_pinned_source=PASS')
          print('realm_gateway_scheduler_worker='+s['worker_id'])
          PY

      - name: Verify public ONE identity and bootstrap/resolve routing
        shell: bash
        run: |
          set -euo pipefail
          URL='https://studio.milkcat.org/dashboard/api/agentos/v1/health'
          BODY=$(curl -fsS --max-time 8 "$URL")
          printf '%s' "$BODY" | grep -q 'agentos.one-health/v0.1'
          printf '%s' "$BODY" | grep -q 'realm-alston'
          B=/tmp/public-bootstrap-final
          C=$(curl -sS -o "$B" -w '%{http_code}' --max-time 8 'https://studio.milkcat.org/dashboard/api/agentos/v1/bootstrap?node_id=__gateway_probe__' || true)
          test "$C" = 401
          ! grep -q 'Realm gateway route not allowlisted' "$B"
          R=/tmp/public-resolve-final
          RC=$(curl -sS -o "$R" -w '%{http_code}' --max-time 8             -H 'Content-Type: application/json'             -d '{"schema":"agentos.resolve-request/v1","node_id":"__gateway_probe__","intent":"continue","project":"agentos-core"}'             'https://studio.milkcat.org/dashboard/api/agentos/v1/resolve' || true)
          test "$RC" = 401
          ! grep -q 'Realm gateway route not allowlisted' "$R"
          D=/tmp/public-dispatch-final
          DC=$(curl -sS -o "$D" -w '%{http_code}' --max-time 8             'https://studio.milkcat.org/dashboard/api/agentos/v1/dispatch' || true)
          test "$DC" = 401
          ! grep -q 'Realm gateway route not allowlisted' "$D"
          echo "realm_gateway_url=https://studio.milkcat.org/dashboard/api/agentos"
          echo "public_identity=PASS"
          echo "public_bootstrap_routing=PASS"
          echo "public_resolve_routing=PASS"
          echo "public_dispatch_routing=PASS"
