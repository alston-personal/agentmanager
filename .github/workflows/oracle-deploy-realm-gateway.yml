name: Oracle Deploy Realm Gateway

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard/app/api/agentos/**'
      - 'agent_core/realm_server.py'
      - 'scripts/deploy_realm_gateway_user.sh'
      - 'agentos_node/bootstrap_control.py'
      - 'scripts/submit_oracle_bootstrap_request_remote.sh'
      - 'scripts/core_services/port_manager.py'
      - 'scripts/retire_legacy_dashboard_pm2_user.sh'
      - '.github/workflows/oracle-deploy-realm-gateway.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'dashboard/app/api/agentos/**'
      - 'agent_core/realm_server.py'
      - 'tests/test_realm_scheduler_oidc.py'
      - 'scripts/deploy_realm_gateway_user.sh'
      - '.github/workflows/oracle-deploy-realm-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-realm-gateway-deploy-v2
  cancel-in-progress: false

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned gateway deployment preflight contract
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy_realm_gateway_user.sh
          python3 -m unittest tests.test_realm_gateway_deploy_preflight -v
          python3 -m unittest tests.test_realm_gateway_receipt_contract -v
          python3 -m pip install --disable-pip-version-check pytest
          # Isolate pytest collection from the repository root, where a guarded
          # CLAUDE.md entry is intentionally unreadable on hosted runners.
          # Keep CWD and PYTHONPATH at the checkout root for path-based assertions.
          gateway_pytests="$(mktemp -d)"
          trap 'rm -rf "$gateway_pytests"' EXIT
          cp tests/test_realm_scheduler_oidc.py "$gateway_pytests/test_realm_scheduler_oidc.py"
          PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}" python3 -m pytest -q -c /dev/null --import-mode=importlib --rootdir="$gateway_pytests" "$gateway_pytests/test_realm_scheduler_oidc.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Prove route identity and bootstrap/resolve allowlist on a clean Next server
        shell: bash
        run: |
          set -euo pipefail
          npm start >/tmp/agentos-next.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS --max-time 2 http://127.0.0.1:3000/dashboard >/dev/null 2>&1 && break
            sleep 1
          done
          for path in /api/agentos/v1/health /dashboard/api/agentos/v1/health; do
            headers=/tmp/agentos-h; body=/tmp/agentos-b
            code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' --max-time 4 "http://127.0.0.1:3000$path" || true)
            marker=false
            grep -qi '^x-agentos-realm-gateway: v0.1' "$headers" 2>/dev/null && marker=true
            echo "clean_next_path=$path http=$code gateway_identity=$marker prefix=$(head -c 180 "$body" | tr '\n' ' ' | tr '\r' ' ')"
          done
          code=$(curl -sS -D /tmp/agentos-h -o /tmp/agentos-b -w '%{http_code}' --max-time 4 http://127.0.0.1:3000/dashboard/api/agentos/v1/health || true)
          grep -qi '^x-agentos-realm-gateway: v0.1' /tmp/agentos-h
          test "$code" = 502
          bootstrap_code=$(curl -sS -D /tmp/agentos-bh -o /tmp/agentos-bb -w '%{http_code}' --max-time 4 'http://127.0.0.1:3000/dashboard/api/agentos/v1/bootstrap?node_id=probe' || true)
          grep -qi '^x-agentos-realm-gateway: v0.1' /tmp/agentos-bh
          test "$bootstrap_code" = 502
          ! grep -q 'Realm gateway route not allowlisted' /tmp/agentos-bb
          resolve_code=$(curl -sS -D /tmp/agentos-rh -o /tmp/agentos-rb -w '%{http_code}' --max-time 4 \
            -H 'Content-Type: application/json' \
            -d '{"schema":"agentos.resolve-request/v1","node_id":"probe","intent":"continue","project":"agentos-core"}' \
            http://127.0.0.1:3000/dashboard/api/agentos/v1/resolve || true)
          grep -qi '^x-agentos-realm-gateway: v0.1' /tmp/agentos-rh
          test "$resolve_code" = 502
          ! grep -q 'Realm gateway route not allowlisted' /tmp/agentos-rb
          echo 'clean_next_gateway_route=PASS'
          echo 'clean_next_bootstrap_allowlist=PASS'
          # A bare GET must pass the public Gateway allowlist to the
          # upstream ONE authorization layer; a local missing ONE returns 502.
          # The Gateway must NOT invent a 401 or permit POST dispatch.
          dispatch_code=$(curl -sS -D /tmp/agentos-dh -o /tmp/agentos-db -w '%{http_code}' --max-time 4 http://127.0.0.1:3000/dashboard/api/agentos/v1/dispatch || true)
          grep -qi '^x-agentos-realm-gateway: v0.1' /tmp/agentos-dh
          test "$dispatch_code" = 502
          ! grep -q 'Realm gateway route not allowlisted' /tmp/agentos-db
          post_dispatch_code=$(curl -sS -o /tmp/agentos-pdb -w '%{http_code}' --max-time 4 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3000/dashboard/api/agentos/v1/dispatch || true)
          test "$post_dispatch_code" = 404
          grep -q 'Realm gateway route not allowlisted' /tmp/agentos-pdb
          # Only the exact approved Rain Exit request reaches ONE auth; every
          # other public POST remains denied by the Gateway itself.
          approved_body='{"schema":"agentos.runner-window-dispatch/v1","capability":"media.vision-studio","operation":"produce","source_commit":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","payload":{"project_id":"rain-exit-v001"}}'
          approved_code=$(curl -sS -D /tmp/agentos-adh -o /tmp/agentos-adb -w '%{http_code}' --max-time 4 \
            -X POST -H 'Content-Type: application/json' -H 'Authorization: Bearer dummy-test-token' \
            -d "$approved_body" http://127.0.0.1:3000/dashboard/api/agentos/v1/dispatch || true)
          grep -qi '^x-agentos-realm-gateway: v0.1' /tmp/agentos-adh
          test "$approved_code" = 502
          ! grep -q 'Realm gateway route not allowlisted' /tmp/agentos-adb
          # Galaxy Monitor migration is a separate, exact OIDC-governed intent.
          galaxy_body='{"schema":"agentos.runner-window-dispatch/v1","capability":"social.monitor","operation":"runtime.migrate","source_commit":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","payload":{}}'
          galaxy_code=$(curl -sS -D /tmp/agentos-gmh -o /tmp/agentos-gmb -w '%{http_code}' --max-time 4 \
            -X POST -H 'Content-Type: application/json' -H 'Authorization: Bearer dummy-test-token' \
            -d "$galaxy_body" http://127.0.0.1:3000/dashboard/api/agentos/v1/dispatch || true)
          grep -qi '^x-agentos-realm-gateway: v0.1' /tmp/agentos-gmh
          test "$galaxy_code" = 502
          ! grep -q 'Realm gateway route not allowlisted' /tmp/agentos-gmb
          galaxy_invalid='{"schema":"agentos.runner-window-dispatch/v1","capability":"social.monitor","operation":"runtime.migrate","source_commit":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","payload":{"unapproved":"value"}}'
          galaxy_bad_code=$(curl -sS -o /tmp/agentos-gbb -w '%{http_code}' --max-time 4 \
            -X POST -H 'Content-Type: application/json' -H 'Authorization: Bearer dummy-test-token' \
            -d "$galaxy_invalid" http://127.0.0.1:3000/dashboard/api/agentos/v1/dispatch || true)
          test "$galaxy_bad_code" = 404
          galaxy_receipt_code=$(curl -sS -D /tmp/agentos-grh -o /tmp/agentos-grb -w '%{http_code}' --max-time 4 \
            http://127.0.0.1:3000/dashboard/api/agentos/v1/dispatch/requests/agentos.social_threads_experiment_monitor.migrate_runtime-test123 || true)
          grep -qi '^x-agentos-realm-gateway: v0.1' /tmp/agentos-grh
          test "$galaxy_receipt_code" = 502
          echo 'clean_next_galaxy_scoped_dispatch=PASS'
          blocked_body='{"schema":"agentos.runner-window-dispatch/v1","capability":"media.google-flow","operation":"generate","source_commit":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","payload":{"project_id":"rain-exit-v001"}}'
          blocked_code=$(curl -sS -o /tmp/agentos-blocked -w '%{http_code}' --max-time 4 \
            -X POST -H 'Content-Type: application/json' -H 'Authorization: Bearer dummy-test-token' \
            -d "$blocked_body" http://127.0.0.1:3000/dashboard/api/agentos/v1/dispatch || true)
          test "$blocked_code" = 404
          receipt_code=$(curl -sS -D /tmp/agentos-rsh -o /tmp/agentos-rsb -w '%{http_code}' --max-time 4 \
            http://127.0.0.1:3000/dashboard/api/agentos/v1/dispatch/requests/agentos.vision_studio.produce-test123 || true)
          grep -qi '^x-agentos-realm-gateway: v0.1' /tmp/agentos-rsh
          test "$receipt_code" = 502
          echo 'clean_next_dispatch_get_catalog=PASS'
          echo 'clean_next_dispatch_post_denied=PASS'
          echo 'clean_next_rain_exit_scoped_dispatch=PASS'
          # A fixed Runtime Repair request crosses ONLY the public route-shape
          # fence; the upstream ONE still enforces signed workflow OIDC and SHA.
          repair_body='{"schema":"agentos.runner-window-dispatch/v1","capability":"agentos.runtime","operation":"repair","source_commit":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","payload":{}}'
          repair_code=$(curl -sS -D /tmp/agentos-runtime-h -o /tmp/agentos-runtime-b -w '%{http_code}' --max-time 4 \
            -X POST -H 'Content-Type: application/json' -H 'Authorization: Bearer dummy-test-token' \
            -d "$repair_body" http://127.0.0.1:3000/dashboard/api/agentos/v1/dispatch || true)
          grep -qi '^x-agentos-realm-gateway: v0.1' /tmp/agentos-runtime-h
          test "$repair_code" = 502
          invalid_repair='{"schema":"agentos.runner-window-dispatch/v1","capability":"agentos.runtime","operation":"restart","source_commit":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","payload":{}}'
          invalid_code=$(curl -sS -o /tmp/agentos-runtime-bad -w '%{http_code}' --max-time 4 \
            -X POST -H 'Content-Type: application/json' -H 'Authorization: Bearer dummy-test-token' \
            -d "$invalid_repair" http://127.0.0.1:3000/dashboard/api/agentos/v1/dispatch || true)
          test "$invalid_code" = 404
          repair_status_code=$(curl -sS -D /tmp/agentos-runtime-sh -o /tmp/agentos-runtime-sb -w '%{http_code}' --max-time 4 \
            http://127.0.0.1:3000/dashboard/api/agentos/v1/dispatch/requests/agentos.transport.repair-1762967000-1234abcd || true)
          grep -qi '^x-agentos-realm-gateway: v0.1' /tmp/agentos-runtime-sh
          test "$repair_status_code" = 502
          echo 'clean_next_main_runtime_repair_scoped_dispatch=PASS'


          echo 'clean_next_resolve_allowlist=PASS'


  deploy:
    needs: build-check
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Request pinned Realm gateway deploy through AgentOS scheduler
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID="realm-gateway-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RECEIPT="$RUNNER_TEMP/realm-gateway-receipt.json"
          AGENTOS_RECEIPT_TIMEOUT_SECONDS=480 \
            bash scripts/submit_oracle_bootstrap_request_remote.sh \
              agentos.realm_gateway.deploy "$REQUEST_ID" "$GITHUB_SHA" '{}' \
              > "$RECEIPT"
          cat "$RECEIPT"
          python3 - "$RECEIPT" "$GITHUB_SHA" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); source_commit=sys.argv[2]
          s=r.get('scheduler') or {}
          assert r.get('schema') == 'agentos.bootstrap-receipt/v1', r
          assert r.get('action') == 'agentos.realm_gateway.deploy', r
          assert r.get('executor_user') == 'ubuntu', r
          assert r.get('executor_uid') == 1001, r
          assert r.get('source_commit') == source_commit, r
          assert r.get('ok') is True, r
          assert s.get('node') == 'oracle', s
          assert s.get('worker_role') == 'maintenance', s
          assert s.get('worker_id') == 'oracle-maintenance', s
          assert 'oracle-core-runtime' in set(s.get('locks') or []), s
          # Only accept output from the successful Oracle run_script step.
          runs=[step for step in r.get('steps',[]) if step.get('step') == 'run_script']
          assert len(runs) == 1 and runs[0].get('returncode') == 0, runs
          markers=set(str(runs[0].get('stdout') or '').splitlines())
          def require(*values):
              missing=set(values)-markers
              assert not missing, {'missing':sorted(missing),'source_commit':source_commit}
          require(f'realm_gateway_source_commit={source_commit}',
                  'realm_gateway_public=PASS',
                  'realm_gateway_bootstrap_public=PASS')
          if 'realm_gateway_blue_green=PASS' in markers:
              # The canonical Blue/Green carrier has a separate release, port
              # owner and Nginx cutover contract from the legacy 3000 carrier.
              require('realm_gateway_dashboard_bg=PASS',
                      'realm_core_runtime_staged=PASS',
                      'realm_core_runtime_cutover=PASS',
                      'realm_core_runtime_restart=PASS',
                      f'realm_core_runtime_source_commit={source_commit}',
                      'realm_gateway_dispatch_public=PASS',
                      'nginx_mutation=BLUE_GREEN_HELPER',
                      'root_privilege=NGINX_RELOAD_ONLY')
              assert ('realm_gateway_dashboard_slot=blue' in markers or
                      'realm_gateway_dashboard_slot=green' in markers), markers
              assert ('realm_gateway_dashboard_port=3040' in markers or
                      'realm_gateway_dashboard_port=3041' in markers), markers
              print('realm_gateway_release_mode=blue_green')
          else:
              # Preserve strict legacy checks; do not treat arbitrary output
              # or an incomplete Blue/Green attempt as a successful release.
              require(f'route_source={source_commit}:dashboard/app/api/agentos/[...path]/route.ts',
                      'dashboard_build=PASS',
                      'realm_gateway_bootstrap_local=PASS',
                      'nginx_mutation=NONE')
              assert not any(m.startswith('realm_gateway_dashboard_bg=') for m in markers), markers
              print('realm_gateway_release_mode=legacy')
          print('realm_gateway_deploy=PASS')
          print('realm_gateway_pinned_source=PASS')
          print('realm_gateway_scheduler_worker='+s['worker_id'])
          PY

      - name: Verify public ONE identity and bootstrap/resolve routing
        shell: bash
        run: |
          set -euo pipefail
          URL='https://studio.milkcat.org/dashboard/api/agentos/v1/health'
          BODY=$(curl -fsS --max-time 8 "$URL")
          printf '%s' "$BODY" | grep -q 'agentos.one-health/v0.1'
          printf '%s' "$BODY" | grep -q 'realm-alston'
          B=/tmp/public-bootstrap-final
          C=$(curl -sS -o "$B" -w '%{http_code}' --max-time 8 'https://studio.milkcat.org/dashboard/api/agentos/v1/bootstrap?node_id=__gateway_probe__' || true)
          test "$C" = 401
          ! grep -q 'Realm gateway route not allowlisted' "$B"
          R=/tmp/public-resolve-final
          RC=$(curl -sS -o "$R" -w '%{http_code}' --max-time 8             -H 'Content-Type: application/json'             -d '{"schema":"agentos.resolve-request/v1","node_id":"__gateway_probe__","intent":"continue","project":"agentos-core"}'             'https://studio.milkcat.org/dashboard/api/agentos/v1/resolve' || true)
          test "$RC" = 401
          ! grep -q 'Realm gateway route not allowlisted' "$R"
          echo "realm_gateway_url=https://studio.milkcat.org/dashboard/api/agentos"
          echo "public_identity=PASS"
          echo "public_bootstrap_routing=PASS"
          echo "public_resolve_routing=PASS"
