name: VOPC5750 Multi-Agent Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.agentos/commands/vopc5750-multi-agent-acceptance.json'
      - '.github/workflows/vopc5750-multi-agent-acceptance.yml'
      - 'scripts/vopc5750_multi_agent_acceptance.py'

permissions:
  contents: write

concurrency:
  group: vopc5750-multi-agent-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 12
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run governed acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/vopc5750_multi_agent_acceptance.py

      - name: Commit sanitized acceptance evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .agentos/evidence/vopc5750-multi-agent-acceptance-current.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/vopc5750-multi-agent-acceptance-current.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(agentos): VOPC5750 multi-agent acceptance'
          git pull --rebase origin main
          git push origin HEAD:main
