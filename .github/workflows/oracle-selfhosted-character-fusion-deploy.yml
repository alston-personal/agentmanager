name: Oracle Selfhosted Character Fusion Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-dashboard-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact source
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          bash -n scripts/deploy_dashboard_blue_green_user.sh
          python3 -m py_compile scripts/character_fusion_worker.py libs/model2ir/src/model2ir/reconciliation.py
          echo "character_fusion_selfhosted_preflight=PASS"

      - name: Deploy through local Oracle runtime
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 scripts/deploy_dashboard_blue_green_user.sh /tmp/deploy_dashboard_blue_green_user.sh
          current_user="$(id -un)"
          echo "character_fusion_selfhosted_user=$current_user"
          if [ "$current_user" = "ubuntu" ]; then
            /tmp/deploy_dashboard_blue_green_user.sh "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          elif sudo -n -u ubuntu true 2>/dev/null; then
            sudo -n -u ubuntu -H /tmp/deploy_dashboard_blue_green_user.sh "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          else
            echo "character_fusion_selfhosted_deploy=NO_UBUNTU_AUTHORITY" >&2
            exit 9
          fi

      - name: Public Character Fusion acceptance
        shell: bash
        run: |
          set -euo pipefail
          session_code="$(curl -sS -o /tmp/character-fusion-session -w '%{http_code}' --max-time 10             https://studio.milkcat.org/dashboard/api/auth/session || true)"
          fusion_code="$(curl -sS -o /tmp/character-fusion-probe -w '%{http_code}' --max-time 10             https://studio.milkcat.org/dashboard/api/character-fusion/v1/jobs/__probe__ || true)"
          echo "dashboard_public_session_http=$session_code"
          echo "character_fusion_public_unauth_http=$fusion_code"
          test "$session_code" = 200
          test "$fusion_code" = 401
          grep -Fq 'Login required' /tmp/character-fusion-probe
          echo "character_fusion_selfhosted_public_acceptance=PASS"
