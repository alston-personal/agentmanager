name: Main Runner Window Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.agentos/governance/main-legacy-direct-oracle-workflows.txt'
      - 'scripts/check_main_runner_window_guard.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.agentos/governance/main-legacy-direct-oracle-workflows.txt'
      - 'scripts/check_main_runner_window_guard.py'

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_main_runner_window_guard.py


  control-inbox-reconcile-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/integration

      - name: Mint scheduler credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
import json,sys
v=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
assert v.count('.')==2
print(v)
PY
)"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Reconcile Control Inbox through Runner Window
        shell: bash
        env:
          AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos
        run: |
          set -euo pipefail
          AGENTOS_DISPATCH_WAIT_SECONDS=240 bash scripts/agentos_dispatch.sh             agentos.control-inbox reconcile "$GITHUB_SHA"             | tee "$RUNNER_TEMP/control-inbox-reconcile.txt"
          python3 - "$RUNNER_TEMP/control-inbox-reconcile.txt" <<'PY'
import json,sys
docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
assert docs, 'no Runner Window receipt'
receipt=docs[-1].get('receipt') or {}
print('CONTROL_INBOX_RECONCILE_RECEIPT='+json.dumps(receipt,sort_keys=True))
assert receipt.get('ok') is True, receipt
PY
