name: Diagnose Stalled Studio Audit Capsule

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-diagnose-studio-audit-capsule.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relay spool and worker state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/studio-audit-relay-diagnostic.txt
          ROOT=/home/ubuntu/agent-data/runtime/antigravity-relay
          ID=relay-21e1f5b65d2e4eb580332e624967675c
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_identity=$(id)"
            echo "target_capsule=$ID"
            echo '=== CURRENT UNIT ==='
            cat /home/ubuntu/.config/systemd/user/agentos-antigravity-relay.service 2>&1 || true
            echo '=== WORKER PROCESS ==='
            ps -eo user,group,pid,ppid,lstart,etime,stat,args | grep '[a]ntigravity_relay_worker' || true
            WPID=$(pgrep -u ubuntu -f 'agentos_node.antigravity_relay_worker --root /home/ubuntu/agent-data/runtime/antigravity-relay' | head -1 || true)
            echo "worker_pid=${WPID:-unknown}"
            if [ -n "$WPID" ] && [ -r "/proc/$WPID/status" ]; then
              echo '=== WORKER STATUS ==='
              grep -E '^(Name|State|Pid|PPid|Uid|Gid|Groups|Threads|Sig)' "/proc/$WPID/status" || true
              printf 'worker_wchan='; cat "/proc/$WPID/wchan" 2>/dev/null || true; echo
              echo '=== DIRECT CHILDREN ==='
              ps -eo user,group,pid,ppid,lstart,etime,stat,args | awk -v p="$WPID" '$4==p {print}' || true
              echo '=== PSTREE ==='
              pstree -ap "$WPID" 2>&1 || true
            fi
            echo '=== CLAUDE EXECUTORS ==='
            ps -eo user,group,pid,ppid,lstart,etime,stat,args | grep '/resources/native-binary/claude' | grep -v grep || true
            echo '=== QUEUE COUNTS ==='
            printf 'inbox='; find "$ROOT/inbox" -maxdepth 1 -type f -name 'relay-*.json' 2>/dev/null | wc -l
            printf 'processing='; find "$ROOT/processing" -maxdepth 1 -type f -name 'relay-*.json' 2>/dev/null | wc -l
            printf 'receipts='; find "$ROOT/receipts" -maxdepth 1 -type f -name 'relay-*.json' 2>/dev/null | wc -l
            printf 'receipt_tmp='; find "$ROOT/receipts" -maxdepth 1 -type f -name 'relay-*.json.tmp' 2>/dev/null | wc -l
            echo '=== TARGET LOCATIONS ==='
            for d in inbox processing receipts; do
              p="$ROOT/$d/$ID.json"
              if [ -e "$p" ]; then
                echo "$d=FOUND"
                stat -c '%n owner=%U group=%G mode=%a size=%s mtime=%y' "$p" 2>&1 || true
                if [ "$d" = receipts ]; then cat "$p" 2>&1 || true; fi
              else
                echo "$d=ABSENT"
              fi
            done
            echo '=== RECEIPT TMPS ==='
            for p in "$ROOT"/receipts/relay-*.json.tmp; do
              [ -e "$p" ] || continue
              stat -c '%n owner=%U group=%G mode=%a size=%s mtime=%y' "$p" || true
            done
            echo '=== PROCESSING ==='
            find "$ROOT/processing" -maxdepth 1 -type f -name 'relay-*.json' -printf '%T@ %p\n' 2>/dev/null | sort -n | head -30 || true
            echo '=== RECENT RECEIPTS ==='
            find "$ROOT/receipts" -maxdepth 1 -type f -name 'relay-*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -10 || true
          } 2>&1 | tee "$OUT"
      - name: Commit diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/studio-audit-relay-diagnostic.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(studio-web): stalled audit relay diagnosis'
          git pull --rebase origin main
          git push
