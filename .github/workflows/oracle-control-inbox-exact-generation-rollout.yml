name: Oracle Control Inbox Exact Generation Rollout

# Deployment-only rollout for the bounded GitHub Control Inbox bridge. This
# publishes the exact Core generation and invokes one fixed bootstrap action.
# It never reads private Canonical IR and is not a continuation control-plane
# fallback; live continuation acceptance still enters through the Control Inbox.
on:
  push:
    branches:
      - core/integration
    paths:
      - '.github/workflows/oracle-control-inbox-exact-generation-rollout.yml'
      - 'agent_core/control_inbox_bridge.py'
      - 'agent_core/active_continuation.py'
      - 'agent_core/chatgpt_continuation_projection.py'
      - 'agentos_node/bootstrap_control.py'
      - 'scripts/install_control_inbox_bridge_user.sh'
      - 'scripts/install_chatgpt_continuation_projection_user.sh'
      - 'scripts/repair_control_inbox_github_auth_user.sh'
      - 'scripts/deploy_mio_tryon_worker_user.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-control-inbox-exact-generation-rollout
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Preflight immutable integration generation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/core/integration'
          test "$(id -un)" = 'agentos-node'
          printf '%s' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git cat-file -e "$GITHUB_SHA^{commit}"
          echo "control_inbox_rollout_source_commit=$GITHUB_SHA"

      - name: Publish bootstrap hook and reconcile exact Control Inbox generation
        shell: bash
        run: |
          set -euo pipefail
          LIVE=/home/ubuntu/agentmanager
          ROOT=/tmp/agentos-bootstrap-control
          REQUESTS="$ROOT/requests"
          RECEIPTS="$ROOT/receipts"
          REQUEST_ID="control-inbox-rollout-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REQUEST="$REQUESTS/$REQUEST_ID.request.json"
          RECEIPT="$RECEIPTS/$REQUEST_ID.json"

          python3 -m py_compile agentos_node/bootstrap_control.py
          test -w "$LIVE/agentos_node" || test -w "$LIVE/agentos_node/bootstrap_control.py"
          if [ -e "$LIVE/agentos_node/bootstrap_control.py" ]; then
            cat agentos_node/bootstrap_control.py > "$LIVE/agentos_node/bootstrap_control.py"
          else
            cp agentos_node/bootstrap_control.py "$LIVE/agentos_node/bootstrap_control.py"
          fi
          chmod 0664 "$LIVE/agentos_node/bootstrap_control.py" || true
          python3 -m py_compile "$LIVE/agentos_node/bootstrap_control.py"

          for i in $(seq 1 120); do
            [ -d "$REQUESTS" ] && [ -d "$RECEIPTS" ] && break
            sleep 1
          done
          test -d "$REQUESTS"
          test -d "$RECEIPTS"
          test "$(stat -c '%U' "$REQUESTS")" = ubuntu
          test "$(stat -c '%a' "$REQUESTS")" = 1777

          python3 - "$REQUEST" "$REQUEST_ID" "$GITHUB_SHA" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path(sys.argv[1]); request_id = sys.argv[2]; sha = sys.argv[3]
          payload = {
              "schema": "agentos.bootstrap-request/v1",
              "request_id": request_id,
              "action": "agentos.control_inbox.reconcile",
              "created_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "params": {"source_commit": sha},
              "authority": {"source": "github-actions", "target_user": "ubuntu", "arbitrary_shell": False},
          }
          tmp = path.with_suffix(path.suffix + ".tmp")
          tmp.write_text(json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          os.chmod(tmp, 0o644); tmp.replace(path); os.chmod(path, 0o644)
          PY

          for i in $(seq 1 240); do [ -f "$RECEIPT" ] && break; sleep 1; done
          test -f "$RECEIPT" || { echo 'control_inbox_bootstrap_receipt=TIMEOUT'; exit 3; }

          python3 - "$RECEIPT" "$GITHUB_SHA" <<'PY'
          import json, sys
          receipt = json.load(open(sys.argv[1], encoding="utf-8")); expected = sys.argv[2]
          assert receipt.get("schema") == "agentos.bootstrap-receipt/v1", receipt
          assert receipt.get("action") == "agentos.control_inbox.reconcile", receipt
          assert receipt.get("executor_user") == "ubuntu", receipt
          assert receipt.get("executor_uid") == 1001, receipt
          assert receipt.get("source_commit") == expected, receipt
          assert receipt.get("ok") is True, receipt
          text = "\n".join(str(s.get("stdout", "")) + "\n" + str(s.get("stderr", "")) for s in receipt.get("steps", []))
          assert "control_inbox_install=PASS" in text, text[-12000:]
          assert "control_inbox_exact_generation=PASS" in text, text[-12000:]
          assert "control_inbox_continuation_identity=ENABLED" in text, text[-12000:]
          assert f"agentos_source_commit={expected}" in text, text[-12000:]
          assert "control_inbox_service=active" in text, text[-12000:]
          print("control_inbox_exact_generation_rollout=PASS")
          print("control_inbox_continuation_identity=ENABLED")
          PY


  mio-tryon-deploy:
    needs: reconcile
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Publish bootstrap hook and deploy Mio try-on worker
        shell: bash
        run: |
          set -euo pipefail
          LIVE=/home/ubuntu/agentmanager
          ROOT=/tmp/agentos-bootstrap-control
          REQUESTS="$ROOT/requests"
          RECEIPTS="$ROOT/receipts"
          REQUEST_ID="mio-tryon-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REQUEST="$REQUESTS/$REQUEST_ID.request.json"
          RECEIPT="$RECEIPTS/$REQUEST_ID.json"

          python3 -m py_compile agentos_node/bootstrap_control.py
          cat agentos_node/bootstrap_control.py > "$LIVE/agentos_node/bootstrap_control.py"
          python3 -m py_compile "$LIVE/agentos_node/bootstrap_control.py"

          for i in $(seq 1 120); do
            [ -d "$REQUESTS" ] && [ -d "$RECEIPTS" ] && break
            sleep 1
          done
          test -d "$REQUESTS"
          test -d "$RECEIPTS"

          python3 - "$REQUEST" "$REQUEST_ID" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          from datetime import datetime,timezone
          from pathlib import Path
          path=Path(sys.argv[1]); request_id=sys.argv[2]; sha=sys.argv[3]
          payload={
            "schema":"agentos.bootstrap-request/v1",
            "request_id":request_id,
            "action":"agentos.mio_tryon.deploy",
            "created_at":datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z"),
            "params":{"source_commit":sha},
            "authority":{"source":"github-actions","target_user":"ubuntu","arbitrary_shell":False},
          }
          tmp=path.with_suffix(path.suffix+".tmp")
          tmp.write_text(json.dumps(payload,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          os.chmod(tmp,0o644); tmp.replace(path); os.chmod(path,0o644)
          PY

          for i in $(seq 1 480); do
            [ -f "$RECEIPT" ] && break
            sleep 1
          done
          test -f "$RECEIPT" || { echo 'mio_tryon_bootstrap_receipt=TIMEOUT'; exit 3; }

          python3 - "$RECEIPT" "$GITHUB_SHA" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); expected=sys.argv[2]
          assert r.get('schema')=='agentos.bootstrap-receipt/v1',r
          assert r.get('action')=='agentos.mio_tryon.deploy',r
          assert r.get('executor_user')=='ubuntu',r
          assert r.get('executor_uid')==1001,r
          assert r.get('source_commit')==expected,r
          text='\n'.join(str(s.get('stdout') or '')+'\n'+str(s.get('stderr') or '') for s in r.get('steps',[]))
          assert r.get('ok') is True,text[-16000:]
          for marker in (
            'mio_any_item_hf_token_configured=yes',
            'mio_tryon_worker_service=active',
            'mio_any_item_shoe_e2e=PASS',
            'mio_tryon_deploy=PASS',
          ):
            assert marker in text, marker+' missing\n'+text[-16000:]
          print('mio_tryon_bootstrap_deploy=PASS')
          for line in text.splitlines():
            if line.startswith('mio_any_item_') or line.startswith('mio_tryon_'):
              print(line)
          PY
