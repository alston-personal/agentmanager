name: Character Fusion Flow Output Probe

on:
  pull_request:
    branches: [core/integration]
    paths:
      - '.github/workflows/character-fusion-flow-output-probe.yml'
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/character-fusion-flow-output-probe.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -Fq 'flow_output_probe=PASS' .github/workflows/character-fusion-flow-output-probe.yml

  probe:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect visible Flow output media via raw CDP
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 \
            -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'python3 -' <<'PY'
          import asyncio, json, urllib.request, websockets
          PORT=9225
          with urllib.request.urlopen(f"http://127.0.0.1:{PORT}/json/list",timeout=5) as r:
              rows=json.loads(r.read().decode())
          target=next((x for x in rows if x.get("type")=="page" and "flow.google.com/project/" in str(x.get("url") or "")),None)
          if not target:
              raise SystemExit("flow_project_session=NOT_FOUND")
          async def main():
              async with websockets.connect(target["webSocketDebuggerUrl"],open_timeout=5,max_size=8*1024*1024) as ws:
                  seq=0
                  async def call(method,params=None):
                      nonlocal seq
                      seq+=1; ident=seq
                      await ws.send(json.dumps({"id":ident,"method":method,"params":params or {}}))
                      while True:
                          msg=json.loads(await ws.recv())
                          if msg.get("id")==ident:
                              if msg.get("error"): raise RuntimeError(msg["error"])
                              return msg.get("result") or {}
                  expr=r'''(() => {
                    const vis=el=>!!(el.offsetWidth||el.offsetHeight||el.getClientRects().length);
                    const rect=el=>{const r=el.getBoundingClientRect();return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}};
                    const imgs=[...document.querySelectorAll('img')].map(el=>({
                      visible:vis(el),rect:rect(el),src:(el.currentSrc||el.src||'').slice(0,500),
                      naturalWidth:el.naturalWidth||0,naturalHeight:el.naturalHeight||0,
                      alt:(el.alt||'').slice(0,180),cls:(el.className||'').toString().slice(0,220)
                    }));
                    const videos=[...document.querySelectorAll('video')].map(el=>({
                      visible:vis(el),rect:rect(el),src:(el.currentSrc||el.src||'').slice(0,500),
                      poster:(el.poster||'').slice(0,500),duration:el.duration||0,cls:(el.className||'').toString().slice(0,220)
                    }));
                    const canvases=[...document.querySelectorAll('canvas')].map(el=>({
                      visible:vis(el),rect:rect(el),width:el.width,height:el.height,cls:(el.className||'').toString().slice(0,220)
                    }));
                    const bg=[];
                    for(const el of document.querySelectorAll('*')){
                      if(!vis(el)) continue;
                      const b=getComputedStyle(el).backgroundImage;
                      if(b&&b!=='none'&&/url\(/.test(b)) bg.push({tag:el.tagName,rect:rect(el),backgroundImage:b.slice(0,500),cls:(el.className||'').toString().slice(0,220)});
                    }
                    const links=[...document.querySelectorAll('a[href],button')].filter(vis).map(el=>({
                      tag:el.tagName,text:(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim().slice(0,140),
                      aria:(el.getAttribute('aria-label')||'').slice(0,140),
                      href:(el.href||'').slice(0,500),
                      cls:(el.className||'').toString().slice(0,220)
                    })).filter(x=>/download|下載|image|圖片|export|匯出|save|儲存|favorite|reuse|重複使用/i.test([x.text,x.aria,x.href].join(' ')));
                    return {url:location.href,title:document.title,imgs,videos,canvases,bg:bg.slice(0,120),links:links.slice(0,120)};
                  })()'''
                  r=await call("Runtime.evaluate",{"expression":expr,"returnByValue":True,"awaitPromise":True})
                  print(json.dumps((r.get("result") or {}).get("value"),ensure_ascii=False))
                  print("flow_output_probe=PASS")
          asyncio.run(main())
          PY
