name: Persona Reviewed Media Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/persona_media*.py'
      - 'scripts/persona_reference_install.py'
      - 'scripts/persona_wardrobe_sources.py'
      - 'scripts/persona_internal_activity_executor.py'
      - 'scripts/persona_post_intent_generator.py'
      - 'scripts/persona_image_generate_flux.py'
      - 'scripts/persona_social_executor.py'
      - 'scripts/validate_mio_visual_manifest.py'
      - 'scripts/install_persona_pdca_timer_user.sh'
      - '.github/workflows/persona-pdca-heartbeat.yml'
      - 'tests/test_persona_media_publish.py'
      - 'tests/test_persona_media_review.py'
      - 'tests/test_persona_reference_install.py'
      - 'tests/test_persona_wardrobe_sources.py'
      - 'tests/test_persona_post_reasoning.py'
      - '.github/workflows/persona-media-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/persona_media*.py'
      - 'scripts/persona_reference_install.py'
      - 'scripts/persona_wardrobe_sources.py'
      - 'scripts/persona_internal_activity_executor.py'
      - 'scripts/persona_post_intent_generator.py'
      - 'scripts/persona_image_generate_flux.py'
      - 'scripts/persona_social_executor.py'
      - 'tests/test_persona_media_publish.py'
      - 'tests/test_persona_media_review.py'
      - 'tests/test_persona_reference_install.py'
      - 'tests/test_persona_wardrobe_sources.py'
      - 'tests/test_persona_post_reasoning.py'
      - '.github/workflows/persona-media-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test reviewed image delivery without live providers or public writes
        run: python3 -m unittest tests.test_persona_reference_install tests.test_persona_media_publish tests.test_persona_media_review tests.test_mio_media_ledger_smoke tests.test_persona_post_reasoning tests.test_persona_wardrobe_sources -v
      - name: Check existing deployment scripts
        run: bash -n scripts/install_persona_pdca_timer_user.sh scripts/run_persona_social_actions_user.sh
