name: Inspect Live Paste Runtime

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/inspect-live-paste-runtime.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect Oracle and Windows live sources
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          echo '===ORACLE_CURRENT==='
          readlink -f /home/ubuntu/.local/share/agentos/realm-fabric/current || true
          python3 - <<'PY'
          import inspect, json, time, pathlib
          from agent_core.realm_fabric import RealmFabricStore
          cur=pathlib.Path('/home/ubuntu/.local/share/agentos/realm-fabric/current/agent_core/controller_api.py')
          txt=cur.read_text(encoding='utf-8') if cur.exists() else ''
          print('ORACLE_HAS_PASTE='+str("'operation': 'paste'" in txt))
          print('ORACLE_HAS_TYPE='+str("'operation': 'type'" in txt))
          f=RealmFabricStore()
          tid='inspect-windows-live-paste-runtime-20261006-1332'
          code="import inspect,agentos_node.interactive_desktop as m; s=inspect.getsource(m.keyboard); print('MODULE='+m.__file__); print('HAS_PASTE='+str(\"op == 'paste'\" in s)); print('HAS_CLIPBOARD='+str('Clipboard' in s)); print('HAS_TYPE_ONLY='+str(\"only supports operation=type'\" in s))"
          if f.get_receipt(tid) is None:
              f.queue_task('VO10005870',{'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':r'C:\Users\alston.huang\AppData\Local\Programs\Python\Python312\python.exe','argv':['-c',code],'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':15,'cognition_ids_used':['demo://runtime-inspect/20261006']})
          for _ in range(30):
              r=f.get_receipt(tid)
              if r:
                  print('WINDOWS='+json.dumps(r,ensure_ascii=False,separators=(',',':')))
                  raise SystemExit(0)
              time.sleep(1)
          raise SystemExit('windows_runtime_receipt_missing')
          PY
          REMOTE
