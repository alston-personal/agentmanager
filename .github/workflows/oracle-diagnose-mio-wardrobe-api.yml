name: Oracle Diagnose Mio Wardrobe API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-diagnose-mio-wardrobe-api.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    env:
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Inspect live dashboard wardrobe API
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@127.0.0.1" bash -s <<'REMOTE'
          set -euo pipefail
          LIVE=/home/ubuntu/agent-data/runtime/dashboard/current
          CWD="$(readlink -f "$LIVE" 2>/dev/null || true)"
          echo "dashboard_live_cwd=$CWD"
          test -n "$CWD" && test -d "$CWD"

          echo "=== route source/build presence ==="
          test -f "$CWD/app/api/wardrobe/tryon/render/route.ts" && echo "tryon_route_source=present" || echo "tryon_route_source=missing"
          find "$CWD/.next/server/app" -path '*wardrobe*tryon*render*' -maxdepth 12 -type f 2>/dev/null | head -n 20 || true

          echo "=== local API ==="
          code="$(curl --noproxy '*' -sS -o /tmp/mio-tryon-api-body -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data '{"characterId":"sunlake-milkcat-ai-001","selectedLayers":{"lower_main":"net-32235-711"}}' \
            http://127.0.0.1:3000/dashboard/api/wardrobe/tryon/render || true)"
          echo "tryon_local_http=$code"
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/mio-tryon-api-body')
          raw=p.read_text(encoding='utf-8',errors='replace')[:1000] if p.exists() else ''
          try:
              obj=json.loads(raw)
              print('tryon_local_json_keys='+','.join(sorted(obj.keys())))
              if 'error' in obj:
                  print('tryon_local_error='+str(obj['error'])[:300])
          except Exception:
              print('tryon_local_body_non_json='+raw.replace('\n',' ')[:300])
          PY

          echo "=== public reverse proxy ==="
          code="$(curl --noproxy '*' -k -sS -o /tmp/mio-tryon-public-body -w '%{http_code}' --resolve studio.milkcat.org:443:127.0.0.1 \
            -X POST -H 'Content-Type: application/json' \
            --data '{"characterId":"sunlake-milkcat-ai-001","selectedLayers":{"lower_main":"net-32235-711"}}' \
            https://studio.milkcat.org/dashboard/api/wardrobe/tryon/render || true)"
          echo "tryon_public_http=$code"
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/mio-tryon-public-body')
          raw=p.read_text(encoding='utf-8',errors='replace')[:1000] if p.exists() else ''
          try:
              obj=json.loads(raw)
              print('tryon_public_json_keys='+','.join(sorted(obj.keys())))
              if 'error' in obj:
                  print('tryon_public_error='+str(obj['error'])[:300])
          except Exception:
              print('tryon_public_body_non_json='+raw.replace('\n',' ')[:300])
          PY

          echo "=== NET shoe image source ==="
          python3 - <<'PY'
          import html, re, urllib.request
          url='https://m.net-fashion.net/product/735479'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          raw=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
          values=[]
          for m in re.finditer(r'''(?:src|data-src|href)=["']([^"']+)["']''', raw, re.I):
              value=html.unescape(m.group(1))
              if any(k in value for k in ('734984','735479','40832-002','40832')):
                  values.append(value)
          for value in dict.fromkeys(values):
              print('net_shoe_candidate='+value)
          print('net_shoe_candidate_count='+str(len(dict.fromkeys(values))))
          PY

          echo "=== PWA auth handoff ==="
          for route in start exchange complete; do
            test -f "$CWD/.next/server/app/api/auth/pwa/$route/route.js" && echo "pwa_route_$route=present" || echo "pwa_route_$route=missing"
          done
          echo "=== PWA route mapping ==="
          python3 - "$CWD/.next/server/app-paths-manifest.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          for k,v in sorted(p.items()):
              if '/api/auth/pwa/' in k:
                  print('pwa_manifest='+k+' -> '+v)
          PY
          for url in \
            http://127.0.0.1:3000/dashboard/api/auth/pwa/start \
            http://127.0.0.1:3000/api/auth/pwa/start; do
            code_local="$(curl --noproxy '*' -sS -o /tmp/mio-pwa-local-body -w '%{http_code}' -X POST -H 'Accept: application/json' "$url" || true)"
            echo "pwa_local_url=$url status=$code_local"
            head -c 300 /tmp/mio-pwa-local-body | tr '\n' ' '; echo
          done

          code="$(curl --noproxy '*' -k -sS -o /tmp/mio-pwa-start-body -w '%{http_code}' --resolve studio.milkcat.org:443:127.0.0.1 \
            -X POST -H 'Accept: application/json' https://studio.milkcat.org/dashboard/api/auth/pwa/start || true)"
          echo "pwa_start_http=$code"
          python3 - <<'PY'
          import json,pathlib
          raw=pathlib.Path('/tmp/mio-pwa-start-body').read_text(encoding='utf-8',errors='replace')[:1200]
          try:
              obj=json.loads(raw)
              print('pwa_start_keys='+','.join(sorted(obj.keys())))
              print('pwa_start_has_handoff='+str(bool(obj.get('handoffId'))))
              print('pwa_start_has_signin='+str(bool(obj.get('signInUrl'))))
              if 'error' in obj: print('pwa_start_error='+str(obj['error'])[:300])
          except Exception:
              print('pwa_start_body_non_json='+raw.replace('\n',' ')[:500])
          PY

          echo "=== wardrobe auth handoff ==="
          test -f "$CWD/.next/server/app/api/wardrobe/auth-handoff/route.js" && echo "wardrobe_handoff_route=present" || echo "wardrobe_handoff_route=missing"
          code="$(curl --noproxy '*' -k -sS -o /tmp/mio-wardrobe-handoff-body -w '%{http_code}' --resolve studio.milkcat.org:443:127.0.0.1 \
            -X POST -H 'Accept: application/json' 'https://studio.milkcat.org/dashboard/api/wardrobe/auth-handoff?action=start' || true)"
          echo "wardrobe_handoff_start_http=$code"
          python3 - <<'PY'
          import json,pathlib
          raw=pathlib.Path('/tmp/mio-wardrobe-handoff-body').read_text(encoding='utf-8',errors='replace')[:1200]
          try:
              obj=json.loads(raw)
              print('wardrobe_handoff_start_keys='+','.join(sorted(obj.keys())))
              print('wardrobe_handoff_has_id='+str(bool(obj.get('handoffId'))))
              print('wardrobe_handoff_has_signin='+str(bool(obj.get('signInUrl'))))
          except Exception:
              print('wardrobe_handoff_non_json='+raw.replace('\n',' ')[:400])
          PY

          echo "=== auth signin ==="
          code="$(curl --noproxy '*' -k -sS -D /tmp/mio-auth-signin-head -o /tmp/mio-auth-signin-body -w '%{http_code}' --resolve studio.milkcat.org:443:127.0.0.1 \
            'https://studio.milkcat.org/dashboard/api/auth/signin/google?returnTo=%2Fpersonas%2Fmio%2Fwardrobe%2F%3FresumeTryOn%3D1' || true)"
          echo "auth_signin_http=$code"
          grep -i '^location:' /tmp/mio-auth-signin-head | sed 's/[?&]state=[^&]*/\&state=<redacted>/' | head -n 1 || true
          if [ "$code" != 307 ] && [ "$code" != 302 ]; then
            head -c 500 /tmp/mio-auth-signin-body | tr '\n' ' '; echo
          fi

          echo "=== recent PWA handoff state ==="
          python3 - <<'PY'
          import json, pathlib, datetime
          root=pathlib.Path('/home/ubuntu/agent-data/auth/pwa-handoffs')
          rows=[]
          if root.exists():
              for p in root.glob('*.json'):
                  try:
                      j=json.loads(p.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  rows.append((j.get('createdAt',''), {
                      'createdAt': j.get('createdAt'),
                      'expiresAt': j.get('expiresAt'),
                      'status': j.get('status'),
                      'hasAuthToken': bool(j.get('authToken')),
                  }))
          for _,row in sorted(rows, reverse=True)[:12]:
              print('pwa_handoff_state='+json.dumps(row,ensure_ascii=False))
          print('pwa_handoff_count='+str(len(rows)))
          PY

          echo "=== recent Dashboard auth errors ==="
          for log in /home/ubuntu/.pm2/logs/agentos-dashboard-error.log /home/ubuntu/.pm2/logs/agentos-dashboard-out.log; do
            test -f "$log" || continue
            echo "dashboard_log=$(basename "$log")"
            tail -n 500 "$log" | grep -E 'OAuth callback error|Sign-in redirect error|handoff|auth-handoff' | tail -n 80 | \
              sed -E 's/(code|state|token|auth_token|handoff)=([^&[:space:]]+)/\1=<redacted>/g' || true
          done

          echo "=== OAuth server-side return target ==="
          TEST_RETURN='/dashboard/api/wardrobe/auth-handoff?handoff=diagnostic-only-not-real'
          curl --noproxy '*' -k -sS -D /tmp/mio-oauth-state-head -o /dev/null --resolve studio.milkcat.org:443:127.0.0.1 \
            "https://studio.milkcat.org/dashboard/api/auth/signin/google?returnTo=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["TEST_RETURN"],safe=""))')" || true
          export OAUTH_LOCATION="$(grep -i '^location:' /tmp/mio-oauth-state-head | tail -n1 | sed 's/^[Ll]ocation:[[:space:]]*//' | tr -d '\r')"
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse
          loc=os.environ.get('OAUTH_LOCATION','')
          q=urllib.parse.parse_qs(urllib.parse.urlparse(loc).query)
          state=(q.get('state') or [''])[0]
          print('oauth_state_present='+str(bool(state)))
          root=pathlib.Path('/home/ubuntu/agent-data/auth/oauth-states')
          p=root/(state+'.json') if state else None
          print('oauth_state_file_present='+str(bool(p and p.exists())))
          if p and p.exists():
              row=json.loads(p.read_text(encoding='utf-8'))
              print('oauth_state_return_target_ok='+str(row.get('returnTo')=='/dashboard/api/wardrobe/auth-handoff?handoff=diagnostic-only-not-real'))
          PY

          echo "=== auth session ==="
          code="$(curl --noproxy '*' -k -sS -o /tmp/mio-auth-session-body -w '%{http_code}' --resolve studio.milkcat.org:443:127.0.0.1 \
            https://studio.milkcat.org/dashboard/api/auth/session || true)"
          echo "auth_session_http=$code"
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/mio-auth-session-body')
          raw=p.read_text(encoding='utf-8',errors='replace')[:1200] if p.exists() else ''
          try:
              obj=json.loads(raw)
              print('auth_session_loggedIn='+str(obj.get('loggedIn')))
              print('auth_session_role='+str(obj.get('role')))
              print('auth_session_provider='+str(obj.get('provider')))
          except Exception:
              print('auth_session_body_non_json='+raw.replace('\n',' ')[:300])
          PY

          echo "=== admin runtime configuration ==="
          ADMIN_FILE=/home/ubuntu/.config/milkcat/admin-identities
          if [ -f "$ADMIN_FILE" ]; then
            echo "admin_identity_file=present"
            echo "admin_identity_count=$(grep -Ev '^[[:space:]]*(#|$)' "$ADMIN_FILE" | wc -l)"
            stat -c 'admin_identity_mode=%a owner=%u' "$ADMIN_FILE"
          else
            echo "admin_identity_file=missing"
          fi

          ROOT=/home/ubuntu/agent-data/projects/dressup-simulator
          echo "recent_render_jobs:"
          python3 - "$ROOT/render_jobs/runtime" <<'PY'
          import json,pathlib,sys
          d=pathlib.Path(sys.argv[1])
          rows=[]
          for p in d.glob('*.json'):
              try:j=json.loads(p.read_text(encoding='utf-8'))
              except:continue
              rows.append((j.get('requestedAt',''),j))
          for _,j in sorted(rows,reverse=True)[:8]:
              print(json.dumps({
                'jobId':j.get('jobId'),
                'requestedAt':j.get('requestedAt'),
                'status':j.get('status'),
                'error':(j.get('error') or {}).get('code'),
                'layers':list(((j.get('input') or {}).get('selectedLayers') or {}).keys())
              },ensure_ascii=False))
          PY
          REMOTE
