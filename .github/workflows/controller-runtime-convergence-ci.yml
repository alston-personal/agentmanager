name: Controller Runtime Convergence CI

on:
  pull_request:
    paths:
      - 'agent_core/controller_api.py'
      - 'tests/test_controller_api.py'
      - '.github/workflows/controller-runtime-convergence-ci.yml'
  push:
    branches:
      - core/integration
    paths:
      - 'agent_core/controller_api.py'
      - 'tests/test_controller_api.py'
      - '.github/workflows/controller-runtime-convergence-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile controller modules
        run: python -m py_compile agent_core/controller_api.py agent_core/realm_server.py
      - name: Run controller regressions
        run: python -m pytest -q tests/test_controller_api.py
