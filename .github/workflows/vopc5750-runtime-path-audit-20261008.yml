name: VOPC5750 Runtime Path Audit 20261008

on:
  push:
    branches:
      - ops/vopc5750-runtime-path-audit-20261008
    paths:
      - '.github/workflows/vopc5750-runtime-path-audit-20261008.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
    steps:
      - uses: actions/checkout@v4

      - name: Remove exact isolated semantic task
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from agent_core.realm_fabric import RealmFabricStore
          target='task-semantic-isolated-b426160e3d1c42c4981d7b11a7f62b5b'
          fabric=RealmFabricStore()
          data=fabric.load()
          queue=list((data.get('tasks') or {}).get('vopc5750') or [])
          data['tasks']['vopc5750']=[
              item for item in queue
              if not (isinstance(item,dict) and item.get('task_id')==target)
          ]
          fabric.save(data)
          print('semantic_retry_cleanup=PASS')
          PY

      - name: Inspect scheduled task and client processes through ONE
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,uuid
          from agent_core.realm_fabric import RealmFabricStore

          script = r'''
          $ErrorActionPreference='Stop'
          $task=Get-ScheduledTask -TaskName 'AgentOS Thin Client' -ErrorAction Stop
          $action=$task.Actions | Select-Object -First 1
          $procs=@(Get-CimInstance Win32_Process | Where-Object {
            $_.CommandLine -and $_.CommandLine -match 'agentos_node\.client_cli' -and $_.CommandLine -match '\brun\b'
          } | Select-Object Name,ProcessId,ParentProcessId,SessionId,CommandLine)

          [pscustomobject]@{
            TaskState=[string]$task.State
            Execute=[string]$action.Execute
            Arguments=[string]$action.Arguments
            WorkingDirectory=[string]$action.WorkingDirectory
            ProcessCount=$procs.Count
            Processes=$procs
          } | ConvertTo-Json -Depth 6 -Compress
          '''

          fabric=RealmFabricStore()
          task_id='task-runtime-audit-'+uuid.uuid4().hex
          fabric.queue_task('vopc5750',{
              'schema':'agentos.node-task/v0.1',
              'task_id':task_id,
              'action':'shell.exec',
              'executable':'powershell',
              'argv':['-NoProfile','-NonInteractive','-Command',script],
              'cwd':r'C:\Users\alston.huang\AgentOS',
              'timeout_seconds':30,
          })
          receipt=None
          deadline=time.time()+45
          while time.time()<deadline:
              receipt=fabric.get_receipt(task_id)
              if receipt:
                  break
              time.sleep(1)
          print(json.dumps(receipt,indent=2,sort_keys=True))
          assert receipt and receipt.get('ok') is True, receipt
          assert receipt.get('returncode') == 0, receipt
          print('RUNTIME_PATH_AUDIT=PASS')
          PY
