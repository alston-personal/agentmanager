name: Atlas Dashboard API Build

on:
  pull_request:
    paths:
      - 'dashboard/app/api/atlas/**'
      - 'dashboard/lib/auth/**'
      - 'dashboard/lib/auth.ts'
      - 'dashboard/lib/data-root.ts'
      - 'dashboard/package.json'
      - 'dashboard/package-lock.json'
      - '.github/workflows/atlas-dashboard-api-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Smoke test Atlas access and source failure boundaries
        shell: bash
        env:
          JWT_SECRET: ci-atlas-readonly-nonproduction-only
          MILKCAT_ADMIN_IDENTITIES: "github:username:atlas-admin"
          AGENT_DATA_ROOT: /tmp/atlas-ci-test-data
        run: |
          set -euo pipefail
          PORT=33171 npm run start -- --port 33171 > /tmp/atlas-next.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:33171/dashboard/api/auth/session >/dev/null 2>&1; then break; fi
            sleep 1
          done
          endpoint=http://127.0.0.1:33171/dashboard/api/atlas/snapshot
          unauth=$(curl -s -o /tmp/atlas-401 -w '%{http_code}' "$endpoint")
          test "$unauth" = 401
          export REGULAR_TOKEN="$(node -e 'console.log(require("jsonwebtoken").sign({username:"visitor",provider:"github",exp:Math.floor(Date.now()/1000)+600},process.env.JWT_SECRET))')"
          regular=$(curl -s -o /tmp/atlas-403 -w '%{http_code}' -H "Cookie: auth_token=$REGULAR_TOKEN" "$endpoint")
          test "$regular" = 403
          export ADMIN_TOKEN="$(node -e 'console.log(require("jsonwebtoken").sign({username:"atlas-admin",provider:"github",exp:Math.floor(Date.now()/1000)+600},process.env.JWT_SECRET))')"
          missing=$(curl -s -o /tmp/atlas-503 -w '%{http_code}' -H "Cookie: auth_token=$ADMIN_TOKEN" "$endpoint")
          test "$missing" = 503
          mkdir -p "$AGENT_DATA_ROOT/governance"
          printf '%s' '{"schema":"agentos.work-completion/v1","items":{"smoke":{"work_id":"smoke","title":"CI bounded example","status":"in_progress","owner":"role://lobster"}}}' > "$AGENT_DATA_ROOT/governance/work-items.json"
          ok=$(curl -s -D /tmp/atlas-headers -o /tmp/atlas-200 -w '%{http_code}' -H "Cookie: auth_token=$ADMIN_TOKEN" "$endpoint")
          test "$ok" = 200
          grep -qi 'cache-control: private, no-store' /tmp/atlas-headers
          node -e 'const j=JSON.parse(require("node:fs").readFileSync("/tmp/atlas-200","utf8"));if(j.portfolio.work_items[0].status!=="unknown" || j.portfolio.supervisor_status!=="unknown" || j.portfolio.node_status!=="unknown")process.exit(1)'
          echo "atlas_smoke_auth_401_403_missing_503_admin_200_unknown=PASS"
          # Independent process: no JWT_SECRET, but a syntactically valid token signed
          # with the shared auth module's known dev fallback must never grant Atlas access.
          env -u JWT_SECRET PORT=33172 npm run start -- --port 33172 > /tmp/atlas-next-no-secret.log 2>&1 &
          insecure_pid=$!
          trap 'kill "$insecure_pid" "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:33172/dashboard/api/auth/session >/dev/null 2>&1; then break; fi
            sleep 1
          done
          fallback_token="$(node -e 'console.log(require("jsonwebtoken").sign({username:"atlas-admin",provider:"github",exp:Math.floor(Date.now()/1000)+600},"your-secret-key-change-in-production"))')"
          disabled=$(curl -s -o /tmp/atlas-no-secret -w '%{http_code}' -H "Cookie: auth_token=$fallback_token" http://127.0.0.1:33172/dashboard/api/atlas/snapshot)
          test "$disabled" = 503
          node -e 'const j=JSON.parse(require("node:fs").readFileSync("/tmp/atlas-no-secret","utf8"));if(j.error!=="atlas_auth_not_configured")process.exit(1)'
          echo "atlas_smoke_unconfigured_jwt_fail_closed=PASS"
