name: Atlas Dashboard API Build

on:
  pull_request:
    paths:
      - 'dashboard/app/api/atlas/**'
      - 'dashboard/lib/auth/**'
      - 'dashboard/lib/auth.ts'
      - 'dashboard/lib/data-root.ts'
      - 'dashboard/package.json'
      - 'dashboard/package-lock.json'
      - '.github/workflows/atlas-dashboard-api-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
