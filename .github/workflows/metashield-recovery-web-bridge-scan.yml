name: MetaShield Recovery Web Bridge Scan

on:
  push:
    paths:
      - '.github/workflows/metashield-recovery-web-bridge-scan.yml'
      - 'scripts/metashield_recovery_web_bridge_scan.sh'

permissions:
  contents: write

jobs:
  scan:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Scan recovery web bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new scripts/metashield_recovery_web_bridge_scan.sh "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/metashield_recovery_web_bridge_scan.sh"
          ssh -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" "bash /tmp/metashield_recovery_web_bridge_scan.sh /tmp/metashield-recovery-web-bridge-scan.json"
          scp -P "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/metashield-recovery-web-bridge-scan.json" .agentos/evidence/metashield-recovery-web-bridge-scan.json
          cat .agentos/evidence/metashield-recovery-web-bridge-scan.json
      - name: Persist scan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MetaShield Oracle'
          git config user.email 'register@milkcat.org'
          git add .agentos/evidence/metashield-recovery-web-bridge-scan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence(metashield): persist recovery web bridge scan'
          git push origin HEAD:ops/metashield-inspect-after-timeout
