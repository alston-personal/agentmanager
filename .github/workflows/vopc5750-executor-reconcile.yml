name: VOPC5750 Executor Reconcile Acceptance

on:
  push:
    branches:
      - agentos/executor-reconcile-v01
    paths:
      - '.agentos/commands/vopc5750-executor-reconcile.json'
      - '.github/workflows/vopc5750-executor-reconcile.yml'

permissions:
  contents: write

concurrency:
  group: vopc5750-executor-reconcile
  cancel-in-progress: false

jobs:
  accept:
    if: github.actor == 'alstonhuang'
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify accepted feature runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from agent_core.node_registry import NodeRegistry
          cmd=json.load(open('.agentos/commands/vopc5750-executor-reconcile.json',encoding='utf-8'))
          assert cmd.get('schema') == 'agentos.realm-command/v0.1'
          assert cmd.get('action') == 'realm.node.executor-reconcile'
          assert cmd.get('node_id') == 'vopc5750'
          node=next((n for n in NodeRegistry().node_map()['nodes'] if n.get('node_id')=='vopc5750'),None)
          assert node is not None and node.get('status') == 'online', node
          runtime=node.get('runtime') or {}
          expected='b465443f77d23286c2e652504c3d2d524e1677d1'
          assert runtime.get('source_commit') == expected, runtime
          print('vopc_runtime_source='+expected)
          print('vopc_runtime_acceptance=PASS')
          PY

      - name: Queue executor reconcile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time
          from pathlib import Path
          from agent_core.realm_fabric import RealmFabricStore
          task_id='executor-reconcile-'+str(int(time.time()))
          task={'schema':'agentos.node-task/v0.1','task_id':task_id,'action':'agent.executor.reconcile','cognition_ids_used':[]}
          queued=RealmFabricStore().queue_task('vopc5750',task)
          Path('/tmp/vopc-executor-reconcile.json').write_text(json.dumps({'task':queued},indent=2)+'\n',encoding='utf-8')
          print('reconcile_task_id='+task_id)
          PY

      - name: Wait for reconcile receipt and publish evidence
        shell: bash
        run: |
          set -euo pipefail
          TASK=$(python3 -c "import json; print(json.load(open('/tmp/vopc-executor-reconcile.json'))['task']['task_id'])")
          for i in $(seq 1 45); do
            if python3 - "$TASK" <<'PY'
          import json,sys
          from pathlib import Path
          from agent_core.realm_fabric import RealmFabricStore
          r=RealmFabricStore().get_receipt(sys.argv[1])
          if not (r and r.get('ok') is True):
              raise SystemExit(1)
          adoption=r.get('executor_adoption')
          if not isinstance(adoption,dict) or adoption.get('schema')!='agentos.executor-adoption/v0.1':
              raise SystemExit(1)
          evidence={'schema':'agentos.executor-reconcile-acceptance/v0.1','node_id':'vopc5750','task_id':sys.argv[1],'ok':True,'summary':adoption.get('summary'),'executors':adoption.get('executors')}
          Path('/tmp/vopc-executor-reconcile-evidence.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('executor_reconcile_receipt=PASS')
          print(json.dumps(evidence,sort_keys=True))
          raise SystemExit(0)
          PY
            then break; fi
            sleep 2
          done
          test -f /tmp/vopc-executor-reconcile-evidence.json
          mkdir -p .agentos/evidence
          cp /tmp/vopc-executor-reconcile-evidence.json .agentos/evidence/vopc5750-executor-reconcile-current.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/vopc5750-executor-reconcile-current.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(agentos): accept VOPC5750 executor reconcile'
          git push origin HEAD:${{ github.ref_name }}
