name: Snapshot Invoice Fixtures

on:
  workflow_dispatch:
  push:
    branches:
      - feat/invoice-template-router
    paths:
      - '.github/workflows/invoice-fixture-snapshot.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download public benchmark fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/invoice-fixtures
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, time
          m=json.loads(pathlib.Path("benchmarks/invoice_handwriting/public_cases.json").read_text())
          out=pathlib.Path("/tmp/invoice-fixtures")
          for case in m["cases"]:
              u=case["image_url"]
              ext=pathlib.Path(urllib.parse.urlparse(u).path).suffix.lower()
              if ext not in {".jpg",".jpeg",".png",".webp"}:
                  ext=".img"
              dest=out/(case["id"]+ext)
              last=None
              for n in range(3):
                  try:
                      req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 invoice-fixture-snapshot/1.0"})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          data=r.read()
                      dest.write_bytes(data)
                      print(case["id"],len(data),dest.name)
                      break
                  except Exception as e:
                      last=e
                      time.sleep(n+1)
              else:
                  raise RuntimeError(f"{case['id']}: {last}")
          PY
      - name: Pin fixture bytes in repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmarks/invoice_handwriting/fixtures
          cp /tmp/invoice-fixtures/* benchmarks/invoice_handwriting/fixtures/
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path("benchmarks/invoice_handwriting/public_cases.json")
          m=json.loads(p.read_text())
          fixture_dir=pathlib.Path("benchmarks/invoice_handwriting/fixtures")
          for case in m["cases"]:
              matches=list(fixture_dir.glob(case["id"]+".*"))
              if len(matches)!=1:
                  raise RuntimeError(f"fixture match for {case['id']}: {matches}")
              case["fixture_path"]=str(matches[0])
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/invoice_handwriting/fixtures benchmarks/invoice_handwriting/public_cases.json
          if git diff --cached --quiet; then
            echo "fixtures already pinned"
          else
            git commit -m "test(invoice): pin public OCR fixture bytes"
            git push origin HEAD:feat/invoice-template-router
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: invoice-public-fixtures
          path: /tmp/invoice-fixtures
          retention-days: 7
