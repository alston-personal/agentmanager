name: Create ArcanaForge Core Bootstrap

on:
  push:
    paths:
      - '.github/workflows/create-arcanaforge-core-bootstrap.yml'

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ensure ArcanaForge private repository using Core Actions identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/view.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/alston-personal/arcanaforge)
          if [ "$status" = 200 ]; then
            python3 - <<'PY'
          import json
          x=json.load(open('/tmp/view.json'))
          assert x.get('full_name') == 'alston-personal/arcanaforge'
          assert x.get('private') is True
          print('arcanaforge_remote=EXISTS_PRIVATE')
          PY
            exit 0
          fi
          test "$status" = 404
          code=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/orgs/alston-personal/repos \
            -d '{"name":"arcanaforge","private":true,"description":"Symbolic collection generator: SymbolicSystem × Subject × Style, initially Tarot + I Ching, packaging outputs for Divination OS"}')
          echo "create_http=$code"
          if [ "$code" != 201 ]; then
            python3 - <<'PY'
          import json
          try:
              x=json.load(open('/tmp/create.json'))
              print('github_error='+str(x.get('message','unknown')))
          except Exception:
              print('github_error=unparseable')
          PY
            exit 3
          fi
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/create.json'))
          assert x.get('full_name') == 'alston-personal/arcanaforge'
          assert x.get('private') is True
          print('arcanaforge_remote=CREATED_PRIVATE')
          PY
