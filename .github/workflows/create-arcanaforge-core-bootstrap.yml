name: Create ArcanaForge Through Oracle Core

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-arcanaforge-core-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: arcanaforge-core-bootstrap
  cancel-in-progress: false

jobs:
  inspect-core:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 3
    steps:
      - name: Identify live Action Relay service boundary
        shell: bash
        run: |
          set -euo pipefail
          pid="$(pgrep -u ubuntu -f 'python3 -m agentos_node.action_relay' | head -n1)"
          echo "relay_pid=$pid"
          echo '=== process ==='
          ps -o user,pid,ppid,args -p "$pid" || true
          ppid="$(ps -o ppid= -p "$pid" | tr -d ' ')"
          ps -o user,pid,ppid,args -p "$ppid" || true
          echo '=== cgroup ==='
          cat "/proc/$pid/cgroup" || true
          echo '=== source visibility ==='
          readlink -f "/proc/$pid/cwd" || true
          ls -l /home/ubuntu/agentmanager/agentos_node/action_relay.py || true
          echo '=== gh config permissions only ==='
          ls -ld /home/ubuntu/.config /home/ubuntu/.config/gh 2>/dev/null || true
          ls -l /home/ubuntu/.config/gh/hosts.yml 2>/dev/null || true
          echo '=== system service candidates ==='
          systemctl list-units --type=service --all --no-pager | grep -Ei 'agentos|relay' || true
          systemctl list-unit-files --type=service --no-pager | grep -Ei 'agentos|relay' || true
