name: Create ArcanaForge Through Oracle Core

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-arcanaforge-core-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: arcanaforge-core-bootstrap
  cancel-in-progress: false

jobs:
  inspect-core:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 3
    steps:
      - name: Verify Action Relay runtime deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'probe_version=2'
          runtime=/home/ubuntu/.local/share/agentos/action-runtime
          unit=/home/ubuntu/.config/systemd/user/agentos-action-relay.service
          echo '=== runtime permissions ==='
          ls -ld /home/ubuntu/.local /home/ubuntu/.local/share /home/ubuntu/.local/share/agentos "$runtime" 2>/dev/null || true
          ls -ld "$runtime/agentos_node" 2>/dev/null || true
          ls -l "$runtime/agentos_node/action_relay.py" 2>/dev/null || true
          echo '=== service restart policy ==='
          grep -E '^(Restart|RestartSec|Type|ExecStart|WorkingDirectory)' "$unit" 2>/dev/null || true
          echo '=== runner write checks ==='
          for p in "$runtime" "$runtime/agentos_node" "$runtime/agentos_node/action_relay.py"; do
            if [ -e "$p" ]; then
              test -w "$p" && echo "writable:$p" || echo "not-writable:$p"
            fi
          done
