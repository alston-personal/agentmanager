name: Create ArcanaForge Through Oracle Core

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-arcanaforge-core-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: arcanaforge-core-bootstrap
  cancel-in-progress: false

jobs:
  inspect-core:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 3
    steps:
      - name: Locate Action Relay service source checkout
        shell: bash
        run: |
          set -euo pipefail
          unit=/home/ubuntu/.config/systemd/user/agentos-action-relay.service
          echo '=== service source selectors ==='
          if [ -r "$unit" ]; then
            grep -E '^(WorkingDirectory|ExecStart|Environment=PYTHONPATH)' "$unit" || true
            ls -l "$unit"
          else
            echo 'unit_not_readable'
          fi
          echo '=== likely source trees ==='
          find /home/ubuntu -maxdepth 4 -type f -path '*/agentos_node/action_relay.py' -print 2>/dev/null | head -n 20 || true
