name: Create ArcanaForge Through Oracle Core

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-arcanaforge-core-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: arcanaforge-core-bootstrap
  cancel-in-progress: true

jobs:
  patch-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add narrow governed ArcanaForge capability
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/patch_action_relay_arcanaforge.py
          python3 -m py_compile agentos_node/action_relay.py
          grep -q 'github.repo.ensure_arcanaforge' agentos_node/action_relay.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agentos_node/action_relay.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat(agentos): add governed ArcanaForge remote action'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  core-create:
    needs: patch-capability
    runs-on: [self-hosted, oracle]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh canonical source to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          grep -q 'github.repo.ensure_arcanaforge' agentos_node/action_relay.py
      - name: Ensure ubuntu Action Relay runtime contains ArcanaForge capability
        shell: bash
        run: |
          set -euo pipefail
          runtime=/home/ubuntu/.local/share/agentos/action-runtime/agentos_node/action_relay.py
          if grep -q 'github.repo.ensure_arcanaforge' "$runtime" 2>/dev/null; then
            echo 'action_runtime_arcanaforge=ALREADY_READY'
            exit 0
          fi
          echo 'action_runtime_arcanaforge=REFRESH_REQUIRED'
          tmp=/tmp/bootstrap-action-relay-arcanaforge-safe.sh
          sed \
            -e 's|RECEIPT="$BRIDGE/$REQUEST_ID.receipt.json"|RECEIPT="/tmp/$REQUEST_ID.receipt.json"|' \
            -e 's|_a_os.chmod(_a_tmp,0o660)|_a_os.chmod(_a_tmp,0o644)|' \
            scripts/bootstrap_action_relay_via_chronos_safe_v2.sh > "$tmp"
          chmod 700 "$tmp"
          bash "$tmp"
          grep -q 'github.repo.ensure_arcanaforge' "$runtime"
          echo 'action_runtime_arcanaforge=READY_AFTER_REFRESH'
      - name: Ask Core Action Relay to create ArcanaForge and require receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ensure_arcanaforge_remote_via_action_relay.py
      - name: Commit governed receipt evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E=.agentos/evidence/arcanaforge-remote-action-relay.txt
          test -f "$E" || exit 0
          cp "$E" /tmp/arcanaforge-remote-action-relay.txt
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .agentos/evidence
          cp /tmp/arcanaforge-remote-action-relay.txt "$E"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$E"
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(arcanaforge): governed Core repository creation'
          git pull --rebase origin main
          git push origin HEAD:main
