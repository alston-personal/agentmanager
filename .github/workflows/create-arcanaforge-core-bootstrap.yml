name: Create ArcanaForge Through Oracle Core

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-arcanaforge-core-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: arcanaforge-core-bootstrap
  cancel-in-progress: false

jobs:
  inspect-core:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 3
    steps:
      - name: Inspect governed Core relay boundary
        shell: bash
        run: |
          set -euo pipefail
          echo '=== identity ==='
          id
          echo '=== relay processes ==='
          ps -eo user=,pid=,args= | grep -E '[a]ction_relay|[a]gentos.*relay' || true
          echo '=== candidate runtime roots ==='
          for p in /home/ubuntu/agentmanager /home/agentos-node/agentmanager /home/ubuntu/.agentos /home/agentos-node/.agentos /var/lib/agentos /run/agentos; do
            if [ -e "$p" ]; then
              ls -ld "$p" || true
            fi
          done
          echo '=== shared relay-like directories ==='
          find /home /var/lib /run -maxdepth 4 -type d \( -name inbox -o -name receipts -o -name processing -o -name quarantine \) -path '*agent*' -print 2>/dev/null | head -n 80 || true
