name: Create ArcanaForge Through Oracle Core

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-arcanaforge-core-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: arcanaforge-core-bootstrap
  cancel-in-progress: true

jobs:
  patch-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add narrow governed ArcanaForge capability
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/patch_action_relay_arcanaforge.py
          python3 -m py_compile agentos_node/action_relay.py
          grep -q 'github.repo.ensure_arcanaforge' agentos_node/action_relay.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agentos_node/action_relay.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat(agentos): add governed ArcanaForge remote action'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  core-create:
    needs: patch-capability
    runs-on: [self-hosted, oracle]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh canonical source to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          grep -q 'github.repo.ensure_arcanaforge' agentos_node/action_relay.py
      - name: Diagnose live Chronos execution path
        shell: bash
        run: |
          set -euo pipefail
          pid="$(pgrep -u ubuntu -f 'scripts/chronos.py' | head -n1)"
          echo "chronos_pid=$pid"
          echo "chronos_cwd=$(readlink -f /proc/$pid/cwd || true)"
          echo '=== chronos groups ==='
          grep '^Groups:' "/proc/$pid/status" || true
          echo '=== chronos cmdline ==='
          tr '\0' ' ' < "/proc/$pid/cmdline"; echo
          echo '=== live schedule selector ==='
          grep -A2 -B1 'swarm-board-refresh' /home/ubuntu/agentmanager/schedule.yaml || true
          echo '=== target metadata ==='
          stat /home/ubuntu/agentmanager/scripts/update_scheduler_board.py || true
          echo '=== recent Chronos triggers ==='
          tail -n 160 /home/ubuntu/agent-data/logs/chronos.log | grep -E 'swarm-board-refresh|Trigger|Chronos' | tail -n 80 || true
      - name: Refresh ubuntu Action Relay runtime through canonical safe Chronos transport
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/bootstrap_action_relay_via_chronos_safe_v2.sh
      - name: Ask Core Action Relay to create ArcanaForge and require receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ensure_arcanaforge_remote_via_action_relay.py
      - name: Commit governed receipt evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E=.agentos/evidence/arcanaforge-remote-action-relay.txt
          test -f "$E" || exit 0
          cp "$E" /tmp/arcanaforge-remote-action-relay.txt
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .agentos/evidence
          cp /tmp/arcanaforge-remote-action-relay.txt "$E"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$E"
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(arcanaforge): governed Core repository creation'
          git pull --rebase origin main
          git push origin HEAD:main
