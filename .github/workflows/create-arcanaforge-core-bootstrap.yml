name: Create ArcanaForge Through Oracle Core

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-arcanaforge-core-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: arcanaforge-core-bootstrap
  cancel-in-progress: false

jobs:
  inspect-core:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 3
    steps:
      - name: Locate live Action Relay module and service controls
        shell: bash
        run: |
          set -euo pipefail
          echo '=== local module resolution ==='
          /usr/bin/python3 - <<'PY'
          import agentos_node.action_relay as m
          print(m.__file__)
          print(sorted(m.ACTIONS))
          PY
          echo '=== module path permissions ==='
          mod=$(/usr/bin/python3 - <<'PY'
          import agentos_node.action_relay as m
          print(m.__file__)
          PY
          )
          ls -l "$mod" || true
          namei -l "$mod" || true
          echo '=== ubuntu user service query ==='
          systemctl --user --machine=ubuntu@ is-active agentos-action-relay.service || true
          systemctl --user --machine=ubuntu@ cat agentos-action-relay.service || true
          echo '=== relay root permissions ==='
          ls -ld /home/ubuntu/agent-data/runtime/action-relay /home/ubuntu/agent-data/runtime/action-relay/{inbox,processing,receipts,quarantine} || true
