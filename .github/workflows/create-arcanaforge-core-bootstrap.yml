name: Create Canonical Repositories Through Oracle Core

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-arcanaforge-core-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: canonical-repo-core-bootstrap
  cancel-in-progress: true

jobs:
  patch-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add narrow governed repository capabilities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/patch_action_relay_arcanaforge.py
          python3 scripts/patch_action_relay_layoutlib.py
          python3 -m py_compile agentos_node/action_relay.py
          grep -q 'github.repo.ensure_arcanaforge' agentos_node/action_relay.py
          grep -q 'github.repo.ensure_layoutlib' agentos_node/action_relay.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agentos_node/action_relay.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat(agentos): add governed canonical repo actions'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  core-create:
    needs: patch-capability
    runs-on: [self-hosted, oracle]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh canonical source to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          grep -q 'github.repo.ensure_arcanaforge' agentos_node/action_relay.py
          grep -q 'github.repo.ensure_layoutlib' agentos_node/action_relay.py
      - name: Ensure ubuntu Action Relay runtime contains canonical repo capabilities
        shell: bash
        run: |
          set -euo pipefail
          runtime=/home/ubuntu/.local/share/agentos/action-runtime/agentos_node/action_relay.py
          if grep -q 'github.repo.ensure_arcanaforge' "$runtime" 2>/dev/null && grep -q 'github.repo.ensure_layoutlib' "$runtime" 2>/dev/null; then
            echo 'action_runtime_repo_capabilities=ALREADY_READY'
            exit 0
          fi
          echo 'action_runtime_repo_capabilities=REFRESH_REQUIRED'
          tmp=/tmp/bootstrap-action-relay-canonical-repos-safe.sh
          sed \
            -e 's|RECEIPT="$BRIDGE/$REQUEST_ID.receipt.json"|RECEIPT="/tmp/$REQUEST_ID.receipt.json"|' \
            -e 's|_a_os.chmod(_a_tmp,0o660)|_a_os.chmod(_a_tmp,0o644)|' \
            scripts/bootstrap_action_relay_via_chronos_safe_v2.sh > "$tmp"
          chmod 700 "$tmp"
          bash "$tmp"
          grep -q 'github.repo.ensure_arcanaforge' "$runtime"
          grep -q 'github.repo.ensure_layoutlib' "$runtime"
          echo 'action_runtime_repo_capabilities=READY_AFTER_REFRESH'
      - name: Ensure ArcanaForge repository
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ensure_arcanaforge_remote_via_action_relay.py
      - name: Ensure LayoutLib repository
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ensure_layoutlib_remote_via_action_relay.py
      - name: Commit governed receipt evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/canonical-repo-evidence
          for f in .agentos/evidence/arcanaforge-remote-action-relay.txt .agentos/evidence/layoutlib-remote-action-relay.txt; do
            [ -f "$f" ] && cp "$f" /tmp/canonical-repo-evidence/
          done
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .agentos/evidence
          cp /tmp/canonical-repo-evidence/* .agentos/evidence/ 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(project): governed canonical repository creation'
          git pull --rebase origin main
          git push origin HEAD:main
