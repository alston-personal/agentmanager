name: Oracle MBPR Install Threads Web DM
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated browser bridge on MBPR
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          cmd=json.load(open('.agentos/commands/mbpr-install-threads-web-dm.json',encoding='utf-8'))
          assert cmd.get('node_id')=='mbpr'
          sha=str(cmd.get('source_commit') or '')
          assert len(sha)==40
          code=("import urllib.request,runpy,tempfile,sys; p=tempfile.mktemp(suffix='.py'); urllib.request.urlretrieve('https://raw.githubusercontent.com/alston-personal/agentmanager/"+sha+"/scripts/install_threads_web_dm_macos.py',p); sys.argv=[p,'--source-commit','"+sha+"']; runpy.run_path(p,run_name='__main__')")
          tid='install-threads-web-dm-mbpr-'+str(int(time.time()))
          store=RealmFabricStore()
          store.queue_task('mbpr',{'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':'python3','argv':['-c',code],'cwd':'/Users/tengweihuang/AgentOS','timeout_seconds':120,'cognition_ids_used':[]})
          for _ in range(75):
              r=store.get_receipt(tid)
              if r:
                  out=str(r.get('stdout') or '')
                  err=str(r.get('stderr') or '')
                  if r.get('ok') is not True or int(r.get('returncode') or 0)!=0 or 'threads_web_dm_install=PASS' not in out:
                      print({'ok':r.get('ok'),'returncode':r.get('returncode'),'stdout':out[-3000:],'stderr':err[-3000:]})
                      raise SystemExit('MBPR Threads bridge install failed')
                  print('mbpr_threads_web_dm_install=PASS')
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('MBPR Threads bridge install receipt timeout')
          PY
