name: Oracle MBPR Install Threads Web DM
on:
  push:
    branches:
      - core/integration
    paths:
      - '.agentos/commands/mbpr-install-threads-web-dm.json'
permissions:
  contents: read
jobs:
  install:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated browser bridge on MBPR
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          cmd=json.load(open('.agentos/commands/mbpr-install-threads-web-dm.json',encoding='utf-8'))
          assert cmd.get('node_id')=='mbpr'
          sha=str(cmd.get('source_commit') or '')
          assert len(sha)==40
          code=f"""from pathlib import Path
import subprocess,venv,urllib.request,os
root=Path.home()/'Library'/'Application Support'/'AgentOS'/'browser-bridge'
venv_dir=root/'venv'
root.mkdir(parents=True,exist_ok=True)
if not (venv_dir/'bin'/'python').exists():
    venv.EnvBuilder(with_pip=True).create(venv_dir)
py=str(venv_dir/'bin'/'python')
subprocess.run([py,'-m','pip','install','-q','--upgrade','pip'],check=True,timeout=120)
subprocess.run([py,'-m','pip','install','-q','--upgrade','git+https://github.com/alston-personal/agentmanager.git@{sha}','playwright'],check=True,timeout=240)
bridge=root/'threads_web_dm_bridge_user.py'
urllib.request.urlretrieve('https://raw.githubusercontent.com/alston-personal/agentmanager/{sha}/scripts/threads_web_dm_bridge_user.py',bridge)
os.chmod(bridge,0o700)
print('threads_web_dm_install=PASS')
"""
          tid='install-threads-web-dm-mbpr-'+str(int(time.time()))
          store=RealmFabricStore()
          store.queue_task('mbpr',{'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':'python3','argv':['-c',code],'cwd':'/Users/tengweihuang/AgentOS','timeout_seconds':120,'cognition_ids_used':[]})
          for _ in range(75):
              r=store.get_receipt(tid)
              if r:
                  out=str(r.get('stdout') or '')
                  err=str(r.get('stderr') or '')
                  if r.get('ok') is not True or int(r.get('returncode') or 0)!=0 or 'threads_web_dm_install=PASS' not in out:
                      print({'ok':r.get('ok'),'returncode':r.get('returncode'),'stdout':out[-3000:],'stderr':err[-3000:]})
                      raise SystemExit('MBPR Threads bridge install failed')
                  print('mbpr_threads_web_dm_install=PASS')
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('MBPR Threads bridge install receipt timeout')
          PY
