name: Social Capability CI

on:
  push:
    branches:
      - feature/realm-node-fabric
    paths:
      - 'agentos_node/social/**'
      - 'agentos_node/social_cli.py'
      - 'tests/test_social_threads_capability.py'
      - 'setup.py'
      - '.github/workflows/social-capability-ci.yml'
  pull_request:
    paths:
      - 'agentos_node/social/**'
      - 'agentos_node/social_cli.py'
      - 'tests/test_social_threads_capability.py'
      - 'setup.py'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e . pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_social_threads_capability.py
      - name: CLI is installed
        run: agentos-social --help >/dev/null
