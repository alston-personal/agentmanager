name: Oracle Deploy Vendor Reputation Service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-deploy-vendor-reputation-service.yml'
      - 'scripts/register_vendor_threads_source.sh'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 12
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      SERVICE_REPO: alston-personal/vendor-reputation-service
      SERVICE_SHA: 42e88fd45bd25ae34bad6ff665b02d582759796a
      SOURCE_URL: https://www.threads.com/share/_yh22msHD/
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Deploy pinned vendor service with canonical evidence only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          test -n "${DEPLOY_USER:-}"
          # Bash must read its program from a regular file, not SSH stdin: nested
          # docker/gh subprocesses may consume stdin and silently truncate the script.
          SCRIPT_FILE=$(mktemp)
          trap 'rm -f "$SCRIPT_FILE"' EXIT
          cat > "$SCRIPT_FILE" <<'REMOTE'
          set -euo pipefail
          REPO="$1"; SHA="$2"
          BASE=/home/ubuntu/vendor-reputation-service
          SECRET=/home/ubuntu/agent-data/secrets/vendor-reputation.env
          PICK=/home/ubuntu/agent-data/runtime/vendor-reputation/threads-DcWVvpwGTSh-normalized-replies.json

          command -v docker >/dev/null
          docker compose version >/dev/null
          /usr/bin/gh auth status >/dev/null

          if [ ! -d "$BASE/.git" ]; then
            rm -rf "$BASE"
            /usr/bin/gh repo clone "$REPO" "$BASE" >/tmp/vendor-service-clone.log 2>&1
          fi
          git -C "$BASE" fetch --depth=1 origin "$SHA" >/tmp/vendor-service-fetch.log 2>&1
          git -C "$BASE" checkout --detach "$SHA" >/tmp/vendor-service-checkout.log 2>&1
          test "$(git -C "$BASE" rev-parse HEAD)" = "$SHA"
          echo 'vendor_release_stage=checkout_verified' >&2

          mkdir -p "$(dirname "$SECRET")"
          if [ ! -s "$SECRET" ]; then
            umask 077
            printf 'VENDOR_DB_PASSWORD=%s\n' "$(openssl rand -hex 32)" > "$SECRET"
          fi
          chmod 600 "$SECRET"
          set -a
          . "$SECRET"
          set +a

          cd "$BASE"
          # Upgrade the existing database before promoting the new API image.
          # Do not rely on docker-entrypoint-initdb.d for persistent volumes.
          docker compose up -d db </dev/null >/tmp/vendor-service-db.log 2>&1
          for i in $(seq 1 40); do
            if docker compose exec -T db pg_isready -U vendor_service -d vendor_reputation </dev/null >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker compose exec -T db pg_isready -U vendor_service -d vendor_reputation >/dev/null
          for migration in 002_source_registry.sql 007_evidence_revisions.sql 008_review_decisions.sql; do
            docker compose exec -T db psql -v ON_ERROR_STOP=1 -U vendor_service -d vendor_reputation \
              < "sql/$migration" >/dev/null
          done
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U vendor_service -d vendor_reputation \
            -Atqc "SELECT COUNT(*) FROM information_schema.columns WHERE table_name='vendor_mentions' AND column_name='review_version'" </dev/null | grep -qx 1
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U vendor_service -d vendor_reputation \
            -Atqc "SELECT COUNT(*) FROM information_schema.tables WHERE table_name='review_decisions'" </dev/null | grep -qx 1
          echo 'vendor_review_schema_migration=PASS' >&2
          docker compose up -d --build </dev/null >/tmp/vendor-service-compose.log 2>&1
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18765/healthz >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18765/healthz >/dev/null

          IMPORT_JSON='{"skipped":true,"reason":"canonical-private-evidence-missing"}'
          if [ -f "$PICK" ]; then
            set +e
            IMPORT_JSON=$(docker compose run --rm -T \
              -v "$PICK:/private-evidence.json:ro" \
              api python /srv/app/scripts/import_private_threads_evidence.py /private-evidence.json </dev/null 2>/tmp/vendor-import.err)
            RC=$?
            set -e
            if [ "$RC" -ne 0 ]; then
              IMPORT_JSON=$(python3 - <<'PY'
          import json
          from pathlib import Path
          e=Path('/tmp/vendor-import.err')
          print(json.dumps({'skipped':True,'reason':'importer-failed','stderr_length':len(e.read_text()) if e.exists() else 0}))
          PY
              )
            fi
          fi

          STATUS=$(curl -fsS http://127.0.0.1:18765/v1/status)
          echo 'vendor_release_stage=api_status_read' >&2
          python3 - "$SHA" "$PICK" "$IMPORT_JSON" "$STATUS" <<'PY'
          import json,sys
          sha,pick,imp,status=sys.argv[1:]
          try: impj=json.loads(imp)
          except Exception: impj={'raw_length':len(imp),'parse_error':True}
          st=json.loads(status)
          print(json.dumps({
            'schema':'milkcat.vendor-service-deploy/v2',
            'source_sha':sha,
            'api_health':True,
            'api_bind':'127.0.0.1:18765',
            'db_bind':'127.0.0.1:55432',
            'private_evidence_filename':pick.rsplit('/',1)[-1],
            'canonical_only_import':True,
            'import':impj,
            'status':st,
            'source_registry_migration':'applied',
            'review_schema_migration':'008-applied',
            'raw_evidence_committed':False,
            'core_modified':False
          },ensure_ascii=False,indent=2))
          PY
          REMOTE
          PAYLOAD=$(base64 -w0 "$SCRIPT_FILE")
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e; stage=\$(mktemp /tmp/vendor-deploy-XXXXXXXX.sh); trap 'rm -f \"\$stage\"' EXIT; printf '%s' '$PAYLOAD' | base64 -d > \"\$stage\"; bash \"\$stage\" '$SERVICE_REPO' '$SERVICE_SHA'" \
            > .agentos/evidence/vendor-service-deploy.json
          test -s .agentos/evidence/vendor-service-deploy.json || { echo 'vendor_release_receipt_empty' >&2; exit 1; }
          python3 -m json.tool .agentos/evidence/vendor-service-deploy.json >/dev/null
          cat .agentos/evidence/vendor-service-deploy.json

      - name: Register monitored Threads sources
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$SERVICE_SHA" "$SOURCE_URL" \
            < scripts/register_vendor_threads_source.sh \
            > .agentos/evidence/vendor-source-register.json
          python3 -m json.tool .agentos/evidence/vendor-source-register.json >/dev/null
          cat .agentos/evidence/vendor-source-register.json
          python3 - <<'PY'
          import json
          x=json.load(open('.agentos/evidence/vendor-source-register.json'))
          assert x['active_sources'] >= 2, x
          assert x['canonical_state'] == 'resolved', x
          assert x['registered_input_alias'] >= 1, x
          assert x['unique_source_objects'] >= 2, x
          assert x['raw_threads_content_emitted'] is False, x
          assert x['core_modified'] is False, x
          PY

      - name: Preserve sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vendor-release-receipts-${{ github.run_id }}
          path: |
            .agentos/evidence/vendor-service-deploy.json
            .agentos/evidence/vendor-source-register.json
          if-no-files-found: error
          retention-days: 30
