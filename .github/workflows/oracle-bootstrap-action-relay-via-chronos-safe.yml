name: Oracle Safe Chronos Transport Bootstrap

# Existing emergency/manual-only transport rescue. Never auto-update a service
# or mutate protected main through evidence commits.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Repair AgentOS transport through existing ubuntu Chronos
        shell: bash
        run: |
          set -euo pipefail
          echo 'emergency_manual_invocation=YES'
          test "$GITHUB_REF_NAME" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          AGENTOS_SOURCE_COMMIT="$GITHUB_SHA" bash scripts/bootstrap_action_relay_via_chronos_safe_v2.sh
