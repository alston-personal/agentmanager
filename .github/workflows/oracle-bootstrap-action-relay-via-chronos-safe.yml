name: Oracle Safe Chronos Transport Bootstrap

# Emergency/manual fallback only. The canonical deterministic Chronos bootstrap
# and Action Relay path is now proven end-to-end, so normal source changes must
# not launch this legacy bridge injector.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Repair AgentOS transport through existing ubuntu Chronos
        shell: bash
        run: |
          set -euo pipefail
          echo 'emergency_manual_invocation=YES'
          bash scripts/bootstrap_action_relay_via_chronos_safe_v2.sh

      - name: Commit safe bootstrap evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E=.agentos/evidence/action-relay-chronos-safe-bootstrap-v2.txt
          test -f "$E" || exit 0
          cp "$E" /tmp/action-relay-chronos-safe-bootstrap-v2.txt
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .agentos/evidence
          cp /tmp/action-relay-chronos-safe-bootstrap-v2.txt "$E"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$E"
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(agentos): safe Chronos transport bootstrap v2'
          git push origin HEAD:main
