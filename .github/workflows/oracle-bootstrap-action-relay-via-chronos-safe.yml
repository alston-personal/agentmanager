name: Oracle Safe Chronos Transport Bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-bootstrap-action-relay-via-chronos-safe.yml'
      - 'scripts/bootstrap_action_relay_via_chronos_safe.sh'
      - 'scripts/repair_antigravity_relay_user.sh'
      - 'scripts/install_action_relay_user.sh'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Repair AgentOS transport through existing ubuntu Chronos
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/bootstrap_action_relay_via_chronos_safe.sh

      - name: Commit safe bootstrap evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E=.agentos/evidence/action-relay-chronos-safe-bootstrap.txt
          test -f "$E" || exit 0
          cp "$E" /tmp/action-relay-chronos-safe-bootstrap.txt
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .agentos/evidence
          cp /tmp/action-relay-chronos-safe-bootstrap.txt "$E"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$E"
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(agentos): safe Chronos transport bootstrap'
          git push origin HEAD:main
