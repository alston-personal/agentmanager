name: Oracle Diagnose Threads Classification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-diagnose-threads-classification.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect classifier execution boundary without leaking evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/threads-classification-diagnostic.json
          python3 - <<'PY' > "$OUT"
          import hashlib, json, os, time
          from pathlib import Path
          from datetime import datetime, timezone

          RELAY=Path('/home/ubuntu/agent-data/runtime/antigravity-relay')
          OUTPUT=Path('/home/ubuntu/agent-data/runtime/vendor-reputation/threads-DcWVvpwGTSh-vendor-candidates.json')
          INPUT=Path('/home/ubuntu/agent-data/runtime/vendor-reputation/threads-DcWVvpwGTSh-normalized-replies.json')

          def file_meta(p):
              if not p.exists(): return {'exists':False}
              st=p.stat()
              return {
                  'exists':True,
                  'owner_uid':st.st_uid,
                  'group_gid':st.st_gid,
                  'mode':oct(st.st_mode & 0o777),
                  'size_bytes':st.st_size,
                  'runner_can_read':os.access(p,os.R_OK),
                  'runner_can_write':os.access(p,os.W_OK),
              }

          now=time.time(); receipts=[]
          safe_terms={
              'permission_denied':'permission denied',
              'timed_out_text':'timed out',
              'timeout_text':'timeout',
              'not_found':'not found',
              'no_such_file':'no such file',
              'invalid_argument':'invalid argument',
              'workspace':'workspace',
              'json':'json',
              'read':'read',
              'write':'write',
          }
          for p in (RELAY/'receipts').glob('*.json'):
              try:
                  st=p.stat()
                  if now-st.st_mtime > 1200: continue
                  d=json.loads(p.read_text(encoding='utf-8'))
                  stderr=str(d.get('stderr') or '')
                  receipts.append({
                      'file':p.name,
                      'mtime_utc':datetime.fromtimestamp(st.st_mtime,timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
                      'ok':d.get('ok'),
                      'executor':d.get('executor') if isinstance(d.get('executor'),str) else None,
                      'executor_user':d.get('executor_user'),
                      'returncode':d.get('returncode'),
                      'timed_out':d.get('timed_out'),
                      'stdout_present':bool(d.get('stdout')),
                      'stderr_present':bool(stderr),
                      'stderr_length':len(stderr),
                      'stderr_sha256_16':hashlib.sha256(stderr.encode()).hexdigest()[:16] if stderr else None,
                      'stderr_signals':{k:(v in stderr.lower()) for k,v in safe_terms.items()},
                  })
              except Exception:
                  continue
          receipts.sort(key=lambda x:x['mtime_utc'],reverse=True)

          output_meta=file_meta(OUTPUT)
          if OUTPUT.is_file():
              try:
                  data=json.loads(OUTPUT.read_text(encoding='utf-8'))
                  ev=data.get('evidence') or []
                  output_meta.update({
                      'valid_json':True,
                      'schema':data.get('schema'),
                      'evidence_records':len(ev),
                      'all_pending':all(e.get('review_status')=='pending' for e in ev),
                      'records_with_mentions':sum(1 for e in ev if e.get('vendor_mentions')),
                  })
              except Exception as e:
                  output_meta.update({'valid_json':False,'parse_error_type':type(e).__name__})

          result={
              'schema':'agentos.threads-classification-diagnostic/v2',
              'checked_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'runner_uid':os.geteuid(),
              'runner_gid':os.getegid(),
              'input':file_meta(INPUT),
              'output':output_meta,
              'recent_receipts':receipts[:8],
              'private_text_exposed':False,
              'vendor_names_exposed':False,
          }
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          python3 -m json.tool "$OUT" >/dev/null
          cat "$OUT"
      - name: Commit sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/threads-classification-diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(vendors): Threads classification boundary diagnostic'
          git push
