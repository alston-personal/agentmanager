name: LCCB Fixed Model Oracle Experiment

on:
  push:
    branches: [feature/state-kernel-v2]
    paths:
      - ".agentos/triggers/lccb-fixed-model-oracle"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  statuses: write

concurrency:
  group: lccb-fixed-model-oracle-ssh
  cancel-in-progress: false

jobs:
  fixed-model-series:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      EXPERIMENT_SHA: ${{ github.sha }}
      CONFIG_ROOT: ${{ vars.AGENTOS_CONFIG_ROOT || '/home/ubuntu/agentmanager' }}
      LCCB_MODEL_NAME: gemini-3.1-flash-lite

    steps:
      - name: Publish execution start receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "agentos/lccb-fixed-model",
              "description": "Oracle SSH LCCB execution started",
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - name: Record execution coordination receipt
        shell: bash
        run: |
          set -euo pipefail
          echo "transport=github-hosted-ssh-to-oracle"
          echo "series=meridian-fixed-model-73129"
          echo "sha=${EXPERIMENT_SHA}"
          echo "run_id=${GITHUB_RUN_ID}"

      - name: Cancel superseded queued self-hosted recovery runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 32576122422 32580465338 32580494643; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true)
            echo "cancel_run_${run_id}_http=${code}"
          done

      - name: Validate Oracle SSH route
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Execute frozen LCCB series on isolated Oracle workspace
        shell: bash
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$EXPERIMENT_SHA" "$GITHUB_RUN_ID" "$CONFIG_ROOT" "$LCCB_MODEL_NAME" <<'REMOTE'
          set -euo pipefail
          EXPERIMENT_SHA="$1"
          RUN_ID="$2"
          CONFIG_ROOT="$3"
          MODEL="$4"
          WORK="/tmp/agentos-lccb-${RUN_ID}"
          REPO_URL="https://github.com/alston-personal/agentmanager.git"

          rm -rf "$WORK"
          mkdir -p "$WORK"
          git clone --quiet "$REPO_URL" "$WORK/repo"
          git -C "$WORK/repo" fetch --quiet origin "$EXPERIMENT_SHA"
          git -C "$WORK/repo" checkout --quiet --detach "$EXPERIMENT_SHA"
          cd "$WORK/repo"

          test -f "$CONFIG_ROOT/.env" || { echo "Missing Oracle provider configuration" >&2; exit 21; }
          set -a
          source "$CONFIG_ROOT/.env"
          [ -f "$HOME/.agentos.secrets" ] && source "$HOME/.agentos.secrets"
          set +a
          test -n "${AI_API_BASE_URL:-}" || { echo "Missing provider base URL" >&2; exit 22; }
          test -n "${AI_API_ACADEMIA_KEY:-}" || { echo "Missing provider credential" >&2; exit 23; }
          export LCCB_BASE_URL="$AI_API_BASE_URL"
          export LCCB_API_KEY="$AI_API_ACADEMIA_KEY"
          export LCCB_MODEL="$MODEL"

          rm -rf artifacts/lccb-meridian
          python3 scripts/build_lccb_synthetic_pack.py --output artifacts/lccb-meridian --seed 73129 --events 1000
          python3 scripts/discover_agentos_node.py --node-id oracle-agentos-node-01 --realm-id personal --profile edge --output artifacts/lccb-capability-manifest.json >/dev/null

          python3 - <<'PY'
          import json, pathlib, platform, socket, subprocess, sys
          payload = {
              "schema_version": "agentos.lccb-environment/v1",
              "hostname": socket.gethostname(),
              "platform": platform.platform(),
              "machine": platform.machine(),
              "python": sys.version.split()[0],
              "git_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "execution_transport": "github-hosted-ssh-to-oracle",
          }
          pathlib.Path("artifacts/lccb-environment.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          chmod 000 artifacts/lccb-meridian/private/labels.jsonl
          restore_labels() { chmod 600 artifacts/lccb-meridian/private/labels.jsonl 2>/dev/null || true; }
          trap restore_labels EXIT
          python3 scripts/run_lccb_openai_compatible.py --pack artifacts/lccb-meridian --output artifacts/lccb-raw-responses.jsonl --stages 0,100,1000 --temperature 0 --repeat 3
          restore_labels
          trap - EXIT

          python3 scripts/score_lccb_responses.py --pack artifacts/lccb-meridian --responses artifacts/lccb-raw-responses.jsonl --output artifacts/lccb-scored-results.json

          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path("artifacts/lccb-meridian")
          def sha(path): return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          manifest = {
              "schema_version": "agentos.lccb-series-manifest/v2",
              "series": "meridian-fixed-model-73129",
              "git_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "provider_family": "openai-compatible",
              "model": os.environ["LCCB_MODEL"],
              "seed": 73129,
              "events": 1000,
              "stages": [0, 100, 1000],
              "repeat": 3,
              "temperature": 0,
              "evaluator_blind_during_model_execution": True,
              "pack_manifest_sha256": sha(root / "manifest.json"),
              "experience_sha256": sha(root / "public" / "experience.jsonl"),
              "tasks_sha256": sha(root / "public" / "tasks.jsonl"),
              "private_labels_sha256": sha(root / "private" / "labels.jsonl"),
              "runner_policy_sha256": sha("research/lccb_openai_compatible.py"),
              "runner_cli_sha256": sha("scripts/run_lccb_openai_compatible.py"),
              "capability_manifest_sha256": sha("artifacts/lccb-capability-manifest.json"),
              "environment_sha256": sha("artifacts/lccb-environment.json"),
              "raw_responses_sha256": sha("artifacts/lccb-raw-responses.jsonl"),
              "scored_results_sha256": sha("artifacts/lccb-scored-results.json"),
          }
          pathlib.Path("artifacts/lccb-series-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("experiment_manifest_sha256=" + sha("artifacts/lccb-series-manifest.json"))
          PY

          tar -czf "$WORK/evidence.tar.gz" artifacts/lccb-meridian/manifest.json artifacts/lccb-capability-manifest.json artifacts/lccb-environment.json artifacts/lccb-raw-responses.jsonl artifacts/lccb-scored-results.json artifacts/lccb-series-manifest.json
          echo "oracle_lccb_execution=completed"
          REMOTE

      - name: Retrieve preserved evidence from Oracle
        shell: bash
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-22}"
          mkdir -p artifacts/lccb-evidence
          scp -q -P "$PORT" "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/agentos-lccb-${GITHUB_RUN_ID}/evidence.tar.gz" artifacts/lccb-evidence/evidence.tar.gz
          tar -xzf artifacts/lccb-evidence/evidence.tar.gz -C .

      - name: Verify evidence hashes locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          manifest = json.loads(pathlib.Path("artifacts/lccb-series-manifest.json").read_text())
          checks = {
              "pack_manifest_sha256": "artifacts/lccb-meridian/manifest.json",
              "capability_manifest_sha256": "artifacts/lccb-capability-manifest.json",
              "environment_sha256": "artifacts/lccb-environment.json",
              "raw_responses_sha256": "artifacts/lccb-raw-responses.jsonl",
              "scored_results_sha256": "artifacts/lccb-scored-results.json",
          }
          for key, path in checks.items():
              actual = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              if actual != manifest[key]:
                  raise SystemExit(f"hash mismatch: {key}")
          print("evidence_hash_verification=pass")
          PY

      - name: Upload preserved experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: lccb-fixed-model-meridian-73129
          path: |
            artifacts/lccb-meridian/manifest.json
            artifacts/lccb-capability-manifest.json
            artifacts/lccb-environment.json
            artifacts/lccb-raw-responses.jsonl
            artifacts/lccb-scored-results.json
            artifacts/lccb-series-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish terminal execution receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          export RECEIPT_STATE="failure"
          export RECEIPT_DESC="Oracle SSH LCCB execution failed"
          if [ "$JOB_STATUS" = "success" ]; then
            RECEIPT_STATE="success"
            RECEIPT_DESC="Oracle SSH LCCB evidence preserved and verified"
          fi
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "state": os.environ["RECEIPT_STATE"],
              "context": "agentos/lccb-fixed-model",
              "description": os.environ["RECEIPT_DESC"][:140],
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - name: Clean isolated Oracle workspace
        if: always()
        shell: bash
        run: |
          set +e
          PORT="${DEPLOY_SSH_PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" "rm -rf '/tmp/agentos-lccb-${GITHUB_RUN_ID}'" >/dev/null 2>&1
          exit 0
