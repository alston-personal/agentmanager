name: Capture vopc5750 Live Discovery

on:
  push:
    branches:
      - feature/realm-node-fabric-readiness
    paths:
      - .github/workflows/vopc5750-live-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
    steps:
      - uses: actions/checkout@v4
      - name: Queue live surface discovery
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time
          from agent_core.realm_fabric import RealmFabricStore

          node_id = 'vopc5750'
          task_id = 'live-discovery-' + str(int(time.time()))
          task = {
              'schema': 'agentos.node-task/v0.1',
              'task_id': task_id,
              'action': 'agent.surface.inspect',
              'cognition_ids_used': [],
          }
          store = RealmFabricStore()
          store.queue_task(node_id, task)
          print('discovery_task_id=' + task_id)
          for _ in range(45):
              receipt = store.get_receipt(task_id)
              if receipt:
                  print('DISCOVERY_RECEIPT=' + json.dumps(receipt, ensure_ascii=False, sort_keys=True))
                  if receipt.get('ok') is not True:
                      raise SystemExit('live discovery failed')
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('NO_DISCOVERY_RECEIPT_WITHIN_90S')
          PY
