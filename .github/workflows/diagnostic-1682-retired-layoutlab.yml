name: Diagnostic 1682 Retired LayoutLab Carrier
on:
  pull_request:
    paths:
      - 'scripts/deploy_layoutlab_official_v2.py'
      - '.github/workflows/diagnostic-1682-retired-layoutlab.yml'
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile scripts/deploy_layoutlab_official_v2.py
      - name: Assert retired carrier cannot publish
        run: |
          set +e
          python scripts/deploy_layoutlab_official_v2.py > /tmp/retired-layoutlab-output.txt 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q 'RETIRED:' /tmp/retired-layoutlab-output.txt
          grep -q 'no longer has deployment authority' /tmp/retired-layoutlab-output.txt
