name: Oracle Probe Mio Any-Item Try-On

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/tryon_render_worker.py'
      - '.github/workflows/oracle-probe-mio-any-item-tryon.yml'

permissions:
  contents: read

concurrency:
  group: oracle-mio-any-item-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Probe real NET shoe through hybrid renderer
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          RUN_ID="$1"
          WORKER="$HOME/.local/bin/agentos-mio-tryon-render-worker.py"

          # The deploy workflow runs independently. Wait until this mainline generation
          # is actually installed before probing it.
          INSTALLED=0
          TOKEN_ENV="$HOME/.config/agentos/mio-tryon.env"
          for i in $(seq 1 90); do
            TOKEN_READY=0
            if [ -s "$TOKEN_ENV" ] && grep -Eq '^(HF_TOKEN|HUGGINGFACE_TOKEN)=.+' "$TOKEN_ENV"; then
              TOKEN_READY=1
            fi
            if [ -s "$WORKER" ] \
              && grep -Fq 'inference_provider_reference_try_on' "$WORKER" \
              && [ "$TOKEN_READY" -eq 1 ]; then
              INSTALLED=1
              break
            fi
            echo "mio_any_item_waiting_for_worker_and_token poll=$i"
            sleep 2
          done
          test "$INSTALLED" -eq 1

          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user is-active agentos-mio-tryon-render-worker.service
          echo "mio_any_item_hf_token_configured=yes"

          ROOT="$HOME/agent-data/projects/dressup-simulator"
          JOB_DIR="$ROOT/render_jobs/runtime"
          ASSET_DIR="$ROOT/render_assets"
          JOB_ID="mio-shoe-live-e2e-$RUN_ID"
          JOB="$JOB_DIR/$JOB_ID.json"
          ASSET="$ASSET_DIR/$JOB_ID.webp"
          mkdir -p "$JOB_DIR" "$ASSET_DIR"
          rm -f "$JOB" "$ASSET"

          python3 - "$JOB" "$JOB_ID" <<'PY'
          import json, pathlib, sys
          from datetime import datetime, timezone
          path=pathlib.Path(sys.argv[1]); job_id=sys.argv[2]
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          job={
            "schema":"agentos.tryon-render-job/v1",
            "jobId":job_id,
            "characterId":"sunlake-milkcat-ai-001",
            "characterVersion":"mio-body-v1",
            "view":"front",
            "pose":"neutral_standing",
            "status":"queued",
            "requestedAt":now,
            "startedAt":None,
            "completedAt":None,
            "failedAt":None,
            "supersededBy":None,
            "input":{
              "baseBodyAsset":"/personas/mio/mio-base-v2.webp",
              "layerOrder":["shoes"],
              "selectedLayers":{
                "shoes":{
                  "garmentId":"net-40832-002",
                  "name":"防潑水帆布鞋",
                  "layer":"shoes",
                  "sourceImageUrl":"https://m.net-fashion.net/product/735479"
                }
              }
            },
            "output":{"asset":None,"previewAsset":None,"width":None,"height":None},
            "error":None
          }
          path.write_text(json.dumps(job,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          path.chmod(0o600)
          PY

          OK=0
          for i in $(seq 1 180); do
            STATE=$(python3 - "$JOB" <<'PY'
          import json,sys
          try:
              print(json.load(open(sys.argv[1],encoding='utf-8')).get('status','missing'))
          except Exception:
              print('missing')
          PY
          )
            echo "mio_any_item_shoe_state=$STATE poll=$i"
            if [ "$STATE" = ready ]; then
              python3 - "$JOB" "$ASSET" <<'PY'
          import json, pathlib, sys
          job=json.load(open(sys.argv[1],encoding='utf-8'))
          asset=pathlib.Path(sys.argv[2])
          output=job.get('output') or {}
          rendered=output.get('renderedLayers') or []
          pending=output.get('pendingLayers') or []
          providers=output.get('providerOutputs') or []
          assert 'shoes' in rendered, f'shoes_not_rendered:{rendered}'
          assert 'shoes' not in pending, f'shoes_still_pending:{pending}'
          assert asset.exists() and asset.stat().st_size > 1000, 'shoe_asset_missing'
          shoe_provider=next((row for row in providers if row.get('layer')=='shoes'), None)
          assert shoe_provider, f'shoe_provider_missing:{providers}'
          print('mio_any_item_shoe_e2e=PASS')
          print('mio_any_item_shoe_bytes='+str(asset.stat().st_size))
          print('mio_any_item_provider='+str(shoe_provider.get('providerSpace')))
          PY
              OK=1
              break
            fi
            if [ "$STATE" = failed ]; then
              cat "$JOB"
              journalctl --user -u agentos-mio-tryon-render-worker.service -n 120 --no-pager || true
              break
            fi
            sleep 2
          done
          test "$OK" -eq 1
          REMOTE
