name: Oracle Antigravity Image Inspect Probe

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/oracle-antigravity-image-inspect-probe.yml'
      - 'scripts/probe_antigravity_image_inspect_user.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Run exact read-only image probe
        shell: bash
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:scripts/probe_antigravity_image_inspect_user.py" > "$RUNNER_TEMP/probe.py"
          scp -o StrictHostKeyChecking=accept-new -P "${DEPLOY_SSH_PORT:-22}" "$RUNNER_TEMP/probe.py" "${DEPLOY_USER}@${ORACLE_HOST}:/tmp/probe-antigravity-image.py"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" \
            'chmod 700 /tmp/probe-antigravity-image.py && python3 /tmp/probe-antigravity-image.py'

