name: Oracle Ensure Studio Web Remote via Action Relay

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-ensure-studio-web-remote-action-relay.yml'
      - 'scripts/ensure_studio_web_remote_via_action_relay.py'
      - 'agentos_node/action_relay.py'

permissions:
  contents: write

jobs:
  ensure:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Ensure private Studio Web remote through deterministic Action Relay
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ensure_studio_web_remote_via_action_relay.py
      - name: Commit evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E=.agentos/evidence/studio-web-remote-action-relay.txt
          test -f "$E" || exit 0
          cp "$E" /tmp/studio-web-remote-action-relay.txt
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .agentos/evidence
          cp /tmp/studio-web-remote-action-relay.txt "$E"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$E"
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(studio-web): deterministic remote boundary'
          git push origin HEAD:main
