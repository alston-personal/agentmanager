name: Oracle Mio Routine Publish

on:
  workflow_dispatch:
    inputs:
      expected_post_key:
        description: 'Exact preapproved Mio post key; never provide post text or credentials here'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/integration
          persist-credentials: false
      - name: Preflight bounded Mio publisher
        shell: bash
        env:
          EXPECTED_POST_KEY: ${{ inputs.expected_post_key }}
        run: |
          set -euo pipefail
          test "$(id -un)" = 'agentos-node'
          python3 -m py_compile agentos_node/bootstrap_control.py scripts/publish_mio_routine_post_user.py
          bash -n scripts/publish_mio_routine_post_user.sh
          [[ "$EXPECTED_POST_KEY" =~ ^mio-[a-zA-Z0-9-]{1,86}$ ]]
          test -f /home/ubuntu/agent-data/runtime/social/persona/sunlake-milkcat/approved-post.json
          python3 - "$EXPECTED_POST_KEY" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path('/home/ubuntu/agent-data/runtime/social/persona/sunlake-milkcat/approved-post.json')
          if path.stat().st_mode & 0o077: raise SystemExit('intent_permissions_invalid')
          intent=json.loads(path.read_text(encoding='utf-8'))
          if intent.get('post_key')!=sys.argv[1]: raise SystemExit('intent_post_key_mismatch')
          print('mio_publish_intent_preflight=PASS')
          PY
      - name: Install fixed reviewed publisher and enqueue governed request
        shell: bash
        env:
          EXPECTED_POST_KEY: ${{ inputs.expected_post_key }}
        run: |
          set -euo pipefail
          LIVE=/home/ubuntu/agentmanager
          ROOT=/tmp/agentos-bootstrap-control
          REQUESTS="$ROOT/requests"
          RECEIPTS="$ROOT/receipts"
          test -d "$REQUESTS" && test -d "$RECEIPTS"
          test "$(stat -c '%U' "$REQUESTS")" = ubuntu
          test "$(stat -c '%a' "$REQUESTS")" = 1777
          install -m 0664 agentos_node/bootstrap_control.py "$LIVE/agentos_node/bootstrap_control.py"
          install -m 0755 scripts/publish_mio_routine_post_user.sh "$LIVE/scripts/publish_mio_routine_post_user.sh"
          install -m 0644 scripts/publish_mio_routine_post_user.py "$LIVE/scripts/publish_mio_routine_post_user.py"
          python3 -m py_compile "$LIVE/agentos_node/bootstrap_control.py" "$LIVE/scripts/publish_mio_routine_post_user.py"
          REQUEST_ID="mio-publish-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          REQUEST="$REQUESTS/$REQUEST_ID.request.json"
          RECEIPT="$RECEIPTS/$REQUEST_ID.json"
          python3 - "$REQUEST" "$REQUEST_ID" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          from datetime import datetime,timezone
          from pathlib import Path
          path=Path(sys.argv[1])
          payload={'schema':'agentos.bootstrap-request/v1','request_id':sys.argv[2],
             'action':'agentos.social_threads_mio_routine.publish',
             'created_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
             'params':{'source_commit':sys.argv[3]},
             'authority':{'source':'github-actions','target_user':'ubuntu','arbitrary_shell':False}}
          tmp=path.with_suffix('.tmp')
          tmp.write_text(json.dumps(payload,sort_keys=True)+'\n',encoding='utf-8')
          os.chmod(tmp,0o644);tmp.replace(path)
          PY
          for i in $(seq 1 300); do [ -f "$RECEIPT" ] && break; sleep 1; done
          test -f "$RECEIPT" || { echo 'mio_publish_receipt=TIMEOUT'; exit 3; }
          python3 - "$RECEIPT" "$GITHUB_SHA" <<'PY'
          import json,sys
          receipt=json.load(open(sys.argv[1],encoding='utf-8'))
          assert receipt.get('schema')=='agentos.bootstrap-receipt/v1'
          assert receipt.get('action')=='agentos.social_threads_mio_routine.publish'
          assert receipt.get('executor_uid')==1001
          assert receipt.get('source_commit')==sys.argv[2]
          assert receipt.get('ok') is True
          lines='\n'.join(str(step.get('stdout','')) for step in receipt.get('steps',[])).splitlines()
          assert any(line in ('mio_publish=PASS','mio_publish=ALREADY_RECORDED') for line in lines)
          for line in lines:
            if line.startswith(('mio_publish=','mio_publish_object_id=','mio_publish_permalink=')):
              print(line)
          print('mio_publish_receipt=PASS')
          PY
