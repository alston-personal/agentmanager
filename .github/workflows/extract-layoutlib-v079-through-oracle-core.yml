name: Extract LayoutLib v0.7.9 Through Oracle Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-layoutlib-v079-through-oracle-core.yml'
      - 'scripts/patch_action_relay_layoutlib_v079_import.py'
      - 'scripts/import_layoutlib_v079_via_action_relay.py'

permissions:
  contents: write

concurrency:
  group: layoutlib-v079-canonical-extraction
  cancel-in-progress: true

jobs:
  patch-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add narrow governed LayoutLib v0.7.9 import capability
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/patch_action_relay_layoutlib_v079_import.py
          python3 -m py_compile agentos_node/action_relay.py
          grep -q 'github.repo.import_layoutlib_v079' agentos_node/action_relay.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agentos_node/action_relay.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat(agentos): enable governed LayoutLib v0.7.9 import'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  core-import:
    needs: patch-capability
    runs-on: [self-hosted, oracle]
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh canonical source to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          grep -q 'github.repo.import_layoutlib_v079' agentos_node/action_relay.py
          python3 -m py_compile agentos_node/action_relay.py

      - name: Refresh ubuntu governed Action Relay runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime=/home/ubuntu/.local/share/agentos/action-relay-runtime/agentos_node/action_relay.py
          if grep -q 'github.repo.import_layoutlib_v079' "$runtime" 2>/dev/null; then
            echo 'action_relay_runtime_import=ALREADY_READY'
            exit 0
          fi
          tmp=/tmp/bootstrap-action-relay-layoutlib-v079-safe.sh
          sed \
            -e 's|RECEIPT="$BRIDGE/$REQUEST_ID.receipt.json"|RECEIPT="/tmp/$REQUEST_ID.receipt.json"|' \
            -e 's|_a_os.chmod(_a_tmp,0o660)|_a_os.chmod(_a_tmp,0o644)|' \
            scripts/bootstrap_action_relay_via_chronos_safe_v2.sh > "$tmp"
          chmod 700 "$tmp"
          bash "$tmp"
          grep -q 'github.repo.import_layoutlib_v079' "$runtime"
          echo 'action_relay_runtime_import=READY_AFTER_REFRESH'

      - name: Import fixed production snapshot through Core Action Relay
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/import_layoutlib_v079_via_action_relay.py

      - name: Commit governed extraction receipt evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E=.agentos/evidence/layoutlib-v079-import-action-relay.txt
          test -f "$E" || exit 0
          cp "$E" /tmp/layoutlib-v079-import-action-relay.txt
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .agentos/evidence
          cp /tmp/layoutlib-v079-import-action-relay.txt "$E"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$E"
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(layoutlib): canonical v0.7.9 extraction receipt'
          git pull --rebase origin main
          git push origin HEAD:main
