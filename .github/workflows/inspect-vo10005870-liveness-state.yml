name: Inspect VO10005870 Liveness State

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/inspect-vo10005870-liveness-state.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect daemon PID liveness and watchdog action
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          f=RealmFabricStore()
          tid='inspect-liveness-state-20261002-1455'
          ps=r'''$ErrorActionPreference='Stop'
          $procs=Get-CimInstance Win32_Process |
            Where-Object { $_.Name -eq 'python.exe' -and $_.CommandLine -match '-m agentos_node\.client_cli run' } |
            Select-Object ProcessId,ParentProcessId,CreationDate,CommandLine
          $live=Join-Path $env:LOCALAPPDATA 'AgentOS\state\daemon-liveness.json'
          $hb=Join-Path $env:LOCALAPPDATA 'AgentOS\state\heartbeat-lease.json'
          $wa=(Get-ScheduledTask -TaskName 'AgentOS Thin Client Watchdog').Actions | Select-Object Execute,Arguments
          Write-Output ('PROCS='+($procs|ConvertTo-Json -Compress))
          Write-Output ('LIVENESS_EXISTS='+(Test-Path $live))
          if(Test-Path $live){Write-Output ('LIVENESS='+(Get-Content -Raw -LiteralPath $live).Trim()); Write-Output ('LIVENESS_MTIME='+((Get-Item $live).LastWriteTimeUtc.ToString('o')))}
          if(Test-Path $hb){Write-Output ('HEARTBEAT='+(Get-Content -Raw -LiteralPath $hb).Trim()); Write-Output ('HEARTBEAT_MTIME='+((Get-Item $hb).LastWriteTimeUtc.ToString('o')))}
          Write-Output ('WATCHDOG_ACTION='+($wa|ConvertTo-Json -Compress))'''
          if f.get_receipt(tid) is None:
              f.queue_task('VO10005870',{
                  'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec',
                  'executable':'powershell','argv':['-NoProfile','-NonInteractive','-Command',ps],
                  'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':20,
                  'cognition_ids_used':['demo://liveness-v2-debug/20261002'],
              })
          for _ in range(35):
              r=f.get_receipt(tid)
              if r is not None:
                  print(json.dumps(r,ensure_ascii=False,separators=(',',':')))
                  assert r.get('ok') is True and int(r.get('returncode') or 0)==0, r
                  break
              time.sleep(1)
          else:
              raise SystemExit('inspect_receipt_missing')
          PY
          REMOTE
