name: Validate Continuation State

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/continuation_state.py'
      - 'tests/test_continuation_state.py'
      - '.agent/rules/COMPRESSION_PROMPT.md'
      - '.agent/skills/cognitive_growth/SKILL.md'
      - '.github/workflows/validate-continuation-state.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/continuation_state.py'
      - 'tests/test_continuation_state.py'
      - '.agent/rules/COMPRESSION_PROMPT.md'
      - '.agent/skills/cognitive_growth/SKILL.md'
      - '.github/workflows/validate-continuation-state.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run executable self-test
        run: python3 scripts/continuation_state.py --self-test
      - name: Run continuation regression suite
        run: python3 -m unittest tests.test_continuation_state -v
