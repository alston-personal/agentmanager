name: Oracle Deploy Milkcat Usage Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-deploy-milkcat-usage-dashboard.yml'
      - 'scripts/deploy_dashboard_release.sh'
      - 'dashboard/app/admin/usage/**'
      - 'dashboard/app/api/admin/usage/**'
      - 'dashboard/app/api/auth/**'
      - 'dashboard/lib/fengshui-admin.ts'
      - 'dashboard/lib/tarot-admin.ts'
      - 'dashboard/lib/auth/**'
      - 'dashboard/lib/auth.ts'
      - 'dashboard/next.config.ts'
      - 'dashboard/package.json'
      - 'dashboard/package-lock.json'

permissions:
  contents: read

concurrency:
  group: production-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 22
    env:
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Start existing Oracle SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Build exact Dashboard release, atomically switch PM2, verify or roll back
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_USER"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          PORT="${DEPLOY_PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "$DEPLOY_USER@127.0.0.1" \
            bash -s -- "$SOURCE_SHA" "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          SOURCE_SHA="$1"; RUN_ID="$2"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          TMP="$(mktemp -d /tmp/milkcat-dashboard-source-XXXXXXXX)"
          cleanup() { rm -rf "$TMP"; }
          trap cleanup EXIT

          git clone -q --no-checkout https://github.com/alston-personal/agentmanager.git "$TMP/agentmanager"
          git -C "$TMP/agentmanager" fetch -q --depth=1 origin "$SOURCE_SHA"
          test "$(git -C "$TMP/agentmanager" rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git -C "$TMP/agentmanager" checkout -q --detach "$SOURCE_SHA"
          test "$(git -C "$TMP/agentmanager" rev-parse HEAD)" = "$SOURCE_SHA"
          test -f "$TMP/agentmanager/scripts/deploy_dashboard_release.sh"
          chmod +x "$TMP/agentmanager/scripts/deploy_dashboard_release.sh"
          "$TMP/agentmanager/scripts/deploy_dashboard_release.sh" "$SOURCE_SHA" "$RUN_ID" "$TMP/agentmanager"
          REMOTE
