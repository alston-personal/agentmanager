name: Retired Main Dashboard Deploy Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-deploy-milkcat-usage-dashboard.yml'
      - 'scripts/deploy_dashboard_release.sh'
      - 'dashboard/app/admin/usage/**'
      - 'dashboard/app/api/admin/usage/**'
      - 'dashboard/app/api/auth/**'
      - 'dashboard/app/api/wardrobe/**'
      - 'dashboard/lib/wardrobe-ingest.ts'
      - 'dashboard/data/mio-wardrobe-seed/**'
      - 'dashboard/lib/tryon-jobs.ts'
      - 'dashboard/lib/fengshui-admin.ts'
      - 'dashboard/lib/tarot-admin.ts'
      - 'dashboard/lib/auth/**'
      - 'dashboard/lib/auth.ts'
      - 'dashboard/next.config.ts'
      - 'dashboard/package.json'
      - 'dashboard/package-lock.json'

permissions:
  contents: read

concurrency:
  group: retired-main-dashboard-deploy
  cancel-in-progress: false

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enforce canonical production ownership
        shell: bash
        run: |
          set -euo pipefail
          echo 'main_dashboard_production_owner=RETIRED'
          echo 'canonical_dashboard_production_lane=core/integration'
          echo 'production_mutation=FORBIDDEN'
          echo 'direct_oracle_runner=FORBIDDEN'
          echo 'action_required=merge_or_cherry_pick_dashboard_change_into_core/integration'
          echo 'retired_main_dashboard_deploy_guard=PASS'
