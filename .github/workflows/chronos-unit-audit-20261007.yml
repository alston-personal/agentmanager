name: Chronos Unit Audit 20261007

on:
  push:
    branches:
      - ops/chronos-unit-audit-20261007
    paths:
      - '.github/workflows/chronos-unit-audit-20261007.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 3
    steps:
      - name: Read ubuntu Chronos unit through user bus
        shell: bash
        run: |
          set -u
          export XDG_RUNTIME_DIR=/run/user/1001
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1001/bus
          echo '=== systemctl show ==='
          systemctl --user show os-chronos.service             -p FragmentPath -p WorkingDirectory -p ExecStart -p User -p Group -p Environment 2>&1 || true
          echo '=== systemctl cat ==='
          systemctl --user cat os-chronos.service 2>&1 || true
          echo '=== runtime dir ==='
          stat -c '%n owner=%U:%G mode=%a type=%F' /run/user/1001 /run/user/1001/bus 2>&1 || true
