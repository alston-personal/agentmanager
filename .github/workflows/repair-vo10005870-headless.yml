name: Repair VO10005870 Headless Thin Client

on:
  push:
    branches:
      - fix/windows-headless-thin-client-20261001
    paths:
      - '.github/workflows/repair-vo10005870-headless.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/repair-vo10005870-headless.yml'

permissions:
  contents: read

concurrency:
  group: repair-vo10005870-headless
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Repair headless task through Realm node
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=8 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -p "${DEPLOY_PORT:-22}" \
            "${DEPLOY_USER}@${ORACLE_HOST}" \
            bash -s <<'REMOTE'
          set -euo pipefail
          REPO=/home/ubuntu/agentmanager
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH="$REPO"
          cd "$REPO"

          python3 - <<'PY'
          import json,time
          from agent_core.node_registry import NodeRegistry
          from agent_core.realm_fabric import RealmFabricStore

          node_id='VO10005870'
          nodes=NodeRegistry().node_map().get('nodes') or []
          node=next((n for n in nodes if str(n.get('node_id') or '')==node_id),None)
          if node is None:
              raise SystemExit('node_not_registered')
          status=str(node.get('effective_status') or node.get('status') or '')
          caps=set(node.get('capabilities') or [])
          roots=(node.get('workspace_roots') or {}).get('readable') or []
          print('target_status='+status,flush=True)
          if status!='online':
              raise SystemExit('node_not_online:'+status)
          if 'shell.exec' not in caps:
              raise SystemExit('node_missing_shell_exec')
          if not roots:
              raise SystemExit('node_missing_readable_workspace')
          cwd=str(roots[0])

          fabric=RealmFabricStore()
          repair_id='headless-repair-VO10005870-20261001-v1'
          existing=fabric.get_receipt(repair_id)
          if existing is None:
              ps=r'''$ErrorActionPreference='Stop'
          $install=Join-Path $env:LOCALAPPDATA 'AgentOS'
          $state=Join-Path $install 'state'
          $launcher=Join-Path $install 'agentos-client.cmd'
          $runner=Join-Path $install 'agentos-thin-client-hidden.ps1'
          $log=Join-Path $install 'thin-client.log'
          if(-not (Test-Path -LiteralPath $launcher)){ throw "launcher missing: $launcher" }

          $parentPid=(Get-CimInstance Win32_Process -Filter ("ProcessId=" + $PID)).ParentProcessId
          $parent=Get-CimInstance Win32_Process -Filter ("ProcessId=" + $parentPid) -ErrorAction SilentlyContinue
          $python=[string]$parent.ExecutablePath
          if([string]::IsNullOrWhiteSpace($python) -or (Split-Path $python -Leaf) -notmatch '(?i)^python.*\.exe$'){
            $launcherText=Get-Content -Raw -LiteralPath $launcher
            $m=[regex]::Match($launcherText,'(?m)^"(?<python>[^"]+python[^"]*\.exe)"\s+-m\s+agentos_node\.client_cli\s+%\*$')
            if(-not $m.Success){ throw 'unable to resolve Thin Client Python interpreter' }
            $python=$m.Groups['python'].Value
          }

          $escapedInstall=$install.Replace("'","''")
          $escapedState=$state.Replace("'","''")
          $escapedPython=$python.Replace("'","''")
          $escapedLog=$log.Replace("'","''")
          $runnerBody=@(
            '$ErrorActionPreference=''Stop'''
            ('$env:PYTHONPATH=''' + $escapedInstall + '''')
            ('$env:AGENTOS_CLIENT_HOME=''' + $escapedState + '''')
            ('& ''' + $escapedPython + ''' -m agentos_node.client_cli run *>> ''' + $escapedLog + '''')
            'exit $LASTEXITCODE'
          ) -join [Environment]::NewLine
          $runnerBody | Set-Content -Encoding UTF8 -LiteralPath $runner

          $taskName='AgentOS Thin Client'
          $action=New-ScheduledTaskAction -Execute 'powershell.exe' -Argument ('-NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File "' + $runner + '"') -WorkingDirectory $install
          $trigger=New-ScheduledTaskTrigger -AtLogOn -User $env:USERNAME
          $settings=New-ScheduledTaskSettingsSet -StartWhenAvailable -RestartCount 10 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit ([TimeSpan]::Zero) -Hidden
          Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Settings $settings -Description 'AgentOS Thin Client user-session daemon (headless)' -Force | Out-Null

          $switchName='AgentOS Thin Client Headless Switch'
          $switchPath=Join-Path $install 'agentos-headless-switch.ps1'
          @"
          Start-Sleep -Seconds 12
          Stop-ScheduledTask -TaskName 'AgentOS Thin Client' -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1
          Start-ScheduledTask -TaskName 'AgentOS Thin Client'
          "@ | Set-Content -Encoding UTF8 -LiteralPath $switchPath
          $switchAction=New-ScheduledTaskAction -Execute 'powershell.exe' -Argument ('-NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File "' + $switchPath + '"') -WorkingDirectory $install
          $switchTrigger=New-ScheduledTaskTrigger -Once -At ((Get-Date).AddSeconds(3))
          $switchSettings=New-ScheduledTaskSettingsSet -StartWhenAvailable -ExecutionTimeLimit (New-TimeSpan -Minutes 1) -Hidden
          Register-ScheduledTask -TaskName $switchName -Action $switchAction -Trigger $switchTrigger -Settings $switchSettings -Description 'One-shot AgentOS headless daemon switch' -Force | Out-Null
          Start-ScheduledTask -TaskName $switchName

          $a=(Get-ScheduledTask -TaskName $taskName).Actions | Select-Object -First 1
          if([string]$a.Execute -match '(?i)cmd\.exe$'){ throw 'visible cmd.exe action remains' }
          Write-Output 'headless_definition=PASS'
          '''
              task={
                  'schema':'agentos.node-task/v0.1',
                  'task_id':repair_id,
                  'action':'shell.exec',
                  'executable':'powershell',
                  'argv':['-NoProfile','-NonInteractive','-Command',ps],
                  'cwd':cwd,
                  'timeout_seconds':120,
                  'cognition_ids_used':[],
              }
              fabric.queue_task(node_id,task)
              print('repair_task_queued=PASS',flush=True)
          receipt=existing
          for i in range(60):
              if receipt is not None: break
              time.sleep(2)
              receipt=fabric.get_receipt(repair_id)
          if receipt is None:
              raise SystemExit('repair_receipt_timeout')
          if receipt.get('ok') is not True or int(receipt.get('returncode') or 0)!=0:
              raise SystemExit('repair_failed:'+str(receipt.get('stderr') or receipt.get('error') or '')[-2000:])
          if 'headless_definition=PASS' not in str(receipt.get('stdout') or ''):
              raise SystemExit('repair_missing_pass_marker')
          print('repair_receipt=PASS',flush=True)

          # The repair schedules a delayed restart so its own receipt can be
          # submitted before the old visible daemon is stopped.
          time.sleep(22)

          inspect_id='headless-inspect-VO10005870-20261001-v1'
          existing2=fabric.get_receipt(inspect_id)
          if existing2 is None:
              inspect_ps=r'''$ErrorActionPreference='Stop'
          $t=Get-ScheduledTask -TaskName 'AgentOS Thin Client' -ErrorAction Stop
          $a=$t.Actions | Select-Object -First 1
          $doc=[ordered]@{
            state=[string]$t.State
            execute=[string]$a.Execute
            arguments=[string]$a.Arguments
            hidden=[bool]$t.Settings.Hidden
          }
          $doc | ConvertTo-Json -Compress
          '''
              task2={
                  'schema':'agentos.node-task/v0.1',
                  'task_id':inspect_id,
                  'action':'shell.exec',
                  'executable':'powershell',
                  'argv':['-NoProfile','-NonInteractive','-Command',inspect_ps],
                  'cwd':cwd,
                  'timeout_seconds':60,
                  'cognition_ids_used':[],
              }
              fabric.queue_task(node_id,task2)
              print('inspect_task_queued=PASS',flush=True)
          receipt2=existing2
          for i in range(45):
              if receipt2 is not None: break
              time.sleep(2)
              receipt2=fabric.get_receipt(inspect_id)
          if receipt2 is None:
              raise SystemExit('inspect_receipt_timeout')
          if receipt2.get('ok') is not True or int(receipt2.get('returncode') or 0)!=0:
              raise SystemExit('inspect_failed:'+str(receipt2.get('stderr') or receipt2.get('error') or '')[-2000:])
          raw=str(receipt2.get('stdout') or '').strip()
          doc=json.loads(raw)
          if not str(doc.get('execute') or '').lower().endswith('powershell.exe'):
              raise SystemExit('headless_execute_mismatch:'+raw)
          args=str(doc.get('arguments') or '')
          if '-WindowStyle Hidden' not in args or 'agentos-thin-client-hidden.ps1' not in args:
              raise SystemExit('headless_arguments_mismatch:'+raw)
          if doc.get('hidden') is not True:
              raise SystemExit('headless_task_setting_false:'+raw)
          if str(doc.get('state') or '').lower()!='running':
              raise SystemExit('headless_task_not_running:'+raw)
          print('headless_runtime_verify=PASS')
          print(raw)
          PY
          REMOTE
