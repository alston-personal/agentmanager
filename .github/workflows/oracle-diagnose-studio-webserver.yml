name: Diagnose Studio Web Server

# Existing diagnosis workflow, now bounded to a redacted read-only report.
# Push to main on this migration update runs the initial inspection once.
# Later reruns are manual and do not alter the production host.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/oracle-diagnose-studio-webserver.yml'
      - 'scripts/audit_studio_nginx_redacted.py'
      - 'tests/test_studio_nginx_redacted_audit.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-diagnose-studio-webserver.yml'

permissions:
  contents: read

concurrency:
  group: studio-nginx-readonly-audit
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test redaction and vhost parser in unprivileged PR CI
        run: python3 -m unittest tests.test_studio_nginx_redacted_audit -v

  diagnose:
    needs: [validate]
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect actual Studio vhost and known writers without exporting config
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_studio_nginx_redacted.py > studio-nginx-audit.json
          python3 -m json.tool studio-nginx-audit.json > /dev/null
          echo 'studio_nginx_redacted_report=PASS'
      - name: Upload sanitized audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-nginx-redacted-audit
          path: studio-nginx-audit.json
          if-no-files-found: ignore
          retention-days: 7
