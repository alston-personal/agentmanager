name: Create Canonical Project Repositories With Actions Identity

on:
  push:
    paths:
      - '.github/workflows/create-studio-web-with-actions-identity.yml'

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ensure private repositories using current GitHub Actions identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ensure_repo() {
            local name="$1" description="$2"
            local status code
            status=$(curl -sS -o "/tmp/${name}-view.json" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/alston-personal/${name}")
            if [ "$status" = 200 ]; then
              python3 - "$name" <<'PY'
          import json,sys
          name=sys.argv[1]
          x=json.load(open(f'/tmp/{name}-view.json'))
          assert x.get('full_name') == f'alston-personal/{name}'
          assert x.get('private') is True
          print(f'{name}_remote=EXISTS_PRIVATE')
          PY
              return
            fi
            test "$status" = 404
            python3 - "$name" "$description" > "/tmp/${name}-payload.json" <<'PY'
          import json,sys
          print(json.dumps({'name':sys.argv[1],'private':True,'description':sys.argv[2]}))
          PY
            code=$(curl -sS -o "/tmp/${name}-create.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              https://api.github.com/orgs/alston-personal/repos \
              --data-binary "@/tmp/${name}-payload.json")
            echo "${name}_create_http=$code"
            if [ "$code" != 201 ]; then
              python3 - "$name" <<'PY'
          import json,sys
          name=sys.argv[1]
          try:
              x=json.load(open(f'/tmp/{name}-create.json'))
              print(f'{name}_github_error='+str(x.get('message','unknown')))
          except Exception:
              print(f'{name}_github_error=unparseable')
          PY
              exit 3
            fi
            python3 - "$name" <<'PY'
          import json,sys
          name=sys.argv[1]
          x=json.load(open(f'/tmp/{name}-create.json'))
          assert x.get('full_name') == f'alston-personal/{name}'
          assert x.get('private') is True
          print(f'{name}_remote=CREATED_PRIVATE')
          PY
          }

          ensure_repo 'studio-web' 'Platform web shell and website-owned integrations for studio.milkcat.org'
          ensure_repo 'layoutlib' 'LayoutLib spatial layout library with the Layout Lab reference demo'
