name: Oracle Integrate Vendor Reputation Into Official Site

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-integrate-vendor-reputation.yml'

permissions:
  contents: write

jobs:
  metashield_mvp_rc1_temporary_carrier:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch Chamber Sovereignty Preview RC1 with private-spool compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          RUNTIME=/home/ubuntu/.local/share/agentos/runtime-vnext
          RELAY=/home/ubuntu/agent-data/runtime/antigravity-relay
          export PYTHONPATH="$RUNTIME"
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          from agentos_node.antigravity_relay import AntigravityRelayClient

          cmd=json.loads(Path('.agentos/commands/metashield-mvp-rc1.json').read_text(encoding='utf-8'))
          assert cmd.get('project_id')=='metashield-protocol'
          assert cmd.get('action')=='project.mvp.rc1'
          workspace=Path(str(cmd.get('workspace') or ''))
          assert str(workspace)=='/home/ubuntu/agentmanager/workspace/metashield-protocol'
          assert workspace.is_dir(), workspace

          relay_root=Path('/home/ubuntu/agent-data/runtime/antigravity-relay')
          relay=AntigravityRelayClient(relay_root)
          os.umask(0)
          receipts=[]
          submitted=[]

          for phase in cmd['phases']:
              p=relay.submit(
                  project_id='metashield-protocol',
                  canonical_ir={
                    'goal':'Complete Chamber Sovereignty Preview RC1 MVP from the actual local working tree.',
                    'constraints':[
                      'Preserve Facebook, Threads, Instagram and X/Twitter preservation adapters.',
                      'Capture once; Mainnet promotion must not require source recapture.',
                      'Use DEVNET_ONLY -> MAINNET_REFERENCED -> MAINNET_REPLICATED semantics.',
                      'Do not reset/rebase/discard pre-existing local work.',
                      'Do not public-promote, deploy Mainnet, or overwrite immutable release artifacts.',
                      'Treat local workspace as execution truth; remote GitHub may be stale.',
                      'Return evidence and do not claim unperformed tests or side effects.'
                    ]
                  },
                  instruction=str(phase['instruction']),
                  workspace=str(workspace),
                  executor_hint='antigravity')
              cid=p['capsule_id']
              submitted.append({'phase':phase['id'],'capsule_id':cid})
              # Compatibility workaround only: spool directory stays private (2770),
              # while capsule bytes are writable by both authorized relay identities.
              inbox=relay_root/'inbox'/f'{cid}.json'
              if inbox.exists():
                  os.chmod(inbox,0o666)
              deadline=time.monotonic()+240
              receipt=None
              while time.monotonic()<deadline:
                  receipt=relay.receipt(cid)
                  if receipt is not None: break
                  time.sleep(1)
              if receipt is None:
                  receipt={'schema':'agentos.antigravity-receipt/v1','capsule_id':cid,'ok':False,'error':'receipt_timeout'}
              receipts.append({'phase':phase['id'],'receipt':receipt})
              if not receipt.get('ok'):
                  break

          result={
            'schema':'agentos.metashield-mvp-dispatch/v0.1',
            'project_id':'metashield-protocol',
            'workspace':str(workspace),
            'submitted_at':int(time.time()),
            'submitted':submitted,
            'receipts':receipts,
            'complete':len(receipts)==len(cmd['phases']) and all((x.get('receipt') or {}).get('ok') for x in receipts),
            'spool_workaround':'0666 capsule inside private relay spool; Core boundary repair remains separate'
          }
          Path('.agentos/evidence/metashield-mvp-rc1-current.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if not result['complete']:
              raise SystemExit('one or more MVP phases failed')
          PY

      - name: Validate and commit MetaShield execution evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f .agentos/evidence/metashield-mvp-rc1-current.json; then
            python3 - <<'PY'
          import json
          r=json.load(open('.agentos/evidence/metashield-mvp-rc1-current.json',encoding='utf-8'))
          print('complete=',r.get('complete'))
          for item in r.get('receipts') or []:
              rec=item.get('receipt') or {}
              print(item.get('phase'),'ok=',rec.get('ok'),'returncode=',rec.get('returncode'),'timed_out=',rec.get('timed_out'),'error=',rec.get('error'))
          PY
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/metashield-mvp-rc1-current.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(metashield): Sovereignty Preview RC1 execution'
          git push origin HEAD:main
