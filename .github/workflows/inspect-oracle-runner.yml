name: Inspect Oracle Runner Availability

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-oracle-runner.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Inspect repository self-hosted runners and queued bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/oracle-runner-availability.txt
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '=== RUNNERS API ==='
            code=$(curl -sS -o /tmp/runners.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GH_REPO/actions/runners")
            echo "runners_http_code=$code"
            cat /tmp/runners.json
            echo
            echo '=== BOOTSTRAP RUN ==='
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GH_REPO/actions/runs/32863242109" \
              | python3 -c 'import json,sys; r=json.load(sys.stdin); print(json.dumps({k:r.get(k) for k in ("id","status","conclusion","updated_at")}, indent=2))'
          } | tee "$OUT"
      - name: Commit diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/oracle-runner-availability.txt
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(agentos): Oracle runner availability'
          git pull --rebase origin main
          git push
