name: Inspect Oracle Runner Availability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-oracle-runner.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check runner API and Oracle SSH without leaking credentials
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'runner_probe=START'
          status=$(curl --connect-timeout 5 --max-time 12 -sS -o /tmp/agentos-runners.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GH_REPO/actions/runners")
          echo "runner_list_http_status=$status"
          if [ "$status" = 200 ]; then
            python3 - <<'PY'
          import json
          obj=json.load(open('/tmp/agentos-runners.json'))
          for item in obj.get('runners',[]):
              labels={x.get('name','') for x in item.get('labels',[])}
              if 'oracle' in labels:
                  print('oracle_runner_status='+str(item.get('status','unknown')))
                  print('oracle_runner_busy='+str(item.get('busy','unknown')))
          PY
          fi
          port="${DEPLOY_PORT:-22}"
          if timeout 8 bash -c 'cat < /dev/null > /dev/tcp/161.33.24.170/'"$port" 2>/dev/null; then
            echo 'oracle_tcp_reachable=true'
          else
            echo 'oracle_tcp_reachable=false'
          fi
          echo 'runner_probe=COMPLETE'
