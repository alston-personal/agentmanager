name: LeopardCat Production Master Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [chore/leopardcat-runtime-inspect]
    paths:
      - '.github/workflows/leopardcat-ai-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Diagnose production Master runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          ROOT=/home/ubuntu/leopardcat-tarot
          echo "head=$(git -C "$ROOT" rev-parse HEAD)"
          echo "service_active=$(systemctl --user is-active leopardcat-tarot.service || true)"
          echo '=== real reading probes ==='
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          cases=[
            ('zh-TW','最近的方向應該怎麼看？','diag-zh'),
            ('ja','これからの仕事について占ってください。','diag-ja'),
          ]
          for lang,q,seed in cases:
              body={"method":"tarot","persona":"leopardcat","question":q,"lang":lang,"seed":seed,"input":{"deck_id":"leopardcat","spread":"single"}}
              req=urllib.request.Request('http://127.0.0.1:8088/api/v1/readings',data=json.dumps(body,ensure_ascii=False).encode(),headers={'Content-Type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      data=json.load(r); code=r.status
              except urllib.error.HTTPError as e:
                  code=e.code
                  try: data=json.load(e)
                  except Exception: data={}
              print(f'case={lang} http={code} error={data.get("error")} code={data.get("code")} reading_present={bool(data.get("reading"))}')
          PY
          echo '=== recent service diagnostics ==='
          journalctl --user -u leopardcat-tarot.service --since '30 minutes ago' --no-pager 2>/dev/null \
            | grep -Ei 'AI|provider|Gemini|Groq|OpenRouter|429|503|quality|error|exception|traceback' \
            | tail -160 || true
          REMOTE
