name: LeopardCat Production Master Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [chore/leopardcat-runtime-inspect]
    paths:
      - '.github/workflows/leopardcat-ai-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Trace full Master prompt rejection
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/leopardcat-tarot/website
          python3 - <<'PY'
          import json, os
          from divination import ReadingRequest, build_default_engine
          from divination.ai_gateway import ZeroCostGeminiGateway, ZeroCostGroqGateway, ZeroCostOpenRouterGateway, ZeroCostProviderPool
          def env(name):
              value=os.environ.get(name)
              if value: return value
              try:
                  for line in open('/home/ubuntu/agentmanager/.env', encoding='utf-8'):
                      if line.startswith(name+'='): return line.strip().split('=',1)[1]
              except Exception: pass
              return None
          engine=build_default_engine('/home/ubuntu/leopardcat-tarot/website')
          envelope=engine.prepare(ReadingRequest(method='tarot',persona='leopardcat',question='最近的方向應該怎麼看？',input={'deck_id':'leopardcat','spread':'single'},lang='zh-TW',seed='diag-full'))
          providers=[ZeroCostGeminiGateway(env('GEMINI_API_KEY')),ZeroCostGroqGateway(env('GROQ_API_KEY'))]
          if env('OPENROUTER_API_KEY') or env('OPENROUTER_MODEL'):
              providers.append(ZeroCostOpenRouterGateway(env('OPENROUTER_API_KEY'), env('OPENROUTER_MODEL')))
          pool=ZeroCostProviderPool(providers)
          try:
              out=pool.generate(envelope.master_prompt)
              print('full_prompt_status=success')
              print('full_prompt_length='+str(len(out or '')))
          except Exception as exc:
              print('full_prompt_status=error')
              print('full_prompt_exception='+type(exc).__name__)
              print('full_prompt_message='+str(exc)[:250].replace('\n',' '))
          print('full_prompt_trace='+json.dumps(pool.last_trace(),ensure_ascii=False,separators=(',',':')))
          PY
          REMOTE
