name: LeopardCat Production Master Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [chore/leopardcat-runtime-inspect]
    paths:
      - '.github/workflows/leopardcat-ai-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect Groq account model availability
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          key=None
          try:
              for line in open('/home/ubuntu/agentmanager/.env',encoding='utf-8'):
                  if line.startswith('GROQ_API_KEY='): key=line.strip().split('=',1)[1]
          except Exception: pass
          req=urllib.request.Request('https://api.groq.com/openai/v1/models',headers={'Authorization':f'Bearer {key}','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
          ids=sorted(str(x.get('id')) for x in data.get('data',[]) if isinstance(x,dict) and x.get('id'))
          candidates=[x for x in ids if any(t in x for t in ('llama','qwen','gpt-oss','compound'))]
          print('groq_candidate_models='+json.dumps(candidates,separators=(',',':')))
          PY
          REMOTE
