# Vendor source registry + Threads discovery carrier. Does not modify AgentOS Core.
name: Oracle Vendor Threads Patrol

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-register-vendor-threads-source.yml'
      - 'scripts/register_vendor_threads_source.sh'
      - 'scripts/run_vendor_threads_patrol.sh'
      - 'config/vendor_threads_sources.txt'

permissions:
  contents: write

jobs:
  register:
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      SERVICE_SHA: fbcf3cb1ece1bf7b2d928634cf4afd3901cf894b
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Register monitored Threads sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r SOURCE_URL; do
            [ -n "$SOURCE_URL" ] || continue
            case "$SOURCE_URL" in \#*) continue ;; esac
            ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              bash -s -- "$SERVICE_SHA" "$SOURCE_URL" \
              < scripts/register_vendor_threads_source.sh \
              >/dev/null
          done < config/vendor_threads_sources.txt

  discover:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 15
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      SERVICE_SHA: f1b2937b2df908d23b190b256fbe4b8665b46ec1
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Run Threads keyword patrol on Oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/vendor-threads-patrol.json
          SSHERR=.agentos/evidence/vendor-threads-patrol-ssh.err
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'umask 077; cat > /tmp/run_vendor_threads_patrol.sh' \
            < scripts/run_vendor_threads_patrol.sh
          set +e
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash /tmp/run_vendor_threads_patrol.sh "$SERVICE_SHA" \
            > "$OUT" 2> "$SSHERR"
          SSH_RC=$?
          set -e
          if [ ! -s "$OUT" ]; then
            python3 - "$SSH_RC" "$SSHERR" > "$OUT" <<'PY'
          import json,pathlib,sys
          rc=int(sys.argv[1]); p=pathlib.Path(sys.argv[2])
          text=' '.join((p.read_text(errors='replace') if p.exists() else '').split())[-800:]
          print(json.dumps({'schema':'milkcat.vendor-threads-patrol-receipt/v4','ok':False,'failed_stage':'ssh','worker_exit_code':None,'queries':0,'results_seen':0,'direct_results':0,'harvest_results':0,'harvest_vendor_matches':0,'harvest_filtered_out':0,'new_candidates':0,'duplicates':0,'errors':1,'candidate_sources_total':None,'candidate_authors_total':None,'sanitized_error_tail':text,'raw_text_emitted':False,'raw_text_persisted':False,'token_exposed':False,'reviews_published':False,'core_modified':False},ensure_ascii=False))
          PY
          fi
          rm -f "$SSHERR"
          python3 -m json.tool "$OUT" >/dev/null
          cat "$OUT"
          exit "$SSH_RC"
      - name: Commit sanitized patrol evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .agentos/evidence/vendor-threads-patrol.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/vendor-threads-patrol.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(vendors): Threads patrol receipt'
          git push
