# Vendor source registry + Threads discovery carrier. Does not modify AgentOS Core.
name: Oracle Vendor Threads Patrol

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-register-vendor-threads-source.yml'
      - 'scripts/register_vendor_threads_source.sh'
      - 'config/vendor_threads_sources.txt'

permissions:
  contents: write

jobs:
  register:
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      SERVICE_SHA: fbcf3cb1ece1bf7b2d928634cf4afd3901cf894b
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Register monitored Threads sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r SOURCE_URL; do
            [ -n "$SOURCE_URL" ] || continue
            case "$SOURCE_URL" in \#*) continue ;; esac
            ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              bash -s -- "$SERVICE_SHA" "$SOURCE_URL" \
              < scripts/register_vendor_threads_source.sh \
              >/dev/null
          done < config/vendor_threads_sources.txt

  discover:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 15
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      SERVICE_SHA: 8666a39d0a476afc9b3e4cda42f8ea7a5dd44560
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Run Threads keyword patrol on Oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          set +e
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$SERVICE_SHA" <<'REMOTE' > .agentos/evidence/vendor-threads-patrol.json
          set -euo pipefail
          SHA="$1"
          BASE=/home/ubuntu/vendor-reputation-service
          test -d "$BASE/.git"
          git -C "$BASE" fetch --depth=1 origin "$SHA" >/tmp/vendor-patrol-fetch.log 2>&1
          git -C "$BASE" checkout --detach "$SHA" >/tmp/vendor-patrol-checkout.log 2>&1

          set -a
          . /home/ubuntu/agent-data/secrets/vendor-reputation.env
          set +a
          SOC_THREADS_TOKEN=$(python3 - <<'PY'
          from pathlib import Path
          p=Path('/home/ubuntu/agent-data/secrets/zeus-writer.env')
          value=''
          for line in p.read_text().splitlines():
              if line.startswith('SOC_THREADS_TOKEN='):
                  value=line.split('=',1)[1].strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in {'\"', "'"}:
                      value=value[1:-1]
                  break
          if not value:
              raise SystemExit('SOC_THREADS_TOKEN missing')
          print(value)
          PY
          )
          export SOC_THREADS_TOKEN

          cd "$BASE"
          docker compose up -d --build >/tmp/vendor-patrol-compose.log 2>&1
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U vendor_service -d vendor_reputation < sql/003_source_discovery.sql >/tmp/vendor-patrol-migration.log 2>&1

          set +e
          OUT=$(docker compose run --rm -T -e SOC_THREADS_TOKEN="$SOC_THREADS_TOKEN" api \
            python /srv/app/scripts/discover_threads_sources.py /srv/app/config/threads_discovery_queries.txt \
            2>/tmp/vendor-patrol.err)
          WORKER_RC=$?
          set -e

          CANDIDATES=$(docker compose exec -T db psql -At -U vendor_service -d vendor_reputation -c "select count(*) from candidate_sources where status='candidate';" | tr -d '\r')
          AUTHORS=$(docker compose exec -T db psql -At -U vendor_service -d vendor_reputation -c "select count(distinct source_author) from candidate_sources where status='candidate' and source_author is not null;" | tr -d '\r')

          ERROR_TAIL=$(python3 - "$SOC_THREADS_TOKEN" <<'PY'
          import pathlib,sys,re
          token=sys.argv[1]
          p=pathlib.Path('/tmp/vendor-patrol.err')
          text=p.read_text(errors='replace') if p.exists() else ''
          if token:
              text=text.replace(token,'[REDACTED_TOKEN]')
          text=re.sub(r'access_token=[^&\s]+','access_token=[REDACTED]',text)
          text=' '.join(text.split())[-800:]
          print(text)
          PY
          )

          python3 - "$OUT" "$CANDIDATES" "$AUTHORS" "$WORKER_RC" "$ERROR_TAIL" <<'PY'
          import json,sys
          out=sys.argv[1]
          try:
              x=json.loads(out) if out.strip() else {}
          except Exception:
              x={}
          rc=int(sys.argv[4])
          print(json.dumps({
            'schema':'milkcat.vendor-threads-patrol-receipt/v2',
            'worker_exit_code':rc,
            'queries':x.get('queries',0),
            'results_seen':x.get('results',0),
            'new_candidates':x.get('new_candidates',0),
            'duplicates':x.get('duplicates',0),
            'errors':x.get('errors',0),
            'candidate_sources_total':int(sys.argv[2]),
            'candidate_authors_total':int(sys.argv[3]),
            'sanitized_error_tail':sys.argv[5] if rc else '',
            'raw_text_emitted':False,
            'token_exposed':False,
            'reviews_published':False,
            'core_modified':False
          },ensure_ascii=False))
          PY
          exit "$WORKER_RC"
          REMOTE
          SSH_RC=$?
          set -e
          python3 -m json.tool .agentos/evidence/vendor-threads-patrol.json >/dev/null
          cat .agentos/evidence/vendor-threads-patrol.json
          exit "$SSH_RC"
      - name: Commit sanitized patrol evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .agentos/evidence/vendor-threads-patrol.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/vendor-threads-patrol.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(vendors): Threads patrol receipt'
          git push
