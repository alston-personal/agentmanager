# Registered source-registry carrier.
name: Oracle Register Vendor Threads Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-register-vendor-threads-source.yml'
      - 'scripts/register_vendor_threads_source.sh'
      - 'config/vendor_threads_sources.txt'

permissions:
  contents: write

jobs:
  register:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      SERVICE_SHA: fbcf3cb1ece1bf7b2d928634cf4afd3901cf894b
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Register monitored Threads sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          while IFS= read -r SOURCE_URL; do
            [ -n "$SOURCE_URL" ] || continue
            case "$SOURCE_URL" in \#*) continue ;; esac
            ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              bash -s -- "$SERVICE_SHA" "$SOURCE_URL" \
              < scripts/register_vendor_threads_source.sh \
              >/dev/null
          done < config/vendor_threads_sources.txt

          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE' > .agentos/evidence/vendor-source-register.json
          set -euo pipefail
          cd /home/ubuntu/vendor-reputation-service
          TOTAL=$(docker compose exec -T db psql -At -U vendor_service -d vendor_reputation -c "select count(*) from monitored_sources where status='active';" | tr -d '\r')
          PRESENT=$(docker compose exec -T db psql -At -U vendor_service -d vendor_reputation -c "select count(*) from monitored_sources where status='active' and input_url in ('https://www.threads.com/@nico1e.16/post/DcWVvpwGTSh','https://www.threads.com/share/_yh22msHD/','https://www.threads.com/share/BAUXFamItI/');" | tr -d '\r')
          printf '{"schema":"milkcat.vendor-source-register-batch/v1","active_sources":%s,"required_sources_present":%s,"all_registered":%s,"core_modified":false,"raw_threads_content_emitted":false}\n' "$TOTAL" "$PRESENT" "$([ "$PRESENT" -eq 3 ] && printf true || printf false)"
          REMOTE
          python3 -m json.tool .agentos/evidence/vendor-source-register.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('.agentos/evidence/vendor-source-register.json'))
          assert x['required_sources_present'] == 3, x
          assert x['all_registered'] is True, x
          assert x['active_sources'] >= 3, x
          PY
          cat .agentos/evidence/vendor-source-register.json
      - name: Commit sanitized evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .agentos/evidence/vendor-source-register.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/vendor-source-register.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(vendors): monitored Threads source registry'
          git push
