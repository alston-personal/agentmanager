# Registered source-registry carrier.
name: Oracle Register Vendor Threads Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-register-vendor-threads-source.yml'
      - 'scripts/register_vendor_threads_source.sh'
      - 'config/vendor_threads_sources.txt'

permissions:
  contents: write

jobs:
  register:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      SERVICE_SHA: fbcf3cb1ece1bf7b2d928634cf4afd3901cf894b
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Register monitored Threads sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          : > .agentos/evidence/vendor-source-register.jsonl
          while IFS= read -r SOURCE_URL; do
            [ -n "$SOURCE_URL" ] || continue
            case "$SOURCE_URL" in \#*) continue ;; esac
            ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              bash -s -- "$SERVICE_SHA" "$SOURCE_URL" \
              < scripts/register_vendor_threads_source.sh \
              >> .agentos/evidence/vendor-source-register.jsonl
          done < config/vendor_threads_sources.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.agentos/evidence/vendor-source-register.jsonl')
          rows=[json.loads(line) for line in p.read_text().splitlines() if line.strip()]
          assert rows, 'no source registration results'
          out={
            'schema':'milkcat.vendor-source-register-batch/v1',
            'requested_sources':len(rows),
            'results':rows,
            'active_sources':max(int(r.get('active_sources',0)) for r in rows),
            'all_registered':all(int(r.get('new_source_registered',0)) == 1 for r in rows),
            'core_modified':False,
            'raw_threads_content_emitted':False,
          }
          assert out['all_registered'] is True, out
          Path('.agentos/evidence/vendor-source-register.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool .agentos/evidence/vendor-source-register.json >/dev/null
          cat .agentos/evidence/vendor-source-register.json
      - name: Commit sanitized evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .agentos/evidence/vendor-source-register.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/vendor-source-register.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(vendors): monitored Threads source registry'
          git push
