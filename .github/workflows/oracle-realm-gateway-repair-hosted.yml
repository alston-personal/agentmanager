name: Hosted Realm Gateway Repair

on:
  push:
    branches: [core/integration]
    paths:
      - '.agentos/commands/realm-gateway-repair-hosted.json'
      - '.github/workflows/oracle-realm-gateway-repair-hosted.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Repair canonical Realm gateway
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT=${GITHUB_SHA}
          scp -o StrictHostKeyChecking=accept-new -P "${DEPLOY_PORT:-22}" scripts/deploy_realm_gateway_user.sh "${DEPLOY_USER}@${ORACLE_HOST}:/tmp/deploy_realm_gateway_user_hosted.sh"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" "chmod 700 /tmp/deploy_realm_gateway_user_hosted.sh && AGENTOS_SOURCE_COMMIT=$SOURCE_COMMIT AGENTOS_REPO=/home/ubuntu/agentmanager /tmp/deploy_realm_gateway_user_hosted.sh"
      - name: Verify public bootstrap route
        shell: bash
        run: |
          set -euo pipefail
          BODY=/tmp/bootstrap-probe
          CODE=$(curl -sS -o "$BODY" -w '%{http_code}' --max-time 10 'https://studio.milkcat.org/dashboard/api/agentos/v1/bootstrap?node_id=__probe__' || true)
          echo "bootstrap_http=$CODE"
          test "$CODE" = 401
          ! grep -q 'Realm gateway route not allowlisted' "$BODY"
          echo 'realm_gateway_repair=PASS'

# trigger: 2026-10-01T03:10Z bootstrap-route-repair

# retry: 2026-10-01T05:15Z realm-health-retry-pm2-retire
