name: Oracle AgentOS Node Read-Only Probe

on:
  workflow_dispatch:
    inputs:
      expected_hostname:
        description: "Fail closed if the selected self-hosted runner is not this host"
        required: true
        default: "instance-20260129-0852"
  push:
    branches:
      - feature/state-kernel-v2
    paths:
      - ".agentos/triggers/oracle-readonly-probe"

permissions:
  contents: read
  issues: write

jobs:
  oracle-readonly-probe:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5

    steps:
      - name: Verify execution boundary
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HOST="${{ github.event_name == 'workflow_dispatch' && inputs.expected_hostname || 'instance-20260129-0852' }}"
          test "$(hostname)" = "$EXPECTED_HOST"
          test "$(id -un)" = "agentos-node"
          test "$(uname -m)" = "aarch64" -o "$(uname -m)" = "arm64"

      - name: Collect sanitized read-only status
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/oracle-agentos-node-status.txt"
          REPO="/home/ubuntu/agentos-distributed"

          {
            echo "schema=agentos.oracle-readonly-probe/v1"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "hostname=$(hostname)"
            echo "runner_user=$(id -un)"
            echo "arch=$(uname -m)"
            echo "uptime_seconds=$(cut -d' ' -f1 /proc/uptime)"

            if git -C "$REPO" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              echo "repo_read=ok"
              echo "repo_head=$(git -C "$REPO" rev-parse HEAD)"
              echo "repo_dirty_count=$(git -C "$REPO" status --porcelain | wc -l | tr -d ' ')"
            else
              echo "repo_read=failed"
            fi

            for port in 8765 8775; do
              code=$(curl --max-time 3 --silent --show-error --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${port}/health" || true)
              test -n "$code" || code="000"
              echo "localhost_${port}_health_http=$code"
            done
          } > "$OUT"

          cat "$OUT"

      - name: Report sanitized status to PR 3
        uses: actions/github-script@v7
        env:
          STATUS_FILE: ${{ runner.temp }}/oracle-agentos-node-status.txt
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const allowed = new Set([
              'schema', 'timestamp_utc', 'hostname', 'runner_user', 'arch',
              'uptime_seconds', 'repo_read', 'repo_head', 'repo_dirty_count',
              'localhost_8765_health_http', 'localhost_8775_health_http'
            ]);
            const values = {};
            for (const line of fs.readFileSync(process.env.STATUS_FILE, 'utf8').split(/\r?\n/)) {
              const i = line.indexOf('=');
              if (i < 1) continue;
              const key = line.slice(0, i);
              const value = line.slice(i + 1);
              if (allowed.has(key)) values[key] = value;
            }
            const marker = '<!-- agentos-oracle-readonly-probe -->';
            const body = `${marker}\n### Oracle AgentOS Node — sanitized read-only status\n\n` +
              '```text\n' + Object.entries(values).map(([k,v]) => `${k}=${v}`).join('\n') + '\n```\n\n' +
              '_Generated by the governed read-only Oracle probe. No secrets or file contents are reported._';
            const { owner, repo } = context.repo;
            const issue_number = 3;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

      - name: Upload sanitized probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: oracle-agentos-node-readonly-probe
          path: ${{ runner.temp }}/oracle-agentos-node-status.txt
          if-no-files-found: error
          retention-days: 7
