name: Inspect Safe Bootstrap Status

on:
  push:
    paths:
      - '.github/workflows/inspect-safe-bootstrap-status.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Read safe bootstrap and active workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsSL "${headers[@]}" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/oracle-bootstrap-action-relay-via-chronos-safe.yml/runs?per_page=5" \
            > /tmp/safe-runs.json
          curl -fsSL "${headers[@]}" \
            "https://api.github.com/repos/$GH_REPO/actions/runs?per_page=50" \
            > /tmp/all-runs.json
          python3 - <<'PY' > .agentos/evidence/safe-bootstrap-status.txt
          import json
          safe=json.load(open('/tmp/safe-runs.json'))
          allruns=json.load(open('/tmp/all-runs.json'))
          print('=== SAFE BOOTSTRAP ===')
          print('total_count='+str(safe.get('total_count',0)))
          for r in safe.get('workflow_runs',[]):
              for k in ('id','name','status','conclusion','event','head_sha','created_at','updated_at'):
                  print(f'{k}={r.get(k)}')
              print('---')
          print('=== ACTIVE REPOSITORY RUNS ===')
          active=[r for r in allruns.get('workflow_runs',[]) if r.get('status') in ('queued','in_progress','waiting','pending','requested')]
          print('active_count='+str(len(active)))
          for r in active:
              print('run_id='+str(r.get('id')))
              print('name='+str(r.get('name')))
              print('status='+str(r.get('status')))
              print('event='+str(r.get('event')))
              print('head_sha='+str(r.get('head_sha')))
              print('created_at='+str(r.get('created_at')))
              print('---')
          PY
          cat .agentos/evidence/safe-bootstrap-status.txt
      - name: Commit status evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/safe-bootstrap-status.txt
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(agentos): inspect safe bootstrap queue'
          git pull --rebase origin main
          git push
