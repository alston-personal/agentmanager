name: Inspect Safe Bootstrap Status

on:
  push:
    paths:
      - '.github/workflows/inspect-safe-bootstrap-status.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Read safe bootstrap, active runs, and self-hosted runners
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          echo 'status_refresh=v4'
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsSL "${headers[@]}" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/oracle-bootstrap-action-relay-via-chronos-safe.yml/runs?per_page=8" \
            > /tmp/safe-runs.json
          curl -fsSL "${headers[@]}" \
            "https://api.github.com/repos/$GH_REPO/actions/runs?per_page=50" \
            > /tmp/all-runs.json
          if curl -fsSL "${headers[@]}" \
            "https://api.github.com/repos/$GH_REPO/actions/runners?per_page=100" \
            > /tmp/runners.json; then
            runners_ok=1
          else
            runners_ok=0
            printf '{"total_count":0,"runners":[]}' > /tmp/runners.json
          fi
          export runners_ok
          python3 - <<'PY' > .agentos/evidence/safe-bootstrap-status.txt
          import json,os
          safe=json.load(open('/tmp/safe-runs.json'))
          allruns=json.load(open('/tmp/all-runs.json'))
          runners=json.load(open('/tmp/runners.json'))
          print('=== SAFE BOOTSTRAP ===')
          print('total_count='+str(safe.get('total_count',0)))
          for r in safe.get('workflow_runs',[]):
              for k in ('id','name','status','conclusion','event','head_sha','created_at','updated_at'):
                  print(f'{k}={r.get(k)}')
              print('---')
          print('=== ACTIVE REPOSITORY RUNS ===')
          active=[r for r in allruns.get('workflow_runs',[]) if r.get('status') in ('queued','in_progress','waiting','pending','requested')]
          print('active_count='+str(len(active)))
          for r in active:
              print('run_id='+str(r.get('id')))
              print('name='+str(r.get('name')))
              print('status='+str(r.get('status')))
              print('event='+str(r.get('event')))
              print('head_sha='+str(r.get('head_sha')))
              print('created_at='+str(r.get('created_at')))
              print('---')
          print('=== REPOSITORY SELF-HOSTED RUNNERS ===')
          print('runner_api_ok='+os.environ.get('runners_ok','0'))
          print('runner_count='+str(runners.get('total_count',0)))
          for r in runners.get('runners',[]):
              print('runner_id='+str(r.get('id')))
              print('runner_name='+str(r.get('name')))
              print('runner_os='+str(r.get('os')))
              print('runner_status='+str(r.get('status')))
              print('runner_busy='+str(r.get('busy')))
              print('runner_labels='+','.join(x.get('name','') for x in r.get('labels',[])))
              print('---')
          PY
          cat .agentos/evidence/safe-bootstrap-status.txt
      - name: Commit status evidence
        shell: bash
        run: |
          set -euo pipefail
          E=.agentos/evidence/safe-bootstrap-status.txt
          cp "$E" /tmp/safe-bootstrap-status.txt
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .agentos/evidence
          cp /tmp/safe-bootstrap-status.txt "$E"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$E"
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(agentos): inspect safe bootstrap queue'
          git push origin HEAD:main
