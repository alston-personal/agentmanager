name: Diagnostic 1682 Thin Client
on:
  pull_request:
    paths:
      - 'tests/test_thin_client.py'
      - 'tests/test_thin_client_integration_contract.py'
      - '.github/workflows/diagnostic-1682-thin-client.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v tests.test_thin_client tests.test_thin_client_integration_contract
