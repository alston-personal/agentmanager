name: Inspect Desktop Geometry

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/inspect-desktop-geometry.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect desktop geometry
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          f=RealmFabricStore(); tid='inspect-desktop-geometry-20261006-1100'
          code="import ctypes,json; from PIL import ImageGrab; u=ctypes.windll.user32; d={'primary':[u.GetSystemMetrics(0),u.GetSystemMetrics(1)],'virtual':[u.GetSystemMetrics(76),u.GetSystemMetrics(77),u.GetSystemMetrics(78),u.GetSystemMetrics(79)],'grab':list(ImageGrab.grab(all_screens=True).size),'foreground':u.GetForegroundWindow()}; print(json.dumps(d))"
          if f.get_receipt(tid) is None:
              f.queue_task('VO10005870',{'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':r'C:\Users\alston.huang\AppData\Local\Programs\Python\Python312\python.exe','argv':['-c',code],'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':10,'cognition_ids_used':['demo://desktop-geometry/20261006']})
          for _ in range(25):
              r=f.get_receipt(tid)
              if r:
                  print(r.get('stdout') or '')
                  raise SystemExit(0)
              time.sleep(1)
          raise SystemExit('geometry_receipt_missing')
          PY
          REMOTE
