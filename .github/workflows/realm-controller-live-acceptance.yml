name: Realm Controller Live Acceptance (retired legacy carrier)

# Historical direct-main and mutable Oracle deployment carrier, intentionally
# retired during #1682. Use the governed immutable Core release controller.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy deployment execution
        run: |
          echo 'RETIRED_LEGACY_CARRIER: use governed immutable Core rollout and receipts'
          exit 1
