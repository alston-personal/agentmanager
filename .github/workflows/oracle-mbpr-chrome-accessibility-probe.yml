name: Oracle MBPR Chrome Accessibility Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 3
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe Chrome accessibility without reading page content
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          cmd=json.load(open('.agentos/commands/mbpr-chrome-accessibility-probe.json',encoding='utf-8'))
          assert cmd.get('node_id')=='mbpr'
          tid='mbpr-chrome-accessibility-'+str(int(time.time()))
          py='/Users/tengweihuang/Library/Application Support/AgentOS/versions/18be78bbc0ccc94189f821e66da09ed4d41b268d/venv/bin/python'
          code="import subprocess; s='tell application \"System Events\" to tell process \"Google Chrome\" to return count of windows'; p=subprocess.run(['/usr/bin/osascript','-e',s],text=True,capture_output=True,timeout=8); print('AX_RC='+str(p.returncode)); print('AX_WINDOWS='+((p.stdout.strip()) if p.stdout.strip().isdigit() else 'unknown')); e=p.stderr.lower(); print('AX_ERR='+('permission' if ('not authorized' in e or 'not permitted' in e or '-1743' in e or 'assistive access' in e) else 'other'))"
          task={'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':py,'argv':['-c',code],'cwd':'/Users/tengweihuang/AgentOS','timeout_seconds':15,'cognition_ids_used':[]}
          store=RealmFabricStore(); store.queue_task('mbpr',task)
          for _ in range(30):
              r=store.get_receipt(tid)
              if r:
                  out=str(r.get('stdout') or '')
                  err=(str(r.get('stderr') or '')+' '+str(r.get('error') or '')).lower()
                  if 'timeout' in err or 'timed out' in err:
                      print('chrome_ax_probe=TIMEOUT'); raise SystemExit(4)
                  print(out)
                  if r.get('ok') is True and int(r.get('returncode') or 0)==0:
                      print('chrome_ax_probe=PASS'); raise SystemExit(0)
                  print('chrome_ax_probe=ERROR'); raise SystemExit(2)
              time.sleep(2)
          raise SystemExit('Chrome accessibility probe timeout')
          PY
