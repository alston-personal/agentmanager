# Narrow Future Isles FI-001 release through existing governed Studio carrier.
# Pinned and game-CI-tested Studio source from PR #146; bounded public route preview.
name: Oracle Release Future Isles FI-001

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-release-future-isles.yml'

permissions:
  contents: read

concurrency:
  group: future-isles-production
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/reusable-studio-static-route-release.yml
    with:
      source_sha: bd0370583601be8b33bffa5b72a8db88d572d57f
      route: future-isles
      backup_key: future-isles
      receipt_schema: studio-web.future-isles-release/v1
      acceptance_anchors: |-
        未來群島
        開始第二章
        river_001
        community_001
    secrets:
      AGENTOS_DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER }}
      AGENTOS_DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT }}
      AGENTOS_DEPLOY_SSH_KEY: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY }}
      N8N_DEPLOY_USER: ${{ secrets.N8N_DEPLOY_USER }}
      N8N_DEPLOY_SSH_PORT: ${{ secrets.N8N_DEPLOY_SSH_PORT }}
      N8N_DEPLOY_SSH_KEY: ${{ secrets.N8N_DEPLOY_SSH_KEY }}
