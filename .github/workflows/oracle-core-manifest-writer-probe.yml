name: Oracle Core Manifest Writer Probe

on:
  push:
    branches:
      - ops/oracle-drift-probe-20260904
    paths:
      - ".github/workflows/oracle-core-manifest-writer-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect manifest writers and live state
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          TARGET="34ea3e75a8fd0f701a0ca78a02820680d5c5fa99"
          set -a
          source .env
          set +a
          DATA_ROOT="${AGENT_DATA_ROOT:-${AGENT_DATA_DIR:-$HOME/agent-data}}"
          echo "head=$(git rev-parse HEAD)"
          echo "--- target references to oracle-core-node ---"
          git grep -n 'oracle-core-node' "$TARGET" -- '*.py' '*.sh' 2>/dev/null || true
          echo "--- target register_manifest references ---"
          git grep -n 'register_manifest' "$TARGET" -- '*.py' 2>/dev/null || true
          echo "--- live realm/python processes ---"
          ps -eo pid,ppid,lstart,args | grep -E 'agent_core\.realm_cli|realm_server|agentos.*realm|python3' | grep -v grep || true
          echo "--- action marker ---"
          if [ -f "$DATA_ROOT/runtime/action-relay/capabilities.json" ]; then
            stat -c 'marker mode=%a user=%U group=%G path=%n' "$DATA_ROOT/runtime/action-relay/capabilities.json"
            python3 - "$DATA_ROOT/runtime/action-relay/capabilities.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          print('marker_source_commit=' + str(p.get('source_commit')))
          print('marker_node_capabilities=' + ','.join(p.get('node_capabilities') or []))
          PY
          else
            echo "marker_exists=false"
          fi
          echo "--- current registry core node ---"
          python3 - "$DATA_ROOT/realm/nodes.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          n=(p.get('nodes') or {}).get('oracle-core-node') or {}
          print('status=' + str(n.get('status')))
          print('caps=' + ','.join(n.get('capabilities') or []))
          print('last_manifest=' + str(n.get('last_manifest_at')))
          print('last_heartbeat=' + str(n.get('last_heartbeat_at')))
          PY
          echo "tracked_dirty_count=$(git status --porcelain --untracked-files=no | wc -l | tr -d ' ')"
          REMOTE
