name: Capture Gemini Preview Two Parts

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/capture-gemini-preview-two-parts.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Capture and fetch two parts
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          f=RealmFabricStore()
          tasks=[
            ('preview-save-20261006-1050',"from PIL import ImageGrab; import io,pathlib,base64; p=pathlib.Path(r'C:\\Users\\alston.huang\\AgentOS\\gemini-preview.jpg'); im=ImageGrab.grab(all_screens=True).convert('RGB'); im.thumbnail((480,270)); im.save(p,format='JPEG',quality=25,optimize=True); s=base64.b64encode(p.read_bytes()).decode('ascii'); print('LEN='+str(len(s)))"),
            ('preview-part0-20261006-1050',"import pathlib,base64; s=base64.b64encode(pathlib.Path(r'C:\\Users\\alston.huang\\AgentOS\\gemini-preview.jpg').read_bytes()).decode('ascii'); print('PART0='+s[:6000])"),
            ('preview-part1-20261006-1050',"import pathlib,base64; s=base64.b64encode(pathlib.Path(r'C:\\Users\\alston.huang\\AgentOS\\gemini-preview.jpg').read_bytes()).decode('ascii'); print('PART1='+s[6000:12000])"),
          ]
          for tid,code in tasks:
              if f.get_receipt(tid) is None:
                  f.queue_task('VO10005870',{'schema':'agentos.node-task/v0.1','task_id':tid,'action':'shell.exec','executable':r'C:\Users\alston.huang\AppData\Local\Programs\Python\Python312\python.exe','argv':['-c',code],'cwd':r'C:\Users\alston.huang\AgentOS','timeout_seconds':15,'cognition_ids_used':['demo://screen-preview/20261006']})
              for _ in range(30):
                  r=f.get_receipt(tid)
                  if r:
                      print(str(r.get('stdout') or '').strip())
                      break
                  time.sleep(1)
              else: raise SystemExit('receipt_missing:'+tid)
          PY
          REMOTE
