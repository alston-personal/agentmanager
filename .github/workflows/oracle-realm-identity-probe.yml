name: Oracle Realm Identity Probe

on:
  push:
    branches:
      - ops/oracle-drift-probe-20260904
    paths:
      - ".github/workflows/oracle-realm-identity-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_LIVE_N8N_BASE_URL || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
      DEPLOY_ROOT: ${{ vars.AGENTOS_DEPLOY_ROOT }}

    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Read non-secret Realm identity state
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DEPLOY_ROOT:-/home/ubuntu/agentmanager}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$ROOT" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          cd "$ROOT"
          set -a
          source .env
          set +a
          DATA_ROOT="${AGENT_DATA_ROOT:-${AGENT_DATA_DIR:-$HOME/agent-data}}"
          FABRIC="$DATA_ROOT/realm/fabric.json"
          echo "head=$(git rev-parse HEAD)"
          echo "env_realm_id=${AGENTOS_REALM_ID:-<unset>}"
          python3 - "$FABRIC" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          print('fabric_exists=' + ('true' if path.is_file() else 'false'))
          if path.is_file():
              data = json.loads(path.read_text(encoding='utf-8'))
              print('fabric_realm_id=' + str(data.get('realm_id') or data.get('id') or '<missing>'))
              print('fabric_schema=' + str(data.get('schema') or '<missing>'))
          PY
          systemctl --user is-active agentos-realm-fabric.service 2>/dev/null || true
          if [ -f "$HOME/.config/systemd/user/agentos-realm-fabric.service" ]; then
            echo "realm_unit_exists=true"
          else
            echo "realm_unit_exists=false"
          fi
          echo "tracked_dirty_count=$(git status --porcelain --untracked-files=no | wc -l | tr -d ' ')"
          REMOTE
