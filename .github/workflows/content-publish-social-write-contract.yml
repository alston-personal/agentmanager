name: Content Publish Social Write Contract

on:
  pull_request:
    branches: [core/integration]
    paths:
      - 'agentos_node/content_publish_social_write_action_relay.py'
      - 'agentos_node/content_publish_social_action_relay.py'
      - 'agentos_node/social/threads.py'
      - 'agentos_node/executor_job_action_relay.py'
      - 'agentos_node/runtime_converge_action_relay.py'
      - 'agent_core/runtime_converge_capability.py'
      - 'scripts/install_action_relay_user.sh'
      - 'scripts/reconcile_action_relay_runtime.py'
      - 'tests/test_content_publish_social_write_action_relay.py'
      - 'tests/test_content_publish_threads_permalink.py'
      - '.github/workflows/content-publish-social-write-contract.yml'
  push:
    branches: [core/integration]
    paths:
      - 'agentos_node/content_publish_social_write_action_relay.py'
      - 'agentos_node/social/threads.py'
      - 'agentos_node/executor_job_action_relay.py'
      - 'agentos_node/runtime_converge_action_relay.py'
      - 'agent_core/runtime_converge_capability.py'
      - 'scripts/install_action_relay_user.sh'
      - 'scripts/reconcile_action_relay_runtime.py'
      - '.github/workflows/content-publish-social-write-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - run: >-
          python -m pytest -q
          tests/test_content_publish_social_write_action_relay.py
          tests/test_content_publish_threads_permalink.py
          tests/test_runtime_converge_capability.py
          tests/test_action_relay_generation_reconcile.py
          tests/test_executor_job_runtime_installer.py
