name: Transport Routing Guard

on:
  pull_request:
    branches:
      - core/integration
      - main
    paths:
      - agent_core/transport_routing.py
      - agentos_node/wow_control_adapter.py
      - agentos_node/client_account_session.py
      - tests/test_client_account_session.py
      - integrations/wow/**
      - tests/test_wow_control_adapter.py
      - tests/test_wow_addon_shell.py
      - tests/test_wow_bridge_protocol.py
      - tests/test_wow_status_reply.py
      - tests/test_wow_reply_slot.py
      - tests/test_wow_slot_publisher.py
      - tests/test_wow_offline_end_to_end.py
      - tests/test_wow_offline_installer_contract.py
      - scripts/wow_agentos_install.ps1
      - scripts/wow_agentos_select_game.ps1
      - scripts/build_wow_offline_installer.py
      - tests/test_wow_offline_packaging.py
      - tests/test_wow_offline_installer_windows.ps1
      - scripts/WoW-AgentOS-Setup.cmd
      - Install-AgentOS-WoW.cmd
      - agentos_node/wow_slot_publisher.py
      - agentos_node/wow_reply_slot.py
      - tests/test_wow_pixel_probe.py
      - tests/test_wow_capture_probe.py
      - agentos_node/wow_capture_probe.py
      - scripts/capture_wow_status_probe.ps1
      - agentos_node/wow_bridge_protocol.py
      - governance/transport-routing.json
      - tests/test_transport_routing.py
      - governance/product-deployment-carriers.json
      - tests/test_product_deployment_carriers.py
      - docs/CHATGPT_ONE_TRANSPORT.md
      - AGENTS.md
      - docs/CURRENT_STATE.md
      - .github/workflows/transport-routing-guard.yml
  push:
    branches:
      - core/integration
      - core/issue-2134-wow-control-contract
    paths:
      - agent_core/transport_routing.py
      - agentos_node/wow_control_adapter.py
      - agentos_node/client_account_session.py
      - tests/test_client_account_session.py
      - integrations/wow/**
      - tests/test_wow_control_adapter.py
      - tests/test_wow_addon_shell.py
      - tests/test_wow_bridge_protocol.py
      - tests/test_wow_status_reply.py
      - tests/test_wow_reply_slot.py
      - tests/test_wow_slot_publisher.py
      - tests/test_wow_offline_end_to_end.py
      - tests/test_wow_offline_installer_contract.py
      - scripts/wow_agentos_install.ps1
      - scripts/wow_agentos_select_game.ps1
      - scripts/build_wow_offline_installer.py
      - tests/test_wow_offline_packaging.py
      - tests/test_wow_offline_installer_windows.ps1
      - scripts/WoW-AgentOS-Setup.cmd
      - Install-AgentOS-WoW.cmd
      - agentos_node/wow_slot_publisher.py
      - agentos_node/wow_reply_slot.py
      - tests/test_wow_pixel_probe.py
      - tests/test_wow_capture_probe.py
      - agentos_node/wow_capture_probe.py
      - scripts/capture_wow_status_probe.ps1
      - agentos_node/wow_bridge_protocol.py
      - governance/transport-routing.json
      - tests/test_transport_routing.py
      - governance/product-deployment-carriers.json
      - tests/test_product_deployment_carriers.py
      - docs/CHATGPT_ONE_TRANSPORT.md
      - AGENTS.md
      - docs/CURRENT_STATE.md
      - .github/workflows/transport-routing-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test transport authority resolver
        run: python3 -m unittest tests.test_transport_routing -v

      - name: Validate WoW bounded adapter and offline game UI
        run: python3 -m unittest tests.test_client_account_session tests.test_wow_control_adapter tests.test_wow_addon_shell tests.test_wow_bridge_protocol tests.test_wow_status_reply tests.test_wow_reply_slot tests.test_wow_slot_publisher tests.test_wow_offline_end_to_end tests.test_wow_offline_installer_contract tests.test_wow_offline_packaging tests.test_wow_pixel_probe tests.test_wow_capture_probe -v

      - name: Validate documentation coupling
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE="${PR_BASE_SHA:-}"
          if [[ -z "$BASE" ]]; then
            BASE="${PUSH_BEFORE_SHA:-}"
          fi
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            python3 scripts/documentation_reality_guard.py
          else
            python3 scripts/documentation_reality_guard.py --base "$BASE"
          fi

      - name: Assert policy forbids Actions for control-plane intents
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path('governance/transport-routing.json').read_text(encoding='utf-8'))
          control = policy['intent_classes']['control_plane']
          assert 'github_actions' not in control['allowed_transports']
          assert 'github_actions' in control['forbidden_implicit_fallbacks']
          assert policy['failure_semantics']['control_plane_transport_unavailable'] == 'fail_closed'
          assert policy['failure_semantics']['control_plane_transport_error'] == 'surface_error_no_workflow_fallback'
          PY

  deployment-carrier-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate product deployment carrier JSON
        run: python3 -m json.tool governance/product-deployment-carriers.json >/dev/null
      - name: Assert no-job legacy Actions noise is not transport evidence
        run: python3 -m unittest tests.test_product_deployment_carriers -v

  wow-offline-installer-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build allowlisted offline preview ZIP
        shell: pwsh
        run: |
          python scripts/build_wow_offline_installer.py --output "$env:RUNNER_TEMP\AgentOS-WoW-V1-preview.zip"
      - name: Verify and extract the packaged installer on Windows PowerShell 5.1
        shell: powershell
        run: |
          python -m unittest tests.test_wow_offline_packaging -v
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\AgentOS-WoW-V1-preview.zip" -DestinationPath "$env:RUNNER_TEMP\wow-installer" -Force
          $env:WOW_INSTALLER_ROOT=Join-Path "$env:RUNNER_TEMP\wow-installer" 'AgentOS-WoW-V1-preview'
          & "$env:GITHUB_WORKSPACE\tests\test_wow_offline_installer_windows.ps1"
      - name: Upload internal preview test artifact (not an official release)
        uses: actions/upload-artifact@v4
        with:
          name: wow-offline-installer-unverified-preview
          path: |
            ${{ runner.temp }}/AgentOS-WoW-V1-preview.zip
            ${{ runner.temp }}/AgentOS-WoW-V1-preview.zip.sha256
          retention-days: 3
