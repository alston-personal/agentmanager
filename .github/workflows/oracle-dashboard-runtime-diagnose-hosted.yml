name: Hosted Dashboard Runtime Diagnose

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/oracle-dashboard-runtime-diagnose-hosted.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect port 3000 runtime ownership
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== listener 3000 ==='
          ss -ltnp 2>&1 | grep ':3000' || true
          echo '=== next/node/npm processes ==='
          ps -eo user,pid,ppid,pgid,lstart,args | grep -E '[n]ext|[n]ode|[n]pm' | tail -n 80 || true
          echo '=== dashboard user service ==='
          systemctl --user --no-pager --full status agentos-dashboard.service 2>&1 || true
          echo '=== service MainPID ==='
          PID="$(systemctl --user show -p MainPID --value agentos-dashboard.service 2>/dev/null || true)"
          echo "service_main_pid=$PID"
          if [ -n "$PID" ] && [ "$PID" != 0 ] && [ -d "/proc/$PID" ]; then
            echo "service_cwd=$(readlink -f /proc/$PID/cwd || true)"
            tr '\0' ' ' < "/proc/$PID/cmdline" || true
            echo
          fi
          echo '=== port owner via fuser ==='
          fuser -v 3000/tcp 2>&1 || true
          echo '=== local route probes ==='
          for p in health 'bootstrap?node_id=__diag__'; do
            code=$(curl -sS -o /tmp/diag-body -w '%{http_code}' --max-time 5 "http://127.0.0.1:3000/dashboard/api/agentos/v1/$p" || true)
            echo "$p http=$code body=$(head -c 300 /tmp/diag-body | tr '\n' ' ')"
          done
          REMOTE

