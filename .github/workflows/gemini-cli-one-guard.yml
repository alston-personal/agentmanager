name: Gemini CLI ONE Guard

on:
  pull_request:
    paths:
      - 'agentos_node/gemini_cli_one_hook.py'
      - 'agentos_node/gemini_cli_install_provider.py'
      - 'scripts/install_gemini_cli_one.py'
      - 'scripts/install_oracle_gemini_cli_one.sh'
      - 'agent_core/executor_job_contract.py'
      - 'agentos_node/executor_job_action_relay.py'
      - 'tests/test_gemini_cli_one.py'
      - 'tests/test_gemini_cli_install_provider.py'
      - '.github/workflows/gemini-cli-one-guard.yml'
  push:
    branches:
      - core/issue-623-gemini-cli-one
    paths:
      - 'agentos_node/gemini_cli_one_hook.py'
      - 'agentos_node/gemini_cli_install_provider.py'
      - 'scripts/install_gemini_cli_one.py'
      - 'scripts/install_oracle_gemini_cli_one.sh'
      - 'agent_core/executor_job_contract.py'
      - 'agentos_node/executor_job_action_relay.py'
      - 'tests/test_gemini_cli_one.py'
      - 'tests/test_gemini_cli_install_provider.py'
      - '.github/workflows/gemini-cli-one-guard.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile candidate
        run: |
          python -m py_compile             agentos_node/gemini_cli_one_hook.py             agentos_node/gemini_cli_install_provider.py             scripts/install_gemini_cli_one.py
          bash -n scripts/install_oracle_gemini_cli_one.sh
      - name: Verify Gemini CLI ONE contracts
        run: |
          python -m unittest tests.test_gemini_cli_one -v
          python -m pytest -q tests/test_gemini_cli_install_provider.py
