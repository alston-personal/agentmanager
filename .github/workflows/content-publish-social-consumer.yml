name: Content Publish Social Consumer

on:
  pull_request:
    branches: [core/integration]
    paths:
      - 'config/content_publish_accounts.json'
      - 'agentos_node/content_publish_social_action_relay.py'
      - 'agentos_node/content_publish_social_executor.py'
      - 'runtime_core/content_publish_social.py'
      - 'runtime_core/content_publish_media.py'
      - 'tests/test_content_publish_social_executor.py'
      - 'agentos_node/executor_job_action_relay.py'
      - 'agentos_node/runtime_converge_action_relay.py'
      - 'agent_core/runtime_converge_capability.py'
      - 'scripts/install_action_relay_user.sh'
      - 'scripts/reconcile_action_relay_runtime.py'
      - 'tests/test_content_publish_social_action_relay.py'
      - 'tests/test_runtime_converge_capability.py'
      - 'tests/test_action_relay_generation_reconcile.py'
      - '.github/workflows/content-publish-social-consumer.yml'
  push:
    branches: [core/integration]
    paths:
      - 'config/content_publish_accounts.json'
      - 'agentos_node/content_publish_social_action_relay.py'
      - 'agentos_node/executor_job_action_relay.py'
      - 'agentos_node/runtime_converge_action_relay.py'
      - 'agent_core/runtime_converge_capability.py'
      - 'scripts/install_action_relay_user.sh'
      - 'scripts/reconcile_action_relay_runtime.py'
      - '.github/workflows/content-publish-social-consumer.yml'

permissions:
  contents: read
  id-token: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - run: >-
          python -m pytest -q
          tests/test_content_publish_social_action_relay.py
          tests/test_content_publish_social_executor.py
          tests/test_runtime_converge_capability.py
          tests/test_action_relay_generation_reconcile.py

  bootstrap-live-account:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      ACCOUNT_REF: oursong_alstonhuang
      AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos
    steps:
      - uses: actions/checkout@v4

      - name: Preflight Runner Window client
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/core/integration'
          printf '%s' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          bash -n scripts/agentos_dispatch.sh scripts/reconcile_content_social_account_user.sh
          echo 'content_social_ingress=runner-window'

      - name: Mint GitHub OIDC Runner Window credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Dispatch live account reconciliation
        shell: bash
        run: |
          set -euo pipefail
          AGENTOS_DISPATCH_WAIT_SECONDS=900             bash scripts/agentos_dispatch.sh               content.social reconcile "$GITHUB_SHA"               account_ref="$ACCOUNT_REF"               > "$RUNNER_TEMP/content-social-roundtrip.txt"
          cat "$RUNNER_TEMP/content-social-roundtrip.txt"

          python3 - "$RUNNER_TEMP/content-social-roundtrip.txt" "$GITHUB_SHA" <<'PY'
          import json,sys
          docs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.lstrip().startswith('{')]
          result=docs[-1]
          receipt=result.get('receipt') or {}
          assert receipt.get('source_commit')==sys.argv[2],receipt
          assert receipt.get('ok') is True,receipt
          scheduler=receipt.get('scheduler') or {}
          assert scheduler.get('worker_role')=='control',scheduler
          evidence=set(receipt.get('evidence') or [])
          for marker in (
              'content_social_converge=PASS',
              'action_relay_generation=PASS',
              'content_social_bootstrap=PASS',
              'content_social_account_inspect=PASS',
              'content_social_reconcile=PASS',
          ):
              assert marker in evidence,(marker,evidence)
          print('content_social_runner_window=PASS')
          print('content_social_worker='+str(scheduler.get('worker_id') or 'unknown'))
          PY

      - name: Upload bounded reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-social-runner-window-${{ github.run_id }}
          path: ${{ runner.temp }}/content-social-roundtrip.txt
          if-no-files-found: warn
          retention-days: 14
