name: Oracle Register LayoutLib Project

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-register-layoutlib.yml'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Validate SSH configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo 'Missing deploy host'; exit 1; }
          test -n "$DEPLOY_USER" || { echo 'Missing deploy user'; exit 1; }
          echo "DEPLOY_PORT=${DEPLOY_PORT:-22}" >> "$GITHUB_ENV"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Trust Oracle host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Create and register layoutlib
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          PROJECT=layoutlib
          DISPLAY='LayoutLib'
          ROOT=/home/ubuntu/agentmanager
          DATA=/home/ubuntu/agent-data

          test -f "$ROOT/scripts/register_project.py" || { echo "register_project.py missing"; exit 1; }
          test -f "$ROOT/scripts/init_project_yaml.py" || { echo "init_project_yaml.py missing"; exit 1; }

          cd "$ROOT"
          AGENTMANAGER_ROOT="$ROOT" AGENT_DATA_ROOT="$DATA" \
            python3 scripts/register_project.py "$PROJECT" \
              --display-name "$DISPLAY" \
              --status '🆕 Registered' \
              --type-icon '🏠' \
              --summary 'Floor-plan parsing library: ingest layout images, emit spatial IR, and generate 3D models.'

          AGENT_DATA_ROOT="$DATA" python3 scripts/init_project_yaml.py --project "$PROJECT"

          YAML="$DATA/projects/$PROJECT/project.yaml"
          test -f "$YAML" || { echo "project.yaml missing after registration"; exit 1; }

          python3 - "$YAML" <<'PY'
          import sys, yaml
          from pathlib import Path
          p = Path(sys.argv[1])
          d = yaml.safe_load(p.read_text(encoding='utf-8')) or {}
          d['display_name'] = 'LayoutLib'
          d['actual_code_path'] = '/home/ubuntu/layoutlib'
          d['repo_url'] = None
          d['repo_visibility'] = None
          d['repository_state'] = 'local-only'
          d['repository_state_reason'] = 'Oracle project bootstrap created before separate GitHub repository provisioning.'
          d['summary'] = 'Floor-plan parsing library: ingest layout images, emit spatial IR, and generate 3D models.'
          p.write_text(yaml.safe_dump(d, allow_unicode=True, sort_keys=False), encoding='utf-8')
          PY

          mkdir -p /home/ubuntu/layoutlib

          echo '=== VERIFY ==='
          test -d /home/ubuntu/layoutlib
          test -f "$DATA/projects/$PROJECT/STATUS.md"
          test -d "$DATA/projects/$PROJECT/memory"
          test -f "$YAML"
          test -L "$ROOT/workspace/$PROJECT"
          grep -q 'LayoutLib' "$DATA/DASHBOARD.md"
          grep -q 'repository_state: local-only' "$YAML"
          echo "layoutlib registration verified"
          echo "code_path=/home/ubuntu/layoutlib"
          echo "status_path=$DATA/projects/$PROJECT/STATUS.md"
          echo "metadata_path=$YAML"
          REMOTE
