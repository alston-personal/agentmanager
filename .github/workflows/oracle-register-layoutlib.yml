name: Oracle Build and Verify LayoutLib

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oracle-register-layoutlib.yml'
      - 'scripts/bootstrap_layoutlib.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oracle-register-layoutlib.yml'
      - 'scripts/bootstrap_layoutlib.py'

permissions:
  contents: write

jobs:
  build-test-register:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build, test, document, register, and verify on Oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT="$PWD/.agentos/evidence/layoutlib-validation.txt"
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "hostname=$(hostname)"
            echo "identity=$(id)"
            echo "python=$(python3 --version 2>&1)"

            ROOT=/home/ubuntu/agentmanager
            DATA=/home/ubuntu/agent-data
            CODE=/home/ubuntu/layoutlib
            BOOT="$PWD/scripts/bootstrap_layoutlib.py"

            MODE=direct
            if ! test -w /home/ubuntu || ! test -w "$DATA" || ! test -w "$ROOT"; then
              if command -v sudo >/dev/null && sudo -n -u ubuntu true 2>/dev/null; then
                MODE=sudo
              else
                echo "oracle_write_gate=FAIL"
                stat -c '%n owner=%U group=%G mode=%a' /home/ubuntu "$ROOT" "$DATA" || true
                exit 2
              fi
            fi
            echo "oracle_write_mode=$MODE"

            run_owner() {
              if [ "$MODE" = sudo ]; then sudo -n -u ubuntu "$@"; else "$@"; fi
            }

            test -f "$ROOT/scripts/register_project.py"
            test -f "$ROOT/scripts/init_project_yaml.py"
            test -f "$BOOT"

            run_owner env AGENTMANAGER_ROOT="$ROOT" AGENT_DATA_ROOT="$DATA" \
              python3 "$ROOT/scripts/register_project.py" layoutlib \
              --display-name LayoutLib --status '🧪 MVP Validation' --type-icon '🏠' \
              --summary 'Floor-plan raster -> versioned Spatial IR -> 3D OBJ.'
            run_owner env AGENT_DATA_ROOT="$DATA" python3 "$ROOT/scripts/init_project_yaml.py" --project layoutlib || true
            run_owner python3 "$BOOT" --target "$CODE"

            echo '=== TESTS ==='
            run_owner env PYTHONPATH="$CODE/src" python3 -m unittest discover -s "$CODE/tests" -v
            run_owner env PYTHONPATH="$CODE/src" python3 "$CODE/examples/generate_demo.py"

            IR="$CODE/examples/demo_room.ir.json"
            OBJ="$CODE/examples/demo_room.obj"
            test -s "$IR"; test -s "$OBJ"
            WALLS=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["walls"]))' "$IR")
            VERTICES=$(grep -c '^v ' "$OBJ")
            FACES=$(grep -c '^f ' "$OBJ")
            test "$WALLS" = 4
            test "$VERTICES" = 32
            test "$FACES" = 24

            run_owner env PYTHONPATH="$CODE/src" python3 -m layoutlib.cli parse "$CODE/tests/fixtures/demo_room.pgm" --out /tmp/layoutlib-smoke.ir.json --meters-per-pixel 0.02 --min-wall-length-px 30
            run_owner env PYTHONPATH="$CODE/src" python3 -m layoutlib.cli obj /tmp/layoutlib-smoke.ir.json --out /tmp/layoutlib-smoke.obj
            test -s /tmp/layoutlib-smoke.ir.json; test -s /tmp/layoutlib-smoke.obj

            YAML="$DATA/projects/layoutlib/project.yaml"
            STATUS="$DATA/projects/layoutlib/STATUS.md"
            test -f "$YAML"; test -f "$STATUS"
            run_owner python3 - "$YAML" <<'PY'
          import sys, yaml
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path(sys.argv[1]); d=yaml.safe_load(p.read_text(encoding='utf-8')) or {}; now=datetime.now(timezone.utc).isoformat()
          d.update({'display_name':'LayoutLib','phase':'active','status':'✅ MVP Validated','actual_code_path':'/home/ubuntu/layoutlib','repo_url':None,'repo_visibility':None,'repository_state':'local-only','repository_state_reason':'MVP validated on Oracle; separate GitHub repository not yet provisioned.','summary':'Validated v0.1: high-contrast orthogonal raster -> Spatial IR JSON -> OBJ.','current_focus':'Real-world benchmark and semantic/opening detection.','next_action':'Benchmark labeled real floor plans before claiming general support.','updated_at':now})
          d['health']={'freshness':'fresh','sync_state':'oracle_mvp_validated','last_verified_at':now}
          p.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False),encoding='utf-8')
          PY

            echo '=== ACCEPTANCE ==='
            echo "layoutlib_validation=PASS"
            echo "unit_tests=5_passed"
            echo "demo_walls=$WALLS"
            echo "obj_vertices=$VERTICES"
            echo "obj_faces=$FACES"
            echo "library=$CODE/src/layoutlib"
            echo "readme=$CODE/README.md"
            echo "docs=$CODE/docs"
            echo "metadata=$YAML"
          } 2>&1 | tee "$OUT"

      - name: Upload validation evidence to branch
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/layoutlib-validation.txt
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(layoutlib): Oracle MVP validation'
          git push
