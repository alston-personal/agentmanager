name: Diagnostic 1682 Retired LayoutLab Workflow
on:
  pull_request:
    paths:
      - '.github/workflows/oracle-layoutlab-official-v2.yml'
      - '.github/workflows/diagnostic-1682-layoutlab-retired.yml'
permissions:
  contents: read
jobs:
  no-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm legacy deployment is retired
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/oracle-layoutlab-official-v2.yml').read_text()
          assert 'workflow_dispatch:' in s
          assert 'runs-on: ubuntu-latest' in s
          assert 'RETIRED:' in s
          for forbidden in ('self-hosted','contents: write','scripts/deploy_layoutlab_official_v2.py','  push:','gh repo','ssh '):
              assert forbidden not in s, forbidden
          print('layoutlab_retired_workflow=PASS')
          PY
