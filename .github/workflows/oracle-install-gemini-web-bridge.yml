name: Oracle Install Gemini Web Bridge

on:
  push:
    branches:
      - core/integration
    paths:
      - '.github/workflows/oracle-install-gemini-web-bridge.yml'
      - 'agentos_node/web_agent_surface.py'
      - 'agentos_node/gemini_web_bridge.py'
      - 'agentos_node/session_bridge.py'
      - 'agentos_node/agent_surfaces.py'
      - 'agentos_node/bootstrap_control.py'
      - 'agentos_node/bootstrap_scheduler.py'
      - 'scripts/install_gemini_web_bridge_user.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-gemini-web-bridge-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Install exact Gemini web bridge generation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" \
            bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          CORE_SHA="$1"
          REPO=/home/ubuntu/agentmanager
          TMP=/tmp/install_gemini_web_bridge_user.sh
          git -C "$REPO" fetch --no-tags origin "$CORE_SHA" >/dev/null
          git -C "$REPO" show "$CORE_SHA:scripts/install_gemini_web_bridge_user.sh" > "$TMP"
          chmod 700 "$TMP"
          AGENTOS_SOURCE_COMMIT="$CORE_SHA" AGENTOS_REPO="$REPO" "$TMP"
          rm -f "$TMP"
          REMOTE
      - name: Verify bridge service
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          systemctl --user is-active --quiet agentos-gemini-web-bridge.service
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path.home()/'.local/share/agentos/gemini-web/bridge/bridge.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('provider')=='gemini-web',d
          assert d.get('ready') is True,d
          print('gemini_web_bridge_service=PASS')
          PY
          REMOTE

      - name: Probe Gemini Web through AgentOS scheduler
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID="gemini-web-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RECEIPT="$RUNNER_TEMP/gemini-web-probe.json"
          AGENTOS_RECEIPT_TIMEOUT_SECONDS=180 \
            bash scripts/submit_oracle_bootstrap_request_remote.sh \
              agentos.gemini_web.probe "$REQUEST_ID" "$GITHUB_SHA" '{}' > "$RECEIPT"
          python3 - "$RECEIPT" "$GITHUB_ENV" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r.get('ok') is True,r
          scheduler=r.get('scheduler') or {}
          assert scheduler.get('worker_role')=='gui',scheduler
          assert scheduler.get('worker_id')=='oracle-gui',scheduler
          text='\n'.join(str(s.get('stdout') or '')+'\n'+str(s.get('stderr') or '') for s in r.get('steps',[]))
          states=[x for x in text.splitlines() if x.startswith('gemini_web_session_state=')]
          assert states,text[-12000:]
          state=states[-1].split('=',1)[1].strip()
          print('gemini_web_probe_receipt=PASS')
          print('gemini_web_scheduler_lane=oracle-gui')
          print('gemini_web_session_state='+state)
          with open(sys.argv[2],'a',encoding='utf-8') as h:
              h.write('GEMINI_WEB_STATE='+state+'\n')
          PY

      - name: Accept Gemini Web session provider
        if: env.GEMINI_WEB_STATE == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID="gemini-web-accept-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RECEIPT="$RUNNER_TEMP/gemini-web-accept.json"
          AGENTOS_RECEIPT_TIMEOUT_SECONDS=180 \
            bash scripts/submit_oracle_bootstrap_request_remote.sh \
              agentos.gemini_web.session.acceptance "$REQUEST_ID" "$GITHUB_SHA" '{}' > "$RECEIPT"
          python3 - "$RECEIPT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r.get('ok') is True,r
          scheduler=r.get('scheduler') or {}
          assert scheduler.get('worker_role')=='gui',scheduler
          assert scheduler.get('worker_id')=='oracle-gui',scheduler
          text='\n'.join(str(s.get('stdout') or '')+'\n'+str(s.get('stderr') or '') for s in r.get('steps',[]))
          required=[
              'gemini_web_discover=PASS',
              'gemini_web_attach=PASS',
              'gemini_web_inspect=PASS',
              'gemini_web_inject_draft=PASS',
              'gemini_web_inject_cleanup=PASS',
              'gemini_web_receipt=PASS',
              'gemini_web_session_acceptance=PASS',
          ]
          for marker in required:
              assert marker in text,(marker,text[-12000:])
          print('gemini_web_session_provider_mvp=PASS')
          print('gemini_web_scheduler_lane=oracle-gui')
          PY

      - name: Start governed Gemini login handoff
        if: env.GEMINI_WEB_STATE == 'LOGIN_REQUIRED'
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID="gemini-web-login-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RECEIPT="$RUNNER_TEMP/gemini-web-login.json"
          AGENTOS_RECEIPT_TIMEOUT_SECONDS=180 \
            bash scripts/submit_oracle_bootstrap_request_remote.sh \
              agentos.gemini_web.login.start "$REQUEST_ID" "$GITHUB_SHA" '{}' > "$RECEIPT"
          python3 - "$RECEIPT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r.get('ok') is True,r
          scheduler=r.get('scheduler') or {}
          assert scheduler.get('worker_role')=='gui',scheduler
          assert scheduler.get('worker_id')=='oracle-gui',scheduler
          text='\n'.join(str(s.get('stdout') or '')+'\n'+str(s.get('stderr') or '') for s in r.get('steps',[]))
          assert 'gemini_web_login=HUMAN_REQUIRED' in text,text[-12000:]
          assert 'gemini_web_handoff=desktop.remote_view' in text,text[-12000:]
          print('gemini_web_session_provider_mvp=LOGIN_REQUIRED')
          print('gemini_web_login_handoff=PASS')
          print('gemini_web_handoff_required=true')
          PY
