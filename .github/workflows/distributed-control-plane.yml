name: Distributed Control Plane
on:
  pull_request:
    paths:
      - 'agent_core/**'
      - 'agentos_node/control_plane_client.py'
      - 'runtime_core/**'
      - 'scripts/*distributed*'
      - 'tests/test_*'
      - '.github/workflows/distributed-control-plane.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest pyyaml
      - run: >-
          python -m pytest -q
          tests/test_control_plane_convergence.py
          tests/test_agentos_public_entry.py tests/test_agentos_shared_auth_bridge.py
          tests/test_account_realm_onboarding.py
          tests/test_platform_realm_review.py
          tests/test_approved_realm_bootstrap.py
          tests/test_virtual_one_nodes.py
          tests/test_control_plane_release_acceptance.py
          tests/test_distributed_control_plane.py tests/test_distributed_gateway.py
          tests/test_distributed_runtime.py tests/test_project_state.py
          tests/test_project_state_http.py tests/test_runtime_dispatcher.py
          tests/test_dispatching_gateway.py tests/test_push_dispatch.py
          tests/test_push_task_lease.py tests/test_continuity_mirror.py
          tests/test_executor_working_set.py tests/test_control_plane.py
          tests/test_node_registry_v01.py tests/test_node_registry_recovery.py
          tests/test_runtime_ownership.py tests/test_control_plane_inspection.py
      - run: bash -n scripts/deploy_distributed_control_plane.sh
