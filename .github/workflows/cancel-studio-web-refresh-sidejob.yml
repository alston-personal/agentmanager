name: Cancel Studio Web Refresh Sidejob

on:
  push:
    paths:
      - '.github/workflows/cancel-studio-web-refresh-sidejob.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only the known queued Layout Lab sidejob
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=32911129113
          code=$(curl -sS -o /tmp/cancel.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPO/actions/runs/$RUN_ID/cancel")
          echo "cancel_http=$code"
          cat /tmp/cancel.out || true
          test "$code" = 202 || test "$code" = 409
