name: Dashboard 502 Diagnostic

on:
  pull_request:
    branches: [core/integration]
    paths: ['.github/workflows/dashboard-502-diagnostic.yml']

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect dashboard around 13:50
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=$(mktemp)
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' >"$out" 2>&1 <<'REMOTE'
          set -euo pipefail
          echo '=== unit state ==='
          systemctl --user show agentos-dashboard.service -p ActiveState -p SubState -p MainPID -p NRestarts -p ExecMainStartTimestamp --no-pager || true
          echo '=== listener ==='
          ss -ltnp '( sport = :3000 )' || true
          echo '=== dashboard journal 13:48-13:52 ==='
          journalctl --user -u agentos-dashboard.service --since '2026-10-02 13:48:00' --until '2026-10-02 13:52:30' --no-pager || true
          echo '=== nginx errors 13:48-13:52 ==='
          grep '2026/10/02 13:5' /var/log/nginx/error.log 2>/dev/null | tail -120 || true
          REMOTE
          cat "$out"
          { echo '### Dashboard 502 around 13:50'; echo; echo '```text'; cat "$out"; echo '```'; } >/tmp/diag.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /tmp/diag.md