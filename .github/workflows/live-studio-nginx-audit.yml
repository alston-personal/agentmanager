name: Live Studio Nginx Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-studio-nginx-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Capture live nginx and site routing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/live-studio-nginx-2026-10-02.txt
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "hostname=$(hostname)"
            echo "identity=$(id)"
            echo "=== sites-enabled symlink ==="
            ls -l /etc/nginx/sites-enabled/studio.milkcat.org || true
            echo "=== sites-enabled content ==="
            cat /etc/nginx/sites-enabled/studio.milkcat.org || true
            echo "=== nginx -T studio blocks ==="
            nginx -T 2>&1 | awk '
              /server_name studio\.milkcat\.org/ {show=1}
              show {print}
              show && /^}/ {show=0; print "---"}
            ' || true
            echo "=== current production path probes ==="
            for p in / /agentos/join.md /.well-known/agentos.json; do
              echo "--- $p"
              curl -sS -D - -o /tmp/body "https://studio.milkcat.org$p" | sed -n '1,20p' || true
              echo "BODY_HEAD:"
              head -c 500 /tmp/body 2>/dev/null || true
              echo
            done
            echo "=== likely roots ==="
            for d in /home/ubuntu/studio-web/dist /home/ubuntu/zeus-writer/website/dist; do
              echo "--- $d"
              if [ -d "$d" ]; then
                find "$d" -maxdepth 3 \( -path '*/agentos/join.md' -o -path '*/.well-known/agentos.json' \) -print -exec sh -c 'echo FILE=$1; head -n 8 "$1"' _ {} \;
              else
                echo "MISSING"
              fi
            done
          } | tee "$OUT"
      - name: Commit live evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/live-studio-nginx-2026-10-02.txt
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(nginx): capture live studio routing 2026-10-02'
          git pull --rebase origin main
          git push origin HEAD:main
