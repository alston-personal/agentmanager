name: Diagnostic 1682 Realm Fabric
on:
  pull_request:
    paths:
      - 'agent_core/realm_fabric.py'
      - 'tests/test_realm_fabric.py'
      - 'tests/test_realm_fabric_receipt_archive.py'
      - '.github/workflows/diagnostic-1682-realm-fabric.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v tests.test_realm_fabric tests.test_realm_fabric_receipt_archive
