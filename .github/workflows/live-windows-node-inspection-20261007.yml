name: Live Windows Node Inspection 20261007

on:
  push:
    branches:
      - ops/live-windows-node-inspection-20261007

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 5
    env:
      AGENT_DATA_ROOT: /home/ubuntu/agent-data
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live Windows nodes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from agent_core.node_registry import NodeRegistry

          node_map = NodeRegistry().node_map()
          wanted = {'vopc5750', 'VO10005870'}
          picked = [
              node for node in (node_map.get('nodes') or [])
              if isinstance(node, dict) and node.get('node_id') in wanted
          ]

          print(json.dumps({
              'schema': 'agentos.windows-node-live-inspection/v1',
              'realm_id': node_map.get('realm_id'),
              'node_count': node_map.get('node_count'),
              'online_node_count': node_map.get('online_node_count'),
              'nodes': picked,
          }, indent=2, sort_keys=True))
          PY
      - name: Invoke semantic preview through ONE
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, uuid
          from agent_core.realm_fabric import RealmFabricStore

          fabric = RealmFabricStore()
          task_id = 'task-live-semantic-' + uuid.uuid4().hex
          task = {
              'schema': 'agentos.node-task/v0.1',
              'task_id': task_id,
              'action': 'desktop.semantic_preview',
              'max_pixels': 160000,
          }
          queued = fabric.queue_task('vopc5750', task)
          receipt = None
          deadline = time.time() + 45
          while time.time() < deadline:
              receipt = fabric.get_receipt(task_id)
              if receipt:
                  break
              time.sleep(1)

          if not receipt:
              raise SystemExit('semantic_preview receipt timeout')

          evidence = {
              'task_id': task_id,
              'queued_at': queued.get('queued_at'),
              'receipt': receipt,
          }
          print(json.dumps(evidence, indent=2, sort_keys=True))

          required = {
              'ok': bool(receipt.get('ok')),
              'read_only': receipt.get('read_only') is True,
              'mode_present': bool(receipt.get('mode')),
              'state_hash_present': bool(receipt.get('state_hash')),
              'foreground_present': isinstance(receipt.get('foreground'), dict),
              'preview_present': isinstance(receipt.get('preview'), dict),
          }
          print('SEMANTIC_PREVIEW_ACCEPTANCE=' + json.dumps(required, sort_keys=True))
          if not all(required.values()):
              raise SystemExit('semantic_preview acceptance failed')
          PY
