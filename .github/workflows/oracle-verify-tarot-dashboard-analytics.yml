name: Oracle Verify Tarot Dashboard Analytics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-verify-tarot-dashboard-analytics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    env:
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Verify protected Tarot summary from actual Dashboard Unix identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_USER"
          PORT="$DEPLOY_PORT"; test -n "$PORT" || PORT=22
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "$DEPLOY_USER@127.0.0.1" bash -s <<'REMOTE'
          set -euo pipefail
          sudo -n python3 - <<'PY'
          import json, os, pathlib, pwd, re, stat, subprocess, urllib.error, urllib.request
          def owner_of(port):
              raw=subprocess.run(['ss','-H','-ltnp','sport = :'+str(port)],capture_output=True,text=True,check=True).stdout
              pids=set(int(p) for p in re.findall(r'pid=(\d+)',raw))
              assert len(pids)==1, 'listener_not_unique'
              pid=pids.pop()
              return pathlib.Path('/proc')/str(pid)
          dashboard=owner_of(3000)
          tarot=owner_of(8088)
          assert pathlib.Path(os.readlink(dashboard/'cwd'))==pathlib.Path('/home/ubuntu/agentmanager/dashboard')
          assert pathlib.Path(os.readlink(tarot/'cwd'))==pathlib.Path('/home/ubuntu/leopardcat-tarot/website')
          account=pwd.getpwnam('ubuntu')
          assert dashboard.stat().st_uid==account.pw_uid and tarot.stat().st_uid==account.pw_uid
          print('dashboard_tarot_process_ownership=PASS')
          PY
          sudo -n -u ubuntu python3 - <<'PY'
          import json, os, pathlib, stat, urllib.error, urllib.request
          token_file=pathlib.Path.home()/'.config/milkcat/leopardcat-analytics-token'
          metadata=token_file.lstat()
          assert stat.S_ISREG(metadata.st_mode) and not stat.S_ISLNK(metadata.st_mode)
          assert metadata.st_uid==os.getuid() and (metadata.st_mode&0o077)==0
          token=token_file.read_text(encoding='utf8').strip()
          assert len(token)>=32
          url='http://127.0.0.1:8088/api/v1/analytics/summary?days=30'
          req=urllib.request.Request(url,headers={'X-Analytics-Token':token})
          with urllib.request.urlopen(req,timeout=8) as response:
              aggregate=json.load(response)
              assert response.status==200
          assert type(aggregate.get('total_readings')) is int and isinstance(aggregate.get('by_source'),dict)
          print('dashboard_user_tarot_private_summary=PASS aggregate_schema=VALID')
          try:
              urllib.request.urlopen(url,timeout=8)
              raise AssertionError('anonymous_tarot_summary_exposed')
          except urllib.error.HTTPError as error:
              assert error.code==403
          print('tarot_summary_anonymous_denial=PASS status=403')
          PY
          code=$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:3000/dashboard/api/admin/usage)
          test "$code" = 401
          echo 'dashboard_anonymous_admin_denial=PASS status=401'
          sudo -n systemctl is-active --quiet milkcat-leopardcat-analytics.service
          echo 'tarot_managed_service=PASS'
          echo 'tarot_dashboard_end_to_end=PASS'
          REMOTE
