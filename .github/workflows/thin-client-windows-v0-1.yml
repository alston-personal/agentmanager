name: Thin Client Windows v0.1

on:
  push:
    paths:
      - 'agentos_node/thin_client.py'
      - 'agentos_node/thin_client_transport.py'
      - 'agentos_node/client_cli.py'
      - 'scripts/install_thin_client_windows.ps1'
      - '.github/workflows/thin-client-windows-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install from canonical public bootstrap
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'AgentOS'
          $workspace = Join-Path $env:RUNNER_TEMP 'AgentOS-Workspace'
          & ./scripts/install_thin_client_windows.ps1 -InstallRoot $root -WorkspaceRoot $workspace
          if (-not (Test-Path (Join-Path $root 'agentos-client.cmd'))) { throw 'launcher missing' }
          if (-not (Test-Path (Join-Path $root 'state\policy.json'))) { throw 'policy missing' }
          & (Join-Path $root 'agentos-client.cmd') --help
      - name: Verify installed package in isolation
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'AgentOS'
          $env:PYTHONPATH = $root
          $env:AGENTOS_CLIENT_HOME = Join-Path $root 'state'
          Push-Location $env:RUNNER_TEMP
          try {
            python -c "import agentos_node.thin_client as t; import pathlib; p=pathlib.Path(t.__file__).resolve(); root=pathlib.Path(r'$env:RUNNER_TEMP')/'AgentOS'; assert str(p).lower().startswith(str(root.resolve()).lower()), (p,root); print('installed_import='+str(p))"
            python -c "from agentos_node.thin_client import ThinClient,ThinClientPolicy,NodeIdentity; from pathlib import Path; p=ThinClientPolicy(allowed_executables={'python'},readable_roots=(Path(r'$env:RUNNER_TEMP'),)); c=ThinClient(NodeIdentity('test-realm','windows-ci'),p); m=c.capability_manifest(); assert m['platform']=='Windows'; assert 'shell.exec' in m['capabilities']; print('windows_thin_client=PASS')"
          } finally {
            Pop-Location
          }
