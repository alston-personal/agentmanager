# Thin consumer for the shared Studio static-route production release capability.
name: Oracle Release Invoice Intake Demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-release-invoice-intake-demo.yml'
      - '.github/workflows/reusable-studio-static-route-release.yml'

permissions:
  contents: read

concurrency:
  group: invoice-intake-demo-production
  cancel-in-progress: true

jobs:
  release:
    uses: ./.github/workflows/reusable-studio-static-route-release.yml
    with:
      source_sha: 922410f1913408faf9b5791f476a271cf51625da
      route: invoice-intake
      backup_key: invoice-intake-demo
      receipt_schema: studio-web.invoice-intake-release/v1
      acceptance_anchors: |-
        發票登錄 Demo
        INVOICE INTAKE · MVP
        id="invoice-file"
        原始發票
        Demo 覆核清單
        /api/invoice-intake/v1/status
      credit_account: ''
      credit_cost: 0
    secrets:
      AGENTOS_DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER }}
      AGENTOS_DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT }}
      AGENTOS_DEPLOY_SSH_KEY: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY }}
      N8N_DEPLOY_USER: ${{ secrets.N8N_DEPLOY_USER }}
      N8N_DEPLOY_SSH_PORT: ${{ secrets.N8N_DEPLOY_SSH_PORT }}
      N8N_DEPLOY_SSH_KEY: ${{ secrets.N8N_DEPLOY_SSH_KEY }}
