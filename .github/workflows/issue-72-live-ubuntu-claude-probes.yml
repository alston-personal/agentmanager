name: Issue 72 Live Ubuntu Claude Probes

on:
  push:
    branches: [core/issue-72-claude-liveness]
    paths: [.github/workflows/issue-72-live-ubuntu-claude-probes.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-72-live-ubuntu-claude-probes
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/issue-72-claude-liveness
          fetch-depth: 0

      - name: Validate fixed Ubuntu diagnostic channel
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST_SOURCE:-}"
          test -n "${DEPLOY_USER:-}"
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Run three fixed sanitized probes as ubuntu
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/issue-72-live-claude-probes.json
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" /usr/bin/python3 - <<'PY' > "$OUT"
          import hashlib
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          import time

          if os.environ.get('USER') != 'ubuntu' or Path.home() != Path('/home/ubuntu'):
              raise SystemExit('diagnostic must execute as ubuntu with /home/ubuntu')

          runtime = Path('/home/ubuntu/.local/share/agentos/runtime-vnext')
          manifest_path = runtime / 'runtime-provenance.json'
          sys.path.insert(0, str(runtime))
          from agentos_node.antigravity_relay_worker import discover_executor

          MARKER='AGENTOS_CLAUDE_LIVENESS_PASS'

          def digest(value):
              return hashlib.sha256(value.encode('utf-8', errors='replace')).hexdigest()

          def run_probe(argv, command_class, timeout, marker=None):
              started=time.monotonic()
              proc=subprocess.Popen(
                  argv,
                  cwd='/home/ubuntu/agentmanager',
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  start_new_session=True,
                  env={**os.environ,
                       'HOME':'/home/ubuntu',
                       'XDG_RUNTIME_DIR':'/run/user/1001',
                       'DBUS_SESSION_BUS_ADDRESS':'unix:path=/run/user/1001/bus'},
              )
              timed_out=False
              try:
                  stdout,stderr=proc.communicate(timeout=timeout)
                  rc=int(proc.returncode)
              except subprocess.TimeoutExpired:
                  timed_out=True
                  try:
                      os.killpg(proc.pid, signal.SIGTERM)
                  except ProcessLookupError:
                      pass
                  try:
                      stdout,stderr=proc.communicate(timeout=3)
                  except subprocess.TimeoutExpired:
                      try:
                          os.killpg(proc.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      stdout,stderr=proc.communicate()
                  rc=124
              stdout=stdout or ''
              stderr=stderr or ''
              lowered=(stdout+'\n'+stderr).lower()
              unsupported=any(token in lowered for token in (
                  'unknown option','unknown command','unrecognized option',
                  'unrecognized command','invalid option','no such command'))
              row={
                  'command_class':command_class,
                  'returncode':rc,
                  'timed_out':timed_out,
                  'elapsed_ms':int((time.monotonic()-started)*1000),
                  'stdout_bytes':len(stdout.encode('utf-8',errors='replace')),
                  'stderr_bytes':len(stderr.encode('utf-8',errors='replace')),
                  'stdout_sha256':digest(stdout),
                  'stderr_sha256':digest(stderr),
                  'supported':not unsupported,
              }
              if marker is not None:
                  row['expected_marker']=marker
                  row['marker_present']=marker in stdout
              if command_class == 'auth_status':
                  if unsupported:
                      state='unsupported'
                  elif any(token in lowered for token in ('not logged in','not authenticated','unauthenticated','login required')):
                      state='not_authenticated'
                  elif any(token in lowered for token in ('logged in','authenticated')):
                      state='authenticated'
                  elif rc == 0 and not timed_out:
                      state='status_ok_unclassified'
                  else:
                      state='unknown'
                  row['auth_state']=state
              return row

          provider,executor=discover_executor('claude')
          if provider != 'claude' or not executor:
              raise SystemExit('Claude executor unavailable from live runtime discovery')
          binary=executor[0]

          version='unknown'
          prefix='anthropic.claude-code-'; suffix='-linux-arm64'
          for part in Path(binary).parts:
              if part.startswith(prefix) and part.endswith(suffix):
                  version=part[len(prefix):-len(suffix)]
                  break

          prompt=f'Return exactly {MARKER}. Do not use tools.'
          probes={}
          probes['auth_status']=run_probe([binary,'auth','status'],'auth_status',20)
          probes['headless_print']=run_probe(
              [binary,'--bare','--print','--output-format','text','--effort','low',prompt],
              'headless_print',30,MARKER)
          probes['restricted_headless_print']=run_probe(
              [binary,'--restricted','--bare','--print','--output-format','text','--effort','low',prompt],
              'restricted_headless_print',30,MARKER)

          manifest={}
          if manifest_path.is_file():
              try:
                  raw=json.loads(manifest_path.read_text(encoding='utf-8'))
                  manifest={k:raw.get(k) for k in ('schema','source_ref','source_commit','provider','worker_sha256')}
              except Exception:
                  manifest={'readable':False}

          payload={
              'schema':'agentos.claude-liveness-diagnostic/v1',
              'issue':72,
              'executor_user':'ubuntu',
              'executor_version':version,
              'runtime_provenance':manifest,
              'probes':probes,
              'raw_output_persisted':False,
              'arbitrary_argv':False,
              'timeout_increased':False,
          }
          print(json.dumps(payload,sort_keys=True,indent=2))
          PY
          python3 - "$OUT" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['executor_user']=='ubuntu'
          assert p['raw_output_persisted'] is False
          assert p['arbitrary_argv'] is False
          assert p['timeout_increased'] is False
          print(json.dumps({
              'executor_version':p['executor_version'],
              'auth_state':p['probes']['auth_status'].get('auth_state'),
              'normal':{k:p['probes']['headless_print'][k] for k in ('returncode','timed_out','marker_present','elapsed_ms')},
              'restricted':{k:p['probes']['restricted_headless_print'][k] for k in ('returncode','timed_out','supported','marker_present','elapsed_ms')},
          },indent=2))
          PY

      - name: Persist sanitized diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/issue-72-live-claude-probes.json || exit 1
          mkdir -p .agentos/evidence/core
          cp /tmp/issue-72-live-claude-probes.json .agentos/evidence/core/issue-72-live-claude-probes.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agentos/evidence/core/issue-72-live-claude-probes.json
          git commit -m 'evidence(agentos): record sanitized live Claude probes for #72' || exit 0
          git push origin HEAD:core/issue-72-claude-liveness
