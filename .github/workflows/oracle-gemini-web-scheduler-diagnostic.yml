name: Oracle GUI Scheduler Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - core/integration
    paths:
      - '.github/workflows/oracle-gemini-web-scheduler-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect Oracle GUI scheduler state
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          echo "=== gui scheduler unit ==="
          systemctl --user --no-pager --full status agentos-bootstrap-gui.service | sed -n '1,35p' || true
          echo "=== scheduler status ==="
          cat /home/ubuntu/agent-data/runtime/bootstrap-scheduler/status.json 2>/dev/null || true
          echo "=== pending requests ==="
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/agentos-bootstrap-control')
          for kind,pat in [('requests','requests/*.request.json'),('inflight','inflight/**/*.request.json'),('receipts','receipts/*.json'),('rejected','rejected/*.request.json')]:
              rows=[]
              for p in sorted(root.glob(pat), key=lambda x:x.stat().st_mtime, reverse=True)[:30]:
                  try:d=json.loads(p.read_text(encoding='utf-8'))
                  except Exception:d={}
                  rows.append({'path':str(p.relative_to(root)),'action':d.get('action'),'request_id':d.get('request_id'),'created_at':d.get('created_at'),'ok':d.get('ok'),'failure_class':d.get('failure_class'),'age_seconds':round(max(0,__import__('time').time()-p.stat().st_mtime),1)})
              print(kind+'='+json.dumps(rows,separators=(',',':')))
          PY
          echo "=== relevant GUI DM requests ==="
          python3 - <<'PY'
          import json,time
          from pathlib import Path
          root=Path('/tmp/agentos-bootstrap-control')
          for pat in ('requests/*.request.json','inflight/**/*.request.json','rejected/*.request.json'):
              for p in sorted(root.glob(pat)):
                  try:d=json.loads(p.read_text(encoding='utf-8'))
                  except Exception:continue
                  action=str(d.get('action') or '')
                  if 'web_dm' not in action and 'oursong' not in action:
                      continue
                  print(json.dumps({'path':str(p.relative_to(root)),'action':action,'request_id':d.get('request_id'),'age_seconds':round(max(0,time.time()-p.stat().st_mtime),1)},separators=(',',':')))
          PY
          echo "=== gui locks ==="
          ls -l /tmp/agentos-bootstrap-control/locks 2>/dev/null || true
          echo "=== active lock holders ==="
          lslocks -n -o PID,COMMAND,PATH 2>/dev/null | grep '/tmp/agentos-bootstrap-control/locks/' || true
          echo "oracle_gui_scheduler_diagnostic=PASS"
          REMOTE

# diagnostic is intentionally read-only; never restart or rewrite the live scheduler
# Covers Gemini/Mio/Oursong and any other workload routed to the shared Oracle GUI role.
# Mio GUI queue diagnostic 2026-10-01T15:00+08:00
# Mio DM post-login diagnostic 2026-10-01T15:06+08:00
# Mio login probe live diagnostic 2026-10-01T15:10+08:00
