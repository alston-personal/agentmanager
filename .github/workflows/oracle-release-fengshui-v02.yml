name: Fengshui dual-stick indoor release

on:
  push:
    branches: [ops/fengshui-release-carrier-20260915]
    paths:
      - .github/workflows/oracle-release-fengshui-v02.yml

permissions:
  contents: read

concurrency:
  group: fengshui-dual-stick-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 20
    env:
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start deployment SSH identity
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Copy dual-stick patch to deploy user
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          scp -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
            -P "${DEPLOY_SSH_PORT:-22}" ops/fengshui_patch_dual_sticks.py \
            "$DEPLOY_USER@127.0.0.1:/tmp/fengshui_dual_sticks_${GITHUB_RUN_ID}.py"
      - name: Patch, verify, push and deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
            -p "${DEPLOY_SSH_PORT:-22}" "$DEPLOY_USER@127.0.0.1" \
            bash -s -- "$GITHUB_RUN_ID" <<'REMOTE' | tee fengshui-release.log
          set -euo pipefail
          RUN_ID="$1"
          PATCH="/tmp/fengshui_dual_sticks_${RUN_ID}.py"
          TMP=$(mktemp -d /tmp/fengshui-dual-sticks-XXXXXXXXXX)
          cleanup(){ rm -rf "$TMP" "$PATCH"; }
          trap cleanup EXIT
          SRC="$TMP/fengshui-layout-overlay"
          /usr/bin/gh auth status >/dev/null
          /usr/bin/gh repo clone alston-personal/fengshui-layout-overlay "$SRC"
          cd "$SRC"
          /usr/bin/git checkout main
          /usr/bin/git pull --ff-only origin main
          python3 "$PATCH"
          /usr/bin/git diff --check
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -c "import cv2; print('opencv-runtime-ready')"
          python3 -m unittest discover -s ops/tests
          npm test
          npx tsc --noEmit
          npm run build
          node scripts/verify-build.mjs
          /usr/bin/git config user.name "Milkcat Release Bot"
          /usr/bin/git config user.email "register@milkcat.org"
          /usr/bin/git add components/Floorplan3DViewer.tsx
          if ! /usr/bin/git diff --cached --quiet; then
            /usr/bin/git commit -m "fix(mobile): use game-style dual analog sticks indoors"
            /usr/bin/git push origin HEAD:main
          fi
          SOURCE_SHA=$(/usr/bin/git rev-parse HEAD)
          echo "source_sha=$SOURCE_SHA"

          if ! sudo -n systemctl is-active --quiet milkcat-fengshui.service; then
            LISTENER=$(sudo -n ss -Hlnpt 'sport = :8868' || true)
            if [ -n "$LISTENER" ]; then
              PID=$(printf '%s\n' "$LISTENER" | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -n1)
              CWD=$(sudo -n readlink -f "/proc/$PID/cwd")
              case "$CWD" in
                /opt/milkcat/fengshui/releases/*/tools/fengshui-layout-overlay) sudo -n kill "$PID" ;;
                *) echo "unknown 8868 listener: $CWD" >&2; exit 1 ;;
              esac
            fi
          fi

          cd "$TMP"
          python3 "$SRC/ops/release_bundle.py" "$SRC" "$TMP/bundle" "$SOURCE_SHA"
          sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 "$SRC/ops/deploy_oracle.py" \
            --source "$TMP/bundle" --deployment-sha "$SOURCE_SHA" --source-sha "$SOURCE_SHA"
          REMOTE
      - name: Public acceptance
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors --max-time 30 \
            https://studio.milkcat.org/fengshui/api/healthz -o fengshui-health.json
          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors --max-time 30 \
            https://studio.milkcat.org/fengshui/ -o fengshui-page.html
          python3 - <<'PY'
          import json, pathlib
          h=json.loads(pathlib.Path('fengshui-health.json').read_text())
          page=pathlib.Path('fengshui-page.html').read_text()
          assert h.get('service')=='fengshui-layout-overlay' and h.get('status')=='ok'
          assert '宅向' in page
          print({'public_health':'passed','public_page':'passed'})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fengshui-dual-stick-release-${{ github.run_id }}
          path: |
            fengshui-release.log
            fengshui-health.json
          retention-days: 30
