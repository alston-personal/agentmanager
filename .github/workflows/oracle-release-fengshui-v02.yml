name: One-time approved Fengshui release carrier

on:
  push:
    branches: [ops/fengshui-release-carrier-20260915]
    paths: [.github/workflows/oracle-release-fengshui-v02.yml]

permissions:
  contents: read

concurrency:
  group: approved-fengshui-v03-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 15
    env:
      PRODUCT_SHA: a4b54b4618026c50186f8fa4afad1bc5730dea07
      DEPLOYER_SHA: a4b54b4618026c50186f8fa4afad1bc5730dea07
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start existing deployment SSH identity
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Build pinned standalone Fengshui and install only its mount
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          [[ "${DEPLOY_SSH_PORT:-22}" =~ ^[0-9]+$ ]]
          [[ "$PRODUCT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DEPLOYER_SHA" =~ ^[a-f0-9]{40}$ ]]
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
            -p "${DEPLOY_SSH_PORT:-22}" "$DEPLOY_USER@127.0.0.1" \
            bash -s -- "$PRODUCT_SHA" "$DEPLOYER_SHA" "$GITHUB_RUN_ID" <<'REMOTE' | tee fengshui-release.log
          set -euo pipefail
          PRODUCT_SHA="$1"; DEPLOYER_SHA="$2"; RUN_ID="$3"

          # Recover only a stale Fengshui listener left outside the managed systemd unit.
          # The old process can have a relative argv ("node server/index.mjs"), so validate cwd too.
          if ! sudo -n systemctl is-active --quiet milkcat-fengshui.service; then
            LISTENER=$(sudo -n ss -Hlnpt 'sport = :8868' || true)
            if [ -n "$LISTENER" ]; then
              PID=$(printf '%s\n' "$LISTENER" | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -n1)
              test -n "$PID"
              CMD=$(sudo -n sh -c "tr '\\0' ' ' </proc/$PID/cmdline")
              CWD=$(sudo -n readlink -f "/proc/$PID/cwd")
              printf 'stale_listener pid=%s cwd=%s cmd=%s\n' "$PID" "$CWD" "$CMD"
              MANAGED=0
              case "$CMD" in
                *'/opt/milkcat/fengshui/releases/'*'/server/index.mjs'*) MANAGED=1 ;;
              esac
              case "$CWD" in
                /opt/milkcat/fengshui/releases/*/tools/fengshui-layout-overlay)
                  case "$CMD" in
                    'node server/index.mjs'|'node server/index.mjs ') MANAGED=1 ;;
                  esac
                  ;;
              esac
              if [ "$MANAGED" -ne 1 ]; then
                echo 'port_8868_owned_by_unmanaged_process' >&2
                exit 1
              fi
              sudo -n kill "$PID"
              for _ in $(seq 1 20); do
                if ! sudo -n ss -Hlnpt 'sport = :8868' | grep -q .; then break; fi
                sleep 0.25
              done
              if sudo -n ss -Hlnpt 'sport = :8868' | grep -q .; then
                echo 'stale_fengshui_listener_did_not_exit' >&2
                exit 1
              fi
            fi
          fi

          TMP=$(mktemp -d /tmp/fengshui-release-XXXXXXXXXX)
          cleanup(){ rm -rf "$TMP"; }
          trap cleanup EXIT
          SRC="$TMP/fengshui-layout-overlay"
          /usr/bin/gh auth status >/dev/null
          /usr/bin/gh repo clone alston-personal/fengshui-layout-overlay "$SRC" -- --no-checkout
          /usr/bin/git -C "$SRC" fetch --depth=1 origin "$PRODUCT_SHA" "$DEPLOYER_SHA"
          /usr/bin/git -C "$SRC" checkout --detach "$PRODUCT_SHA"
          test "$(/usr/bin/git -C "$SRC" rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$PRODUCT_SHA" = "$DEPLOYER_SHA"
          cd "$SRC"
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -c "import cv2; print('opencv-runtime-ready')"
          python3 -m unittest discover -s ops/tests
          npm test
          npx tsc --noEmit
          npm run build
          node scripts/verify-build.mjs
          cd "$TMP"
          python3 "$SRC/ops/release_bundle.py" "$SRC" "$TMP/bundle" "$PRODUCT_SHA"
          sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 "$SRC/ops/deploy_oracle.py" \
            --source "$TMP/bundle" --deployment-sha "$DEPLOYER_SHA" --source-sha "$PRODUCT_SHA"
          REMOTE
      - name: Public page and source acceptance
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors --max-time 30 \
            https://studio.milkcat.org/fengshui/api/healthz -o fengshui-health.json
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors --max-time 30 \
            https://studio.milkcat.org/fengshui/ -o fengshui-page.html
          python3 - <<'PY'
          import json, pathlib
          health=json.loads(pathlib.Path('fengshui-health.json').read_text())
          page=pathlib.Path('fengshui-page.html').read_text()
          assert health.get('service') == 'fengshui-layout-overlay'
          assert health.get('status') == 'ok'
          assert '宅向' in page and 'Milkcat Studio Portal' not in page
          print(json.dumps({'public_health':'passed','public_page':'passed'}))
          PY
          for provider_url in \
            'sinyi=https://www.sinyi.com.tw/buy/house/2997DC' \
            'yungching=https://buy.yungching.com.tw/house/4308114'; do
            provider=${provider_url%%=*}
            url=${provider_url#*=}
            code=$(curl -sS --max-time 35 -w '%{http_code}' --get --data-urlencode "url=$url" \
              https://studio.milkcat.org/fengshui/api/import -o "$provider-response.json" || true)
            PROVIDER="$provider" HTTP_CODE="$code" python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['PROVIDER']+'-response.json')
          try: d=json.loads(p.read_text())
          except Exception: d={}
          summary={'provider':os.environ['PROVIDER'],'http':os.environ['HTTP_CODE'],
                   'ok':os.environ['HTTP_CODE']=='200' and 'error' not in d,
                   'code':d.get('code'),'phase':d.get('phase'),'transport':d.get('transport'),
                   'photo_count':len(d.get('photos',[])),'floorplan_count':len(d.get('floorplans',[]))}
          pathlib.Path(os.environ['PROVIDER']+'-probe.json').write_text(json.dumps(summary,indent=2))
          p.unlink(missing_ok=True)
          print(json.dumps(summary))
          PY
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fengshui-release-receipt-${{ github.run_id }}
          path: |
            fengshui-release.log
            fengshui-health.json
            sinyi-probe.json
            yungching-probe.json
          retention-days: 30
