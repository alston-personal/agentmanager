name: Oracle Install Mio Threads Session Supervisor

on:
  push:
    branches:
      - core/integration
    paths:
      - '.github/workflows/oracle-install-mio-threads-session-supervisor.yml'
      - 'scripts/run_mio_threads_session_supervisor_user.sh'
      - 'scripts/install_mio_threads_session_supervisor_user.sh'
      - 'scripts/probe_threads_web_dm_login_user.sh'
      - 'agentos_node/bootstrap_control.py'
      - 'agentos_node/bootstrap_scheduler.py'
      - 'agent_core/runner_window.py'

permissions:
  contents: read
  id-token: write

concurrency:
  group: oracle-install-mio-threads-session-supervisor
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos
    steps:
      - uses: actions/checkout@v4

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/run_mio_threads_session_supervisor_user.sh
          bash -n scripts/install_mio_threads_session_supervisor_user.sh
          grep -Fq 'OnUnitActiveSec=2h' scripts/install_mio_threads_session_supervisor_user.sh
          grep -Fq 'Persistent=true' scripts/install_mio_threads_session_supervisor_user.sh

      - name: Mint Runner Window credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Install through Runner Window
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/install.txt"
          AGENTOS_DISPATCH_WAIT_SECONDS=240 \
            bash scripts/agentos_dispatch.sh \
              threads.session supervisor.install "$GITHUB_SHA" \
              > "$OUT"
          grep -q 'runner_window_dispatch=PASS' "$OUT"
          python3 - "$OUT" "$GITHUB_SHA" <<'PY'
          import json,sys
          path,expected=sys.argv[1:3]
          completed=None
          for raw in open(path,encoding='utf-8'):
              raw=raw.strip()
              if not raw.startswith('{'): continue
              try: row=json.loads(raw)
              except json.JSONDecodeError: continue
              if row.get('state')=='completed' and isinstance(row.get('receipt'),dict):
                  completed=row
          assert completed is not None, 'completed receipt missing'
          receipt=completed['receipt']
          assert receipt.get('source_commit')==expected, receipt
          assert receipt.get('ok') is True, receipt
          scheduler=receipt.get('scheduler') or {}
          assert scheduler.get('worker_role')=='maintenance', scheduler
          text='\n'.join(str(s.get('stdout') or '') for s in receipt.get('steps') or [])
          safe=[line for line in text.splitlines() if line.startswith('mio_threads_session_supervisor_')]
          for line in safe: print(line)
          assert 'mio_threads_session_supervisor_install=PASS' in safe, safe
          PY
