name: Studio Static Route Release Guard

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/reusable-studio-static-route-release.yml'
      - '.github/workflows/oracle-release-milkcat-world-mvp.yml'
      - '.github/workflows/studio-static-route-release-guard.yml'
      - '.agent/governance/studio_release_capabilities.yaml'
      - 'agent_core/studio_capability_adapter.py'
      - 'agent_core/platform_execution.py'
      - 'scripts/milkcat_platform_execution.py'
      - 'docs/STUDIO_STATIC_ROUTE_RELEASE.md'
      - 'docs/asset-registry/README.md'
      - 'docs/asset-registry/studio-static-route-release.yaml'
      - 'tests/test_studio_static_route_release_contract.py'
      - 'tests/test_platform_execution.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/reusable-studio-static-route-release.yml'
      - '.github/workflows/oracle-release-milkcat-world-mvp.yml'
      - '.github/workflows/studio-static-route-release-guard.yml'
      - '.agent/governance/studio_release_capabilities.yaml'
      - 'agent_core/studio_capability_adapter.py'
      - 'agent_core/platform_execution.py'
      - 'scripts/milkcat_platform_execution.py'
      - 'docs/STUDIO_STATIC_ROUTE_RELEASE.md'
      - 'docs/asset-registry/README.md'
      - 'docs/asset-registry/studio-static-route-release.yaml'
      - 'tests/test_studio_static_route_release_contract.py'
      - 'tests/test_platform_execution.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run release capability contract tests
        run: |
          python -m unittest -q tests.test_studio_static_route_release_contract
          python -m unittest -q tests.test_platform_execution
      - name: Verify reusable carrier contract
        shell: bash
        run: |
          set -euo pipefail
          R=.github/workflows/reusable-studio-static-route-release.yml
          C=.github/workflows/oracle-release-milkcat-world-mvp.yml
          D=docs/STUDIO_STATIC_ROUTE_RELEASE.md
          G=.agent/governance/studio_release_capabilities.yaml
          A=docs/asset-registry/studio-static-route-release.yaml

          test -f "$R"
          test -f "$C"
          test -f "$D"
          test -f "$G"
          test -f "$A"
          grep -Fq 'workflow_call:' "$R"
          grep -Fq 'route:' "$R"
          grep -Fq 'acceptance_anchors:' "$R"
          grep -Fq 'rollback()' "$R"
          grep -Fq 'local_nginx_studio_static_route_acceptance=PASS' "$R"
          grep -Fq 'public_studio_static_route_acceptance=PASS' "$R"
          grep -Fq 'Roll back route after public acceptance failure' "$R"
          grep -Fq "steps.publish.outcome == 'success'" "$R"
          grep -Fq 'public_failure_rollback=PASS' "$R"
          grep -Fq 'failure_stage=public_acceptance' "$R"

          grep -Fq 'credit_account:' "$R"
          grep -Fq 'credit_cost:' "$R"
          grep -Fq 'Prepare governed platform execution' "$R"
          grep -Fq 'milkcat_platform_execution.py prepare' "$R"
          grep -Fq -- '--capability studio.static-route.release' "$R"
          grep -Fq -- '--sync-studio-capabilities' "$R"
          grep -Fq 'Settle governed platform execution' "$R"
          grep -Fq 'milkcat_platform_execution.py settle' "$R"

          grep -Fq 'uses: ./.github/workflows/reusable-studio-static-route-release.yml' "$C"
          grep -Fq 'route: world' "$C"
          grep -Fq 'source_sha: b675270c7ad08bcd9172496d7436787a32c299a1' "$C"
          grep -Fq 'credit_account:' "$C"
          grep -Fq 'credit_cost:' "$C"
          grep -Fq 'provider_id: service://studio.static-route.release' "$G"
          grep -Fq 'capability_uri: capability://studio.static-route.release' "$G"
          grep -Fq 'status: extracted-first-consumer' "$G"
          grep -Fq 'asset_id: studio-static-route-release' "$A"
          grep -Fq 'evidence_scope: shared-carrier-live' "$A"
          grep -Fq 'shared_carrier_live_verification: passed' "$A"
          grep -Fq 'shared_carrier_release_run: 35199712046' "$A"
          grep -Fq 'shared_carrier_main_commit: 369585b7d4a6f3885e0d0c79aeca57b8957fd164' "$A"

          if grep -Fq 'npm run build' "$C"; then
            echo 'Milkcat World consumer regressed to duplicated deployment logic' >&2
            exit 1
          fi
          if grep -Fq 'ssh -o StrictHostKeyChecking' "$C"; then
            echo 'Milkcat World consumer regressed to direct SSH deployment logic' >&2
            exit 1
          fi
          if grep -Fq 'milkcat_platform_execution.py' "$C"; then
            echo 'Milkcat World consumer regressed to product-owned accounting logic' >&2
            exit 1
          fi

          echo 'studio_static_route_release_guard=PASS'
