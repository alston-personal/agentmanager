name: Deploy VO10005870 Recovery Fixes

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/deploy-vo10005870-recovery-fixes.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Deploy fixes through RealmFabric
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json,time
          from agent_core.realm_fabric import RealmFabricStore
          task_id='deploy-hung-recovery-fixes-20261002-1310'
          ps=r'''$ErrorActionPreference='Stop';
          $root=Join-Path $env:LOCALAPPDATA 'AgentOS';
          $watchdog=Join-Path $root 'scripts\thin_client_watchdog.ps1';
          $thin=Join-Path $root 'agentos_node\thin_client.py';
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/alston-personal/agentmanager/fix/windows-thin-client-watchdog/scripts/windows/thin_client_watchdog.ps1' -OutFile $watchdog;
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/alston-personal/agentmanager/feat/desktop-demo-recorder/agentos_node/thin_client.py' -OutFile $thin;
          Stop-ScheduledTask -TaskName 'AgentOS Thin Client Watchdog' -ErrorAction SilentlyContinue;
          Start-ScheduledTask -TaskName 'AgentOS Thin Client Watchdog';
          [pscustomobject]@{watchdog=$watchdog;watchdog_bytes=(Get-Item $watchdog).Length;thin_client=$thin;thin_client_bytes=(Get-Item $thin).Length;watchdog_state=(Get-ScheduledTask -TaskName 'AgentOS Thin Client Watchdog').State}|ConvertTo-Json -Compress'''
          f=RealmFabricStore()
          if f.get_receipt(task_id) is None:
              f.queue_task('VO10005870',{
                  'schema':'agentos.node-task/v0.1',
                  'task_id':task_id,
                  'action':'shell.exec',
                  'executable':'powershell',
                  'argv':['-NoProfile','-NonInteractive','-Command',ps],
                  'cwd':r'C:\Users\alston.huang\AgentOS',
                  'timeout_seconds':60,
                  'cognition_ids_used':['demo://hung-recovery-fix/20261002'],
              })
          for _ in range(75):
              r=f.get_receipt(task_id)
              if r is not None:
                  print(json.dumps(r,ensure_ascii=False,separators=(',',':')))
                  if r.get('ok') is not True or int(r.get('returncode') or 0)!=0:
                      raise SystemExit('deploy_failed')
                  break
              time.sleep(1)
          else:
              raise SystemExit('deploy_receipt_timeout')
          PY
          REMOTE
