name: AgentOS Governance Directory Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'agent_core/governance_directory.py'
      - 'agent_core/capability_manifest_adapter.py'
      - 'agent_core/resource_registry.py'
      - 'capabilities/**'
      - 'scripts/agentos_node.py'
      - 'scripts/governance_directory.py'
      - 'scripts/core_services/port_manager.py'
      - 'scripts/drift_guard.py'
      - 'tests/test_agentos_node.py'
      - 'tests/test_governance_directory.py'
      - 'tests/test_capability_manifest_adapter.py'
      - 'tests/test_web_static_index.py'
      - '.agent/CONSTITUTION.yaml'
      - '.agent/governance/**'
      - '.agent/roles/**'
      - '.agent/SERVICES.md'
      - 'scripts/os_watchdog.py'
      - '.github/workflows/governance-directory-audit.yml'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compile and test governance/node contracts
        shell: bash
        run: |
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          python3 -m py_compile agent_core/governance_directory.py agent_core/capability_manifest_adapter.py agent_core/studio_capability_adapter.py agent_core/resource_registry.py capabilities/web_static_index/renderer.py scripts/web_static_index.py scripts/agentos_node.py scripts/governance_directory.py scripts/core_services/port_manager.py
          python3 -m unittest tests.test_governance_directory tests.test_agentos_node tests.test_capability_manifest_adapter tests.test_web_static_index -v

      - name: Install canonical agentos-node runtime for node identity
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="$HOME/.local/share/agentos-node"
          BIN="$HOME/.local/bin"
          rm -rf "$RUNTIME"
          mkdir -p "$RUNTIME/agent_core" "$RUNTIME/scripts" "$RUNTIME/.agent/roles" "$RUNTIME/.agent/governance" "$RUNTIME/capabilities/web_static_index" "$BIN"
          cp agent_core/__init__.py agent_core/governance_directory.py agent_core/capability_manifest_adapter.py agent_core/studio_capability_adapter.py agent_core/resource_registry.py "$RUNTIME/agent_core/"
          cp scripts/agentos_node.py "$RUNTIME/scripts/"
          cp .agent/roles/registry.yaml "$RUNTIME/.agent/roles/registry.yaml"
          cp .agent/governance/studio_release_capabilities.yaml "$RUNTIME/.agent/governance/studio_release_capabilities.yaml"
          cp capabilities/web_static_index/capability-manifest.json "$RUNTIME/capabilities/web_static_index/capability-manifest.json"
          cat > "$BIN/agentos-node" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          export AGENT_DATA_ROOT="\${AGENT_DATA_ROOT:-/home/ubuntu/agent-data}"
          exec python3 "$RUNTIME/scripts/agentos_node.py" "\$@"
          EOF
          chmod 755 "$BIN/agentos-node"
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/agentos-node" harvest

      - name: Resolve governance through agentos-node
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          agentos-node governance resolve capability://network.port.allocate > /tmp/port-owner.json
          cat /tmp/port-owner.json
          python3 -c 'import json; d=json.load(open("/tmp/port-owner.json")); assert d and d[0]["id"]=="manager://port" and d[0]["authority"]["exclusive"] is True'
          agentos-node governance resolve capability://web.static-index.render > /tmp/web-static-index-owner.json
          cat /tmp/web-static-index-owner.json
          python3 -c 'import json; d=json.load(open("/tmp/web-static-index-owner.json")); assert d and d[0]["id"]=="service://web.static-index.renderer"'
          agentos-node governance get role://governance.spec_steward > /tmp/spec-steward.json
          python3 -c 'import json; d=json.load(open("/tmp/spec-steward.json")); assert d["state"] not in ("stale","retired","superseded")'
          agentos-node resource get site://studio.milkcat.org > /tmp/studio-resource.json
          python3 -c 'import json; d=json.load(open("/tmp/studio-resource.json")); assert d and d["id"]=="site://studio.milkcat.org"'

      - name: Run drift audits and write evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/governance-directory-audit.txt
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "hostname=$(hostname)"
            echo "identity=$(id)"
            echo "agentos_node=$(command -v agentos-node)"
            echo '=== HARVEST ==='
            agentos-node harvest
            echo '=== PORT OWNER ==='
            agentos-node governance resolve capability://network.port.allocate
            echo '=== RESOURCE ==='
            agentos-node resource get site://studio.milkcat.org
            echo '=== DIRECTORY AUDIT ==='
            python3 scripts/governance_directory.py audit --write || true
            echo '=== ACCEPTANCE ==='
            python3 -c 'import json; from pathlib import Path; d=json.loads(Path("/home/ubuntu/agent-data/governance/directory.json").read_text()); e=d["entities"]; assert e["manager://port"]["authority"]["exclusive"] is True; assert e["role://instance.agentmanager_paw"]["state"]=="stale"; print("governance_directory=PASS entities=%d" % len(e))'
            echo 'agentos_node_contract=PASS'
          } 2>&1 | tee "$OUT"

      - name: Upload governance audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: governance-directory-audit-${{ github.sha }}
          path: .agentos/evidence/governance-directory-audit.txt
          if-no-files-found: error
          retention-days: 14
