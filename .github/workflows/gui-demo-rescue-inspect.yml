name: GUI Demo Rescue Inspect

on:
  push:
    branches:
      - demo/gui-gemini-threads-20261001
    paths:
      - '.github/workflows/gui-demo-rescue-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Inspect ONE task and node
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export AGENT_DATA_ROOT=/home/ubuntu/agent-data
          export PYTHONPATH=/home/ubuntu/agentmanager
          cd /home/ubuntu/agentmanager
          python3 - <<'PY'
          import json
          from agent_core.node_registry import NodeRegistry
          from agent_core.realm_fabric import RealmFabricStore
          node=next((n for n in (NodeRegistry().node_map().get('nodes') or []) if str(n.get('node_id') or '')=='VO10005870'),None)
          print('NODE='+json.dumps(node,ensure_ascii=False,separators=(',',':')))
          f=RealmFabricStore()
          data=f.load()
          pending=(data.get('tasks') or {}).get('VO10005870') or []
          print('PENDING='+json.dumps(pending,ensure_ascii=False,separators=(',',':')))
          for task_id in [
            'gui-demo-uia-edge-tree-python312-20261002-1103',
            'gui-demo-uia-semantic-fast-20261002-1105',
            'gui-demo-uia-hosted-fast-20261002-1112',
            'gui-demo-open-gemini-targeted-uia-20261002-1120',
            'targeted-gemini-uia-probe-20261002-1348',
            'targeted-gemini-uia-probe-20261002-1538',
            'deploy-heartbeat-isolation-20261002-1358',
            'verify-heartbeat-isolation-reload-20261002-1358',
            'formal-e2e-deploy-runner-20261002-1548',
            'formal-e2e-rec-start-20261002-1548',
            'formal-e2e-run-20261002-1548',
            'formal-e2e-rec-stop-20261002-1548',
            'deploy-receipt-spool-20261002-1552',
            'verify-receipt-spool-runtime-20261002-1552',
            'targeted-uia-probe-gemini-20261002-1332',
          ]:
            print(task_id+'='+json.dumps(f.get_receipt(task_id),ensure_ascii=False,separators=(',',':')))
          PY
          REMOTE

