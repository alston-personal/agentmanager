name: Lobster Verification Evidence Guard

on:
  pull_request:
    branches: [core/integration]
    paths:
      - scripts/lobster.py
      - tests/test_lobster_verification_classification.py
      - .github/workflows/lobster-verification-evidence-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m py_compile scripts/lobster.py
      - run: python -m pytest -q tests/test_lobster_verification_classification.py
