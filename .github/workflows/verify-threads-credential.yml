name: Verify Threads Credential

on:
  workflow_dispatch:
  push:
    branches:
      - feature/realm-node-fabric
    paths:
      - '.github/workflows/verify-threads-credential.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Resolve host
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          test -n "$DEPLOY_HOST"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Read-only Threads identity probe
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'cd /home/ubuntu/zeus-writer && python3 -' <<'PY'
          import json, os, sys
          import requests
          sys.path.insert(0, "/home/ubuntu/zeus-writer/scripts")
          try:
              from secret_manager import SecretManager
              SecretManager.load_all_secrets()
          except Exception as exc:
              print(json.dumps({"token_present": False, "identity_ok": False, "error_code": "secret_load_failed", "detail": type(exc).__name__}))
              raise SystemExit(2)
          token = os.environ.get("SOC_THREADS_TOKEN", "").strip()
          if not token:
              print(json.dumps({"token_present": False, "identity_ok": False, "error_code": "credential_missing"}))
              raise SystemExit(2)
          try:
              response = requests.get(
                  "https://graph.threads.net/v1.0/me",
                  params={"fields": "id,username", "access_token": token},
                  timeout=20,
              )
              data = response.json()
          except Exception as exc:
              print(json.dumps({"token_present": True, "identity_ok": False, "error_code": "transport_error", "detail": type(exc).__name__}))
              raise SystemExit(2)
          if response.ok and data.get("id"):
              print(json.dumps({"token_present": True, "identity_ok": True, "username": data.get("username"), "http_status": response.status_code}))
              raise SystemExit(0)
          error = data.get("error") if isinstance(data, dict) else {}
          print(json.dumps({"token_present": True, "identity_ok": False, "http_status": response.status_code, "error_code": str((error or {}).get("code", "api_error"))}))
          raise SystemExit(2)
          PY
