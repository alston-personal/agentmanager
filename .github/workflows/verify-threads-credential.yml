name: Verify Threads Credential

on:
  workflow_dispatch:
  push:
    branches:
      - feature/realm-node-fabric
    paths:
      - '.github/workflows/verify-threads-credential.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Read-only Threads identity probe on Core
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/zeus-writer
          python3 - <<'PY'
          import json, os, sys
          import requests
          sys.path.insert(0, "/home/ubuntu/zeus-writer/scripts")
          try:
              from secret_manager import SecretManager
              SecretManager.load_all_secrets()
          except Exception as exc:
              print(json.dumps({"token_present": False, "identity_ok": False, "error_code": "secret_load_failed", "detail": type(exc).__name__}))
              raise SystemExit(2)
          token = os.environ.get("SOC_THREADS_TOKEN", "").strip()
          if not token:
              print(json.dumps({"token_present": False, "identity_ok": False, "error_code": "credential_missing"}))
              raise SystemExit(2)
          try:
              response = requests.get(
                  "https://graph.threads.net/v1.0/me",
                  params={"fields": "id,username", "access_token": token},
                  timeout=20,
              )
              data = response.json()
          except Exception as exc:
              print(json.dumps({"token_present": True, "identity_ok": False, "error_code": "transport_error", "detail": type(exc).__name__}))
              raise SystemExit(2)
          if response.ok and data.get("id"):
              print(json.dumps({"token_present": True, "identity_ok": True, "username": data.get("username"), "http_status": response.status_code}))
              raise SystemExit(0)
          error = data.get("error") if isinstance(data, dict) else {}
          print(json.dumps({"token_present": True, "identity_ok": False, "http_status": response.status_code, "error_code": str((error or {}).get("code", "api_error"))}))
          raise SystemExit(2)
          PY
