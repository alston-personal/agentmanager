name: Oracle Probe Threads Public Browser Capability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-probe-threads-public-browser.yml'

permissions:
  contents: write

concurrency:
  group: threads-public-browser-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 8
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Inspect browser runtime and public Threads reachability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          OUT=.agentos/evidence/threads-public-browser-probe.json
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            python3 - <<'PY' > "$OUT"
          import importlib.util
          import json
          import shutil
          import subprocess
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          URL='https://www.threads.com/@nico1e.16/post/DcWVvpwGTSh'
          bins=['chromium','chromium-browser','google-chrome','google-chrome-stable','firefox','playwright','node','npx']
          result={
              'schema':'agentos.threads-public-browser-probe/v1',
              'checked_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'target_url':URL,
              'writes_performed':False,
              'login_attempted':False,
              'anti_bot_bypass_attempted':False,
              'binaries':{b:bool(shutil.which(b)) for b in bins},
              'python_modules':{
                  'selenium': importlib.util.find_spec('selenium') is not None,
                  'playwright': importlib.util.find_spec('playwright') is not None,
              },
          }

          req=Request(URL, headers={'User-Agent':'Mozilla/5.0 (compatible; AgentOS capability probe/1.0)'})
          try:
              with urlopen(req, timeout=30) as r:
                  body=r.read(2_000_000)
                  text=body.decode('utf-8','replace')
                  result['public_http']={
                      'ok':True,
                      'status':r.status,
                      'content_type':r.headers.get('content-type'),
                      'bytes_read':len(body),
                      'contains_shortcode':'DcWVvpwGTSh' in text,
                      'contains_reply_word':('reply' in text.lower() or '回覆' in text),
                      'contains_login_prompt':('log in' in text.lower() or '登入' in text),
                  }
          except HTTPError as e:
              result['public_http']={'ok':False,'status':e.code,'error':'HTTPError'}
          except Exception as e:
              result['public_http']={'ok':False,'status':None,'error':type(e).__name__}

          # Do not install browsers or dependencies in this probe. Only report what already exists.
          result['browser_runtime_available'] = bool(
              result['binaries'].get('chromium') or result['binaries'].get('chromium-browser') or
              result['binaries'].get('google-chrome') or result['binaries'].get('google-chrome-stable') or
              result['binaries'].get('firefox')
          )
          result['automation_runtime_available'] = bool(
              result['python_modules']['selenium'] or result['python_modules']['playwright'] or result['binaries'].get('playwright')
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

          python3 -m json.tool "$OUT" >/dev/null
          cat "$OUT"

      - name: Commit sanitized capability evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .agentos/evidence/threads-public-browser-probe.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/threads-public-browser-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(threads): public browser capability probe'
          git push
