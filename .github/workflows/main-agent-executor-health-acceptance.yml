name: Main Agent Executor Health Acceptance

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/main-agent-executor-health-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: main-agent-engineering-model-control
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGENTOS_RUNNER_WINDOW_BASE: https://studio.milkcat.org/dashboard/api/agentos

    steps:
      - uses: actions/checkout@v4

      - name: Mint GitHub OIDC scheduler credential
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentos-scheduler"
          curl -fsS --max-time 15             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$url" > "$RUNNER_TEMP/oidc.json"
          token="$(python3 - "$RUNNER_TEMP/oidc.json" <<'PY'
          import json,sys
          value=str(json.load(open(sys.argv[1],encoding='utf-8')).get('value') or '')
          assert value.count('.')==2
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'AGENTOS_CONTROLLER_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Wait for executor job intents
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 5               -H "Authorization: Bearer $AGENTOS_CONTROLLER_TOKEN"               "$AGENTOS_RUNNER_WINDOW_BASE/v1/dispatch"               > "$RUNNER_TEMP/catalog.json"; then
              if python3 - "$RUNNER_TEMP/catalog.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=d.get('intents') or d.get('catalog') or []
          wanted={('agentos.executor','job.submit'),('agentos.executor','job.inspect')}
          got={(x.get('capability'),x.get('operation')) for x in rows if isinstance(x,dict)}
          raise SystemExit(0 if wanted.issubset(got) else 1)
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 2
          done
          test "$ready" = 1
          echo "executor_health_intents=PASS"

      - name: Submit executor health job
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          AGENTOS_DISPATCH_WAIT_SECONDS=180             bash scripts/agentos_dispatch.sh               agentos.executor job.submit "$GITHUB_SHA"               job_type=engineering.executor.health               | tee "$RUNNER_TEMP/health-submit.txt"

          python3 - "$RUNNER_TEMP/health-submit.txt" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          docs=[json.loads(line) for line in open(sys.argv[1],encoding='utf-8') if line.strip().startswith('{')]
          assert docs, 'missing submit receipt'
          receipt=docs[-1].get('receipt') or {}
          job=receipt.get('executor_job') or {}
          assert receipt.get('ok') is True, receipt
          assert job.get('job_type')=='engineering.executor.health', job
          job_id=str(job.get('job_id') or '')
          assert job_id.startswith('action-'), job
          with open(sys.argv[2],'a',encoding='utf-8') as out:
              out.write('job_id='+job_id+'\n')
          print('executor_health_submit=PASS')
          PY

      - name: Inspect executor health receipt
        shell: bash
        run: |
          set -euo pipefail
          job_id="${{ steps.submit.outputs.job_id }}"
          terminal=0
          : > "$RUNNER_TEMP/health-inspect.txt"
          for i in $(seq 1 60); do
            out="$RUNNER_TEMP/health-inspect-$i.txt"
            AGENTOS_DISPATCH_WAIT_SECONDS=90               bash scripts/agentos_dispatch.sh                 agentos.executor job.inspect "$GITHUB_SHA"                 job_id="$job_id" > "$out"
            cat "$out" >> "$RUNNER_TEMP/health-inspect.txt"
            if python3 - "$out" "$RUNNER_TEMP/health-terminal.json" <<'PY'
          import json,sys
          docs=[json.loads(line) for line in open(sys.argv[1],encoding='utf-8') if line.strip().startswith('{')]
          if not docs:
              raise SystemExit(1)
          receipt=docs[-1].get('receipt') or {}
          if receipt.get('executor_job_state')!='completed':
              raise SystemExit(1)
          job=receipt.get('executor_job_receipt')
          if not isinstance(job,dict):
              raise SystemExit(1)
          json.dump(job,open(sys.argv[2],'w',encoding='utf-8'),sort_keys=True,indent=2)
          raise SystemExit(0)
          PY
            then
              terminal=1
              break
            fi
            sleep 3
          done
          test "$terminal" = 1

          python3 - "$RUNNER_TEMP/health-terminal.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r.get('schema')=='agentos.executor-job-receipt/v1', r
          assert r.get('job_type')=='engineering.executor.health', r
          assert r.get('credential_exposed') is False, r
          allowed={'READY','FLAKY','AUTH_REQUIRED','TIMEOUT','ERROR','UNAVAILABLE'}
          assert r.get('claude_liveness') in allowed, r
          assert r.get('agy_liveness') in allowed, r
          assert r.get('claude_state') in allowed, r
          assert r.get('agy_state') in allowed, r
          assert isinstance(r.get('claude_ready_count'), int), r
          assert r.get('claude_probe_attempts') == 2, r
          assert isinstance(r.get('agy_ready_count'), int), r
          assert r.get('agy_probe_attempts') == 2, r
          selected=str(r.get('selected_provider') or '')
          assert selected in {'claude','agy','gemini'}, r
          assert r.get('successful') is True, r
          assert r.get('classification')=='ENGINEERING_EXECUTOR_HEALTH_READY', r
          print('executor_health_acceptance=PASS')
          print('executor_health_selected_provider='+selected)
          print('executor_health_claude_liveness='+str(r.get('claude_liveness')))
          print('executor_health_claude_state='+str(r.get('claude_state')))
          print('executor_health_claude_ready_count='+str(r.get('claude_ready_count')))
          print('executor_health_agy_liveness='+str(r.get('agy_liveness')))
          print('executor_health_agy_state='+str(r.get('agy_state')))
          print('executor_health_agy_ready_count='+str(r.get('agy_ready_count')))
          PY

      - name: Upload sanitized health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-agent-executor-health-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/health-submit.txt
            ${{ runner.temp }}/health-inspect.txt
            ${{ runner.temp }}/health-terminal.json
          if-no-files-found: warn
          retention-days: 14
