name: Oracle Install Storage Resource Publisher

on:
  push:
    branches: [core/integration]
    paths:
      - '.github/workflows/oracle-install-storage-resource-publisher.yml'

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Install agentos-node owned storage publisher
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$ORACLE_HOST" bash -s <<'REMOTE'
          set -euo pipefail

          cat > /tmp/agentos-storage-resource-publish.py <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          health = Path("/home/ubuntu/.local/state/agentos/gdrive-health.state")
          registry = Path("/home/ubuntu/agent-data/resources/registry.json")
          mountpoint = Path("/home/ubuntu/.local/share/agentos/gdrive-remote-v2")
          compatibility = Path("/home/ubuntu/gdrive")
          state = "UNKNOWN"
          if health.exists():
              for line in health.read_text(encoding="utf-8").splitlines():
                  if line.startswith("state="):
                      state = line.split("=", 1)[1].strip()
                      break

          compatibility_ok = compatibility.is_symlink()
          compatibility_target = None
          if compatibility_ok:
              try:
                  compatibility_target = str(compatibility.resolve(strict=False))
                  compatibility_ok = compatibility_target == str(mountpoint)
              except Exception:
                  compatibility_ok = False

          try:
              data = json.loads(registry.read_text(encoding="utf-8")) if registry.exists() else {}
          except Exception:
              data = {}
          data.setdefault("schema_version", "0.1")
          resources = data.setdefault("resources", {})
          resource = resources.get("storage://google-drive", {})
          resource.update({
              "id": "storage://google-drive",
              "kind": "storage",
              "declared": {
                  "mountpoint": str(mountpoint),
                  "compatibility_path": str(compatibility),
                  "service": "agentos-gdrive-mount.service",
                  "fstype": "fuse.rclone",
                  "failure_policy": "fail-closed"
              }
          })
          ready = state in {"READY", "RECOVERED"} and compatibility_ok
          errors = []
          if state not in {"READY", "RECOVERED"}:
              errors.append(f"gdrive health state: {state}")
          if not compatibility_ok:
              errors.append(f"compatibility path invalid: {compatibility} -> {compatibility_target}")

          resource["observed"] = {
              "mounted": state in {"READY", "RECOVERED"},
              "state": state,
              "compatibility_path_ok": compatibility_ok,
              "compatibility_target": compatibility_target,
          }
          resource["verification"] = {
              "status": "verified" if ready else "degraded",
              "last_verified_at": datetime.now(timezone.utc).isoformat(),
              "ttl_seconds": 360,
              "errors": errors
          }
          resources["storage://google-drive"] = resource
          data["updated_at"] = datetime.now(timezone.utc).isoformat()
          tmp = registry.with_name(f".{registry.name}.{os.getpid()}.tmp")
          tmp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          os.replace(tmp, registry)
          print(f"storage_resource_publish=PASS state={state} compatibility_ok={compatibility_ok}")
          PY

          sudo -n install -d -o root -g root -m 0755 /usr/local/libexec
          sudo -n install -o root -g root -m 0755 /tmp/agentos-storage-resource-publish.py /usr/local/libexec/agentos-storage-resource-publish.py

          sudo -n tee /etc/systemd/system/agentos-storage-resource-publish.service >/dev/null <<'UNIT'
          [Unit]
          Description=Publish AgentOS storage health into Resource Registry
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          User=agentos-node
          Group=agentos
          ExecStart=/usr/bin/python3 /usr/local/libexec/agentos-storage-resource-publish.py
          UNIT

          sudo -n tee /etc/systemd/system/agentos-storage-resource-publish.timer >/dev/null <<'UNIT'
          [Unit]
          Description=Refresh AgentOS storage resource readiness

          [Timer]
          OnBootSec=2min
          OnUnitActiveSec=1min
          AccuracySec=10s
          Unit=agentos-storage-resource-publish.service

          [Install]
          WantedBy=timers.target
          UNIT

          sudo -n systemctl daemon-reload
          sudo -n systemctl enable --now agentos-storage-resource-publish.timer
          sudo -n systemctl start agentos-storage-resource-publish.service
          sudo -n systemctl is-active agentos-storage-resource-publish.timer
          sudo -n systemctl status agentos-storage-resource-publish.service --no-pager -l || true
          sudo -n -u agentos-node python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/home/ubuntu/agent-data/resources/registry.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          r=d['resources']['storage://google-drive']
          print('resource_status=' + r['verification']['status'])
          print('resource_state=' + r['observed']['state'])
          print('compatibility_path_ok=' + str(r['observed']['compatibility_path_ok']))
          PY
          REMOTE

# legacy-path-integrity 2026-10-07
