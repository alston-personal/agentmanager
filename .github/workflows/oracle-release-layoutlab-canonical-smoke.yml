name: Layout Lab Canonical Release Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-release-layoutlab-canonical-smoke.yml'
jobs:
  smoke:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 3
    steps:
      - run: echo canonical_layoutlab_smoke=PASS
