name: Meta Desktop Readonly Inspect

on:
  push:
    branches:
      - feature/desktop-browser-meta-inspect
    paths:
      - '.agentos/commands/meta-desktop-inspect.json'

permissions:
  contents: read

concurrency:
  group: meta-desktop-readonly-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Inspect node transport state
        shell: bash
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from agent_core.realm_fabric import RealmFabricStore
          from agent_core.node_registry import NodeRegistry

          cmd = json.load(open('.agentos/commands/meta-desktop-inspect.json', encoding='utf-8'))
          assert cmd.get('schema') == 'agentos.meta-desktop-inspect/v0.1', cmd
          assert cmd.get('node_id') == 'vopc5750', cmd

          fabric = RealmFabricStore()
          raw = fabric.load()
          node = dict((raw.get('nodes') or {}).get('vopc5750') or {})
          node.pop('token_hash', None)
          pending = list((raw.get('tasks') or {}).get('vopc5750') or [])
          pending_safe = [
              {
                  'task_id': t.get('task_id'),
                  'action': t.get('action'),
                  'queued_at': t.get('queued_at'),
              }
              for t in pending[-20:]
          ]
          registry = NodeRegistry().node_map()
          registry_node = next((n for n in registry.get('nodes', []) if n.get('node_id') == 'vopc5750'), None)
          result = {
              'node': node,
              'registry_node': registry_node,
              'pending_task_count': len(pending),
              'pending_tasks_tail': pending_safe,
          }
          out = Path('/tmp/meta-desktop')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'transport-diagnostic.json').write_text(json.dumps(result, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload read-only transport evidence
        uses: actions/upload-artifact@v4
        with:
          name: meta-desktop-transport-diagnostic
          path: /tmp/meta-desktop
          if-no-files-found: error
          retention-days: 1
