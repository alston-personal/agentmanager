name: Meta Desktop Readonly Inspect

on:
  push:
    branches:
      - feature/desktop-browser-meta-inspect
    paths:
      - '.agentos/commands/meta-desktop-inspect.json'

permissions:
  contents: read

concurrency:
  group: meta-desktop-readonly-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Quarantine stale node tasks
        shell: bash
        env:
          AGENT_DATA_ROOT: /home/ubuntu/agent-data
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from agent_core.realm_fabric import RealmFabricStore

          cmd = json.load(open('.agentos/commands/meta-desktop-inspect.json', encoding='utf-8'))
          assert cmd.get('schema') == 'agentos.meta-desktop-inspect/v0.1', cmd
          assert cmd.get('node_id') == 'vopc5750', cmd
          assert cmd.get('operation') == 'quarantine_stale_tasks', cmd

          target_ids = {
              'self-update-runtime-vopc5750-1787799601',
              'probe-vopc5750-1787799699',
              'self-update-runtime-vopc5750-1787799940',
              'meta-desktop-open_url-1787810432803',
          }
          fabric = RealmFabricStore()
          raw = fabric.load()
          queue = list((raw.get('tasks') or {}).get('vopc5750') or [])
          removed = [t for t in queue if t.get('task_id') in target_ids]
          kept = [t for t in queue if t.get('task_id') not in target_ids]
          found = {str(t.get('task_id')) for t in removed}
          assert found == target_ids, {'expected': sorted(target_ids), 'found': sorted(found)}
          raw['tasks']['vopc5750'] = kept
          fabric.save(raw)

          safe = lambda t: {
              'task_id': t.get('task_id'),
              'action': t.get('action'),
              'queued_at': t.get('queued_at'),
          }
          result = {
              'ok': True,
              'node_id': 'vopc5750',
              'removed': [safe(t) for t in removed],
              'remaining_count': len(kept),
              'remaining': [safe(t) for t in kept[-20:]],
          }
          out = Path('/tmp/meta-desktop')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'quarantine-result.json').write_text(json.dumps(result, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload quarantine evidence
        uses: actions/upload-artifact@v4
        with:
          name: meta-desktop-stale-task-quarantine
          path: /tmp/meta-desktop
          if-no-files-found: error
          retention-days: 1
