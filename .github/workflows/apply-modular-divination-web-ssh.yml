name: Apply Modular Divination Web SSH

on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths:
      - ".github/workflows/apply-modular-divination-web-ssh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST_SOURCE: ${{ secrets.AGENTOS_DEPLOY_HOST || secrets.N8N_BASE_URL || 'https://n8n.milkcat.org' }}
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - name: Resolve Oracle target
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST_SOURCE#*://}"
          DEPLOY_HOST="${DEPLOY_HOST%%/*}"
          DEPLOY_HOST="${DEPLOY_HOST%%:*}"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}

      - name: Patch and validate feature branch on Oracle
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          REPO=/home/ubuntu/agentmanager/workspace/leopardcat-tarot
          WORK=/tmp/leopardcat-divination-web-ssh
          BRANCH=feature/modular-divination-master
          test -d "$REPO/.git"
          git -C "$REPO" fetch origin "$BRANCH" --quiet
          rm -rf "$WORK"
          git -C "$REPO" worktree add -B "$BRANCH" "$WORK" "origin/$BRANCH" >/dev/null
          trap 'git -C "$REPO" worktree remove --force "$WORK" >/dev/null 2>&1 || true' EXIT
          cd "$WORK"
          python3 tools/patch_modular_web.py
          python3 -m unittest -v tests/test_divination_engine.py
          python3 -m py_compile website/fortune_server.py website/divination/*.py
          node --check website/main.js
          git add website/fortune_server.py website/main.js tools/patch_modular_web.py
          if git diff --cached --quiet; then
            echo no_changes=true
          else
            git -c user.name='AgentOS' -c user.email='agentos@localhost' commit -m 'feat(divination): connect web UI to modular reading API'
            git push origin "HEAD:$BRANCH" --quiet
          fi
          echo oracle_web_patch=passed
          REMOTE
