name: Oracle Reset Import Canonical Vendor Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-reset-import-canonical-vendor-evidence.yml'
      - 'scripts/reconcile_vendor_canonical_evidence.py'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 10
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Reconcile canonical 33-reply evidence set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentos/evidence
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            python3 - < scripts/reconcile_vendor_canonical_evidence.py \
            > .agentos/evidence/vendor-canonical-evidence-reconcile.json
          python3 -m json.tool .agentos/evidence/vendor-canonical-evidence-reconcile.json >/dev/null
          cat .agentos/evidence/vendor-canonical-evidence-reconcile.json
      - name: Commit sanitized reconciliation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .agentos/evidence/vendor-canonical-evidence-reconcile.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentos/evidence/vendor-canonical-evidence-reconcile.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(vendors): canonical 33-reply reconciliation'
          git push
