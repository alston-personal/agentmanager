name: LeopardCat Governed Share Render Timeout Deploy

on:
  workflow_dispatch:
  push:
    branches: [chore/leopardcat-runtime-inspect]
    paths:
      - '.github/workflows/leopardcat-production-deploy-share-render-timeout.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 15
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start governed SSH identity
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Deploy mobile share render timeout fix
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER:-}"
          ssh -o StrictHostKeyChecking=accept-new -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          ROOT=/home/ubuntu/leopardcat-tarot
          WEB="$ROOT/website"
          OLD=dd8390ae5d6d7fc7f140540fd09d6a845024e582
          TARGET=4c57564fc4544016115237fd6dd36d7ed866735a

          echo '=== preflight ==='
          test -d "$ROOT/.git"
          test "$(git -C "$ROOT" branch --show-current)" = main
          HEAD=$(git -C "$ROOT" rev-parse HEAD)
          echo "head_before=$HEAD"
          test "$HEAD" = "$OLD" -o "$HEAD" = "$TARGET"
          mapfile -t DIRTY < <(git -C "$ROOT" status --porcelain | sed -E 's/^.. //')
          for f in "${DIRTY[@]:-}"; do
            test -z "$f" && continue
            case "$f" in
              website/dist/index.html|website/stats.json|website/node_modules/.vite/*) ;;
              *) echo "unexpected_dirty=$f"; exit 20 ;;
            esac
          done
          rm -rf "$WEB/node_modules/.vite"
          BACKUP=/tmp/leopardcat-stats-share-timeout-${GITHUB_RUN_ID:-manual}.json
          cp "$WEB/stats.json" "$BACKUP"
          git -C "$ROOT" checkout -- website/dist/index.html

          echo '=== sync source ==='
          git -C "$ROOT" fetch origin main
          test "$(git -C "$ROOT" rev-parse origin/main)" = "$TARGET"
          if [ "$HEAD" = "$OLD" ]; then git -C "$ROOT" merge --ff-only origin/main; fi
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET"
          cp "$BACKUP" "$WEB/stats.json"
          echo "head_after=$(git -C "$ROOT" rev-parse HEAD)"

          echo '=== verify source invariants ==='
          grep -q 'function shareRenderBudgetMs()' "$WEB/main.js"
          grep -q 'mobileSafari ? 60000 : 35000' "$WEB/main.js"
          grep -q 'renderShareCanvas(template' "$WEB/main.js"
          grep -q "}, 'square');" "$WEB/main.js"
          grep -q "}, 'og');" "$WEB/main.js"
          ! grep -q "reject(new Error('TIMEOUT')), 20000" "$WEB/main.js"
          node --check "$WEB/main.js"

          echo '=== build production frontend ==='
          cd "$WEB"
          npm ci
          npm run build
          JS_ASSET=$(sed -nE 's#.*src="(/assets/index-[^"]+\.js)".*#\1#p' dist/index.html | head -1)
          CSS_ASSET=$(sed -nE 's#.*href="(/assets/index-[^"]+\.css)".*#\1#p' dist/index.html | head -1)
          test -n "$JS_ASSET"; test -n "$CSS_ASSET"
          test -f "dist$JS_ASSET"; test -f "dist$CSS_ASSET"
          LOCAL_JS_SHA=$(sha256sum "dist$JS_ASSET" | awk '{print $1}')
          LOCAL_CSS_SHA=$(sha256sum "dist$CSS_ASSET" | awk '{print $1}')

          echo '=== restart service ==='
          systemctl --user stop leopardcat-tarot.service || true
          for pid in $(pgrep -f '/usr/bin/python3 fortune_server.py' || true); do
            cwd=$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)
            cmd=$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)
            if [ "$cwd" = "$WEB" ] && [ "$cmd" = '/usr/bin/python3 fortune_server.py ' ]; then kill "$pid" || true; fi
          done
          for i in $(seq 1 20); do ! ss -ltnp 2>/dev/null | grep -q ':8088' && break; sleep 1; done
          systemctl --user start leopardcat-tarot.service
          for i in $(seq 1 30); do
            if systemctl --user is-active --quiet leopardcat-tarot.service && curl -fsS --max-time 2 http://127.0.0.1:8088/ >/dev/null; then break; fi
            sleep 1
          done
          systemctl --user is-active --quiet leopardcat-tarot.service

          echo '=== verify local served assets ==='
          LOCAL_HTML=$(mktemp)
          curl -fsS --max-time 10 http://127.0.0.1:8088/ -o "$LOCAL_HTML"
          SERVED_JS=$(sed -nE 's#.*src="(/assets/index-[^"]+\.js)".*#\1#p' "$LOCAL_HTML" | head -1)
          SERVED_CSS=$(sed -nE 's#.*href="(/assets/index-[^"]+\.css)".*#\1#p' "$LOCAL_HTML" | head -1)
          test "$SERVED_JS" = "$JS_ASSET"
          test "$SERVED_CSS" = "$CSS_ASSET"
          curl -fsS --max-time 10 "http://127.0.0.1:8088$SERVED_JS" -o /tmp/leopardcat-local-share-timeout.js
          curl -fsS --max-time 10 "http://127.0.0.1:8088$SERVED_CSS" -o /tmp/leopardcat-local-share-timeout.css
          test "$(sha256sum /tmp/leopardcat-local-share-timeout.js | awk '{print $1}')" = "$LOCAL_JS_SHA"
          test "$(sha256sum /tmp/leopardcat-local-share-timeout.css | awk '{print $1}')" = "$LOCAL_CSS_SHA"

          echo '=== public verification ==='
          PUBLIC_HTML=$(mktemp)
          curl -fsS --max-time 10 'https://leopardcat-tarot.milkcat.org/?deploycheck=share-render-timeout' -o "$PUBLIC_HTML"
          PUBLIC_JS=$(sed -nE 's#.*src="(/assets/index-[^"]+\.js)".*#\1#p' "$PUBLIC_HTML" | head -1)
          PUBLIC_CSS=$(sed -nE 's#.*href="(/assets/index-[^"]+\.css)".*#\1#p' "$PUBLIC_HTML" | head -1)
          test "$PUBLIC_JS" = "$JS_ASSET"
          test "$PUBLIC_CSS" = "$CSS_ASSET"
          curl -fsS --max-time 10 "https://leopardcat-tarot.milkcat.org$PUBLIC_JS" -o /tmp/leopardcat-public-share-timeout.js
          curl -fsS --max-time 10 "https://leopardcat-tarot.milkcat.org$PUBLIC_CSS" -o /tmp/leopardcat-public-share-timeout.css
          test "$(sha256sum /tmp/leopardcat-public-share-timeout.js | awk '{print $1}')" = "$LOCAL_JS_SHA"
          test "$(sha256sum /tmp/leopardcat-public-share-timeout.css | awk '{print $1}')" = "$LOCAL_CSS_SHA"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 https://leopardcat-tarot.milkcat.org/)
          echo "public_http=$code"; test "$code" = 200
          echo "public_js=$PUBLIC_JS"
          echo "public_css=$PUBLIC_CSS"
          echo "service_pid=$(systemctl --user show -p MainPID --value leopardcat-tarot.service)"
          echo 'leopardcat_share_render_timeout_deploy=PASS'
          REMOTE
