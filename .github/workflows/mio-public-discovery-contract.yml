name: Mio Public Discovery Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/persona_public_discovery_contract.py'
      - 'scripts/persona_social_discovery_triage.py'
      - 'scripts/persona_threads_keyword_probe.py'
      - 'tests/test_persona_public_discovery_contract.py'
      - 'tests/test_persona_social_discovery_triage.py'
      - 'tests/test_persona_threads_keyword_probe.py'
      - '.github/workflows/mio-public-discovery-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/persona_public_discovery_contract.py'
      - 'tests/test_persona_public_discovery_contract.py'
      - '.github/workflows/mio-public-discovery-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate bounded no-write public discovery projection
        run: python3 -m unittest tests.test_persona_public_discovery_contract tests.test_persona_threads_keyword_probe tests.test_persona_social_discovery_triage -v
