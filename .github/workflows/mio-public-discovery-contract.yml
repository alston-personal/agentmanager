name: Mio Public Discovery Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/persona_public_discovery_contract.py'
      - 'scripts/persona_for_you_observation.py'
      - 'scripts/persona_gui_identity_gate.py'
      - 'scripts/persona_gui_live_home_diagnostic.py'
      - 'scripts/probe_threads_web_dm_login_user.sh'
      - 'tests/test_mio_legacy_identity_recovery.py'
      - 'tests/test_mio_9224_tab_classification_workflow.py'
      - '.github/workflows/mio-gui-live-home-diagnostic.yml'
      - 'tests/test_persona_gui_live_home_diagnostic.py'
      - 'tests/test_persona_gui_identity_gate.py'
      - 'scripts/persona_vendor_public_source.py'
      - '.github/workflows/mio-vendor-reader-oracle-acceptance.yml'
      - '.github/workflows/mio-vendor-readonly-observation.yml'
      - 'scripts/persona_social_discovery_triage.py'
      - 'scripts/persona_keyword_social_runtime_bridge.py'
      - 'scripts/persona_keyword_node_diagnostic.py'
      - 'scripts/persona_keyword_scope_check.py'
      - 'scripts/persona_threads_keyword_probe.py'
      - 'tests/test_persona_public_discovery_contract.py'
      - 'tests/test_persona_for_you_observation.py'
      - 'tests/test_persona_vendor_public_source.py'
      - 'tests/test_persona_social_discovery_triage.py'
      - 'tests/test_persona_keyword_social_runtime_bridge.py'
      - 'tests/test_persona_keyword_node_diagnostic.py'
      - 'tests/test_persona_keyword_scope_check.py'
      - 'tests/test_persona_threads_keyword_probe.py'
      - '.github/workflows/mio-public-discovery-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/persona_public_discovery_contract.py'
      - 'tests/test_persona_public_discovery_contract.py'
      - '.github/workflows/mio-public-discovery-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate bounded no-write public discovery projection
        run: python3 -m unittest tests.test_persona_public_discovery_contract tests.test_persona_threads_keyword_probe tests.test_persona_social_discovery_triage tests.test_persona_keyword_social_runtime_bridge tests.test_persona_keyword_node_diagnostic tests.test_persona_keyword_scope_check tests.test_persona_for_you_observation tests.test_persona_gui_identity_gate tests.test_persona_gui_live_home_diagnostic tests.test_mio_legacy_identity_recovery tests.test_mio_9224_tab_classification_workflow tests.test_persona_vendor_public_source -v
      - name: Compile Oracle Vendor Reader embedded Python before merge
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          import textwrap
          source=Path(".github/workflows/mio-vendor-reader-oracle-acceptance.yml").read_text()
          start=source.index("          import json, urllib.request, urllib.error")
          end=source.index("          PY\n",start)
          embedded=textwrap.dedent(source[start:end])
          ast.parse(embedded,filename="mio-vendor-reader-oracle-acceptance[embedded].py")
          print("oracle_vendor_reader_embedded_python=PASS")
          PY
      - name: Compile scheduled observation embedded Python
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          import textwrap
          source=Path(".github/workflows/mio-vendor-readonly-observation.yml").read_text()
          start=source.index("          import base64, hashlib, json, os, pathlib, re, tempfile, urllib.request, urllib.error")
          end=source.index("          PY\n",start)
          ast.parse(textwrap.dedent(source[start:end]),filename="mio-vendor-readonly-observation[embedded].py")
          print("mio_observation_embedded_python=PASS")
          PY
