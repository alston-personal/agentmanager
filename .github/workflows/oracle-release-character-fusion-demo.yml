name: Oracle Release Character Fusion Demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-release-character-fusion-demo.yml'
      - '.github/workflows/reusable-studio-static-route-release.yml'

permissions:
  contents: read

concurrency:
  group: character-fusion-demo-production
  cancel-in-progress: true

jobs:
  release:
    uses: ./.github/workflows/reusable-studio-static-route-release.yml
    with:
      source_sha: eb276d849ab9158845eca370b3581bc3a0dd809e
      route: drop
      backup_key: character-fusion-demo
      receipt_schema: studio-web.character-fusion-demo-release/v1
      acceptance_anchors: |-
        CHARACTER IR FUSION · DEMO
        生成我的角色
        /dashboard/api/character-fusion/v1
        Target Character IR
      credit_account: ''
      credit_cost: 0
    secrets:
      AGENTOS_DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER }}
      AGENTOS_DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT }}
      AGENTOS_DEPLOY_SSH_KEY: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY }}
      N8N_DEPLOY_USER: ${{ secrets.N8N_DEPLOY_USER }}
      N8N_DEPLOY_SSH_PORT: ${{ secrets.N8N_DEPLOY_SSH_PORT }}
      N8N_DEPLOY_SSH_KEY: ${{ secrets.N8N_DEPLOY_SSH_KEY }}
