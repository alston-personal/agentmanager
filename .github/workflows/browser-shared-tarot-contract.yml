name: Browser Shared Tarot Contract
on:
  push:
    branches: [feature/distributed-agentos-runtime]
    paths: ['.github/workflows/browser-shared-tarot-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser contract
        shell: bash
        run: |
          cat > shared-contract.mjs <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const base = 'https://leopardcat-tarot.milkcat.org/';
          const api = await fetch(base + 'api/v1/decks/test-2cfe3b');
          assert.equal(api.status, 200);
          const deck = await api.json();
          assert.equal(deck.cards.length, 5);
          assert.equal(deck.default_persona, 'master');
          const first = deck.cards[0];

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          await page.goto(base + '?deck=test-2cfe3b&theme=minimal-light', {waitUntil:'networkidle'});
          await page.waitForFunction(() => window.activeDeckId === 'test-2cfe3b' && Array.isArray(window.cardData) && window.cardData.length === 5 && window.activeBrand?.brand_id === 'deck:test-2cfe3b' && window.activePersonaId === 'master');
          assert.equal(await page.locator('.custom-deck-gallery .card-wrapper').count(), 5);
          assert.equal(await page.evaluate(() => window.activeDeckId), 'test-2cfe3b');
          assert.equal(await page.evaluate(() => window.activeThemeId), 'minimal-light');
          assert.equal(await page.evaluate(() => window.defaultPersonaId), 'master');
          assert.equal(await page.locator('#persona-switcher-select').inputValue(), 'master');

          const branding = await page.evaluate(() => ({
            brand: window.activeBrand,
            title: document.title,
            nav: document.querySelector('.nav-logo')?.textContent || '',
            hero: document.querySelector('#hero h1')?.textContent || '',
            subtitle: document.querySelector('#hero .subtitle')?.textContent || '',
            fortune: document.querySelector('#fortune .section-title h2')?.textContent || '',
            shareMemo: document.getElementById('share-memo-title')?.textContent || '',
            shareTag: document.getElementById('share-site-tag')?.textContent || ''
          }));
          assert.equal(branding.brand.app_name, 'TEST');
          assert.match(branding.title, /TEST/);
          assert.match(branding.nav, /TEST/);
          assert.match(branding.hero, /TEST/);
          assert.match(branding.fortune, /TEST/);
          assert.match(branding.shareMemo, /TEST/);
          assert.match(branding.shareTag, /AAA/);
          const brandingText = JSON.stringify(branding);
          assert.doesNotMatch(brandingText, /石虎/);
          assert.doesNotMatch(brandingText, /LeopardCat/);

          await page.locator('#persona-switcher-select').selectOption('leopardcat');
          await page.waitForFunction(() => window.activePersonaId === 'leopardcat' && new URL(location.href).searchParams.get('persona') === 'leopardcat');
          assert.equal(await page.evaluate(() => window.activePersonaId), 'leopardcat');
          assert.match(page.url(), /persona=leopardcat/);

          let capturedRequest = null;
          await page.route('**/api/v1/readings', async route => {
            capturedRequest = JSON.parse(route.request().postData() || '{}');
            await route.fulfill({status:200, contentType:'application/json', body: JSON.stringify({
              reading_id:'rd_browser_contract', session_token:'browser-contract-token',
              method:'tarot', persona:'leopardcat',
              method_result:{spread:'single', cards:[{card_id:first.id, orientation:'reversed', position:'focus', position_label:'核心'}]},
              reading:'測試解讀'
            })});
          });

          await page.evaluate(() => window.getModularReading('browser contract'));
          assert.equal(capturedRequest.persona, 'leopardcat');
          assert.equal(capturedRequest.input.deck_id, 'test-2cfe3b');
          const state = await page.evaluate(() => window.currentReadingState);
          assert.equal(state.deck_id, 'test-2cfe3b');
          assert.equal(state.theme_id, 'minimal-light');
          assert.equal(state.persona_id, 'leopardcat');
          assert.equal(state.card_id, first.id);
          assert.equal(state.orientation, 'reversed');

          await page.evaluate(() => {
            Object.defineProperty(navigator, 'clipboard', {configurable:true, value:{write:async()=>{}, writeText:async()=>{}}});
            window.ClipboardItem = class { constructor(v){ this.v=v; } };
            window.html2canvas = async () => ({toBlob: cb => cb(new Blob(['x'], {type:'image/png'}))});
          });
          await page.evaluate(() => window.generateShareImage());
          const share = await page.evaluate(() => ({
            transform: document.getElementById('share-card-img')?.style.transform || '',
            title: document.getElementById('share-card-title')?.innerText || '',
            memo: document.getElementById('share-memo-title')?.innerText || '',
            tag: document.getElementById('share-site-tag')?.innerText || '',
            src: document.getElementById('share-card-img')?.getAttribute('src') || '',
            url: window.shareUrl || '',
            text: window.lastShareText || ''
          }));
          assert.match(share.transform, /180deg/);
          assert.match(share.title, /逆位|Reversed/);
          assert.match(share.memo, /TEST/);
          assert.match(share.tag, /AAA/);
          assert.equal(share.src, first.image);
          assert.match(share.url, /deck=test-2cfe3b/);
          assert.match(share.url, /theme=minimal-light/);
          assert.match(share.url, /persona=leopardcat/);
          assert.match(share.url, /orientation=reversed/);
          assert.match(share.url, new RegExp('card=' + encodeURIComponent(first.id)));
          assert.doesNotMatch(JSON.stringify(share), /石虎|LeopardCat/);

          const ogResp = await fetch(base + '?deck=test-2cfe3b&card=' + encodeURIComponent(first.id));
          assert.equal(ogResp.status, 200);
          const ogHtml = await ogResp.text();
          assert.match(ogHtml, /<meta property="og:title" content="[^"]*TEST/);
          assert.ok(ogHtml.includes(first.image));
          assert.doesNotMatch(ogHtml, /我在石虎塔羅抽到了/);

          const leopard = await browser.newPage();
          await leopard.goto(base, {waitUntil:'networkidle'});
          await leopard.waitForFunction(() => window.activeDeckId === 'leopardcat' && window.activeThemeId === 'leopardcat' && window.activeBrand?.brand_id === 'leopardcat' && window.activePersonaId === 'leopardcat');
          assert.equal(await leopard.evaluate(() => window.activeDeckId), 'leopardcat');
          assert.equal(await leopard.evaluate(() => window.activeThemeId), 'leopardcat');
          assert.equal(await leopard.evaluate(() => window.activeBrand.brand_id), 'leopardcat');
          assert.equal(await leopard.evaluate(() => window.defaultPersonaId), 'leopardcat');
          assert.equal(await leopard.locator('#persona-switcher-select').inputValue(), 'leopardcat');

          console.log('browser_custom_gallery=passed');
          console.log('browser_custom_brand_pack=passed');
          console.log('browser_custom_brand_no_leak=passed');
          console.log('browser_custom_persona_default=passed');
          console.log('browser_persona_switcher=passed');
          console.log('browser_persona_request=passed');
          console.log('browser_persona_reading_state=passed');
          console.log('browser_persona_deep_link=passed');
          console.log('browser_reversed_reading_state=passed');
          console.log('browser_reversed_share_card=passed');
          console.log('browser_custom_og_brand=passed');
          console.log('browser_leopardcat_defaults=passed');
          await browser.close();
          NODE
          node shared-contract.mjs