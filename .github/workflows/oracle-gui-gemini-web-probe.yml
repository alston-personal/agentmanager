name: Oracle GUI Gemini Web Probe

on:
  push:
    branches:
      - core/integration
    paths:
      - '.agentos/commands/oracle-gui-gemini-web-probe.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: 161.33.24.170
      DEPLOY_USER: ${{ secrets.AGENTOS_DEPLOY_USER || secrets.N8N_DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.AGENTOS_DEPLOY_SSH_PORT || secrets.N8N_DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTOS_DEPLOY_SSH_KEY || secrets.N8N_DEPLOY_SSH_KEY }}
      - name: Probe Gemini Web through AgentOS GUI capability lane
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID="oracle-gemini-web-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RECEIPT="$RUNNER_TEMP/gemini-web-probe.json"
          AGENTOS_RECEIPT_TIMEOUT_SECONDS=180 \
            bash scripts/submit_oracle_bootstrap_request_remote.sh \
              agentos.gemini_web.probe "$REQUEST_ID" "$GITHUB_SHA" '{}' > "$RECEIPT"

          python3 - "$RECEIPT" "$GITHUB_SHA" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          expected=sys.argv[2]
          assert r.get('schema')=='agentos.bootstrap-receipt/v1',r
          assert r.get('action')=='agentos.gemini_web.probe',r
          assert r.get('source_commit')==expected,r
          assert r.get('ok') is True,r
          scheduler=r.get('scheduler') or {}
          assert scheduler.get('worker_role')=='gui',scheduler
          assert scheduler.get('worker_id')=='oracle-gui',scheduler
          assert 'gemini.web.session' in set(scheduler.get('requested_capabilities') or []),scheduler
          text='\n'.join(str(s.get('stdout') or '')+'\n'+str(s.get('stderr') or '') for s in r.get('steps',[]))
          assert 'gemini_web_probe=PASS' in text,text[-12000:]
          states=[line for line in text.splitlines() if line.startswith('gemini_web_session_state=')]
          assert states,text[-12000:]
          state=states[-1].split('=',1)[1].strip()
          assert state in {'READY','LOGIN_REQUIRED','GEMINI_REACHED_NO_COMPOSER'},state
          print('gemini_web_probe_receipt=PASS')
          print('gemini_web_scheduler_lane=oracle-gui')
          print(states[-1])
          PY
