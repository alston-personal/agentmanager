<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Blueprint POC</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#171717;background:#f6f6f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1500px;margin:auto;padding:18px}.top{display:flex;gap:12px;justify-content:space-between;align-items:end;margin-bottom:12px}.sub{font-size:13px;color:#666}.grid{display:grid;grid-template-columns:1fr 1fr 360px;gap:12px}.panel{background:white;border:1px solid #ddd;border-radius:14px;padding:12px;min-width:0}.stage{position:relative;min-height:520px;background:#fafafa;border:1px solid #e5e5e5;border-radius:10px;overflow:hidden;display:grid;place-items:center}.stage canvas{max-width:100%;max-height:70vh}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}input,button{font:inherit}button{border:1px solid #171717;background:#171717;color:white;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.badge{font-size:12px;border:1px solid #bbb;border-radius:999px;padding:6px 9px;background:white}.status{font-size:12px;line-height:1.5;color:#555;margin-top:8px}.json{white-space:pre-wrap;word-break:break-word;background:#111;color:#eee;border-radius:10px;padding:10px;max-height:650px;overflow:auto;font:11px/1.45 ui-monospace,monospace}.legend{font-size:11px;color:#666;line-height:1.5}.good{color:#176b34}.warn{color:#9a5700}@media(max-width:1100px){.grid{grid-template-columns:1fr 1fr}.side{grid-column:1/-1}}@media(max-width:760px){.grid{grid-template-columns:1fr}.stage{min-height:360px}.top{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1 style="margin:0">Character Blueprint POC</h1><div class="sub">人物圖 → Pose evidence → Character IR → 3D mannequin；瀏覽器本機推論，LLM token = 0</div></div><div class="badge">POC v0.1</div></div>
  <div class="controls"><input id="file" type="file" accept="image/*"><button id="analyze" disabled>分析人物</button><button id="reset" type="button">清除</button></div>
  <div class="grid">
    <section class="panel"><strong>2D Evidence</strong><div class="stage"><canvas id="src"></canvas></div><div class="legend">綠線：pose skeleton；圓點：observed landmark。這一層只畫模型實際看見的證據。</div></section>
    <section class="panel"><strong>3D Description Preview</strong><div class="stage"><canvas id="model"></canvas></div><div class="legend">不是生成 mesh，而是把 Character IR 投影成簡單 mannequin，用來驗證比例、姿勢與深度假設。</div></section>
    <aside class="panel side"><strong>Character IR</strong><div id="status" class="status">請載入單一全身或大半身人物圖。</div><pre id="json" class="json">尚未分析</pre></aside>
  </div>
</div>
<script type="module">
const $=id=>document.getElementById(id),file=$('file'),analyzeBtn=$('analyze'),resetBtn=$('reset'),src=$('src'),sctx=src.getContext('2d'),model=$('model'),mctx=model.getContext('2d'),status=$('status'),json=$('json');
let bitmap=null,landmarker=null,lastResult=null;
const EDGES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[27,31],[24,26],[26,28],[28,32]];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);
function pt(lm,i){const p=lm[i];return{x:p.x,y:p.y,z:p.z,visibility:p.visibility??1}}
function avg(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,z:(a.z+b.z)/2}}
function safeRatio(a,b){return b>1e-6?+(a/b).toFixed(4):null}
async function ensureModel(){
 if(landmarker)return landmarker;
 status.textContent='載入本機姿勢模型…第一次會下載模型權重，但不使用 LLM/API token。';
 const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');
 const fileset=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');
 landmarker=await vision.PoseLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'IMAGE',numPoses:1,minPoseDetectionConfidence:.45,minPosePresenceConfidence:.45,minTrackingConfidence:.45,outputSegmentationMasks:false});
 return landmarker;
}
function fitCanvas(canvas,w,h,max=760){const s=Math.min(1,max/Math.max(w,h));canvas.width=Math.max(1,Math.round(w*s));canvas.height=Math.max(1,Math.round(h*s));return s}
function drawSource(lm){
 const scale=fitCanvas(src,bitmap.width,bitmap.height);sctx.clearRect(0,0,src.width,src.height);sctx.drawImage(bitmap,0,0,src.width,src.height);
 if(!lm)return;
 sctx.lineWidth=Math.max(2,src.width/320);sctx.strokeStyle='rgba(0,145,80,.95)';sctx.fillStyle='rgba(0,145,80,.95)';
 for(const [a,b] of EDGES){const p=lm[a],q=lm[b];if(!p||!q||(p.visibility??1)<.25||(q.visibility??1)<.25)continue;sctx.beginPath();sctx.moveTo(p.x*src.width,p.y*src.height);sctx.lineTo(q.x*src.width,q.y*src.height);sctx.stroke()}
 for(const p of lm){if((p.visibility??1)<.35)continue;sctx.beginPath();sctx.arc(p.x*src.width,p.y*src.height,Math.max(2,src.width/180),0,Math.PI*2);sctx.fill()}
}
function inferIR(lm,world){
 const use=world?.length===lm.length?world:lm;
 const L=i=>pt(use,i),I=i=>pt(lm,i);
 const ls=L(11),rs=L(12),lh=L(23),rh=L(24),la=L(15),ra=L(16),lf=L(31),rf=L(32);
 const shoulderMid=avg(ls,rs),hipMid=avg(lh,rh);
 const shoulderWidth=d(ls,rs),hipWidth=d(lh,rh),torso=d(shoulderMid,hipMid),heightProxy=d(avg(L(7),L(8)),avg(lf,rf));
 const visibility=[11,12,13,14,15,16,23,24,25,26,27,28,31,32].map(i=>I(i).visibility??1);const poseConfidence=visibility.reduce((a,b)=>a+b,0)/visibility.length;
 const depthSpread=Math.max(...use.map(p=>p.z))-Math.min(...use.map(p=>p.z));
 const observedLandmarks={};for(const i of [0,7,8,11,12,13,14,15,16,23,24,25,26,27,28,31,32]){const p=I(i);observedLandmarks[i]={x:+p.x.toFixed(5),y:+p.y.toFixed(5),z:+p.z.toFixed(5),visibility:+p.visibility.toFixed(3)}}
 return {
   schema:'character-blueprint-ir/v0.1',
   source:{kind:'single_image',width_px:bitmap.width,height_px:bitmap.height},
   inference:{engine:'mediapipe-pose-landmarker-lite',execution:'browser-local',llm_tokens:0},
   observed:{body_landmarks:observedLandmarks,visible_body_confidence:+poseConfidence.toFixed(3),silhouette:{status:'not_yet_segmented',confidence:0},hair_regions:{status:'unresolved'},garment_regions:{status:'unresolved'},accessories:{status:'unresolved'}},
   inferred:{skeleton:{joint_count:Object.keys(observedLandmarks).length,edge_count:EDGES.length},body_proportions:{shoulder_to_hip:safeRatio(shoulderWidth,hipWidth),torso_to_height_proxy:safeRatio(torso,heightProxy),hip_to_height_proxy:safeRatio(hipWidth,heightProxy)},pose:{left_wrist_depth:+la.z.toFixed(4),right_wrist_depth:+ra.z.toFixed(4),depth_spread:+depthSpread.toFixed(4)},camera:{projection:'perspective_or_weak_perspective',confidence:.35}},
   assumed:{unseen_back_geometry:{status:'unknown',rule:'none'},body_depth:{status:'coarse_from_pose_z',confidence:.35},symmetry:{status:'not_forced'}},
   confidence:{pose:+poseConfidence.toFixed(3),overall:+(poseConfidence*.72).toFixed(3)},
   evidence_policy:{observed:'direct image/model evidence',inferred:'derived from observed geometry',assumed:'required for 3D but not directly observable'}
 };
}
function draw3D(lm,world){
 model.width=620;model.height=620;mctx.clearRect(0,0,model.width,model.height);mctx.fillStyle='#fafafa';mctx.fillRect(0,0,model.width,model.height);
 const use=world?.length===lm.length?world:lm;let xs=use.map(p=>p.x),ys=use.map(p=>p.y),zs=use.map(p=>p.z);const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),minZ=Math.min(...zs),maxZ=Math.max(...zs);const span=Math.max(maxX-minX,maxY-minY,.001);const cx=(minX+maxX)/2,cy=(minY+maxY)/2,cz=(minZ+maxZ)/2;
 const proj=p=>{const x=(p.x-cx)/span,y=(p.y-cy)/span,z=(p.z-cz)/span;const yaw=-.45,pitch=.28;const x1=x*Math.cos(yaw)-z*Math.sin(yaw),z1=x*Math.sin(yaw)+z*Math.cos(yaw),y1=y*Math.cos(pitch)-z1*Math.sin(pitch);return{x:model.width/2+x1*420,y:model.height/2+y1*420,z:z1}};
 mctx.lineCap='round';mctx.strokeStyle='rgba(55,70,90,.9)';mctx.lineWidth=8;
 for(const [a,b] of EDGES){const p=proj(use[a]),q=proj(use[b]);mctx.beginPath();mctx.moveTo(p.x,p.y);mctx.lineTo(q.x,q.y);mctx.stroke()}
 for(const i of [11,12,13,14,15,16,23,24,25,26,27,28,31,32]){const p=proj(use[i]);mctx.fillStyle='rgba(20,120,170,.95)';mctx.beginPath();mctx.arc(p.x,p.y,8,0,Math.PI*2);mctx.fill()}
 const head=proj(use[0]);mctx.fillStyle='rgba(100,100,100,.16)';mctx.strokeStyle='rgba(60,60,60,.7)';mctx.lineWidth=3;mctx.beginPath();mctx.arc(head.x,head.y,32,0,Math.PI*2);mctx.fill();mctx.stroke();
}
async function run(){
 if(!bitmap)return;analyzeBtn.disabled=true;
 try{const lmkr=await ensureModel();status.textContent='分析中…';const result=lmkr.detect(bitmap);lastResult=result;if(!result.landmarks?.length){drawSource(null);json.textContent='未偵測到單一人物';status.innerHTML='<span class="warn">未偵測到人物；請改用全身或大半身、遮擋較少的圖。</span>';return}
 const lm=result.landmarks[0],world=result.worldLandmarks?.[0]||null;drawSource(lm);draw3D(lm,world);const ir=inferIR(lm,world);json.textContent=JSON.stringify(ir,null,2);status.innerHTML=`<span class="good">完成：Pose ${(ir.confidence.pose*100).toFixed(0)}%</span> · LLM token ${ir.inference.llm_tokens} · hair/clothing 尚標為 unresolved，沒有假裝已理解。`;
 }catch(err){console.error(err);status.innerHTML=`<span class="warn">POC 執行失敗：${String(err.message||err)}</span>`}finally{analyzeBtn.disabled=!bitmap}
}
file.addEventListener('change',async()=>{const f=file.files?.[0];if(!f)return;bitmap=await createImageBitmap(f);drawSource(null);model.width=620;model.height=620;mctx.clearRect(0,0,model.width,model.height);analyzeBtn.disabled=false;status.textContent=`已載入 ${bitmap.width}×${bitmap.height}，可開始分析。`;json.textContent='尚未分析'});
analyzeBtn.addEventListener('click',run);
resetBtn.addEventListener('click',()=>{bitmap=null;lastResult=null;file.value='';src.width=src.height=model.width=model.height=1;status.textContent='請載入單一全身或大半身人物圖。';json.textContent='尚未分析';analyzeBtn.disabled=true});
</script>
</body>
</html>
