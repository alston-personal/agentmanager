[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-runtime"
version = "0.3.0"
description = "Portable AgentOS Runtime Core, Distributed Node Client, and IDE Adapter"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AgentOS Core Team", email = "agentos@milkcat.org"}
]
keywords = ["agentos", "runtime", "node", "ancp", "ai-agent", "ide"]
dependencies = [
    "pyyaml>=6.0"
]

[project.scripts]
agentos = "agentos_node.ide_cli:main"
agentos-node = "agentos_node.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime_core*", "agentos_node*"]
