[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-runtime"
version = "0.3.0"
description = "Portable AgentOS Realm Core and Distributed Thin Client Runtime"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AgentOS Core Team", email = "agentos@milkcat.org"}
]
keywords = ["agentos", "runtime", "node", "realm", "one", "ancp", "ai-agent"]
dependencies = [
    "pyyaml>=6.0"
]

[project.scripts]
agentos-node = "agentos_node.cli:main"
agentos-client = "agentos_node.client_cli:main"
agentos-desktop-executor = "agentos_node.desktop_executor_cli:main"
agentos-one = "agent_core.realm_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime_core*", "agentos_node*", "agent_core*"]
