# LayoutLib capability convergence gateway
# Include inside the studio.milkcat.org TLS server block.
#
# Browser uses ./api from /layout-lab/, therefore this public route maps
# /layout-lab/api/... to the capability gateway's root paths.
location /layout-lab/api/ {
    proxy_pass http://127.0.0.1:8767/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 512k;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
}
